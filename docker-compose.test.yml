# Override for spinning up the dev stack with test-only credentials from
# .env.test. The base docker-compose.yml hardcodes the production-facing
# KEYCLOAK_ISSUER_URI (https://keycloak.profit-base.online/realms/iri) into both
# x-backend and x-frontend templates; this file points everything at the
# locally-imported `iri` realm on the host-mapped Keycloak port 18080
# instead, using host.docker.internal so that the same URL works both
# inside containers and from the host browser on Docker Desktop.
#
# Usage:
#   docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml \
#       --profile dev up -d
#
# After Keycloak is healthy, browse to http://localhost:18081 and log in as
# test-admin / test-admin-pw (defined in realm-export.json).
#
# Prerequisites in the worktree (all gitignored):
#   .env.test                            — credentials (incl. IRI_KEYSTORE_HOST_PATH)
#   realm-export.json                    — Keycloak realm dump with test-admin user
#   ./keystore.p12                       — generated with the password from
#                                          .env.test (matching SAN: localhost,
#                                          backend, frontend). Bind-mounted via
#                                          IRI_KEYSTORE_HOST_PATH into the
#                                          containers at /run/secrets/keystore.p12.
#
# This file is intentionally not auto-loaded (no `.override.yml` name) — it
# has to be passed explicitly so the production-targeted `docker compose up`
# in other contexts is not affected.

services:
  keycloak-dev:
    environment:
      # Make Keycloak emit issuer URLs that resolve identically from inside
      # Docker (backend / frontend containers reach the host via
      # host.docker.internal) and from the host browser (Docker Desktop
      # resolves host.docker.internal to localhost). KC_HOSTNAME_STRICT=false
      # also tolerates plain http://localhost:18080 access during testing.
      KC_HOSTNAME: host.docker.internal
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_PORT: "18080"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB_USERNAME: ${KC_POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}

# ---------------------------------------------------------------------------
# Log destinations.
#
# The base compose bind-mounts the PRODUCTION host layout — /var/iri/<svc>/log — which does not
# exist on a developer machine and is not writable by the containers' unprivileged UID (10001).
# Logback then fails to open its appender, and because that happens during Spring Boot's logging
# initialisation it takes the whole start-up with it: the container restarts in a loop and the
# stack reports "backend-dev is unhealthy" with the actual cause buried under a stack trace about
# an appender.
#
# tmpfs instead, and NOT a named volume — which was the first fix and did not work. Docker populates
# a fresh named volume from the image's content at that path, ownership included, and the images ship
# /app/logs/backend.log and backend-error.log owned by root. The container then owns the directory
# but not the files inside it, so it can create new ones and cannot APPEND to those two, which is
# exactly what Logback does (openFile(..., append=true)). Production is unaffected because the host
# log directory is pre-chowned to uid 10001 and its files were written by the service itself.
#
# A tmpfs starts genuinely empty, copies nothing from the image and needs no chown. Logs in a test
# stack are throwaway anyway — nothing here ships them to Loki — and the mount disappears with the
# container, which suits a stack documented to end in `down --volumes`.
#
# `!override` and not a plain list: Compose MERGES volume lists across files, so an added entry
# would sit beside the production bind rather than replace it, and the broken mount would still be
# there. Each list therefore repeats the keystore mount the base declares.
# ---------------------------------------------------------------------------
  backend-dev:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Disable the notification Redis fan-out for the test/e2e stack. The base compose anchor
      # force-enables it (APP_NOTIFICATIONS_REDIS_FANOUT_ENABLED:-true) for every backend service, but
      # this is a single-instance stack: there is no peer replica to fan out to, so the fan-out is a
      # pure no-op here. Keeping it off avoids coupling the e2e boot to a healthy redis-dev for zero
      # test value; the enabled path is covered off the container by the dedicated fan-out tests (unit,
      # real-Redis integration, and config wiring). Since #1246 the backend resolves
      # spring.data.redis.host from REDIS_HOST in the base config (the anchor sets it to `redis`), so an
      # enabled fan-out here would connect to redis-dev rather than crash against localhost:6379 — but a
      # single-instance stack still has nothing to gain from it. Prod is unaffected (prod profile keeps
      # the fan-out on with host=redis).
      APP_NOTIFICATIONS_REDIS_FANOUT_ENABLED: "false"
      # Override the prod-target issuer URI baked into the base template.
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:18080/realms/iri
      # Admin-API calls stay on the internal Docker network — no need to go
      # via host.docker.internal for service-to-service traffic.
      KEYCLOAK_ADMIN_URL: http://keycloak:18080
      KEYCLOAK_REALM: iri
      KEYCLOAK_ADMIN_CLIENT_ID: backend-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    # Make host.docker.internal resolvable from inside the container on
    # platforms that don't ship the alias by default (Linux). On Docker
    # Desktop (Mac/Windows) the alias is already present; the extra_hosts
    # entry is a no-op there.
    volumes: !override
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-dev:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:18080/realms/iri
      # application-prod.yml hardcodes `spring.data.redis.host: redis`, but
      # application-dev.yml (activated by the SPRING_PROFILES_ACTIVE override
      # above) reads `${REDIS_HOST:localhost}` instead. Inside the container
      # stack `localhost:6379` is the JVM itself, not the redis-dev service,
      # so explicitly point the dev profile at the Docker network alias.
      REDIS_HOST: redis
      # application-dev.yml uses `backend.base-url: ${BACKEND_URL:http://localhost:11261}`;
      # the prod template already exports BACKEND_URL=https://backend:11261 so
      # this only needs to flip back to the in-container alias when the dev
      # profile activates inside Docker.
      BACKEND_URL: https://backend:11261
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes: !override
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro

  ingest-dev:
    # Present only for the log mount: the base binds the production host layout, which a developer
    # machine has neither. Every other setting the gateway needs is already right for this stack.
    volumes: !override
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
