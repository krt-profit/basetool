services:
  redis:
    <<: *redis-template
    profiles: ["prod"]
    container_name: redis
    command: redis-server --save "60 1" --appendonly yes --appendfsync everysec --maxmemory 768mb --maxmemory-policy noeviction --notify-keyspace-events Egx --loglevel notice --aclfile /etc/redis/users.acl
    volumes:
      - /var/iri/redis:/data
      - ${IRI_REDIS_ACL_HOST_PATH:-/var/iri/redis/users.acl}:/etc/redis/users.acl:ro
    networks:
      - net-redis-frontend
      - net-redis-ingest
      - net-redis-backend

  redis-dev:
    <<: *redis-template
    profiles: ["dev"]
    volumes:
      - redis-dev-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      net-redis-frontend:
        aliases:
          - redis
      net-redis-ingest:
        aliases:
          - redis
      net-redis-backend:
        aliases:
          - redis

  db-backend:
    <<: *db-backend-template
    profiles: ["prod"]
    container_name: db-backend
    networks:
      - net-db-backend

  db-backend-dev:
    <<: *db-backend-template
    profiles: ["dev"]
    volumes:
      - db-backend-dev-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:15432"
    networks:
      net-db-backend:
        aliases:
          - db-backend

  db-keycloak:
    <<: *db-keycloak-template
    profiles: ["prod"]
    container_name: db-keycloak
    networks:
      - net-db-keycloak

  db-keycloak-dev:
    <<: *db-keycloak-template
    profiles: ["dev"]
    volumes:
      - db-keycloak-dev-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15433:15433"
    networks:
      net-db-keycloak:
        aliases:
          - db-keycloak

  keycloak:
    <<: *keycloak-template
    profiles: ["prod"]
    container_name: keycloak
    command: >
      start
      --proxy-headers xforwarded
      --cache=local
      --http-enabled=false
      --https-port=18443
      --https-key-store-file=/run/secrets/keystore.p12
      --http-management-scheme=http
      --log=console,file
      --log-file=/var/log/keycloak/keycloak.log
    volumes:
      - ./keycloak-theme/krt-theme:/opt/keycloak/themes/krt-theme:ro
      - /var/iri/code/keycloak/providers:/opt/keycloak/providers:ro
      - /var/iri/keycloak/log:/var/log/keycloak
      - ${IRI_KEYCLOAK_KEYSTORE_HOST_PATH:-${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}}:/run/secrets/keystore.p12:ro
    depends_on:
      db-keycloak:
        condition: service_healthy
    networks:
      - net-db-keycloak
      - net-proxy-keycloak
      - net-backend-keycloak
      - net-monitoring-scrape

  keycloak-dev:
    <<: *keycloak-template
    command: start-dev --import-realm --proxy-headers xforwarded --cache=local
    profiles: ["dev"]
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      db-keycloak-dev:
        condition: service_healthy
    networks:
      net-db-keycloak:
        aliases:
          - keycloak
      net-proxy-keycloak:
        aliases:
          - keycloak
      net-backend-keycloak:
        aliases:
          - keycloak

  backend:
    <<: *backend-template
    profiles: ["prod"]
    container_name: backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://localhost:11271/actuator/health/readiness",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
      retries: 3
    depends_on:
      db-backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - net-db-backend
      - net-backend-frontend
      - net-backend-keycloak
      - net-backend-ingest
      - net-proxy-api
      - net-redis-backend
      - net-monitoring-scrape

  backend-dev:
    <<: *backend-template
    profiles: ["dev"]
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro
    ports:
      - "127.0.0.1:11261:11261"
    depends_on:
      db-backend-dev:
        condition: service_healthy
      keycloak-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      net-db-backend:
        aliases:
          - backend
      net-backend-frontend:
        aliases:
          - backend
      net-backend-keycloak:
        aliases:
          - backend
      net-backend-ingest:
        aliases:
          - backend
      net-redis-backend:
        aliases:
          - backend

  frontend:
    <<: *frontend-template
    profiles: ["prod"]
    container_name: frontend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://localhost:18091/actuator/health/readiness",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      start_interval: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net-backend-frontend
      - net-proxy-frontend
      - net-backend-keycloak
      - net-redis-frontend
      - net-monitoring-scrape

  frontend-dev:
    <<: *frontend-template
    profiles: ["dev"]
    environment:
      <<: *frontend-env
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
    volumes:
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro
    ports:
      - "127.0.0.1:18081:18081"
    depends_on:
      backend-dev:
        condition: service_healthy
      keycloak-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      net-backend-frontend:
        aliases:
          - frontend
      net-proxy-frontend:
        aliases:
          - frontend
      net-backend-keycloak:
        aliases:
          - frontend
      net-redis-frontend:
        aliases:
          - frontend

  ingest:
    <<: *ingest-template
    profiles: ["prod"]
    container_name: ingest
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://localhost:11272/actuator/health/readiness",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net-proxy-ingest
      - net-backend-ingest
      - net-redis-ingest
      - net-monitoring-scrape

  ingest-dev:
    <<: *ingest-template
    profiles: ["dev"]
    environment:
      <<: *ingest-env
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - type: tmpfs
        target: /app/logs
        tmpfs:
          mode: 0o777
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro
    ports:
      - "127.0.0.1:11262:11262"
    depends_on:
      backend-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      net-proxy-ingest:
        aliases:
          - ingest
      net-backend-ingest:
        aliases:
          - ingest
      net-redis-ingest:
        aliases:
          - ingest

  edge:
    profiles: ["prod"]
    image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:e75f89810bf5bfbcf58a1cfb32a1a11de55b7623d732e67735d513b720d7436a
    container_name: edge
    restart: unless-stopped
    logging: *default-logging
    user: "101:101"
    ports:
      - "80:8080"
      - "443:8443"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '1.0'
          pids: 512
    command: ["/bin/sh", "/etc/nginx/edge/render-and-run.sh"]
    environment:
      EDGE_HOST_FRONTEND: ${EDGE_HOST_FRONTEND:-}
      EDGE_HOST_INGEST: ${EDGE_HOST_INGEST:-}
      EDGE_HOST_GRAFANA: ${EDGE_HOST_GRAFANA:-}
      EDGE_HOST_API: ${EDGE_HOST_API:-}
      EDGE_TRUSTED_PROXY: ${EDGE_TRUSTED_PROXY:-}
      EDGE_ADMIN_ALLOW: ${EDGE_ADMIN_ALLOW:-}
      EDGE_GRAFANA_UPSTREAM_VERIFY: ${EDGE_GRAFANA_UPSTREAM_VERIFY:-off}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./docker/edge:/etc/nginx/edge:ro
      - edge-certs:/etc/nginx/certs:ro
      - edge-acme-webroot:/var/www/acme:ro
      - ${IRI_UPSTREAM_CA_HOST_PATH:-/var/iri/monitoring/certs/basetool-ca.crt}:/etc/nginx/upstream-ca.crt:ro
      - ${IRI_GRAFANA_UPSTREAM_CERT_HOST_PATH:-/var/iri/monitoring/certs/grafana.crt}:/etc/nginx/grafana-upstream.crt:ro
      - ./docker/maintenance/static:/usr/share/nginx/html/maintenance:ro
    networks:
      - net-edge-ingress
      - net-proxy-frontend
      - net-proxy-keycloak
      - net-proxy-ingest
      - net-proxy-grafana
      - net-proxy-api

  acme:
    profiles: ["prod"]
    image: goacme/lego:v5.5.1@sha256:9c446e8ce05155f87475ce87392a5c55472a7ecd06e244752f762d2f4b162e8d
    container_name: acme
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh"]
    command: ["/etc/acme/publish-loop.sh"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_HOSTS: ${ACME_HOSTS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
          pids: 128
    volumes:
      - ./docker/acme:/etc/acme:ro
      - edge-acme-state:/data
      - edge-acme-webroot:/webroot
      - edge-certs:/certs
    networks:
      - net-acme-egress

volumes:
  edge-certs:
  edge-acme-webroot:
  edge-acme-state:
  db-backend-dev-data:
  db-keycloak-dev-data:
  redis-dev-data:

networks:
  net-db-backend:
    name: net-db-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  net-db-keycloak:
    name: net-db-keycloak
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
  net-backend-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1

  net-edge-ingress:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.28.15.0/24
          gateway: 172.28.15.1
        - subnet: fd00:28:15::/64
          gateway: fd00:28:15::1
  net-acme-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.14.0/24
          gateway: 172.28.14.1
  net-proxy-frontend:
    internal: true
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.3.0/24
          gateway: 172.28.3.1
        - subnet: fd00:28:3::/64
          gateway: fd00:28:3::1
  net-proxy-keycloak:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.4.0/24
          gateway: 172.28.4.1
  net-backend-keycloak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.5.0/24
          gateway: 172.28.5.1
  net-redis-frontend:
    name: net-redis-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.6.0/24
          gateway: 172.28.6.1
  net-proxy-ingest:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24
          gateway: 172.28.7.1
  net-backend-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.8.0/24
          gateway: 172.28.8.1
  net-redis-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24
          gateway: 172.28.9.1
  net-redis-backend:
    name: net-redis-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.12.0/24
          gateway: 172.28.12.1
  net-monitoring-scrape:
    name: net-monitoring-scrape
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1
  net-proxy-grafana:
    internal: true
    name: net-proxy-grafana
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.11.0/24
          gateway: 172.28.11.1
  net-proxy-api:
    internal: true
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.13.0/24
          gateway: 172.28.13.1
        - subnet: fd00:28:13::/64
          gateway: fd00:28:13::1
