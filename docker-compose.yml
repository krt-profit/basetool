x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-backend: &db-backend-template
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  command: >
    postgres
    -c shared_buffers=384MB
    -c effective_cache_size=1024MB
    -c work_mem=8MB
    -c maintenance_work_mem=64MB
    -c max_connections=150
    -c random_page_cost=1.1
    -c max_parallel_workers_per_gather=0
    -c jit=off
    -c shared_preload_libraries=pg_stat_statements
    -c log_error_verbosity=terse
    -c log_line_prefix='%m [%p] %q%u@%d/%a '
  environment:
    POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    PGPORT: 15432
    PGDATA: /var/lib/postgresql/data/pgdata
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?} -p 15432"]
    interval: 5s
    timeout: 5s
    retries: 5
  stop_grace_period: 60s
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: '4.0'
        pids: 512
  volumes:
    - /var/iri/db-backend:/var/lib/postgresql/data

