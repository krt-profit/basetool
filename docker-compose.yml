    KC_HOSTNAME_STRICT: "true"
    KC_HTTP_RELATIVE_PATH: /auth
    KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
    KC_HEALTH_ENABLED: "true"
    KC_LOG_LEVEL: "info,io.vertx.core.net.impl.ConnectionBase:off"
    KC_HTTP_ENABLED: "true"
    KC_HTTP_PORT: 18080
    KC_HTTPS_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD must be set in .env}
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://db-keycloak:15433/${KC_POSTGRES_DB:?KC_POSTGRES_DB must be set in .env}
    KC_DB_USERNAME: ${KC_POSTGRES_USER:?KC_POSTGRES_USER must be set in .env}
    KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD must be set in .env}
    KC_SPI_CONNECTIONS_JPA_QUARKUS_ASYNC_COMMIT: "false"
