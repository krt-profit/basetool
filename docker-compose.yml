# Shared log-rotation policy. Without these limits the default `json-file`
# driver grows the per-container log file unbounded — at our request volume the
# backend alone produces ~150 MB/day of JSON access logs, so a long-running
# host would fill `/var/lib/docker/containers/` within weeks. Anchored here and
# referenced via `logging: *default-logging` from every service template so a
# future change (e.g. switch to `local` driver) is a single-line edit.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-backend: &db-backend-template
  # Pinned by digest in addition to the `:18-alpine` tag so a silent upstream
  # rebuild (Postgres or Alpine base) cannot land on the prod host between the
  # `docker compose pull` on the deploy server and a subsequent compose-driven
  # restart. Refresh by running `docker buildx imagetools inspect postgres:18-alpine`
  # locally and updating the digest below — never via :latest.
  image: postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
  restart: unless-stopped
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). The official postgres entrypoint boots as root to
  # chown PGDATA and then drops to the `postgres` user via gosu, so it keeps the minimal caps that
  # requires — CHOWN/DAC_OVERRIDE/FOWNER (chown the data dir) + SETUID/SETGID (gosu drops privileges).
  # no-new-privileges still holds: gosu drops via the CAP_SETUID syscall, not a setuid binary, so
  # lowering the uid is unaffected. A wrong cap set fails the container at start, which the deploy
  # health-gate turns into a clean rollback — re-verify the set on every postgres image bump.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  # Container-aware memory tuning. The default Postgres settings (128 kB work_mem,
  # 128 MB shared_buffers) target a 4 GB host — at our 768 MB container limit the
  # buffer pool stays warm and join/sort operations spill to disk far less often.
  # `effective_cache_size` is an estimate to the planner, not an allocation, so
  # setting it to ~2/3 of the limit is safe and helps index plans win over seq
  # scans.
  command: >
    postgres
    -c shared_buffers=192MB
    -c effective_cache_size=512MB
    -c work_mem=8MB
    -c maintenance_work_mem=64MB
    -c max_connections=100
    -c log_error_verbosity=terse
  environment:
    POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    PGPORT: 15432
    PGDATA: /var/lib/postgresql/data/pgdata
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?} -p 15432"]
    interval: 5s
    timeout: 5s
    retries: 5
  stop_grace_period: 60s
  # Resource budget: targets a 4 vCPU / 8 GB host. Total of all `prod` services
  # is ~5.6 GB RAM (leaves ~2 GB headroom for the kernel, the Docker daemon and
  # short-lived bursts). CPU limits are intentionally overcommitted relative to
  # the four physical vCPUs because they are per-container burst ceilings, not
  # reserved shares — the CFS scheduler arbitrates contention at run time.
  # Without these limits an in-container memory leak would let one service
  # monopolise the host and OOM-kill its neighbours (Postgres in particular
  # has historically been the casualty when the JVM heap runs away).
  deploy:
    resources:
      limits:
        memory: 768M
        cpus: '1.5'
        # Fork-bomb / runaway-backend ceiling. max_connections=100 caps live backends at ~100 +
        # background workers, so 512 is generous headroom, not a tight limit.
        pids: 512
  volumes:
    - /var/iri/db-backend:/var/lib/postgresql/data

x-db-keycloak: &db-keycloak-template
  # Same digest pin policy as db-backend (see comment there).
  image: postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
  restart: unless-stopped
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014) — same cap set + rationale as db-backend.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  # Smaller tuning than db-backend (512 MB limit vs 768 MB). Keycloak's working
  # set is realm config + user records + sessions — easily fits in 128 MB
  # shared_buffers for our member count.
  command: >
    postgres
    -c shared_buffers=128MB
    -c effective_cache_size=384MB
    -c work_mem=4MB
    -c maintenance_work_mem=32MB
    -c max_connections=100
    -c log_error_verbosity=terse
  environment:
    POSTGRES_DB: ${KC_POSTGRES_DB:?KC_POSTGRES_DB must be set in .env}
    POSTGRES_USER: ${KC_POSTGRES_USER:?KC_POSTGRES_USER must be set in .env}
    POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD must be set in .env}
    PGPORT: 15433
    PGDATA: /var/lib/postgresql/data/pgdata
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USER:?} -d ${KC_POSTGRES_DB:?} -p 15433"]
    interval: 5s
    timeout: 5s
    retries: 5
  stop_grace_period: 60s
  # Smaller than db-backend: Keycloak's schema is fixed and the working set
  # (users, sessions, realm config) easily fits in 512 MB shared_buffers + page
  # cache for our member count. Bump if user count grows past O(thousands).
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
        pids: 512
  volumes:
    - /var/iri/db-keycloak:/var/lib/postgresql/data

x-keycloak: &keycloak-template
  # Same digest pin policy as the Postgres images. Refresh with
  # `docker buildx imagetools inspect quay.io/keycloak/keycloak:26.6`.
  image: quay.io/keycloak/keycloak:26.6@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
  command: start --proxy-headers xforwarded --cache=local --log=console,file --log-file=/var/log/keycloak/keycloak.log
  restart: unless-stopped
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). The Keycloak (Quarkus/ubi9) image already runs as the
  # non-root uid 1000 and binds only high ports (18443/9000), so it needs NO capabilities — drop them
  # all. `start` re-runs the provider build into 1000-owned dirs, so no cap is required for that
  # either. Re-verify on every Keycloak image bump (a wrong set fails start → deploy health-gate
  # rollback).
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  stop_grace_period: 30s
  # Quarkus-based Keycloak with local cache + JWT signing + the realm import is
  # the second-biggest RAM consumer behind the backend. 1.5 GB matches the
  # upstream recommendation for a small production realm with our member count.
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: '2.0'
        # JVM threads count as tasks toward this ceiling; 2048 is generous headroom over Keycloak's
        # working thread set, so it is a runaway ceiling rather than a limit hit under normal load.
        pids: 2048
  environment:
    KC_HOSTNAME: keycloak.profit-base.online
    KC_HOSTNAME_STRICT: "true"
    KC_HEALTH_ENABLED: "true"
    KC_HTTP_ENABLED: "true"
    KC_HTTP_PORT: 18080
    # Keystore password for the prod HTTPS connector. The `keycloak` (prod) service's command
    # override enables `--https-*` and disables plain HTTP; Keycloak merges this env-supplied
    # password with the CLI `--https-key-store-file`. Set in the shared template (not as a CLI arg)
    # so the password never lands in the process arg list. Harmless for `keycloak-dev`, which keeps
    # plain HTTP (start-dev) and configures no keystore file, so the value is simply unused there.
    KC_HTTPS_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD must be set in .env}
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://db-keycloak:15433/${KC_POSTGRES_DB:?KC_POSTGRES_DB must be set in .env}
    KC_DB_USERNAME: ${KC_POSTGRES_USER:?KC_POSTGRES_USER must be set in .env}
    KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD must be set in .env}
    KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME must be set in .env}
    KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD must be set in .env}
    # Optional (epic #720, REQ-DATA-008): the das-kartell guild id, read by the Discord federation
    # SPI to capture each member's per-guild server nickname for the admin approval queue. The `:-`
    # default makes it optional — when unset the SPI skips nickname capture (fail-open); it never
    # affects the login. Put the value in .env (it is not a secret). The two Keycloak mappers that
    # surface it are operator steps in docs/keycloak/DISCORD_KEYCLOAK_SETUP.md §3c.
    DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    # Optional (REQ-SEC-022, ADR-0051): the Discord first-login account-existence precheck. When the
    # URL + shared secret are set, the SPI asks the backend over HTTPS whether a Basetool account
    # already exists for an incoming Discord identity and, if so, denies the first-login with a
    # "link your existing account instead" page. Entirely fail-open — the `:-` empty defaults keep it
    # OFF unless configured, and any error fails open. HTTPS ONLY. The truststore that validates the
    # backend's self-signed cert must be mounted into this container and KRT_BACKEND_TRUSTSTORE_PATH
    # pointed at it; the mount + keytool steps are operator instructions in
    # docs/keycloak/DISCORD_KEYCLOAK_SETUP.md §7. KRT_DISCORD_SPI_SHARED_SECRET must match the value
    # set on the backend service.
    KRT_BACKEND_PRECHECK_URL: ${KRT_BACKEND_PRECHECK_URL:-}
    KRT_DISCORD_SPI_SHARED_SECRET: ${KRT_DISCORD_SPI_SHARED_SECRET:-}
    KRT_BACKEND_TRUSTSTORE_PATH: ${KRT_BACKEND_TRUSTSTORE_PATH:-}
    KRT_BACKEND_TRUSTSTORE_PASSWORD: ${KRT_BACKEND_TRUSTSTORE_PASSWORD:-}
    # Monitoring plane (epic #936, REQ-OBS-005/-009). Prometheus scrapes the management endpoint on
    # port 9000 (plain HTTP, isolated-network carve-out — REQ-OBS-008) and Keycloak pushes OTLP login
    # spans to Alloy. All gates default OFF so keycloak-dev and the e2e stack stay inert; the prod .env
    # sets KC_METRICS_ENABLED=true, KC_EVENT_METRICS_USER_ENABLED=true, KC_TRACING_ENABLED=true and the
    # Alloy OTLP endpoint. The default event list covers the local login flow AND the Discord IdP
    # broker path (the primary login route); the `realm,idp` tags stay bounded (REQ-OBS-006). The
    # values only take effect once their gate is on, so listing them here is inert for dev. Only the
    # prod keycloak service joins net-monitoring-scrape.
    KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-false}
    KC_EVENT_METRICS_USER_ENABLED: ${KC_EVENT_METRICS_USER_ENABLED:-false}
    # Base event names only — Keycloak REJECTS error variants like `login_error` at startup ("Invalid
    # value for option 'KC_EVENT_METRICS_USER_EVENTS'"). A failed login is the `login` event carrying the
    # built-in `error` label on keycloak_user_events_total (that label is automatic, NOT a USER_TAGS value).
    KC_EVENT_METRICS_USER_EVENTS: ${KC_EVENT_METRICS_USER_EVENTS:-login,logout,register,code_to_token,refresh_token,identity_provider_login,identity_provider_first_login,identity_provider_post_login}
    KC_EVENT_METRICS_USER_TAGS: ${KC_EVENT_METRICS_USER_TAGS:-realm,idp}
    KC_TRACING_ENABLED: ${KC_TRACING_ENABLED:-false}
    KC_TRACING_ENDPOINT: ${KC_TRACING_ENDPOINT:-http://alloy:4317}
  # The Keycloak Quarkus image is built on `ubi9-micro` and ships neither curl
  # nor wget, so the readiness probe uses bash's `/dev/tcp` virtual filesystem to
  # open a TCP connection to the management port and reads back the HTTP status
  # line. `printf` (POSIX) replaces `echo -e` for predictable backslash handling.
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        exec 3<>/dev/tcp/127.0.0.1/9000
        && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
        && grep -q '200 OK' <&3
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s
  volumes:
    - ./keycloak-theme/krt-theme:/opt/keycloak/themes/krt-theme
    - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    # Custom Keycloak provider JARs (the Discord federation + first-login membership
    # gate SPI, epic #720). The deploy step stages keycloak-spi-*.jar here, 0644 so the
    # uid-1000 Keycloak image can read it (same lesson as the keystore). An empty or
    # missing host dir is harmless — Keycloak simply finds no extra providers. The
    # `start` command re-runs the provider build on every boot, so a staged JAR is
    # picked up after a restart. See docs/keycloak/DISCORD_KEYCLOAK_SETUP.md.
    - /var/iri/code/keycloak/providers:/opt/keycloak/providers
    - /var/iri/keycloak/log:/var/log/keycloak

x-backend: &backend-template
  # Image lives in GHCR and is produced by .github/workflows/release-images.yml.
  # `IRI_BASETOOL_VERSION` is the version pointer (default `stable`, which the
  # promote.yml workflow updates atomically); the server's deploy.sh script
  # writes a concrete version (e.g. `1.4.2`) into the host .env for explicit
  # rollbacks. For local-iteration on the Dockerfile itself, use
  # docker-compose.build.yml as an override to add `build:` back in.
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-backend:${IRI_BASETOOL_VERSION:-stable}
  restart: always
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). The image runs as the fixed non-root uid 10001 and
  # binds only a high port (11261), so the JVM needs NO Linux capabilities — drop them all and forbid
  # privilege escalation. Cheap, high-value defence-in-depth on the service that runs the most code.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  stop_grace_period: 30s
  # Biggest workload on the host: every API call goes through this JVM, Flyway
  # runs at startup, and Hibernate caches L1/L2 + Caffeine caches live here.
  # MaxRAMPercentage=75 (set further down in JAVA_TOOL_OPTIONS) maps to roughly
  # 1.1 GB heap inside the 1536M limit, the remaining ~400 MB cover Metaspace,
  # the JIT code cache, native libs (openpdf, postgres jdbc) and a working
  # buffer for the Tomcat thread pool.
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: '2.0'
        # JVM threads count as tasks toward this ceiling; 2048 is generous headroom over Tomcat +
        # Hikari + scheduler + GC/JIT threads, so it is a runaway ceiling, not a limit hit under load.
        pids: 2048
  environment:
    SPRING_PROFILES_ACTIVE: prod
    SERVER_PORT: 11261
    SPRING_DATASOURCE_URL: jdbc:postgresql://db-backend:15432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    KEYCLOAK_ISSUER_URI: https://keycloak.profit-base.online/realms/iri
    # Internal admin / user-sync path: direct backend→Keycloak over the isolated
    # net-backend-keycloak network, now TLS because the prod Keycloak serves HTTPS only. Trust is
    # pinned to the shared self-signed cert via the `keycloak-trust` SSL bundle
    # (backend application-prod.yml); hostname verification stays ON, so the cert's SAN MUST include
    # `dns:keycloak` (see the README keytool recipe). The dev/test stack overrides this back to
    # http://keycloak:18080 in docker-compose.test.yml.
    KEYCLOAK_ADMIN_URL: https://keycloak:18443
    KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set in .env}
    # Optional (REQ-SEC-022): shared secret guarding the internal /internal/discord/account-existence
    # endpoint the Keycloak Discord SPI calls. Blank → the endpoint is disabled (503) and the SPI
    # fails open. Must equal the KRT_DISCORD_SPI_SHARED_SECRET set on the keycloak service.
    KRT_DISCORD_SPI_SHARED_SECRET: ${KRT_DISCORD_SPI_SHARED_SECRET:-}
    # Transactional e-mail (account approval/rejection notices — REQ-NOTIF-013/-014). app.mail is
    # enabled by default; mail is only actually sent once SPRING_MAIL_HOST is set, so leaving these
    # blank is a safe no-op. To send via Gmail, set in .env: SPRING_MAIL_HOST=smtp.gmail.com,
    # SPRING_MAIL_PORT=587, SPRING_MAIL_USERNAME=<you>@gmail.com, SPRING_MAIL_PASSWORD=<16-char App
    # Password>, APP_MAIL_FROM_ADDRESS=<you>@gmail.com (STARTTLS + auth come from application.yml).
    SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
    SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
    SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
    SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
    APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS:-no-reply@profit-base.online}
    APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-Profit Basetool}
    # Monitoring plane (epic #936, REQ-OBS-005/-009). Every value defaults OFF/empty so dev, test,
    # e2e and a prod host without the monitoring stack stay inert: /actuator/prometheus denies every
    # request until MONITORING_SCRAPE_* is set, and tracing exports nothing until
    # MONITORING_TRACING_ENABLED is true. The prod .env sets the real scrape credentials and
    # MONITORING_TRACING_ENABLED=true (Phase-2 rollout); only the prod service joins
    # net-monitoring-scrape, where Prometheus scrapes it over HTTPS and Alloy receives its OTLP spans.
    MONITORING_SCRAPE_USER: ${MONITORING_SCRAPE_USER:-}
    MONITORING_SCRAPE_PASSWORD: ${MONITORING_SCRAPE_PASSWORD:-}
    MONITORING_TRACING_ENABLED: ${MONITORING_TRACING_ENABLED:-false}
    MONITORING_OTLP_ENDPOINT: ${MONITORING_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
    MONITORING_TRACING_SAMPLING_PROBABILITY: ${MONITORING_TRACING_SAMPLING_PROBABILITY:-1.0}
    # The keystore lives on the host filesystem (bind-mounted below) and is
    # explicitly NOT packaged into the GHCR image. Both backend and frontend
    # share the same PKCS12 file because the cert's SAN covers the Docker
    # network aliases `backend` and `frontend`. If a future operator wants
    # per-service keystores, set IRI_KEYSTORE_HOST_PATH_BACKEND and
    # IRI_KEYSTORE_HOST_PATH_FRONTEND separately in .env and override the
    # volume entry per service.
    SERVER_SSL_KEY_STORE: file:/run/secrets/keystore.p12
    SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD must be set in .env}
    JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
  volumes:
    - /var/iri/backend/log:/app/logs
    # Production cert is on the host, never in the image. Default points at the
    # repo-root `./keystore.p12` so a local developer can generate one there
    # and `docker compose --profile dev up -d` works out of the box; the prod
    # `.env` overrides this to `/var/iri/secrets/keystore.p12`. The path is
    # resolved relative to the directory containing docker-compose.yml.
    - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro

x-redis: &redis-template
  # Same digest pin policy as the Postgres images. Refresh with
  # `docker buildx imagetools inspect redis:8-alpine`.
  image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
  # Lightweight RDB persistence (re-enabled 2026-06 for the 30-day session
  # goal). M-7 had turned all persistence off (`--save "" --appendonly no`) on
  # the premise that a Redis restart only drops Spring Sessions, which
  # SsoReAuthenticationEntryPoint rebuilds via a transparent `prompt=none`
  # Keycloak redirect. That premise no longer holds: the Spring Session now
  # carries the OAuth2 refresh token behind a rolling 30-day login, and losing
  # it forces a re-auth round-trip that is only silent while the browser still
  # holds a live Keycloak SSO cookie. RDB snapshots restore that durability
  # cheaply via periodic background forks with NO per-write fsync -- the
  # ~200 fsync/s AOF cost M-7 removed stays off (`--appendonly no`). The session
  # dataset is tiny (OidcUser / OAuth2AuthorizedClient + flash attributes), so a
  # fork-and-dump every few minutes is negligible I/O. `--save "300 1 60 1000"`
  # snapshots after 300s if >=1 key changed (<=5 min worst-case loss) or after
  # 60s under heavy churn; dump.rdb lands on the /var/iri/redis bind mount and
  # is reloaded on restart.
  command: redis-server --save "300 1 60 1000" --appendonly no --loglevel notice --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  restart: unless-stopped
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). The official redis entrypoint boots as root to chown
  # /data and then drops to the `redis` user via gosu, so it keeps the minimal caps that requires —
  # CHOWN/DAC_OVERRIDE/FOWNER (chown the data dir) + SETUID/SETGID (privilege drop). no-new-privileges
  # still holds (gosu drops via CAP_SETUID, not a setuid binary). Re-verify on every redis image bump.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  stop_grace_period: 30s
  # Only stores Spring sessions (OidcUser / OAuth2AuthorizedClient + flash
  # attributes). 256 MB is generous for our active-user count plus the
  # copy-on-write headroom an RDB snapshot fork transiently needs.
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.5'
        # Redis is effectively single-process (plus a few bg threads + a transient RDB fork); 512 is
        # a fork-bomb ceiling with wide headroom.
        pids: 512
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "--no-auth-warning", "ping"]
    interval: 5s
    timeout: 5s
    retries: 5
  volumes:
    - /var/iri/redis:/data

x-frontend: &frontend-template
  # See x-backend above for the GHCR / IRI_BASETOOL_VERSION rationale. Local
  # rebuilds happen via docker-compose.build.yml.
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-frontend:${IRI_BASETOOL_VERSION:-stable}
  restart: always
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). Non-root uid 10001, high port (18081) only → no caps.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  stop_grace_period: 30s
  # Thymeleaf SSR + WebClient proxy to the backend; no JPA, no business logic,
  # so the working set is well below the backend's. 768 MB → ~576 MB heap with
  # MaxRAMPercentage=75 is enough for Tomcat, the Spring Session client cache
  # and the Caffeine-backed reference-data cache.
  deploy:
    resources:
      limits:
        memory: 768M
        cpus: '1.0'
        # JVM thread ceiling — generous headroom (see the backend template).
        pids: 2048
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    SERVER_PORT: 18081
    KEYCLOAK_ISSUER_URI: https://keycloak.profit-base.online/realms/iri
    BACKEND_URL: https://backend:11261
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # Monitoring plane (epic #936, REQ-OBS-005/-009) — see the backend template for the full
    # rationale. Everything defaults OFF/empty so dev/test/e2e stay inert; the prod .env supplies the
    # real scrape credentials and enables tracing. Only the prod service joins net-monitoring-scrape.
    MONITORING_SCRAPE_USER: ${MONITORING_SCRAPE_USER:-}
    MONITORING_SCRAPE_PASSWORD: ${MONITORING_SCRAPE_PASSWORD:-}
    MONITORING_TRACING_ENABLED: ${MONITORING_TRACING_ENABLED:-false}
    MONITORING_OTLP_ENDPOINT: ${MONITORING_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
    MONITORING_TRACING_SAMPLING_PROBABILITY: ${MONITORING_TRACING_SAMPLING_PROBABILITY:-1.0}
    SERVER_SSL_KEY_STORE: file:/run/secrets/keystore.p12
    SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD must be set in .env}
    JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
  volumes:
    - /var/iri/frontend/log:/app/logs
    - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro

x-ingest: &ingest-template
  # The desktop one-click ingest gateway (epic #639, ADR-0018) — the ONLY new internet-reachable
  # service. NPM terminates the public TLS and re-encrypts to this gateway over https://ingest:11262
  # (NPM upstream: scheme https, upstream-cert verification OFF — the shared cert is self-signed), so
  # like backend/frontend the gateway serves HTTPS. The bind-mounted keystore.p12 is used BOTH as the
  # server keystore AND as the TRUSTSTORE that validates the backend's self-signed https://backend:11261
  # cert (backend-trust bundle in application-prod.yml). It owns no database — it relays to the backend
  # and stages a short-lived single-use handoff in the shared Redis. See x-backend for the GHCR /
  # IRI_BASETOOL_VERSION rationale; local rebuilds use docker-compose.build.yml.
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-ingest:${IRI_BASETOOL_VERSION:-stable}
  restart: always
  logging: *default-logging
  # Runtime-hardening baseline (REQ-OPS-014). Non-root uid 10001, high port (11262) only → no caps.
  # This is the only new internet-reachable service, so dropping caps + forbidding escalation here is
  # the highest-value application of the baseline after npm.
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  stop_grace_period: 30s
  # Lightweight: a JWT-validating relay + Redis staging, no JPA, no business logic. 512 MB →
  # ~384 MB heap with MaxRAMPercentage=75 covers Tomcat, the reactive WebClient and Lettuce.
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
        # JVM thread ceiling — generous headroom (see the backend template).
        pids: 2048
  environment:
    SPRING_PROFILES_ACTIVE: prod
    SERVER_PORT: 11262
    KEYCLOAK_ISSUER_URI: https://keycloak.profit-base.online/realms/iri
    BACKEND_URL: https://backend:11261
    # Public frontend URL the extractor's browser is sent to (…?handoff=<id>). Override per
    # deployment in .env; the local dev stack should point this at http://localhost:18081.
    FRONTEND_URL: ${IRI_FRONTEND_PUBLIC_URL:-https://profit-base.online}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # Audience enforcement stays OFF until the Keycloak runbook (#641, docs/INGEST_KEYCLOAK_SETUP.md)
    # has BOTH the extractor and frontend tokens carrying aud=basetool-backend. Only then set this to
    # basetool-backend — enabling it earlier rejects every frontend token and breaks the app.
    APP_SECURITY_JWT_EXPECTED_AUDIENCES: ${IRI_INGEST_EXPECTED_AUDIENCES:-}
    # Monitoring plane (epic #936, REQ-OBS-005/-009) — see the backend template for the full
    # rationale. Everything defaults OFF/empty so dev/test/e2e stay inert; the prod .env supplies the
    # real scrape credentials and enables tracing. Only the prod service joins net-monitoring-scrape.
    MONITORING_SCRAPE_USER: ${MONITORING_SCRAPE_USER:-}
    MONITORING_SCRAPE_PASSWORD: ${MONITORING_SCRAPE_PASSWORD:-}
    MONITORING_TRACING_ENABLED: ${MONITORING_TRACING_ENABLED:-false}
    MONITORING_OTLP_ENDPOINT: ${MONITORING_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
    MONITORING_TRACING_SAMPLING_PROBABILITY: ${MONITORING_TRACING_SAMPLING_PROBABILITY:-1.0}
    # Same keystore + password the other modules use. These bind BOTH the server connector
    # (`server.ssl.*`, enabled in ingest application.yml so the gateway serves HTTPS on 11262) AND the
    # `spring.ssl.bundle.backend-trust` truststore that validates the backend's self-signed cert. NPM
    # re-encrypts to this connector (upstream scheme https, upstream-cert verification OFF for the
    # self-signed cert).
    SERVER_SSL_KEY_STORE: file:/run/secrets/keystore.p12
    SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:?SERVER_SSL_KEY_STORE_PASSWORD must be set in .env}
    JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
  volumes:
    - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro

services:
  redis:
    <<: *redis-template
    profiles: ["prod"]
    container_name: redis
    # Prod overrides the template command to add the monitoring ACL file (epic #936). The
    # redis_exporter (monitoring stack) connects as a dedicated ACL user restricted to read-only
    # monitoring commands (no key access), so the session store holding OAuth2 refresh tokens stays
    # unreadable. `--requirepass` still governs the `default` user the apps authenticate as, so the
    # ACL file (provisioned on the host by the Phase-2 runbook BEFORE this deploy) MUST NOT define a
    # `default` user. A missing/empty ACL file makes redis exit at startup, which the deploy
    # health-gate turns into a clean rollback rather than a silent breakage. Untouched for redis-dev.
    command: redis-server --save "300 1 60 1000" --appendonly no --loglevel notice --aclfile /etc/redis/users.acl --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # A service-level `volumes:` replaces the merged template value, so the data volume is re-listed
    # alongside the read-only ACL mount.
    volumes:
      - /var/iri/redis:/data
      - ${IRI_REDIS_ACL_HOST_PATH:-/var/iri/redis/users.acl}:/etc/redis/users.acl:ro
    networks:
      - net-redis-frontend
      - net-redis-ingest

  redis-dev:
    <<: *redis-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      net-redis-frontend:
        aliases:
          - redis
      net-redis-ingest:
        aliases:
          - redis

  db-backend:
    <<: *db-backend-template
    profiles: ["prod"]
    container_name: db-backend
    networks:
      - net-db-backend

  db-backend-dev:
    <<: *db-backend-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:15432:15432"
    networks:
      net-db-backend:
        aliases:
          - db-backend

  db-keycloak:
    <<: *db-keycloak-template
    profiles: ["prod"]
    container_name: db-keycloak
    networks:
      - net-db-keycloak

  db-keycloak-dev:
    <<: *db-keycloak-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:15433:15433"
    networks:
      net-db-keycloak:
        aliases:
          - db-keycloak

  keycloak:
    <<: *keycloak-template
    profiles: ["prod"]
    container_name: keycloak
    # Prod serves HTTPS ONLY. NPM re-encrypts the public host to https://keycloak:18443 (NPM upstream
    # scheme https, upstream-cert verification OFF for the shared self-signed cert) and the backend
    # admin client reaches the SAME connector over the internal net-backend-keycloak network. Plain
    # HTTP is disabled (`--http-enabled=false`) so no cleartext Keycloak listener exists anywhere.
    # The management/health interface (port 9000) is pinned to HTTP (`--http-management-scheme=http`)
    # because the Quarkus image ships no TLS-capable CLI client (no curl/wget/openssl, only java) and
    # the healthcheck talks plain HTTP via bash /dev/tcp — see the x-keycloak healthcheck. The
    # keystore is the shared keystore.p12 (volume below); its password comes from the env
    # KC_HTTPS_KEY_STORE_PASSWORD set in the template.
    command: >
      start
      --proxy-headers xforwarded
      --cache=local
      --http-enabled=false
      --https-port=18443
      --https-key-store-file=/run/secrets/keystore.p12
      --http-management-scheme=http
      --log=console,file
      --log-file=/var/log/keycloak/keycloak.log
    # Re-list the template volumes (a service-level `volumes:` replaces the merged template value)
    # and add the keystore bind mount. Kept off the shared template on purpose so the keystore stays
    # a prod-only requirement and `keycloak-dev` (run keystore-free in the deps-only dev flow) is
    # unaffected.
    volumes:
      - ./keycloak-theme/krt-theme:/opt/keycloak/themes/krt-theme
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
      # Custom Keycloak provider JARs — see the x-keycloak template note. Re-listed
      # here because a service-level `volumes:` replaces the merged template value.
      - /var/iri/code/keycloak/providers:/opt/keycloak/providers
      - /var/iri/keycloak/log:/var/log/keycloak
      - ${IRI_KEYSTORE_HOST_PATH:-./keystore.p12}:/run/secrets/keystore.p12:ro
    depends_on:
      db-keycloak:
        condition: service_healthy
    networks:
      - net-db-keycloak
      - net-proxy-keycloak
      - net-backend-keycloak
      # Prometheus scrapes keycloak:9000/metrics (plain HTTP mgmt port) and Keycloak pushes OTLP login
      # spans to Alloy here (epic #936). Only the prod keycloak joins the monitoring plane.
      - net-monitoring-scrape

  keycloak-dev:
    <<: *keycloak-template
    command: start-dev --import-realm --proxy-headers xforwarded --cache=local
    profiles: ["dev"]
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      db-keycloak-dev:
        condition: service_healthy
    networks:
      net-db-keycloak:
        aliases:
          - keycloak
      net-proxy-keycloak:
        aliases:
          - keycloak
      net-backend-keycloak:
        aliases:
          - keycloak

  backend:
    <<: *backend-template
    profiles: ["prod"]
    container_name: backend
    depends_on:
      db-backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - net-db-backend
      - net-backend-frontend
      - net-backend-keycloak
      - net-backend-ingest
      # Prometheus scrapes /actuator/prometheus (HTTPS) and Alloy receives OTLP spans here (epic #936).
      - net-monitoring-scrape

  backend-dev:
    <<: *backend-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:11261:11261"
    depends_on:
      db-backend-dev:
        condition: service_healthy
      keycloak-dev:
        condition: service_healthy
    networks:
      net-db-backend:
        aliases:
          - backend
      net-backend-frontend:
        aliases:
          - backend
      net-backend-keycloak:
        aliases:
          - backend
      net-backend-ingest:
        aliases:
          - backend

  frontend:
    <<: *frontend-template
    profiles: ["prod"]
    container_name: frontend
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net-backend-frontend
      - net-proxy-frontend
      - net-backend-keycloak
      - net-redis-frontend
      # Prometheus scrapes /actuator/prometheus (HTTPS) and Alloy receives OTLP spans here (epic #936).
      - net-monitoring-scrape

  frontend-dev:
    <<: *frontend-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:18081:18081"
    depends_on:
      backend-dev:
        condition: service_healthy
      keycloak-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      net-backend-frontend:
        aliases:
          - frontend
      net-proxy-frontend:
        aliases:
          - frontend
      net-backend-keycloak:
        aliases:
          - frontend
      net-redis-frontend:
        aliases:
          - frontend

  ingest:
    <<: *ingest-template
    profiles: ["prod"]
    container_name: ingest
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net-proxy-ingest
      - net-backend-ingest
      - net-redis-ingest
      # Prometheus scrapes /actuator/prometheus (HTTPS) and Alloy receives OTLP spans here (epic #936).
      - net-monitoring-scrape

  ingest-dev:
    <<: *ingest-template
    profiles: ["dev"]
    ports:
      - "127.0.0.1:11262:11262"
    depends_on:
      backend-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      net-proxy-ingest:
        aliases:
          - ingest
      net-backend-ingest:
        aliases:
          - ingest
      net-redis-ingest:
        aliases:
          - ingest

  npm:
    # Pin to a concrete release. Bump deliberately as part of an upgrade workflow;
    # do not move back to `:latest` (silent upstream changes are a supply-chain risk
    # and break reproducibility). Consider appending @sha256:<digest> as well.
    image: jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    container_name: npm
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"     # Frontend / Keycloak HTTP Traffic
      - "443:443"    # Frontend / Keycloak HTTPS Traffic
      - "127.0.0.1:10081:81"     # NGINX Proxy Manager Admin Web UI (loopback-only)
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
    # Runtime hardening (REQ-OPS-014) — the edge proxy is the most internet-exposed container
    # on the host, so it gets the baseline the monitoring stack already applies. The jc21 image
    # boots as root under s6-overlay and documents no reduced capability set, so the add-back
    # list is the empirically verified minimum on 2.15.1 (clean boot incl. the /data/nginx sed
    # pass, check-health OK, `nginx -s reload` OK, container restart OK): NET_BIND_SERVICE
    # (nginx binds 80/443), CHOWN/FOWNER/DAC_OVERRIDE (s6 prepare chowns /data +
    # /etc/letsencrypt and sed-rewrites *.conf files it does not own), SETUID/SETGID (s6 and
    # the nginx master drop to the npm user), KILL (nginx master signals workers across uid
    # boundaries on reload). read_only rootfs stays OFF — the s6 prepare step must write across
    # the fs (same EROFS constraint as the .conf mounts below). Re-verify the set on every
    # image bump before promoting it.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    # Nginx + the SQLite-backed admin UI is feather-light; 256 MB / 0.5 vCPU is
    # ample for HTTP/HTTPS proxying at our request volume. The pids cap bounds a
    # fork bomb / worker leak in the exposed container (same 512 as the monitoring
    # stack; normal operation runs ~45 processes).
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
          pids: 512
    volumes:
      - /var/iri/npm/data:/data
      - /var/iri/npm/letsencrypt:/etc/letsencrypt
      # Maintenance page served on upstream 502/503/504 during deploys. The
      # snippets in ./docker/maintenance/nginx are picked up by NPM via its
      # /data/nginx/custom hook (http.conf into the `http` block, server_proxy.conf
      # into every proxy host's `server` block) and the static assets are read
      # from /usr/share/nginx/html/maintenance/.
      #
      # The static-assets mount is :ro; the two .conf mounts are intentionally
      # NOT read-only. NPM's startup script `/etc/s6-overlay/s6-rc.d/prepare/
      # 50-ipv6.sh` walks every *.conf under /data/nginx/ and runs `sed -i`
      # against it to add IPv6 listeners — with :ro that fails with EROFS,
      # the `prepare` s6 service exits non-zero, and the entire NPM container
      # refuses to start. Our snippets contain no `listen` directives so sed
      # produces byte-identical content, but the write attempt itself has to
      # succeed for the container boot to proceed.
      - ./docker/maintenance/static:/usr/share/nginx/html/maintenance:ro
      - ./docker/maintenance/nginx/http.conf:/data/nginx/custom/http.conf
      - ./docker/maintenance/nginx/server_proxy.conf:/data/nginx/custom/server_proxy.conf
    networks:
      - net-proxy-frontend
      - net-proxy-keycloak
      - net-proxy-ingest
      # NPM re-encrypts the public grafana.profit-base.online host to grafana:3000 over this dedicated
      # net (Grafana joins it from docker-compose.monitoring.yml). Keeps NPM OFF net-monitoring-core.
      - net-proxy-grafana

# Every bridge network is pinned to a fixed /24 under 172.28.0.0/16 instead of
# being left to Docker's dynamic address pool. This is deliberate, not cosmetic:
# a `docker compose down` (or any network re-create) otherwise reassigns each
# bridge a fresh subnet from the pool, so its gateway `.1` changes across
# restarts.
#
# That gateway IP is load-bearing. The Keycloak Admin Console is exposed on the
# public `keycloak.profit-base.online` vhost but locked to an SSH tunnel via an
# nginx `allow … / deny all` on the `/admin` location in NPM. Host-origin traffic
# (the operator's `ssh -N -L 443:127.0.0.1:443 …` tunnel hitting NPM's published
# 443 through the host loopback) is SNAT'd by Docker to the gateway of whichever
# net-proxy-* bridge the published-port DNAT targets — so the allow-list matches
# a Docker gateway, not the operator's real IP. External clients keep their real
# source IP and stay blocked by `deny all`. With dynamic subnets that gateway
# moved on every restart and silently locked the admin console out (the exact
# breakage this pinning prevents). See docs/deployment.md → "Keycloak Admin
# Console via SSH tunnel" for the matching NPM `/admin` block.
#
# 172.28.0.0/16 sits outside Docker's default bridge (172.17.0.0/16) and is a
# single-purpose host, so collision risk is nil. The three NPM-facing bridges
# (net-proxy-frontend/-keycloak/-ingest) are grouped in .3/.4/.7 so the admin
# allow-list is a short, explicit list of their gateways.
networks:
  # Explicit `name:` (below and on net-redis-frontend) so the separate docker-compose.monitoring.yml
  # project can reference these as `external` by a deterministic name: the postgres/redis exporters
  # bridge into these existing data nets to reach the DBs/Redis, which keeps the databases OFF the
  # broad monitoring-scrape net (no new lateral path such as keycloak→db-backend). The subnet/gateway
  # are unchanged, so the NPM SSH-tunnel admin allow-list (which matches net-proxy-* gateways) is
  # unaffected.
  net-db-backend:
    name: net-db-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  net-db-keycloak:
    name: net-db-keycloak
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
  net-backend-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1
  net-proxy-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24
          gateway: 172.28.3.1
  net-proxy-keycloak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.4.0/24
          gateway: 172.28.4.1
  net-backend-keycloak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.5.0/24
          gateway: 172.28.5.1
  net-redis-frontend:
    name: net-redis-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.6.0/24
          gateway: 172.28.6.1
  # Ingest gateway (epic #639): proxy → ingest (the only new internet-facing edge),
  # ingest → backend, ingest → redis. backend stays OFF net-proxy-ingest.
  net-proxy-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24
          gateway: 172.28.7.1
  net-backend-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.8.0/24
          gateway: 172.28.8.1
  net-redis-ingest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24
          gateway: 172.28.9.1
  # Monitoring plane — scrape/OTLP boundary (epic #936, ADR-0072). This is the ONE monitoring network
  # the app stack owns and creates: the three apps + the prod keycloak join it so Prometheus can scrape
  # their metrics (HTTPS for the apps, keycloak:9000 plain HTTP) and Alloy can receive their OTLP spans.
  # The separate `docker-compose.monitoring.yml` project references it as `external` under the fixed
  # `name:` below (so the cross-project lookup does not depend on the compose project name). The other
  # two monitoring networks (net-monitoring-core, net-docker-proxy) have NO app-stack member and are
  # therefore owned by the monitoring project itself — declaring them here would leave them uncreated
  # (Compose only creates top-level networks a started service references). The DB/Redis exporters
  # deliberately do NOT put the databases/redis on this network; they bridge into the existing
  # net-db-*/net-redis-frontend nets instead, so no new lateral path (e.g. keycloak→db-backend) opens.
  # Subnet continues the pinned 172.28.0.0/16 block (.10); the gateway is not load-bearing here.
  net-monitoring-scrape:
    name: net-monitoring-scrape
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1
  # Dedicated NPM<->Grafana proxy net (epic #936): NPM re-encrypts the public grafana.profit-base.online
  # host to grafana:3000 here so NPM never joins the closed net-monitoring-core. Grafana joins it from
  # docker-compose.monitoring.yml (external ref by this fixed name). Subnet continues the pinned block
  # (.11); the gateway is NOT load-bearing (net-proxy-grafana is not in the Keycloak-admin allow-list).
  net-proxy-grafana:
    name: net-proxy-grafana
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.11.0/24
          gateway: 172.28.11.1
