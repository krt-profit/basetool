org.gradle.caching=true
# Parallel module builds and a larger daemon heap (M-1 from the performance audit). The build has
# six modules (backend, frontend, ingest, keycloak-spi, logging-support, test-support) that mostly
# compile independently; without `parallel=true` they run serially. The heap bump targets the combined load
# of Spring Boot's classpath scanning + MapStruct/Lombok annotation processing + the Spring AOT
# artifacts that the layered jar build emits; the previous ~512 MB default sat right at the GC edge
# and produced sporadic slow builds.
#
# `org.gradle.configureondemand` is gone (audit items BLD-PERF-04 / BLD-SIMP-05). It configured a
# project lazily only when a task needed it, and all it bought here was a need for six
# `evaluationDependsOn(...)` lines (`:test-support` and `:logging-support` in each application) so
# Spotless could still register its afterEvaluate hook. Every build configures all six projects now, which costs well under a second.
#
# The configuration cache is NOT switched on here, yet: CI opts in with `--configuration-cache`
# (ci.yml, e2e.yml), and a local build can do the same. It was held off because the refreshVersions
# settings plugin is not configuration-cache compatible; that plugin is now applied only under
# `-PrefreshVersions` (settings.gradle.kts), so what remains is a soak in CI before the default
# flips. `./gradlew refreshVersions -PrefreshVersions` must keep running WITHOUT the cache.
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/heapdump.hprof
# NB: the Tomcat security override deliberately does NOT live here. It used to (pinned at
# 11.0.23), but build.gradle.kts later grew its own `extra["tomcat.version"]` alongside the
# PostgreSQL and Netty overrides, and that assignment runs after gradle.properties is loaded —
# so the build-script value silently won and this file's number was dead weight that merely
# read as authoritative. Both pins now live together in the root build.gradle.kts, where the
# comment explaining each CVE sits next to the version it pins.
