name: E2E Cache Probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/e2e-cache-probe.yml

permissions:
  contents: read

concurrency:
  group: e2e-cache-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_REPO: ghcr.io/krt-profit/basetool-e2e-cache

jobs:
  baseline:
    name: Probe (no cache, docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the four E2E images one after another
        run: |
          set -euo pipefail
          printf '| scenario | image | seconds |\n|---|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
          measure() {
            local name="$1" start end
            shift
            start=$(date +%s)
            docker build "$@" --tag "probe-${name}:local" . > "/tmp/${name}.log" 2>&1 || { tail -n 50 "/tmp/${name}.log"; exit 1; }
            end=$(date +%s)
            printf '| baseline | %s | %s |\n' "$name" "$((end - start))" >> "$GITHUB_STEP_SUMMARY"
            echo "${name}: $((end - start)) s"
          }
          measure backend --file docker/app/Dockerfile --build-arg MODULE=backend
          measure frontend --file docker/app/Dockerfile --build-arg MODULE=frontend
          measure ingest --file docker/app/Dockerfile --build-arg MODULE=ingest
          measure keycloak --file docker/sandbox/keycloak/Dockerfile

  cold:
    name: Probe (registry cache, cold)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cache export only
        env:
          SCENARIO: cold
          CACHE_FROM: 'false'
        run: bash .github/scripts/e2e_cache_probe.sh

  warm-same:
    name: Probe (registry cache, warm, same commit)
    needs: cold
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cache import and export
        env:
          SCENARIO: warm-same
          CACHE_FROM: 'true'
        run: bash .github/scripts/e2e_cache_probe.sh

  warm-changed:
    name: Probe (registry cache, warm, changed sources)
    needs: warm-same
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Change one source file per app module
        run: |
          set -euo pipefail
          for module in backend frontend ingest; do
            date +%s%N > "${module}/src/main/resources/e2e-cache-probe.txt"
          done

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cache import and export
        env:
          SCENARIO: warm-changed
          CACHE_FROM: 'true'
        run: bash .github/scripts/e2e_cache_probe.sh
