name: Flyway Migrations

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyway-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-numbering:
    name: Check migration version numbering
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch base branch tip
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}"

      - name: Self-test the migration checker
        shell: bash
        run: |
          chmod +x scripts/check-flyway-migrations.test.sh
          scripts/check-flyway-migrations.test.sh

      - name: Validate Flyway migration numbering
        shell: bash
        env:
          FLYWAY_BASE_REF: origin/${{ github.base_ref }}
        run: |
          chmod +x scripts/check-flyway-migrations.sh
          scripts/check-flyway-migrations.sh
