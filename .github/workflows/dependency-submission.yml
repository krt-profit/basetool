name: Dependency Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Both jobs skip in the merge queue; the skipped review reports the required check as passed.
  merge_group:
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  submit:
    name: Submit the Gradle dependency graph
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'merge_group'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'

      - name: Submit the resolved dependencies
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          additional-arguments: --dependency-verification lenient

  review:
    name: Dependency review
    needs: submit
    if: >-
      always() && github.event_name == 'pull_request'
      && (needs.submit.result == 'success' || needs.submit.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review the dependency changes against the GitHub Advisory Database
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          license-check: false
