name: Keycloak Provisioner

# Self-tests the two Keycloak provisioners on every PR that touches either of them:
#
#   scripts/provision-keycloak-mobile-client.py  - the mobile client and its DPoP policy
#   scripts/provision-keycloak-realm.py          - the whole Basetool-owned part of a realm,
#                                                  brought to the production shape
#
# What the tests protect is not the happy path but things that fail silently on a real server:
# the two Keycloak client-policy endpoints replace realm-global lists wholesale, so a merge bug
# deletes an unrelated policy without a word; the write order is load-bearing because Keycloak
# refuses every admin edit to a client while the DPoP policy is attached to it (ADR-0131,
# REQ-SEC-030); and the realm provisioner must write nothing on a dry run, nothing on a second
# apply, never delete what only the target realm has, and never print or send back a secret.
#
# The logic lives in the two *.test.sh scripts, which drive each provisioner against a stubbed
# kcadm — no Docker, no Keycloak, no network, a few seconds each. Run them locally before pushing:
#
#   scripts/provision-keycloak-mobile-client.test.sh
#   scripts/provision-keycloak-realm.test.sh
#
# The realm provisioner imports the mobile one (the Android client has one definition), so a
# change to the mobile script runs both suites.
#
# Like deploy-script.yml this workflow IS path-filtered: it is not a required check in the branch
# ruleset, so a skipped run cannot hang a PR, and the scripts under test only change when one of
# these files changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/provision-keycloak-mobile-client.py"
      - "scripts/provision-keycloak-mobile-client.test.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/provision-keycloak-realm.test.sh"
      - ".github/workflows/keycloak-provisioner.yml"
  push:
    branches: [main]
    paths:
      - "scripts/provision-keycloak-mobile-client.py"
      - "scripts/provision-keycloak-mobile-client.test.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/provision-keycloak-realm.test.sh"
      - ".github/workflows/keycloak-provisioner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-provisioner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: provisioner self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run provisioner self-tests
        shell: bash
        run: |
          chmod +x scripts/provision-keycloak-mobile-client.py \
                   scripts/provision-keycloak-mobile-client.test.sh
          scripts/provision-keycloak-mobile-client.test.sh

  realm-selftest:
    name: realm provisioner self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the provisioners
        shell: bash
        run: python3 -m py_compile scripts/provision-keycloak-realm.py scripts/provision-keycloak-mobile-client.py

      - name: Run realm provisioner self-tests
        shell: bash
        run: |
          chmod +x scripts/provision-keycloak-realm.py scripts/provision-keycloak-realm.test.sh
          scripts/provision-keycloak-realm.test.sh
