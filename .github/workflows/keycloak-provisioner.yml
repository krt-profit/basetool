name: Keycloak Provisioner

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/provision-keycloak-mobile-client.py"
      - "scripts/provision-keycloak-mobile-client.test.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/provision-keycloak-realm.test.sh"
      - "scripts/harden-keycloak-realm.py"
      - "scripts/harden-keycloak-realm.integration.py"
      - "scripts/keycloak/**"
      - ".github/workflows/keycloak-provisioner.yml"
  push:
    branches: [main]
    paths:
      - "scripts/provision-keycloak-mobile-client.py"
      - "scripts/provision-keycloak-mobile-client.test.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/provision-keycloak-realm.test.sh"
      - "scripts/harden-keycloak-realm.py"
      - "scripts/harden-keycloak-realm.integration.py"
      - "scripts/keycloak/**"
      - ".github/workflows/keycloak-provisioner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-provisioner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: provisioner self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run provisioner self-tests
        shell: bash
        run: |
          chmod +x scripts/provision-keycloak-mobile-client.py \
                   scripts/provision-keycloak-mobile-client.test.sh
          scripts/provision-keycloak-mobile-client.test.sh

  realm-selftest:
    name: realm provisioner self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile the provisioners
        shell: bash
        run: |
          python3 -m py_compile scripts/provision-keycloak-realm.py scripts/provision-keycloak-mobile-client.py
          python3 -m py_compile scripts/harden-keycloak-realm.py scripts/harden-keycloak-realm.integration.py
          python3 -m py_compile scripts/keycloak/hardening_probe.py

      - name: Run the realm hardening self-test
        shell: bash
        run: python3 scripts/harden-keycloak-realm.py --selftest

      - name: Run realm provisioner self-tests
        shell: bash
        run: |
          chmod +x scripts/provision-keycloak-realm.py scripts/provision-keycloak-realm.test.sh
          scripts/provision-keycloak-realm.test.sh
