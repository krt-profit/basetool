name: Repo Lint

# Lints the repository's non-Java assets that the Gradle build does not cover:
#   - shellcheck -> the server-side / helper shell scripts under scripts/
#                   (deploy.sh runs on the production host; a quoting bug there
#                   is a production incident, not a style nit).
#   - actionlint -> the GitHub Actions workflows themselves, incl. shellcheck
#                   over every embedded `run:` script (catches workflow-syntax
#                   and shell bugs before they burn a CI run to discover them).
#   - zizmor     -> the workflows' SECURITY, where actionlint covers their shape: persisted
#                   credentials, template injection, over-broad permissions, cache poisoning.
#   - hadolint   -> the three multi-stage production Dockerfiles.
#   - cosign-identity -> every copy of the cosign signer-identity regexp is anchored and they
#                   all agree (promote, promote-testing, the release reuse gate, deploy.sh).
#   - probe-vs-allowlist -> the nightly edge probe and the vhost allow-list runbook
#                   describe one surface from two sides; a refusal row for a path the
#                   allow-list admits is a contradiction provable without production.
#   - sbom-coverage -> every shipped Gradle module is wired for a CycloneDX
#                   SBOM end to end: plugin, committed file, regenerated at
#                   release time, attested and attached to the Release.
#   - e2e-gate-mirror -> e2e.yml states one decision twice (the job gate and the
#                   concurrency selector that has to predict it); a selector
#                   looser than its gate silently stops the suite from running.
#   - adr-numbering -> no two ADRs share a number, and a new one does not take
#                   a number the base already holds. Parallel branches each
#                   pick "the next free number" from their own checkout, so two
#                   of them land on the same one; 0154 named two accepted
#                   decisions on main for eleven days before anyone noticed.
#   - adr-registry -> docs/adr/README.md still agrees with docs/adr/: every ADR
#                   has an index row, every row links to a real decision, and
#                   every row renders as three cells. adr-numbering reads
#                   filenames, so nothing read the index at all -- 0192-0194 sat
#                   unindexed, and three rows contained an unescaped "|" that
#                   Markdown read as a cell separator, putting their status in
#                   the wrong column.
#   - alloy-log-masking -> the PII masks in monitoring/alloy/config.alloy. Alloy's
#                   stage.replace overwrites EVERY capture group and expands no
#                   back-references, so the natural way to write a mask destroys
#                   the field name and writes the literal "${1}***${1}***" into
#                   Loki. Eight of the fourteen stages were written that way from
#                   the day they were added; it took reading a production log
#                   export by hand on 2026-09-20 to notice.
#
# Each linter runs from its pinned release binary, verified against a pinned
# SHA-256 (shellcheck ships preinstalled on the runner; zizmor is hash-pinned
# through pip), so no third-party action enters the supply chain and the tool
# version is explicit + Dependabot-free (bump the version AND its digest
# together). Every job is independent and blocks the PR on findings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repo-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest. Lint every tracked *.sh
      # (not just scripts/) so a future script anywhere is covered automatically.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts tracked; nothing to lint."
            exit 0
          fi
          printf 'Linting %d script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz, from the release's
      # actionlint_<version>_checksums.txt. Bump BOTH together (audit item CI-SEC-12).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      # actionlint shells out to the preinstalled shellcheck for every embedded
      # `run:` script, so workflow YAML and the bash inside it are both linted.
      - name: Run actionlint
        run: actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned through pip rather than a checksummed tarball, because zizmor's release
      # publishes no checksums; the reasoning lives in .github/requirements/zizmor.txt.
      - name: Install zizmor
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            --require-hashes -r .github/requirements/zizmor.txt
          zizmor --version

      # actionlint checks that a workflow is well-formed; zizmor checks that it is safe: a
      # credential persisted into the workspace, an attacker-controlled `${{ }}` pasted into a shell,
      # a permission broader than the job uses, a cache a release is built from (audit item
      # CI-SEC-15). Medium severity and up fails; every finding that is deliberately accepted is in
      # .github/zizmor.yml with its reason.
      #
      # GH_TOKEN switches zizmor out of offline mode, which enables the audits that ask GitHub about
      # the pinned actions -- `known-vulnerable-actions` and `impostor-commit` among them. It is this
      # job's read-only token; nothing is written.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        # `--config` explicitly: zizmor only discovers .github/zizmor.yml on its own when it is
        # handed the repository root, and handed the two directories it silently ran without the
        # accepted-findings list (measured locally with 1.30.1).
        run: >-
          zizmor --config .github/zizmor.yml --persona=regular --min-severity=medium
          --format=plain .github/workflows .github/actions

  cosign-identity:
    name: cosign-identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REQ-OPS-015 says the CI half and the host half of the signature gate "cannot diverge", and
      # until 2026-09-22 that was a sentence: four hand-written copies of the signer-identity
      # regexp, all unanchored, so a signature minted on `refs/heads/main-x` or `refs/tags/vfoo`
      # verified everywhere (audit item CI-SEC-01). The checker asserts every copy is anchored, the
      # copies are identical, and they accept and refuse the right subjects. The self-test runs
      # first, so the gate cannot pass vacuously.
      - name: Self-test the identity checker
        run: bash scripts/check-cosign-identity.test.sh

      - name: Check the cosign signer identity
        run: python3 scripts/check-cosign-identity.py

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HADOLINT_VERSION: 2.14.0
      # SHA-256 of hadolint-Linux-x86_64, from the release's hadolint-Linux-x86_64.sha256. Bump
      # BOTH together (audit item CI-SEC-12).
      HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint
        run: |
          set -euo pipefail
          url="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          curl -fsSL "$url" -o /tmp/hadolint
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      # Threshold lives in .hadolint.yaml (warning) so local + CI agree.
      #
      # All THREE production Dockerfiles. `ingest` was missing until 2026-09-04 and
      # nobody noticed, because it is the one image with no HEALTHCHECK and the
      # shortest runtime stage -- so it never produced a finding to be missed. It is
      # promoted and vulnerability-scanned exactly like the other two (REQ-OPS-024),
      # which is the list this should have matched all along.
      - name: Run hadolint
        run: hadolint backend/Dockerfile frontend/Dockerfile ingest/Dockerfile

  logging-facade:
    name: logging-facade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `CLAUDE.md` says "@Slf4j - never instantiate loggers manually", and production code has
      # always honoured it, but nothing checked. `lombok.config` enforces the neighbouring half
      # (which Lombok logging annotation is allowed, per module) at compile time; a hand-written
      # `LoggerFactory.getLogger(...)` sails past that, because it is not a Lombok annotation at
      # all. A hand-rolled field is where the logger NAME drifts from its declaring class - a
      # copy-pasted `.class` literal - which silently misroutes the line against the per-logger
      # levels in logback-spring.xml.
      #
      # The self-test runs first so the check can never pass vacuously. Its load-bearing cases are
      # the false-positive guards: the 33 log-CAPTURE tests and the Playwright suite's deliberate
      # console output must stay green, or the gate would be red on a clean tree.
      - name: Self-test the logging-facade checker
        run: scripts/check-logging-facade.test.sh

      - name: Check the logging facade
        run: scripts/check-logging-facade.sh

  pid1-reaping:
    name: pid1-reaping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled python3, like every other script in .github/scripts — no
      # setup-python action, so there is no extra pinned SHA to maintain. PyYAML ships with the
      # ubuntu-latest image; the fallback keeps the job working if that ever stops being true.
      - name: Ensure PyYAML
        run: |
          set -eu
          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            pip3 install --disable-pip-version-check 'pyyaml==6.0.3'
          fi
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      # REQ-OPS-019. A wget-HTTPS healthcheck forks an `ssl_client` per probe; with no init as PID 1
      # it is never reaped and fills the service's `pids` cgroup cap until every fork is refused.
      # This shipped twice (ingest 2026-07-12 native-thread OOM, grafana 2026-07-26 unhealthy for two
      # days) — both times silently, because nothing failed until the cap was already gone. The
      # self-test runs first so the check can never pass vacuously: it asserts the detector still
      # distinguishes forking from non-forking probes AND still resolves the image-level HEALTHCHECK
      # out of the Dockerfiles (the dev-profile services have no compose healthcheck at all, so a
      # broken resolver would silently exempt them).
      - name: Self-test the detector
        run: python3 .github/scripts/check_pid1_reaping.py --selftest

      - name: Check PID-1 reaping invariant
        run: python3 .github/scripts/check_pid1_reaping.py

  e2e-gate-mirror:
    name: e2e-gate-mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure PyYAML
        run: |
          set -eu
          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            pip3 install --disable-pip-version-check 'pyyaml==6.0.3'
          fi
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      # REQ-OPS-027 / ADR-0169. `e2e.yml` decides "does this event run the Playwright suite?" in
      # two places, because GitHub evaluates the concurrency group when the run is CREATED and the
      # job gate only afterwards -- so the group has to predict the gate, and does it by embedding
      # the gate expression verbatim. A group looser than its gate lets a run that will skip cancel
      # the run that would have executed, and the suite silently never runs: #1537 and #1871 both
      # reached a green board with no end-to-end coverage that way, behind cancelled runs that
      # `gh pr checks` paints as `fail`. Nothing in a diff shows that, so it is asserted here.
      #
      # The self-test runs first so the gate can never pass vacuously -- a checker that stopped
      # resolving the workflow would otherwise report "no problems" forever.
      - name: Self-test the gate-mirror checker
        run: python3 .github/scripts/check_e2e_gate_mirror.py --selftest

      - name: Check the e2e concurrency selector against its job gate
        run: python3 .github/scripts/check_e2e_gate_mirror.py

  conformance-selftest:
    name: conformance-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Phase 0 of docs/archive/PODMAN_MIGRATION_PLAN.md. `scripts/check-conformance.py` asserts the
      # deployment's invariants against a RUNNING host -- the client address the edge really
      # sees, the certificate handover, container metrics, log streams -- and it is the gate the
      # container-runtime migration is measured against. It cannot run here: it needs the host.
      #
      # Its SELF-TEST can, and it is the half that decays silently. A check that cannot go red is
      # decoration, and a check that goes red for the wrong reason is worse, because it reads as
      # proof. The harness breaks every registered check on purpose, requires each failure to
      # carry the right message, and fails if any check has no demonstrated red scenario -- so
      # adding a check and forgetting to break it blocks the PR instead of quietly weakening the
      # net. Needs only python3, openssl and loopback; no host, no daemon, no secrets.
      - name: Self-test the conformance suite
        run: bash scripts/check-conformance.test.sh

  cgroup-metrics-selftest:
    name: cgroup-metrics-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Phase 4 of docs/archive/PODMAN_MIGRATION_PLAN.md. `scripts/cgroup-container-metrics.py` reads
      # container metrics straight out of cgroup v2 and writes them for node_exporter's textfile
      # collector -- because under rootless Podman there is no cAdvisor, and the exporter that
      # replaces it publishes no OOM counter, no CPU-throttling series and no pids ceiling. All
      # three are in the kernel and always were.
      #
      # The values feed alerts, so a silent parsing bug is an alert that never fires, which looks
      # exactly like a healthy system. The self-test builds a fake cgroup tree carrying the states
      # a healthy host never shows -- a prior OOM kill, a throttled cgroup, an unlimited one -- and
      # asserts the output, then has promtool confirm Prometheus accepts it rather than trusting
      # that it looks like exposition format. No kernel, no containers, no privileges.
      - name: Self-test the cgroup metrics collector
        run: bash scripts/cgroup-container-metrics.test.sh

  cert-expiry-selftest:
    name: cert-expiry-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `scripts/cert-expiry-metrics.py` reports the expiry of certificate FILES, because a
      # blackbox probe can only see a certificate something is SERVING -- and the internal CA is
      # served by nothing while being the trust anchor for every verified upstream at the edge AND
      # for the https_internal probe module. Measured on the testing host 2026-09-20: it was the
      # only certificate in the monitoring plane with no coverage of any kind.
      #
      # It is gated because the single label that decides between a 14-day and a 90-day deadline,
      # `self_signed`, is a string comparison over openssl output, and neither way of getting it
      # wrong looks like a failure: a CA marked CA-issued gets fourteen days for work that takes
      # longer, and a leaf marked self-signed pages three months early until it is ignored.
      #
      # The self-test mints its own material, embeds one long-dead certificate so the
      # already-expired case runs on THIS runner rather than only where openssl is 3.5+, and
      # asserts the DN is RFC 2253 -- openssl's default form differs between 3.0 and 3.5 for the
      # same file, which would retire every series on an upgrade. No host, no containers, no
      # secrets.
      - name: Self-test the certificate expiry collector
        run: bash scripts/cert-expiry-metrics.test.sh

  container-runtime-selftest:
    name: container-runtime-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Phase 3 of docs/archive/PODMAN_MIGRATION_PLAN.md. `scripts/lib/container-runtime.sh` is the seam
      # between the operational scripts and the container runtime, and it exists because BOTH
      # shapes are live at once: production serves on Docker until the cutover, the testing host
      # serves on Podman now. A change that only works on one of them breaks the other silently,
      # and the one that breaks is whichever nobody ran that day.
      #
      # So every behaviour is asserted twice, against stubbed CLIs on PATH — including the ones
      # that are easy to get wrong and impossible to see: that resolving a tag never PULLS, that a
      # failed start is reported as a failure (which is what the health gate and the rollback hang
      # off), that pruning never reaches a volume, and that the registry password is piped rather
      # than passed on a command line.
      - name: Self-test the container-runtime seam
        run: bash scripts/container-runtime.test.sh

  render-env-d-selftest:
    name: render-env-d-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Phase 2 of docs/archive/PODMAN_MIGRATION_PLAN.md. `scripts/render-env-d.py` fills the per-service
      # environment templates from the host `.env`. Under compose this interpolation was compose's
      # own; under Quadlet there is no compose, so it is code -- and it is code whose failure mode
      # is silence. A variable that renders empty does not stop a container: postgres starts on its
      # built-in defaults, in the wrong directory, on the wrong port, behind a health check that can
      # never pass, and the whole thing reads as a database that is simply unwell.
      #
      # So the half worth gating is the refusal. The suite asserts that a missing ${NAME:?...}
      # aborts the run, names every missing variable rather than the first, and leaves NO file
      # behind -- plus the semantics compose defines (`:-` versus `-`, nesting, a `$` inside a
      # secret) and that the generated header's own ${...} EXAMPLES survive un-interpolated.
      # Needs only python3 and bash; no host, no containers, no secrets.
      - name: Self-test the environment renderer
        run: bash scripts/render-env-d.test.sh

      # The templates in the tree must still render against a complete .env. This catches a
      # generator change that emits a reference the renderer cannot resolve, which would otherwise
      # only surface on the host at deploy time.
      - name: Render the real templates against a synthetic complete .env
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          required = set()
          for name in os.listdir("quadlet/env.d"):
              if not name.endswith(".env.tmpl"):
                  continue
              for line in open(os.path.join("quadlet/env.d", name), encoding="utf-8"):
                  if line.lstrip().startswith("#"):
                      continue
                  required.update(re.findall(r"\$\{([A-Za-z_][A-Za-z0-9_]*):\?", line))
          pathlib.Path("synthetic.env").write_text(
              "".join(f"{k}=ci-{k.lower()}\n" for k in sorted(required)), encoding="utf-8")
          print(f"synthetic .env carries {len(required)} required variable(s)")
          PY
          python3 scripts/render-env-d.py \
            --env synthetic.env --templates quadlet/env.d --out rendered
          echo "--- assignment lines still carrying an unresolved reference (must be none) ---"
          # The needle is written "\${" rather than '${' so it is plainly a literal two-character
          # string to shellcheck as well as to a reader. Comment lines are excluded first: the
          # generated header documents the ${NAME:-default} forms BY EXAMPLE, and matching those
          # would report every file as broken.
          if grep -h -E '^[A-Za-z_][A-Za-z0-9_]*=' rendered/*.env | grep -F "\${"; then
            echo "::error title=render-env-d::a rendered assignment still contains \${...}"
            exit 1
          fi
          echo "none"

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ADR-0188. `ansible/` provisions hosts; it never deploys, and REQ-OPS-001's pull-only
      # delivery is untouched by it. The role is the reason "production is built from the same
      # procedure as testing" can be asserted rather than hoped for, so it is worth having CI
      # notice when it stops parsing -- it cannot be exercised against a real host here, and an
      # unrunnable role is discovered at the worst possible moment otherwise.
      # The galaxy fetch is retried; the pip install is not. Only one of them talks to a service
      # that has been observed dropping the connection mid-request:
      #
      #   [ERROR]: Unknown error when attempting to call Galaxy at
      #   'https://galaxy.ansible.com/api/v3/collections/ansible/posix/':
      #   <urlopen error [Errno 104] Connection reset by peer>
      #
      # (2026-09-20, PR #1933). The job died in this step, so ansible-lint never ran and the gate
      # reported a lint failure for a network hiccup. That is the worst shape a gate can have: it
      # sends whoever reads it looking for a finding that does not exist, and after a few of those
      # a red ansible-lint stops meaning anything — the same reasoning the .gitattributes and
      # dead-alert notes elsewhere in this repository turn on.
      #
      # Three attempts with a widening pause, matching release-images.yml's cosign retry. A genuine
      # failure — a collection that does not exist, a version that cannot be satisfied — fails all
      # three and still stops the build; only the transient is absorbed.
      # ansible-core and ansible-lint are pinned by version (audit item CI-SEC-12): unpinned, every
      # run linted with whatever PyPI served that minute, so a new ansible-lint rule could turn the
      # gate red on a diff that touched nothing under ansible/, and nothing recorded which version
      # had passed. Bump them together, by hand, and re-run the job.
      - name: Install ansible-core, ansible-lint and the pinned collections
        env:
          ANSIBLE_CORE_VERSION: 2.21.4
          ANSIBLE_LINT_VERSION: 26.9.0
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --quiet \
            "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
          ansible --version | head -n 1
          ansible-lint --version
          attempts=3
          delay=10
          for i in $(seq 1 "${attempts}"); do
            if ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections; then
              exit 0
            fi
            if [ "${i}" -lt "${attempts}" ]; then
              echo "::warning::ansible-galaxy attempt ${i}/${attempts} failed; retrying in ${delay}s"
              sleep "${delay}"
              delay=$(( delay * 2 ))
            fi
          done
          echo "::error title=ansible-galaxy::collection install failed ${attempts} times" >&2
          exit 1

      # `-i localhost,` rather than the committed example: an inventory file named
      # *.example is not recognised by extension, so ansible falls back to scanning and
      # buries a real error in parser warnings.
      - name: Syntax-check the playbook
        working-directory: ansible
        run: ansible-playbook -i localhost, --syntax-check site.yml

      - name: Lint the role
        working-directory: ansible
        run: ansible-lint

  quadlet-drift:
    name: quadlet-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure PyYAML
        run: |
          set -eu
          python3 -c "import yaml" 2>/dev/null || pip3 install --disable-pip-version-check 'pyyaml==6.0.3'

      # Phase 2 of docs/archive/PODMAN_MIGRATION_PLAN.md. quadlet/ holds the unit files the migration
      # replaces docker-compose.yml with, and for as long as BOTH exist the compose file is
      # authoritative -- so the units are generated from it and this asserts they still match.
      #
      # Without the assertion the two drift silently: a digest bump, a new network membership or a
      # changed memory limit would land in compose and not in the units, and nothing would notice
      # until a host ran the stale one. A unit that starts is not a unit that is right.
      - name: Check the Quadlet units against the compose files
        run: python3 scripts/generate-quadlet.py --check

      # The drift check above compares the generator against ITS OWN OUTPUT, so a translation that
      # is uniformly wrong is uniformly consistent and reports clean. Four defects reached the tree
      # behind that green check (PR #1933 review, 2026-09-18): an exec-form healthcheck re-joined
      # into an unquoted shell string, `Notify=healthy` with no start timeout, raw systemd `%`
      # specifiers copied into `Exec=` -- measured LIVE, both databases were running with a
      # corrupted log_line_prefix -- and a prefix-unsafe variable rewrite. None of them is visible
      # by diffing the generator against itself; all four are properties of the translation, which
      # is what this asserts.
      - name: Self-test the Quadlet generator's translation
        run: bash scripts/generate-quadlet.test.sh

  probe-vs-allowlist:
    name: probe-vs-allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Five times an admission was written into the runbook while the probe kept its old
      # refusal row, and every time the nightly cron on main was the first to say so -- as a red
      # run that reads like edge drift when it is really a stale table: bank/deposits (phase O),
      # hangar/import/fleetview (phase X), the participant check-in (2026-09-08), and
      # refinery-orders/all plus materials/{id} (2026-09-09). The existing probe-table conflict
      # check catches one path given two codes in the SAME file; this catches one code in each of
      # two files, which is the shape all five had. It needs no production access: 404 is the
      # vhost's own refusal, so a 404 row on an admitted path is a contradiction between two
      # files in this repository.
      - name: Check the edge probe against the vhost allow-list
        run: python3 .github/scripts/check_probe_against_allowlist.py

  frontend-image-lint-exclusions:
    name: frontend-image-lint-exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # frontend/Dockerfile runs `:frontend:build` with every lint task excluded BY NAME, because
      # the image has no Node toolchain to run them with. So a task wired into `check` is silently
      # added to the image build too. `lintCssInline` was, on 2026-09-13, and the failure mode is as
      # indirect as it gets: the image build failed, the e2e stack's `up --wait` never saw a healthy
      # service, and all 94 e2e classes reported `initializationError` with the real cause visible
      # only inside compose-up.log in the uploaded artifact. Nothing in the build output said lint.
      - name: Self-test the comparison
        run: python3 .github/scripts/check_frontend_image_lint_exclusions.py --selftest

      - name: Check the frontend image excludes every Node-based task
        run: python3 .github/scripts/check_frontend_image_lint_exclusions.py

  e2e-device-matrix:
    name: e2e-device-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The E2E matrix's `device:` axis and TouchClassLayoutE2eTest's DEVICE_CLASSES are verbatim
      # copies of one another, and only ONE of the two drift directions is loud. A device the
      # workflow names and the test does not fails the job with the sweep's own message; a class
      # added to the test and forgotten in the workflow is measured by nobody, while the coverage
      # assertion inside each runner is satisfied by the single class that runner was given. The
      # touch-class work has already been through exactly this with `PAGES`, which was short by
      # seventeen routes while its Javadoc and REQ-UI-009 both called it complete.
      - name: Self-test the comparison
        run: python3 .github/scripts/check_e2e_device_matrix.py --selftest

      - name: Check the E2E device matrix against DEVICE_CLASSES
        run: python3 .github/scripts/check_e2e_device_matrix.py

  app-version:
    name: app-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The resolver asks whether a tag exists, so a shallow clone with no
          # tags would make every case look like "not released yet".
          fetch-depth: 0
          persist-credentials: false

      # The version string in the footer is the one kind of output that cannot be
      # wrong loudly, and it WAS wrong: since ADR-0137 the tag run re-tags instead
      # of rebuilding, so `git describe` is evaluated on `main` before the release
      # tag exists and the release commit described itself as the PREVIOUS release
      # plus nine commits. The resolver reads the version from the CHANGELOG in
      # that one case; this asserts every branch of it, including that one.
      - name: Self-test the version resolver
        run: python3 .github/scripts/app_version.py --selftest

  sbom-coverage:
    name: sbom-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REQ-OPS-025. The published SBOM set is read as "these are the components of this release",
      # so a module missing from it does not read as missing -- it reads as absent from the product.
      # It had drifted both possible ways by v1.7.3, and neither drift failed anything: `ingest`
      # had a committed BOM that no release workflow regenerated, so it aged from 2026-07-11 and
      # shipped 126 stale component versions while never being attached to a Release at all; and
      # `keycloak-spi`, whose provider JAR promote.yml pushes to the production Keycloak, had no
      # SBOM whatsoever. Four lists in four files had to agree by hand, and did not. This asserts
      # them against settings.gradle.kts instead, so a new module fails here until somebody decides
      # whether it ships -- the decision both drifts skipped.
      - name: Check SBOM coverage of every shipped module
        run: python3 .github/scripts/check_sbom_coverage.py

  adr-numbering:
    name: adr-numbering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 so the checker can compute the merge-base against the
          # base branch; a shallow checkout has none and the base-collision
          # check would silently degrade to "no new ADRs".
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch tip
        if: github.event_name == 'pull_request'
        # Brings the base into origin/<base_ref> so the checker can resolve both
        # the ref and the merge-base against it. Compared against the freshly
        # fetched tip rather than the PR event's base.sha, so a number that
        # landed on main after the PR opened is caught on the next re-run.
        # Through the environment, not `${{ }}` in the script: a branch name is attacker-chosen
        # text, and an expression is pasted into the shell before it runs (zizmor
        # `template-injection`).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}"

      # The suite runs FIRST so the gate can never pass vacuously: it asserts
      # that a duplicate, a number already held on the base, and an inherited
      # duplicate all still fail, while a squash-merge-in-flight and an ADR
      # filling a gap BELOW the base tip still pass. That last one is what
      # separates this from the Flyway checker -- an open PR routinely holds a
      # number main has already passed, and rejecting it would be churn.
      - name: Self-test the ADR numbering checker
        # chmod first, like the other script-backed gates: this repo is
        # developed on Windows where core.filemode=false, so the executable bit
        # is easy to lose on a re-add and the job would die with exit 126.
        run: |
          chmod +x scripts/check-adr-numbering.sh scripts/check-adr-numbering.test.sh
          scripts/check-adr-numbering.test.sh

      # On push-to-main ADR_BASE_REF is empty, so only the duplicate check runs
      # -- which is the point: it is the one check that sees a duplicate that
      # has already landed, and it makes main go red the same day rather than
      # eleven days later. ADR-0171.
      - name: Check ADR numbering
        env:
          ADR_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/check-adr-numbering.sh

  adr-registry:
    name: adr-registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The sibling `adr-numbering` job reads FILENAMES only, so until now nothing read
      # docs/adr/README.md at all -- and both ways that bites have already happened.
      #
      # 0192, 0193 and 0194 reached main with no index row; the table jumped 0191 -> 0195 and
      # stayed that way until 2026-09-22 (#1963). To the numbering gate an unindexed ADR is a
      # perfectly well-numbered one.
      #
      # And 0123, 0137 and 0140 each carried an UNESCAPED `|` in their prose. GFM splits a row on
      # every unescaped pipe before it parses inline syntax, so the backticks all three sat inside
      # were no shelter -- and because GFM keeps the first three cells and DISCARDS the excess, the
      # `Accepted` status was not merely shifted, it was dropped: the status column rendered a
      # fragment of the prose instead, or blank for 0123, whose `||` produced an empty cell.
      # It is invisible by eye -- the table is padded to a fixed width, so a broken row looks
      # exactly like an intact one -- and 0137 escaped the pipe correctly in one place and not in
      # the other, in the SAME row.
      #
      # The self-test runs first so the gate can never pass vacuously. Its load-bearing case is the
      # false-positive guard: a legitimately ESCAPED `\|` must stay green, or the gate would be red
      # on a clean tree from the day it merged.
      - name: Self-test the ADR registry checker
        # chmod first, like the other script-backed gates: this repo is developed on Windows where
        # core.filemode=false, so the executable bit is easy to lose on a re-add and the job would
        # die with exit 126.
        run: |
          chmod +x scripts/check-adr-registry.sh scripts/check-adr-registry.test.sh
          scripts/check-adr-registry.test.sh

      - name: Check the ADR registry
        run: scripts/check-adr-registry.sh

  monitoring-image-pins:
    name: monitoring-image-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot bumps the image tags in docker-compose.monitoring.yml; nothing used to update the
      # docs that quote them. That drifted unnoticed for months — on 2026-08-02 the monitoring
      # runbook's version table was stale on 8 of 12 rows. The tables lost their hand-maintained
      # Version column in the same change (a copy of the compose file cannot stay true, and it never
      # described the RUNNING container anyway), but the runbooks still pin tags inside COPY-PASTEABLE
      # commands — `docker run ... grafana/alloy:<tag> fmt /cfg/config.alloy`. Those must stay pinned
      # to be reproducible, and a stale one is the sharper hazard: the command still succeeds, just
      # against a binary that is not deployed, so the wrong answer is silent. This gate keeps them
      # honest. `--fix` rewrites every drifted pin in one go. Since 2026-08-16 the scan covers every
      # tracked text file rather than only Markdown: the same command sits in the header of each
      # promtool test under monitoring/prometheus/tests/, where nothing gated it, and nine of the ten
      # files there had drifted across three Prometheus versions.
      - name: Check documented monitoring image pins
        # chmod first, mirroring the migration-numbering gate: this repo is developed on Windows
        # where `core.filemode=false`, so a local `chmod +x` is not recorded and the executable bit
        # is easy to lose on a re-add. Without this the job dies with exit 126 before running a
        # single check -- which is how it failed the first time.
        run: |
          chmod +x scripts/check-monitoring-image-pins.sh
          scripts/check-monitoring-image-pins.sh

  grafana-dashboards:
    name: grafana-dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 13 provisioned dashboards had NO validation of any kind until 2026-08-29 (#1708) — not a
      # Gradle test, not a CI job, not a lint script. Every way they can be wrong is silent: invalid
      # JSON makes Grafana skip the dashboard with only a line in its own startup log, a duplicate
      # uid makes provisioning last-writer-wins so one dashboard replaces another, and an
      # unprovisioned datasource uid renders "Datasource not found" on every panel — which reads as
      # "no data" to anyone not looking closely. This is the dashboard half of what #1707 found in
      # the alert rules: a monitoring surface nothing checks drifts silently, and its silence is
      # indistinguishable from health.
      #
      # The suite runs FIRST so the gate can never pass vacuously: it asserts each failure mode is
      # still detected, including a panel nested in a collapsed row, before the repository's own
      # dashboards are checked.
      - name: Self-test the dashboard checker
        run: |
          chmod +x scripts/check-grafana-dashboards.py scripts/check-grafana-dashboards.test.sh
          scripts/check-grafana-dashboards.test.sh

      - name: Check provisioned Grafana dashboards
        run: python3 scripts/check-grafana-dashboards.py

  alloy-log-masking:
    name: alloy-log-masking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REQ-OBS-007. Alloy's `stage.replace` does not substitute the match and expands no
      # back-references: it walks EVERY capture group and overwrites each one with the literal
      # `replace` value. So the natural way to write a mask -- keep the field name in group 1 so it
      # survives, `(username=)(\S+)` with replace = "${1}***" -- destroys the field name AND prints
      # the template text, and the line reaches Loki as `${1}***${1}***` with nothing left to say
      # which field was scrubbed.
      #
      # Eight of the fourteen stages were written that way, and had been since the day each was
      # added. Nothing failed: the config is valid, `alloy fmt` is happy, the shipper is healthy,
      # the stream is not silent, and the secret really is gone -- the only symptom is the
      # REPLACEMENT text, which no alert and no dashboard reads. It was found on 2026-09-20 by
      # exporting production logs and reading them by hand. The same patterns had a second defect
      # that leaked rather than over-masked (`\S+` stops at the first space, and Keycloak quotes its
      # field values, so a login attempt under a full name reached Loki with the surname intact).
      # Both are fixed; this is what stops them coming back.
      #
      # The self-test runs FIRST so the gate can never pass vacuously, exactly as the
      # grafana-dashboards job above does. It asserts BOTH failure modes are still detected
      # independently -- a stage can destroy a field name with a purely literal replacement, and a
      # stage can emit "${1}" with only one group -- because checking for either alone would have
      # looked sufficient against the real patterns, which had both.
      - name: Self-test the masking checker
        # chmod first, like every other script-backed gate here: this repo is developed on Windows
        # where core.filemode=false, so the executable bit is easy to lose on a re-add and the job
        # would die with exit 126 before running a single check.
        run: |
          chmod +x scripts/check-alloy-log-masking.py scripts/check-alloy-log-masking.test.sh
          scripts/check-alloy-log-masking.test.sh

      - name: Check the Alloy log-masking stages
        run: python3 scripts/check-alloy-log-masking.py

  keycloak-issuer:
    name: keycloak-issuer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The OIDC issuer the apps validate has to be the one Keycloak advertises, and until ADR-0167
      # that was manual discipline: the identity base URL is a literal on ~36 lines across 19 files
      # and nothing compared any two of them. .env.example simply asked the operator to keep them in
      # agreement.
      #
      # The failure is measured rather than imagined (ADR-0166). Keycloak's public base URL is
      # decided by KC_HOSTNAME *and* KC_HTTP_RELATIVE_PATH together: give the hostname as an
      # origin-only URL while the relative path says /auth, and Keycloak SERVES under /auth while
      # ADVERTISING root issuer links. It reports healthy, its discovery document parses, and
      # backend, frontend and ingest all die at start-up on "The Issuer ... did not match the
      # requested issuer" -- which reads as a backend fault. A first draft of ADR-0166 specified
      # exactly that, on the strength of the upstream guide's wording, and only the smoke stack
      # caught it. That is a failed deploy discovered at deploy time.
      #
      # The gate renders every stack through `docker compose config` -- compose's own interpolation,
      # the same code path the deploy uses -- rather than pattern-matching the YAML, for the same
      # reason check-edge-nginx.sh hands its rendered vhosts to a real `nginx -t`. Re-implementing
      # the nested ${A:-${B:-default}} here would be asserting a copy of the thing under test
      # against itself.
      #
      # The suite runs FIRST, as it does for the dashboards above, so the gate can never pass
      # vacuously: it breaks the compose files each way in turn -- including removing the derivation
      # so the issuer stops following the hostname, which today's values hide -- and requires the
      # checker to report each one.
      - name: Self-test the issuer checker
        run: |
          chmod +x scripts/check-keycloak-issuer.py scripts/check-keycloak-issuer.test.sh
          scripts/check-keycloak-issuer.test.sh

      - name: Check the Keycloak issuer agrees across every stack
        run: python3 scripts/check-keycloak-issuer.py

  prometheus-rules:
    name: prometheus-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The alert rules and their promtool unit tests had no gate of any kind until 2026-09-08 —
      # the same hole the grafana-dashboards job above closed for the dashboards, one surface over.
      # 18 test files existed and nothing ran them, so every one of them was a claim rather than a
      # check: monitoring/README.md, REQ-OPS-018 and several ADRs all say a behaviour is "pinned by"
      # a file under monitoring/prometheus/tests/, and none of those sentences was true in CI. The
      # trigger was the RedisRdbStale false positive of 2026-09-08, whose fix ships with exactly
      # such a test.
      #
      # promtool comes out of the pinned prometheus image rather than a release tarball, so the
      # linter version matches the server that will load these rules. Note the --entrypoint: the
      # image starts /bin/prometheus, which rejects `promtool` as "unexpected promtool". The globs
      # are expanded INSIDE the container via `sh -c` — the runner's shell cannot expand a /work
      # path and promtool would exit with "path does not exist".
      - name: Check alert rule syntax
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/monitoring/prometheus:/work" -w /work \
            prom/prometheus:v3.14.0 -c 'promtool check rules alerts/*.yml'

      - name: Run alert rule unit tests
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/monitoring/prometheus:/work" -w /work \
            prom/prometheus:v3.14.0 -c 'promtool test rules tests/*_test.yml'

      # The edge proxy's configuration is a first-class artefact since ADR-0162. It
      # used to live half in NPM's SQLite database and half in a runbook block that
      # a human pasted into a web form, with - in that runbook's own words - "no
      # reconcile job and no drift alarm for it". It is files now, and this is the
      # gate that makes them reviewable rather than merely readable.
      #
      # `nginx -t` is not a syntax check: it parses every include, resolves every
      # limit_req_zone reference by name, rejects an unknown directive and LOADS
      # every certificate. The script mints throwaway certificates for exactly that
      # reason - the real ones are written by the acme container on the production
      # host and must never be in this repository. It also fails on a [warn], so a
      # configuration that always warns cannot quietly become normal.
      - name: Check edge nginx configuration
        run: scripts/check-edge-nginx.sh

      # The other half of the edge: acme writes the certificates, the edge reads
      # them, and nothing until now checked that the handover works. It broke
      # twice - once publishing only the first of five hosts, once handing the
      # directories to uid 101 so its own next pass could no longer replace the
      # files - and both times only on a host that already had certificates, which
      # is every host after the cutover. This runs the publishing step EXTRACTED
      # from docker-compose.yml under the container's real capabilities, twice,
      # and then opens every file as uid 101 in the real edge image.
      - name: Check acme certificate publishing
        run: scripts/check-acme-publish.sh

      # Nothing validated the Loki ruler's rules until now, and the ruler SKIPS a
      # group it cannot parse - so a typo disables every alert in that group
      # silently, leaving one line in the ruler's startup log as the only trace.
      # The first rule added after this step was written failed it immediately: a
      # ": " inside an unquoted YAML scalar.
      - name: Check Loki alerting rules
        run: scripts/check-loki-rules.sh
