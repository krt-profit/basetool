name: Promote to stable

# Promote an already-built image to the rolling `:stable` tag that the
# production host's deploy.sh polls. Does NOT rebuild — it re-tags an existing
# digest, so the production deploy that follows is by definition identical to
# what `release-images.yml` validated (built, scanned, signed) earlier.
#
# Promotes the three app images (backend/frontend/ingest), the `basetool-config`
# host-configuration bundle AND the `basetool-keycloak-spi` provider-JAR bundle
# together, so the compose file, the Keycloak provider JAR and the app images the
# host applies always match each other (see ADR-0049, ADR-0055).
#
# Trigger: workflow_dispatch only. Promotion is an intentional human decision,
# never automatic from a CI build. A dedicated `approve` job is bound to the
# `production` GitHub Environment, so a repo-configured required reviewer approves
# the run before any :stable flip happens — workflow_dispatch alone would let
# anyone with Actions-write reach prod (REQ-OPS-002). The gate is a single job (not
# the promote matrix) so the run mints exactly one GitHub deployment record.
#
# Two gates guard a promotion, in order:
#   1. cosign-verify the source digest's keyless signature against this repo's
#      release-images workflow identity (pinned to @refs/heads/main | tags/v.+).
#      A tag not produced by our own CI cannot be promoted even if the registry
#      contains one (e.g. someone pushed manually with a leaked PAT). This is the
#      CI half of the supply-chain seam; scripts/deploy.sh re-verifies the same
#      identity on the host before it applies (REQ-OPS-015), so the seam holds
#      even if :stable is later moved out-of-band.
#   2. Re-tag the (verified) digest as :stable.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to promote (e.g. "1.4.3", "sha-abc1234"). NOT "stable" itself.'
        required: true
        type: string

concurrency:
  # Serialise promotions globally so two simultaneous flips cannot leave the
  # app images and the config bundle on different versions.
  group: promote-stable
  cancel-in-progress: false

permissions:
  contents: read
  packages: write    # push the :stable tag
  id-token: write    # cosign verify against Sigstore Fulcio

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate-inputs:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject promoting :stable to :stable
        if: ${{ inputs.version == 'stable' }}
        run: |
          echo "::error::Cannot promote 'stable' to 'stable' — pick a concrete version."
          exit 1

      - name: Reject empty version
        if: ${{ inputs.version == '' }}
        run: |
          echo "::error::version input is empty."
          exit 1

  # Single human-approval gate for the whole run. Promotion is the ONLY path to
  # prod (REQ-OPS-002), and workflow_dispatch alone lets anyone with Actions-write
  # flip :stable. Binding THIS job — and only this job — to the `production` GitHub
  # Environment means a repo-configured *required reviewer* must approve the run
  # before the promote matrix can start. Configure the reviewer under
  # Settings → Environments → production → Required reviewers; without that config
  # the environment reference is a harmless no-op.
  #
  # Why a dedicated gate job instead of `environment: production` on the matrix:
  # every job that references an environment mints its own GitHub *deployment*
  # record. Putting the environment on the 5-way promote matrix therefore created
  # five deployments per run; GitHub's `auto_inactive` then flipped four of them to
  # `inactive` as each leg finished, and the repo home-page environment widget
  # surfaced one of those inactive records — so `production` showed a permanent,
  # misleading "Inactive" badge. One gate job = exactly one deployment per run,
  # which ends `success`/active and renders as "Active". Do NOT move `environment:`
  # back onto the matrix.
  approve:
    name: Approve production promotion
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Record approval
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Production promotion of '${VERSION}' approved — proceeding to re-tag :stable."

  promote:
    name: Promote ${{ matrix.module }}
    # Gated behind the single `approve` job, which holds the production-environment
    # required-reviewer gate. Deliberately NO `environment:` here — see the note on
    # `approve` for why binding the matrix to the environment reintroduces the
    # phantom "Inactive" deployment badge on the repo home page.
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # If one promotion fails, do NOT carry on with the others — otherwise we
      # land in a version skew on the live host the next time the timer ticks
      # (e.g. new app images against the old compose, or vice-versa). fail-fast
      # is the correct policy here. `config` is the host-configuration bundle
      # (docker/config/Dockerfile); it is promoted in lock-step with the app
      # images so the compose file and the images it references always move
      # together and the host applies them atomically.
      fail-fast: true
      matrix:
        # `config` is the host-configuration bundle and `keycloak-spi` is the
        # Keycloak provider-JAR bundle (docker/keycloak-spi/Dockerfile); both are
        # promoted in lock-step with the app images so the compose file, the
        # provider JAR and the images they reference always move together and the
        # host applies them atomically (ADR-0049, ADR-0055).
        module: [backend, frontend, ingest, config, keycloak-spi]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve source digest
        id: resolve
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Source: ${IMAGE}:${VERSION} → ${DIGEST}"

      - name: Verify source image signature (cosign keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@${{ steps.resolve.outputs.digest }}
          REPO: ${{ github.repository }}
        # The release-images workflow signs every pushed digest with a Fulcio
        # cert that carries the workflow's full ref as subject. Restricting the
        # identity to that exact workflow file rejects images signed by any
        # other workflow in the org (or by anyone with stolen credentials who
        # never had access to fire our release pipeline in the first place).
        #
        # The `@refs/` suffix is pinned to `heads/main` (main-branch :edge/:sha
        # builds) or `tags/v.+` (release builds) — NOT the broad `refs/.+`. That
        # rejects an image built by a workflow_dispatch run of release-images off
        # an arbitrary feature branch, so only a main-branch or tagged build is
        # ever promotable. The host-side gate in scripts/deploy.sh
        # (verify_signature, REQ-OPS-015) verifies against the SAME identity.
        run: |
          set -euo pipefail
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp "https://github.com/${REPO}/\\.github/workflows/release-images\\.yml@refs/(heads/main|tags/v.+)" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "Signature OK"

      - name: Re-tag digest as :stable
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          SOURCE_DIGEST: ${{ steps.resolve.outputs.digest }}
        # `buildx imagetools create` rewrites the registry manifest reference
        # without pulling or repushing layers. The new `:stable` tag and the
        # original `:${{ inputs.version }}` tag now point at the same digest,
        # so the cosign signature attached to that digest remains valid for
        # both tags — no re-sign needed.
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:stable" \
            "${IMAGE}@${SOURCE_DIGEST}"
          echo "Promoted ${SOURCE_DIGEST} → ${IMAGE}:stable"

      - name: Summarise
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          {
            echo "### Promoted basetool-${MODULE}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source tag | \`${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| New tag | \`stable\` |"
          } >> "$GITHUB_STEP_SUMMARY"
