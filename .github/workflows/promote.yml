name: Promote to stable

# Promote an already-built image to the rolling `:stable` tag that the
# production host's deploy.sh polls. Does NOT rebuild — it re-tags an existing
# digest, so the production deploy that follows is by definition identical to
# what `release-images.yml` validated (built, scanned, signed) earlier.
#
# Promotes the three app images (backend/frontend/ingest), the `basetool-config`
# host-configuration bundle AND the `basetool-keycloak-spi` provider-JAR bundle
# together, so the compose file, the Keycloak provider JAR and the app images the
# host applies always match each other (see ADR-0049, ADR-0055).
#
# Trigger: workflow_dispatch only. Promotion is an intentional human decision,
# never automatic from a CI build. A dedicated `approve` job is bound to the
# `production` GitHub Environment, so a repo-configured required reviewer approves
# the run before any :stable flip happens — workflow_dispatch alone would let
# anyone with Actions-write reach prod (REQ-OPS-002). The gate is a single job (not
# the promote matrix) so the run mints exactly one GitHub deployment record.
#
# Three gates guard a promotion, in order:
#   1. Trivy-scan the source digest of the three app images and FAIL on a fixed
#      HIGH/CRITICAL finding (REQ-OPS-024, ADR-0155). The identical finding is
#      advisory in release-images.yml: at build time a missing image is worse
#      than a vulnerable one, while at promotion time the digest is being chosen
#      to run in production. Break-glass: the `allow_vulnerable` input.
#   2. cosign-verify the source digest's keyless signature against this repo's
#      release-images workflow identity (anchored, and pinned to
#      @refs/heads/main | @refs/tags/vMAJOR.MINOR.PATCH).
#      A tag not produced by our own CI cannot be promoted even if the registry
#      contains one (e.g. someone pushed manually with a leaked PAT). This is the
#      CI half of the supply-chain seam; scripts/deploy.sh re-verifies the same
#      identity on the host before it applies (REQ-OPS-015), so the seam holds
#      even if :stable is later moved out-of-band.
#   3. Re-tag the (verified) digest as :stable.
#
# The human-approval gate sits between (1) and (2): a reviewer is only asked
# about an image whose scan already passed, or about one whose bypass is stated
# in the approval message.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to promote (e.g. "1.4.3", "sha-abc1234"). NOT "stable" itself.'
        required: true
        type: string
      allow_vulnerable:
        description: >-
          Break-glass: promote even though the image carries a fixed HIGH/CRITICAL
          vulnerability. The scan still runs and still reports; it just stops
          blocking. Say why in the deployment notes.
        required: false
        default: false
        type: boolean

concurrency:
  # Serialise promotions globally so two simultaneous flips cannot leave the
  # app images and the config bundle on different versions.
  group: promote-stable
  cancel-in-progress: false

# Nothing at the workflow level; each job names what it uses (audit item CI-SEC-04). Only
# `promote` and `sync-testing` can write to the registry. No job holds `id-token: write`: a keyless
# `cosign verify` checks a certificate against the Fulcio root and the Rekor log and needs no OIDC
# token of its own -- only SIGNING does, and nothing here signs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate-inputs:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      # Belt and braces to the `production` environment, which only accepts deployments from
      # `main`. `workflow_dispatch` runs the workflow file OF THE CHOSEN REF, so a dispatch from a
      # branch runs whatever that branch's copy of this file says -- including one with a gate
      # removed. The environment refuses such a run at `approve`; this refuses it before the scan
      # spends six runners, and says why in the one place an operator looks first. A failing step
      # rather than a job-level `if:`, because a skipped job ends the run green.
      - name: Refuse a run from any ref other than main
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::promote.yml must run from main, not ${REF} — dispatch it with the main branch selected."
          exit 1

      - name: Reject promoting :stable to :stable
        if: ${{ inputs.version == 'stable' }}
        run: |
          echo "::error::Cannot promote 'stable' to 'stable' — pick a concrete version."
          exit 1

      - name: Reject empty version
        if: ${{ inputs.version == '' }}
        run: |
          echo "::error::version input is empty."
          exit 1

  # Gate (2) of three — the vulnerability gate (REQ-OPS-024, ADR-0155).
  #
  # `release-images.yml` scans every build with Trivy and uploads SARIF, but that
  # scan is advisory by design: a CVE-bearing image is preferable to a MISSING
  # image when a hotfix is urgent, and a hard failure of the scan action must
  # never cost a release its tags and its signature. That reasoning is about the
  # BUILD. It does not transfer to the promotion, which is the moment a digest is
  # chosen to run in production — the one point in the chain where "this image has
  # a fixed HIGH/CRITICAL vulnerability" is a decision rather than a notification.
  #
  # So the same finding is advisory at build time and blocking here, on purpose.
  # Until this job existed the answer to "what does a Trivy finding stop?" was
  # "nothing, at any stage", which made the Security tab a queue nobody owned.
  #
  # Placed BEFORE `approve` deliberately: a reviewer is asked to approve only an
  # image that passed, and a failing scan costs a human nothing. The break-glass
  # is the `allow_vulnerable` input — the scan still runs and still prints every
  # finding, it just stops failing, and both this job's summary and the approval
  # job's message say so in full, so nobody approves a bypass without seeing it.
  #
  # Only the three APP images are scanned. `config` and `keycloak-spi` are
  # `FROM scratch` artifacts with no base image and no OS package database (see
  # docker/config/Dockerfile, docker/keycloak-spi/Dockerfile); the provider JAR's
  # Java dependencies are scanned separately by OWASP Dependency-Check at
  # `failBuildOnCVSS = 7.0` -- a signal on the pull request, not a required check
  # (ADR-0155's correction of 2026-09-22).
  #
  # Settings are deliberately IDENTICAL to the release scan (`severity:
  # HIGH,CRITICAL`, `ignore-unfixed: true`). Two different thresholds would mean
  # the Security tab and this gate disagree about what counts, and the first
  # disagreement would be discovered during an urgent promotion.
  scan:
    name: Scan (${{ matrix.module }} / ${{ matrix.platform }})
    needs: validate-inputs
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    # Reads the private image to scan it; writes nothing.
    permissions:
      packages: read

    strategy:
      # NOT fail-fast: an operator facing a blocked promotion needs the full
      # picture — every module and both architectures — in one run, not the first
      # finding and five cancelled jobs.
      fail-fast: false
      matrix:
        module: [backend, frontend, ingest]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    steps:
      # Required twice over: the basetool-* packages are private, and being
      # authenticated to ghcr.io also lifts the anonymous rate limit on the Trivy
      # vulnerability database, which is itself pulled from GHCR. An unauthenticated
      # DB pull that gets throttled would now block a promotion rather than lose an
      # advisory scan, so this step is load-bearing.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved here as well as in `promote`, because job outputs do not survive
      # matrix expansion and there is no way to hand one matrix leg's value to
      # another. The two resolutions could in principle disagree if the tag moved
      # between them; that window is closed on the other side, where `promote`
      # cosign-verifies whatever IT resolved against the release-images identity —
      # a tag repointed at an unsigned or foreign digest fails gate (3) regardless
      # of what this job scanned.
      - name: Resolve source digest
        id: resolve
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Retried, and this is the step that actually bit: the 1.7.18 promotion to
          # :testing got `403 Forbidden` on manifests/1.7.18 ninety seconds after the
          # :stable promotion had resolved the very same tag successfully. GHCR
          # answers 403 for a read it cannot serve, so a blip is indistinguishable
          # from a missing image — and a read is idempotent, so a retry costs
          # nothing. release-images.yml has carried exactly this since run
          # 30931003203 hit the identical shape; the promote path never got it.
          DIGEST=""
          for attempt in 1 2 3; do
            # `if cmd; then` rather than `cmd && …`: a `run:` block is `bash -e`, and
            # an AND-OR list whose FIRST command fails still trips errexit, which
            # would abort on attempt 1 and make the retry decorative. The inner test
            # is a full `if` for the same reason.
            if DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}'); then
              if [ -n "${DIGEST}" ]; then break; fi
            fi
            echo "::warning::digest lookup attempt ${attempt} failed for ${IMAGE}:${VERSION}; retrying" >&2
            sleep $((attempt * 10))
          done
          if [ -z "${DIGEST}" ]; then
            echo "::error::could not resolve ${IMAGE}:${VERSION} after 3 attempts" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${IMAGE}:${VERSION} -> ${DIGEST}"

      # `TRIVY_PLATFORM` is required, not cosmetic: `provenance: mode=max` plus
      # `sbom: true` make buildkit push an OCI INDEX (image + provenance + SBOM
      # manifests), and Trivy's default child selection inside an index is
      # hardcoded to linux/amd64 — which fails outright on the arm64 runner with
      # `no child with platform linux/amd64 in index ...`. Pinning it to the matrix
      # platform selects the matching child explicitly on both legs.
      #
      # `exit-code` is the gate. It is '1' normally and '0' when the operator
      # dispatched the run with `allow_vulnerable: true`; in the bypass case the
      # findings are still scanned, still printed in full and still summarised
      # below — only the failure is withheld.
      #
      # The condition is written fail-CLOSED and deliberately tests both
      # representations. `inputs.<boolean>` is a real boolean, but GitHub casts any
      # NON-EMPTY string to true — so the shorter `inputs.allow_vulnerable && '0' || '1'`
      # would silently disable this gate the moment the value reached the expression
      # as the STRING "false", which is exactly how `github.event.inputs` delivers
      # it. Requiring an explicit true leaves every other value, expected or not, on
      # the blocking branch.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.resolve.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ (inputs.allow_vulnerable == true || inputs.allow_vulnerable == 'true') && '0' || '1' }}

      # `always()` so the summary is written on the failing leg too — the operator
      # reading a blocked promotion needs the digest and the bypass instructions
      # from the run page, not from this file.
      - name: Summarise
        if: always()
        env:
          MODULE: ${{ matrix.module }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          BYPASS: ${{ inputs.allow_vulnerable }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Scanned basetool-${MODULE} (${PLATFORM}) — ${OUTCOME}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source tag | \`${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Threshold | HIGH,CRITICAL, fixed only |"
            if [ "${BYPASS}" = "true" ]; then
              echo "| Gate | **BYPASSED** (\`allow_vulnerable: true\`) |"
            else
              echo "| Gate | blocking |"
            fi
            if [ "${BYPASS}" = "true" ]; then
              echo ""
              echo "> **Vulnerability gate bypassed** via \`allow_vulnerable\`. Findings above were"
              echo "> NOT enforced. Record why in the deployment notes."
            elif [ "${OUTCOME}" != "success" ]; then
              echo ""
              echo "> Promotion blocked. Either ship a rebuilt image with the fix, or re-dispatch"
              echo "> this workflow with \`allow_vulnerable: true\` and state the reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Single human-approval gate for the whole run. Promotion is the ONLY path to
  # prod (REQ-OPS-002), and workflow_dispatch alone lets anyone with Actions-write
  # flip :stable. Binding THIS job — and only this job — to the `production` GitHub
  # Environment means a repo-configured *required reviewer* must approve the run
  # before the promote matrix can start. Configure the reviewer under
  # Settings → Environments → production → Required reviewers; without that config
  # the environment reference is a harmless no-op.
  #
  # Why a dedicated gate job instead of `environment: production` on the matrix:
  # every job that references an environment mints its own GitHub *deployment*
  # record. Putting the environment on the 5-way promote matrix therefore created
  # five deployments per run; GitHub's `auto_inactive` then flipped four of them to
  # `inactive` as each leg finished, and the repo home-page environment widget
  # surfaced one of those inactive records — so `production` showed a permanent,
  # misleading "Inactive" badge. One gate job = exactly one deployment per run,
  # which ends `success`/active and renders as "Active". Do NOT move `environment:`
  # back onto the matrix.
  approve:
    name: Approve production promotion
    # Waits on `scan` so the required reviewer is only ever asked about an image
    # that passed the vulnerability gate — or, when `allow_vulnerable` was set,
    # about one whose bypass the step below states in the approval record.
    needs: [validate-inputs, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: {}
    steps:
      - name: Record approval
        env:
          VERSION: ${{ inputs.version }}
          BYPASS: ${{ inputs.allow_vulnerable }}
        run: |
          if [ "${BYPASS}" = "true" ]; then
            echo "::warning::Vulnerability gate BYPASSED for '${VERSION}' (allow_vulnerable=true) — this image may carry fixed HIGH/CRITICAL findings."
          fi
          echo "Production promotion of '${VERSION}' approved — proceeding to re-tag :stable."

  promote:
    name: Promote ${{ matrix.module }}
    # Gated behind the single `approve` job, which holds the production-environment
    # required-reviewer gate. Deliberately NO `environment:` here — see the note on
    # `approve` for why binding the matrix to the environment reintroduces the
    # phantom "Inactive" deployment badge on the repo home page.
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes the `:stable` tag (reading the signature needs no more than that; see the header),
    # and reads the repository for the shared action.
    permissions:
      contents: read
      packages: write

    strategy:
      # If one promotion fails, do NOT carry on with the others — otherwise we
      # land in a version skew on the live host the next time the timer ticks
      # (e.g. new app images against the old compose, or vice-versa). fail-fast
      # is the correct policy here. `config` is the host-configuration bundle
      # (docker/config/Dockerfile); it is promoted in lock-step with the app
      # images so the compose file and the images it references always move
      # together and the host applies them atomically.
      fail-fast: true
      matrix:
        # `config` is the host-configuration bundle and `keycloak-spi` is the
        # Keycloak provider-JAR bundle (docker/keycloak-spi/Dockerfile); both are
        # promoted in lock-step with the app images so the compose file, the
        # provider JAR and the images they reference always move together and the
        # host applies them atomically (ADR-0049, ADR-0055).
        module: [backend, frontend, ingest, config, keycloak-spi]

    steps:
      # No `Set up Docker Buildx` here on purpose. Promotion only runs
      # `docker buildx imagetools inspect` / `create`, which are pure
      # registry-side manifest operations performed by the buildx CLI plugin
      # that ships with the runner's Docker — no build is ever dispatched, so no
      # builder instance is needed. Booting a `docker-container` builder anyway
      # would pull `moby/buildkit` from Docker Hub once per matrix module (five
      # anonymous, rate-limited pulls) purely to leave it idle, and that pull is
      # the flake that failed release run 30160708503 in release-images.yml.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A local action is loaded from the workspace, so the job checks out -- sparsely, only
      # .github/actions, and without persisting the token. Nothing from the checkout runs except
      # the shared promotion action itself, at the commit this workflow file comes from.
      - name: Checkout the shared promotion action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      # Resolve, cosign-verify against the release identity, re-tag, summarise: one copy shared
      # with the other promote workflow (.github/actions/retag-verified-digest, audit item CI-08).
      - name: Verify and re-tag as :stable
        uses: ./.github/actions/retag-verified-digest
        with:
          module: ${{ matrix.module }}
          source-tag: ${{ inputs.version }}
          target-tag: stable

  # ---------------------------------------------------------------------------
  # Keep `:testing` at or ahead of `:stable` (REQ-OPS-022).
  #
  # Testing exists to see a version BEFORE production does. It stopped doing that
  # the moment a production promotion moved `:stable` past it: the two tags are
  # flipped by two workflows that nobody was required to run in order, so testing
  # could silently become the OLDER environment and every "verify it on testing
  # first" instruction would quietly mean "verify an older build".
  #
  # A production promotion therefore carries testing along — but only when testing
  # would otherwise fall behind. A testing tag deliberately placed AHEAD of
  # production (the whole remaining purpose of `promote-testing.yml`) is left
  # exactly where it is. After this job the invariant `testing >= stable` holds.
  # ---------------------------------------------------------------------------
  sync-testing:
    name: Keep testing at or ahead of stable
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checks out for the ancestry question and writes `:testing`.
    permissions:
      contents: read
      packages: write

    # Serialised against `promote-testing.yml`, which uses this same group. The two
    # used to be deliberately separate "because they touch disjoint tags" — that
    # stopped being true here, and without this an operator promoting testing by
    # hand and a production promotion could interleave their writes to `:testing`
    # and leave the five modules on two different versions.
    concurrency:
      group: promote-testing
      cancel-in-progress: false

    steps:
      - name: Checkout (full history — the decision is an ancestry question)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether testing is behind
        id: decide
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # ONE decision for all five modules — they are promoted in lock-step above —
          # asked of the `basetool-config` bundle, deliberately NOT of an app image.
          # Since ADR-0210's per-module reuse the three app images of one tag need
          # not share a build: an image whose inputs a push did not change is
          # re-tagged from an earlier main run and keeps THAT run's revision label.
          # `backend` (the representative until 2026-09-23) can therefore name an
          # older commit than the tag, and on a testing tag placed ahead with no
          # backend change since stable, both sides would read the same backend
          # revision, `--is-ancestor X X` would answer "behind", and this job would
          # move a deliberately-ahead testing BACK — the one thing it must never do.
          # The config bundle is rebuilt by every release-images.yml run and never
          # re-tagged from another commit, so its revision label is always the commit
          # the tag was published for.
          #
          # The ordering signal is the SOURCE COMMIT, read from the image's
          # `org.opencontainers.image.revision` label, and NOT the image's creation
          # time. The two look equivalent and are not: the runbook's
          # `workflow_dispatch` escape hatch rebuilds an OLD version, which gives old
          # code a new timestamp — and a timestamp comparison would then march
          # testing backwards while reporting success.
          REV_JQ='[.[] | .config.Labels["org.opencontainers.image.revision"]] | map(select(. != null)) | unique | .[0] // ""'

          revision_of() {
            # Retried for the reason `Resolve source digest` above is: GHCR answers
            # 403 for a read it cannot serve, so a blip is indistinguishable from a
            # missing image. An empty result is returned rather than a failure — a
            # genuinely absent `:testing` tag is an answer here, not an error.
            ref="$1"
            out=""
            for attempt in 1 2 3; do
              if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/dev/null | jq -r "$REV_JQ"); then
                if [ -n "$out" ]; then break; fi
              fi
              sleep $((attempt * 5))
            done
            printf '%s' "$out"
          }

          TESTING_REV="$(revision_of "${IMAGE}:testing")"
          PROMOTED_REV="$(revision_of "${IMAGE}:${VERSION}")"

          echo "testing revision : ${TESTING_REV:-<none>}"
          echo "promoted revision: ${PROMOTED_REV:-<none>}"

          # Fail-safe, and the DIRECTION of it is the point. Whenever the question
          # cannot be answered, testing is left alone: moving it on a guess can only
          # be wrong by destroying a deliberately-ahead testing state, which is the
          # one thing this job must never do. An unanswerable question is reported.
          if [ -z "$PROMOTED_REV" ]; then
            echo "::warning::the promoted image carries no source-commit label, so testing cannot be compared and is left untouched"
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "reason=the promoted image carries no org.opencontainers.image.revision label" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$TESTING_REV" ]; then
            # No `:testing` tag at all, or one without the label. Nothing can be
            # behind nothing, and the invariant is satisfied by setting it.
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "reason=testing carried no comparable image, so it is set to the promoted version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${TESTING_REV}^{commit}" 2>/dev/null; then
            # The commit testing was built from is not in this repository's history:
            # a squashed or deleted branch build, which is the exact shape of a
            # deliberately experimental testing deployment.
            echo "::warning::testing is built from ${TESTING_REV}, which is not in this repository's history; leaving it untouched"
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "reason=testing's source commit is not in this repository's history (a branch build?), so it cannot be shown to be behind" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--is-ancestor X X` is TRUE, so an identical revision takes this branch
          # and the re-tag below is a no-op — which keeps the summary honest instead
          # of adding a special case that has to be read twice.
          if git merge-base --is-ancestor "$TESTING_REV" "$PROMOTED_REV"; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "reason=testing's commit is an ancestor of the promoted one, so testing was at or behind production" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "reason=testing is ahead of the promoted version and stays where it is" >> "$GITHUB_OUTPUT"
          fi

      - name: Move testing to the promoted digests
        if: steps.decide.outputs.move == 'true'
        env:
          REGISTRY_HOST: ${{ env.REGISTRY }}
          OWNER: ${{ env.IMAGE_OWNER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Every module is resolved FIRST, then written. Neither loop is atomic
          # across five repositories — nothing in a registry is — but resolving up
          # front means a missing or unreadable tag fails before any tag has moved,
          # so the common failure leaves testing consistent rather than half-moved.
          MODULES="backend frontend ingest config keycloak-spi"
          declare -A DIGESTS

          for module in $MODULES; do
            image="${REGISTRY_HOST}/${OWNER}/basetool-${module}"
            digest=""
            for attempt in 1 2 3; do
              if digest=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}'); then
                if [ -n "$digest" ]; then break; fi
              fi
              echo "::warning::digest lookup attempt ${attempt} failed for ${image}:${VERSION}; retrying" >&2
              sleep $((attempt * 10))
            done
            if [ -z "$digest" ]; then
              echo "::error::could not resolve ${image}:${VERSION} after 3 attempts" >&2
              exit 1
            fi
            DIGESTS[$module]="$digest"
          done

          for module in $MODULES; do
            image="${REGISTRY_HOST}/${OWNER}/basetool-${module}"
            docker buildx imagetools create \
              --tag "${image}:testing" \
              "${image}@${DIGESTS[$module]}"
            echo "Promoted ${DIGESTS[$module]} -> ${image}:testing"
          done

      - name: Summarise
        env:
          MOVED: ${{ steps.decide.outputs.move }}
          REASON: ${{ steps.decide.outputs.reason }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Testing tag"
            echo ""
            if [ "$MOVED" = "true" ]; then
              echo "Moved to \`${VERSION}\`, alongside \`stable\`."
            else
              echo "**Left untouched.**"
            fi
            echo ""
            echo "${REASON}."
          } >> "$GITHUB_STEP_SUMMARY"
