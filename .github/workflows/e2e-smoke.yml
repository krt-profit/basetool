name: E2E Smoke

# Non-destructive page-load checks (@Tag("smoke")) against a staging deployment,
# fanned out over Chromium / Firefox / WebKit. Split out from e2e.yml because
# this is a post-release / nightly concern, NOT a PR check: it triggers only on a
# schedule or manual dispatch (never on pull_request), and the job is gated on an
# E2E_BASE_URL repo variable, so until a staging host exists it simply does not
# run — and never appears as a skipped matrix placeholder on pull requests.
on:
  schedule:
    - cron: '0 4 * * *' # nightly 04:00 UTC (offset from the e2e flows at 03:00)
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.browser }}, staging)
    # Dormant until a staging host exists: gated on the E2E_BASE_URL repo variable
    # (a hostname, readable in `if:` — unlike a secret). Credentials come from
    # secrets, passed via the environment.
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # E2E_BASE_URL set => E2eStackExtension targets the external deployment and
      # does not manage Docker (no host.docker.internal remap needed — staging has
      # a real hostname every engine resolves natively). Credentials travel via the
      # environment (masked in logs); the smokeTest task maps E2E_USERNAME /
      # E2E_PASSWORD to the e2e.* system properties the tests read.
      - name: Run smoke checks against staging
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: ./gradlew :frontend:smokeTest -Pe2e.browser=${{ matrix.browser }} --stacktrace

      # Never the session. Against staging the smoke tests log in as a REAL account, and three files
      # under build/e2e carry that login in replayable form: `auth-state.json` (E2eSupport's
      # storageState), `storageState.json` (LoginSmokeE2eTest) and `trace.zip` (a Playwright trace
      # records every request and response, cookies included). An artifact is downloadable by
      # anyone with read access to this public repository's Actions for as long as it is retained,
      # so each of the three is excluded here rather than trusted to expire (audit item
      # CI-SEC-17). Screenshots, page dumps and the JUnit reports still upload. e2e.yml does not
      # need this: its stack is ephemeral and its accounts are throwaway.
      #
      # Deleted first AND excluded below: the exclusion alone rests on the upload action's glob
      # semantics, the deletion on nothing, and a staging session is not something to be clever
      # with.
      - name: Remove session material before upload
        if: always()
        run: |
          set -eu
          if [ -d frontend/build/e2e ]; then
            find frontend/build/e2e -type f \
              \( -name 'auth-state.json' -o -name 'storageState.json' -o -name '*.zip' \) \
              -print -delete
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-artifacts-${{ matrix.browser }}
          path: |
            frontend/build/e2e/**
            !frontend/build/e2e/**/auth-state.json
            !frontend/build/e2e/**/storageState.json
            !frontend/build/e2e/**/*.zip
            frontend/build/test-results/smokeTest/**
            frontend/build/reports/tests/smokeTest/**
          retention-days: 14
          if-no-files-found: ignore
