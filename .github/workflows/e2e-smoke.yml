name: E2E Smoke

on:
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.browser }}, staging)
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Run smoke checks against staging
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: ./gradlew :frontend:smokeTest -Pe2e.browser=${{ matrix.browser }} --stacktrace

      - name: Remove session material before upload
        if: always()
        run: |
          set -eu
          if [ -d frontend/build/e2e ]; then
            find frontend/build/e2e -type f \
              \( -name 'auth-state.json' -o -name 'storageState.json' -o -name '*.zip' \) \
              -print -delete
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-artifacts-${{ matrix.browser }}
          path: |
            frontend/build/e2e/**
            !frontend/build/e2e/**/auth-state.json
            !frontend/build/e2e/**/storageState.json
            !frontend/build/e2e/**/*.zip
            frontend/build/test-results/smokeTest/**
            frontend/build/reports/tests/smokeTest/**
          retention-days: 14
          if-no-files-found: ignore
