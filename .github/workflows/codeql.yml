name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'merge_group' && '[{"language":"java-kotlin","build-mode":"manual"},{"language":"javascript-typescript","build-mode":"none"}]' || '[{"language":"actions","build-mode":"none"},{"language":"java-kotlin","build-mode":"manual"},{"language":"javascript-typescript","build-mode":"none"},{"language":"python","build-mode":"none"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          dependency-caching: false
          config: |
            paths-ignore:
              - '**/build/**'
              - '**/node_modules/**'
              - 'frontend/src/main/resources/static/js/vendor/**'
              - '**/*.min.js'

            query-filters:
              - exclude:
                  id: java/log-injection

      - name: Compile Java sources for extraction
        if: matrix.language == 'java-kotlin'
        run: ./gradlew compileJava compileTestJava --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
          upload-database: ${{ github.event_name == 'merge_group' && 'false' || 'true' }}
