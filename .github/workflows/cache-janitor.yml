name: Cache Janitor

on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
  pull_request:
    types: [closed]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: cache-janitor-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'global' }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Prune unreachable caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write

    steps:
      - name: Delete superseded CodeQL dependency caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          caches="$(gh cache list --key codeql-dependencies- --limit 100 \
            --sort created_at --order desc --json id,key,ref,sizeInBytes)"
          keep="$(jq -r '[.[] | select(.ref == "refs/heads/main")][0].id // empty' <<<"$caches")"
          freed=0
          count=0
          while IFS=$'\t' read -r id size ref key; do
            [ -n "$id" ] || continue
            if [ "$id" = "$keep" ]; then
              echo "keep   $ref  $key"
              continue
            fi
            if gh cache delete "$id"; then
              echo "delete $ref  $key  ($((size / 1048576)) MiB)"
              freed=$((freed + size))
              count=$((count + 1))
            else
              echo "::warning::could not delete cache $id ($key on $ref)"
            fi
          done < <(jq -r '.[] | [.id, .sizeInBytes, .ref, .key] | @tsv' <<<"$caches")
          echo "Deleted $count CodeQL dependency caches, $((freed / 1048576)) MiB." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the closed pull request's caches
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=0
          for ref in "refs/pull/${PR_NUMBER}/merge" "refs/pull/${PR_NUMBER}/head"; do
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              if gh cache delete "$id"; then
                count=$((count + 1))
              else
                echo "::warning::could not delete cache $id on $ref"
              fi
            done < <(gh cache list --ref "$ref" --limit 100 --json id --jq '.[].id')
          done
          echo "Deleted $count caches of pull request #${PR_NUMBER}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report cache usage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          usage="$(gh api "repos/${GH_REPO}/actions/cache/usage" --jq '.active_caches_size_in_bytes')"
          echo "Cache usage after pruning: $((usage / 1048576)) MiB of 10240 MiB." | tee -a "$GITHUB_STEP_SUMMARY"
