name: Deploy Script

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/deploy.sh"
      - "scripts/deploy.test.sh"
      - "scripts/lib/**"
      - "scripts/render-env-d.py"
      - ".github/workflows/deploy-script.yml"
  push:
    branches: [main]
    paths:
      - "scripts/deploy.sh"
      - "scripts/deploy.test.sh"
      - "scripts/lib/**"
      - "scripts/render-env-d.py"
      - ".github/workflows/deploy-script.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-script-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: deploy.sh self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run deploy.sh self-tests
        shell: bash
        run: |
          chmod +x scripts/deploy.sh scripts/deploy.test.sh
          scripts/deploy.test.sh
