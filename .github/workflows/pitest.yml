name: Mutation Testing

# Weekly PIT mutation-testing run over the business-logic service layer of both
# modules (configured in the root build.gradle.kts: targetClasses =
# ...basetool.<module>.service.*). Mutation testing answers the question line
# coverage cannot — "would a test actually FAIL if this logic were wrong?" — so
# it is the quality signal behind the JaCoCo gate, not a replacement for it.
#
# Deliberately NOT a PR check and NOT blocking:
#   - A full mutation run is O(minutes) per service and far too slow for the PR
#     path (that is why `pitest` is not wired into `check`).
#   - A weak mutation score is a trend signal to triage, not a merge gate:
#     the HTML report is uploaded regardless and the PIT step is
#     continue-on-error. A run that produced NO result is different and fails
#     the job (see "Fail when PIT produced no result"): that is how the backend
#     sat on PitHelpError for eight weeks behind a green check (audit item
#     CI-03; the cause was the missing `test` profile in PIT's minions, see the
#     root build.gradle.kts).
#
# Schedule offset from the other crons (dep-check Mon, codeql Tue, e2e daily).

on:
  schedule:
    # Weekly on Wednesday, scheduled 01:47 UTC (off the full hour). GitHub starts it hours late --
    # the recent runs of the old 02:00 schedule began 02:47-06:55 UTC -- so it is "Wednesday
    # morning", not a time (audit item CI-16).
    - cron: '47 1 * * 3'
  workflow_dispatch:

concurrency:
  group: pitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pitest:
    name: PIT (${{ matrix.module }})
    runs-on: ubuntu-latest
    # 60, down from 90 (audit item CI-03). The first backend run that completed -- coverage over
    # 232 test classes, then 9 547 mutations in 214 units, Spring contexts and Testcontainers
    # included -- took 30 minutes on a workstation with PIT's `threads = 4` on 2026-09-22
    # (`BUILD SUCCESSFUL in 30m 11s`, 66 % killed); the frontend takes two. A 4-vCPU runner is not
    # faster than that, so the audit's proposed 20 would kill every run; 60 leaves room for a slower
    # runner without letting a hung minion hold one for an hour and a half. Re-derive it from the
    # first few CI durations.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'true'

      # Non-blocking for a LOW SCORE: a surviving mutant is a trend signal to triage, not a merge
      # gate (see the header). The log is kept for the step below, which is what decides whether PIT
      # produced a result at all.
      - name: Run PIT mutation analysis
        id: pit
        continue-on-error: true
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -o pipefail
          ./gradlew ":${MODULE}:pitest" --stacktrace 2>&1 | tee "${RUNNER_TEMP}/pitest.log"

      # `continue-on-error` above made a BROKEN run indistinguishable from a weak one: for
      # eight weeks up to 2026-09-16 the backend never got past PIT's coverage phase --
      # `PitHelpError: 10 tests did not pass without mutation` -- produced no mutations.xml, and the
      # job was green every Wednesday (audit item CI-03). This fails the job whenever PIT did not
      # produce a result, while a run that finished with surviving mutants stays green.
      - name: Fail when PIT produced no result
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          report="${MODULE}/build/reports/pitest/mutations.xml"
          if grep -q "PitHelpError" "${RUNNER_TEMP}/pitest.log" 2>/dev/null; then
            grep -m 5 -B 2 "PitHelpError" "${RUNNER_TEMP}/pitest.log" || true
            echo "::error title=PIT (${MODULE})::PIT aborted with PitHelpError - the suite is not green under PIT, so no mutation was run"
            exit 1
          fi
          if [ ! -s "$report" ]; then
            echo "::error title=PIT (${MODULE})::no ${report} - PIT did not produce a result"
            exit 1
          fi
          mutations="$(grep -c '<mutation ' "$report" || true)"
          echo "PIT (${MODULE}): ${mutations} mutations in ${report}"
          if [ "${mutations:-0}" -eq 0 ]; then
            echo "::error title=PIT (${MODULE})::${report} lists no mutations"
            exit 1
          fi

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/**
          retention-days: 14
          if-no-files-found: ignore
