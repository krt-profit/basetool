name: Mutation Testing

on:
  schedule:
    - cron: '47 1 * * 3'
  workflow_dispatch:

concurrency:
  group: pitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pitest:
    name: PIT (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'true'

      - name: Run PIT mutation analysis
        id: pit
        continue-on-error: true
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -o pipefail
          ./gradlew ":${MODULE}:pitest" --stacktrace 2>&1 | tee "${RUNNER_TEMP}/pitest.log"

      - name: Fail when PIT produced no result
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          report="${MODULE}/build/reports/pitest/mutations.xml"
          if grep -q "PitHelpError" "${RUNNER_TEMP}/pitest.log" 2>/dev/null; then
            grep -m 5 -B 2 "PitHelpError" "${RUNNER_TEMP}/pitest.log" || true
            echo "::error title=PIT (${MODULE})::PIT aborted with PitHelpError - the suite is not green under PIT, so no mutation was run"
            exit 1
          fi
          if [ ! -s "$report" ]; then
            echo "::error title=PIT (${MODULE})::no ${report} - PIT did not produce a result"
            exit 1
          fi
          mutations="$(grep -c '<mutation ' "$report" || true)"
          echo "PIT (${MODULE}): ${mutations} mutations in ${report}"
          if [ "${mutations:-0}" -eq 0 ]; then
            echo "::error title=PIT (${MODULE})::${report} lists no mutations"
            exit 1
          fi

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pitest-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/**
          retention-days: 14
          if-no-files-found: ignore
