name: Mutation Testing

on:
  schedule:
    - cron: '47 1 * * 3'
  workflow_dispatch:

concurrency:
  group: pitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pitest:
    name: PIT (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run PIT mutation analysis
        id: pit
        continue-on-error: true
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -o pipefail
          ./gradlew ":${MODULE}:pitest" --stacktrace 2>&1 | tee "${RUNNER_TEMP}/pitest.log"

      - name: Fail when PIT did not finish cleanly
        if: always()
        env:
          MODULE: ${{ matrix.module }}
          PIT_OUTCOME: ${{ steps.pit.outcome }}
        run: >-
          bash scripts/check-pit-result.sh "${MODULE}" "${RUNNER_TEMP}/pitest.log"
          "${MODULE}/build/reports/pitest/mutations.xml" "${PIT_OUTCOME}"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pitest-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/**
          retention-days: 14
          if-no-files-found: ignore
