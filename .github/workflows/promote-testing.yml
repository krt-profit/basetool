name: Promote to testing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to promote (e.g. "1.4.3", "sha-abc1234", "stable"). NOT "testing" itself.'
        required: true
        type: string

concurrency:
  group: promote-testing
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate-inputs:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse a run from any ref other than main
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::promote-testing.yml must run from main, not ${REF} — dispatch it with the main branch selected."
          exit 1

      - name: Reject promoting :testing to :testing
        if: ${{ inputs.version == 'testing' }}
        run: |
          echo "::error::Cannot promote 'testing' to 'testing' — pick a concrete version."
          exit 1

      - name: Reject empty version
        if: ${{ inputs.version == '' }}
        run: |
          echo "::error::version input is empty."
          exit 1

  approve:
    name: Record testing promotion
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testing
    permissions: {}
    steps:
      - name: Record promotion
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Testing promotion of '${VERSION}' recorded — proceeding to re-tag :testing."

  promote:
    name: Promote ${{ matrix.module }}
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        module: [backend, frontend, ingest, config, keycloak-spi]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the shared promotion action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify and re-tag as :testing
        uses: ./.github/actions/retag-verified-digest
        with:
          module: ${{ matrix.module }}
          source-tag: ${{ inputs.version }}
          target-tag: testing
