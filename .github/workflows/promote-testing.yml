name: Promote to testing

# Promote an already-built image to the rolling `:testing` tag that the PVE testing
# host's deploy.sh polls. Does NOT rebuild — it re-tags an existing digest, exactly
# like promote.yml does for `:stable`, so the testing deploy that follows is by
# definition identical to what `release-images.yml` validated (built, scanned,
# signed) earlier.
#
# Because re-tagging leaves the digest untouched, the cosign signature attached to
# that digest stays valid for the new tag — no re-sign, and the host-side gate in
# scripts/deploy.sh (REQ-OPS-015) verifies against the same release-images identity
# it always did.
#
# Promotes the three app images (backend/frontend/ingest), the `basetool-config`
# host-configuration bundle AND the `basetool-keycloak-spi` provider-JAR bundle
# together, so the compose file, the Keycloak provider JAR and the app images the
# host applies always match each other (see ADR-0049, ADR-0055).
#
# HOW THIS DIFFERS FROM promote.yml — and why (REQ-OPS-022):
#   * Target tag is `testing`, not `stable`. Production never reads it.
#   * The `approve` job declares `environment: testing`, which is deliberately
#     configured WITHOUT a required reviewer. On `production` that reviewer is the
#     seam that separates "may fire a workflow" (actions:write) from "may change
#     production" — a stolen or over-scoped PAT can start the run but not approve
#     it. The testing environment holds no production data and serves no users, so
#     that seam buys nothing there and would only add friction. The environment
#     itself stays, because it still mints one deployment record per promotion —
#     the answer to "which version has been on testing since when". Adding the
#     reviewer later is a repo setting, not a workflow change.
#
# Trigger: workflow_dispatch only. Nothing reaches the testing host on a `main`
# merge either — the operator decides what gets tested, same principle as prod.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to promote (e.g. "1.4.3", "sha-abc1234", "stable"). NOT "testing" itself.'
        required: true
        type: string

concurrency:
  # Serialise testing promotions among themselves so two simultaneous flips cannot
  # leave the app images and the config bundle on different versions. Deliberately a
  # DIFFERENT group from promote.yml's `promote-stable`: a testing promotion must
  # never queue behind (or cancel) a production one, and vice versa — they touch
  # disjoint tags.
  group: promote-testing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write    # push the :testing tag
  id-token: write    # cosign verify against Sigstore Fulcio

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate-inputs:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject promoting :testing to :testing
        if: ${{ inputs.version == 'testing' }}
        run: |
          echo "::error::Cannot promote 'testing' to 'testing' — pick a concrete version."
          exit 1

      - name: Reject empty version
        if: ${{ inputs.version == '' }}
        run: |
          echo "::error::version input is empty."
          exit 1

  # Records the promotion as a GitHub deployment on the `testing` environment. With
  # no required reviewer configured, this job runs straight through — that is the
  # intended behaviour, not an oversight (see the header note). Keeping it as its
  # OWN single job rather than putting `environment:` on the promote matrix is not
  # cosmetic: every job referencing an environment mints its own deployment record,
  # so a matrix-bound environment would mint five per run and GitHub's
  # `auto_inactive` would flip four of them to `inactive`, leaving the repo home
  # page showing a permanent misleading "Inactive" badge. promote.yml learned this
  # the hard way. Do NOT move `environment:` onto the matrix.
  approve:
    name: Record testing promotion
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testing
    steps:
      - name: Record promotion
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Testing promotion of '${VERSION}' recorded — proceeding to re-tag :testing."

  promote:
    name: Promote ${{ matrix.module }}
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # If one promotion fails, do NOT carry on with the others — otherwise the next
      # timer tick lands the host in a version skew (new app images against the old
      # compose, or vice-versa). Same policy as promote.yml, same reason.
      fail-fast: true
      matrix:
        module: [backend, frontend, ingest, config, keycloak-spi]

    steps:
      # No `Set up Docker Buildx` here on purpose — see promote.yml for the full
      # rationale. Promotion only runs registry-side manifest operations, so booting
      # a docker-container builder would pull moby/buildkit once per matrix module
      # purely to leave it idle.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve source digest
        id: resolve
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Source: ${IMAGE}:${VERSION} → ${DIGEST}"

      - name: Verify source image signature (cosign keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@${{ steps.resolve.outputs.digest }}
          REPO: ${{ github.repository }}
        # Identical to promote.yml's gate, deliberately: the identity is pinned to
        # `heads/main` or `tags/v.+`, so an image built by a workflow_dispatch run of
        # release-images off an arbitrary feature branch is NOT promotable to testing
        # either. Testing exists to rehearse what may later become production; a path
        # that accepts weaker provenance would make it a rehearsal of something else.
        #
        # A signature is uploaded to the registry AFTER the digest it covers, so a
        # promotion fired while the release run is still signing reads a digest
        # that exists and a signature that does not yet. That is exactly how the
        # v1.6.11 promotion died: `cosign sign` logged "Signing artifact..." at
        # 14:00:20.69 and this step reported "no signatures found" at 14:00:20.81
        # — 120 ms apart, on the identical digest. The image was never unsigned.
        #
        # `cosign sign` in release-images.yml has retried since day one; this side
        # did not, which left one half of an eventually-consistent registry
        # hardened and the other half racing it.
        #
        # The retry is NARROW on purpose. Only an ABSENT signature is transient.
        # A signature that is present and fails the identity check fails at once:
        # retrying that would mean waiting for somebody to publish a matching one,
        # which is the failure mode this gate exists to catch (REQ-OPS-002).
        run: |
          set -euo pipefail
          attempts=6
          delay=5
          for i in $(seq 1 "$attempts"); do
            if err="$(cosign verify "${IMAGE_REF}" \
                 --certificate-identity-regexp "https://github.com/${REPO}/\\.github/workflows/release-images\\.yml@refs/(heads/main|tags/v.+)" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 2>&1 >/dev/null)"; then
              echo "Signature OK"
              exit 0
            fi
            case "$err" in
              *"no signatures found"*|*"no matching signatures"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*)
                if [ "$i" -lt "$attempts" ]; then
                  echo "::warning::no signature on ${IMAGE_REF} yet (attempt ${i}/${attempts}) — a release run may still be uploading it; retrying in ${delay}s" >&2
                  sleep "$delay"
                  delay=$((delay * 2))
                  continue
                fi
                ;;
              *)
                # Present but wrong — wrong identity, wrong issuer, bad chain.
                # Not a race, and not something a later attempt can improve.
                echo "::error::signature on ${IMAGE_REF} did not verify against this repository's release workflow identity" >&2
                echo "$err" >&2
                exit 1
                ;;
            esac
          done
          echo "::error::no signature appeared on ${IMAGE_REF} after ${attempts} attempts" >&2
          echo "$err" >&2
          exit 1

      - name: Re-tag digest as :testing
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          SOURCE_DIGEST: ${{ steps.resolve.outputs.digest }}
        # `buildx imagetools create` rewrites the registry manifest reference without
        # pulling or repushing layers. The new `:testing` tag and the original
        # `:${{ inputs.version }}` tag now point at the same digest, so the cosign
        # signature attached to that digest remains valid for both — no re-sign.
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:testing" \
            "${IMAGE}@${SOURCE_DIGEST}"
          echo "Promoted ${SOURCE_DIGEST} → ${IMAGE}:testing"

      - name: Summarise
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          {
            echo "### Promoted basetool-${MODULE} to testing"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source tag | \`${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| New tag | \`testing\` |"
          } >> "$GITHUB_STEP_SUMMARY"
