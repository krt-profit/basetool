name: Exchange Docs

on:
  push:
    branches: [main]
    paths:
      - docs/exchange/**
      - ingest/src/main/resources/api/exchange-v1.openapi.json
      - ingest/src/main/resources/exchange/v1/schemas/**
      - .github/workflows/exchange-docs.yml
      - .github/scripts/check_exchange_docs_links.py
      - .github/scripts/prepare_exchange_reference.py
      - .github/tools/markdownlint/**
      - frontend/src/main/resources/static/fonts/**
      - frontend/src/main/resources/META-INF/resources/logos/**
  pull_request:
    paths:
      - docs/exchange/**
      - ingest/src/main/resources/api/exchange-v1.openapi.json
      - ingest/src/main/resources/exchange/v1/schemas/**
      - .github/workflows/exchange-docs.yml
      - .github/scripts/check_exchange_docs_links.py
      - .github/scripts/prepare_exchange_reference.py
      - .github/tools/markdownlint/**
      - frontend/src/main/resources/static/fonts/**
      - frontend/src/main/resources/META-INF/resources/logos/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: exchange-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build the exchange docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: links / Self-test the link checker
        run: python3 .github/scripts/check_exchange_docs_links.py --selftest

      - name: links / Check every relative link resolves on the site and no German text is on it
        run: python3 .github/scripts/check_exchange_docs_links.py

      - name: markdown / Lint the pages
        run: |
          set -euo pipefail
          npm ci --prefix .github/tools/markdownlint --ignore-scripts --no-audit --no-fund
          .github/tools/markdownlint/node_modules/.bin/markdownlint-cli2 "docs/exchange/**/*.md"

      - name: dpop-reference / Run the reference implementation's tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s docs/exchange/dpop-reference -v

      - name: reference / Self-test the reference preparation
        run: python3 .github/scripts/prepare_exchange_reference.py --selftest

      - name: reference / Prepare the OpenAPI reference page
        run: python3 .github/scripts/prepare_exchange_reference.py --out build/exchange-reference

      - name: reference / Add the pinned Redoc bundle
        env:
          REDOC_VERSION: 2.5.4
          REDOC_INTEGRITY: sha512-M6jWhG1qoBnH6TFmzJnstyCZ87HmOY/UzDm78mHiYihEdlV/YcS9ogOo1NlElnJMeLsyxHFe2yFc4sNjHTrABQ==
        run: |
          set -euo pipefail
          mkdir -p build/redoc
          tarball="$(npm pack "redoc@${REDOC_VERSION}" --pack-destination build/redoc --silent)"
          actual="sha512-$(openssl dgst -sha512 -binary "build/redoc/${tarball}" | base64 -w0)"
          if [ "$actual" != "$REDOC_INTEGRITY" ]; then
            echo "::error::redoc@${REDOC_VERSION} does not match its pinned integrity" >&2
            exit 1
          fi
          tar -xzf "build/redoc/${tarball}" -C build/redoc package/bundles/redoc.standalone.js
          cp build/redoc/package/bundles/redoc.standalone.js build/exchange-reference/

      - name: site / Assemble the sources
        run: |
          mkdir -p build/exchange-site/reference build/exchange-site/schemas
          cp -r docs/exchange/. build/exchange-site/
          cp -r build/exchange-reference/. build/exchange-site/reference/
          cp ingest/src/main/resources/api/exchange-v1.openapi.json build/exchange-site/reference/
          cp ingest/src/main/resources/exchange/v1/schemas/*.schema.json build/exchange-site/schemas/
          python3 .github/scripts/prepare_exchange_reference.py --schema-index build/exchange-site/schemas
          mkdir -p build/exchange-site/assets/fonts build/exchange-site/assets/logos
          cp frontend/src/main/resources/static/fonts/Lato-*.woff2 frontend/src/main/resources/static/fonts/OFL.txt build/exchange-site/assets/fonts/
          cp frontend/src/main/resources/META-INF/resources/logos/basetool-*.svg frontend/src/main/resources/META-INF/resources/logos/basetool-*.png build/exchange-site/assets/logos/

      - name: site / Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: build/exchange-site
          destination: build/exchange-pages

      - name: site / Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/exchange-pages

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
