name: Dependency Check

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'build-logic/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'config/owasp/dependency-check-suppressions.xml'
      - 'gradle/verification-metadata.xml'
      - '.github/workflows/dependency-check.yml'
      - '.github/actions/report-failed-run/**'
  pull_request:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'build-logic/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'config/owasp/dependency-check-suppressions.xml'
      - 'gradle/verification-metadata.xml'
      - '.github/workflows/dependency-check.yml'
      - '.github/actions/report-failed-run/**'

concurrency:
  group: dep-check-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore the NVD feed
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-feed-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-feed-v2-${{ runner.os }}-

      - name: Check the NVD feed is present and current
        env:
          MATCHED_KEY: ${{ steps.nvd-cache.outputs.cache-matched-key }}
          MAX_AGE_HOURS: '168'
          WARN_AGE_HOURS: '48'
        run: |
          set -euo pipefail
          stamp=~/.gradle/dependency-check-data/refreshed-at
          if [ -z "$MATCHED_KEY" ] || [ ! -f "$stamp" ]; then
            echo "::error title=No NVD feed cached::No nvd-feed-v2 cache was restored. This scan never downloads the NVD itself; run Actions, NVD Feed Refresh, Run workflow on main, then re-run this job."
            exit 1
          fi
          age_hours=$(( ($(date -u +%s) - $(cat "$stamp")) / 3600 ))
          echo "NVD feed ${MATCHED_KEY}, refreshed ${age_hours} h ago." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$age_hours" -ge "$MAX_AGE_HOURS" ]; then
            echo "::error title=NVD feed outdated::The cached NVD feed is ${age_hours} h old (limit ${MAX_AGE_HOURS} h); the daily NVD Feed Refresh has not succeeded since. Fix that workflow, then re-run this job."
            exit 1
          fi
          if [ "$age_hours" -ge "$WARN_AGE_HOURS" ]; then
            echo "::warning title=NVD feed aging::The cached NVD feed is ${age_hours} h old; check the NVD Feed Refresh workflow."
          fi

      - name: Run dependencyCheckAggregate
        timeout-minutes: 15
        run: ./gradlew dependencyCheckAggregate --no-parallel --stacktrace -PdependencyCheckAutoUpdate=false

      - name: Check SARIF report exists
        id: sarif
        if: always()
        shell: bash
        run: |
          if [ -f build/reports/dependency-check/dependency-check-report.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF report missing - dependency-check did not finish; skipping the GitHub Security upload."
          fi

      - name: Upload SARIF report to GitHub Security
        if: always() && steps.sarif.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload dependency-check reports as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check/
          retention-days: 30
          if-no-files-found: ignore

      - name: Open or update the failed-scan issue
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: ./.github/actions/report-failed-run
        with:
          title: Weekly OWASP Dependency-Check failed
          message: >-
            ${{ steps.sarif.outputs.exists == 'true'
            && 'The scan **finished** and failed the `failBuildOnCVSS = 7.0` gate: at least one dependency carries a CVE at CVSS >= 7. The SARIF is in the Security tab (category `owasp-dependency-check`) and the HTML report is in the run artifact. Fix with an upgrade, or a documented, dated suppression in `config/owasp/dependency-check-suppressions.xml`.'
            || 'The scan produced **no verdict** (no SARIF). If the step that checks the NVD feed failed, the cached feed is missing or older than seven days: the daily NVD Feed Refresh workflow has not saved one, see its latest run and its own failure issue. Otherwise read the `dependencyCheckAggregate` step log; the scan reads only the cached feed and never downloads the NVD.' }}
          token: ${{ github.token }}
