name: Commit Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gates:
    name: Commit & repo gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve the commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA"; head="$PR_HEAD_SHA" ;;
            merge_group) base="$GROUP_BASE_SHA"; head="$GROUP_HEAD_SHA" ;;
            *) base=""; head="" ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::the base commit ${base} is not in the checkout"
            exit 1
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "range: ${base:-<none>}..${head:-<none>}"

      - name: wrapper / Validate the Gradle wrapper JAR checksum
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: dco / Verify each commit carries a matching Signed-off-by trailer
        if: ${{ !cancelled() && steps.range.outcome == 'success' && steps.range.outputs.base != '' }}
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t commits < <(git log --reverse --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "No commits to check (empty base..head range)."
            exit 0
          fi

          echo "Checking ${#commits[@]} commit(s) in ${BASE_SHA}..${HEAD_SHA}"
          echo

          bot_emails=(
            'dependabot[bot]@users.noreply.github.com'
            'github-actions[bot]@users.noreply.github.com'
            'renovate[bot]@users.noreply.github.com'
            '49699333+dependabot[bot]@users.noreply.github.com'
            '41898282+github-actions[bot]@users.noreply.github.com'
            '332641749+basetool-release[bot]@users.noreply.github.com'
          )

          failed=0

          for sha in "${commits[@]}"; do
            short=$(git log -1 --format='%h' "$sha")
            subject=$(git log -1 --format='%s' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            parents=$(git log -1 --format='%P' "$sha")

            parent_count=$(echo "$parents" | wc -w)
            if [[ $parent_count -ge 2 ]]; then
              echo "::notice title=DCO::Skipped merge commit ${short} (${parent_count} parents): ${subject}"
              continue
            fi

            is_bot=0
            for bot in "${bot_emails[@]}"; do
              if [[ "${author_email,,}" == "${bot,,}" ]]; then
                echo "::notice title=DCO::Skipped bot commit ${short} (${author_email}): ${subject}"
                is_bot=1
                break
              fi
            done
            [[ $is_bot -eq 1 ]] && continue

            mapfile -t signoffs < <(git log -1 --format='%(trailers:key=Signed-off-by,valueonly=true)' "$sha")

            filtered=()
            for so in "${signoffs[@]}"; do
              [[ -n "$so" ]] && filtered+=("$so")
            done

            if [[ ${#filtered[@]} -eq 0 ]]; then
              echo "::error title=DCO sign-off missing::Commit ${short} has no Signed-off-by trailer."
              echo "        Subject:  ${subject}"
              echo "        Author:   ${author_name} <${author_email}>"
              echo
              failed=1
              continue
            fi

            expected_lc="${author_name,,} <${author_email,,}>"
            matched=0
            for so in "${filtered[@]}"; do
              if [[ "${so,,}" == "${expected_lc}" ]]; then
                matched=1
                break
              fi
            done

            if [[ $matched -eq 0 ]]; then
              echo "::error title=DCO sign-off mismatch::Commit ${short} has Signed-off-by trailers but none match the author."
              echo "        Subject:        ${subject}"
              echo "        Author:         ${author_name} <${author_email}>"
              echo "        Found sign-off(s):"
              for so in "${filtered[@]}"; do
                echo "          - ${so}"
              done
              echo
              failed=1
            fi
          done

          if [[ $failed -eq 1 ]]; then
            cat <<'REMEDIATION'

          ====================================================================
          One or more commits are missing a matching DCO sign-off.

          Fix locally:
            - Last commit only:        git commit --amend --signoff --no-edit
            - All commits in this PR:  git rebase --signoff main

          Then refresh the PR:
            git push --force-with-lease origin "$(git branch --show-current)"

          The Signed-off-by trailer must match the commit's author
          "Name <email>" exactly (case-insensitive on the email). If your
          git config and your commit author disagree, fix
          `git config user.name` / `git config user.email` first, then
          rebase --signoff.

          Full procedure: CONTRIBUTING.md -> "Developer Certificate of
          Origin (DCO) sign-off".
          ====================================================================

          REMEDIATION
            exit 1
          fi

          echo
          echo "All checked commits carry a matching Signed-off-by trailer."

      - name: gitleaks / Install gitleaks
        id: gitleaks-install
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks / Scan for secrets
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          args=(git . --redact --no-banner --exit-code 1)
          if [ -n "$BASE_SHA" ]; then
            cfg="${RUNNER_TEMP}/gitleaks-base.toml"
            if ! git show "${BASE_SHA}:.gitleaks.toml" > "$cfg"; then
              echo "::error::could not read .gitleaks.toml at the base commit ${BASE_SHA}"
              exit 1
            fi
            echo "gitleaks config: .gitleaks.toml at base ${BASE_SHA}"
            args+=(--config "$cfg" --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}")
          else
            echo "gitleaks config: .gitleaks.toml at the checked-out ref, whole history"
            args+=(--config .gitleaks.toml)
          fi
          gitleaks "${args[@]}"

      - name: flyway / Fetch the base branch tip
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}"

      - name: flyway / Self-test the migration checker
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          chmod +x scripts/check-flyway-migrations.test.sh
          scripts/check-flyway-migrations.test.sh

      - name: flyway / Validate Flyway migration numbering
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FLYWAY_BASE_REF: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          chmod +x scripts/check-flyway-migrations.sh
          scripts/check-flyway-migrations.sh
