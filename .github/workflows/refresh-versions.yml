name: Refresh Versions

# `./gradlew refreshVersions` is the project's canonical way to surface
# dependency / plugin updates (see CLAUDE.md: versions live in the version
# catalog at `gradle/libs.versions.toml`, which refreshVersions annotates in
# place with `## ⬆ = "…"` markers).
# This workflow runs it on a weekly cadence and opens a single rolling pull
# request whenever the tool annotates new versions into `gradle/libs.versions.toml`
# (`versions.properties` is vestigial and holds no versions, but is still listed
# below so a stray annotation there could never be silently dropped). The
# maintainer then promotes the desired
# bumps by hand — the workflow deliberately does NOT auto-apply updates,
# because refreshVersions emits proposals as comments rather than mutations.
#
# The PR step uses a dedicated `REFRESH_VERSIONS_TOKEN` secret (fine-grained
# PAT or GitHub App token) instead of the default `GITHUB_TOKEN`, because the
# `krt-profit` organization policy forbids Actions from creating or approving
# pull requests. Required token scopes on this repo: `pull-requests: write`
# and `contents: write`.
on:
  schedule:
    # Monday, scheduled 04:11 UTC (off the full hour). GitHub starts it hours late -- the September
    # 2026 runs of the old 05:00 began 09:51-11:15 UTC -- so the PR appears on Monday, at no
    # particular time (audit item CI-16).
    - cron: '11 4 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-versions
  cancel-in-progress: false

# Read-only for GITHUB_TOKEN. Every write this workflow makes -- pushing `chore/refresh-versions`
# and opening the PR -- goes through REFRESH_VERSIONS_TOKEN, which create-pull-request uses for both
# (its `token` input), so `contents: write` and `pull-requests: write` here were never exercised
# (audit item CI-SEC-05). The checkout persists no credential either; create-pull-request
# configures its own.
permissions:
  contents: read

jobs:
  refresh-versions:
    name: refreshVersions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'false'

      - name: Run refreshVersions
        run: ./gradlew refreshVersions --stacktrace

      - name: Open / update pull request with proposed bumps
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REFRESH_VERSIONS_TOKEN }}
          # Author the commit as the GitHub Actions bot so the DCO check
          # (dco.yml) takes its documented bot exemption. Without this,
          # create-pull-request defaults the author to github.actor — on a
          # workflow_dispatch run that is the maintainer, who then trips
          # "DCO sign-off missing" because this automated commit carries no
          # Signed-off-by trailer (the bot does not own contributor IP).
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: chore/refresh-versions
          base: main
          title: "chore(deps): refreshVersions proposals"
          commit-message: "chore(deps): refreshVersions proposals"
          body: |
            Automated dependency-update proposals generated by
            `./gradlew refreshVersions`.

            Review the new `## ⬆ = "…"` markers in
            `gradle/libs.versions.toml` — that is the marker this tool
            writes, and that catalog is the only file in this repo that
            carries versions (`versions.properties` is vestigial and stays
            empty). Then bump the entries you want to take by hand
            (refreshVersions never auto-applies — it only annotates), and
            leave a comment next to each saying why it was taken or held.

            Closes any previous open `chore/refresh-versions` PR.
          add-paths: |
            versions.properties
            gradle/libs.versions.toml
          delete-branch: true
          labels: |
            dependencies
            automated
