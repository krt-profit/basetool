name: Refresh Versions

# `./gradlew refreshVersions -PrefreshVersions` is the project's canonical way to surface
# dependency / plugin updates (see CLAUDE.md: versions live in the version catalog at
# `gradle/libs.versions.toml`, which refreshVersions annotates in place with `## ⬆ = "…"` markers).
# The `-PrefreshVersions` flag is what applies the refreshVersions settings plugin at all: since
# 2026-09-23 it is on the settings classpath but applied only on request, because applied
# unconditionally it kept the configuration cache off for every other build (BLD-PERF-04).
#
# This workflow runs it on a weekly cadence and opens a single rolling pull request whenever the
# tool annotates new versions into `gradle/libs.versions.toml`. The maintainer then promotes the
# desired bumps by hand — the workflow deliberately does NOT auto-apply updates, because
# refreshVersions emits proposals as comments rather than mutations. The tool also (re)creates an
# empty `versions.properties` on every run; that file is gitignored and deliberately not in
# `add-paths` below — it held zero versions and was removed from the repository on 2026-09-23.
#
# The PR is opened with a short-lived token of the `basetool-release` GitHub App (ADR-0201), not
# with GITHUB_TOKEN — the `krt-profit` organization policy forbids Actions from creating pull
# requests — and, since 2026-09-23, no longer with the `REFRESH_VERSIONS_TOKEN` personal access
# token either (audit item CI-SEC-16): a PAT is a long-lived, repository-wide credential, an App
# token lives for an hour and carries only the two permissions requested below. The App's
# installation grants Contents RW and Pull requests RW, which is what pushing
# `chore/refresh-versions` and opening the PR need. A PR opened by an App identity also triggers
# the pull_request workflows, which a GITHUB_TOKEN-opened PR would not.
on:
  schedule:
    # Monday, scheduled 04:11 UTC (off the full hour). GitHub starts it hours late -- the September
    # 2026 runs of the old 05:00 began 09:51-11:15 UTC -- so the PR appears on Monday, at no
    # particular time (audit item CI-16).
    - cron: '11 4 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-versions
  cancel-in-progress: false

# Read-only for GITHUB_TOKEN. Every write this workflow makes -- pushing `chore/refresh-versions`
# and opening the PR -- goes through the App token, which create-pull-request uses for both (its
# `token` input). The checkout persists no credential either; create-pull-request configures its
# own.
permissions:
  contents: read

jobs:
  refresh-versions:
    name: refreshVersions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: 'false'

      # Without the configuration cache on purpose: the refreshVersions plugin is not compatible
      # with it, which is the very reason it is applied only under this flag.
      - name: Run refreshVersions
        run: ./gradlew refreshVersions -PrefreshVersions --stacktrace

      - name: Refuse to continue without the release App's key
        env:
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_KEY}" != "true" ]; then
            echo "::error::secret RELEASE_APP_PRIVATE_KEY is not set -- opening the refreshVersions PR needs the basetool-release GitHub App (ADR-0201); GITHUB_TOKEN may not open PRs in this organization"
            exit 1
          fi

      - name: Mint a basetool-release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App's CLIENT ID, a public value, and the same literal release-prepare.yml and
          # release-publish.yml use. Not `app-id`: that input is deprecated in v3.
          client-id: Iv23liHT1h5peKsDnrUD
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped to what create-pull-request needs, not to everything the installation allows:
          # push the branch, open or update the PR.
          permission-contents: write
          permission-pull-requests: write

      - name: Open / update pull request with proposed bumps
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          # Author the commit as the GitHub Actions bot so the DCO check
          # (dco.yml) takes its documented bot exemption. Without this,
          # create-pull-request defaults the author to github.actor — on a
          # workflow_dispatch run that is the maintainer, who then trips
          # "DCO sign-off missing" because this automated commit carries no
          # Signed-off-by trailer (the bot does not own contributor IP).
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: chore/refresh-versions
          base: main
          title: "chore(deps): refreshVersions proposals"
          commit-message: "chore(deps): refreshVersions proposals"
          body: |
            Automated dependency-update proposals generated by
            `./gradlew refreshVersions -PrefreshVersions`.

            Review the new `## ⬆ = "…"` markers in
            `gradle/libs.versions.toml` — that is the marker this tool
            writes, and that catalog is the only file in this repo that
            carries versions. Then bump the entries you want to take by hand
            (refreshVersions never auto-applies — it only annotates), and
            leave a comment next to each saying why it was taken or held.

            Closes any previous open `chore/refresh-versions` PR.
          add-paths: |
            gradle/libs.versions.toml
          delete-branch: true
          labels: |
            dependencies
            automated
