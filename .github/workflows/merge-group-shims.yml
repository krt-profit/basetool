name: Merge Group Shims

on:
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: merge-group-shims-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shim:
    name: ${{ matrix.context }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        context:
          - Verify Signed-off-by on every commit
          - gitleaks
    steps:
      - name: Report the verdict the pull request head already earned
        env:
          CONTEXT: ${{ matrix.context }}
        run: >-
          echo "${CONTEXT}: decided on the pull request head, which the queue admits only
          after its required checks passed; the merge group adds no author commit and no file
          this check would read differently."
