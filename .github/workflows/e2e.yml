name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: >-
    e2e-${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name != 'pull_request' ||
    (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
    (github.event.action != 'labeled' &&
    contains(github.event.pull_request.labels.*.name, 'e2e')))
    && 'suite' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/krt-profit/basetool-backend:e2e-local
  FRONTEND_IMAGE: ghcr.io/krt-profit/basetool-frontend:e2e-local
  INGEST_IMAGE: ghcr.io/krt-profit/basetool-ingest:e2e-local
  KEYCLOAK_IMAGE: ghcr.io/krt-profit/basetool-sandbox-keycloak:e2e-local
  CACHE_REPO: ghcr.io/krt-profit/basetool-e2e-cache

jobs:
  exchange-label:
    name: Exchange changes carry the e2e label
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: List the pull request's changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            > "${RUNNER_TEMP}/changed-files.txt"
          wc -l < "${RUNNER_TEMP}/changed-files.txt"

      - name: Check the exchange path against the e2e label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: >-
          python3 .github/scripts/check_exchange_e2e_label.py
          --changed "${RUNNER_TEMP}/changed-files.txt" --labels "${LABELS}"

  build-stack:
    name: Build E2E images
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))) &&
      !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build, save and upload the E2E images
        uses: ./.github/actions/build-e2e-images
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-write: 'false'

  build-stack-main:
    name: Build E2E images (cache writer)
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))) &&
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build, save and upload the E2E images
        uses: ./.github/actions/build-e2e-images
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-write: 'true'

  e2e:
    name: E2E flows (${{ matrix.browser }}, ${{ matrix.device }})
    needs: [build-stack, build-stack-main]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))) &&
      (needs.build-stack.result == 'success' || needs.build-stack-main.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["375x812", "1600x900"]' || '["375x812", "810x1080", "1024x768", "1180x820", "1280x800", "1600x900"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Download the E2E images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load the E2E images
        env:
          ARCHIVE: ${{ runner.temp }}/e2e-images/e2e-images.tar.zst
        run: |
          set -euo pipefail
          zstd -d -c "$ARCHIVE" | docker load
          rm -f "$ARCHIVE"

      - name: Map host.docker.internal to the loopback (needed by WebKit)
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Run e2e flows
        env:
          BROWSER: ${{ matrix.browser }}
          DEVICE: ${{ matrix.device }}
        run: >-
          ./gradlew :frontend:e2eTest
          -Pe2e.browser="$BROWSER"
          -Pe2e.device="$DEVICE"
          -Pe2e.prebuilt=true
          --stacktrace
          --configuration-cache

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-artifacts-${{ matrix.browser }}-${{ matrix.device }}
          path: |
            frontend/build/e2e/**
            frontend/build/test-results/e2eTest/**
            frontend/build/reports/tests/e2eTest/**
          retention-days: 14
          if-no-files-found: ignore
