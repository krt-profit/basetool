name: E2E

# The destructive functional flows (@Tag("e2e")) against an ephemeral full stack
# (Postgres x2 + Keycloak + Redis + backend + frontend), built and torn down by
# E2eStackExtension via `docker compose`, fanned out over three browser engines
# (Chromium, Firefox, WebKit) as a matrix. Heavy (~2 GB RAM + a Keycloak boot),
# so it runs nightly + on manual dispatch, and on PRs only when they carry the
# `e2e` label.
#
# The non-destructive @Tag("smoke") checks against a staging deployment live in
# `e2e-smoke.yml` — a post-release / nightly concern, deliberately NOT a PR check
# (so a dormant, skipped job never shows up as a confusing matrix placeholder on
# pull requests).
on:
  pull_request:
    branches: [main]
    # `labeled` is included so applying the `e2e` label AFTER a PR is opened
    # triggers the suite immediately. Without it the gate below only ever sees
    # the label state captured at open/synchronize, so a label added later (e.g.
    # by `gh pr create --label e2e`, which lands after the open event) silently
    # skips e2e until the next push — a real, recurring footgun.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 3 * * *' # nightly 03:00 UTC
  workflow_dispatch:

concurrency:
  # The group is claimed when the run is CREATED -- before the job gate below is evaluated. A run
  # that goes on to skip every job therefore still cancels the incumbent on its way to skipping,
  # and that is the whole bug: `gh pr create --label a --label b --label e2e` fires `opened` plus
  # one `labeled` event per label inside a second, a single shared group made each cancel its
  # predecessor, and the survivor was whichever label happened to land last -- usually not `e2e`,
  # so its gate was false and it skipped. The heavy suite never executed, while `gh pr checks`
  # renders the cancelled runs as `fail`, so the PR showed red checks with nothing behind them.
  # Seen on #1537 and again on #1871: the same footgun the `labeled` trigger above exists to fix,
  # reintroduced one layer down by the concurrency group.
  #
  # So the group separates the two populations. Every run whose gate will PASS shares `-suite`,
  # where `cancel-in-progress` still does the job it exists for -- a new push supersedes the
  # in-flight suite. Every run that will SKIP gets a group of its own, keyed on the per-run-unique
  # `github.run_id`: it cancels nothing, nothing cancels it, and it reports `skipped` rather than
  # the `fail`-coloured `cancelled`. Event ordering stops mattering, because of those five runs
  # only the one carrying `e2e` can ever enter `-suite`.
  #
  # The selector is the job gate VERBATIM, and must stay that way: a selector LOOSER than the gate
  # lets a skipping run back into `-suite` and restores the bug (a `labeled` event for an unrelated
  # label on a PR that already carries `e2e` is exactly such a run). `check_e2e_gate_mirror.py`
  # fails repo-lint if the two ever drift -- change one, change the other.
  group: >-
    e2e-${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name != 'pull_request' ||
    (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
    (github.event.action != 'labeled' &&
    contains(github.event.pull_request.labels.*.name, 'e2e')))
    && 'suite' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    # The DEVICE belongs in the name. With fifteen jobs and only the browser in it, five are
    # indistinguishable per engine — when one was cancelled at its timeout, working out WHICH
    # device class it was meant comparing artifact sizes, and the run log interleaves all five
    # under one name so it cannot be read per job at all.
    name: E2E flows (${{ matrix.browser }}, ${{ matrix.device }})
    # PRs: only when labelled `e2e`. A `labeled` event must be the `e2e` label
    # itself, so toggling an unrelated label never spins up this heavy stack;
    # open/synchronize/reopened run whenever the label is currently present.
    # schedule / workflow_dispatch: always.
    #
    # This expression is mirrored verbatim into the `concurrency.group` selector above so that
    # runs which will skip cannot cancel the run that will execute. Editing it here without
    # editing it there fails the `e2e-gate-mirror` repo-lint job.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    # Back to 45 now that each runner measures ONE device class instead of five.
    #
    # The touch-class sweep added 65 routes x 5 device classes on top of the 93 existing classes,
    # and Firefox is roughly four times slower than Chromium on that workload: it was CANCELLED at
    # this ceiling on six consecutive runs while Chromium finished in 20 minutes and WebKit in 21,
    # and two green engines made it easy to miss. Trimming the sweep came first — screenshots
    # confined to the artifact-bearing shard, the duplicate whole-document walk removed, and a flat
    # 150ms-per-measurement sleep replaced by the condition it was guessing at, together about 40%
    # — and the ceiling was briefly 75 while the remaining margin was too thin to trust.
    timeout-minutes: 45
    strategy:
      # Run all three engines even if one fails, so a Chromium-only regression
      # doesn't hide a Firefox/WebKit pass (and vice versa).
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # One runner per device class (owner decision 2026-09-13), rather than five walked one
        # after another inside a single @Test. Each runner still runs the whole destructive suite,
        # because that is what puts rows in the tables and an empty table hides what this sweep
        # exists to find — so 14 of the 15 repeat work that only one of them needs. That is the
        # price, and it was chosen knowingly: it buys a wall clock per job that does not sit on the
        # timeout, and it removes the in-process parallelisation that would otherwise be needed
        # (a Playwright instance is not thread-safe, so that is a refactor rather than a setting).
        device: ['375x812', '810x1080', '1024x768', '1280x800', '1600x900']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Cache the Playwright-managed browsers (~/.cache/ms-playwright) so the
      # playwrightInstall task is a no-op on a hit. Keyed on the version catalog,
      # so a Playwright bump (gradle/libs.versions.toml) invalidates the cache.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # WebKit has no launch-level DNS override, so the ephemeral stack's Keycloak
      # issuer host must be mapped to the loopback at the OS level. Chromium (a
      # resolver arg) and Firefox (a profile pref) remap it themselves, but the
      # entry is harmless for them.
      - name: Map host.docker.internal to the loopback (needed by WebKit)
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      # E2eStackExtension builds the images and brings the stack up itself (no
      # E2E_BASE_URL => ephemeral mode); the Dockerfiles are multi-stage, so no
      # separate bootJar step is needed. Docker + compose v2 ship on the runner.
      - name: Run e2e flows
        run: >-
          ./gradlew :frontend:e2eTest
          -Pe2e.browser=${{ matrix.browser }}
          -Pe2e.device=${{ matrix.device }}
          --stacktrace

      # Playwright traces, failure screenshots/HTML dumps and the docker compose
      # build/boot logs all land under frontend/build/e2e.
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The device belongs in the name: fifteen jobs upload, and an artifact name
          # collision drops all but one.
          name: e2e-artifacts-${{ matrix.browser }}-${{ matrix.device }}
          path: |
            frontend/build/e2e/**
            frontend/build/test-results/e2eTest/**
            frontend/build/reports/tests/e2eTest/**
          retention-days: 14
          if-no-files-found: ignore
