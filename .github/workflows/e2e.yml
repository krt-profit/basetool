name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: >-
    e2e-${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name != 'pull_request' ||
    (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
    (github.event.action != 'labeled' &&
    contains(github.event.pull_request.labels.*.name, 'e2e')))
    && 'suite' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-stack:
    name: Build E2E images
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_IMAGE: ghcr.io/krt-profit/basetool-backend:e2e-local
      FRONTEND_IMAGE: ghcr.io/krt-profit/basetool-frontend:e2e-local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the backend and frontend images
        run: |
          set -euo pipefail
          build() {
            local module="$1" tag="$2" attempt
            for attempt in 1 2; do
              if docker build --file docker/app/Dockerfile --build-arg "MODULE=${module}" --tag "$tag" .; then
                return 0
              fi
              echo "::warning::building ${tag} failed (attempt ${attempt}/2)"
              sleep 15
            done
            return 1
          }
          build backend "$BACKEND_IMAGE"
          build frontend "$FRONTEND_IMAGE"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':e2e-local '

      - name: Save the images
        run: |
          set -euo pipefail
          docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | zstd -T0 -3 -q -o e2e-images.tar.zst
          ls -l e2e-images.tar.zst

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-images
          path: e2e-images.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E flows (${{ matrix.browser }}, ${{ matrix.device }})
    needs: build-stack
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        device: ['375x812', '810x1080', '1024x768', '1280x800', '1600x900']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Download the E2E images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load the E2E images
        env:
          ARCHIVE: ${{ runner.temp }}/e2e-images/e2e-images.tar.zst
        run: |
          set -euo pipefail
          zstd -d -c "$ARCHIVE" | docker load
          rm -f "$ARCHIVE"

      - name: Map host.docker.internal to the loopback (needed by WebKit)
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Run e2e flows
        env:
          BROWSER: ${{ matrix.browser }}
          DEVICE: ${{ matrix.device }}
        run: >-
          ./gradlew :frontend:e2eTest
          -Pe2e.browser="$BROWSER"
          -Pe2e.device="$DEVICE"
          -Pe2e.prebuilt=true
          --stacktrace
          --configuration-cache

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-artifacts-${{ matrix.browser }}-${{ matrix.device }}
          path: |
            frontend/build/e2e/**
            frontend/build/test-results/e2eTest/**
            frontend/build/reports/tests/e2eTest/**
          retention-days: 14
          if-no-files-found: ignore
