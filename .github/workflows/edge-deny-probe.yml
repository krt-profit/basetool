name: Edge deny probe

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: none

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keycloak /admin must not be reachable from the internet
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 \
            https://profit-base.online/auth/admin/ || true)
          echo "GET /admin/ -> HTTP ${code:-000}"
          case "$code" in
            2*|3*)
              echo "::error::Keycloak Admin Console answered ${code} from the internet — the /auth/admin allow-list is broken (docs/deployment.md → Keycloak Admin Console via SSH tunnel)."
              exit 1
              ;;
            *)
              echo "Locked down (deny or connection closed)."
              ;;
          esac

      - name: Actuator edge deny must answer 404 from the internet
        run: |
          fail=0
          while read -r url; do
            case "$url" in ''|\#*) continue ;; esac
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$url" || true)
            echo "GET $url -> HTTP ${code:-000}"
            if [ "$code" != "404" ]; then
              echo "::error::$url answered ${code:-000} instead of 404 — the /actuator edge deny drifted (ADR-0072 compensating control), or the edge is unreachable from this runner."
              fail=1
            fi
          done <<'TARGETS'
          https://profit-base.online/actuator/prometheus
          https://profit-base.online/actuator/health
          https://ingest.profit-base.online/actuator/prometheus
          https://ingest.profit-base.online/actuator/health
          TARGETS
          exit $fail

      - name: Former public pages must send a browser into the login (REQ-SEC-052)
        run: |
          fail=0
          for path in /missions /operations /orders; do
            url="https://profit-base.online$path"
            read -r code location <<<"$(curl -s -o /dev/null               -w '%{http_code} %{redirect_url}' --max-time 20 --retry 2 --retry-delay 10               -H 'Accept: text/html,application/xhtml+xml'               -H 'Sec-Fetch-Mode: navigate'               -H 'X-Basetool-Probe: edge-deny' "$url" || true)"
            echo "GET $path -> HTTP ${code:-000} ${location:-}"
            if [ "$code" != "302" ]; then
              echo "::error::$url answered ${code:-000} instead of 302 — a former public page is being served without a login. REQ-SEC-052 allows exactly /, /impressum, /privacy, /terms and /licenses. Check the NPM proxy host for a cache or location rule ahead of the app, and confirm the deployed frontend image carries the members-only SecurityConfig."
              fail=1
            elif ! printf '%s' "$location" | grep -q '/oauth2/authorization/keycloak'; then
              echo "::error::$url redirected to '${location:-}' rather than the OAuth2 entry point. A 302 to anywhere else is not a login gate."
              fail=1
            fi
          done
          exit $fail

      - name: The API host must not resolve
        run: |
          if ! getent hosts profit-base.online > /dev/null 2>&1; then
            echo "::error::profit-base.online does not resolve from this runner, so the assertion below would pass because DNS is broken rather than because the API host is gone. Re-run the job."
            exit 1
          fi
          echo "control: profit-base.online resolves."
          if getent hosts api.profit-base.online > /dev/null 2>&1; then
            echo "::error::api.profit-base.online resolves again. The backend is internal-only and the ingest gateway is the only public API (ADR-0268, REQ-OBS-012) — a resolving API host means the DNS record, and probably the vhost, is back."
            exit 1
          fi
          echo "api.profit-base.online does not resolve."

      - name: The backend's ports must be closed on the public address
        run: |
          probe_port() {
            local port="$1" rc=0
            curl -s -o /dev/null --max-time 10 --connect-timeout 10 \
              "https://profit-base.online:${port}/" || rc=$?
            echo "${rc}"
          }
          if [ "$(probe_port 443)" != "0" ]; then
            echo "::error::port 443 did not answer on profit-base.online, so this runner cannot reach the host at all and the assertions below would pass for the wrong reason. Re-run the job."
            exit 1
          fi
          echo "control: port 443 answers."
          fail=0
          for port in 11261 11271; do
            rc="$(probe_port "${port}")"
            echo "connect profit-base.online:${port} -> curl rc=${rc}"
            case "${rc}" in
              7|28)
                echo "  closed."
                ;;
              *)
                echo "::error::something listens on profit-base.online:${port} (curl rc=${rc}). That is the backend's application connector (11261) or its management port (11271); neither may be reachable from the internet (ADR-0268, ADR-0134, ADR-0265, REQ-OBS-012). Check the host firewall, the haproxy front end and the edge's published ports."
                fail=1
                ;;
            esac
          done
          exit $fail

      - name: No edge hostname may answer the backend API
        run: |
          fail=0
          answered=0
          for host in profit-base.online ingest.profit-base.online grafana.profit-base.online; do
            for path in /api/v1/terms/status /api/v1/me/capabilities; do
              url="https://${host}${path}"
              rm -f /tmp/probe-body.txt
              code=$(curl -s -o /tmp/probe-body.txt -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$url" || true)
              echo "GET $url -> HTTP ${code:-000}"
              case "${code:-000}" in
                000)
                  ;;
                2*)
                  answered=$((answered + 1))
                  echo "::error::$url answered ${code} — an edge hostname is serving the backend's API. The backend is internal-only (ADR-0268, REQ-OBS-012): no vhost may proxy /api/v1 any more."
                  fail=1
                  ;;
                *)
                  answered=$((answered + 1))
                  ;;
              esac
              if grep -q 'profit-base\.online/problems/' /tmp/probe-body.txt 2>/dev/null; then
                echo "::error::$url answered with the backend's own RFC 7807 problem document (a type URI under /problems/, REQ-API-019, REQ-OBS-012) — the request reached the backend. The ingest gateway and Grafana answer 401 here without that type URI, which is what makes this check discriminate."
                fail=1
              fi
            done
          done
          if [ "${answered}" -eq 0 ]; then
            echo "::error::no edge hostname answered at all, so this step would pass because the edge is unreachable from this runner rather than because the backend is hidden. Re-run the job."
            exit 1
          fi
          exit $fail
