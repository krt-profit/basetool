name: Release · Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  detect:
    name: Recognise a release PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.pr.outputs.tag }}
      version: ${{ steps.pr.outputs.version }}

    steps:
      - name: Find the merged release/vX.Y.Z PR whose merge commit was pushed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls='[]'
          for attempt in 1 2 3 4; do
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls")"
            if [ "$(jq 'length' <<<"$pulls")" -gt 0 ]; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 10
            fi
          done
          head_ref="$(jq -r --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '
            [ .[]
              | select(.merged_at != null
                       and .base.ref == "main"
                       and .merge_commit_sha == $sha
                       and .head.repo.full_name == $repo
                       and (.head.ref | startswith("release/v")))
              | .head.ref ]
            | first // ""' <<<"$pulls")"
          if [ -z "$head_ref" ]; then
            echo "::notice title=Release · Publish::${SHA:0:12} is not the merge commit of a release/vX.Y.Z PR; nothing to publish"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${head_ref#release/}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected release branch name '${head_ref}'"; exit 1
          fi
          echo "Release PR merge: ${head_ref} at ${SHA}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag merge commit & publish release
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ needs.detect.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Resolve version from the release branch
        id: ver
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::unexpected release tag '${TAG}' / version '${VERSION}'"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout the merge commit (changelog + SBOM assets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to start without the release App's key
        env:
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_KEY}" != "true" ]; then
            echo "::error::secret RELEASE_APP_PRIVATE_KEY is not set in the release environment -- creating the release tag needs the basetool-release GitHub App (ADR-0201); a PAT or GITHUB_TOKEN is refused by the tag ruleset"
            exit 1
          fi

      - name: Mint a basetool-release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: Iv23liHT1h5peKsDnrUD
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the release tag at the merge commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists -- skipping creation"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${MERGE_SHA}" >/dev/null
            echo "Created tag ${TAG} at ${MERGE_SHA}"
          fi

      - name: Build release notes body
        id: notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          python3 .github/scripts/extract_release_notes.py "${TAG}" CHANGELOG.md \
            --version "${VERSION}" --registry "${REGISTRY}" --owner "${IMAGE_OWNER}" > "$body"
          echo "path=${body}" >> "$GITHUB_OUTPUT"

      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            backend/docs/backend-bom.json
            backend/docs/backend-bom.xml
            frontend/docs/frontend-bom.json
            frontend/docs/frontend-bom.xml
            ingest/docs/ingest-bom.json
            ingest/docs/ingest-bom.xml
            keycloak-spi/docs/keycloak-spi-bom.json
            keycloak-spi/docs/keycloak-spi-bom.xml

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          assets=(
            backend/docs/backend-bom.json backend/docs/backend-bom.xml
            frontend/docs/frontend-bom.json frontend/docs/frontend-bom.xml
            ingest/docs/ingest-bom.json ingest/docs/ingest-bom.xml
            keycloak-spi/docs/keycloak-spi-bom.json keycloak-spi/docs/keycloak-spi-bom.xml
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file "${NOTES}"
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file "${NOTES}" "${assets[@]}"
          fi
