name: Release Images

# Build, scan, sign and push the backend + frontend + ingest production images
# to GHCR, plus the `basetool-config` host-configuration bundle (the compose
# file + maintenance page + Keycloak theme) as a signed, promotable artifact the
# server pulls through the same channel (see docs/deployment.md, ADR-0049).
#
# Trigger model:
#   - push to main           -> rolling :edge tag plus an immutable :sha-<short>
#                               tag for traceability. No :stable promotion.
#   - push of a v*.*.* tag   -> semver-derived tags (:1.2.3, :1.2, :1, :latest).
#                               Still no :stable promotion — that is the
#                               separate `promote.yml` workflow so the human in
#                               the loop decides what reaches the server.
#   - workflow_dispatch      -> manual rebuild from the Actions UI.
#
# Topology — distributed multi-arch build:
#   0. `plan` (1 job): decides whether this run has to build at all. See
#      REQ-OPS-021 / ADR-0137 — a release fires this workflow TWICE for one
#      commit (the release commit on `main`, then the `v*` tag), and the
#      concurrency group below serialises the pair, so the tag run used to
#      spend a second full pipeline reproducing images that already existed.
#      On a tag push `plan` resolves `:sha-<short>` for all three app images,
#      cosign-verifies each against this workflow's main-branch identity, and
#      asserts the index really carries both linux/amd64 and linux/arm64. Only
#      if EVERY check passes does it emit `reuse=true`; anything else — a
#      missing tag, a failed signature, a one-armed index, a
#      `workflow_dispatch` rebuild, a main-branch push — falls back to a full
#      build. Fail-safe by construction: the doubt case is always "build".
#   1. `build` matrix (6 jobs, fully parallel): one job per (module, platform),
#      skipped entirely when `plan` said reuse. Each runs natively on the
#      matching architecture's runner — linux/amd64 on the regular
#      `ubuntu-latest` fleet, linux/arm64 on GitHub's free public-repo
#      `ubuntu-24.04-arm` fleet — and pushes the resulting image to GHCR
#      **by digest** only (no tag). The previous all-in-one matrix went
#      through qemu-aarch64 emulation for the arm64 stage and was ~3-6x
#      slower than amd64 because every javac / Gradle / AppCDS JVM invocation
#      ran translated. With native runners both architectures finish in
#      roughly the same wall time.
#   2. `merge` matrix (3 jobs, one per module): assembles a multi-arch OCI
#      image index via `docker buildx imagetools create`, applies all of
#      metadata-action's tags to the index, then cosign-signs the manifest
#      digest. The source references are the per-arch digest artifacts from
#      `build`, or — on a reuse run — the single already-signed index digest
#      `plan` verified. The attestation manifests (SLSA provenance, SPDX SBOM)
#      attached to each per-arch image flow through `imagetools create`
#      automatically, so the merged index keeps the same audit trail the
#      previous single-job build had — no separate `cosign attest` step needed.
#   3. `scan` matrix (6 jobs): Trivy per (module, platform), fanned out in
#      parallel with `merge` instead of sitting inside `build`. Two reasons.
#      It takes ~35s off the time-to-signed-image, because `merge` no longer
#      waits behind a scan whose result it does not consume. And it breaks a
#      failure coupling that could cost a release: a hard failure of the Trivy
#      action or of the SARIF upload used to fail the whole `build` job, which
#      skipped `merge` — no tags, no signature — over a scan that is explicitly
#      advisory (`exit-code: 0`). Skipped on a reuse run: the digest carries
#      the SARIF the main run already uploaded under the same categories.
#
# Deliberately NO BuildKit layer cache (`cache-from` / `cache-to`). Measured on
# runs 32235454225 and 32227895058: `type=gha,mode=max` cost 40-246s of cache
# EXPORT per build job while the dependency layer re-ran anyway in 11 of 12
# jobs. The reason is the repository-wide Actions-cache quota: the six
# `mode=max` scopes wrote ~5.3 GB, and with CodeQL, the ci.yml Gradle caches and
# the Trivy DB the repo sat at 10.5 GB against GitHub's 10 GB hard limit, so
# LRU eviction removed each run's blobs before the next run could read them
# (run 32235454225 imported the cache manifest and reused zero layers). The
# cost landed exactly where the benefit was absent — the one job that DID hit
# the cache exported in 4s, the misses exported for minutes. Dropping the cache
# takes the critical-path job from ~7:36 to ~3:30 and hands 5.3 GB back to the
# other workflows. A build cache is semantically transparent, so its removal
# cannot change the produced artifact — only make it fresher.
#
# What this workflow guarantees about the resulting images:
#   1. Built from a clean GitHub checkout — `.dockerignore` blocks production
#      secrets (keystore.p12, .env, realm-export.json, ...) from ever entering
#      the build context. There is no way for a CI-built image to carry the
#      production TLS keystore.
#   2. Signed with cosign keyless (Sigstore Rekor / Fulcio via OIDC), so the
#      server can verify the image was produced by THIS workflow on THIS repo
#      before pulling. No long-lived signing key to rotate. The signature is
#      pinned to the manifest digest, so all tags pointing at the digest
#      (including a later `:stable` promotion) are covered by one signature.
#   3. Carries SLSA build provenance + an SPDX SBOM as OCI attestations
#      (`provenance: mode=max`, `sbom: true`) so a downstream auditor can
#      prove which commit + builder produced the image and which packages
#      it bundles. Provenance is recorded TWICE, in two places with two
#      different trust roots: the buildx attestation manifest above, which
#      lives in the GHCR repository next to the image, and a signed SLSA v1
#      statement in GitHub's own attestation store, written by
#      `actions/attest-build-provenance` under the `attestations: write`
#      permission. The second one exists because the first is only as
#      trustworthy as the registry holding it -- a `packages: write`
#      credential can rewrite a package version together with its provenance
#      manifest and its cosign signature, since all three are siblings in the
#      repository that credential controls. The attestation store is not
#      reachable with `packages: write`, so it survives that. Verify it with
#      `gh attestation verify oci://ghcr.io/<owner>/basetool-<module>:<tag>
#      --repo <owner>/basetool` (REQ-OPS-023, ADR-0145).
#   4. Scanned with Trivy. Findings are uploaded as SARIF to the repository's
#      Security tab for visibility; the scan does NOT block the push itself
#      (a CVE-bearing image is preferable to no image when a hotfix is
#      urgent), but the `promote.yml` workflow re-checks before flipping
#      the :stable tag — that is the production gate. Both architectures
#      are scanned natively on their own runner (one Trivy run per
#      (module, platform) pair, six SARIF uploads total, distinct
#      categories per arch so they show up as independent alert streams
#      in the Security tab). A reuse run scans nothing because it builds
#      nothing: the digest it re-tags is the one the main-branch run already
#      scanned and uploaded under those very categories, so the coverage
#      claim is per DIGEST, not per run.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Releases are idempotent (image tags are immutable per digest), so we do not
# cancel an in-flight release if a new push lands — that would leave a tag
# half-promoted.
#
# Keyed on the COMMIT, not the ref. A release produces two refs for one commit —
# the release commit on `main`, then the `v*` tag — and both trigger this
# workflow. Under a ref key those landed in different groups and ran in
# PARALLEL: two full pipelines building and pushing to the same GHCR packages
# from the same source, roughly a minute apart. Both runs are wanted (the main
# push produces `:edge` / `:sha-…`, the tag push the semver tags), but they must
# not run at the same time.
#
# v1.5.36 is what this cost: three concurrent runs against the same packages
# produced two registry-side failures on `basetool-ingest` within nine minutes —
# `error writing layer blob: not_found` on a push, and a `403` from ghcr.io's
# token endpoint for a `pull` scope in a job whose own push had just succeeded.
# The tag run died between tagging and signing, which is the worst place for it:
# `:1.5.36` existed, unsigned, and `deploy.sh` verifies signatures fail-closed.
concurrency:
  group: release-images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write          # push to ghcr.io
  id-token: write          # cosign keyless OIDC (Sigstore Fulcio) + provenance attestation
  attestations: write      # SLSA provenance + SBOM attestation
  security-events: write   # Trivy SARIF upload

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Decide whether this run has to build the three app images at all, or whether
  # it may re-tag the already-built, already-signed index the main-branch run
  # produced for the very same commit (REQ-OPS-021, ADR-0137).
  #
  # Why this exists: a release fires this workflow twice for ONE commit — the
  # release commit lands on `main`, then release-publish.yml tags that same merge
  # commit `vX.Y.Z`. The `release-images-${{ github.sha }}` concurrency group
  # serialises the pair on purpose (see its comment above), so the two pipelines
  # ADD UP: v1.5.53 spent 6:56 on the main run and another 11:40 on the tag run
  # to produce bit-equivalent images. The tag run's only real product is the set
  # of semver tags, and `imagetools create` applies those to an existing digest
  # without moving a single layer — which is exactly what promote.yml already
  # does for `:stable`.
  #
  # Reuse is gated on several independent conditions, ALL of which must hold. The
  # decision defaults to "build" and only ever moves to "reuse" on a complete
  # positive result, so every failure mode — registry hiccup, unsigned image,
  # half-pushed index, unexpected tag shape — degrades to today's behaviour
  # rather than to a bad release.
  plan:
    name: Plan (rebuild or reuse)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      # 'true' only when every gate below passed. Consumers must compare against
      # the literal 'true' and treat everything else (including the empty string
      # a failed job leaves behind) as "build".
      reuse: ${{ steps.decide.outputs.reuse }}
      # JSON object module -> verified index digest, e.g.
      # {"backend":"sha256:…","frontend":"sha256:…","ingest":"sha256:…"}.
      # `{}` when not reusing. The merge job re-tags THIS digest — the one that
      # was verified — so no window opens between the check and the use.
      digests: ${{ steps.decide.outputs.digests }}
      # The `:sha-<short>` tag the reuse candidate was resolved from, surfaced
      # for the step summary and for debugging a reuse that did not happen.
      source_tag: ${{ steps.source-tag.outputs.version }}

    steps:
      # Derive the `:sha-<short>` tag through metadata-action itself rather than
      # slicing `github.sha` by hand. The merge job below writes that tag with
      # the same action and the same `type=sha,prefix=sha-,format=short` rule;
      # deriving it twice from one implementation means the reuse lookup and the
      # tag it looks up cannot drift if the action ever changes its short-sha
      # width. With a single tag rule configured, `outputs.version` IS that tag.
      - name: Derive the :sha-<short> tag of the source images
        id: source-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-backend
          tags: type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Decide
        id: decide
        env:
          SOURCE_TAG: ${{ steps.source-tag.outputs.version }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool
        run: |
          set -euo pipefail

          # Record the decision and stop. Every exit from this script goes
          # through here, so `reuse` and `digests` are always both written — a
          # job that emitted only one of them would leave the merge job reading
          # an empty `digests` while `reuse` said true.
          #   $1 = true|false   $2 = digests JSON   $3 = human-readable reason
          decide() {
            printf 'reuse=%s\n' "$1" >> "$GITHUB_OUTPUT"
            printf 'digests=%s\n' "$2" >> "$GITHUB_OUTPUT"
            if [ "$1" = true ]; then verdict='reuse existing images'; else verdict='full build'; fi
            {
              echo "### Build plan"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Decision | ${verdict} |"
              echo "| Source tag | \`${SOURCE_TAG}\` |"
              echo "| Reason | ${3} |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "plan: reuse=$1 (${3})"
            exit 0
          }

          # Gate 1 — only the PUSH of a version tag is a reuse candidate.
          # A main-branch push is the run that produces the source images in the
          # first place. `workflow_dispatch` is deliberately excluded even on a
          # tag: "Run workflow" is the documented manual kick for a release whose
          # images are missing or suspect (see release-publish.yml), and an
          # operator who reaches for it wants a REBUILD, not a re-tag.
          if [ "$EVENT_NAME" != "push" ] || [ "$REF_TYPE" != "tag" ]; then
            decide false '{}' "not a version-tag push (event=${EVENT_NAME}, ref_type=${REF_TYPE})"
          fi

          # Gate 2 — the derived tag must actually look like a short-sha tag.
          # Cheap insurance against a metadata-action change silently handing us
          # something else: an empty string would resolve to the implicit
          # `:latest`, and re-tagging THAT as a release would be a spectacular
          # way to ship the wrong image.
          case "$SOURCE_TAG" in
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) decide false '{}' "unexpected source tag shape '${SOURCE_TAG}'" ;;
          esac

          digests='{}'
          for module in backend frontend ingest; do
            image="${IMAGE_PREFIX}-${module}"

            # Gate 3 — the source index must exist. Missing means the main-branch
            # run never got here (failed, cancelled, or the tag sits on a commit
            # that never landed on main).
            #
            # stderr of these three probes is deliberately NOT swallowed. The
            # `decide` line says WHICH gate refused; the tool's own message says
            # why, and without it a registry blip and a genuinely absent (or
            # unsigned) image produce byte-identical operator-facing output —
            # the failure mode promote.yml's verify step was fixed for.
            if ! digest=$(docker buildx imagetools inspect "${image}:${SOURCE_TAG}" \
                            --format '{{.Manifest.Digest}}') || [ -z "$digest" ]; then
              decide false '{}' "no ${image}:${SOURCE_TAG} in the registry"
            fi

            # Gate 4 — the index must carry BOTH architectures. `imagetools
            # create` happily re-tags a single-arch index, and a release that
            # silently dropped linux/arm64 would only surface on the host at
            # `docker pull` time. `--raw` rather than a Go template because the
            # template context for an index has differed across buildx versions
            # while the raw OCI JSON has not. The `select` also drops the
            # attestation manifests, which carry platform `unknown/unknown`.
            raw=$(docker buildx imagetools inspect "${image}@${digest}" --raw || true)
            for want in amd64 arm64; do
              if ! printf '%s' "$raw" | jq -e --arg a "$want" \
                   '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a)] | length > 0' \
                   >/dev/null 2>&1; then
                decide false '{}' "${image}@${digest} has no linux/${want} child"
              fi
            done

            # Gate 5 — the digest must carry this workflow's own keyless
            # signature, minted on the MAIN branch. Pinned to `refs/heads/main`
            # rather than promote.yml's wider `(heads/main|tags/v.+)`: the only
            # legitimate producer of a reuse candidate is the main-branch run of
            # this very commit, so anything else — a tag-run signature included —
            # means the provenance is not what this optimisation assumes and the
            # run should simply build. This is the same supply-chain seam
            # promote.yml (REQ-OPS-002) and scripts/deploy.sh (REQ-OPS-015) stand
            # on; reuse must not widen it.
            if ! cosign verify "${image}@${digest}" \
                 --certificate-identity-regexp "https://github.com/${REPO}/\.github/workflows/release-images\.yml@refs/heads/main" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 >/dev/null; then
              decide false '{}' "no valid main-branch signature on ${image}@${digest}"
            fi

            digests=$(jq -cn --argjson d "$digests" --arg m "$module" --arg v "$digest" '$d + {($m): $v}')
            echo "reuse candidate ok: ${image}:${SOURCE_TAG} -> ${digest}"
          done

          decide true "$digests" "all three app images exist, are dual-arch and carry the main-branch run's signature"

  build:
    name: Build (${{ matrix.module }} / ${{ matrix.platform }})
    needs: plan
    # Skipped wholesale on a reuse run. `!= 'true'` rather than `== 'false'` so a
    # plan job that died without writing its output still builds.
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingest]
        platform: [linux/amd64, linux/arm64]
        # `include` augments the cartesian product without expanding it: each
        # of the 4 (module, platform) combinations gets the matching `runs-on`
        # label added, so we end up with 2 amd64 jobs on `ubuntu-latest` and
        # 2 arm64 jobs on `ubuntu-24.04-arm`, all four in parallel. Note that
        # `ubuntu-24.04-arm` is free for public repositories; if the project
        # ever goes private, switch to `ubuntu-22.04-arm` (cheaper minute
        # billing) or fall back to qemu emulation with `ubuntu-latest`.
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    steps:
      # `linux/amd64` -> `linux-amd64` for use in artifact / cache-scope names
      # where the slash would break shell globs, artifact-name validation
      # (no `/` allowed) and SARIF category strings.
      - name: Resolve platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe --tags` in the `Compute application version` step
          # below needs the full tag set and enough history to reach the most
          # recent tag from any non-tag commit. The default `fetch-depth: 1`
          # is a shallow clone without any tags, which would force the version
          # resolution to fall back to a bare short SHA on every main-branch
          # build. `0` = full history.
          fetch-depth: 0

      # Compute the human-readable version string baked into the frontend
      # image's `META-INF/build-info.properties` (and, transitively, the
      # sidebar's discreet version chip rendered by `AppVersionAdvice`).
      #   - Tag pushes resolve to the tag name verbatim (e.g. `v0.2.3`).
      #   - Branch pushes resolve to `vX.Y.Z-<n>-g<sha>` where `n` is the
      #     number of commits since the last reachable tag — auditable
      #     reference back to a release boundary plus the exact commit.
      #   - Initial-state repositories without any tag yet fall back to the
      #     bare short SHA via `--always`.
      # `--dirty` is intentionally omitted here: a GitHub Actions runner
      # always builds from a clean checkout, so an unexpected `-dirty`
      # suffix would point at a CI bug, not a legitimate state. The
      # developer-side `git describe` in `frontend/build.gradle.kts` does
      # add `--dirty` because local incremental builds against a modified
      # worktree are a normal flow.
      - name: Compute application version
        id: app-version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # No QEMU here — the matrix already runs each platform on its own
      # native runner. setup-qemu-action would only add overhead.
      #
      # Local wrapper rather than docker/setup-buildx-action directly: it
      # pre-pulls the BuildKit image with retry/backoff and, if Docker Hub stays
      # unreachable, from a mirror registry on a different network path, so
      # neither a transient Docker Hub failure nor a single runner's broken
      # egress to it can kill the builder boot (.github/actions/setup-buildx).
      # The `docker-container` driver is required here for the `type=gha` cache
      # exporter below, so the BuildKit container pull is unavoidable.
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN gets `packages: write` from the workflow permissions
          # block above, scoped to this repo's package namespace. No PAT
          # required, no secret rotation needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-arch builds only need the OCI labels here; tags are applied to
      # the final merged manifest by `imagetools create` in the merge job.
      # metadata-action is still useful in this job because it emits the
      # `org.opencontainers.image.{title,description,vendor,source,...}`
      # labels that build-push-action attaches to the per-arch image
      # manifest — those labels then ride along into the merged index.
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          labels: |
            org.opencontainers.image.title=basetool-${{ matrix.module }}
            org.opencontainers.image.description=Profit Basetool ${{ matrix.module }} (Spring Boot)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push per-arch image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Forwarded to both module Dockerfiles. The frontend consumes it via
          # `-PappVersion=...` to override `bootBuildInfo`'s default version;
          # the backend just declares the ARG to silence BuildKit's "unused
          # build arg" warning (it has no UI to render a version chip on).
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          # Push the per-arch image as a digest-only reference (no tag). The
          # merge job below assembles all per-arch digests into a single
          # multi-arch OCI image index and applies all final tags there.
          # `name-canonical=true` makes the registry store the image under
          # its full canonical name so the imagetools merge can resolve it
          # consistently across both per-arch jobs.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }},push-by-digest=true,name-canonical=true,push=true
          # No `cache-from` / `cache-to` on purpose — see the "Deliberately NO
          # BuildKit layer cache" paragraph in the file header for the measured
          # reasoning. Short version: `type=gha,mode=max` spent 40-246s per job
          # exporting a cache that GitHub's 10 GB per-repo quota evicted before
          # the next run could read it, so the dependency layer re-ran anyway in
          # 11 of 12 measured jobs. Before adding a cache back, check
          # `gh api repos/{owner}/{repo}/actions/cache/usage` — if the repo is at
          # the quota, a new cache consumer only makes every other one worse.
          # `mode=max` provenance records every build step's command and
          # parameters in the SLSA attestation; the default `mode=min` only
          # records the final manifest. Max is verbose but auditable. The
          # attestation manifest is attached to the per-arch image; the
          # merge job's `imagetools create` carries it through into the
          # final multi-arch index without further plumbing.
          provenance: mode=max
          # Attach an SPDX SBOM of every package shipped in the image as an
          # OCI attestation. This is image-scope; the CycloneDX BOM produced
          # by `./gradlew cyclonedxBom` in the release-prepare workflow is
          # Java-only, the buildx SBOM also covers the Alpine + JRE layers.
          sbom: true

      # The merge job needs each per-arch digest to assemble the manifest.
      # GitHub Actions job outputs do not survive matrix expansion (each
      # matrix cell would overwrite the previous one), so we materialise
      # the digests as zero-byte artifact files named after their digest
      # value. The merge job downloads them per module and globs them.
      - name: Export digest
        run: |
          mkdir -p "/tmp/digests/${{ matrix.module }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.module }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Distinct per-arch artifact name so the four parallel build jobs
          # do not collide. The merge job downloads the pair for its module
          # via `pattern: digest-<module>-*`.
          name: digest-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.module }}/*
          if-no-files-found: error
          retention-days: 1

  # Trivy, fanned out per (module, platform) alongside `merge` rather than tacked
  # onto the end of `build`. Two reasons, both about the scan's relationship to
  # the release rather than about the scan itself:
  #
  #   1. Latency. `merge` needs the per-arch digests and nothing else, yet it
  #      used to wait for a ~30s scan plus a ~7s SARIF upload in every build job
  #      first. Scanning in parallel takes that off the path to a signed image.
  #   2. Blast radius. `exit-code: 0` says the scan is advisory — but that only
  #      covers Trivy FINDING something. A hard failure of the action itself (DB
  #      download, registry blip) or of the SARIF upload failed the whole build
  #      job, which skipped `merge` for every module: no tags, no signature, a
  #      release lost to an advisory step. In its own job it can fail loudly and
  #      redly without touching the images.
  #
  # Kept on the matching native runner per platform, exactly as before, so the
  # per-arch Trivy DB caches stay warm and nothing about the scan itself changes.
  scan:
    name: Scan (${{ matrix.module }} / ${{ matrix.platform }})
    needs: [plan, build]
    # `always()` because this job must still run when a SIBLING build cell
    # failed — the cells that did succeed have images worth scanning, which is
    # the behaviour the in-build scan had for free. Restricted to runs that
    # actually built: a reuse run re-tags a digest the main-branch run already
    # scanned under these very categories, so re-scanning it would add nothing
    # but a duplicate alert stream. `needs.build.result` is 'skipped' on a reuse
    # run and when `plan` itself failed, which is exactly when we want no scan.
    if: ${{ always() && needs.plan.outputs.reuse != 'true' && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingest]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Resolve platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Required: the basetool-* packages are private, and Trivy pulls the image
      # it scans straight from GHCR. It reads the credentials out of
      # `~/.docker/config.json`, which is exactly what login-action writes — the
      # same implicit dependency the scan had while it lived in the build job
      # (which logged in for the push). Without this the scan fails on a 401,
      # which is why it is not "just" a convenience step.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `continue-on-error` because the artifact is absent exactly when this
      # cell's build failed, and that is not this job's failure to report — the
      # build job already reported it. The next step turns "no artifact" into a
      # clean skip instead of a second, louder error pointing at the scan.
      - name: Download digest
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digest

      # The build job materialises the digest as a zero-byte file NAMED after
      # the digest (job outputs do not survive matrix expansion), so the value
      # is the filename with the `sha256:` prefix restored.
      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          name=$(find /tmp/digest -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | head -n 1 || true)
          if [ -z "$name" ]; then
            echo "::warning::no digest artifact for ${{ matrix.module }}/${{ matrix.platform }} — its build did not produce an image; skipping the scan"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@sha256:${name}" >> "$GITHUB_OUTPUT"

      # Trivy scans the per-arch image by its exact digest — this job runs on
      # the matching native runner (the arm64 image is scanned by an arm64
      # runner), so no QEMU emulation is needed inside Trivy either.
      # `exit-code: 0` is deliberate: we do NOT block the push on findings (a
      # CVE-bearing image is preferable to a missing image when a hotfix is
      # urgent). The findings show up in the Security tab and the `promote.yml`
      # workflow re-runs this check as a gate before flipping :stable.
      #
      # `TRIVY_PLATFORM` is required because `provenance: mode=max` + `sbom: true`
      # cause buildkit to push an OCI index (image manifest + provenance manifest
      # + SBOM manifest) rather than a bare image manifest, and the exported
      # digest points at that index. Trivy's default child-selection inside an
      # OCI index is hardcoded to `linux/amd64`, which works coincidentally on
      # the amd64 runner (the index's per-arch image happens to be linux/amd64)
      # but fails on the arm64 runner with `no child with platform linux/amd64
      # in index ...`. Setting `TRIVY_PLATFORM` to the matrix platform pins the
      # selection to the matching child explicitly so the scan stays consistent
      # regardless of buildkit's index-vs-manifest output decision.
      - name: Run Trivy vulnerability scan
        if: steps.digest.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: steps.digest.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}.sarif
          # Distinct category per (module, platform) so GitHub's Security
          # tab treats the six scans as independent alert streams instead
          # of overwriting each other.
          category: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}

  merge:
    name: Merge & sign (${{ matrix.module }})
    needs: [plan, build]
    # `always()` is needed only because `build` is legitimately SKIPPED on a
    # reuse run, and a skipped dependency would otherwise skip this job too. The
    # two guards behind it keep the original semantics intact: `plan` must have
    # succeeded, and on a building run every build cell must have succeeded —
    # a partial build must not produce tags, exactly as `needs: build` enforced
    # before. `fail-fast: false` on the build matrix means one failed cell shows
    # up here as `needs.build.result == 'failure'`, which this expression
    # rejects.
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.reuse == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingest]

    steps:
      # Nothing to download on a reuse run — the source is the single verified
      # index digest `plan` handed over, not a pair of freshly built per-arch
      # digests.
      - name: Download per-arch digests
        if: needs.plan.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests/${{ matrix.module }}
          # Pull both `digest-<module>-linux-amd64` and `digest-<module>-linux-arm64`
          # artifacts for this module; `merge-multiple: true` flattens them
          # into the same directory so the manifest-create loop below can
          # glob them with a single `*`.
          pattern: digest-${{ matrix.module }}-*
          merge-multiple: true

      # No `Set up Docker Buildx` here on purpose. This job only runs
      # `docker buildx imagetools create` / `inspect`, which are pure
      # registry-side manifest operations performed by the buildx CLI plugin
      # that ships with the runner's Docker — they never dispatch a build and
      # therefore need no builder instance. Booting a `docker-container`
      # builder anyway would pull `moby/buildkit` from Docker Hub for nothing,
      # which is exactly the anonymous-pull flake that killed the keycloak-spi
      # job of run 30160708503. Three fewer Docker Hub pulls per release.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          tags: |
            # Rolling pointer on every main push — useful for chasing the
            # bleeding edge in a staging environment, never used by the server.
            type=edge,branch=main
            # Immutable per-commit reference. The server's deploy.sh can pin to
            # `:sha-<short>` if an explicit commit-level rollback is required.
            type=sha,prefix=sha-,format=short
            # Semver tags from `v1.4.2` git tag — strip the `v` so image tags
            # follow the OCI convention (`:1.4.2`, not `:v1.4.2`).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `:latest` only moves on a tag push, never on a main push, so that
            # a casual `docker pull ...:latest` always yields the most recent
            # release rather than an arbitrary main commit.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # `imagetools create` assembles an OCI image index from N source
      # references and applies one or more tags to it. It is a pure registry-side
      # manifest operation: no layer is pulled, rebuilt or re-pushed. The source
      # refs are themselves OCI indexes (image manifest + provenance manifest +
      # SBOM manifest), so the resulting index inherits the attestation chain
      # intact — no separate `cosign attest` step needed for provenance / SBOM.
      # metadata-action exports its `tags` output as JSON via the
      # `DOCKER_METADATA_OUTPUT_JSON` env var; the jq expression below transforms
      # each tag string into a `-t <tag>` CLI argument.
      #
      # Two source shapes, one command:
      #   build run — the two per-arch digests this run just pushed, which
      #               `create` assembles into a fresh multi-arch index.
      #   reuse run — the single already-merged, already-signed index digest
      #               `plan` verified, which `create` simply re-tags. This is
      #               byte-for-byte the operation promote.yml performs for
      #               `:stable`, so the release tags end up pointing at the exact
      #               digest the main-branch run built, scanned and signed.
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          REUSED_DIGEST: ${{ fromJSON(needs.plan.outputs.digests || '{}')[matrix.module] }}
          DIGEST_DIR: /tmp/digests/${{ matrix.module }}
          MODULE: ${{ matrix.module }}
        run: |
          set -eu

          # Collect the source references into "$@" so they survive as separate
          # CLI arguments without another round of word-splitting below.
          if [ "$REUSE" = "true" ]; then
            if [ -z "$REUSED_DIGEST" ]; then
              echo "::error::reuse was requested but plan handed over no digest for ${MODULE}" >&2
              exit 1
            fi
            set -- "${IMAGE}@${REUSED_DIGEST}"
            echo "re-tagging verified digest ${REUSED_DIGEST}"
          else
            cd "$DIGEST_DIR"
            # One file per (module, platform) cell of the build matrix. Asserting
            # the count guards against publishing a silently single-arch index if
            # an artifact ever goes missing — that defect would otherwise only
            # surface on the host, at `docker pull` time, on one architecture.
            # Update this number together with the `platform` matrix.
            count=$(find . -maxdepth 1 -type f | wc -l)
            if [ "$count" -ne 2 ]; then
              echo "::error::expected 2 per-arch digests for ${MODULE}, found ${count}" >&2
              find . -maxdepth 1 -type f -print >&2
              exit 1
            fi
            # One `image@sha256:<digest>` argument per digest file. Built by a
            # loop rather than by word-splitting a `printf`, so a registry path
            # is never interpreted as a printf format string and nothing depends
            # on IFS.
            set --
            for f in *; do
              [ -f "$f" ] || continue
              set -- "$@" "${IMAGE}@sha256:${f}"
            done
          fi

          # Retried because the failure mode is transient and the operation is
          # idempotent: re-tagging the same source digests yields the same index.
          # GHCR answers a contended push with `error writing layer blob:
          # not_found` (seen on run 30930709770), which a second attempt clears.
          for attempt in 1 2 3; do
            # Intentional word-splitting on the jq output only: it must expand
            # into `-t tagA -t tagB ...`, whereas the source refs are already
            # separate arguments in "$@".
            # shellcheck disable=SC2046
            if docker buildx imagetools create \
              $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              "$@"; then
              exit 0
            fi
            echo "::warning::manifest merge attempt ${attempt} failed for ${MODULE}; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not create the merged manifest for ${MODULE}" >&2
          exit 1

      # Resolve the manifest digest of the newly-tagged index. Cosign signs
      # by digest (not tag) so that a later `:stable` promotion sees the
      # same signature without needing a re-sign.
      - name: Inspect merged manifest
        id: inspect
        run: |
          # Note `-e` is on regardless — GitHub runs `run:` blocks as `bash -e`.
          set -eu
          # Read the digest via the Go-template field directly (as promote.yml
          # does) rather than `{{json .Manifest}} | jq -r '.digest'`: a newer
          # buildx serializes that JSON with capitalized Go field names
          # (`.Digest`), so the lowercase `.digest` jq path silently produced an
          # empty string — which then made the sign step choke on a `…@`
          # reference with no digest. Fail loudly on an empty digest so a future
          # regression of the same shape is caught here, not at `cosign sign`.
          # Retried for the same reason as the merge above, and this is the step
          # that actually bit: run 30931003203 got `403 Forbidden` from
          # ghcr.io/token for a `pull` scope moments after the very same
          # credentials had pushed successfully. A read is idempotent, so a
          # retry costs nothing and turns a registry blip into a short delay —
          # instead of a release whose image is tagged but never signed.
          digest=""
          for attempt in 1 2 3; do
            # `if cmd; then` rather than `cmd && ...`: GitHub runs `run:` blocks under
            # `bash -e`, and an AND-OR list whose FIRST command fails still trips
            # errexit — which would abort the step on attempt 1 and make the retry
            # decorative.
            if digest=$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}:${{ steps.meta.outputs.version }}" \
              --format '{{.Manifest.Digest}}'); then
              [ -n "$digest" ] && break
            fi
            echo "::warning::digest lookup attempt ${attempt} failed for ${{ matrix.module }}; retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$digest" ]; then
            echo "::error::could not resolve merged manifest digest for ${{ matrix.module }}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the *manifest digest*, not the tag. Multiple tags pointing
      # at the same digest are all covered by one signature, so a later
      # `:stable` promotion does not need a re-sign. The keyless flow
      # uses the workflow's GitHub-OIDC token to mint a short-lived
      # Sigstore Fulcio cert and writes the signature to the Rekor
      # transparency log.
      #
      # Runs unconditionally, reuse run included. On a reuse run the digest
      # already carries the main-branch run's signature — `plan` verified
      # exactly that before allowing the reuse — so this second signature is
      # strictly redundant. It is kept because signing is idempotent, costs ~5s,
      # and buys an invariant worth more than those seconds: *every* digest a
      # release tag points at was signed by the run that applied the tag. That
      # holds even if a future edit loosens a gate in `plan`, and it means a
      # release tag never depends on a signature this run did not itself
      # witness.
      #
      # Retry wrapper: the keyless path is a network round-trip to the
      # Sigstore public-good services (Fulcio cert issuance + Rekor log
      # upload). Those shared services intermittently return transient
      # gRPC/HTTP2 failures — the one that failed the v0.4.10 frontend
      # sign was `error signing bundle: stream error: stream ID 1;
      # INTERNAL_ERROR; received from peer`. A single flake there would
      # fail an otherwise-complete release whose images are already pushed
      # to GHCR, leaving an unsigned (and therefore unpullable, since the
      # server verifies signatures) tag. Signing is idempotent — re-signing
      # the same digest just attaches another equivalent signature — so it
      # is safe to retry with exponential backoff before giving up.
      - name: Sign image (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      # A SECOND provenance record, in a store the registry cannot rewrite.
      #
      # The image already carries SLSA provenance: buildx attached a `mode=max`
      # in-toto attestation manifest to it, and the step above cosign-signed the
      # index digest. Both of those live **inside the GHCR repository** as
      # ordinary manifests. That is their weakness, not their strength: anything
      # holding `packages: write` on this org can delete a package version and
      # push a new one, and the provenance manifest and the signature layer go
      # with it, because they are siblings of the image in the very repository
      # the credential controls. The host gate (REQ-OPS-015) closes the case
      # where `:stable` is moved to point at a *different* digest; it does not
      # close the case where the whole package is rewritten as a coherent set.
      #
      # `actions/attest-build-provenance` writes a signed SLSA v1 provenance
      # statement, keyed by this digest, to GitHub's own attestation store. That
      # store is reached through the `attestations: write` permission and the
      # `/repos/{owner}/{repo}/attestations` API — NOT through `packages: write`
      # — so a registry-side compromise cannot reach it, and a verifier can ask
      # GitHub "what do you know about this digest?" without trusting the
      # registry that serves it. It is a second, independently rooted answer to
      # the same question, which is the entire point of adding it next to a
      # provenance record that already exists.
      #
      # `push-to-registry: false` is deliberate and is the whole design. Pushing
      # the attestation back to GHCR would place the independent copy in exactly
      # the mutable location whose mutability motivated it, and it would add a
      # referrer manifest to an index whose composition `plan` and `merge`
      # reason about explicitly. Keeping it out of the registry is the feature.
      #
      # Verify with a single command, no cosign and no identity regexp to keep
      # in sync across deploy.sh / promote.yml / this file:
      #   gh attestation verify       #     oci://ghcr.io/krt-profit/basetool-<module>:<tag>       #     --repo krt-profit/basetool
      #
      # Runs unconditionally, reuse run included, for the same reason the sign
      # step does: every digest a release tag points at carries an attestation
      # from the run that applied the tag, rather than one this run only
      # inherited and never witnessed. Attesting a digest twice is additive --
      # verification passes on any matching statement.
      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false

      # Makes the build-vs-reuse decision legible on the run page next to the
      # digest it produced, so "why was this release so fast?" is answerable
      # without reading the plan job's log.
      - name: Summarise
        env:
          MODULE: ${{ matrix.module }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
        run: |
          set -eu
          if [ "$REUSE" = "true" ]; then
            origin="reused \`${SOURCE_TAG}\` (built by the main-branch run of this commit)"
          else
            origin="built by this run"
          fi
          {
            echo "### basetool-${MODULE}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Origin | ${origin} |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The host-configuration bundle: a `FROM scratch` image (docker/config/Dockerfile)
  # carrying only the compose file + the bind-mounted maintenance/theme trees. It
  # is NOT arch-specific (no executables, just files), but is built multi-arch for
  # parity so `docker create`/`docker cp` on either host architecture resolves a
  # matching child. No Trivy scan (a scratch image has no OS packages to flag).
  # Same tag scheme + same cosign keyless signature as the app images, so
  # promote.yml flips it to :stable through the identical verify-and-retag path.
  build-config:
    name: Build & sign config bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Local wrapper — retries the BuildKit image pull and falls back to a
      # mirror registry, see the build job above. The `docker-container` driver
      # is required here because this image is built for two platforms in one job.
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config
          # Identical tag scheme to the app images (merge job) so a release's
          # config bundle is addressable as :1.4.3 and promotable to :stable.
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=basetool-config
            org.opencontainers.image.description=Profit Basetool host configuration bundle (compose + maintenance page + Keycloak theme)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push config bundle (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/config/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Parity with the app images: a max-mode SLSA provenance + SPDX SBOM so
          # an auditor can prove which commit produced this exact config bundle.
          provenance: mode=max
          sbom: true

      # Defence in depth on top of the Dockerfile's COPY allowlist and
      # .dockerignore: pull the pushed bundle back and FAIL the release if any
      # secret-shaped file slipped in (e.g. a future Dockerfile edit widening the
      # COPY). The scratch image has no entrypoint, so `docker create` needs a
      # placeholder argument; the container is never started.
      - name: Assert config bundle carries no host secrets
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cid=$(docker create "$IMAGE" /bundle)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/config-bundle && mkdir -p /tmp/config-bundle
          docker cp "$cid:/config/." /tmp/config-bundle/
          if find /tmp/config-bundle \
               \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                  -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) \
               -print | grep -q .; then
            echo "::error::config bundle contains a forbidden secret-shaped file:" >&2
            find /tmp/config-bundle \
              \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                 -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) -print >&2
            exit 1
          fi
          # Presence guard: the bundle MUST carry every payload the host deploy consumes.
          # A Dockerfile COPY narrowed by mistake (e.g. dropping docker-compose.monitoring.yml
          # or the monitoring/ tree) would otherwise ship a bundle that silently omits the
          # monitoring compose / config, leaving the host stuck on a stale definition - the
          # exact class of the postgres_exporter stat_replication rollout gap (#1017). Fail
          # the release instead (ADR-0049 config bundle, ADR-0072 monitoring stack).
          missing=0
          for f in docker-compose.yml docker-compose.monitoring.yml; do
            test -f "/tmp/config-bundle/${f}" \
              || { echo "::error::config bundle is missing file: ${f}" >&2; missing=1; }
          done
          for d in docker/maintenance keycloak-theme monitoring; do
            test -d "/tmp/config-bundle/${d}" \
              || { echo "::error::config bundle is missing directory: ${d}" >&2; missing=1; }
          done
          test "${missing}" -eq 0 || exit 1
          echo "config bundle OK: no secrets present, all required payloads present"

      - name: Inspect pushed manifest
        id: inspect
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config:${{ steps.meta.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve config manifest digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same keyless signature + retry rationale as the app-image sign step. The
      # signature is pinned to the manifest digest, so the later :stable
      # promotion (promote.yml) is covered without a re-sign.
      - name: Sign config bundle (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      # Parity with the app images: a GitHub-attestation-store provenance record
      # alongside the in-registry buildx provenance + cosign signature, so this
      # bundle can be verified without trusting the registry that serves it. The
      # full rationale (and why `push-to-registry` stays false) is on the merge
      # job's equivalent step above.
      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false

  # The Keycloak provider-JAR bundle: a `FROM scratch` image (docker/keycloak-spi/
  # Dockerfile) carrying ONLY the keycloak-spi provider JAR. It is a SEPARATE
  # artifact from basetool-config because REQ-OPS-005 bars keycloak/providers JARs
  # from the config bundle. The JAR is architecture-independent Java-21 bytecode,
  # so it is compiled ONCE natively (no QEMU Gradle) and copied to the build-context
  # root before the scratch image is built multi-arch for parity. Same tag scheme +
  # same cosign keyless signature as the app images, so promote.yml flips it to
  # :stable through the identical verify-and-retag path (REQ-OPS-007, ADR-0055).
  build-keycloak-spi:
    name: Build & sign keycloak-spi bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Plain library JAR (compileOnly Keycloak SPIs, Java-21 bytecode via
      # `--release 21` in keycloak-spi/build.gradle.kts). `:keycloak-spi:jar` runs
      # compile + jar only — no tests, no Checkstyle/Spotless (ci.yml covers those).
      # The artifact is moved to the build-context root because .dockerignore bars
      # `**/build`, so the scratch image cannot COPY from keycloak-spi/build/libs.
      - name: Build keycloak-spi provider JAR
        run: |
          set -euo pipefail
          ./gradlew :keycloak-spi:jar --no-daemon
          mapfile -t jars < <(find keycloak-spi/build/libs -maxdepth 1 -type f \
            -name 'keycloak-spi-*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected exactly one keycloak-spi JAR, found ${#jars[@]}: ${jars[*]:-<none>}" >&2
            ls -la keycloak-spi/build/libs >&2 || true
            exit 1
          fi
          cp "${jars[0]}" keycloak-spi.jar
          ls -l keycloak-spi.jar

      # Local wrapper — retries the BuildKit image pull and falls back to a
      # mirror registry, see the build job above. This is the job that lost run
      # 30160708503 to a Docker Hub timeout here, after its Gradle build had
      # already succeeded.
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi
          # Identical tag scheme to the app images so a release's provider JAR is
          # addressable as :1.4.3 and promotable to :stable in lock-step.
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=basetool-keycloak-spi
            org.opencontainers.image.description=Profit Basetool Keycloak provider JAR (Discord federation + first-login gate)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push keycloak-spi bundle (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/keycloak-spi/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Parity with the app images: max-mode SLSA provenance + SPDX SBOM so an
          # auditor can prove which commit produced this exact provider JAR.
          provenance: mode=max
          sbom: true

      # Defence in depth: pull the pushed bundle back and FAIL the release if it
      # carries anything other than the provider JAR (no secret-shaped file), and
      # assert the JAR is present where deploy.sh expects it.
      - name: Assert keycloak-spi bundle carries only the provider JAR
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cid=$(docker create "$IMAGE" /bundle)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/spi-bundle && mkdir -p /tmp/spi-bundle
          docker cp "$cid:/providers/." /tmp/spi-bundle/
          test -f /tmp/spi-bundle/keycloak-spi.jar \
            || { echo "::error::keycloak-spi bundle is missing /providers/keycloak-spi.jar" >&2; exit 1; }
          if find /tmp/spi-bundle \
               \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                  -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) \
               -print | grep -q .; then
            echo "::error::keycloak-spi bundle contains a forbidden secret-shaped file" >&2
            exit 1
          fi
          # The bundle must contain exactly the provider JAR and nothing else.
          if find /tmp/spi-bundle -type f ! -name 'keycloak-spi.jar' -print | grep -q .; then
            echo "::error::keycloak-spi bundle carries unexpected files:" >&2
            find /tmp/spi-bundle -type f ! -name 'keycloak-spi.jar' -print >&2
            exit 1
          fi
          echo "keycloak-spi bundle OK: only keycloak-spi.jar present"

      - name: Inspect pushed manifest
        id: inspect
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi:${{ steps.meta.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve keycloak-spi manifest digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same keyless signature + retry rationale as the app-image / config sign
      # steps. Pinned to the manifest digest, so promote.yml's :stable flip is
      # covered without a re-sign.
      - name: Sign keycloak-spi bundle (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      # Parity with the app images: a GitHub-attestation-store provenance record
      # alongside the in-registry buildx provenance + cosign signature, so this
      # bundle can be verified without trusting the registry that serves it. The
      # full rationale (and why `push-to-registry` stays false) is on the merge
      # job's equivalent step above.
      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false
