name: Release Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  ref-guard:
    name: Check the ref may publish signed images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history — the tag check is an ancestry question)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse any ref other than main or a release tag on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main)
              echo "ref ${REF}: main may publish signed images"
              exit 0
              ;;
            refs/tags/v*)
              if ! printf '%s' "${REF#refs/tags/}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::${REF} is not a vMAJOR.MINOR.PATCH release tag; its signature would match no trusted identity"
                exit 1
              fi
              git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
              if ! git merge-base --is-ancestor "$SHA" origin/main; then
                echo "::error::${REF} points at ${SHA}, which is not on main; a release tag may only sign reviewed code"
                exit 1
              fi
              echo "ref ${REF}: ${SHA} is an ancestor of main"
              ;;
            *)
              echo "::error::${REF} may not publish signed images; run this workflow from main or a release tag"
              exit 1
              ;;
          esac

  plan:
    name: Plan (rebuild or reuse, per image)
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    outputs:
      reused_modules: ${{ steps.decide.outputs.reused_modules }}
      digests: ${{ steps.decide.outputs.digests }}
      build_matrix: ${{ steps.decide.outputs.build_matrix }}
      source_tag: ${{ steps.decide.outputs.source_tag }}
      skip: ${{ steps.decide.outputs.skip }}

    steps:
      - name: Derive the :sha-<short> tag of the source images
        id: source-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-backend
          tags: type=sha,prefix=sha-,format=short

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Decide
        id: decide
        env:
          SOURCE_TAG: ${{ steps.source-tag.outputs.version }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool
          MAX_REUSE_AGE_HOURS: '168'
        run: |
          set -euo pipefail
          MODULES="backend frontend ingest"

          decide() {
            local reused="$1" matrix module
            matrix=$(jq -cn --argjson r "$reused" --arg all "$MODULES" '
              [($all | split(" "))[] | select(. as $m | $r | index($m) | not)
               | {module: ., platform: "linux/amd64", "runs-on": "ubuntu-latest"},
                 {module: ., platform: "linux/arm64", "runs-on": "ubuntu-24.04-arm"}]')
            {
              printf 'reused_modules=%s\n' "$reused"
              printf 'digests=%s\n' "$2"
              printf 'build_matrix=%s\n' "$matrix"
              printf 'source_tag=%s\n' "${4:-}"
              printf 'skip=false\n'
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Build plan"
              echo ""
              echo "| Image | Decision |"
              echo "|---|---|"
              for module in $MODULES; do
                if jq -e --arg m "$module" 'index($m)' <<< "$reused" >/dev/null; then
                  echo "| basetool-${module} | re-tag \`${4:-}\` |"
                else
                  echo "| basetool-${module} | build |"
                fi
              done
              echo ""
              echo "${3}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "plan: re-tag ${reused} (${3})"
            exit 0
          }

          verify_candidate() {
            local module="$1" tag="$2" max_age="$3" image digest raw want created built age
            image="${IMAGE_PREFIX}-${module}"

            if ! digest=$(docker buildx imagetools inspect "${image}:${tag}" \
                            --format '{{.Manifest.Digest}}') || [ -z "$digest" ]; then
              echo "no ${image}:${tag} in the registry" >&2; return 1
            fi

            raw=$(docker buildx imagetools inspect "${image}@${digest}" --raw || true)
            for want in amd64 arm64; do
              if ! printf '%s' "$raw" | jq -e --arg a "$want" \
                   '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a)] | length > 0' \
                   >/dev/null 2>&1; then
                echo "${image}@${digest} has no linux/${want} child" >&2; return 1
              fi
            done

            if ! cosign verify "${image}@${digest}" \
                 --certificate-identity-regexp "^https://github\\.com/${REPO}/\\.github/workflows/release-images\\.yml@refs/heads/main$" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 >/dev/null; then
              echo "no valid main-branch signature on ${image}@${digest}" >&2; return 1
            fi

            if [ -n "$max_age" ]; then
              created=$(docker buildx imagetools inspect "${image}@${digest}" --format '{{json .Image}}' \
                | jq -r '(if type == "object" and has("config") then . else (.["linux/amd64"] // {}) end) as $i
                         | ($i.config.Labels["org.opencontainers.image.created"] // $i.created // empty)' || true)
              if [ -z "$created" ] || ! built=$(date -u -d "$created" +%s); then
                echo "cannot read when ${image}@${digest} was built" >&2; return 1
              fi
              age=$(( ($(date -u +%s) - built) / 3600 ))
              if [ "$age" -gt "$max_age" ]; then
                echo "${image}@${digest} was built ${age}h ago, more than ${max_age}h (apk upgrade freshness)" >&2; return 1
              fi
            fi
            printf '%s' "$digest"
          }

          case "$SOURCE_TAG" in
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) decide '[]' '{}' "full build: unexpected source tag shape '${SOURCE_TAG}'" "" ;;
          esac

          if [ "$EVENT_NAME" != "push" ]; then
            decide '[]' '{}' "full build: not a push (event=${EVENT_NAME}); a manual run always builds" ""
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            digests='{}'
            for module in $MODULES; do
              if ! digest=$(verify_candidate "$module" "$SOURCE_TAG" ""); then
                decide '[]' '{}' "full build: basetool-${module} failed a reuse gate (see the log)" "$SOURCE_TAG"
              fi
              digests=$(jq -cn --argjson d "$digests" --arg m "$module" --arg v "$digest" '$d + {($m): $v}')
            done
            decide '["backend","frontend","ingest"]' "$digests" "release tag: all three app images exist, are dual-arch and carry the main-branch run's signature" "$SOURCE_TAG"
          fi

          if [ "$REF" = "refs/heads/main" ]; then
            tip=""
            if git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main'; then
              tip=$(git rev-parse refs/remotes/origin/main)
            fi
            skipcheck=$(python3 .github/scripts/image_reuse_plan.py --skip-check --event "$EVENT_NAME" \
                          --pushed-ref "$REF" --head "$SHA" --before "$BEFORE" --tip "$tip") \
              || skipcheck='{"skip": false, "reason": "the skip check failed; building"}'
            echo "skip check: ${skipcheck}"
            if [ "$(jq -r '.skip' <<< "$skipcheck")" = "true" ]; then
              {
                printf 'reused_modules=[]\n'
                printf 'digests={}\n'
                printf 'build_matrix=[]\n'
                printf 'source_tag=\n'
                printf 'skip=true\n'
              } >> "$GITHUB_OUTPUT"
              {
                echo "### Build plan: skipped — superseded"
                echo ""
                echo "$(jq -r '.reason' <<< "$skipcheck")."
                echo ""
                echo "Nothing is built, tagged or signed by this run; every job after plan is skipped."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Release Images skipped::${SHA:0:12} is superseded by main's tip ${tip:0:12}; no image is built, tagged or signed by this run"
              exit 0
            fi

            width=$(( ${#SOURCE_TAG} - 4 ))
            base=""
            candidates=$(python3 .github/scripts/image_reuse_plan.py --candidates --before "$BEFORE" --head "$SHA") \
              || candidates=""
            for candidate in $candidates; do
              complete=true
              for module in $MODULES; do
                if ! docker buildx imagetools inspect "${IMAGE_PREFIX}-${module}:sha-${candidate:0:${width}}" \
                     --format '{{.Manifest.Digest}}' >/dev/null 2>&1; then
                  complete=false
                  break
                fi
              done
              if [ "$complete" = true ]; then
                base="$candidate"
                break
              fi
              echo "no complete image set for ${candidate:0:12}; trying its parent"
            done
            if [ -z "$base" ]; then
              decide '[]' '{}' "full build: no main ancestor of ${SHA:0:12} within the search bound has all three images" ""
            fi
            [ "$base" = "$BEFORE" ] || echo "::notice title=Reuse base::the previous tip ${BEFORE:0:12} has no images; reusing from ${base:0:12}"

            plan=$(python3 .github/scripts/image_reuse_plan.py --base "$base" --head "$SHA") \
              || decide '[]' '{}' "full build: image_reuse_plan.py failed" ""
            echo "image_reuse_plan: $(jq -c '{rebuild, reuse, reason}' <<< "$plan")"
            previous="sha-${base:0:${width}}"
            reused='[]'
            digests='{}'
            notes=""
            for module in $(jq -r '.reuse[]' <<< "$plan"); do
              if digest=$(verify_candidate "$module" "$previous" "$MAX_REUSE_AGE_HOURS"); then
                reused=$(jq -c --arg m "$module" '. + [$m]' <<< "$reused")
                digests=$(jq -cn --argjson d "$digests" --arg m "$module" --arg v "$digest" '$d + {($m): $v}')
                echo "reuse candidate ok: basetool-${module}:${previous} -> ${digest}"
              else
                notes="${notes} basetool-${module} is built after all: it failed a reuse gate (see the log)."
              fi
            done
            decide "$reused" "$digests" "$(jq -r '.reason' <<< "$plan").${notes}" "$previous"
          fi

          decide '[]' '{}' "full build: ref ${REF} is neither a version tag nor main" ""

  build:
    name: Build (${{ matrix.module }} / ${{ matrix.platform }})
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.build_matrix != '[]'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_matrix) }}

    steps:
      - name: Resolve platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute application version
        id: app-version
        run: echo "version=$(python3 .github/scripts/app_version.py)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          labels: |
            org.opencontainers.image.title=basetool-${{ matrix.module }}
            org.opencontainers.image.description=Profit Basetool ${{ matrix.module }} (Spring Boot)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push per-arch image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODULE=${{ matrix.module }}
            APP_VERSION=${{ steps.app-version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p "/tmp/digests/${{ matrix.module }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.module }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digest-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.module }}/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan (${{ matrix.module }} / ${{ matrix.platform }})
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.build_matrix != '[]' && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_matrix) }}

    steps:
      - name: Resolve platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: digest-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digest

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          name=$(find /tmp/digest -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | head -n 1 || true)
          if [ -z "$name" ]; then
            echo "::warning::no digest artifact for ${{ matrix.module }}/${{ matrix.platform }} — its build did not produce an image; skipping the scan"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@sha256:${name}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        if: steps.digest.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: steps.digest.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}.sarif
          category: trivy-${{ matrix.module }}-${{ env.PLATFORM_PAIR }}

  merge:
    name: Merge & sign (${{ matrix.module }})
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.plan.outputs.build_matrix == '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend, ingest]

    steps:
      - name: Download per-arch digests
        if: ${{ !contains(fromJSON(needs.plan.outputs.reused_modules), matrix.module) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests/${{ matrix.module }}
          pattern: digest-${{ matrix.module }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          REUSE: ${{ contains(fromJSON(needs.plan.outputs.reused_modules), matrix.module) }}
          REUSED_DIGEST: ${{ fromJSON(needs.plan.outputs.digests || '{}')[matrix.module] }}
          DIGEST_DIR: /tmp/digests/${{ matrix.module }}
          MODULE: ${{ matrix.module }}
        run: |
          set -eu

          if [ "$REUSE" = "true" ]; then
            if [ -z "$REUSED_DIGEST" ]; then
              echo "::error::reuse was requested but plan handed over no digest for ${MODULE}" >&2
              exit 1
            fi
            set -- "${IMAGE}@${REUSED_DIGEST}"
            echo "re-tagging verified digest ${REUSED_DIGEST}"
          else
            cd "$DIGEST_DIR"
            count=$(find . -maxdepth 1 -type f | wc -l)
            if [ "$count" -ne 2 ]; then
              echo "::error::expected 2 per-arch digests for ${MODULE}, found ${count}" >&2
              find . -maxdepth 1 -type f -print >&2
              exit 1
            fi
            set --
            for f in *; do
              [ -f "$f" ] || continue
              set -- "$@" "${IMAGE}@sha256:${f}"
            done
          fi

          for attempt in 1 2 3; do
            # shellcheck disable=SC2046
            if docker buildx imagetools create \
              $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              "$@"; then
              exit 0
            fi
            echo "::warning::manifest merge attempt ${attempt} failed for ${MODULE}; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not create the merged manifest for ${MODULE}" >&2
          exit 1

      - name: Inspect merged manifest
        id: inspect
        run: |
          set -eu
          digest=""
          for attempt in 1 2 3; do
            if digest=$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}:${{ steps.meta.outputs.version }}" \
              --format '{{.Manifest.Digest}}'); then
              [ -n "$digest" ] && break
            fi
            echo "::warning::digest lookup attempt ${attempt} failed for ${{ matrix.module }}; retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$digest" ]; then
            echo "::error::could not resolve merged manifest digest for ${{ matrix.module }}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign image (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-${{ matrix.module }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false

      - name: Summarise
        env:
          MODULE: ${{ matrix.module }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REUSE: ${{ contains(fromJSON(needs.plan.outputs.reused_modules), matrix.module) }}
          SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
        run: |
          set -eu
          if [ "$REUSE" = "true" ]; then
            origin="reused \`${SOURCE_TAG}\` (built and signed by an earlier main-branch run; see the plan job)"
          else
            origin="built by this run"
          fi
          {
            echo "### basetool-${MODULE}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Origin | ${origin} |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-config:
    name: Build & sign config bundle
    needs: [ref-guard, plan]
    if: ${{ !cancelled() && needs.ref-guard.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=basetool-config
            org.opencontainers.image.description=Profit Basetool host configuration bundle (compose + maintenance page + Keycloak theme)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push config bundle (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/config/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Assert config bundle carries no host secrets
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cid=$(docker create "$IMAGE" /bundle)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/config-bundle && mkdir -p /tmp/config-bundle
          docker cp "$cid:/config/." /tmp/config-bundle/
          if find /tmp/config-bundle \
               \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                  -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) \
               -print | grep -q .; then
            echo "::error::config bundle contains a forbidden secret-shaped file:" >&2
            find /tmp/config-bundle \
              \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                 -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) -print >&2
            exit 1
          fi
          missing=0
          for f in docker-compose.yml docker-compose.monitoring.yml; do
            test -f "/tmp/config-bundle/${f}" \
              || { echo "::error::config bundle is missing file: ${f}" >&2; missing=1; }
          done
          for d in docker/maintenance/static docker/edge docker/acme keycloak-theme monitoring quadlet/systemd quadlet/env.d; do
            test -d "/tmp/config-bundle/${d}" \
              || { echo "::error::config bundle is missing directory: ${d}" >&2; missing=1; }
          done
          for f in docker/edge/nginx.conf docker/edge/include/maintenance.conf docker/acme/publish-loop.sh; do
            test -s "/tmp/config-bundle/${f}" \
              || { echo "::error::config bundle is missing or has an empty: ${f}" >&2; missing=1; }
          done
          units="$(find /tmp/config-bundle/quadlet/systemd -name '*.container' 2>/dev/null | wc -l)"
          if [ "${units}" -lt 1 ]; then
            echo "::error::config bundle carries no .container units (found ${units})" >&2
            missing=1
          fi
          test "${missing}" -eq 0 || exit 1
          echo "config bundle OK: no secrets present, all required payloads present"

      - name: Inspect pushed manifest
        id: inspect
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config:${{ steps.meta.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve config manifest digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign config bundle (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-config
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false

  keycloak-spi-jar:
    name: Compile keycloak-spi provider JAR
    needs: [ref-guard, plan]
    if: ${{ !cancelled() && needs.ref-guard.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-disabled: 'true'

      - name: Build keycloak-spi provider JAR
        run: |
          set -euo pipefail
          ./gradlew :keycloak-spi:jar --no-daemon
          mapfile -t jars < <(find keycloak-spi/build/libs -maxdepth 1 -type f \
            -name 'keycloak-spi-*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected exactly one keycloak-spi JAR, found ${#jars[@]}: ${jars[*]:-<none>}" >&2
            ls -la keycloak-spi/build/libs >&2 || true
            exit 1
          fi
          mkdir -p /tmp/keycloak-spi-jar
          cp "${jars[0]}" /tmp/keycloak-spi-jar/keycloak-spi.jar
          ls -l /tmp/keycloak-spi-jar/keycloak-spi.jar

      - name: Upload the provider JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: keycloak-spi-jar
          path: /tmp/keycloak-spi-jar/keycloak-spi.jar
          if-no-files-found: error
          retention-days: 1

  build-keycloak-spi:
    name: Build & sign keycloak-spi bundle
    needs: [ref-guard, keycloak-spi-jar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the provider JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: keycloak-spi-jar
          path: .

      - name: Check the provider JAR arrived
        run: |
          set -euo pipefail
          test -s keycloak-spi.jar || { echo "::error::keycloak-spi.jar missing or empty after download" >&2; exit 1; }
          ls -l keycloak-spi.jar

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=basetool-keycloak-spi
            org.opencontainers.image.description=Profit Basetool Keycloak provider JAR (Discord federation + first-login gate)
            org.opencontainers.image.vendor=KRT IRIDIUM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/deployment.md
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push keycloak-spi bundle (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/keycloak-spi/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Assert keycloak-spi bundle carries only the provider JAR
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cid=$(docker create "$IMAGE" /bundle)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/spi-bundle && mkdir -p /tmp/spi-bundle
          docker cp "$cid:/providers/." /tmp/spi-bundle/
          test -f /tmp/spi-bundle/keycloak-spi.jar \
            || { echo "::error::keycloak-spi bundle is missing /providers/keycloak-spi.jar" >&2; exit 1; }
          if find /tmp/spi-bundle \
               \( -name '.env' -o -name '*.p12' -o -name '*.jks' \
                  -o -name '*.pem' -o -name '*.key' -o -name 'realm-export.json' \) \
               -print | grep -q .; then
            echo "::error::keycloak-spi bundle contains a forbidden secret-shaped file" >&2
            exit 1
          fi
          if find /tmp/spi-bundle -type f ! -name 'keycloak-spi.jar' -print | grep -q .; then
            echo "::error::keycloak-spi bundle carries unexpected files:" >&2
            find /tmp/spi-bundle -type f ! -name 'keycloak-spi.jar' -print >&2
            exit 1
          fi
          echo "keycloak-spi bundle OK: only keycloak-spi.jar present"

      - name: Inspect pushed manifest
        id: inspect
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi:${{ steps.meta.outputs.version }}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve keycloak-spi manifest digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign keycloak-spi bundle (keyless / OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi@${{ steps.inspect.outputs.digest }}
        run: |
          set -eu
          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            if cosign sign --yes "$IMAGE"; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::cosign sign attempt ${i}/${attempts} failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::cosign sign failed after ${attempts} attempts for ${IMAGE}" >&2
          exit 1

      - name: Attest build provenance (GitHub attestation store)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/basetool-keycloak-spi
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: false
