name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Fetch the previous release's API contract
        continue-on-error: true
        run: |
          set -u
          mkdir -p backend/build/contract-baseline
          tag=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin 'v*' \
                | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on origin yet; the schema diff will skip"
            exit 0
          fi
          echo "baseline tag: $tag"
          if ! git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "could not fetch $tag; the schema diff will skip"
            exit 0
          fi
          git show "$tag:backend/src/main/resources/api/openapi.json" \
            > backend/build/contract-baseline/openapi.json \
            || { echo "$tag carries no openapi.json; the schema diff will skip"; \
                 rm -f backend/build/contract-baseline/openapi.json; }
          exit 0

      - name: Build, run tests and lint
        run: ./gradlew build --continue --stacktrace --configuration-cache

      - name: Fail if a committed openapi.json is stale
        run: |
          if ! git diff --exit-code --stat -- '*/src/main/resources/api/openapi.json'; then
            echo "::error::openapi.json is stale -- run ./gradlew :backend:test --tests '*.OpenApiGeneratorTest' (and :ingest:test for the ingest document) and commit the result"
            exit 1
          fi

      - name: Check the SBOMs against the resolved runtime classpath
        run: >-
          ./gradlew :backend:cyclonedxBom :frontend:cyclonedxBom
          :ingest:cyclonedxBom :keycloak-spi:cyclonedxBom
          --no-build-cache --stacktrace --configuration-cache

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/**'
          retention-days: 14
          if-no-files-found: ignore
