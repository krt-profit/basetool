name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The previous release's committed API document, for the half of REQ-API-009's schema diff
      # that compares against a released artefact rather than against a recorded intent
      # (ADR-0136, ADR-0161 8.4 -> ExternalContractTest#theContractTypesMatchThePreviousRelease).
      #
      # Deliberately NOT `fetch-depth: 0` on the checkout: one tag is wanted, not the history, and
      # a full clone of this repository costs far more than the guard is worth. A single
      # `--depth=1` tag fetch is enough to `git show` one file out of it.
      #
      # Every failure mode here is non-fatal on purpose. No release tag yet, a tag that predates
      # the document, a network hiccup -- each leaves the file absent, and the test then SKIPS with
      # a message saying so while the frozen record in the same class still runs. A guard that
      # broke every CI run over a missing baseline would be removed within a week, and the frozen
      # record is what covers a developer machine anyway.
      #
      # `set -u` and NOT `set -e`, plus an explicit `|| true` on every command that talks to the
      # network: GitHub runs this shell with `-e` by default, so an unguarded `git fetch` failure
      # aborted the STEP. That was survivable only because `continue-on-error` let the job carry on,
      # and it left the "non-fatal" claim above resting on a second mechanism rather than on this
      # script. Each command now fails into the same place: no file, and a line saying why.
      #
      # `versionsort.suffix=-` is what keeps a pre-release from outranking its own release. All 308
      # tags are plain vX.Y.Z today, so `--sort=-v:refname` happens to be right; the first `v1.8.0-rc1`
      # would sort ABOVE `v1.8.0` without it and silently become the baseline. The grep is the belt
      # to that braces -- a baseline is only ever a finished release.
      - name: Fetch the previous release's API contract
        continue-on-error: true
        run: |
          set -u
          mkdir -p backend/build/contract-baseline
          tag=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin 'v*' \
                | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on origin yet; the schema diff will skip"
            exit 0
          fi
          echo "baseline tag: $tag"
          if ! git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "could not fetch $tag; the schema diff will skip"
            exit 0
          fi
          git show "$tag:backend/src/main/resources/api/openapi.json" \
            > backend/build/contract-baseline/openapi.json \
            || { echo "$tag carries no openapi.json; the schema diff will skip"; \
                 rm -f backend/build/contract-baseline/openapi.json; }
          exit 0

      # `--continue` keeps the build going past the first failing task so the lint reports still
      # get generated when tests fail and vice versa -- the upload steps below exist for exactly
      # that. It does NOT mask a failure: Gradle still exits non-zero and the job still fails.
      - name: Build, run tests and lint
        run: ./gradlew build --continue --stacktrace

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/**'
          retention-days: 14
          if-no-files-found: ignore
