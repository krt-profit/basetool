name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  supersede:
    name: Superseded check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Decide whether a newer commit has superseded this push
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          decision="$(bash scripts/ci-superseded.sh --check \
            "$EVENT_NAME" "$PUSHED_REF" "$PUSHED_SHA")" \
            || decision="$(printf 'skip=false\nreason=the superseded check failed; building')"
          printf '%s\n' "$decision"
          skip="$(printf '%s\n' "$decision" | sed -n 's/^skip=//p')"
          reason="$(printf '%s\n' "$decision" | sed -n 's/^reason=//p')"
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            {
              printf '### CI: skipped -- superseded\n\n'
              printf '%s.\n\n' "$reason"
              printf 'Nothing is built, tested or linted by this run; the build job is skipped.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::notice title=CI skipped::%s\n' "$reason"
          fi

  build:
    name: Build, Test & Lint
    needs: supersede
    if: ${{ !cancelled() && needs.supersede.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25 and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Fetch the previous release's API contract
        run: |
          set -u
          mkdir -p backend/build/contract-baseline
          tag=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin 'v*' \
                | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "::error::no release tag found on origin; the previous-release contract comparison is required (REQ-API-017)"
            exit 1
          fi
          echo "baseline tag: $tag"
          if ! git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::error::could not fetch $tag; the previous-release contract comparison is required (REQ-API-017) -- re-run the job"
            exit 1
          fi
          if ! git show "$tag:backend/src/main/resources/api/openapi.json" \
            > backend/build/contract-baseline/openapi.json; then
            echo "::error::$tag carries no backend openapi.json; the previous-release contract comparison is required (REQ-API-017)"
            exit 1
          fi
          relay=backend/src/main/resources/api/exchange-relay.openapi.json
          if git cat-file -e "$tag:$relay" 2>/dev/null; then
            git show "$tag:$relay" > backend/build/contract-baseline/exchange-relay.openapi.json
            echo "relay document in $tag: yes"
          else
            echo "relay document in $tag: no, its openapi.json carries the relay operations"
          fi
          schemas=ingest/src/main/resources/exchange/v1/schemas
          mkdir -p ingest/build/exchange-baseline
          git ls-tree --name-only "$tag" "$schemas/" | while IFS= read -r file; do
            git show "$tag:$file" > "ingest/build/exchange-baseline/${file##*/}"
          done
          echo "exchange schemas in $tag: $(find ingest/build/exchange-baseline -name '*.json' | wc -l)"
          exit 0

      - name: Build, run tests and lint
        env:
          CONTRACT_BASELINE_REQUIRED: 'true'
        run: ./gradlew build --continue --stacktrace --configuration-cache

      - name: Fail if a committed OpenAPI document is stale
        run: |
          if ! git diff --exit-code --stat -- '*/src/main/resources/api/openapi.json' \
            backend/src/main/resources/api/exchange-relay.openapi.json; then
            echo "::error::an OpenAPI document is stale -- run ./gradlew :backend:test --tests '*.OpenApiGeneratorTest' and commit the result"
            exit 1
          fi

      - name: Check the SBOMs against the resolved runtime classpath
        run: >-
          ./gradlew :backend:cyclonedxBom :frontend:cyclonedxBom
          :ingest:cyclonedxBom :keycloak-spi:cyclonedxBom
          --no-build-cache --stacktrace --configuration-cache

      - name: Check the frontend stores its configuration cache without git on PATH
        run: scripts/check-gitless-config-cache.sh

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/**'
          retention-days: 14
          if-no-files-found: ignore
