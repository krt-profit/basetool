name: Exchange client application
description: Apply for a third-party application to use the Basetool's Exchange API.
title: "[Exchange client] "
labels:
  - triage
  - API
body:
  - type: markdown
    attributes:
      value: |
        This application is public: approval is decided in the open, case by case, and recorded
        in `docs/legal/approved-clients.md`. Read `docs/exchange/onboarding.md` and
        `docs/exchange/client-security.md` first.

        **Do not put secrets, tokens or personal data of members in this issue.**

  - type: input
    id: product
    attributes:
      label: Product
      description: The application's name as members will see it.
    validations:
      required: true

  - type: input
    id: client-id
    attributes:
      label: Requested client id
      description: Lower case letters, digits and hyphens, 2 to 63 characters.
      placeholder: example-client
    validations:
      required: true

  - type: input
    id: publisher
    attributes:
      label: Publisher and maintainer contact
      description: Who publishes the client and how the Basetool reaches its maintainer.
    validations:
      required: true

  - type: input
    id: security-contact
    attributes:
      label: Security contact
      description: Where a token-handling flaw is reported, for example a SECURITY.md or an address.
    validations:
      required: true

  - type: input
    id: privacy-statement
    attributes:
      label: Privacy statement
      description: The published privacy statement that governs Basetool data on the member's device.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source code
      description: The repository, or "closed source" — closed-source clients can be approved.
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: Linux
        - label: macOS
        - label: Browser extension for Chrome or Edge (Manifest V3)
        - label: Browser extension for Firefox (Manifest V3)
        - label: Other (explain below)

  - type: checkboxes
    id: capabilities
    attributes:
      label: Requested capabilities
      description: Only what the client's features need; exchange.connect is always included.
      options:
        - label: exchange.connect
          required: true
        - label: exchange.blueprints.read
        - label: exchange.blueprints.write
        - label: exchange.stock.read
        - label: exchange.stock.write
        - label: exchange.hangar.read
        - label: exchange.hangar.write
        - label: exchange.demand.read
        - label: exchange.demand.details
        - label: exchange.orgunits.read
        - label: exchange.orgstock.read
        - label: exchange.orgstock.details
        - label: exchange.orgstock.write
        - label: exchange.drafts.blueprints
        - label: exchange.drafts.refinery

  - type: textarea
    id: purpose
    attributes:
      label: What the client does with each capability
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Client security requirements
      description: Each point of docs/exchange/client-security.md.
      options:
        - label: Device grant against the pinned production issuer; another issuer only through a developer environment variable.
          required: true
        - label: The login shows the user code and the bare verification_uri; it never opens, shows or sends verification_uri_complete.
          required: true
        - label: DPoP (ES256) on the token endpoint and every call, with the nonce retry.
          required: true
        - label: Refresh token and DPoP key only in the platform's secret store; the key non-exportable where the platform allows.
          required: true
        - label: A Linux fallback key file is readable by the user alone (0600), in a directory only the user can open (0700).
          required: true
        - label: No token or key in logs, backups, diagnostics or problem reports; Authorization, DPoP and JWT-shaped strings redacted.
          required: true
        - label: Installations labelled by the member or the product, never with a host or computer name.
          required: true
        - label: Disconnect revokes the refresh token and deletes the stored credential.
          required: true
        - label: Only the member's own data is sent; never purchase data, account ids or other members' data.
          required: true
        - label: Org demand stored at most 7 days, outside cloud-synced folders, never in backups or diagnostics, never forwarded.
          required: true
        - label: A descriptive User-Agent with product, version and URL, or the same value in Exchange-Client-Agent where the User-Agent cannot be set.
          required: true

  - type: input
    id: extension-ids
    attributes:
      label: Extension ids
      description: Browser extensions only (required for them). The fixed extension id of each Chrome or Edge build, from a key in manifest.json or from a store; for Firefox, the add-on id.
  - type: input
    id: extension-manifest
    attributes:
      label: manifest.json of the release
      description: Browser extensions only (required for them). A link to the manifest.json of the release you apply with.
  - type: input
    id: extension-store
    attributes:
      label: Store listing (optional)
      description: Only if the extension is published in a store; unlisted listings are fine, and no listing is needed at all.

  - type: checkboxes
    id: extension-security
    attributes:
      label: Browser extension requirements
      description: Browser extensions only; each point of the browser-extension section of docs/exchange/client-security.md.
      options:
        - label: The DPoP key is a non-extractable ES256 WebCrypto key kept in the extension's IndexedDB; the refresh token is in storage.local, never storage.sync.
        - label: Tokens and the key are used only in the service worker or an extension page, never in or passed to a content script.
        - label: Host permissions, optional host permissions and content-script matches name only the RSI pages read and https://ingest.profit-base.online/*; nothing on profit-base.online, no <all_urls>, no cookies, webRequest or debugger permission, no Basetool origin in externally_connectable.
        - label: Disconnect revokes the refresh token and deletes the token and the key; an uninstall URL carries no token or id.

  - type: checkboxes
    id: sync
    attributes:
      label: Sync behaviour
      description: Each point of the sync behaviour in docs/exchange/client-security.md.
      options:
        - label: Every resource is an explicit opt-in of the member, off by default.
          required: true
        - label: Pull before push; the first sync is add-only; a remove only from a diff against the last synced state.
          required: true
        - label: What the member removed elsewhere is never re-added; override only after the member agreed.
          required: true
        - label: Ships are linked to existing ships before any new one is created.
          required: true
        - label: After CURSOR_EXPIRED, a fresh snapshot is reconciled against the last synced state.
          required: true
        - label: Stock is sent with the expectedQuantity last seen; a VERSION_CONFLICT is resolved by pulling.
          required: true
        - label: The account check runs before the first sync of a newly detected game account, with a warning on mismatch.
          required: true
        - label: Baseline, ship links and feed cursors are kept per installation, never shared with another installation or through a shared data folder.
          required: true
        - label: Every Idempotency-Key is random, such as a UUID, and used for one logical write only.
          required: true
        - label: detachedFromMissions, offersReduced and offersRemoved are shown to the member when a change result reports them.
          required: true
        - label: Every ship upsert sends the ship's current name and location, because an upsert clears an omitted one.
          required: true
        - label: Retries back off from 5 seconds, doubling up to at most 5 minutes, with random jitter, and never wait less than Retry-After.
          required: true
        - label: Syncs run on start and after a local change, and a timed sync at most every 5 minutes.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Terms of the integration
      options:
        - label: Basetool data stays on the member's device — no telemetry, no transfer to third parties.
          required: true
        - label: A token-handling flaw is fixed in a published release within 7 days, or the client may be suspended.
          required: true
        - label: I agree that the Basetool may suspend or revoke the client at any time.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
