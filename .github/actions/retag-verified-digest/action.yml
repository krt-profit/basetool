name: Re-tag a signature-verified digest

description: >
  Resolves <image>:<source-tag> to its manifest digest, cosign-verifies that digest against this
  repository's release-images.yml keyless identity, and moves <image>:<target-tag> onto it. The
  promotion step shared by promote.yml (:stable) and promote-testing.yml (:testing).

inputs:
  module:
    description: The artifact to promote, i.e. the suffix of `basetool-<module>`.
    required: true
  source-tag:
    description: The tag whose digest is promoted (e.g. "1.4.3", "sha-abc1234", "stable").
    required: true
  target-tag:
    description: The rolling tag to move onto that digest ("stable" or "testing").
    required: true
  registry:
    description: The registry host.
    required: false
    default: ghcr.io
  owner:
    description: The package namespace.
    required: false
    default: ${{ github.repository_owner }}

outputs:
  digest:
    description: The manifest digest that was verified and re-tagged.
    value: ${{ steps.resolve.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

    - name: Resolve source digest
      id: resolve
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.owner }}/basetool-${{ inputs.module }}
        VERSION: ${{ inputs.source-tag }}
      run: |
        set -euo pipefail
        DIGEST=""
        for attempt in 1 2 3; do
          if DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}'); then
            if [ -n "${DIGEST}" ]; then break; fi
          fi
          echo "::warning::digest lookup attempt ${attempt} failed for ${IMAGE}:${VERSION}; retrying" >&2
          sleep $((attempt * 10))
        done
        if [ -z "${DIGEST}" ]; then
          echo "::error::could not resolve ${IMAGE}:${VERSION} after 3 attempts" >&2
          exit 1
        fi
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Source: ${IMAGE}:${VERSION} → ${DIGEST}"

    - name: Verify source image signature (cosign keyless)
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.registry }}/${{ inputs.owner }}/basetool-${{ inputs.module }}@${{ steps.resolve.outputs.digest }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        attempts=6
        delay=5
        for i in $(seq 1 "$attempts"); do
          if err="$(cosign verify "${IMAGE_REF}" \
               --certificate-identity-regexp "^https://github\\.com/${REPO}/\\.github/workflows/release-images\\.yml@refs/(heads/main|tags/v[0-9]+\\.[0-9]+\\.[0-9]+)$" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com \
               2>&1 >/dev/null)"; then
            echo "Signature OK"
            exit 0
          fi
          case "$err" in
            *"no signatures found"*|*"no matching signatures"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*)
              if [ "$i" -lt "$attempts" ]; then
                echo "::warning::no signature on ${IMAGE_REF} yet (attempt ${i}/${attempts}) — a release run may still be uploading it; retrying in ${delay}s" >&2
                sleep "$delay"
                delay=$((delay * 2))
                continue
              fi
              ;;
            *)
              echo "::error::signature on ${IMAGE_REF} did not verify against this repository's release workflow identity" >&2
              echo "$err" >&2
              exit 1
              ;;
          esac
        done
        echo "::error::no signature appeared on ${IMAGE_REF} after ${attempts} attempts" >&2
        echo "$err" >&2
        exit 1

    - name: Re-tag the verified digest
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.owner }}/basetool-${{ inputs.module }}
        SOURCE_DIGEST: ${{ steps.resolve.outputs.digest }}
        TARGET: ${{ inputs.target-tag }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          --tag "${IMAGE}:${TARGET}" \
          "${IMAGE}@${SOURCE_DIGEST}"
        echo "Promoted ${SOURCE_DIGEST} → ${IMAGE}:${TARGET}"

    - name: Summarise
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        VERSION: ${{ inputs.source-tag }}
        DIGEST: ${{ steps.resolve.outputs.digest }}
        TARGET: ${{ inputs.target-tag }}
      run: |
        {
          echo "### Promoted basetool-${MODULE} to ${TARGET}"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Source tag | \`${VERSION}\` |"
          echo "| Digest | \`${DIGEST}\` |"
          echo "| New tag | \`${TARGET}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
