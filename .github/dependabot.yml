version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /docker/sandbox/keycloak
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "keycloak/keycloak"
      - dependency-name: "quay.io/keycloak/keycloak"
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /.github/actions/setup-buildx
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The pin follows the host's EPEL package (REQ-OPS-032).
      - dependency-name: "prometheus/node-exporter"
      # A PostgreSQL major moves by dump and restore (REQ-OPS-063); digest refreshes stay proposed.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(compose)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: "chore(npm)"

  - package-ecosystem: npm
    directory: /.github/tools/markdownlint
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: "chore(npm)"

  - package-ecosystem: uv
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ci-python-tools:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(pip)"
