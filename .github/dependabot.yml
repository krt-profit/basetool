# Dependabot covers the ecosystems that refreshVersions does NOT manage:
# GitHub Actions workflow pins and the Docker base images referenced by
# docker-compose. Java / Gradle dependencies are intentionally left to
# `./gradlew refreshVersions` (see .github/workflows/refresh-versions.yml)
# so the two systems do not generate duplicate PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"

  # The three app modules share ONE base image (eclipse-temurin:25-jre-alpine,
  # digest-pinned), so this cadence is the dominant term in how long an OS-level
  # CVE survives in production. Measured 2026-09-03: the pin has moved exactly
  # once since the images went to Alpine, and the whole path is
  #   Dependabot notices -> PR -> merge -> release build -> promotion.
  # Only the build is fast (~4 min after ADR-0137), so weekly detection puts up to
  # seven days in front of everything else. That measurement is why a "rebase the
  # runtime layer without rebuilding" pipeline was considered and dropped: it would
  # have optimised the four-minute term while the seven-day term dominated.
  #
  # Weekly is nevertheless retained, by the repository owner's decision
  # (2026-09-03), with the seven-day detection window known and accepted. Written
  # down so the number is not rediscovered as if it were a defect: the cadence is a
  # choice, and the lever anyone reaching for a faster patch should pull first is
  # this interval, not a rebase pipeline.
  #
  # Not consolidated into one `directories:` entry with a `groups:` block, which
  # would turn a base bump into a single PR instead of three: a wrong key there
  # makes Dependabot silently stop updating these paths, and silently LENGTHENING
  # this exact loop is the failure this entry exists to prevent. Worth doing
  # deliberately, verified against a real run - not blind.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  # The ingest gateway is internet-facing like backend/frontend, so its base
  # image must get the same automated CVE bumps (security audit gap-fill).
  - package-ecosystem: docker
    directory: /ingest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  # Infra image pins (redis/postgres/keycloak/npm) in docker-compose.yml. Once a
  # bump PR is merged and a release is cut + promoted, the new compose ships to
  # prod automatically as part of the `basetool-config` artifact (no manual
  # `cp docker-compose.yml` / `docker compose up -d`); deploy.sh recreates the
  # affected container, except a postgres/Keycloak image change, which stays
  # operator-gated. See docs/deployment.md and docs/adr/0049-*. The config
  # bundle's Dockerfile is `FROM scratch` (no base image), so it needs no Docker
  # ecosystem entry of its own.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(compose)"

  # The frontend's asset-lint toolchain (Stylelint / ESLint / HTMLHint / Prettier / TypeScript).
  # This was the one ecosystem in the repo NOTHING watched: refreshVersions
  # only knows Maven coordinates and the entries above only cover Actions and images, so
  # `frontend/package.json` drifted silently until someone checked it by hand. These linters gate
  # CI (REQ-FE-018), so an unnoticed major here breaks the build on a version nobody chose.
  #
  # `versioning-strategy: increase` bumps the declared range in package.json rather than only the
  # lockfile — the ranges are carets, so a lockfile-only bump would leave the manifest reading as
  # an older floor forever.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: "chore(npm)"
