x-backend-build: &backend-build
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      MODULE: backend
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-backend:${IRI_BASETOOL_VERSION:-local}

x-frontend-build: &frontend-build
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      MODULE: frontend
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-frontend:${IRI_BASETOOL_VERSION:-local}

x-backend-watch: &backend-watch
  develop:
    watch:
      - action: rebuild
        path: ./backend/src
      - action: rebuild
        path: ./backend/build.gradle.kts
      - action: rebuild
        path: ./build.gradle.kts
      - action: rebuild
        path: ./gradle/libs.versions.toml

x-frontend-watch: &frontend-watch
  develop:
    watch:
      - action: rebuild
        path: ./frontend/src
      - action: rebuild
        path: ./frontend/build.gradle.kts
      - action: rebuild
        path: ./build.gradle.kts
      - action: rebuild
        path: ./gradle/libs.versions.toml

x-ingest-build: &ingest-build
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      MODULE: ingest
  image: ghcr.io/${IRI_IMAGE_NAMESPACE:-krt-profit}/basetool-ingest:${IRI_BASETOOL_VERSION:-local}

x-ingest-watch: &ingest-watch
  develop:
    watch:
      - action: rebuild
        path: ./ingest/src
      - action: rebuild
        path: ./ingest/build.gradle.kts
      - action: rebuild
        path: ./build.gradle.kts
      - action: rebuild
        path: ./gradle/libs.versions.toml

services:
  backend:
    <<: *backend-build

  backend-dev:
    <<: [*backend-build, *backend-watch]

  frontend:
    <<: *frontend-build

  frontend-dev:
    <<: [*frontend-build, *frontend-watch]

  ingest:
    <<: *ingest-build

  ingest-dev:
    <<: [*ingest-build, *ingest-watch]
