---
- name: Label the data tree for container access
  community.general.sefcontext:
    target: "{{ basetool_host_root_dir }}(/.*)?"
    setype: container_file_t
    state: present
  notify: Apply the SELinux labels

- name: Let systemd execute the operational scripts
  community.general.sefcontext:
    target: "{{ basetool_host_root_dir }}/code/scripts(/.*)?"
    setype: bin_t
    state: present
  notify: Apply the SELinux labels

- name: Apply the labels
  ansible.builtin.meta: flush_handlers

- name: Note where the first failure will be
  ansible.builtin.debug:
    msg: >-
      The certificate handover is where SELinux will bite first: acme writes fullchain.pem and
      privkey.pem and hands them to container uid 101 so the edge can open them (REQ-OPS-026), and
      that path now crosses a user-namespace uid translation AND a label transition at once. Both
      failures present identically -- the edge exits three seconds after start, the health gate
      fails, the deploy rolls back, and nothing says "label". Diagnose with
      `ausearch -m AVC -ts recent`, never by guessing, and never by setting SELinux permissive.
  changed_when: false
  check_mode: false
