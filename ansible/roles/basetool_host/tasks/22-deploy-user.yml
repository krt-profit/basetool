---
- name: Read the service user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ basetool_host_service_user }}"
  check_mode: false

- name: Refuse if the service user does not exist yet
  ansible.builtin.assert:
    that: basetool_host_service_user in ansible_facts.getent_passwd
    fail_msg: >-
      {{ basetool_host_service_user }} does not exist on this host, so there is nothing for the
      deploy account to reach. Run the role without a tag limit -- 20-user.yml creates it.

- name: Name the uid the sudo bridge needs
  ansible.builtin.set_fact:
    basetool_host_service_uid: "{{ ansible_facts.getent_passwd[basetool_host_service_user][1] }}"

- name: Create the deploy account
  ansible.builtin.user:
    name: "{{ basetool_host_deploy_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ basetool_host_state_dir }}"
    create_home: false
    comment: "Runs deploy.sh, backup.sh and restore-drill.sh (ADR-0188)"

- name: Let deploy drive the service user's containers, and nothing else
  ansible.builtin.copy:
    dest: /etc/sudoers.d/basetool-deploy
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      Defaults:{{ basetool_host_deploy_user }} !requiretty
      {{ basetool_host_deploy_user }} ALL=({{ basetool_host_service_user }}) NOPASSWD: /usr/bin/podman *
      {{ basetool_host_deploy_user }} ALL=({{ basetool_host_service_user }}) NOPASSWD: SETENV: /usr/bin/systemctl --user *
      {{ basetool_host_deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart alloy.service

- name: Prove deploy can drive the containers
  ansible.builtin.command: >-
    sudo -n -u {{ basetool_host_service_user }}
    podman info --format {% raw %}'{{.Host.Security.Rootless}}'{% endraw %}
  args:
    chdir: /tmp
  become: true
  become_user: "{{ basetool_host_deploy_user }}"
  register: basetool_host_deploy_bridge
  changed_when: false
  failed_when: basetool_host_deploy_bridge.rc != 0
  when: not ansible_check_mode

- name: Prove deploy can drive the service user's systemd instance
  ansible.builtin.command: >-
    sudo -n -u {{ basetool_host_service_user }}
    XDG_RUNTIME_DIR=/run/user/{{ basetool_host_service_uid }}
    systemctl --user is-system-running
  args:
    chdir: /tmp
  become: true
  become_user: "{{ basetool_host_deploy_user }}"
  register: basetool_host_deploy_systemd
  changed_when: false
  failed_when: basetool_host_deploy_systemd.stdout is not search('running|degraded|starting')
  when: not ansible_check_mode

- name: Report what the bridge answered
  ansible.builtin.debug:
    msg: >-
      {{ basetool_host_deploy_user }} can drive {{ basetool_host_service_user }}'s podman
      (rootless={{ basetool_host_deploy_bridge.stdout | default('?') }}) and reach its systemd
      instance ({{ basetool_host_deploy_systemd.stdout | default('?') }}). That is the path
      scripts/lib/container-runtime.sh detects, and the only privilege this account has.
  when: not ansible_check_mode
