---

- name: Assert the host is an EL 10 derivative
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] | int >= 10
    fail_msg: >-
        This role targets Rocky Linux 10 (ADR-0163, amended twice on 2026-09-16). Found
        {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
        CentOS Stream 10 and AlmaLinux 10 are EL 10 and pass this check too; Stream was the target
        until ADR-0187 removed the need for podman 6, at which point ten years of support and
        changes arriving AFTER RHEL beat five years and arriving before.
    success_msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Read the cgroup filesystem type
  ansible.builtin.command: stat -fc %T /sys/fs/cgroup
  register: basetool_host_cgroup_fs
  changed_when: false
  check_mode: false

- name: Assert cgroup v2
  ansible.builtin.assert:
    that: basetool_host_cgroup_fs.stdout.strip() == 'cgroup2fs'
    fail_msg: >-
      Rootless Podman needs cgroup v2 for resource limits to mean anything -- Memory= and
      PidsLimit= are silently decoration without it, and REQ-OPS-020's measured limits would not
      be applied. Found '{{ basetool_host_cgroup_fs.stdout.strip() }}'.

- name: Assert SELinux is present and loaded
  ansible.builtin.assert:
    that: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
    fail_msg: >-
      SELinux reports status '{{ ansible_facts['selinux']['status'] | default('absent') }}'.
      ADR-0163 counts SELinux as the second confinement layer of its security case, and a
      disabled policy cannot be turned on without a relabel and a reboot -- which this role will
      not do behind your back. Re-image the host with SELinux enabled.
    success_msg: "SELinux policy loaded ({{ ansible_facts['selinux']['type'] | default('unknown') }})"

- name: Put SELinux in enforcing mode, persistently
  ansible.posix.selinux:
    policy: "{{ ansible_facts['selinux']['type'] | default('targeted') }}"
    state: enforcing
  register: basetool_host_selinux_set

- name: Schedule a filesystem relabel when the mode had to be changed  # noqa: no-handler
  ansible.builtin.file:
    path: /.autorelabel
    state: touch
    mode: "0644"
  when: basetool_host_selinux_set.changed | default(false)

- name: Say plainly that a reboot is owed  # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      SELinux mode was changed to enforcing and /.autorelabel was created. The running kernel is
      NOT relabelled yet -- reboot this host before it serves anything. It reboots twice: once to
      relabel, once to come up on the new labels.
  when: basetool_host_selinux_set.changed | default(false)
