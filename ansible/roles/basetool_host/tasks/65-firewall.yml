---
- name: Read the service state without shelling out to systemctl
  ansible.builtin.service_facts:

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true
  when: basetool_host_manage_firewall | bool

- name: Read the zone it puts new interfaces in
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: basetool_host_fw_zone
  changed_when: false
  failed_when: false
  check_mode: false
  when: basetool_host_manage_firewall | bool

- name: Close the services this host does not use
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ basetool_host_fw_closed_services }}"
  when: basetool_host_manage_firewall | bool

- name: Ask which zones forward, in the permanent or the running configuration
  ansible.builtin.shell: >-
    firewall-cmd --permanent --zone={{ item | quote }} --query-forward
    || firewall-cmd --zone={{ item | quote }} --query-forward
  loop: "{{ ([basetool_host_fw_zone.stdout | default('public') | trim] + basetool_host_fw_no_forward_zones) | unique }}"
  register: basetool_host_fw_forward
  changed_when: false
  failed_when: basetool_host_fw_forward.rc not in [0, 1]
  check_mode: false
  when: basetool_host_manage_firewall | bool

- name: Turn forwarding off in them, since this host routes nothing
  ansible.builtin.shell: >-
    firewall-cmd --permanent --zone={{ item.item | quote }} --remove-forward
    && firewall-cmd --zone={{ item.item | quote }} --remove-forward
  loop: "{{ basetool_host_fw_forward.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when:
    - basetool_host_manage_firewall | bool
    - item.rc | default(1) == 0

- name: Start from the host-wide network sysctls
  ansible.builtin.set_fact:
    basetool_host_network_wanted: "{{ basetool_host_network_sysctls }}"

- name: Add the per-interface ones, because redirects stay on while either the interface or all allows them
  ansible.builtin.set_fact:
    basetool_host_network_wanted: >-
      {{ basetool_host_network_wanted
         | combine(dict(basetool_host_network_interface_sysctls | map('replace', '{iface}', item)
                        | zip_longest([], fillvalue=0))) }}
  loop: "{{ ansible_facts.interfaces | select('match', basetool_host_network_interface_pattern) | sort }}"

- name: Refuse redirects and spoofed sources in the kernel
  ansible.builtin.template:
    src: basetool-network.sysctl.conf.j2
    dest: "{{ basetool_host_network_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  register: basetool_host_network_sysctl

- name: Apply them now, not only at the next boot
  ansible.builtin.command: sysctl -p {{ basetool_host_network_sysctl_file }}
  changed_when: true
  when:
    - not ansible_check_mode
    - basetool_host_network_sysctl is changed

- name: Read what the kernel actually runs with
  ansible.builtin.command:
    argv: "{{ ['sysctl', '-n'] + (basetool_host_network_wanted.keys() | list) }}"
  register: basetool_host_network_effective
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and basetool_host_network_sysctl is changed)

- name: Refuse a kernel that does not run with them
  ansible.builtin.assert:
    that: >-
      (basetool_host_network_effective.stdout_lines | map('trim') | list)
      == (basetool_host_network_wanted.values() | map('string') | list)
    fail_msg: >-
      The kernel runs with
      {{ dict(basetool_host_network_wanted.keys() | zip(basetool_host_network_effective.stdout_lines)) }},
      expected {{ basetool_host_network_wanted }}. A file later in /etc/sysctl.d sets one of them back:
      sysctl.d reads in lexical order and the last value wins.
  when: basetool_host_network_effective is not skipped

- name: Put loopback in the trusted zone
  ansible.posix.firewalld:
    interface: lo
    zone: trusted
    state: enabled
    permanent: true
    immediate: true
  when: basetool_host_manage_firewall | bool

- name: Install fail2ban
  ansible.builtin.dnf:
    name:
      - fail2ban
      - fail2ban-firewalld
      - fail2ban-systemd
    state: present
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool

- name: Refuse an ignore list that would lock the host out or ban nobody
  ansible.builtin.assert:
    that:
      - basetool_host_fail2ban_ignoreip | length > 0
      - "'0.0.0.0/0' not in basetool_host_fail2ban_ignoreip"
      - "'::/0' not in basetool_host_fail2ban_ignoreip"
    fail_msg: >-
      basetool_host_fail2ban_ignoreip is {{ basetool_host_fail2ban_ignoreip }}. It must name at
      least loopback, and it must not contain a default route -- an all-inclusive ignore list is a
      jail that runs, looks healthy and never bans anything.
  when: basetool_host_fail2ban_enabled | bool

- name: Configure the jails
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  register: basetool_host_fail2ban_jail
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool

- name: Keep each ban in the database long enough for the doubling and for recidive to see it
  ansible.builtin.copy:
    dest: /etc/fail2ban/fail2ban.d/basetool.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFINITION]
      dbpurgeage = {{ basetool_host_fail2ban_dbpurgeage }}
  register: basetool_host_fail2ban_daemon
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool

- name: Ask fail2ban whether that configuration parses
  ansible.builtin.command: fail2ban-client -t
  register: basetool_host_fail2ban_test
  changed_when: false
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Start it, and restart it now when its configuration changed, so the checks below see the new jails
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: >-
      {{ 'restarted' if (basetool_host_fail2ban_jail is changed or basetool_host_fail2ban_daemon is changed)
         else 'started' }}
    daemon_reload: true
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Let the shipper read the ban log
  ansible.builtin.file:
    path: /var/log/fail2ban.log
    group: adm
    mode: "0640"
  register: basetool_host_fail2ban_log_perms
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Keep it readable across rotation
  ansible.builtin.lineinfile:
    path: /etc/logrotate.d/fail2ban
    regexp: '^(\s*)create\s'
    line: '    create 0640 root adm'
    backrefs: false
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Ask whether alloy can actually open it
  ansible.builtin.command: runuser -u alloy -- test -r /var/log/fail2ban.log
  register: basetool_host_fail2ban_readable
  changed_when: false
  failed_when: false
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Refuse a ban log the shipper cannot read
  ansible.builtin.assert:
    that:
      - basetool_host_fail2ban_readable.rc == 0
    fail_msg: >-
      alloy cannot read /var/log/fail2ban.log. The host-fail2ban stream would stay empty and its
      LogStreamSilent would fire, while fail2ban itself reports a healthy jail.
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Give alloy the ban log it did not have at its last start
  ansible.builtin.debug:
    msg: "The ban log is new to this host; alloy is restarted so its bind picks it up."
  changed_when: true
  notify: Restart alloy
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode
    - basetool_host_fail2ban_log_perms is changed

- name: Ask fail2ban whether each jail is actually up
  ansible.builtin.command: fail2ban-client status {{ item }}
  loop: "{{ ['sshd'] + (['recidive'] if basetool_host_fail2ban_recidive_enabled | bool else []) }}"
  register: basetool_host_fail2ban_status
  changed_when: false
  failed_when: false
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Refuse a fail2ban that is running without a jail
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      `fail2ban-client status {{ item.item }}` exited {{ item.rc | default('?') }}:
      {{ (item.stderr | default('')) | truncate(200) }}
      The service can be active with a jail not loaded, and then that jail detects nothing and bans
      nothing while every other signal says it is running.
  loop: "{{ basetool_host_fail2ban_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool
    - not ansible_check_mode

- name: Say what is jailed and what is exempt
  ansible.builtin.debug:
    msg: >-
      fail2ban: the sshd jail, banning through firewalld.
      {{ basetool_host_fail2ban_maxretry }} failures in
      {{ basetool_host_fail2ban_findtime }} -> {{ basetool_host_fail2ban_bantime }},
      doubling per repeat up to {{ basetool_host_fail2ban_maxtime }}, remembered for
      {{ basetool_host_fail2ban_dbpurgeage }}.
      {% if basetool_host_fail2ban_recidive_enabled | bool %}
      recidive: {{ basetool_host_fail2ban_recidive_maxretry }} bans in
      {{ basetool_host_fail2ban_recidive_findtime }} -> {{ basetool_host_fail2ban_recidive_bantime }}
      on every port.
      {% endif %}
      Never banned: {{ basetool_host_fail2ban_ignoreip | join(', ') }}.
      Ban and unban lines go to /var/log/fail2ban.log, which alloy ships as app="host-fail2ban"
      WITH the client IP (the deliberate 31-day retention, REQ-OBS-007/-010).
  when:
    - basetool_host_fail2ban_enabled | bool
    - basetool_host_manage_firewall | bool

- name: State the policy, so the next reader does not have to infer it
  ansible.builtin.debug:
    msg: >-
      Firewall: {{ basetool_host_fw_zone.stdout | default('?') | trim }} zone, default-deny.
      Open: SSH, and the front end's ports (opened in 70-frontend.yml).
      Deliberately closed: everything else the stack publishes, because it publishes on LOOPBACK --
      the edge container binds 127.0.0.1 and [::1] only, which is what makes its PROXY header
      unforgeable (ADR-0187). If a container ever publishes to a routable address, it needs a rule
      here, and it needs a reason.
  when: basetool_host_manage_firewall | bool
