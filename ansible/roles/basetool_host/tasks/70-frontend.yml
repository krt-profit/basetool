---
# The L4 front end (ADR-0187).
#
# Rootless Podman's port forwarder replaces every client address with its own, which does not merely
# degrade the per-client rate limiter but INVERTS the Keycloak admin allow-list. haproxy binds :80
# and :443 on the host, forwards to the edge in `mode tcp` and prepends a PROXY v2 header; the edge
# restores the address from it. TLS still terminates at the edge -- this is byte forwarding, so no
# key exists in a second place and the certificate handover is untouched.
#
# Everything here was measured on the target platform before it was written. The two details that
# look like style and are not:
#
#   * SEPARATE v4 and v6 binds. A single `bind :::80 v4v6` makes IPv4 clients arrive as
#     `::ffff:10.9.0.15`, and every CIDR-based `allow` rule behind it silently stops matching. The
#     connection works; only the address has the wrong shape.
#   * A NARROW SELinux port label. Confined haproxy may not connect to an unlabelled port. Labelling
#     the one loopback port is enough; the `haproxy_connect_any` boolean would permit connecting
#     anywhere and is deliberately left off.

- name: Install haproxy
  ansible.builtin.package:
    name: haproxy
    state: present

# The first bind attempt on the testing host failed with "Permission denied" on a port ABOVE 1024,
# which reads exactly like a privilege problem and is not: it is SELinux refusing a confined service
# an unlabelled port. Recording it here so the next person does not go looking at
# ip_unprivileged_port_start.
- name: Allow haproxy to reach the edge's loopback port
  community.general.seport:
    ports: "{{ basetool_host_edge_loopback_ports | join(',') }}"
    proto: tcp
    setype: http_port_t
    state: present
  when: basetool_host_manage_selinux | bool

- name: Refuse a front-end address that trusts too much
  ansible.builtin.assert:
    that:
      - basetool_host_edge_trusted_proxy is match('^[0-9a-fA-F:.]+$')
      - "'/' not in basetool_host_edge_trusted_proxy"
    fail_msg: >-
      basetool_host_edge_trusted_proxy must be ONE address, never a prefix and never a wildcard.
      PROXY protocol asserts a source address rather than proving one, so a range wide enough to
      contain an attacker turns this front end into a source-address forgery tool aimed at the rate
      limiter and the admin allow-list it exists to preserve (ADR-0187). The edge's own
      render-and-run.sh refuses the same values; this is the earlier of the two gates.

# One gather, read twice: the reload handler needs to know whether haproxy is already running, and
# the firewall block below needs to know whether firewalld is. This used to shell out to
# `systemctl is-active` on the grounds that it was cheaper than gathering the whole inventory --
# which stopped being true the moment the firewall block needed the inventory anyway.
- name: Read the service states without shelling out to systemctl
  ansible.builtin.service_facts:

- name: Remember whether the front end is already up, for the reload handler
  ansible.builtin.set_fact:
    basetool_host_haproxy_active: >-
      {{ ansible_facts.services['haproxy.service'] is defined
         and ansible_facts.services['haproxy.service'].state == 'running' }}


- name: Write the front-end configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reload haproxy

# Enabled, but NOT started here. This role provisions a host that is not serving traffic yet, and a
# front end with no backend behind it would answer every request with a connection error for as long
# as the gap lasts. `deploy.sh` brings the stack up; the front end comes with the boot after it.
- name: Enable haproxy for the next boot
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true

- name: State what is deliberately not done here
  ansible.builtin.debug:
    msg: >-
      haproxy is installed, configured and enabled but NOT started: there is no edge behind it yet.
      It comes up with the first boot after deploy.sh, or start it by hand once the stack is
      healthy. The edge must carry EDGE_TRUSTED_PROXY={{ basetool_host_edge_trusted_proxy }} in its
      environment, or its listeners stay plain and the PROXY header this front end sends will be
      rejected.

# --- the firewall the hardening profile brings with it ---------------------------------------------
#
# MEASURED 2026-09-16, and it is the reason this section exists: this host had no firewalld at all in
# the morning. The CIS remediation INSTALLS it, enables it, and leaves the default `public` zone
# allowing ssh, cockpit and dhcpv6-client -- and nothing else. After the reboot, :80 and :443 were
# listening locally and timed out from another machine.
#
# That is the exact failure the hardening section warns about in words: an oscap report showing a
# perfect score on a host whose edge is unreachable. Every health check inside the host stays green,
# because every health check inside the host is inside the host.
#
# So the ports are opened explicitly, here, next to the service that binds them -- not left to
# whoever notices the outage.

- name: Open the ports the front end binds
  # `ansible_facts.services` comes from service_facts, gathered in 65-firewall.yml. Reading it is
  # the module-shaped way to ask what `systemctl is-active` used to be shelled out for.
  when: >-
    ansible_facts.services['firewalld.service'] is defined
    and ansible_facts.services['firewalld.service'].state == 'running'
  # One module call per port, idempotent, reporting `changed` from what it did. The three tasks
  # this replaces -- query, add, reload -- each needed a hand-written `changed_when`, and the
  # reload ran behind a `when: ... is changed` that ansible-lint correctly reads as a handler in
  # the wrong place.
  ansible.posix.firewalld:
    port: "{{ item.public }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ basetool_host_frontend_ports }}"
  loop_control:
    label: "{{ item.public }}/tcp"

- name: Say what the front end can now be reached on
  ansible.builtin.debug:
    msg: >-
      The front end's ports are open in firewalld:
      {{ basetool_host_frontend_ports | map(attribute='public') | join(', ') }}/tcp. Nothing else the
      stack publishes is, and nothing else should be -- the container ports are on loopback by
      design (ADR-0187).
