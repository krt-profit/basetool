---

- name: Install haproxy
  ansible.builtin.package:
    name: haproxy
    state: present

- name: Allow haproxy to reach the edge's loopback port
  community.general.seport:
    ports: "{{ basetool_host_edge_loopback_ports | join(',') }}"
    proto: tcp
    setype: http_port_t
    state: present
  when: basetool_host_manage_selinux | bool

- name: Refuse the retired singular front-end address variable
  ansible.builtin.assert:
    that:
      - basetool_host_edge_trusted_proxy is not defined
    fail_msg: >-
      basetool_host_edge_trusted_proxy was replaced by basetool_host_edge_trusted_proxies, a LIST
      of every address the edge can present the PROXY header from. Under rootless Podman podman
      chooses which of the container's networks the header comes from, so one address is not a
      complete answer. Rename it in the inventory and list all of them.

- name: Refuse a front-end address that trusts too much
  ansible.builtin.assert:
    that:
      - basetool_host_edge_trusted_proxies | length > 0
      - basetool_host_edge_trusted_proxies | reject('match', '^[0-9a-fA-F:.]+$') | list | length == 0
      - basetool_host_edge_trusted_proxies | select('search', '/') | list | length == 0
      - "'0.0.0.0' not in basetool_host_edge_trusted_proxies"
      - "'::' not in basetool_host_edge_trusted_proxies"
    fail_msg: >-
      Every entry of basetool_host_edge_trusted_proxies must be a literal address, never a prefix
      and never a wildcard. PROXY protocol asserts a source address rather than proving one, so a
      range wide enough to contain an attacker turns this front end into a source-address forgery
      tool aimed at the rate limiter and the admin allow-list it exists to preserve (ADR-0187). A
      list of literals is the opposite of a range, not a step toward one -- each entry is checked on
      its own here, and the edge's own render-and-run.sh checks them again at start.

- name: Read the service states without shelling out to systemctl
  ansible.builtin.service_facts:

- name: Remember whether the front end is already up, for the reload handler
  ansible.builtin.set_fact:
    basetool_host_haproxy_active: >-
      {{ ansible_facts.services['haproxy.service'] is defined
         and ansible_facts.services['haproxy.service'].state == 'running' }}

- name: Write the front-end configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reload haproxy

- name: Enable haproxy for the next boot
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true

- name: State what is deliberately not done here
  ansible.builtin.debug:
    msg: >-
      haproxy is installed, configured and enabled but NOT started: there is no edge behind it yet.
      It comes up with the first boot after deploy.sh, or start it by hand once the stack is
      healthy. The edge must carry
      EDGE_TRUSTED_PROXY={{ basetool_host_edge_trusted_proxies | join(' ') }} in its environment,
      or its listeners stay plain and the PROXY header this front end sends will be rejected.

- name: Open the ports the front end binds
  when: >-
    ansible_facts.services['firewalld.service'] is defined
    and ansible_facts.services['firewalld.service'].state == 'running'
  ansible.posix.firewalld:
    port: "{{ item.public }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ basetool_host_frontend_ports }}"
  loop_control:
    label: "{{ item.public }}/tcp"

- name: Say what the front end can now be reached on
  ansible.builtin.debug:
    msg: >-
      The front end's ports are open in firewalld:
      {{ basetool_host_frontend_ports | map(attribute='public') | join(', ') }}/tcp. Nothing else the
      stack publishes is, and nothing else should be -- the container ports are on loopback by
      design (ADR-0187).
