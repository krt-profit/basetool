---

- name: Read the service user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ basetool_host_service_user }}"
  check_mode: false

- name: Refuse if the service user does not exist yet
  ansible.builtin.assert:
    that: basetool_host_service_user in ansible_facts.getent_passwd
    fail_msg: >-
      {{ basetool_host_service_user }} does not exist on this host, so there is no rootless podman
      for the exporter to read. Run the role without a tag limit -- 20-user.yml creates it.

- name: Name the uid the user-scoped units need
  ansible.builtin.set_fact:
    basetool_host_service_uid: "{{ ansible_facts.getent_passwd[basetool_host_service_user][1] }}"

- name: Enable EPEL
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Add Grafana's package repository
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana OSS packages
    baseurl: https://rpm.grafana.com
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://rpm.grafana.com/gpg.key
    sslverify: true
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt
    enabled: true
    exclude: grafana,grafana-enterprise

- name: Install the host half of the monitoring plane
  ansible.builtin.dnf:
    name: "{{ basetool_host_observability_packages }}"
    state: present
  notify: Reload systemd for the observability units

- name: Read the boot loader's kernel arguments
  ansible.builtin.command: grubby --info=DEFAULT
  register: basetool_host_grubby_default
  changed_when: false
  check_mode: false

- name: Switch pressure stall information on at the next boot
  ansible.builtin.command: grubby --update-kernel=ALL --args=psi=1
  when:
    - basetool_host_enable_psi | bool
    - "'psi=1' not in basetool_host_grubby_default.stdout"
  changed_when: true

- name: Say that the parameter is waiting for a boot
  ansible.builtin.debug:
    msg: >-
      psi=1 is configured for the next boot, but this kernel was started without it, so
      /proc/pressure does not exist yet. node_pressure_* stays absent and
      HostMemoryPressureStalled, HostCpuPressure and HostIoPressure cannot fire until this host is
      rebooted. Reboot it when a window allows, then confirm with `ls /proc/pressure`.
  when:
    - basetool_host_enable_psi | bool
    - ansible_facts.cmdline.psi is not defined

- name: Configure node_exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      ARGS="{{ basetool_host_node_exporter_flags | join(' ') }}"
  notify: Restart node_exporter

- name: Make room for the node_exporter drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give node_exporter the memory ceiling it had as a container
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/20-resources.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      MemoryMax={{ basetool_host_node_exporter_memory_max }}
      Environment=GOMEMLIMIT={{ basetool_host_node_exporter_gomemlimit }}
  notify:
    - Reload systemd for the observability units
    - Restart node_exporter

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Give the host a persistent journal
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Reload systemd-journald

- name: Make room for journald's drop-in
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Say so in journald's own configuration rather than relying on the directory alone
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-basetool.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      RateLimitIntervalSec=30s
      RateLimitBurst=100000
      MaxRetentionSec={{ basetool_host_journal_max_retention }}
      SystemMaxUse={{ basetool_host_journal_max_use }}
  notify: Reload systemd-journald

- name: Read the service state
  ansible.builtin.service_facts:

- name: Name it for the restart handler
  ansible.builtin.set_fact:
    basetool_host_alloy_active: >-
      {{ ansible_facts.services['alloy.service'].state | default('') == 'running' }}

- name: Point alloy at the configuration the release delivers
  ansible.builtin.copy:
    dest: /etc/sysconfig/alloy
    owner: root
    group: root
    mode: "0644"
    content: |
      CONFIG_FILE="{{ basetool_host_root_dir }}/code/monitoring/alloy/config.alloy"
      CUSTOM_ARGS="--server.http.listen-addr={{ basetool_host_alloy_listen }}"
      IRI_ALLOY_LOKI_ENDPOINT="{{ basetool_host_alloy_loki_endpoint }}"
      IRI_ALLOY_TEMPO_ENDPOINT="{{ basetool_host_alloy_tempo_endpoint }}"
  notify: Restart alloy

- name: Make room for the alloy drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give the host service the log-source view config.alloy is written for
  ansible.builtin.template:
    src: alloy-log-sources.conf.j2
    dest: /etc/systemd/system/alloy.service.d/10-log-sources.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for the observability units
    - Restart alloy

- name: Give alloy the memory ceiling it had as a container
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/20-resources.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      MemoryMax={{ basetool_host_alloy_memory_max }}
      Environment=GOMEMLIMIT={{ basetool_host_alloy_gomemlimit }}
  notify:
    - Reload systemd for the observability units
    - Restart alloy

- name: Let the adm group read what RHEL writes root-only
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-basetool-adm-readable.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      $FileGroup adm
      $FileCreateMode 0640
  notify: Reload rsyslog

- name: Hand the existing auth log to adm as well
  ansible.builtin.file:
    path: /var/log/secure
    group: adm
    mode: "0640"
  when: not ansible_check_mode
  failed_when: false

- name: Make the audit log readable by the shipper, as config.alloy requires
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*log_group\s*='
    line: "log_group = adm"
    owner: root
    group: root
    mode: "0640"
  register: basetool_host_auditd_group
  when: not ansible_check_mode

- name: Stop systemd from putting the audit directory back
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/audit.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      d /var/log/audit 0750 root adm - -
  register: basetool_host_auditd_tmpfiles

- name: Apply it now rather than at the next boot
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/audit.conf
  changed_when: true
  when:
    - not ansible_check_mode
    - basetool_host_auditd_tmpfiles is changed

- name: Hand the audit log itself to adm
  ansible.builtin.file:
    path: /var/log/audit/audit.log
    group: adm
    mode: "0640"
  when: not ansible_check_mode
  failed_when: false

- name: Tell the running auditd to re-read its configuration
  ansible.builtin.command: systemctl kill --signal=HUP auditd.service
  changed_when: true
  when:
    - not ansible_check_mode
    - basetool_host_auditd_group is changed

- name: Confirm alloy can read what it is here to read
  ansible.builtin.command: id -nG alloy
  register: basetool_host_alloy_groups
  changed_when: false
  when: not ansible_check_mode

- name: Refuse an alloy that cannot read the journal or the logs
  ansible.builtin.assert:
    that:
      - "'adm' in basetool_host_alloy_groups.stdout.split()"
      - "'systemd-journal' in basetool_host_alloy_groups.stdout.split()"
    fail_msg: >-
      The alloy user is in [{{ basetool_host_alloy_groups.stdout | default('') }}] and needs adm
      (for root:adm files under /var/log) and systemd-journal (for the container units' output,
      which goes to the journal under the journald driver). Add them before enabling the service --
      alloy starts perfectly well without them and simply ships nothing.
  when: not ansible_check_mode

- name: Ask whether alloy can actually READ the security sources
  ansible.builtin.command: runuser -u alloy -- test -r {{ item }}
  loop:
    - /var/log/secure
    - /var/log/audit/audit.log
  register: basetool_host_alloy_reads
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Refuse a shipper that is up and blind
  ansible.builtin.assert:
    that:
      - basetool_host_alloy_reads.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      alloy cannot read
      {{ basetool_host_alloy_reads.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | join(', ') }}.
      The SSH/sudo and auditd tamper streams would stay empty while every other signal says the
      monitoring plane is healthy. Check that rsyslog re-read $FileGroup and that auditd took the
      SIGHUP; both are handled above and both are silent when they fail.
  when: not ansible_check_mode

- name: Enable alloy for the next boot, without starting it
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Let the service user's systemd instance run the podman exporter
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ basetool_host_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ basetool_host_service_uid }}"
  loop:
    - podman.socket
    - prometheus-podman-exporter.service
  when: not ansible_check_mode

- name: Install the metric collectors and their units
  ansible.builtin.copy:
    src: "{{ basetool_host_scripts_src }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: cgroup-container-metrics.py
      dest: "{{ basetool_host_root_dir }}/code/scripts/cgroup-container-metrics.py"
      mode: "0755"
    - src: iri-container-metrics.service
      dest: /etc/systemd/system/iri-container-metrics.service
      mode: "0644"
    - src: iri-container-metrics.timer
      dest: /etc/systemd/system/iri-container-metrics.timer
      mode: "0644"
    - src: cert-expiry-metrics.py
      dest: "{{ basetool_host_root_dir }}/code/scripts/cert-expiry-metrics.py"
      mode: "0755"
    - src: iri-cert-expiry.service
      dest: /etc/systemd/system/iri-cert-expiry.service
      mode: "0644"
    - src: iri-cert-expiry.timer
      dest: /etc/systemd/system/iri-cert-expiry.timer
      mode: "0644"
  notify: Reload systemd for the observability units
  register: basetool_host_collectors

- name: Let the new units be found before anything is enabled
  ansible.builtin.meta: flush_handlers

- name: Confirm systemd accepts the collector units
  ansible.builtin.command: "systemd-analyze verify /etc/systemd/system/{{ item }}"
  register: basetool_host_metrics_verify
  changed_when: false
  failed_when: basetool_host_metrics_verify.rc != 0
  loop:
    - iri-container-metrics.service
    - iri-cert-expiry.service
  when: not ansible_check_mode

- name: Start the metric timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - iri-container-metrics.timer
    - iri-cert-expiry.timer
  when: not ansible_check_mode

- name: Ask whether the certificate collector has ever written
  ansible.builtin.stat:
    path: "{{ basetool_host_root_dir }}/monitoring/textfile/certificates.prom"
  register: basetool_host_cert_metrics_file

- name: Ask whether there is anything for it to read
  ansible.builtin.find:
    paths: "{{ basetool_host_root_dir }}/monitoring/certs"
    patterns: "*.crt,*.pem,*.cer"
    file_type: file
  register: basetool_host_cert_files

- name: Take the first certificate reading now
  ansible.builtin.systemd_service:
    name: iri-cert-expiry.service
    state: started
  when:
    - not ansible_check_mode
    - basetool_host_cert_files.matched | default(0) | int > 0
    - basetool_host_collectors is changed or not basetool_host_cert_metrics_file.stat.exists

- name: Read back what the collector wrote
  ansible.builtin.slurp:
    src: "{{ basetool_host_root_dir }}/monitoring/textfile/certificates.prom"
  register: basetool_host_cert_metrics
  failed_when: false
  when: not ansible_check_mode

- name: Say which certificates are now watched
  ansible.builtin.debug:
    msg: >-
      {{ (basetool_host_cert_metrics.content | b64decode).splitlines() | select('match', 'basetool_certificate_expiry_timestamp_seconds') | list | length }}
      certificate file(s) under {{ basetool_host_root_dir }}/monitoring/certs are now watched for
      expiry -- CertificateFileExpiringSoon at 14 days, SelfSignedCertificateExpiring at 90.
  when:
    - not ansible_check_mode
    - basetool_host_cert_metrics.content is defined

- name: Say so loudly when there was nothing to read
  ansible.builtin.debug:
    msg: >-
      No certificate metrics were written: {{ basetool_host_root_dir }}/monitoring/certs holds
      {{ basetool_host_cert_files.matched | default(0) }} readable *.crt / *.pem / *.cer, so
      CertificateFileExpiringSoon and SelfSignedCertificateExpiring have no input on this host and
      CertificateMetricsStale is what will say so. On a host that has not cut over yet this is the
      expected state -- basetool-ca.crt is re-exported from the keystore, which arrives with the
      restore. Cutover step 0.6c is where it stops being expected.
  when:
    - not ansible_check_mode
    - basetool_host_cert_metrics.content is not defined

- name: Say what now runs on the host itself
  ansible.builtin.debug:
    msg: >-
      Host-side monitoring: node_exporter on {{ basetool_host_node_exporter_listen }} (systemd +
      textfile collectors), prometheus-podman-exporter on {{ basetool_host_podman_exporter_listen }}
      as a user unit of {{ basetool_host_service_user }}, and iri-container-metrics.timer (every 30s)
      plus iri-cert-expiry.timer (daily 03:40) writing
      {{ basetool_host_root_dir }}/monitoring/textfile. alloy is ENABLED but NOT started -- its
      configuration arrives with the first config bundle. The containerised monitoring services
      reach these over host.containers.internal, verified 2026-09-18; the host firewall keeps both
      ports off the network, also verified.
