---
- name: Create the service user's containers configuration directory
  ansible.builtin.file:
    path: "~{{ basetool_host_service_user }}/.config/containers"
    state: directory
    owner: "{{ basetool_host_service_user }}"
    group: "{{ basetool_host_service_group }}"
    mode: "0755"

- name: Create the Quadlet unit directory
  ansible.builtin.file:
    path: "~{{ basetool_host_service_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ basetool_host_service_user }}"
    group: "{{ basetool_host_service_group }}"
    mode: "0755"

- name: Configure rootless port forwarding
  ansible.builtin.template:
    src: containers.conf.j2
    dest: "~{{ basetool_host_service_user }}/.config/containers/containers.conf"
    owner: "{{ basetool_host_service_user }}"
    group: "{{ basetool_host_service_group }}"
    mode: "0644"

- name: Read back what podman actually resolved the setting to
  when: not ansible_check_mode
  become: true
  become_user: "{{ basetool_host_service_user }}"
  ansible.builtin.command: podman info --format '{{ "{{" }} .Host.RootlessNetworkCmd {{ "}}" }}'
  register: basetool_host_rootless_netcmd
  changed_when: false
  check_mode: false
  failed_when: false

- name: Report it
  ansible.builtin.debug:
    msg: >-
        podman reports rootless network command '{{ basetool_host_rootless_netcmd.stdout | default('?') }}'.
        That is the DEFAULT network mode. The bridge port forwarder is a different thing and podman
        does not report it here -- and since ADR-0187 this host deliberately sets nothing for it:
        the edge gets the client address from the PROXY-protocol front end instead. The acceptance
        is the BEHAVIOUR either way: run `scripts/check-conformance.py --ssh <host>` and require
        both client-address-visible and edge-not-directly-reachable to be green. A stack can be
        entirely healthy with the first red, and then the per-IP limiter applies to the whole
        internet at once; with the second red, the header it trusts can be forged.
  changed_when: false
  check_mode: false

- name: Read the service user's uid for the unit path
  ansible.builtin.getent:
    database: passwd
    key: "{{ basetool_host_service_user }}"
  check_mode: false

- name: Name it
  ansible.builtin.set_fact:
    basetool_host_service_uid: "{{ ansible_facts.getent_passwd[basetool_host_service_user][1] }}"

- name: Refuse an inventory still carrying the singular alias variable
  ansible.builtin.assert:
    that:
      - basetool_host_public_name_alias is not defined
    fail_msg: >-
      basetool_host_public_name_alias is now basetool_host_public_name_aliases, a LIST of
      "hostname:ip" entries -- one per name a container has to resolve locally. Replace it with
      basetool_host_public_name_aliases: ["{{ basetool_host_public_name_alias | default('name:ip') }}"]
    quiet: true

- name: Write the public-name alias drop-in
  ansible.builtin.copy:
    dest: >-
      /etc/containers/systemd/users/{{ basetool_host_service_uid }}/{{ item }}.container.d/10-host-alias.conf
    owner: "{{ basetool_host_deploy_user }}"
    group: "{{ basetool_host_deploy_user }}"
    mode: "0644"
    content: |
      [Container]
      {% for alias in basetool_host_public_name_aliases %}
      AddHost={{ alias }}
      {% endfor %}
      {% if item in basetool_host_public_name_alias_v6_services and basetool_host_public_name_aliases_v6 | length > 0 %}
      {% for alias in basetool_host_public_name_aliases_v6 %}
      AddHost={{ alias }}
      {% endfor %}
      {% endif %}
  loop: "{{ basetool_host_public_name_alias_services }}"
  when: basetool_host_public_name_aliases | length > 0
  notify: Reload the service user's units

- name: Read the alias drop-ins back
  ansible.builtin.slurp:
    src: >-
      /etc/containers/systemd/users/{{ basetool_host_service_uid }}/{{ item }}.container.d/10-host-alias.conf
  loop: "{{ basetool_host_public_name_alias_services }}"
  register: basetool_host_alias_dropins
  when:
    - basetool_host_public_name_aliases | length > 0
    - not ansible_check_mode
  check_mode: false

- name: Refuse a drop-in whose addresses did not become separate lines
  ansible.builtin.assert:
    that:
      - item.content | b64decode | regex_findall('(?m)^AddHost=') | length
        >= basetool_host_public_name_aliases | length
    fail_msg: >-
      {{ item.item }}: its 10-host-alias.conf carries fewer AddHost lines than there are aliases,
      so the addresses were written into one line instead of one each. The container will resolve
      none of the public names -- which takes the backend's issuer lookup, Grafana's sign-in and
      every blackbox probe with it, from a play that reported success.
    quiet: true
  loop: "{{ basetool_host_alias_dropins.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - basetool_host_public_name_aliases | length > 0
    - not ansible_check_mode

- name: Remove the alias drop-in where no alias is configured
  ansible.builtin.file:
    path: >-
      /etc/containers/systemd/users/{{ basetool_host_service_uid }}/{{ item }}.container.d/10-host-alias.conf
    state: absent
  loop: "{{ basetool_host_public_name_alias_services }}"
  when: basetool_host_public_name_aliases | length == 0
  notify: Reload the service user's units

- name: Write the JVM truststore drop-in
  ansible.builtin.copy:
    dest: >-
      /etc/containers/systemd/users/{{ basetool_host_service_uid }}/{{ item }}.container.d/20-jvm-truststore.conf
    owner: "{{ basetool_host_deploy_user }}"
    group: "{{ basetool_host_deploy_user }}"
    mode: "0644"
    content: |
      [Container]
      Volume={{ basetool_host_jvm_truststore_path }}:{{ basetool_host_jvm_truststore_dest }}:ro
  loop: "{{ basetool_host_jvm_truststore_services }}"
  when: basetool_host_jvm_truststore_path | length > 0
  notify: Reload the service user's units

- name: Refuse a truststore drop-in that points at nothing
  ansible.builtin.stat:
    path: "{{ basetool_host_jvm_truststore_path }}"
  register: basetool_host_jvm_truststore_stat
  when: basetool_host_jvm_truststore_path | length > 0

- name: It has to exist before a container mounts it
  ansible.builtin.assert:
    that: basetool_host_jvm_truststore_stat.stat.exists | default(false)
    fail_msg: >-
      basetool_host_jvm_truststore_path is {{ basetool_host_jvm_truststore_path }}, which does not
      exist on this host. Podman refuses a missing bind-mount source, so all three JVM services
      would fail to start with an error naming the path and not the variable.
  when: basetool_host_jvm_truststore_path | length > 0

- name: Remove the truststore drop-in where none is configured
  ansible.builtin.file:
    path: >-
      /etc/containers/systemd/users/{{ basetool_host_service_uid }}/{{ item }}.container.d/20-jvm-truststore.conf
    state: absent
  loop: "{{ basetool_host_jvm_truststore_services }}"
  when: basetool_host_jvm_truststore_path | length == 0
  notify: Reload the service user's units

- name: Say whether the containers will see the public name
  ansible.builtin.debug:
    msg: >-
      {% if basetool_host_public_name_aliases | length > 0 %}
      {{ basetool_host_public_name_alias_services | join(', ') }} carry
      {{ basetool_host_public_name_aliases | join(' and ') }} via a drop-in. The first MUST match
      IRI_KEYCLOAK_HOST_ALIAS in the host .env -- check-conformance.py fails on a silent
      disagreement.
      {% else %}
      NO public-name alias is configured, and on a rootless host that is almost certainly wrong.
      A container here cannot reach this machine through its own public address at all: the
      container networks live in the service user's network namespace and outbound leaves through
      pasta, which does not fold a connection to the host's own address back into the host.
      Measured on production 2026-09-22 -- ports 22, 80 and 443 on the host's public IPv4 all
      refused from inside a container, while the same ports on host-gateway answered.
      This used to read "which is right for production: its public name resolves to the host that
      serves it". That was true under Docker, whose hairpin worked, and it cost the cutover its
      backend, its Grafana sign-in and every external probe.
      {% endif %}
      {% if basetool_host_jvm_truststore_path | length > 0 %}
      A JVM truststore is mounted at {{ basetool_host_jvm_truststore_dest }} from
      {{ basetool_host_jvm_truststore_path }}. IRI_EXTRA_JAVA_OPTS in the host .env must point
      -Djavax.net.ssl.trustStore at that same path, or the mount is inert.
      {% endif %}
