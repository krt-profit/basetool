---
- name: Install the container runtime and the tools this role and its operators need
  ansible.builtin.dnf:
    name:
      - podman
      - passt
      - netavark
      - aardvark-dns
      - crun
      - policycoreutils-python-utils
      - setools-console
      - git
      - curl
      - jq
      - rsync
      - restic
      - rclone
      - skopeo
      - acl
      - firewalld
      - grubby
    state: present

- name: Look for an installed podman
  ansible.builtin.command: command -v podman
  register: basetool_host_podman_path
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say that the version gate cannot run yet
  ansible.builtin.debug:
    msg: >-
      podman is not installed on this host, so the version floor and the Quadlet
      manual-page check below are SKIPPED. Under --check that is expected: the package task
      above reported `changed`, meaning a real run installs it first. If you are seeing this
      outside --check, the package install did not take effect and nothing below has been
      verified.
  when: basetool_host_podman_path.rc | default(1) != 0

- name: Read the installed podman version
  ansible.builtin.command: podman --version
  register: basetool_host_podman_version_raw
  changed_when: false
  check_mode: false
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Split the version
  ansible.builtin.set_fact:
    basetool_host_podman_parts: "{{ basetool_host_podman_version_raw.stdout.split()[-1].split('.') }}"
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Refuse a version string this role cannot read
  ansible.builtin.assert:
    that: basetool_host_podman_parts | length >= 2
    fail_msg: >-
      Could not read a version out of '{{ basetool_host_podman_version_raw.stdout }}'. Everything below
      compares numbers, and comparing against a value that was never parsed would pass silently.
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Name the two numbers the assertions use
  ansible.builtin.set_fact:
    basetool_host_podman_major: "{{ basetool_host_podman_parts[0] | int }}"
    basetool_host_podman_minor: "{{ basetool_host_podman_parts[1] | int }}"
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Assert podman translates this stack's units completely
  ansible.builtin.assert:
    that:
      - basetool_host_podman_major | int > basetool_host_min_podman_major | int or
        (basetool_host_podman_major | int == basetool_host_min_podman_major | int and
         basetool_host_podman_minor | int >= basetool_host_min_podman_minor | int)
    fail_msg: >-
      Found {{ basetool_host_podman_version_raw.stdout }}, need >=
      {{ basetool_host_min_podman_major }}.{{ basetool_host_min_podman_minor }}. Measured 2026-09-16: podman
      5.8.2 carries Memory=, PidsLimit=, ReadOnly=, DropCapability=, NoNewPrivileges=, AutoUpdate=
      and Notify=healthy in podman-systemd.unit(5); 5.4.2 has no Memory= at all. A missing Quadlet
      key does not fail the unit -- it is simply not applied, so the container runs without the
      limit that was measured for it.
    success_msg: "{{ basetool_host_podman_version_raw.stdout }}"
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Confirm Quadlet really carries Memory=
  ansible.builtin.shell: >-
    set -o pipefail && man podman-systemd.unit 2>/dev/null | col -b | grep -cE '^ +Memory='
  register: basetool_host_quadlet_memory
  changed_when: false
  check_mode: false
  failed_when: false
  when: basetool_host_podman_path.rc | default(1) == 0

- name: Assert it, when the manual page could be read at all
  ansible.builtin.assert:
    that: basetool_host_quadlet_memory.stdout | int > 0
    fail_msg: >-
      podman-systemd.unit(5) on this host does not document Memory=, although podman reports
      {{ basetool_host_podman_version_raw.stdout }}. Either the manual page is absent, or this build's
      Quadlet differs from the one measured -- and in the second case every Memory= line in the
      generated units would be ignored without a word. Check by hand before proceeding.
  when:
    - basetool_host_podman_path.rc | default(1) == 0
    - basetool_host_quadlet_memory.stdout | int >= 0
    - basetool_host_quadlet_memory.rc | int == 0

- name: Stop the cockpit socket before removing what serves it
  ansible.builtin.systemd_service:
    name: cockpit.socket
    state: stopped
    enabled: false
  register: basetool_host_cockpit_socket
  failed_when: false
  when:
    - basetool_host_remove_cockpit | bool
    - not ansible_check_mode

- name: Remove the cockpit web console
  ansible.builtin.dnf:
    name: "{{ basetool_host_cockpit_packages }}"
    state: absent
    autoremove: false
  register: basetool_host_cockpit_removed
  when: basetool_host_remove_cockpit | bool

- name: Ask whether anything still answers on 9090
  ansible.builtin.shell: |
    set -o pipefail
    ss -lntH 'sport = :9090' 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  register: basetool_host_port_9090
  changed_when: false
  failed_when: false
  when:
    - basetool_host_remove_cockpit | bool
    - not ansible_check_mode

- name: Refuse a host that still has a web console listening
  ansible.builtin.assert:
    that:
      - basetool_host_port_9090.stdout | default('0') | trim | int == 0
    fail_msg: >-
      Something is still listening on :9090 after the cockpit removal
      ({{ basetool_host_port_9090.stdout | default('?') | trim }} socket(s)). Removing the package
      is not the goal; the free port is. Read `ss -lntp 'sport = :9090'` before assuming it is
      cockpit -- on this stack nothing else should want that port, because Prometheus runs as a
      container and publishes nothing.
  when:
    - basetool_host_remove_cockpit | bool
    - not ansible_check_mode
