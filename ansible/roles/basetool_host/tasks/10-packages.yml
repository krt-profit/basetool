---
- name: Install the container runtime and the tools this role and its operators need
  ansible.builtin.dnf:
    name:
      - podman
      - passt            # pasta: podman's rootless default network mode, and its dependency
      - netavark
      - aardvark-dns
      - crun
      - policycoreutils-python-utils   # semanage, for 40-selinux.yml
      - setools-console                # sesearch, for diagnosing a denial rather than guessing
      - git
      - curl
      - jq
      - rsync
      # Resolves a tag to an immutable digest without pulling the image -- what
      # `docker buildx imagetools inspect` does today, and there is no podman
      # subcommand for it. Measured present in AppStream on Rocky 10 (1.22.2)
      # while mapping the Quadlet deploy path, plan Phase 3.
      - skopeo
      # COSIGN IS DELIBERATELY NOT HERE, and its absence is a decision to take
      # rather than an omission to fix by adding a line.
      #
      # REQ-OPS-015 verifies every resolved digest against the release workflow's
      # keyless signature BEFORE it is pulled, extracted or applied, and the
      # deployer is fail-closed on it -- so the Podman deployer cannot ship
      # without cosign on the host. Measured 2026-09-17: cosign is in NO enabled
      # repository on Rocky 10, and EPEL is not configured.
      #
      # The two ways out differ in what they cost, which is why this is the
      # owner's call and not a package name:
      #   * enable EPEL -- one line here, and a permanently wider supply-chain
      #     surface on a host that was deliberately built from BaseOS, AppStream
      #     and Extras alone;
      #   * fetch the upstream static binary and verify it by published checksum
      #     -- no new repository, but a bootstrap step this role has to own,
      #     including how the checksum itself is trusted.
      #
      # Adding `- cosign` to the list above without choosing would fail the role
      # outright on a fresh host, which is how this was found.
      # Ansible needs setfacl to hand its temp files to an unprivileged become_user. Without it
      # the fallback is `chmod A+user:iri:rx:allow`, which is NFSv4 syntax that GNU chmod
      # rejects outright -- the run then dies with "Failed to set permissions on the temporary
      # files Ansible needs", which reads like a permissions problem and is a missing package.
      - acl
      # A host firewall, installed on purpose. The CIS remediation pulls firewalld in as a
      # dependency anyway -- but then it arrives unannounced, enabled, with a default zone
      # that does not know about this stack, and the edge times out from every other machine
      # while every check on the host stays green. Owning the decision is the difference.
      - firewalld
    state: present

- name: Read the installed podman version
  ansible.builtin.command: podman --version
  register: basetool_host_podman_version_raw
  changed_when: false
  check_mode: false

- name: Split the version
  # `podman --version` prints "podman version 5.8.2". Taking the last field and splitting on dots
  # beats a regex here: it is readable, it cannot return None, and a regex_search with a capture
  # group raised 'NoneType' object has no attribute 'group' on ansible-core 2.16 when it did not
  # match -- an error that says nothing about which pattern or which input.
  ansible.builtin.set_fact:
    basetool_host_podman_parts: "{{ basetool_host_podman_version_raw.stdout.split()[-1].split('.') }}"

- name: Refuse a version string this role cannot read
  ansible.builtin.assert:
    that: basetool_host_podman_parts | length >= 2
    fail_msg: >-
      Could not read a version out of '{{ basetool_host_podman_version_raw.stdout }}'. Everything below
      compares numbers, and comparing against a value that was never parsed would pass silently.

- name: Name the two numbers the assertions use
  ansible.builtin.set_fact:
    basetool_host_podman_major: "{{ basetool_host_podman_parts[0] | int }}"
    basetool_host_podman_minor: "{{ basetool_host_podman_parts[1] | int }}"


- name: Assert podman translates this stack's units completely
  ansible.builtin.assert:
    that:
      - basetool_host_podman_major | int > basetool_host_min_podman_major | int or
        (basetool_host_podman_major | int == basetool_host_min_podman_major | int and
         basetool_host_podman_minor | int >= basetool_host_min_podman_minor | int)
    fail_msg: >-
      Found {{ basetool_host_podman_version_raw.stdout }}, need >=
      {{ basetool_host_min_podman_major }}.{{ basetool_host_min_podman_minor }}. Measured 2026-09-16: podman
      5.8.2 carries Memory=, PidsLimit=, ReadOnly=, DropCapability=, NoNewPrivileges=, AutoUpdate=
      and Notify=healthy in podman-systemd.unit(5); 5.4.2 has no Memory= at all. A missing Quadlet
      key does not fail the unit -- it is simply not applied, so the container runs without the
      limit that was measured for it.
    success_msg: "{{ basetool_host_podman_version_raw.stdout }}"

# Belt and braces on the key that degrades silently rather than loudly. The version floor above is
# the rule; this reads the shipped manual page and checks the rule still describes reality, which a
# distribution rebase can quietly change underneath a version number.
- name: Confirm Quadlet really carries Memory=
  ansible.builtin.shell: >-
    set -o pipefail && man podman-systemd.unit 2>/dev/null | col -b | grep -cE '^ +Memory='
  register: basetool_host_quadlet_memory
  changed_when: false
  check_mode: false
  failed_when: false

- name: Assert it, when the manual page could be read at all
  ansible.builtin.assert:
    that: basetool_host_quadlet_memory.stdout | int > 0
    fail_msg: >-
      podman-systemd.unit(5) on this host does not document Memory=, although podman reports
      {{ basetool_host_podman_version_raw.stdout }}. Either the manual page is absent, or this build's
      Quadlet differs from the one measured -- and in the second case every Memory= line in the
      generated units would be ignored without a word. Check by hand before proceeding.
  when: basetool_host_quadlet_memory.stdout | int >= 0 and basetool_host_quadlet_memory.rc | int == 0
