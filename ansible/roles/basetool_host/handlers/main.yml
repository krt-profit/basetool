---
- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded
  when: basetool_host_haproxy_active | default(false) | bool

- name: Apply the SELinux labels
  ansible.builtin.command: "restorecon -RF {{ basetool_host_root_dir }}"
  changed_when: true

- name: Reload systemd for the operational units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload systemd for the observability units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    state: restarted
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted
  when: not ansible_check_mode

- name: Reload rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: reloaded
  when: not ansible_check_mode

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy.service
    state: restarted
  when:
    - not ansible_check_mode
    - basetool_host_alloy_active | default(false) | bool

- name: Reload the service user's units
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ basetool_host_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ basetool_host_service_uid }}"
  when: not ansible_check_mode

- name: Reload systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: not ansible_check_mode
  notify: Flush the runtime journal into persistent storage

- name: Flush the runtime journal into persistent storage
  ansible.builtin.command: journalctl --flush
  changed_when: true
  when: not ansible_check_mode
