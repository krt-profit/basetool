# Ansible configuration for the Basetool host bootstrap (ADR-0185).
#
# This tree PROVISIONS hosts. It does not deploy: images, unit files and configuration bundles
# reach the host by REQ-OPS-001's pull-only path, and nothing here may become a second one.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
# Ansible's own default is to gather everything; this role needs the SELinux and distribution
# facts and nothing exotic, and a smaller gather keeps a --check run quick.
gathering = smart
stdout_callback = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
