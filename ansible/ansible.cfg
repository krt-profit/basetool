# Ansible configuration for the Basetool host bootstrap (ADR-0188).
#
# This tree PROVISIONS hosts. It does not deploy: images, unit files and configuration bundles
# reach the host by REQ-OPS-001's pull-only path, and nothing here may become a second one.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
# Ansible's own default is to gather everything; this role needs the SELinux and distribution
# facts and nothing exotic, and a smaller gather keeps a --check run quick.
gathering = smart
# NOT `stdout_callback = yaml`. That resolves to community.general.yaml, which was REMOVED in
# community.general 12.0.0 -- and it does not degrade, it aborts the run before the first task:
#   ERROR! [DEPRECATED]: community.general.yaml has been removed.
# The documented replacement is the builtin callback with a format option, which needs no
# collection at all and has worked since ansible-core 2.13.
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
