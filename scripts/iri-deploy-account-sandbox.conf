; The sandbox every operational unit that runs as the `deploy` account shares (OPS-SIMP-03).
;
; Installed by the Ansible role (ansible/roles/basetool_host/tasks/25-scripts.yml) as
;   /etc/systemd/system/<unit>.d/10-deploy-account-sandbox.conf
; for iri-deploy, iri-backup, iri-restore-drill and iri-container-cleanup. Until 2026-09-22 each of
; the four carried its own copy of these lines and of the reasons below; three of the copies had
; already drifted apart in their comments. The unit files keep what differs per job -- the user, the
; command, the writable paths, the resource caps -- and iri-deploy.service adds its stricter extras.
;
; Two directives are ABSENT on purpose, and each absence was measured:
;
;   NoNewPrivileges=true -- these jobs act AS ANOTHER USER. The containers belong to the rootless
;     service account, and the deploy account reaches them through a sudoers rule naming two
;     commands against that one user (tasks/22-deploy-user.yml). The flag forbids exactly that:
;         sudo: The "no new privileges" flag is set, which prevents sudo from running as root.
;     Measured on the testing host 2026-09-18. The privilege boundary is the sudoers rule, not this
;     flag.
;
;   RestrictNamespaces=true -- rootless Podman IS a user namespace; the flag makes the runtime fail
;     with "cannot set user namespace" before it reaches any container, and `=user` fails the same
;     way because podman needs mount, pid, ipc, net and uts as well.

[Service]
ProtectSystem=strict
; read-only, NOT true. `true` makes /home an inaccessible empty tmpfs, and rootless podman has to
; resolve the SERVICE user's home to find its container store:
;     cannot resolve /home/iri: lstat /home/iri: permission denied
; read-only keeps what matters -- no job here has business writing into anybody's home. Measured on
; the testing host 2026-09-18.
ProtectHome=read-only
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
LockPersonality=true
