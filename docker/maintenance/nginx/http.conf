# =============================================================================
# Profit Basetool - http-context snippet (maintenance selector + limit zones)
#
# Included by nginx-proxy-manager from /data/nginx/custom/http.conf into the
# top-level `http { }` block. Pairs with server_proxy.conf, which catches
# upstream 502/503/504s, routes them to the @maintenance named location, and
# applies the per-IP limits whose zones are defined below.
#
# Maintenance selector: picks the response representation by inspecting the
# client's Accept header:
#   - "application/json" or "application/problem+json"  -> RFC 7807 JSON
#   - anything else (incl. "text/html", "*/*", missing) -> branded HTML page
#
# The chosen target path is exposed as $maintenance_target and consumed via
# `rewrite ^.*$ $maintenance_target break;` inside @maintenance.
# =============================================================================

map $http_accept $maintenance_target {
    default                                /maintenance/maintenance.html;
    "~*application/(problem\+)?json"       /maintenance/maintenance.json;
}

# --- Edge rate limiting (REQ-SEC-023) ----------------------------------------
# Shared-memory zones for the per-IP safety net applied in server_proxy.conf
# (i.e. in every proxy host's server block). NPM includes this file AFTER the
# proxy_host/*.conf files, which is fine: nginx binds limit_req/limit_conn
# references to zones by name once the full config is parsed, not in include
# order.
#
# The limiter key is $krt_limit_key (below), NOT $binary_remote_addr: IPv4 keeps
# its full address, but IPv6 is collapsed to its /64 network prefix so a single
# subscriber's rotating privacy-extension addresses (SLAAC temporary addresses
# vary only in the low 64 bits, RFC 4941) share ONE bucket instead of each new
# address minting a fresh one and diluting the cap (ADR-0112 follow-up). The map
# captures the first four hextets of a real client's global /64 and re-emits it
# as `<prefix>::`; an IPv4 address (no colons) or the rare IPv6 whose /64 prefix
# is ::-compressed (e.g. a bridge gateway fd00:28:3::1) has no 4-hextet match and
# falls through to `default` = the full address — i.e. no worse than the previous
# /128 keying. $remote_addr (text) is used rather than $binary_remote_addr
# because the map masks the human-readable form; a 10m zone still holds well over
# 100k distinct keys.
#
# 20 r/s with burst 80 is a flood / brute-force ceiling, not a fairness limiter:
# a worst-case page load (~40 uncached asset requests at once) fits inside the
# burst, while hammering the Keycloak login form or an API endpoint does not.
map $remote_addr $krt_limit_key {
    default                                                  $remote_addr;
    "~*^(?<v6net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"  "$v6net::";
}
limit_req_zone  $krt_limit_key zone=krt_req_perip:10m rate=20r/s;
limit_conn_zone $krt_limit_key zone=krt_conn_perip:10m;
