# =============================================================================
# Profit Basetool - http-context snippet (maintenance selector + limit zones)
#
# Included by nginx-proxy-manager from /data/nginx/custom/http.conf into the
# top-level `http { }` block. Pairs with server_proxy.conf, which catches
# upstream 502/503/504s, routes them to the @maintenance named location, and
# applies the per-IP limits whose zones are defined below.
#
# Maintenance selector: picks the response representation by inspecting the
# client's Accept header:
#   - "application/json" or "application/problem+json"  -> RFC 7807 JSON
#   - anything else (incl. "text/html", "*/*", missing) -> branded HTML page
#
# The chosen target path is exposed as $maintenance_target and consumed via
# `rewrite ^.*$ $maintenance_target break;` inside @maintenance.
# =============================================================================

map $http_accept $maintenance_target {
    default                                /maintenance/maintenance.html;
    "~*application/(problem\+)?json"       /maintenance/maintenance.json;
}

# --- Edge rate limiting (REQ-SEC-023) ----------------------------------------
# Shared-memory zones for the per-IP safety net applied in server_proxy.conf
# (i.e. in every proxy host's server block). NPM includes this file AFTER the
# proxy_host/*.conf files, which is fine: nginx binds limit_req/limit_conn
# references to zones by name once the full config is parsed, not in include
# order.
#
# 10m tracks ~160k client IPs per zone. 20 r/s with burst 80 is a flood /
# brute-force ceiling, not a fairness limiter: a worst-case page load (~40
# uncached asset requests at once) fits inside the burst, while hammering the
# Keycloak login form or an API endpoint does not.
limit_req_zone  $binary_remote_addr zone=krt_req_perip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=krt_conn_perip:10m;
