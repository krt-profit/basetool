# =============================================================================
# Profit Basetool — edge proxy, main configuration (ADR-0162)
#
# This file replaces the configuration Nginx Proxy Manager used to GENERATE from
# its SQLite database. Everything the edge does is now here or under conf.d/ and
# include/, in git, reviewable, and validated by `nginx -t` in CI
# (.github/workflows/repo-lint.yml).
#
# The container runs UNPRIVILEGED (REQ-OPS-014):
#   - process user 101:101, set by the image, never root;
#   - listening on 8080/8443, with the host publishing 80/443 onto them, so not
#     even NET_BIND_SERVICE is required — `cap_drop: [ALL]` with no `cap_add`;
#   - `read_only: true`, with tmpfs for the three paths nginx must write.
#
# `daemon off` comes from the command line; `user` is deliberately NOT set, since
# it would only warn on an already-unprivileged master. `pid` IS set below: the
# image compiles it to /run/nginx.pid, which a read-only root filesystem refuses.
# =============================================================================

worker_processes auto;
pcre_jit on;

# Without this the edge logged, on every start:
#   [warn] 4096 worker_connections exceed open file resource limit: 1024
# and it was not cosmetic — a worker capped at 1024 descriptors cannot reach the
# 4096 connections it is configured for. A proxied request needs TWO descriptors,
# one to the client and one to the upstream, so the ceiling is 2 ×
# worker_connections plus the listening sockets, the logs and the resolver.
# 16384 is that doubled again, which costs nothing (a descriptor table is
# allocated lazily) and leaves the headroom keepalive upstream pools consume.
#
# Raising the SOFT limit toward the hard one needs no privilege, so this works
# under `cap_drop: [ALL]`. docker-compose.yml pins the container's ceiling at
# 65536, the same value backend and frontend carry, so this request sits well
# under it — nginx never has to raise past a hard limit and refuse.
# `nginx -t` never reported this and structurally cannot: it parses, it does not
# start workers, and the warning belongs to the start. Measured rather than
# assumed — a config with worker_connections 4096 under a 1024 descriptor limit
# passes `-t` without a word. `scripts/check-edge-nginx.sh` therefore starts the
# edge for real, under the limit the compose file declares, and fails on anything
# it logs. That is also why the two days of pid-path and temp-directory failures
# reached production with a green gate behind them.
worker_rlimit_nofile 16384;

# The image compiles in /run/nginx.pid, and /run is NOT writable under
# `read_only: true` — nginx then dies with
#   [emerg] open() "/run/nginx.pid" failed (30: Read-only file system)
# which surfaces as a health-check timeout, not as a path problem. The pid moves
# onto the tmpfs with everything else nginx writes.
pid /tmp/nginx.pid;

# stderr so the container log is the log — Alloy ships it like every other
# service (ADR-0095). NPM wrote to /data/logs/*.log inside the container, which
# is why the edge was the one component whose logs needed a bind mount to read.
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  # Carried over from the NPM http block, value for value.
  server_tokens                 off;
  keepalive_timeout             90s;
  proxy_connect_timeout         90s;
  proxy_send_timeout            90s;
  proxy_read_timeout            90s;
  proxy_ignore_client_abort     off;
  proxy_http_version            1.1;
  server_names_hash_bucket_size 1024;

  # The default 64-byte bucket cannot hold this set of proxy_set_header names and
  # nginx warns on every start that it is ignoring the bucket size. The gate
  # treats a warning as a failure, so the number is raised rather than the
  # warning tolerated — a config that always warns is one where the next, real
  # warning goes unread.
  proxy_headers_hash_max_size    1024;
  proxy_headers_hash_bucket_size 128;

  # Deliberately far above what the apps accept (they cap around 72 MB), so a
  # size refusal comes from the application with a usable error rather than from
  # nginx. The ingest vhost sets its own 2m.
  client_max_body_size 2000m;

  # `off` is what actually applied before: NPM set `on` at the http level and
  # then `off` again inside every server via ssl-ciphers.conf, and the inner
  # value wins. Stated once, at the level where it is true.
  ssl_prefer_server_ciphers off;

  # The edge compresses; upstreams are asked not to. Carried over verbatim —
  # dropping the Accept-Encoding strip would silently move compression from the
  # edge to the apps and change response headers on every route.
  gzip on;
  proxy_set_header Accept-Encoding "";

  # Every path nginx writes to, directly under the tmpfs and ONE LEVEL DEEP.
  # nginx creates the leaf directory it is given but NOT the parents, so
  # /tmp/nginx/client_body on a fresh tmpfs dies with
  #   [emerg] mkdir() "/tmp/nginx/client_body" failed (2: No such file or directory)
  # — which reads as a health-check timeout and an automatic rollback rather than
  # as a path mistake. Reproduced locally on 2026-09-12 after it took down three
  # production applies.
  #
  # `read_only: true` on the
  # container makes the root filesystem immutable, so these have to be explicit
  # rather than inherited from the image's compile-time prefix — a request with a
  # body larger than the in-memory buffer would otherwise fail at the first write.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Docker's embedded resolver, so upstream names resolve after a container is
  # recreated with a new address. Works on an `internal: true` network.
  resolver 127.0.0.11 valid=10s;

  # NO set_real_ip_from / real_ip_header. NPM trusted 10/8, 172.16/12 and
  # 192.168/16 to rewrite the client address out of `X-Real-IP`. The edge is the
  # FIRST hop — there is no proxy in front of it — so that setting could only
  # ever do one of two things: nothing (an internet client's public address is
  # not in a trusted range, so its header was ignored) or harm (a container on a
  # shared bridge could set `X-Real-IP` and choose which bucket the per-IP
  # limiter charged it to). Leaving it out makes $remote_addr the true peer in
  # every case, which is what $krt_limit_key and the access log should hold.
  # If a CDN or scrubbing service is ever put in front, this is the setting that
  # has to come back — together with its ranges, and never as `0.0.0.0/0`.

  access_log /dev/stdout;

  # NOT the mounted directory: the per-vhost blocks carry host names that differ
  # per environment, and nginx has no variables in `server_name`. They are
  # rendered from `*.conf.template` by `render-and-run.sh` into this tmpfs at
  # start-up, together with the environment-independent blocks copied verbatim.
  # A configuration error therefore surfaces at start, gated by the health check
  # — and `scripts/check-edge-nginx.sh` renders BOTH environments in CI so it
  # surfaces before that.
  include /tmp/edge-conf.d/*.conf;
}
