# =============================================================================
# Profit Basetool — edge proxy, main configuration (ADR-0162)
#
# This file replaces the configuration Nginx Proxy Manager used to GENERATE from
# its SQLite database. Everything the edge does is now here or under conf.d/ and
# include/, in git, reviewable, and validated by `nginx -t` in CI
# (.github/workflows/repo-lint.yml).
#
# The container runs UNPRIVILEGED (REQ-OPS-014):
#   - process user 101:101, set by the image, never root;
#   - listening on 8080/8443, with the host publishing 80/443 onto them, so not
#     even NET_BIND_SERVICE is required — `cap_drop: [ALL]` with no `cap_add`;
#   - `read_only: true`, with tmpfs for the three paths nginx must write.
#
# `daemon off` and `pid` are deliberately NOT set here: the nginx-unprivileged
# image's entrypoint runs `nginx -g "daemon off;"` and the pid path is a
# compile-time default under /tmp, which is a tmpfs mount. Setting `user` here
# would emit a warning on an already-unprivileged master and change nothing.
# =============================================================================

worker_processes auto;
pcre_jit on;

# stderr so the container log is the log — Alloy ships it like every other
# service (ADR-0095). NPM wrote to /data/logs/*.log inside the container, which
# is why the edge was the one component whose logs needed a bind mount to read.
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  # Carried over from the NPM http block, value for value.
  server_tokens                 off;
  keepalive_timeout             90s;
  proxy_connect_timeout         90s;
  proxy_send_timeout            90s;
  proxy_read_timeout            90s;
  proxy_ignore_client_abort     off;
  proxy_http_version            1.1;
  server_names_hash_bucket_size 1024;

  # The default 64-byte bucket cannot hold this set of proxy_set_header names and
  # nginx warns on every start that it is ignoring the bucket size. The gate
  # treats a warning as a failure, so the number is raised rather than the
  # warning tolerated — a config that always warns is one where the next, real
  # warning goes unread.
  proxy_headers_hash_max_size    1024;
  proxy_headers_hash_bucket_size 128;

  # Deliberately far above what the apps accept (they cap around 72 MB), so a
  # size refusal comes from the application with a usable error rather than from
  # nginx. The ingest vhost sets its own 2m.
  client_max_body_size 2000m;

  # `off` is what actually applied before: NPM set `on` at the http level and
  # then `off` again inside every server via ssl-ciphers.conf, and the inner
  # value wins. Stated once, at the level where it is true.
  ssl_prefer_server_ciphers off;

  # The edge compresses; upstreams are asked not to. Carried over verbatim —
  # dropping the Accept-Encoding strip would silently move compression from the
  # edge to the apps and change response headers on every route.
  gzip on;
  proxy_set_header Accept-Encoding "";

  # Every path nginx writes to, moved under one tmpfs. `read_only: true` on the
  # container makes the root filesystem immutable, so these have to be explicit
  # rather than inherited from the image's compile-time prefix — a request with a
  # body larger than the in-memory buffer would otherwise fail at the first write.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # Docker's embedded resolver, so upstream names resolve after a container is
  # recreated with a new address. Works on an `internal: true` network.
  resolver 127.0.0.11 valid=10s;

  # NO set_real_ip_from / real_ip_header. NPM trusted 10/8, 172.16/12 and
  # 192.168/16 to rewrite the client address out of `X-Real-IP`. The edge is the
  # FIRST hop — there is no proxy in front of it — so that setting could only
  # ever do one of two things: nothing (an internet client's public address is
  # not in a trusted range, so its header was ignored) or harm (a container on a
  # shared bridge could set `X-Real-IP` and choose which bucket the per-IP
  # limiter charged it to). Leaving it out makes $remote_addr the true peer in
  # every case, which is what $krt_limit_key and the access log should hold.
  # If a CDN or scrubbing service is ever put in front, this is the setting that
  # has to come back — together with its ranges, and never as `0.0.0.0/0`.

  access_log /dev/stdout;

  include /etc/nginx/conf.d/*.conf;
}
