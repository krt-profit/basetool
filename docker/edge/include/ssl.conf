# TLS parameters. Carried from NPM's ssl-ciphers.conf and ssl-cache.conf, value
# for value — only TLS 1.2 and 1.3 are offered, and the cipher list is the one
# the edge has been presenting.
#
# OCSP stapling is deliberately NOT enabled. It would require an outbound
# connection to the CA, and the edge deliberately has none (ADR-0162: its
# networks are `internal: true`). nginx would fail the fetch silently and simply
# staple nothing, which is the same end state with extra moving parts.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_session_timeout 5m;
ssl_session_cache shared:SSL:50m;
