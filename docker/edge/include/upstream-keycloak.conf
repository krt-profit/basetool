# Proxy settings for the Keycloak upstream, in ONE place.
#
# Keycloak is reached at four locations on the web vhost (the realm surface, the
# token endpoint's tighter limiter, the admin console behind its address
# allow-list, and the two management paths that are closed outright), and before
# this include each of them carried its own copy of the block below. Three
# copies of a rule that must stay identical is how one of them quietly stops
# matching the others.
#
# A VARIABLE upstream, not a literal one. With a literal name nginx resolves it
# once at startup and caches the address forever, so a recreated container
# leaves the edge pointing at an address nobody answers on until the edge is
# restarted too. The variable form defers resolution to the resolver declared in
# nginx.conf and re-resolves on its TTL. $request_uri is appended because a
# proxy_pass carrying variables does not forward the request URI on its own; it
# is the RAW, still-encoded form, which is what the upstreams have always been
# given and what the API allow-list deliberately does NOT match on.
#
# The request URI is passed through UNCHANGED — no `rewrite`, no stripping of
# the /auth prefix. Keycloak itself is mounted at that path
# (KC_HTTP_RELATIVE_PATH=/auth), so it expects to receive it: rewriting the
# prefix away here would make every absolute URL Keycloak generates — the
# authorization endpoint, the form actions of its own login page, the redirects
# in the OIDC discovery document — point one level above where the edge serves
# it, and the login would fail in a way that looks like a realm misconfiguration.
include /etc/nginx/edge/include/proxy.conf;

# OVERWRITE the client-address headers rather than appending to them (REQ-SEC-011).
#
# proxy.conf sets `X-Forwarded-For $proxy_add_x_forwarded_for`, which APPENDS — so a caller's own
# header survives as the first element. Keycloak runs `--proxy-headers xforwarded` and its parser
# takes the remote address from that first element, so `curl -H 'X-Forwarded-For: 8.8.8.8'` makes
# every LOGIN_ERROR event Keycloak writes name a third party. An attacker can flood failed logins
# attributed to somebody else, and IP-based brute-force triage then reads the forged value.
#
# Carried over rather than introduced — the retired vhost did the same — but this file was written
# to be the one place these settings live, which makes it the moment to stop carrying it.
# 50-api.conf.template documents the identical trap and fixes it the identical way.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         "";

include /etc/nginx/edge/include/upstream-tls.conf;
proxy_ssl_name                keycloak;
set $upstream_host keycloak;
proxy_pass https://$upstream_host:18443$request_uri;
