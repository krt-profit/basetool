# =============================================================================
# Profit Basetool — edge hardening (replaces NPM's "Block Common Exploits")
#
# The NPM include this supersedes was a museum piece. It regex-matched
# $query_string for SQL injection, kept a pharmaceutical spam word list
# (ultram, viagra, hoodia, …) and blocked the user agents of 1998 download
# managers (GetRight, Go!Zilla, Download Demon, Indy Library). None of that
# stops an attacker who exists today, and two parts of it could FALSELY block a
# member: a query string legitimately containing `concat(` tripped the
# SQL rule, and the word list matched on content, not intent.
#
# What replaced it, and why:
#
#   dropped  SQL-injection query regexes  — the backend uses parameterised JPA
#                                           queries and validated DTOs; an edge
#                                           regex adds false positives, not
#                                           defence (REQ-DATA-*, REQ-API-*)
#   dropped  pharmacy spam word list      — matches content, blocks nothing
#   dropped  1998 user-agent list         — a scanner sets whatever UA it likes
#   kept     script-tag in the query      — cheap, no realistic false positive
#   added    null bytes and control chars — never legitimate in a URI
#   added    encoded path traversal       — defence in depth behind nginx's own
#                                           normalisation
#   added    hidden-file and VCS probes   — /.git, /.env, /.ssh, /.aws …
#   added    foreign-stack probes         — .php/.asp/.jsp, wp-admin, phpmyadmin
#   added    method allow-list            — TRACE/TRACK/CONNECT/DEBUG refused
#
# Status codes are chosen to leak as little as possible: **404** for "this does
# not exist here" (matching the /actuator deny, which REQ-OBS-012's probes
# assert answers 404 and not 403), **405** for a refused method, **400** for a
# malformed request. 403 is kept only where the request is well-formed and the
# intent is unambiguous.
# =============================================================================

# --- Malformed requests ------------------------------------------------------
# A null byte in a URI is never legitimate; it is a truncation trick against
# whatever parses the path downstream.
if ($request_uri ~* "%00") { return 400; }

# Encoded path traversal. nginx already decodes and normalises $uri, so a plain
# `../` cannot escape — this catches the encoded forms before normalisation and
# makes the attempt visible in the log rather than silently rewritten.
if ($request_uri ~* "(\.\.%2f|%2e%2e/|%2e%2e%2f|%252e%252e)") { return 400; }

# --- Method allow-list -------------------------------------------------------
# The apps speak these seven verbs. TRACE and TRACK enable cross-site tracing,
# CONNECT asks the edge to become a tunnel, DEBUG is a Visual Studio relic —
# none of them has a legitimate caller here.
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

# --- Reflected-script attempt in the query string ----------------------------
# The one rule worth keeping from the old include. The apps render through
# Thymeleaf with contextual escaping, so this is defence in depth rather than
# the control — but it costs nothing and has no realistic false positive.
if ($query_string ~* "(<|%3c)\s*script") { return 403; }

# --- Hidden files, VCS and credential material -------------------------------
# `^~` on the ACME location in acme-challenge.conf already outranks this regex,
# and the negative lookahead makes that independent of include order.
location ~ ^/\.(?!well-known/) {
  access_log off;
  return 404;
}

# --- Foreign-stack probes ----------------------------------------------------
# The Basetool serves Thymeleaf and a JSON API. It has no PHP, no ASP, no CGI,
# no WordPress and no phpMyAdmin, so every one of these is a scanner and every
# one of them can be answered without reaching an upstream.
location ~* \.(php|phps|phtml|asp|aspx|jsp|jspx|cgi|pl|bak|old|orig|save|swp|sql|sqlite3?|db|ini|log)$ {
  access_log off;
  return 404;
}

location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|cgi-bin|vendor/|server-status|server-info)(/|$) {
  access_log off;
  return 404;
}
