if ($request_uri ~* "%00") { return 400; }

if ($request_uri ~* "(\.\.%2f|%2e%2e/|%2e%2e%2f|%252e%252e)") { return 400; }

if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

if ($query_string ~* "(<|%3c)\s*script") { return 403; }

location ~ ^/\.(?!well-known/) {
  access_log off;
  return 404;
}

location ~* \.(php|phps|phtml|asp|aspx|jsp|jspx|cgi|pl|bak|old|orig|save|swp|sql|sqlite3?|db|ini|log)$ {
  access_log off;
  return 404;
}

location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|cgi-bin|vendor/|server-status|server-info)(/|$) {
  access_log off;
  return 404;
}
