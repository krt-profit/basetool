# --- Edge rate limiting (REQ-SEC-023) ----------------------------------------
# Per-IP safety net on every vhost: 20 r/s sustained with burst 80 (nodelay
# serves the burst immediately and rejects only the excess) and at most 500
# concurrent connections per client IP. The zones live in conf.d/00-maps.conf.
#
# Both rejection statuses MUST stay 429: the nginx default (503) would be caught
# by the `error_page 502 503 504` maintenance intercept in maintenance.conf, and
# a flooding client would receive the maintenance page with Retry-After
# semantics that are wrong for rate limiting.
#
# The key is the REAL client IP (00-maps.conf: $krt_limit_key — the full IPv4
# address, or the client's IPv6 /64 network prefix, ADR-0112). The edge learns
# that address from the host haproxy's PROXY-protocol header (ADR-0187):
# haproxy terminates :80/:443 on the host, the edge publishes on loopback only,
# and the set_real_ip_from lines render-and-run.sh writes into 00-realip.conf
# trust exactly the edge's pinned addresses (EDGE_TRUSTED_PROXY), so
# $remote_addr is the client again.
#
# That trust list is what this limiter stands on. If EDGE_TRUSTED_PROXY misses
# the peer address, nginx silently discards the header and falls back to the
# TCP peer — every request then shares ONE bucket, the shape of the 2026-07-20
# outage (then caused by a userland proxy relaying all IPv6 clients through one
# bridge gateway). check-conformance.py's `client-address-visible` detects it.
#
# There is ONE public :443 ingress and TLS terminates here, with the vhost
# selected by SNI only after the connection is accepted — so every vhost keys on
# the real client IP. Container-bridge addresses in the access logs are internal
# hairpin traffic (blackbox probes, the apps' own OIDC hairpins, ADR-0196), not
# masked external clients.
limit_req            zone=krt_req_perip burst=80 nodelay;
limit_req_status     429;
limit_req_log_level  warn;
limit_conn           krt_conn_perip 500;
limit_conn_status    429;
