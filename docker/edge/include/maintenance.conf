# =============================================================================
# Maintenance page wiring
#
# Trigger: any upstream returning 502 / 503 / 504. During a deploy
# (scripts/deploy.sh -> docker compose up -d --wait) the backend and frontend
# containers cycle out and the upstream momentarily fails with 502. Instead of
# the raw nginx error page the user gets the branded maintenance page, or
# RFC 7807 JSON for an AJAX caller, until the new containers pass their
# healthcheck and `--wait` returns.
#
# `=503` forces the response status to 503 regardless of which of 502/503/504
# came back — the status that correctly pairs with Retry-After.
# =============================================================================

error_page 502 503 504 =503 @maintenance;

location @maintenance {
    internal;

    root /usr/share/nginx/html;
    rewrite ^.*$ $maintenance_target break;

    # Override the mime type for .json so the AJAX variant is served as
    # RFC 7807 application/problem+json rather than plain application/json.
    types {
        application/problem+json json;
        text/html                html;
    }

    add_header Retry-After   "60"       always;
    add_header Cache-Control "no-store" always;
}
