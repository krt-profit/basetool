# =============================================================================
# Maintenance page wiring
#
# Trigger: any upstream returning 502 / 503 / 504. During a deploy
# (scripts/deploy.sh restarts the changed services' Quadlet units, and each
# restart recreates the container) or the nightly backup's writer quiesce, the
# backend and frontend are briefly gone and the upstream fails with 502. Instead
# of the raw nginx error page the user gets the branded maintenance page, or
# RFC 7807 JSON for an AJAX caller, until the new containers pass their
# healthcheck (`Notify=healthy`) and the unit reports started.
#
# The static files are docker/maintenance/static/, mounted into the edge
# container at /usr/share/nginx/html/maintenance ($maintenance_target in
# conf.d/00-maps.conf picks the HTML or JSON variant).
#
# `=503` forces the response status to 503 regardless of which of 502/503/504
# came back — the status that correctly pairs with Retry-After.
# =============================================================================

error_page 502 503 504 =503 @maintenance;

location @maintenance {
    internal;

    root /usr/share/nginx/html;
    rewrite ^.*$ $maintenance_target break;

    # Override the mime type for .json so the AJAX variant is served as
    # RFC 7807 application/problem+json rather than plain application/json.
    types {
        application/problem+json json;
        text/html                html;
    }

    add_header Retry-After   "60"       always;
    add_header Cache-Control "no-store" always;
}
