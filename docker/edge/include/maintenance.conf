error_page 502 503 504 =503 @maintenance;

# The maintenance page's fonts come from disk, so they load while the applications are down.
location ^~ /maintenance/fonts/ {
    root    /usr/share/nginx/html;
    expires 30d;
}

location @maintenance {
    internal;

    root /usr/share/nginx/html;
    rewrite ^.*$ $maintenance_target break;

    types {
        application/problem+json json;
        text/html                html;
    }

    add_header Retry-After            "60"       always;
    add_header Cache-Control          "no-store" always;
    add_header X-Basetool-Maintenance "1"        always;
}
