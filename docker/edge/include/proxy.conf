# Upstream request shaping, APPENDING form. Carried from NPM's proxy.conf.
#
# The shared half lives in proxy-common.conf; this file is that plus the two
# client-address headers in their appending form, which is what a location at the
# end of a trusted proxy chain wants.
#
# A location that must OVERWRITE the client address instead (REQ-SEC-011: the
# Keycloak upstream and the API vhost) includes proxy-common.conf directly and
# sets its own. It must NOT include this file first and then override: two
# `proxy_set_header` directives for one header name at one level both send, and
# the appending one is emitted first — see proxy-common.conf for the measurement.
include /etc/nginx/edge/include/proxy-common.conf;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;
