# Upstream request shaping. Carried from NPM's proxy.conf.
#
# `Host $host` is load-bearing and not cosmetic: the upstreams are nginx and
# Keycloak speaking HTTPS, and they compare the TLS SNI against the request
# authority. Forwarding the upstream's own address as the Host — which is what a
# proxy that builds the header from the target URL does — makes them answer
# 421 Misdirected Request. That is the failure a sibling migration hit on all
# four of its hosts (ADR-0162); nginx does the right thing here and must keep
# doing it.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $http_connection;
