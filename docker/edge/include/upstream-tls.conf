# Upstream TLS verification, in ONE place.
#
# nginx's default is `proxy_ssl_verify off`, so a vhost that misses or mistypes this block proxies
# to an unverified upstream with no error, no `nginx -t` failure and no log line. It was copied
# across four vhosts; upstream-keycloak.conf's own header names that shape as the hazard it was
# written to end ("Three copies of a rule that must stay identical is how one of them quietly stops
# matching the others") while leaving three copies of this rule standing.
#
# The caller still sets `proxy_ssl_name` itself, because that is the part that genuinely differs.
# Grafana deliberately does NOT include this: it presents its own self-signed `CN=grafana`,
# regenerated whenever the container is recreated, so verifying it would mean pinning a leaf.
proxy_ssl_verify              on;
proxy_ssl_verify_depth        2;
proxy_ssl_trusted_certificate /etc/nginx/upstream-ca.crt;
proxy_ssl_server_name         on;
