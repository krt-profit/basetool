# Upstream request shaping WITHOUT the client-address headers. Carried from NPM's proxy.conf.
#
# Split out of proxy.conf so that a location wanting the OVERWRITING form of
# `X-Forwarded-For` can take the shared shaping without also taking the appending
# form. `proxy_set_header` does not replace an earlier directive for the same
# header name at the same configuration level — both land in the header list and
# BOTH ARE SENT. nginx's "inherit only when the level defines none" rule governs
# inheritance BETWEEN levels and says nothing about this, which is why the shape
#
#     include proxy.conf;                              # appends
#     proxy_set_header X-Forwarded-For $remote_addr;   # meant to overwrite
#
# reads as an override and is not one. Measured against nginx 1.29 with an echo
# upstream: a request carrying `X-Forwarded-For: 8.8.8.8` arrives as
# `8.8.8.8, <edge>, <edge>` — the spoofed value still first, and first is what
# Keycloak's Vert.x ForwardedParser (`getHeader`) and a right-to-left chain walk
# that trusts the edge both resolve to.
#
# `Host $host` is load-bearing and not cosmetic: the upstreams are nginx and
# Keycloak speaking HTTPS, and they compare the TLS SNI against the request
# authority. Forwarding the upstream's own address as the Host — which is what a
# proxy that builds the header from the target URL does — makes them answer
# 421 Misdirected Request. That is the failure a sibling migration hit on all
# four of its hosts (ADR-0162); nginx does the right thing here and must keep
# doing it.
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $http_connection;
