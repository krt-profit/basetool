# ACME HTTP-01 challenge surface.
#
# The webroot is written by the SEPARATE acme container (ADR-0162) and mounted
# here READ-ONLY. The edge serves the token and nothing else: it holds no
# account key, no DNS credential, and runs no renewal hook. That is the whole
# point of the split — it removes the class that NPM's CVE-2026-40519 lives in,
# which interpolated stored DNS-provider credentials into a shell command.
location ^~ /.well-known/acme-challenge/ {
  default_type "text/plain";
  root /var/www/acme;
}

location = /.well-known/acme-challenge/ {
  return 404;
}
