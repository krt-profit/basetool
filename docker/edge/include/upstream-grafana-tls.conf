# Upstream TLS verification for Grafana (REQ-OBS-008), included by 40-grafana.conf.template ONLY
# when EDGE_GRAFANA_UPSTREAM_VERIFY=on (render-and-run.sh decides; it refuses to start with the
# switch on and the certificate missing).
#
# Why not upstream-tls.conf: Grafana does not present a leaf of the internal CA but its own
# self-signed certificate (CN=grafana, SAN DNS:grafana plus the public name), minted per host into
# /var/iri/monitoring/certs/grafana.crt (monitoring/README.md, step 3). Its trust anchor is
# therefore that certificate itself, and it must stay a SEPARATE anchor: `openssl req -x509` marks
# the certificate CA:TRUE, so adding it to upstream-ca.crt would let Grafana's key vouch for a
# backend or Keycloak certificate at every other upstream.
#
# The edge mounts the same file Grafana serves, read-only, at /etc/nginx/grafana-upstream.crt. A
# re-minted Grafana certificate therefore needs an edge restart as well as a Grafana one.
proxy_ssl_verify              on;
proxy_ssl_verify_depth        1;
proxy_ssl_trusted_certificate /etc/nginx/grafana-upstream.crt;
proxy_ssl_server_name         on;
proxy_ssl_name                grafana;
