map $scheme $hsts_header {
  default "";
  https   "max-age=63072000;includeSubDomains; preload";
}

map $http_accept $maintenance_target {
    default                                /maintenance/maintenance.html;
    "~*application/(problem\+)?json"       /maintenance/maintenance.json;
}

# Request target and referrer without query string and fragment, for the access log format.
map $request_uri $krt_log_path {
    default        "";
    "~^([^?#]*)"   $1;
}

map $http_referer $krt_log_referer {
    default        "-";
    ""             "-";
    "~^([^?#]*)"   $1;
}

map $remote_addr $krt_limit_key {
    default                                                  $remote_addr;
    "~*^(?<v6net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"  "$v6net::";
}
limit_req_zone  $krt_limit_key zone=krt_req_perip:10m rate=50r/s;
limit_req_zone  $krt_limit_key zone=krt_static_perip:10m rate=200r/s;
limit_req_zone  $krt_limit_key zone=krt_token_perip:10m rate=20r/s;
limit_conn_zone $krt_limit_key zone=krt_conn_perip:10m;
