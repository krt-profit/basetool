modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  https_internal:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 302, 303, 401, 403]
      method: GET
      follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        ca_file: /etc/blackbox/certs/basetool-ca.crt

  https_internal_insecure:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 302, 303, 401, 403]
      method: GET
      follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: true

  http_2xx_or_401:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 401]
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_2xx_ipv6:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip6"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_2xx_or_401_ipv6:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 401]
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip6"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  dns_apex_a:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      query_name: "profit-base.online"
      query_type: "A"
      valid_rcodes: ["NOERROR"]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - "\\s+\\d+\\s+IN\\s+A\\s+\\d+\\.\\d+\\.\\d+\\.\\d+$"

  dns_apex_aaaa:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      query_name: "profit-base.online"
      query_type: "AAAA"
      valid_rcodes: ["NOERROR"]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - "\\s+\\d+\\s+IN\\s+AAAA\\s+[0-9a-fA-F:.]+$"

  dns_api_a:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      query_name: "api.profit-base.online"
      query_type: "A"
      valid_rcodes: ["NOERROR"]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - "\\s+\\d+\\s+IN\\s+A\\s+\\d+\\.\\d+\\.\\d+\\.\\d+$"

  dns_api_aaaa:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      query_name: "api.profit-base.online"
      query_type: "AAAA"
      valid_rcodes: ["NOERROR"]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - "\\s+\\d+\\s+IN\\s+AAAA\\s+[0-9a-fA-F:.]+$"

  http_deny_404:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [404]
      method: GET
      follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_members_only_redirect:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [302]
      method: GET
      follow_redirects: false
      headers:
        Accept: "text/html,application/xhtml+xml"
        Sec-Fetch-Mode: "navigate"
        X-Basetool-Probe: "members-only"
      fail_if_header_not_matches:
        - header: Location
          regexp: "/oauth2/authorization/keycloak"
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_force_ssl_redirect:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [301, 308]
      method: GET
      follow_redirects: false
      fail_if_header_not_matches:
        - header: Location
          regexp: "^https://"
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false

  http_2xx_hsts:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302, 303, 307, 308]
      method: GET
      follow_redirects: false
      fail_if_header_not_matches:
        - header: Strict-Transport-Security
          regexp: "max-age=\\d+"
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_2xx_or_401_hsts:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302, 303, 307, 308, 401]
      method: GET
      follow_redirects: false
      fail_if_header_not_matches:
        - header: Strict-Transport-Security
          regexp: "max-age=\\d+"
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_public_200_no_redirect:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: false
      headers:
        X-Basetool-Probe: "public-surface"
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  http_app_link_fallback_303:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [303]
      method: GET
      follow_redirects: false
      headers:
        X-Basetool-Probe: "app-link-fallback"
      fail_if_header_not_matches:
        - header: Location
          regexp: '^(https://profit-base\.online)?/app/link-help$'
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false
