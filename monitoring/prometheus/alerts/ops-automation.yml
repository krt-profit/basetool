# Ops-automation alerts driven by node_exporter textfile metrics written by deploy.sh, backup.sh,
# restore-drill.sh and docker-cleanup.sh (ADR-0072). The textfiles carry richer per-outcome detail
# (per-outcome timestamps, durations, reclaimed bytes, per-artifact restore results) than the
# systemd collector's unit-level success, and let alerts distinguish "failed" / "stale" / "never
# ran" via absent()-guards. Textfile names are defined by the scripts.
#
# WHERE THE SCRIPT OUTPUT ACTUALLY LIVES — read this before triaging anything here. Do NOT reach for
# `journalctl -u iri-<job>.service`: all four units set `StandardOutput=append:/var/log/iri-<job>.log`
# AND `StandardError=append:...`, and `append:` REPLACES journald for those streams rather than
# teeing to it. journald therefore keeps only systemd's own unit records (Starting / Succeeded /
# Failed / the exit code) and not one line any of the scripts printed. Alloy tails the four files
# into Loki (config.alloy), so the reasoning behind every alert below is queryable in
# Grafana -> Explore -> Loki:
#   deploy          {app="ops-deploy"}
#   backup          {app="ops-backup"}
#   docker-cleanup  {app="ops-cleanup"}
#   restore drill   {app="ops-restore-drill"}
# Each description carries the query it needs, because that is what reaches the responder's mailbox
# at 03:40. LogStreamSilent{stream="ops-deploy"} (meta.yml) guards the deploy tail, so a dead tailer
# cannot make this reasoning silently unavailable again.
groups:
  - name: ops-automation-critical
    rules:
      # A rollback or a failure that is newer than the last success = a promoted release did not ship.
      # The `or (… unless …)` arm (#1041 item 21) guards the fresh-host / wiped-textfile-dir case: with
      # no last_success series the bare `>` comparison matches nothing, so a failing FIRST deploy would
      # alert nothing — `X unless last_success` fires when X exists and last_success does not. Mirrors
      # the absent()-guards on the backup/restore rules below.
      - alert: DeployRolledBack
        expr: >-
          basetool_deploy_last_rollback_timestamp > basetool_deploy_last_success_timestamp
          or (basetool_deploy_last_rollback_timestamp unless basetool_deploy_last_success_timestamp)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Deploy rolled back (health gate reverted a promoted release)"
          description: "The last deploy outcome was a rollback newer than the last successful deploy (or a rollback with no successful deploy on record) — the health gate reverted a promoted release. Read WHY in Grafana -> Explore -> Loki over the last 6h: `{app=\"ops-deploy\"} |~ \"rolling back|SECURITY: cosign|health check failed|FATAL\"`, then widen to the bare `{app=\"ops-deploy\"}` for the surrounding run. That line is what separates a health-gate timeout from a cosign signature rejection, a missing previous digest pin, or a rollback that itself failed. `journalctl -u iri-deploy.service` shows NONE of this — the unit appends stdout/stderr to /var/log/iri-deploy.log instead of journald."

      - alert: DeployFailed
        expr: >-
          basetool_deploy_last_failure_timestamp > basetool_deploy_last_success_timestamp
          or (basetool_deploy_last_failure_timestamp unless basetool_deploy_last_success_timestamp)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Deploy failed (newer than last success)"
          description: "The last deploy attempt failed and is newer than the last successful deploy (or failed with no successful deploy on record — a failing first install). deploy.sh writes its abort reason as a `FATAL:` line: `{app=\"ops-deploy\"} |~ \"FATAL\"` in Grafana -> Explore -> Loki, then the bare `{app=\"ops-deploy\"}` for the run around it. Not visible via `journalctl -u iri-deploy.service` (stdout/stderr are appended to /var/log/iri-deploy.log, not journald)."

      # A container is running the CURRENT target image but is unhealthy, and
      # deploy.sh's targeted restart could not bring it back — the runtime is
      # broken on the deployed release. This is deliberately NOT a rollback (a
      # wrong-release rollback fires DeployRolledBack above): rolling the stack
      # back to the same image cannot fix a runtime fault, so deploy.sh restarts
      # only the affected service and, when that will not stick, raises THIS
      # signal instead of a false DeployRolledBack (ADR-0083, the 2026-07-09
      # native-thread exhaustion incident). The heartbeat comparison self-clears
      # the moment a tick observes the stack healthy again; the `unless` arm
      # covers a first failure before any healthy tick was recorded. `for: 15m`
      # rides out deploy.sh's own restart backoff so a single blip does not page.
      - alert: DeployHealthRestartFailing
        expr: >-
          basetool_deploy_last_health_restart_failed_timestamp > basetool_deploy_last_stack_healthy_timestamp
          or (basetool_deploy_last_health_restart_failed_timestamp unless basetool_deploy_last_stack_healthy_timestamp)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Deploy-bot cannot restart an unhealthy at-target service"
          description: "A container is running the current target image but is unhealthy, and deploy.sh's targeted restart did not restore it — the runtime is broken on the deployed release (not a rollback). Investigate the app (threads/memory/dependencies) via the container + JVM dashboards. `{app=\"ops-deploy\"} |~ \"health drift\"` in Grafana -> Explore -> Loki names the affected service(s) and the restart-attempt count; `journalctl -u iri-deploy.service` does not (stdout/stderr are appended to /var/log/iri-deploy.log)."

      - alert: DeployConfigBlocked
        expr: basetool_deploy_config_blocked == 1
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: "Deploy stuck on a gated config change (>6h)"
          description: "A postgres/Keycloak image change is operator-gated (config-blocked.marker) and has not been cleared for 6 hours — deploys are silently stuck. `{app=\"ops-deploy\"} |~ \"CARVE-OUT\"` in Grafana -> Explore -> Loki shows which image pin tripped the gate; `journalctl -u iri-deploy.service` does not (stdout/stderr are appended to /var/log/iri-deploy.log)."

      - alert: BackupStaleOrMissing
        expr: (time() - basetool_backup_last_success_timestamp) > 26 * 3600 or absent(basetool_backup_last_success_timestamp)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup stale >26h or metric absent"
          description: "The nightly backup last succeeded more than 26 hours ago, or the backup metric is absent (never ran). backup.sh writes its abort reason as a `FATAL:` line: `{app=\"ops-backup\"} |~ \"FATAL|WARN\"` in Grafana -> Explore -> Loki, then the bare `{app=\"ops-backup\"}` for the run. A completely empty stream over the window means the unit never fired at all — check `systemctl list-timers iri-backup.timer`. Not visible via `journalctl -u iri-backup.service` (stdout/stderr are appended to /var/log/iri-backup.log)."

      - alert: RestoreDrillStaleOrMissing
        expr: (time() - basetool_restore_drill_last_success_timestamp) > 35 * 24 * 3600 or absent(basetool_restore_drill_last_success_timestamp)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Restore drill stale >35d or metric absent"
          description: "The monthly restore drill last succeeded more than 35 days ago, or the metric is absent (never ran). `{app=\"ops-restore-drill\"} |~ \"FATAL|WARN\"` in Grafana -> Explore -> Loki over the last 40d carries the abort reason; an empty stream means the unit never fired — check `systemctl list-timers iri-restore-drill.timer`. Not visible via `journalctl -u iri-restore-drill.service` (stdout/stderr are appended to /var/log/iri-restore-drill.log)."

      - alert: RestoreDrillArtifactNotRestorable
        expr: basetool_restore_drill_artifact_ok == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Restore drill: artifact not restorable ({{ $labels.artifact }})"
          description: "The last restore drill could not restore/verify artifact '{{ $labels.artifact }}' — backups for that artifact are unverified. The per-artifact failure detail is in Grafana -> Explore -> Loki: `{app=\"ops-restore-drill\"} |= \"{{ $labels.artifact }}\"`. Not visible via `journalctl -u iri-restore-drill.service` (stdout/stderr are appended to /var/log/iri-restore-drill.log)."

      - alert: GhcrPullTokenExpired
        expr: basetool_ghcr_token_expiry_timestamp < time()
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GHCR pull token expired — deploys are failing"
          description: "The production GHCR pull token's recorded expiry is in the past; `docker login` fails and no promotion can deploy. Rotate the token (docs/deployment.md → Token rotation) and update its .expiry file. Confirm the actual login failure in Grafana -> Explore -> Loki: `{app=\"ops-deploy\"} |~ \"logging in to|docker login\"` (the GHCR account name in the first of those lines is masked by the shipper — REQ-OBS-004). Not visible via `journalctl -u iri-deploy.service` (stdout/stderr are appended to /var/log/iri-deploy.log)."

  - name: ops-automation-warning
    rules:
      # Opt-in: fires ONLY when an expiry has been recorded (the .expiry sidecar
      # exists) and is <14d away. A token with no expiry (a classic PAT kept
      # non-expiring by choice) simply has no .expiry file, emits no metric, and
      # is intentionally NOT alerted on — deploy.sh's write_token_expiry_metric is
      # a no-op then. (Do not re-add an `absent()` guard: it would false-warn
      # forever on every host that runs a non-expiring token.)
      - alert: GhcrPullTokenExpiring
        expr: (basetool_ghcr_token_expiry_timestamp - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "GHCR pull token expiring <14d"
          description: "The production GHCR pull token's recorded expiry is under 14 days away — rotate it and update its .expiry file (docs/deployment.md → Token rotation). A lapsed token silently stops all deploys. If the expiry itself looks wrong, deploy.sh logs an unparseable sidecar as a WARN: `{app=\"ops-deploy\"} |~ \"expiry\"` in Grafana -> Explore -> Loki."

      - alert: DockerCleanupStaleOrMissing
        expr: (time() - basetool_docker_cleanup_last_success_timestamp) > 8 * 24 * 3600 or absent(basetool_docker_cleanup_last_success_timestamp)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "docker-cleanup stale >8d or metric absent"
          description: "The weekly docker-cleanup last succeeded more than 8 days ago, or its metric is absent — an early disk-fill indicator. `{app=\"ops-cleanup\"}` in Grafana -> Explore -> Loki over the last 10d shows the last run and what it reclaimed; an empty stream means the timer never fired (`systemctl list-timers iri-docker-cleanup.timer`) or the optional job was never installed on this host. Not visible via `journalctl -u iri-docker-cleanup.service` (stdout/stderr are appended to /var/log/iri-docker-cleanup.log)."
