groups:
  - name: business-critical
    rules:
      - alert: BankLedgerIntegrityViolation
        expr: basetool_bank_ledger_integrity_violations > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Bank ledger integrity violation: {{ $labels.category }}"
          description: "The hourly integrity sweep found {{ $value }} rows in category '{{ $labels.category }}'. A bank ledger invariant is broken — investigate before any further bank mutation."

      - alert: UserCallsignCollision
        expr: increase(basetool_user_callsign_collisions_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Callsign collision at login: {{ $value }} in the last hour"
          description: "A login presented an unknown subject while another account holds the same callsign, so a NEW pending registration was created and nothing was inherited. Check the admin registration queue: the affected row carries the duplicate-callsign marker, and the remedy is an explicit merge, never an approval that leaves two accounts for one member. The backend log names both account ids (never the callsign itself)."

      - alert: UserSyncPerUserFailure
        expr: increase(basetool_user_sync_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "User sync could not reconcile {{ $value }} account(s) in the last hour"
          description: "One or more users threw during the Keycloak->local reconciliation and were skipped. They keep the roles their local row last carried until a later run succeeds, and any Keycloak-side change to them has not landed. The backend log names the account id and the cause (never a handle); a repeating id is a permanent failure, not a hiccup. A duplicate Discord identity is the known cause -- check UserDiscordLinkCollision alongside this."

      - alert: UserDiscordLinkCollision
        expr: increase(basetool_user_discord_link_collisions_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Discord identity held by two accounts: {{ $value }} skipped link write(s) in the last hour"
          description: "One Discord identity is reachable from two app_user rows, so the link could not be written to the second. One member has two accounts -- consolidate them from the member administration (the duplicate folds into the survivor, belongings and Discord identity move, the duplicate is removed). The alert repeats every run until then. The backend log names both account ids, never the snowflake."

      - alert: JobOrderItemBlueprintDrift
        expr: basetool_job_order_integrity_violations > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Item-order line blueprint drift: {{ $value }} line(s)"
          description: "The integrity sweep found {{ $value }} ordered-item line(s) whose blueprint no longer produces the ordered item — an SC-Wiki re-sync re-pointed the blueprint after the order was placed. Those orders display a foreign recipe's materials. The backend log names each order; re-saving an affected order re-derives its lines."

  - name: business-warning
    rules:
      - alert: UserSyncStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="user_sync"} > 0)) > 93600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="user_sync"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="user_sync"} == 1))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "User sync stale >26h"
          description: "The Keycloak user sync last succeeded more than 26 hours ago (daily 05:00 cadence, so the last run was missed) — local roles/accounts may drift from Keycloak. Trigger 'Sync now' on the member-management page or check the scheduler/Keycloak."

      - alert: ExternalSyncStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task=~"uex_sync|scwiki_sync"} > 0)) > 172800 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="uex_sync"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 172800 and on() (basetool_scheduled_job_enabled{task="uex_sync"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="scwiki_sync"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 172800 and on() (basetool_scheduled_job_enabled{task="scwiki_sync"} == 1))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "External sync stale >48h ({{ $labels.task }})"
          description: "The {{ $labels.task }} catalogue sync last succeeded more than 48 hours ago."

      - alert: ExternalFetchErrors
        expr: sum by (source) (increase(basetool_external_fetch_errors_total[6h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "External fetch errors ({{ $labels.source }})"
          description: "The {{ $labels.source }} client swallowed more than 3 fetch/parse errors in 6 hours — the catalogue sync may be silently importing nothing while still recording a success. Check the upstream API and the sync logs."

      - alert: KeycloakSyncFetchFailing
        expr: sum(increase(basetool_keycloak_sync_fetch_failures_total[6h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak user-sync roster fetch failing"
          description: "The Keycloak Admin-API roster fetch threw and was swallowed into an empty roster in the last 6h — the user sync is recording success with zero users while local roles drift from Keycloak (departed users keep access). Check Keycloak reachability and the backend sync logs."

      - alert: SyncZeroItems
        expr: |
          increase(basetool_scheduled_job_items_total{task=~"uex_sync|scwiki_sync"}[48h]) == 0
          and on (task)
          increase(basetool_scheduled_job_executions_total{task=~"uex_sync|scwiki_sync",outcome="success"}[48h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Catalogue sync importing zero items ({{ $labels.task }})"
          description: "The {{ $labels.task }} sync has recorded successful runs in 48h but processed zero items — the upstream catalogue is likely returning empty responses. Check the upstream API and the sync-report admin page."

      - alert: ScWikiStepFailing
        expr: sum by (step) (increase(basetool_scheduled_job_step_failures_total{task="scwiki_sync"}[48h])) > 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SC-Wiki sync step failing ({{ $labels.step }})"
          description: "The {{ $labels.step }} step of the daily SC-Wiki sync has failed on at least two runs in 48h while the umbrella job keeps recording success — that catalogue slice is silently importing nothing. Check the SC-Wiki upstream and the backend sync logs."

      - alert: ScWikiCensusIncompleteStreak
        expr: |
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h])) > 0
          and on ()
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h] offset 24h)) > 0
          and on ()
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h] offset 48h)) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SC-Wiki page walk incomplete on three consecutive days"
          description: "Every one of the last three daily SC-Wiki syncs recorded a fetch/census error, so at least one page walk was flagged INCOMPLETE. This does NOT by itself mean the scwiki_deleted sweep stood down: since ADR-0195 a complete residual /api/items census vouches for the kind passes it contains, so an incomplete kind walk can fire this alert while the sweep still runs — ScWikiOrphanSweepStandingDown is the alert that means orphan detection actually stopped. KNOWN STANDING CAUSE: /api/vehicle-items orders on a non-unique key, so rows tie across a page boundary and that walk is incomplete on every single run, with no client-side fix available (sort= is not applied to the paginated query, page[size] is capped at 200, and unioning walks at two page sizes still falls short — all re-measured 2026-09-22, see ADR-0195). Until upstream gives its paginator a unique tiebreaker this alert has a permanent floor; treat a change in WHICH endpoint fails as the signal. Grep the backend log for 'INCOMPLETE' to see which walk it was: a genuinely broken upstream also trips ExternalFetchErrors, whereas this alert alone points at a pagination-contract drift (rows repeating across pages, the distinct rows falling short of meta.total, meta.last_page renamed, or the announced page count growing mid-walk). A SURPLUS over meta.total is deliberately not a census failure (ADR-0147), so it is never what is firing this."

      - alert: ScWikiOrphanSweepStandingDown
        expr: sum(increase(basetool_catalogue_orphan_sweep_skipped_total{reason="incomplete"}[72h])) >= 3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SC-Wiki orphan sweep has stood down on three incomplete runs in 72h"
          description: "The cross-kind scwiki_deleted sweep refused to run on at least three syncs in 72h because the census could not be vouched for. The refusal is correct — sweeping a half-walked feed would soft-delete every row that was merely never fetched — but rows the Wiki has actually dropped are not being tombstoned while the sync keeps reporting success. Since ADR-0195 an incomplete KIND pass alone no longer causes this: it fires only when the residual /api/items pass could not vouch for its own census, or when a kind pass was served a row that residual census does not contain (logged as 'the kind endpoints are not a subset of the item pool after all'). Both are new upstream shapes rather than the long-standing /api/vehicle-items tie — so unlike ScWikiCensusIncompleteStreak, this one firing is always worth reading. Grep the backend log for 'Skipping cross-kind orphan sweep (reason=incomplete' and the census WARNs above it. reason=not_modified is a healthy fully-cached run and is deliberately not matched here."

      - alert: ScheduledJobStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task=~"notification_retention|default_blueprint_provisioning|rejected_registration_retention|audit_retention|exchange_change_retention|exchange_connection_retention"} > 0)) > 93600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="notification_retention"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="notification_retention"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="default_blueprint_provisioning"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="default_blueprint_provisioning"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="rejected_registration_retention"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="rejected_registration_retention"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="audit_retention"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="audit_retention"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="exchange_change_retention"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="exchange_change_retention"} == 1)) or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="exchange_connection_retention"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 93600 and on() (basetool_scheduled_job_enabled{task="exchange_connection_retention"} == 1))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job stale >26h ({{ $labels.task }})"
          description: "The {{ $labels.task }} job last succeeded more than 26 hours ago — it may have stopped being scheduled."

      - alert: BankLedgerIntegritySweepStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="bank_ledger_integrity"} > 0)) > 21600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="bank_ledger_integrity"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 21600 and on() (basetool_scheduled_job_enabled{task="bank_ledger_integrity"} == 1))
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Bank ledger-integrity sweep stale >6h"
          description: "The hourly bank ledger-integrity sweep last succeeded more than 6 hours ago. While it is stale the violations gauge is frozen and BankLedgerIntegrityViolation cannot fire — the data-corruption detector is blind. Restore the sweep before trusting a 'no violations' reading."

      - alert: JobOrderIntegritySweepStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="job_order_integrity"} > 0)) > 21600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="job_order_integrity"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 21600 and on() (basetool_scheduled_job_enabled{task="job_order_integrity"} == 1))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Job-order integrity sweep stale >6h"
          description: "The hourly job-order integrity sweep last succeeded more than 6 hours ago. While it is stale the violations gauge is frozen and JobOrderItemBlueprintDrift cannot fire — a blueprint re-point would go undetected. Restore the sweep before trusting a 'no drift' reading."

      - alert: ExchangeRegistryChanged
        expr: sum by (action) (increase(basetool_exchange_registry_changes_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Exchange client registry changed ({{ $labels.action }})"
          description: "An admin changed the third-party exchange registry or its global switch ({{ $labels.action }}). Every change is expected to be deliberate: check the „Verbundene Anwendungen“ audit log for who did it and whether it was planned (REQ-XCH-003)."

      - alert: ExchangeMirrorWriteFailed
        expr: sum by (phase) (increase(basetool_exchange_mirror_writes_total{outcome="failed"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exchange registry mirror write failed ({{ $labels.phase }})"
          description: "The backend could not write the exchange registry mirror to Redis ({{ $labels.phase }}). A failed pre_commit write refused an admin's restriction; switched_off means a start with APP_EXCHANGE_MIRROR_ENABLED=false could not switch off a registry document left in Redis, so the gateway may still admit clients on it until the next successful start; any other phase leaves the mirror behind the database until the 60-second reconcile succeeds. Check Redis and the basetool-backend ACL user's ~exchange:* grant (REQ-XCH-003)."

      - alert: ExchangeBudgetHigh
        expr: max(basetool_ingest_exchange_budget_used_ratio) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The exchange's Redis budget is more than 80 % used"
          description: "The exchange data the ingest gateway keeps in Redis (the idempotency cache) uses more than 80 % of its 64 MiB budget. Above 100 % every exchange write is refused with 503 EXCHANGE_BUDGET_EXHAUSTED, while sessions keep their room (REQ-XCH-023, ADR-0221). Check which client writes most (the per-client sets under ingest:xch:budget:c:*) and whether a client loops."

      - alert: ExchangeClientBudgetHigh
        expr: max by (client_id) (basetool_ingest_exchange_client_budget_used_ratio) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Exchange client {{ $labels.client_id }} uses more than 80 % of its Redis budget"
          description: "The exchange data the ingest gateway keeps in Redis for client {{ $labels.client_id }} (cached answers, quota counters, staged drafts) uses more than 80 % of the client's 16 MiB budget. When it is full every write of every member of that client is refused 503 EXCHANGE_BUDGET_EXHAUSTED, long before ExchangeBudgetHigh can fire, because one client's budget is a quarter of the total (REQ-XCH-023). The budget frees only as the cached answers expire, up to 24 hours. Check on the Exchange dashboard whether the client pushes its whole list every sync or keeps re-sending conflicting change sets, and contact its author; members of other clients are not affected."

      - alert: ExchangeRelayFailing
        expr: sum(increase(basetool_ingest_exchange_relay_total{outcome="failed"}[15m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exchange relays to the backend keep failing"
          description: "The ingest gateway relayed admitted exchange requests but the backend answered unusably - 5xx, a refusal outside the exchange error registry, an answer that breaks the v1 schema, or no answer at all (unreachable, circuit open, no gateway token) - and the client got 502 BACKEND_RELAY_FAILED (REQ-XCH-011). Check the backend and its exchange layer and the gateway log lines 'Exchange relay to' or 'Exchange answer breaks'."

      - alert: ExchangeLargeChangeSetsBusy
        expr: sum(increase(basetool_ingest_exchange_refused_total{reason="relay_busy"}[15m])) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The gateway keeps refusing large exchange change sets as busy"
          description: "More than 30 change sets of over 100 ops were refused 503 RELAY_BUSY in 15 minutes, for 15 minutes: the four slots of the exchangeLargeChangeSets bulkhead stay taken (REQ-XCH-023). Typical after a client release or on a launch day, when many members send their first sync at once; the clients retry after 10 s and nothing is lost. Check the backend's CPU and the p99 of POST /exchange/v1/me/stock/changes; only with headroom there raise resilience4j.bulkhead.instances.exchangeLargeChangeSets.max-concurrent-calls in the gateway."

      - alert: ExchangeClientRefusalsSpike
        expr: sum by (client_id) (increase(basetool_ingest_exchange_refused_total{client_id!~"none|unknown|unregistered", reason!~"rate_limited|quota_exceeded|idempotency_in_progress|relay_busy"}[15m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A registered exchange client is refused unusually often"
          description: "The ingest gateway refused more than 30 requests of one registered client (client_id) in 15 minutes for a reason other than its own limits - typically a release below the minimum version, a capability the registry does not grant, revoked keys or broken DPoP proofs after a client update (REQ-XCH-028). Check the per-client panel and the refusal reasons on the operations dashboard, then contact the client's author or suspend it under Administration - Verbundene Anwendungen."

      - alert: ExchangeRegistryUnreadableAtGateway
        expr: sum(increase(basetool_ingest_exchange_refused_total{reason="registry_unavailable"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The ingest gateway cannot read the exchange registry"
          description: "The ingest gateway cannot read the exchange registry mirror or the revocations in Redis and refuses exchange requests with 503 REGISTRY_UNAVAILABLE (fail-closed, REQ-XCH-003). Check that the backend writes exchange:registry (APP_EXCHANGE_MIRROR_ENABLED, ExchangeMirrorWriteFailed), that Redis is up, and that the ingest ACL user still reads ~exchange:*."

      - alert: ExchangeRegistryMirrorStaleAtGateway
        expr: ((basetool_exchange_registry_mirror_age_seconds > 300) or ((basetool_exchange_registry_mirror_age_seconds != basetool_exchange_registry_mirror_age_seconds) and on() (time() - max(process_start_time_seconds{job="basetool-ingest"})) > 300)) and on() (max(basetool_scheduled_job_enabled{task="exchange_registry_reconcile"}) == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The ingest gateway has not read the exchange registry for over 5 minutes"
          description: "The ingest gateway reads the exchange registry mirror every 30 seconds, and its last successful read is more than 5 minutes old - or it has not read it once since it started - while the backend's mirror is enabled. Exchange requests are refused 503 REGISTRY_UNAVAILABLE meanwhile, even when no client happens to call. Check that exchange:registry exists in Redis (ExchangeMirrorWriteFailed, ExchangeRegistryReconcileStale), that Redis is up, and that the ingest ACL user still reads ~exchange:* (REQ-XCH-003, REQ-XCH-028)."

      - alert: ExchangeRegistryReconcileStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="exchange_registry_reconcile"} > 0)) > 600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="exchange_registry_reconcile"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 600 and on() (basetool_scheduled_job_enabled{task="exchange_registry_reconcile"} == 1))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exchange registry reconcile stale >10m"
          description: "The 60-second reconcile of the exchange registry mirror last succeeded more than 10 minutes ago. While it is stale a mirror that fell behind the database is not repaired; the gateway stays fail-closed but may keep refusing a client that was re-activated (REQ-XCH-003)."

      - alert: ExchangeRemoveSpike
        expr: sum by (client_id) (increase(basetool_exchange_removals_total[1h])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An exchange client removed unusually many entries"
          description: "One registered client (client_id) removed more than 100 blueprints, stock lots or ships across its members in the last hour. The mass-change guard stops one member losing much at once, but not a faulty release doing it to many members. Follow the vault runbook \"Suspending an exchange client\": under Administration - Verbundene Anwendungen, undo the client's changes for every member since the faulty release, which suspends it first (REQ-XCH-021, REQ-XCH-028, REQ-XCH-034)."

      - alert: ExchangeGuardStorm
        expr: sum by (client_id) (increase(basetool_exchange_writes_total{outcome="held"}[1h])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The mass-change guard keeps holding one client's batches"
          description: "The mass-change guard held back more than 10 change sets of one registered client (client_id) in the last hour. Members will see many confirmation links; a client that deletes by mistake, or a release that sends removals where it should not, looks like this. Check the client's recent writes and consider suspending it (vault runbook \"Suspending an exchange client\", REQ-XCH-021)."

      - alert: ExchangeInstallationSurge
        expr: sum by (client_id) (increase(basetool_exchange_installations_created_total[1h])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many new installations of one exchange client"
          description: "More than 20 new installations of one registered client (client_id) connected in the last hour. A release day can explain it; a device-code phishing wave or a leaked client cannot. Check the new-connection notifications and the installations on the admin page, and suspend the client if the connections are not expected (REQ-XCH-007, REQ-XCH-028)."

      - alert: ExchangeBulkUndoFailed
        expr: sum(increase(basetool_scheduled_job_executions_total{task="exchange_bulk_undo",outcome="failure"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "An admin's bulk undo of an exchange client failed"
          description: "A bulk undo under Administration - Verbundene Anwendungen ended FAILED: at least one member could not be processed, the run broke off, or the queue of ten runs was full and refused it (the client then stays suspended). The members it did process are undone; the others still carry the client's changes. Open the run's details on the admin page for the members marked as failed, check the backend log for the run id, and start the undo again once the cause is fixed - it only touches what is not undone yet (REQ-XCH-034)."

      - alert: ExchangeUnknownClient
        expr: sum(increase(basetool_ingest_exchange_refused_total{client_id="unregistered"}[15m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Exchange tokens of a client outside the registry"
          description: "The ingest gateway refused more than 10 exchange requests in 15 minutes that carried a valid token of a Keycloak client the registry does not list. Either a client was provisioned in Keycloak but not registered yet, or a client id is being used that should not be. Register the client deliberately or remove it from Keycloak (REQ-XCH-003, REQ-XCH-028)."

      - alert: BusinessMetricsStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="business_metrics"} > 0)) > 600 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="business_metrics"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 600 and on() (basetool_scheduled_job_enabled{task="business_metrics"} == 1))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business-metrics sampler stale >10min"
          description: "BusinessMetricsCollector.refresh() has not completed successfully in over 10 minutes — the approval/work-queue depth gauges are frozen and the queue-overdue alerts may be evaluating stale values. Check the backend logs for the sampler's failure."

      - alert: NotificationTimedStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="notification_timed"} > 0)) > 900 or (absent(basetool_scheduled_job_last_success_timestamp_seconds{task="notification_timed"}) and on() (time() - max(process_start_time_seconds{job="basetool-backend"})) > 900 and on() (basetool_scheduled_job_enabled{task="notification_timed"} == 1))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Time-based notices stale >15min"
          description: "The one-minute producer of the time-based notices (mission reminders, refinery orders ready, missions never ended) has not completed successfully in over 15 minutes. Members are not told about what is due. Check the backend logs for the producer that failed, and whether another instance holds the advisory lock."

      - alert: NotificationExecutorRejected
        expr: sum(increase(basetool_notification_executor_rejected_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Notification callbacks rejected (notices lost)"
          description: "The notification executor refused {{ $value }} after-commit callback(s) in the last 10 minutes even after waiting for room, so those notices were never created and nothing retries them (REQ-NOTIF-029). Check the backend logs for 'rejected a task' and the database for a stall that keeps the four notification threads busy."

      - alert: NotificationCreationFlood
        expr: sum(increase(basetool_notification_created_total[15m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 2000 notices created in 15 min"
          description: "{{ $value }} inbox rows were written in the last 15 minutes, far above the normal rate. Look at sum by (notification_type)(increase(basetool_notification_created_total[15m])) for the type and at basetool_notification_timed_produced_total for a timed producer that is flooding (REQ-NOTIF-029)."

      - alert: UserSyncZeroItems
        expr: |
          increase(basetool_scheduled_job_items_total{task="user_sync"}[26h]) == 0
          and on (task)
          increase(basetool_scheduled_job_executions_total{task="user_sync",outcome="success"}[26h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "User sync succeeding but syncing zero users"
          description: "The Keycloak user sync has run successfully but processed zero users over the last day — Keycloak likely returned an empty roster. Check Keycloak and the sync path before local accounts drift from the directory."

      - alert: ScheduledJobFailureStreak
        expr: increase(basetool_scheduled_job_executions_total{outcome="failure"}[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job failing repeatedly ({{ $labels.task }})"
          description: "Job '{{ $labels.task }}' recorded {{ $value }} failed runs in the last hour."

      - alert: OptimisticLockConflictSpike
        expr: rate(basetool_http_error_total{code="OPTIMISTIC_LOCK"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "409 optimistic-lock conflict spike"
          description: "The backend is returning 409 optimistic-lock conflicts at an elevated rate — a likely locking/version-propagation regression."

      - alert: IdentityProviderUnavailable
        expr: >-
          (
            sum by (application) (rate(basetool_http_error_total{code="SERVICE_UNAVAILABLE"}[5m]))
            - (
              sum by (application) (rate(basetool_ingest_auth_failures_total{reason="dpop_store_full"}[5m]))
              or
              sum by (application) (rate(basetool_http_error_total{code="SERVICE_UNAVAILABLE"}[5m])) * 0
            )
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Identity provider unavailable (503 spike, {{ $labels.application }})"
          description: "{{ $labels.application }} is re-mapping unreachable-Keycloak-JWKS failures to 503 at an elevated rate — the root cause of the past Http5xxRateHigh incident. Check Keycloak reachability / DNS before 5xx surfaces to users. The ingest gateway's 503 for a full DPoP replay store (auth-failure reason dpop_store_full) is not counted here; IngestDpopReplayCacheFull reports it."

      - alert: AccessDeniedSpike
        expr: sum by (application) (rate(basetool_http_error_total{code="ACCESS_DENIED"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "403 access-denied spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is returning 403 access-denied at an elevated rate — possible authorization probing or a broken permission gate after a deploy."

      - alert: SecurityExpressionEvaluationFailed
        expr: sum by (application, kind) (increase(basetool_security_expression_failures_total{application="basetool-backend"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A method-security expression could not be evaluated on {{ $labels.application }} ({{ $labels.kind }})"
          description: "Spring Security failed to evaluate a @PreAuthorize expression in the last 10 minutes, so every call of that operation is refused with 400 ILLEGAL_ARGUMENT. The series is normally zero: kind=evaluation is a bean or method the expression names but the context lacks (a renamed security bean, a changed arity), kind=other an expression that yields no decision. The WARN log line of the 400 (code ILLEGAL_ARGUMENT, exceptionMessage) names the expression; it is a deploy defect, fix the expression or the bean and redeploy (REQ-OBS-020)."

      - alert: PendingApprovalBlockSpike
        expr: sum by (application) (rate(basetool_http_error_total{code="PENDING_APPROVAL"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pending-approval 403 spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is 403-blocking pending-approval users at an elevated rate — likely an authorities-converter or approval-sync regression leaving legitimate users with only ROLE_PENDING_APPROVAL, not just the occasional genuinely-pending account."

      - alert: NoRoleBlockSpike
        expr: max by (application) (basetool_norole_refused_subjects) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Several accounts hold no role ({{ $labels.application }})"
          description: "{{ $labels.application }} refused {{ $value }} distinct accounts with 403 NO_ROLE in the last 15 minutes (REQ-SEC-053). One or two is ordinary — an admin has not assigned a role yet. More at once is a realm-side role rename, a hand-edit, or tokens arriving from the wrong realm; check the Keycloak role index line in the sync summary."

      - alert: RateLimitRejectionSpike
        expr: sum by (application) (rate(basetool_ratelimit_rejections_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejection spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is rejecting requests via the rate limiter at an elevated rate."

      - alert: RegistrationApprovalOverdue
        expr: basetool_registration_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending registration >48h"
          description: "A user registration has been awaiting approval for more than 48 hours."

      - alert: DeletionRequestOverdue
        expr: basetool_deletion_request_pending_oldest_age_seconds > 1209600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest account-deletion request >14d"
          description: >-
            A member asked for their account to be erased more than 14 days ago and no admin has
            decided it. Art. 12(3) allows one month to respond. Decide it in Administration ->
            Loeschantraege; refusing requires a recorded reason, which the member is then told.

      - alert: UserDeletionUnfinished
        expr: basetool_users_pending_deletion_oldest_age_seconds > 604800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "An account has been awaiting local deletion for >7d"
          description: >-
            A Keycloak account was removed but its local row was never deleted, so it still holds
            the member's e-mail address, handle, Discord id and description. Finish it in
            Administration -> Mitglieder (the delete action appears for accounts the sync no longer
            finds in Keycloak), or reinstate the Keycloak account if the removal was a mistake.

      - alert: AdminAccountAutoActivated
        expr: sum(increase(basetool_admin_registration_auto_activated_total[24h])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A new account was activated as admin without an approval"
          description: >-
            A brand-new account arrived already holding the Keycloak ADMIN realm role and was
            activated without passing the approval queue (REQ-SEC-017 bootstrap carve-out). Expected
            for the first admin and for a deliberate re-provisioning; otherwise confirm who was
            granted the ADMIN realm role in Keycloak, and check Administration -> Protokoll (Rollen
            tab) for the account's arrival.

      - alert: AccountErasureKeycloakDeleteFailed
        expr: sum(increase(basetool_account_deletion_keycloak_failures_total[24h])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An erasure deleted the local data but not the Keycloak account"
          description: >-
            An Art. 17 erasure committed its local half and then failed to delete the Keycloak
            account, so that account still exists and can still log in. Delete it in the Keycloak
            console; until then a re-login recreates the member's row, and for an ADMIN-realm-role
            holder that row is ACTIVE immediately. The account id is in the
            ACCOUNT_DELETION_KEYCLOAK_DELETE_FAILED audit event (Administration -> Protokoll,
            Rollen tab).

      - alert: BankBookingApprovalOverdue
        expr: basetool_bank_booking_request_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending bank booking request >48h"
          description: "A bank booking request has been awaiting approval for more than 48 hours."

      - alert: P4kImportStuck
        expr: basetool_p4k_import_job_pending_oldest_age_seconds > 21600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending P4K import >6h"
          description: "A P4K catalog import has been PENDING for more than 6 hours — imports normally finish in minutes, so the async worker is likely wedged. Check the backend logs and re-run the import."

      - alert: JobOrderStale
        expr: basetool_job_order_open_oldest_age_seconds > 15552000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest open job order >180d"
          description: "A job order has been OPEN for more than 180 days — likely abandoned. Close or reassign it (threshold is a baseline; tune to the org's cadence)."

      - alert: RefineryOrderStale
        expr: basetool_refinery_order_open_oldest_age_seconds > 7776000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest open refinery order >90d"
          description: "A refinery order has been OPEN for more than 90 days — likely abandoned. Close or reassign it (threshold is a baseline; tune to the org's cadence)."

      - alert: OperationStale
        expr: basetool_operation_open_oldest_age_seconds > 7776000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest planned operation >90d"
          description: "An operation has been PLANNED for more than 90 days — likely abandoned. Execute, reschedule or cancel it (threshold is a baseline; tune to the org's cadence)."

      - alert: P4kImportFailed
        expr: sum(increase(basetool_p4k_import_jobs_total{outcome="failed"}[24h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P4K import failure in the last 24h"
          description: "At least one P4K catalog import reached FAILED in the last 24 hours. A repeatedly-failing import leaves an empty-looking pending queue; check the job list and backend logs for the error."

      - alert: MailDeliveryFailing
        expr: sum(increase(basetool_mail_total{outcome="failed"}[1h])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SMTP mail delivery failing (>2/h)"
          description: "More than 2 outgoing mails failed to send in the last hour. Check the SMTP relay and the backend logs; registration / approval notifications may be silently lost."

      - alert: MailDroppedConfigDrift
        expr: sum by (outcome) (increase(basetool_mail_total{outcome=~"dropped_no_host|dropped_no_sender"}[1h])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mail dropped by a config gate ({{ $labels.outcome }})"
          description: "Outgoing mail was dropped before delivery ({{ $labels.outcome }}) — mail is enabled on this deployment but misconfigured (blank spring.mail.host, or no JavaMailSender bean), so registration / approval notifications are being lost. The deliberate app.mail.enabled=false kill-switch (dropped_disabled) is out of scope for this alert."

      - alert: SsePushChannelDead
        expr: >-
          (basetool_sse_connections == 0)
          and on()
          (sum(rate(http_server_requests_seconds_count{job="basetool-frontend",
          uri!~"/|/\\*\\*|/actuator.*|/impressum|/privacy|/terms|/licenses|/manifest.webmanifest|/robots.txt|/\\.well-known/.*|/app/callback|/app/link-help|NOT_FOUND|UNKNOWN|REDIRECTION"}[15m])) > 0.01)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Notification SSE push channel dead while users are online"
          description: "The backend has zero live SSE connections for 30 minutes while the frontend is still serving real user page traffic — the notification push channel is down and clients fell back to polling. Check reverse-proxy SSE buffering and the /notifications/stream relay."

      - alert: SseRelayPoolNearSaturation
        expr: basetool_notification_relay_connections > 800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification SSE relay pool near saturation"
          description: "The frontend has held more than 800 of its 1000 SSE relay slots for 10 minutes — past 1000 the next live viewer's push is silently dropped. Check the concurrent viewer count and per-user stream multiplication; consider raising frontend-sse-pool maxConnections or capping streams per user."

      - alert: ActiveSessionsRunaway
        expr: basetool_active_sessions > 2000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Frontend session store growing unbounded (>2000 active sessions)"
          description: "basetool_active_sessions has held above 2000 for 1h. Expected steady state is a few hundred; a sustained climb means anonymous/orphan sessions are accreting again (REQ-SEC-025 two-tier TTL regressed) and Redis is heading for its maxmemory noeviction ceiling. Check the session store size (redis SCAN 'basetool:session:sessions:*') and the created-vs-login ratio."

      - alert: SessionValueDropsSustained
        expr: sum(increase(basetool_session_value_dropped_total[15m])) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Frontend is dropping unreadable session values ({{ $value | printf \"%.0f\" }} per 15m)"
          description: "Session values in Redis cannot be deserialized and are being dropped, so those attributes read as not set. Find the WARN line from SessionAttributeDiagnosticMapper in the frontend log: it names the attribute, the cause and the unresolved type id. typeId=absent means a FINAL-typed value (a record, a List.of/Map.of) was written into a session and can never be read back; a class name means that class was renamed or removed since the session was written; cause=IllegalArgumentException means a top-level @class no longer resolves. Since ADR-0157 the value is REMOVED from the session on the request that dropped it, so each poisoned session drops exactly once: a burst that decays is a backlog being repaired and is expected on a deploy, while a rate that stays up for 30m means something is still WRITING an unreadable value every request — check that the frontend startup line \"Session serializer forces an @class type id for: [...]\" lists what you expect, and that no code path puts a final type into a session (REQ-SEC-049, REQ-SEC-050)."

      - alert: SessionUnmappableSustained
        expr: sum(increase(basetool_session_unmappable_total[15m])) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Frontend cannot map session hashes ({{ $value | printf \"%.0f\" }} per 15m)"
          description: "Session hashes in Redis exist but are missing a required field, so those requests are served as if they carried no session and the members are signed out. Find the WARN line from SessionAttributeDiagnosticMapper in the frontend log: it names which required field was absent. This is normally a hash that was lost and then half re-created by a delta write, so check Redis first — a restart, an AOF truncation or a session purge run against live traffic all produce it, and the burst should decay on its own once the affected browsers get fresh sessions. A rate that keeps climbing with no such event means session hashes are being lost in volume; a rate that covers the whole active population at once means the session wire format broke and everybody is being signed out (REQ-SEC-063). Before ADR-0186 this state answered HTTP 500 on every request from that browser for up to 30 days instead."

      - alert: SessionTypeOutsideAllowList
        expr: sum by (mode) (increase(basetool_session_type_refused_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A session value names a class outside the session type allow-list (mode={{ $labels.mode }})"
          description: "The frontend read a session value whose @class type id is not on SessionTypeAllowList. Find the WARN line from SessionTypeAllowList in the frontend log: it names the class once per frontend lifetime. mode=report means the value was read as before and nothing broke, but APP_SESSION_TYPE_ALLOW_LIST=enforce would drop it: if the class is legitimately stored in the session (a new form or DTO outside frontend.model, a new Spring or container type) add it to the list and do not enforce until this has stayed silent; if it is not, something other than this frontend wrote into Redis. mode=enforce means the value was refused and that attribute reads as not set, which is correct for a foreign class and a defect for a legitimate one (REQ-SEC-067)."

      - alert: RedisFanoutUnsubscribed
        expr: basetool_redis_fanout_subscribed == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.fanout }} fan-out has not been subscribed for 10m"
          description: "The {{ $labels.fanout }} pub/sub container on the backend is not listening, so cross-instance delivery for that channel is dead: a peer replica's change never reaches this instance. The container retries every 5s, so 10 minutes means Redis is genuinely unreachable from the backend rather than merely restarting — check the redis container and the net-redis-backend network. The backend deliberately stays up and serving while this is true (ADR-0084, ADR-0143), so nothing else will page."

      - alert: SessionEvictionSpike
        expr: sum(increase(basetool_session_evicted_total[1h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Concurrent-session evictions sustained (session registry may be stale)"
          description: "The frontend has evicted more than 3 sessions per hour for 30 minutes because the per-principal concurrent-session cap (10) was full. Members are being logged out with 'This session has been expired'. A sustained stream means the session registry is holding dead Redis sessions against the cap rather than users genuinely cycling more than ten devices — check the registry against the live Redis keys (SCAN 'basetool:session:sessions:*') and correlate with ActiveSessionsRunaway; the backend log line names the cap and the victim's userId (sub)."

      - alert: FrontendLoginBroken
        expr: sum(increase(basetool_login_total{outcome="failure", reason="provider_error"}[15m])) >= 3 unless sum(increase(basetool_login_total{outcome="success"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frontend logins failing at the token exchange with zero successes"
          description: "The frontend recorded repeated OAuth2 provider errors (failed code-to-token exchange, JWKS or bad IdP response) and no successful logins in the last 15 minutes — login is likely broken for everyone at the token-exchange step. Check the frontend logs, Keycloak reachability from the frontend (issuer-uri / JWKS endpoint) and the OIDC client config. State/session-loss breaks surface as invalid_state and via the frontend redis readiness indicator instead."

      - alert: CsrfRejectionSpike
        expr: sum(rate(basetool_csrf_rejections_total[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Elevated CSRF-token rejection rate"
          description: "The frontend has been rejecting CSRF tokens at more than 0.1/s for 15 minutes — likely a systematic CSRF-wiring regression rather than occasional stale tokens (which krtFetch self-heals). Check recent security/template changes and the /csrf endpoint."

      - alert: ClientErrorSpike
        expr: |
          sum by (kind) (increase(basetool_client_error_total[1h])) > 20
          and
          sum by (kind) (increase(basetool_client_error_total[1h])) > 3 * sum by (kind) (increase(basetool_client_error_total[24h])) / 24
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Browser client errors stepped up ({{ $labels.kind }})"
          description: "The frontend's client-error beacon has reported {{ $labels.kind }} failures well above their own daily baseline for 30 minutes — the browser half of a page is throwing, which produces no server-side error of any kind. Check what shipped in the last frontend deploy; a script_error / unhandled_rejection step means a krtFetch handler is dying (live update silently stops working on that surface), a resource_error step means an asset the templates still reference is 404ing, a csp_violation step means a template or script now does something the Content-Security-Policy blocks (an inline script or style without the nonce, a new third-party host, a DOM sink written without a Trusted Types policy value) and that part of the page silently does not work, or under the report-only Trusted Types policy is reported while it still works, an i18n_missing step means a page stopped providing a localized string a script reads (the UI now shows the key name). Raise ClientErrorReportController to DEBUG via /actuator/loggers to get the message and script URL for the duration of the investigation."

      - alert: DiscordPrecheckUnauthorizedSpike
        expr: sum(rate(basetool_discord_precheck_total{outcome="unauthorized"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Discord precheck unauthorized-rate elevated"
          description: "The Discord account-existence precheck has been returning 401 at more than 0.1/s for 10 minutes — likely someone guessing the X-KRT-SPI-Secret. Verify the SPI's configured secret matches the backend and check for abuse."

      - alert: DiscordPrecheckDisabledOnProd
        expr: sum(increase(basetool_discord_precheck_total{outcome="disabled"}[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Discord precheck disabled (blank secret) on prod"
          description: "The Discord account-existence precheck answered 503 (no shared secret configured) on a deployment where it should be enabled — a config-drift regression after a secret rotation. The SPI is now failing open; restore the X-KRT-SPI-Secret."

      - alert: RateLimitRejectionRatioHigh
        expr: (sum by (application, bucket) (rate(basetool_ratelimit_rejections_total[10m])) / sum by (application, bucket) (rate(basetool_ratelimit_requests_total[10m]))) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejection ratio >1% ({{ $labels.application }}/{{ $labels.bucket }})"
          description: "More than 1% of rate-limit evaluations on {{ $labels.application }} bucket {{ $labels.bucket }} have been rejected for 15 minutes — sustained pressure or abuse against that budget. Check the source and whether the limit needs tuning."

      - alert: AuditSilenceAnomaly
        expr: (sum(increase(basetool_audit_events_total[5d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 30m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No audit events recorded in 5d while backend is up"
          description: "The backend has been up but recorded zero audit events for 5 days — possible audit-logging regression (REQ-AUDIT-001)."

      - alert: BankAuditSilenceAnomaly
        expr: (sum(increase(basetool_bank_audit_events_total[60d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 30m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No bank audit events recorded in 60d while backend is up"
          description: "The backend has been up but recorded zero bank audit events for 60 days — possible bank audit-logging regression (REQ-AUDIT-001). Every bank mutation must write a bank_audit_event row."

      - alert: AuditDomainSilenceAnomaly
        expr: (sum by (domain) (increase(basetool_audit_events_total{domain!~"ROLE|PROMOTION|PERSONAL_INVENTORY|MARKET|HANGAR|BLUEPRINT|CONNECTED_APPS"}[30d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 1h
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Audit domain silent 30d ({{ $labels.domain }})"
          description: "The {{ $labels.domain }} audit domain recorded zero events in 30 days while the backend is up — this domain may have lost its audit wiring (REQ-AUDIT-001) even though other domains are still active."

      - alert: BackendCallFailureSustained
        expr: sum(rate(basetool_backend_client_errors_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained frontend→backend call failures"
          description: "The frontend's backend-call failure rate has been elevated for 10 minutes ({{ $value }}/s)."

      - alert: IngestHandoffErrors
        expr: sum by (reason) (rate(basetool_ingest_handoff_errors_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway errors ({{ $labels.reason }})"
          description: "The ingest gateway is failing requests (reason: {{ $labels.reason }}) at an elevated rate — staging_unavailable: Redis refused a client's draft or held-back change set; internal: an unexpected gateway failure answered 500. Relay failures to the backend are ExchangeRelayFailing's, not this alert's."

      - alert: IngestStagingUnavailable
        expr: rate(basetool_ingest_handoff_errors_total{reason="staging_unavailable"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest cannot stage handoffs (Redis unreachable)"
          description: "The ingest gateway could not stage a client's draft or held-back change set in Redis for browser pickup — the client gets a 503 and no pre-filled form or confirmation page opens. Check the redis container and the ingest Redis configuration."

      - alert: IngestPayloadRejectedSpike
        expr: rate(basetool_ingest_payload_rejected_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest oversized-payload rejections spiking"
          description: "The ingest gateway is refusing oversized /exchange request bodies (413) at an elevated rate — likely an oversized-body probing / DoS attempt against the public ingest surface, or a misconfigured client. Read the source addresses in the edge log ({app=\"edge\"}, the ingest vhost); the edge rate-limits per source address, and fail2ban on this host guards SSH only."

      - alert: IngestAudienceGateOff
        expr: max by (application) (basetool_ingest_gate_enforcing{gate="audience", application="basetool-ingest"}) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway runs without its JWT audience check"
          description: "basetool_ingest_gate_enforcing{gate=\"audience\"} is 0: the ingest gateway accepts any valid realm token at the decoder, including frontend session tokens. Set IRI_INGEST_EXPECTED_AUDIENCES=basetool-ingest (never the backend's audience), the audience the exchange.* client scopes stamp — docs/INGEST_KEYCLOAK_SETUP.md step 7a — then re-render env.d and restart ingest."

      - alert: AndroidVersionPolicyOverrideActive
        expr: max by (application, field) (basetool_android_version_policy_override{application="basetool-backend"}) == 1
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "The Android version policy runs on an emergency override"
          description: "basetool_android_version_policy_override{field=\"{{ $labels.field }}\"} has been 1 for a day: the host's APP_ANDROID_*_OVERRIDE replaces the release default committed in application.yml, so this value no longer deploys or rolls back with the release (REQ-API-020). Raise the release default in a PR to the overridden value, release it, then empty the override in .env and re-render env.d — docs/deployment.md, The Android app floor."

      - alert: ApiUnknownClient
        expr: sum (rate(basetool_api_client_requests_total{client_id="other"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unregistered client software is calling the backend API"
          description: "A token whose azp names no known client drove /api/** for 10 minutes. Either a first-party client was added to the realm without being added to app.monitoring.api-clients.known-client-ids, or something nobody approved is using the API. Identify it from the Keycloak client sessions and the api vhost access log; the label is deliberately bounded to 'other' and will never name it."

      - alert: IngestServiceAccountTokenFailing
        expr: >-
          sum(rate(basetool_ingest_service_account_token_total{outcome="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway cannot obtain its own backend token"
          description: "The ingest gateway's client-credentials grant against Keycloak has been failing for 10 minutes. Every exchange request that needs the backend fails with 502 BACKEND_RELAY_FAILED for as long as this lasts, and the client cannot tell the member why. Check the gateway's app.ingest.service-account.* configuration, the client secret, and whether Keycloak is reachable from the gateway."

      - alert: OnBehalfOfRefusedSpike
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="not_a_gateway"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Something other than the ingest gateway is sending an on-behalf-of header"
          description: "The backend refused an X-Ingest-On-Behalf-Of header from a caller whose azp is not on the gateway allowlist, repeatedly. Either app.security.ingest-gateway.client-ids does not match the gateway's actual client id - in which case exchange relays are also failing - or somebody is probing for an impersonation primitive. Check the gateway's own token first, then the access log for the source."

      - alert: ActingMemberNotLiveRefused
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="member_not_live"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway is naming a member the backend will not act for"
          description: "The backend has been refusing on-behalf-of requests for a member that is either unknown locally or that the last Keycloak roster sync no longer found. Most likely an offboarded member whose connected application (the SC Extractor or another exchange client) is still running - find them via the correlationId in the backend log and have it disconnected. If the refused subjects VARY, this is somebody enumerating user ids instead, and the source belongs in the access log."

      - alert: ExchangeRelayHeaderForged
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="forged_exchange_header"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Exchange relay headers from something other than the gateway"
          description: "Something other than the ingest gateway acting for a member sent X-Exchange-Client or X-Exchange-Capabilities, repeatedly. A browser session or the app naming an external client is trying to borrow its attribution or capabilities (REQ-XCH-010). Find the source via the correlationId in the backend log."

      - alert: ExchangeGateRefusing
        expr: >-
          sum by (reason) (rate(basetool_exchange_gate_refused_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backend exchange gate refusing ({{ $labels.reason }})"
          description: "The backend's ExchangeGate has been refusing exchange requests the gateway let through for 15 minutes ({{ $labels.reason }}). The gateway checks the same registry first, so a sustained backend refusal means the two disagree: a stale gateway cache, a mirror that is behind the database (see ExchangeMirrorWriteFailed), or a gateway that no longer relays capabilities or the connection time. Members' clients get the gateway's own code for the reason meanwhile (CLIENT_SUSPENDED, SCOPE_MISSING, CLIENT_REVOKED ...); under revocations_unreadable the backend cannot read the Redis revocation mirror and answers 503 REGISTRY_UNAVAILABLE."

      - alert: ExchangeDepartureIncomplete
        expr: >-
          sum(increase(basetool_exchange_departures_total{outcome="failed"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A departed member's exchange access was not fully ended"
          description: "A member left the organisation and the backend could not end all of their exchange access: a revocation, a consent removal or the Keycloak logout failed (REQ-XCH-008). The step is not retried. Check the backend log for 'Exchange departure step', then end the member's sessions and consents in the Keycloak admin console and disconnect their clients."

      - alert: OnBehalfOfWithoutAuthenticatedCaller
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="no_authenticated_caller"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Sustained on-behalf-of traffic at an ingest endpoint with no authenticated caller"
          description: "ActingMemberFilter has been refusing on-behalf-of requests at an ingest endpoint because the SecurityContext held no authenticated caller, for half an hour. A single occurrence is a probe or an expired token; a sustained rate is not. Check whether ingest uploads are also failing - if they are, suspect the security filter chain being reordered ahead of this filter (compare SecurityConfig's addFilterAfter ordering against ADR-0129) or authentication failing silently. If uploads are fine, this is an unauthenticated caller sending the header, and the access log has the source."
      - alert: TermsConsentRolloutStalled
        expr: |
          (max(basetool_terms_refused_subjects) >= 3)
          and
          ((sum(increase(basetool_terms_acceptances_total[2h])) or vector(0)) == 0)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Terms-of-Use consent gate locking out several members, none getting through"
          description: "At least three distinct members have been refused by the consent gate for an hour while not a single acceptance was recorded in the last two hours. Expected right after a terms change only if nobody has logged in; otherwise the consent path is broken and those members are locked out of the tool AND the desktop extractor. Check /admin/terms for who is outstanding, and the frontend log for failures on POST /terms/accept."

      - alert: RequestBodyRejectedSpike
        expr: rate(basetool_request_body_rejected_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend oversized request-body rejections spiking"
          description: "The backend is refusing oversized non-multipart JSON request bodies (413) on a capped import path at an elevated rate — likely a memory-DoS probing attempt against the refinery import-extract endpoint, or a misconfigured client bypassing the frontend proxy cap."

      - alert: KeycloakLoginErrorSpike
        expr: rate(keycloak_user_events_total{event=~"login_error|identity_provider_login_error"}[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak login-error spike"
          description: "Keycloak is emitting login_error / IdP-error events at an elevated rate."

      - alert: KeycloakEventMetricsAbsent
        expr: >-
          absent(keycloak_user_events_total)
          and on() (up{job="keycloak"} == 1)
          and on() (
            sum(increase(http_server_requests_seconds_count{job="keycloak",
              uri=~"(/auth)?/realms/.*/protocol/openid-connect/(token|auth)"}[1h])) > 0
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak user-event metrics absent while Keycloak is up"
          description: "keycloak_user_events_total is not being exported while the Keycloak scrape is up — KeycloakLoginErrorSpike is blind. Check the Keycloak metrics/event listener config."

      - alert: LiveSyncRedisFanoutBroken
        expr: sum(rate(basetool_livesync_redis_errors_total{op="publish"}[5m])) > 0 or sum(rate(basetool_sse_redis_errors_total{op="publish"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis live-sync/notification fan-out publish errors (cross-replica delivery degraded)"
          description: "The live-sync and/or notification Redis fan-out has failed to publish for 10 minutes — cross-replica live delivery is silently degraded to single-instance (a viewer on one replica stops seeing another replica's changes/notifications; same-replica delivery still works, no user-facing error). Check Redis reachability from the app replicas and the basetool:livesync:changed / basetool:notify:published pub/sub channels in each service's own ACL user (basetool-backend is granted both, basetool-frontend basetool:livesync:changed; a service whose REDIS_<SVC>_USERNAME is unset runs as the default user). RedisAclDenials fires alongside when a missing grant is the cause."

      - alert: AppLiveSyncBridgeSilent
        expr: |
          (sum(rate(basetool_livesync_redis_published_total{job="basetool-frontend"}[30m])) > 0)
          and on()
          (sum(basetool_livesync_streams) > 0)
          and on()
          ((sum(rate(basetool_livesync_redis_consumed_total{job="basetool-backend"}[30m])) or vector(0)) == 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "App live-sync bridge silent (web changes are not reaching the app)"
          description: "The web frontend has been publishing live-sync changed frames for 30 minutes and the backend has consumed none, while app live-sync streams are open — so a browser edit never reaches the app and an app write never reaches a browser, with no error on either side. Check app.live-sync.redis-fanout.enabled on the backend (must be true in prod), that its channel is the frontend's basetool:livesync:changed and not a channel of its own, and that the basetool-backend ACL user is granted that channel with PUBLISH/SUBSCRIBE (the default user while REDIS_BACKEND_USERNAME is unset)."

      - alert: LiveSyncRelayDropsSustained
        expr: sum by (topic_class, reason) (increase(basetool_presence_relay_dropped_total{reason!="section_filtered"}[1h])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Live-sync relay dropping frames on {{ $labels.topic_class }} ({{ $labels.reason }})"
          description: "The live-sync relay dropped more than 3 frames in an hour on topic class {{ $labels.topic_class }} for reason {{ $labels.reason }}, sustained for 15m — peers on that surface are silently missing updates. Prod baseline for this counter is zero over 21d, so any sustained stream is anomalous. `throttled`/`topic_throttled`: a client or a room is exceeding its token bucket (misbehaving client, or a genuinely hot room needing a wider bound). `send_failed`: sockets breaking mid-write — check the reverse proxy's WebSocket timeouts. `topic_cap`: a client subscribing past its per-session topic cap (client bug). `authorize_saturated`: the subscribe-authorization executor is saturated and subscribes are failing CLOSED (refused as indeterminate, so those tabs lose live updates for the topic) — check backend latency."

      - alert: LiveSyncSectionKeySkew
        expr: sum by (topic_class) (increase(basetool_presence_relay_dropped_total{reason="section_filtered"}[1h])) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Live-sync section-key skew on {{ $labels.topic_class }} (peers going stale)"
          description: "The live-sync relay has been filtering unknown section keys out of `changed` frames on topic class {{ $labels.topic_class }} for over 2 hours — a broadcast key is missing from the relay's accept-list, so peers' matching panels stay stale with no visible error (the REQ-FE-010 defect class). A section key must exist at all three mirror points at once: the acting page's seam map, LiveSyncTopicClass.allowedSections, and the receiving client's apply map. Check what the last frontend deploy changed on that surface and raise LiveSyncWebSocketHandler to DEBUG to see the rejected key (logged sanitised, never a metric tag)."

      - alert: AppLiveSyncFramesDropped
        expr: sum by (event) (increase(basetool_livesync_frames_dropped_total{job="basetool-backend"}[1h])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "App live-sync dropping {{ $labels.event }} frames (full delivery queues)"
          description: "The backend dropped more than 3 app live-sync `{{ $labels.event }}` frames in an hour because a stream's bounded delivery queue was full, sustained for 15m — some app subscribers are not reading their SSE stream fast enough, so their screens miss updates until the next frame or navigation. Check basetool_livesync_frames_queued (a standing value names stalled streams), basetool_livesync_send_failures_total, and the edge's proxy_read_timeout / buffering for /api/v1/live-sync/stream."
