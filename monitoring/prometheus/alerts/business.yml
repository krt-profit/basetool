# Business-metric alerts (basetool_*, REQ-OBS-011). Metric names are the exact rendered names
# from the shipped Phase-1c code (metrics/MetricNames.java in each module) — DO NOT rename a metric
# without updating these rules in the same PR (the "monitoring moves with the change" rule).
groups:
  - name: business-critical
    rules:
      # The ledger broke an invariant — data corruption. Any category > 0 is critical.
      - alert: BankLedgerIntegrityViolation
        expr: basetool_bank_ledger_integrity_violations > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Bank ledger integrity violation: {{ $labels.category }}"
          description: "The hourly integrity sweep found {{ $value }} rows in category '{{ $labels.category }}'. A bank ledger invariant is broken — investigate before any further bank mutation."

  - name: business-warning
    rules:
      # NOTE: the backend tags basetool_scheduled_job_* with a `job` label (ScheduledJob.label()),
      # which COLLIDES with Prometheus's own scrape `job` label (basetool-backend). On collision
      # Prometheus keeps the scrape value and exposes the app value as `exported_job`, so the
      # scheduled-job name must be matched on `exported_job` here, not `job` (which is always
      # "basetool-backend"). Matching on `job` silently never fired. (Root-cause fix = rename the
      # backend tag off the reserved `job` name; until then these use exported_job.)
      # Role drift vs. Keycloak: the user sync last succeeded > 15 min ago (it runs every 5 min).
      - alert: UserSyncStale
        expr: (time() - basetool_scheduled_job_last_success_timestamp_seconds{exported_job="user_sync"}) > 900
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "User sync stale >15 min"
          description: "The Keycloak user sync last succeeded more than 15 minutes ago — local roles/accounts may drift from Keycloak."

      - alert: ExternalSyncStale
        expr: (time() - basetool_scheduled_job_last_success_timestamp_seconds{exported_job=~"uex_sync|scwiki_sync"}) > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "External sync stale >48h ({{ $labels.exported_job }})"
          description: "The {{ $labels.exported_job }} catalogue sync last succeeded more than 48 hours ago."

      # (#1041 item 2) Swallowed upstream failures. Every UEX/SC-Wiki fetch/parse error is mapped to an
      # empty list, so the sync job still "succeeds" and last_success stays fresh — ExternalSyncStale /
      # ScheduledJobFailureStreak never fire during a weeks-long catalogue outage. This counts the
      # swallowed failures directly (basetool_external_fetch_errors_total{source}).
      # baseline-tune: >3 errors in 6h is the issue's initial threshold.
      - alert: ExternalFetchErrors
        expr: sum by (source) (increase(basetool_external_fetch_errors_total[6h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "External fetch errors ({{ $labels.source }})"
          description: "The {{ $labels.source }} client swallowed more than 3 fetch/parse errors in 6 hours — the catalogue sync may be silently importing nothing while still recording a success. Check the upstream API and the sync logs."

      - alert: ScheduledJobFailureStreak
        expr: increase(basetool_scheduled_job_executions_total{outcome="failure"}[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job failing repeatedly ({{ $labels.exported_job }})"
          description: "Job '{{ $labels.exported_job }}' recorded {{ $value }} failed runs in the last hour."

      # Historical optimistic-locking regression indicator (the project's canonical 409 signal).
      - alert: OptimisticLockConflictSpike
        expr: rate(basetool_http_error_total{code="OPTIMISTIC_LOCK"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "409 optimistic-lock conflict spike"
          description: "The backend is returning 409 optimistic-lock conflicts at an elevated rate — a likely locking/version-propagation regression."

      # (#1041 item 6) SERVICE_UNAVAILABLE is incremented exactly when the backend/ingest re-maps an
      # unreachable Keycloak JWKS to a retryable 503 (REQ-SEC-024) — the documented root cause of the
      # past Http5xxRateHigh incident. Detects it minutes earlier and pre-diagnosed.
      - alert: IdentityProviderUnavailable
        expr: sum by (application) (rate(basetool_http_error_total{code="SERVICE_UNAVAILABLE"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Identity provider unavailable (503 spike, {{ $labels.application }})"
          description: "{{ $labels.application }} is re-mapping unreachable-Keycloak-JWKS failures to 503 at an elevated rate — the root cause of the past Http5xxRateHigh incident. Check Keycloak reachability / DNS before 5xx surfaces to users."

      # (#1041 item 6) Authorization-probing signal: 401 (UNAUTHENTICATED) is charted, 403 was not.
      # baseline-tune: 0.2/s is an initial guess; 403s occur normally (guest field redaction), so tune
      # against the baseline week.
      - alert: AccessDeniedSpike
        expr: sum by (application) (rate(basetool_http_error_total{code="ACCESS_DENIED"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "403 access-denied spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is returning 403 access-denied at an elevated rate — possible authorization probing or a broken permission gate after a deploy."

      - alert: RateLimitRejectionSpike
        expr: sum by (application) (rate(basetool_ratelimit_rejections_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejection spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is rejecting requests via the rate limiter at an elevated rate."

      # Registration approvals (Discord) and bank booking requests waiting too long.
      - alert: RegistrationApprovalOverdue
        expr: basetool_registration_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending registration >48h"
          description: "A user registration has been awaiting approval for more than 48 hours."

      - alert: BankBookingApprovalOverdue
        expr: basetool_bank_booking_request_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending bank booking request >48h"
          description: "A bank booking request has been awaiting approval for more than 48 hours."

      # Audit silence: backend up but zero audited mutations recorded across a 5-DAY window — a
      # REQ-AUDIT-001 signal that audit logging may be broken. 5d (not hours) so ordinary quiet periods
      # (weekends, maintenance windows) never trip it; only a genuine multi-day silence does. Resolves
      # on the first audited action and stays quiet as long as one lands within any 5-day window.
      - alert: AuditSilenceAnomaly
        expr: (sum(increase(basetool_audit_events_total[5d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No audit events recorded in 5d while backend is up"
          description: "The backend has been up but recorded zero audit events for 5 days — possible audit-logging regression (REQ-AUDIT-001)."

      # Frontend → backend call failures (bounded reason/method), sustained.
      - alert: BackendCallFailureSustained
        expr: sum(rate(basetool_backend_client_errors_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained frontend→backend call failures"
          description: "The frontend's backend-call failure rate has been elevated for 10 minutes ({{ $value }}/s)."

      # (#1041 item 1) Ingest handoff relay health. WoltLab is the account source of truth, so a dead
      # relay means identity-data drift that otherwise only surfaces much later via user-sync staleness.
      # The metrics (basetool_ingest_handoff_total/_errors_total) already ship from the ingest module.
      # baseline-tune: 0.05/s error rate is the issue's initial threshold.
      - alert: IngestHandoffErrors
        expr: sum by (reason) (rate(basetool_ingest_handoff_errors_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest handoff errors ({{ $labels.reason }})"
          description: "The ingest gateway is failing to relay handoffs (reason: {{ $labels.reason }}) at an elevated rate — WoltLab identity data may be drifting from basetool."

      - alert: IngestBackendUnavailable
        expr: rate(basetool_ingest_handoff_errors_total{reason="backend_unavailable"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest cannot reach the backend (handoffs failing)"
          description: "The ingest gateway could not reach the backend to relay handoffs in the last 5 minutes — staged identity data is not being applied. Check backend health and the ingest→backend path."

      # Keycloak login errors / Discord IdP broker error spike (primary login path).
      - alert: KeycloakLoginErrorSpike
        expr: rate(keycloak_user_events_total{event=~"login_error|identity_provider_login_error"}[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak login-error spike"
          description: "Keycloak is emitting login_error / IdP-error events at an elevated rate."

      # (#1041 item 6) KeycloakLoginErrorSpike reads keycloak_user_events_total; if Keycloak's event
      # metrics subsystem stops exporting while Keycloak itself is up, that alert goes silent (not
      # firing) with no other signal. This catches the absence directly.
      - alert: KeycloakEventMetricsAbsent
        expr: absent(keycloak_user_events_total) and on() (up{job="keycloak"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak user-event metrics absent while Keycloak is up"
          description: "keycloak_user_events_total is not being exported while the Keycloak scrape is up — KeycloakLoginErrorSpike is blind. Check the Keycloak metrics/event listener config."
