# Business-metric alerts (basetool_*, REQ-OBS-011). Metric names are the exact rendered names
# from the shipped Phase-1c code (metrics/MetricNames.java in each module) — DO NOT rename a metric
# without updating these rules in the same PR (the "monitoring moves with the change" rule).
groups:
  - name: business-critical
    rules:
      # The ledger broke an invariant — data corruption. Any category > 0 is critical.
      - alert: BankLedgerIntegrityViolation
        expr: basetool_bank_ledger_integrity_violations > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Bank ledger integrity violation: {{ $labels.category }}"
          description: "The hourly integrity sweep found {{ $value }} rows in category '{{ $labels.category }}'. A bank ledger invariant is broken — investigate before any further bank mutation."

      # REQ-ORDERS-033: an ordered-item line's blueprint no longer produces the ordered item, so the
      # order is showing a FOREIGN recipe's materials as its demand. People collect and book against
      # those numbers, so this is wrong-data-in-production, not a cosmetic drift. Warning rather than
      # critical: nothing is corrupted (the write path stays consistent), but every affected order
      # misleads until it is re-saved.
      - alert: JobOrderItemBlueprintDrift
        expr: basetool_job_order_integrity_violations > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Item-order line blueprint drift: {{ $value }} line(s)"
          description: "The integrity sweep found {{ $value }} ordered-item line(s) whose blueprint no longer produces the ordered item — an SC-Wiki re-sync re-pointed the blueprint after the order was placed. Those orders display a foreign recipe's materials. The backend log names each order; re-saving an affected order re-derives its lines."

  - name: business-warning
    rules:
      # NOTE (#1041 item 23): the backend tags basetool_scheduled_job_* with a `task` label
      # (ScheduledJob.label()). It was formerly `job`, which COLLIDED with Prometheus's own scrape
      # `job` label (basetool-backend) — on collision Prometheus keeps the scrape value and renames
      # the app tag to `exported_job`, so these alerts had to match the awkward `exported_job` and
      # one silently never fired when it matched plain `job`. TAG_JOB was renamed to `task` to
      # sidestep the reserved name, so match on `task`. The 180d history splits at the rename (old
      # series carry `exported_job`, new ones `task`) — a Grafana annotation marks the cutover.
      #
      # NEVER-SUCCEEDED SENTINEL GUARD (2026-08-10): every rule below reads the last-success gauge
      # through `(… > 0)` rather than bare. All six compute `time() - gauge`, so a gauge value of 0
      # means "last succeeded 1970-01-01" — an age of ~1.79e9 s, above EVERY threshold in this file.
      # TaskMetrics registered the gauge with a 0 sentinel when a run STARTED and only wrote the real
      # timestamp when it finished, and the holder is per-process, so each job's first run after a
      # backend restart published 0 for its whole duration. The prod SC-Wiki sweep runs ~10-15 min
      # (sync-all-items), which outlasts ExternalSyncStale's `for: 10m` — so that alert fired on
      # every restart and self-resolved when the sweep finished (the 2026-08-10 05:27→05:32 CEST
      # pair). TaskMetrics now registers the gauge on the first SUCCESS, seeded with that timestamp,
      # so the sentinel no longer exists; this guard is defence in depth (rules reload without a
      # backend deploy, and it immunises the six rules against a re-introduced sentinel).
      # The filter goes INSIDE the subtraction — `time() - (gauge > 0)` — so the guard is part of the
      # same selector rather than a second copy of it joined back on. An `… and gauge > 0` rewrite is
      # equivalent today (set-operator matching ignores __name__, so the name-dropped left side still
      # matches the right), but it duplicates the selector and would need an explicit `on (task)` the
      # moment the two sides' label sets diverge. Both shapes are covered by
      # tests/staleness_never_succeeded_sentinel_test.yml.
      #
      # Role drift vs. Keycloak: the user sync last succeeded too long ago. The sync now runs once
      # per day at 05:00 (app.keycloak.sync.cron default `0 0 5 * * *` in app.keycloak.sync.zone,
      # moved off the pre-2026-07 1-minute cadence that fed the native-thread exhaustion incident).
      # Normal max staleness right before the next 05:00 run is ~24h, so the 26h threshold fires ~2h
      # after a missed daily run — a single blip past the window is worth a warning for a daily
      # safety-net job — while never tripping on the ordinary 24h cycle. An admin-triggered "Sync
      # now" (POST /api/v1/users/sync) refreshes the same last-success gauge, so a manual run also
      # clears this alert.
      - alert: UserSyncStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="user_sync"} > 0)) > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "User sync stale >26h"
          description: "The Keycloak user sync last succeeded more than 26 hours ago (daily 05:00 cadence, so the last run was missed) — local roles/accounts may drift from Keycloak. Trigger 'Sync now' on the member-management page or check the scheduler/Keycloak."

      # Both catalogue syncs run on a ~24h fixedDelay, so a genuine firing means at least two
      # consecutive runs produced no success. Triage note: a fire that RESOLVES on its own within
      # minutes is not staleness at all — it is the never-succeeded sentinel above (check
      # `changes(process_start_time_seconds[1h])` for a restart, and whether the fire lands one
      # `krt.scwiki.scheduler-initial-delay` after it). A real one stays up until someone acts.
      - alert: ExternalSyncStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task=~"uex_sync|scwiki_sync"} > 0)) > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "External sync stale >48h ({{ $labels.task }})"
          description: "The {{ $labels.task }} catalogue sync last succeeded more than 48 hours ago."

      # (#1041 item 2) Swallowed upstream failures. Every UEX/SC-Wiki fetch/parse error is mapped to an
      # empty list, so the sync job still "succeeds" and last_success stays fresh — ExternalSyncStale /
      # ScheduledJobFailureStreak never fire during a weeks-long catalogue outage. This counts the
      # swallowed failures directly (basetool_external_fetch_errors_total{source}).
      # baseline-tune: >3 errors in 6h is the issue's initial threshold.
      #
      # The healthy baseline for every source is a flat 0 — the threshold buys tolerance for a
      # transient blip, NOT headroom for a standing per-run error count. Until 2026-08-03 the uex
      # series sat at 2 per backend process because UexClient counted UEX's empty result set
      # (`{"status":"ok","http_code":200,"data":null}`, returned for the two permanently empty item
      # categories 12/69) as a fetch error. Two per run is under the threshold on its own, but the
      # counter resets on every backend restart and increase() adds the pre-reset segment back, so
      # two restarts inside the 6h window summed to 4 and fired this alert with no upstream fault
      # behind it. When triaging, first check whether the errors are a per-run baseline
      # (resets(...[6h]) vs changes(process_start_time_seconds[6h])): a fixed count repeating every
      # run points at the client, a burst that does not track the sync cadence points at upstream.
      - alert: ExternalFetchErrors
        expr: sum by (source) (increase(basetool_external_fetch_errors_total[6h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "External fetch errors ({{ $labels.source }})"
          description: "The {{ $labels.source }} client swallowed more than 3 fetch/parse errors in 6 hours — the catalogue sync may be silently importing nothing while still recording a success. Check the upstream API and the sync logs."

      # (logging audit) The Keycloak roster fetch (KeycloakService.fetchUsers) swallows any Admin-API
      # failure into an empty list, so UserSyncService records outcome=success with 0 users and
      # UserSyncStale / UserSyncZeroItems stay quiet — a Keycloak outage is indistinguishable from a
      # legitimately empty roster. basetool_keycloak_sync_fetch_failures_total is the distinct signal;
      # a stalled sync is access-control-relevant (departed users keep their local roles). The series
      # is absent until the first failure, so this cannot fire before one occurs.
      # baseline-tune: any failure in 6h (the sync runs daily plus manual "Sync now").
      - alert: KeycloakSyncFetchFailing
        expr: sum(increase(basetool_keycloak_sync_fetch_failures_total[6h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak user-sync roster fetch failing"
          description: "The Keycloak Admin-API roster fetch threw and was swallowed into an empty roster in the last 6h — the user sync is recording success with zero users while local roles drift from Keycloak (departed users keep access). Check Keycloak reachability and the backend sync logs."

      # (#1041 item 2) Zero-item catalogue outage. An upstream that returns empty 200s processes NO
      # rows, yet the sweep still "succeeds" and last_success stays fresh — so ExternalSyncStale never
      # fires and ExternalFetchErrors stays quiet (an empty 200 is not a fetch error). basetool_
      # scheduled_job_items_total is populated from the same per-run tallies as the sync-report
      # summary (UexItemSyncService upserts / the five SC-Wiki step counts). A 48h flatline at zero
      # while the job keeps succeeding means the catalogue is silently importing nothing.
      #
      # Restart-robust guard (2026-07-17): the second leg is `increase(...executions_total{
      # outcome="success"}[48h]) > 0`, NOT the earlier `(time() - last_success) < 172800`. The items
      # counter is registered lazily (its 0->N birth is never scraped) and resets to 0 on every backend
      # restart, so across restarts more frequent than the 24h sync cadence Prometheus sees a
      # permanently-flat items series and `increase(items[48h])` reads 0 even when every run healthily
      # upserts thousands of rows — while the startup run keeps last_success fresh, so the old
      # last-success leg tripped and SyncZeroItems false-fired continuously (uex_sync + scwiki_sync, the
      # 2026-07-15..17 storm; the syncs were healthy — UEX upserted ~7499 rows/run). executions_total{
      # outcome="success"} shares the items counter's exact lazy-registration + per-restart-reset
      # behaviour, so whenever that artifact drives increase(items) to a false 0 the executions increase
      # is ALSO 0 and the alert is correctly suppressed; a genuine empty-200 outage on a STABLE backend
      # leaves items flat at 0 while executions_success visibly climbs, so the alert still fires. Same
      # robust shape as UserSyncZeroItems below. The `and on (task)` guard matches the two series solely
      # on the job name (their __name__/instance labels differ).
      #
      # 304 carve-out (#1182): a HEALTHY unchanged catalogue is NOT a zero-item run. Both catalogue
      # clients (UexClient / ScWikiClient) do conditional GETs (ETag/If-None-Match), so an unchanged
      # catalogue returns 304 for every category/endpoint and upserts nothing; uex_sync
      # (UexItemSyncService) and each scwiki_sync step therefore report their live row count
      # (countLiveUexItems / countLiveScwiki*) instead of 0 when nothing was upserted but at least one
      # fetch came back 304. Only a genuine empty-200 (no 304 at all) reads as 0 here — so this alert
      # firing means the upstream is really serving empty item responses, not that the catalogue is
      # simply unchanged. Check the upstream feed and the sync-report admin page.
      # baseline-tune: 48h zero-items window is the issue's initial threshold (daily sync cadence).
      - alert: SyncZeroItems
        expr: |
          increase(basetool_scheduled_job_items_total{task=~"uex_sync|scwiki_sync"}[48h]) == 0
          and on (task)
          increase(basetool_scheduled_job_executions_total{task=~"uex_sync|scwiki_sync",outcome="success"}[48h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Catalogue sync importing zero items ({{ $labels.task }})"
          description: "The {{ $labels.task }} sync has recorded successful runs in 48h but processed zero items — the upstream catalogue is likely returning empty responses. Check the upstream API and the sync-report admin page."

      # (logging audit) A single SC-Wiki sync step (ScWikiScheduler.runStep) can throw and be swallowed
      # so the other steps still run: the umbrella scwiki_sync job then records outcome=success with a
      # non-zero item tally, so ScheduledJobFailureStreak / SyncZeroItems / ExternalSyncStale never
      # fire for a persistently-failing single step. basetool_scheduled_job_step_failures_total{step}
      # counts it (step = commodity/vehicle/item/blueprint/manufacturer, a bounded literal).
      # baseline-tune: >=2 failures of the same step in 48h = two consecutive daily runs = persistent.
      - alert: ScWikiStepFailing
        expr: sum by (step) (increase(basetool_scheduled_job_step_failures_total{task="scwiki_sync"}[48h])) > 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SC-Wiki sync step failing ({{ $labels.step }})"
          description: "The {{ $labels.step }} step of the daily SC-Wiki sync has failed on at least two runs in 48h while the umbrella job keeps recording success — that catalogue slice is silently importing nothing. Check the SC-Wiki upstream and the backend sync logs."

      # (PR #1472, review finding 6a) The SC-Wiki tombstone sweep has stood down on every run for
      # three days. ScWikiClient marks a page walk INCOMPLETE whenever it cannot vouch for the census
      # — a page failed mid-walk, meta.last_page went absent while page 1 came back full, or
      # meta.total disagrees with the merged row count — and ScWikiOrphanSweep then refuses to
      # tombstone. That refusal is correct: sweeping a half-walked feed soft-deletes every row that
      # was merely never fetched. But it degrades SILENTLY. If upstream's meta.total turns out to be
      # unfiltered, or off by the include= expansion, `complete` is false on EVERY run and orphan
      # detection is off indefinitely while scwiki_sync keeps recording success with a healthy item
      # tally — ExternalSyncStale, SyncZeroItems and ScWikiStepFailing all stay quiet, and the only
      # trace is a WARN line per run.
      #
      # There is NO metric for "the sweep stood down" — the skip is a log line and nothing else. The
      # closest faithful proxy is basetool_external_fetch_errors_total{source="scwiki"}: every branch
      # that makes a walk incomplete increments it — once per fetch, since the FetchErrorLatch
      # collapses the several symptoms one broken walk can show at the same time into a single
      # increment — so a run whose census was incomplete always contributes at least one. (The
      # converse is a superset: a failed fetch on a pass that feeds no sweep counts here too, which
      # is the safe direction for a "your orphan detection may be off" warning.)
      #
      # The distinguishing feature of this mode is PERSISTENCE across runs, not volume, so the rule
      # checks three CONSECUTIVE daily windows instead of a total: one error in each of the last
      # three 24h windows means the daily sync came back incomplete on three runs running. A total
      # over 72h would equally match three errors inside one bad afternoon, which is the transient
      # ExternalFetchErrors (>3 in 6h) already covers. Both firing together is an ordinary multi-day
      # upstream outage; this one firing alone is the silent-degradation case. The counter is
      # registered lazily on the first error, so all three legs are absent (not zero) until one
      # occurs and the rule cannot fire on a healthy deployment.
      - alert: ScWikiCensusIncompleteStreak
        expr: |
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h])) > 0
          and on ()
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h] offset 24h)) > 0
          and on ()
          sum(increase(basetool_external_fetch_errors_total{source="scwiki"}[24h] offset 48h)) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SC-Wiki page walk incomplete on three consecutive days (orphan sweep standing down)"
          description: "Every one of the last three daily SC-Wiki syncs recorded a fetch/census error, so the page walk was flagged INCOMPLETE and the scwiki_deleted orphan sweep refused to run on all of them — rows the Wiki has actually dropped are no longer being tombstoned, while the sync keeps reporting success. Grep the backend log for 'INCOMPLETE' / 'Skipping the … scwiki_deleted sweep' to see which check fails: a genuinely broken upstream also trips ExternalFetchErrors, whereas this alert alone points at a pagination-contract drift (meta.total counting differently than the merged rows, or meta.last_page renamed)."

      # (#1041 item 3) All-jobs staleness. UserSyncStale/ExternalSyncStale covered only user_sync and
      # the two catalogue syncs; the daily notification-retention purge and the hourly default-
      # blueprint back-fill had no staleness guard. No absent() — the last-success gauge is registered
      # by TaskMetrics only on a job's first SUCCESS, so a job whose bean is config-gated off (or that
      # has not yet completed a run in this process) never publishes it and cannot report a false
      # stale (deliberate, per the issue; see the sentinel-guard note at the top of this group).
      - alert: ScheduledJobStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task=~"notification_retention|default_blueprint_provisioning"} > 0)) > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job stale >26h ({{ $labels.task }})"
          description: "The {{ $labels.task }} job last succeeded more than 26 hours ago — it may have stopped being scheduled."

      # (#1041 item 3) The worst false silence in the stack: if the hourly bank ledger-integrity sweep
      # stops running, basetool_bank_ledger_integrity_violations FREEZES at its last value and
      # BankLedgerIntegrityViolation (critical) can never fire — a broken bank invariant would go
      # undetected. Tighter 6h window (the sweep is hourly) and critical, matching the severity of the
      # invariant it guards.
      - alert: BankLedgerIntegritySweepStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="bank_ledger_integrity"} > 0)) > 21600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Bank ledger-integrity sweep stale >6h"
          description: "The hourly bank ledger-integrity sweep last succeeded more than 6 hours ago. While it is stale the violations gauge is frozen and BankLedgerIntegrityViolation cannot fire — the data-corruption detector is blind. Restore the sweep before trusting a 'no violations' reading."

      # Same false-silence trap as the bank sweep (REQ-ORDERS-033): a stale job-order integrity sweep
      # freezes basetool_job_order_integrity_violations, so JobOrderItemBlueprintDrift can never fire
      # and a "0 drifted lines" reading means nothing. Warning, matching the alert it guards.
      - alert: JobOrderIntegritySweepStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="job_order_integrity"} > 0)) > 21600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Job-order integrity sweep stale >6h"
          description: "The hourly job-order integrity sweep last succeeded more than 6 hours ago. While it is stale the violations gauge is frozen and JobOrderItemBlueprintDrift cannot fire — a blueprint re-point would go undetected. Restore the sweep before trusting a 'no drift' reading."

      # (#1041 item 3) BusinessMetricsCollector.refresh() (every 60s) feeds every approval/work-queue
      # depth gauge. If it wedges, the gauges FREEZE and the *ApprovalOverdue alerts silently consume
      # stale numbers. A last-success age > 10 min means ~10 missed samples — the sampler is stuck.
      - alert: BusinessMetricsStale
        expr: (time() - (basetool_scheduled_job_last_success_timestamp_seconds{task="business_metrics"} > 0)) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business-metrics sampler stale >10min"
          description: "BusinessMetricsCollector.refresh() has not completed successfully in over 10 minutes — the approval/work-queue depth gauges are frozen and the queue-overdue alerts may be evaluating stale values. Check the backend logs for the sampler's failure."

      # (#1041 item 3) Success-with-zero-work detector. A run that returns successfully but synced zero
      # users (Keycloak returned an empty roster) leaves last_success fresh, so UserSyncStale never
      # fires. Zero items while successful runs happened is the tell. The window is [26h] because the
      # sync now runs once per day at 05:00 (app.keycloak.sync.cron): a shorter window would usually
      # contain zero runs, so the `executions > 0` precondition would rarely hold and the detector
      # would miss the empty-roster case. [26h] reliably spans exactly one daily run plus margin. The
      # `and on (task)` matches the two series on the job name only.
      - alert: UserSyncZeroItems
        expr: |
          increase(basetool_scheduled_job_items_total{task="user_sync"}[26h]) == 0
          and on (task)
          increase(basetool_scheduled_job_executions_total{task="user_sync",outcome="success"}[26h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "User sync succeeding but syncing zero users"
          description: "The Keycloak user sync has run successfully but processed zero users over the last day — Keycloak likely returned an empty roster. Check Keycloak and the sync path before local accounts drift from the directory."

      - alert: ScheduledJobFailureStreak
        expr: increase(basetool_scheduled_job_executions_total{outcome="failure"}[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job failing repeatedly ({{ $labels.task }})"
          description: "Job '{{ $labels.task }}' recorded {{ $value }} failed runs in the last hour."

      # Historical optimistic-locking regression indicator (the project's canonical 409 signal).
      - alert: OptimisticLockConflictSpike
        expr: rate(basetool_http_error_total{code="OPTIMISTIC_LOCK"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "409 optimistic-lock conflict spike"
          description: "The backend is returning 409 optimistic-lock conflicts at an elevated rate — a likely locking/version-propagation regression."

      # (#1041 item 6) SERVICE_UNAVAILABLE is incremented exactly when the backend/ingest re-maps an
      # unreachable Keycloak JWKS to a retryable 503 (REQ-SEC-024) — the documented root cause of the
      # past Http5xxRateHigh incident. Detects it minutes earlier and pre-diagnosed.
      - alert: IdentityProviderUnavailable
        expr: sum by (application) (rate(basetool_http_error_total{code="SERVICE_UNAVAILABLE"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Identity provider unavailable (503 spike, {{ $labels.application }})"
          description: "{{ $labels.application }} is re-mapping unreachable-Keycloak-JWKS failures to 503 at an elevated rate — the root cause of the past Http5xxRateHigh incident. Check Keycloak reachability / DNS before 5xx surfaces to users."

      # (#1041 item 6) Authorization-probing signal: 401 (UNAUTHENTICATED) is charted, 403 was not.
      # baseline-tune: 0.2/s is an initial guess; 403s occur normally (guest field redaction), so tune
      # against the baseline week.
      - alert: AccessDeniedSpike
        expr: sum by (application) (rate(basetool_http_error_total{code="ACCESS_DENIED"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "403 access-denied spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is returning 403 access-denied at an elevated rate — possible authorization probing or a broken permission gate after a deploy."

      # (logging audit) The REQ-SEC-017 pending-approval gate 403s every /api/** write from a user who
      # carries only ROLE_PENDING_APPROVAL. It writes the 403 at the servlet-filter level, bypassing
      # GlobalExceptionHandler, so it now increments basetool_http_error_total{code="PENDING_APPROVAL"}
      # directly (like IdentityProviderUnavailableFilter). A spike means a converter / approval-sync
      # regression left legitimate users with only the pending marker and is mass-403ing them — the
      # WARN log was the only prior signal (LogbackErrorSpike is ERROR-only, so it would not catch it).
      # baseline-tune: 0.2/s mirrors AccessDeniedSpike; a genuinely-pending user hits this rarely.
      - alert: PendingApprovalBlockSpike
        expr: sum by (application) (rate(basetool_http_error_total{code="PENDING_APPROVAL"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pending-approval 403 spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is 403-blocking pending-approval users at an elevated rate — likely an authorities-converter or approval-sync regression leaving legitimate users with only ROLE_PENDING_APPROVAL, not just the occasional genuinely-pending account."

      - alert: RateLimitRejectionSpike
        expr: sum by (application) (rate(basetool_ratelimit_rejections_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejection spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is rejecting requests via the rate limiter at an elevated rate."

      # Registration approvals (Discord) and bank booking requests waiting too long.
      #
      # Triage note (REQ-SEC-034, ADR-0140): an admin can reopen a rejected registration back into
      # this queue. The gauge measures from the registration's CREATION time, so a reopened
      # months-old rejection reports that full age immediately rather than "just queued". That is
      # deliberate -- reopen-then-decide within minutes never survives the 10m `for`, and a reopened
      # row left sitting IS overdue -- but do not read a sudden multi-week age as a stuck queue
      # without checking user_approval_event for a recent REOPENED row.
      - alert: RegistrationApprovalOverdue
        expr: basetool_registration_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending registration >48h"
          description: "A user registration has been awaiting approval for more than 48 hours."

      - alert: BankBookingApprovalOverdue
        expr: basetool_bank_booking_request_pending_oldest_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending bank booking request >48h"
          description: "A bank booking request has been awaiting approval for more than 48 hours."

      # (#1041 item 15) Stuck work-queue detection. The oldest-age gauges for the JobOrder / Operation
      # / RefineryOrder / P4K-import queues existed but drove no alert — only registration + bank did.
      # Empty queues report 0 seconds (BusinessMetricsCollector.ageSeconds), so there is no absent()
      # ambiguity: a value over threshold means a real item has been waiting that long.
      #
      # P4K imports run async and should finish in minutes; a pending import older than 6h means the
      # worker is wedged (or died without the startup reconcile flipping it).
      - alert: P4kImportStuck
        expr: basetool_p4k_import_job_pending_oldest_age_seconds > 21600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending P4K import >6h"
          description: "A P4K catalog import has been PENDING for more than 6 hours — imports normally finish in minutes, so the async worker is likely wedged. Check the backend logs and re-run the import."

      # Human work queues (JobOrder OPEN, Operation PLANNED, RefineryOrder OPEN) move on human time,
      # so the threshold is a "someone forgot this exists" floor, not an SLA. baseline-tune: raise/lower
      # once the real queue-age distribution is known for the active org. JobOrder is tuned to 180d for
      # the current org cadence (long-running orders are normal); Refinery/Operation stay at the 30d
      # baseline.
      - alert: JobOrderStale
        expr: basetool_job_order_open_oldest_age_seconds > 15552000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest open job order >180d"
          description: "A job order has been OPEN for more than 180 days — likely abandoned. Close or reassign it (threshold is a baseline; tune to the org's cadence)."

      - alert: RefineryOrderStale
        expr: basetool_refinery_order_open_oldest_age_seconds > 2592000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest open refinery order >30d"
          description: "A refinery order has been OPEN for more than 30 days — likely abandoned. Close or reassign it (threshold is a baseline; tune to the org's cadence)."

      - alert: OperationStale
        expr: basetool_operation_open_oldest_age_seconds > 2592000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest planned operation >30d"
          description: "An operation has been PLANNED for more than 30 days — likely abandoned. Execute, reschedule or cancel it (threshold is a baseline; tune to the org's cadence)."

      # (#1041 item 15) P4K import terminal failures. The pending-queue gauge drains back to 0 after a
      # failed run, so a reliably-failing import looks like a healthy empty queue. This counter is
      # bumped at every terminal transition, so any FAILED outcome (worker error or restart orphan)
      # over 24h surfaces here regardless of the current queue depth.
      - alert: P4kImportFailed
        expr: sum(increase(basetool_p4k_import_jobs_total{outcome="failed"}[24h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P4K import failure in the last 24h"
          description: "At least one P4K catalog import reached FAILED in the last 24 hours. A repeatedly-failing import leaves an empty-looking pending queue; check the job list and backend logs for the error."

      # (#1041 item 16) SMTP mail delivery health. SmtpMailService swallows MailException (log only)
      # and drops mail behind three config gates, so a broken relay or an env-var regression stops
      # admins hearing about pending registrations — today visible only via the LogbackErrorSpike
      # heuristic. basetool_mail_total{outcome} makes each terminal outcome explicit.
      - alert: MailDeliveryFailing
        expr: sum(increase(basetool_mail_total{outcome="failed"}[1h])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SMTP mail delivery failing (>2/h)"
          description: "More than 2 outgoing mails failed to send in the last hour. Check the SMTP relay and the backend logs; registration / approval notifications may be silently lost."

      # A dropped_* outcome means mail was swallowed by one of SmtpMailService's three config gates.
      # by(outcome) so the firing alert names the specific gate.
      #
      # dropped_disabled is DELIBERATELY EXCLUDED (2026-07-25). This rule originally assumed "mail is
      # configured on the monitored deployment, so ANY drop is drift" — that premise is false for prod:
      # `APP_MAIL_ENABLED=false` is the INTENDED steady state there, because re-enabling transactional
      # mail requires a matching e-mail section in the privacy policy first (the mail/privacy
      # coupling). So every prod send took the kill-switch branch and the rule paged every 4h about a
      # policy decision, not a regression — a pure false positive that trained the on-call to ignore the
      # mail alerts entirely. The two REMAINING outcomes are still genuine drift and stay in scope: a
      # blank `spring.mail.host` (dropped_no_host) or a missing JavaMailSender bean (dropped_no_sender)
      # both mean mail was TURNED ON but is silently going nowhere. Because SmtpMailService checks the
      # gates in the order enabled -> host -> sender, those two are unreachable while the kill-switch is
      # off, so this rule is correctly silent today and starts protecting the moment mail is enabled.
      # If the kill-switch is ever flipped off UNINTENTIONALLY, RegistrationApprovalOverdue still
      # catches the user-visible consequence (nobody acts on pending registrations).
      - alert: MailDroppedConfigDrift
        expr: sum by (outcome) (increase(basetool_mail_total{outcome=~"dropped_no_host|dropped_no_sender"}[1h])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mail dropped by a config gate ({{ $labels.outcome }})"
          description: "Outgoing mail was dropped before delivery ({{ $labels.outcome }}) — mail is enabled on this deployment but misconfigured (blank spring.mail.host, or no JavaMailSender bean), so registration / approval notifications are being lost. The deliberate app.mail.enabled=false kill-switch (dropped_disabled) is out of scope for this alert."

      # (#1041 item 17) Dead notification push channel. The backend SSE gauge reads zero while real
      # users are demonstrably browsing — nobody's stream reaches the backend, so everyone silently
      # fell back to the poll. `and on()` broadcasts the cross-target correlation (backend gauge vs
      # frontend request rate, which live on different scrape jobs).
      #
      # The "users are online" guard MUST be live request traffic, NOT `basetool_active_sessions`
      # (amended 2026-07-26). That gauge counts Spring Session entries in Redis, whose authenticated
      # TTL is 720h (`app.session.authenticated-timeout`, REQ-SEC-025) — on prod it sits at ~365
      # against ~30 real principals and NEVER dips, so `> 3` was true 24/7 and the rule degenerated
      # to a bare `basetool_sse_connections == 0 for 30m`. That fires every single night: measured
      # 2026-07-26, SSE fell 25 -> 0 at 00:45Z when the squadron went to bed and returned at 06:30Z,
      # while active_sessions held flat at 362-370 throughout — two firing/resolved mail pairs for a
      # site that was simply idle. A session that has not been touched for three weeks is not a user
      # who is online.
      #
      # The `uri` exclusions strip the infrastructure floor that never sleeps: `/` carries a constant
      # ~0.133 req/s of blackbox probes (https://profit-base.online, 30s interval) plus NPM health,
      # `REDIRECTION` is dominated by those probes' 302 to the login, `NOT_FOUND` is background
      # scanner noise, and `/actuator*` is the scrape/healthcheck surface. What remains is human page
      # traffic: measured 0.04-0.18 req/s while people are on the site and exactly 0.0 across the
      # 02:00-06:00Z dead window, with only ~0.002 req/s of stragglers at the shoulders — so the
      # 0.01 req/s floor (~9 requests per 15m window) separates the two states cleanly. Note the
      # failure direction is safe: if the frontend job disappears entirely the guard goes absent and
      # this alert stays silent, leaving a full outage to TargetDown / blackbox, which own it.
      - alert: SsePushChannelDead
        expr: >-
          (basetool_sse_connections == 0)
          and on()
          (sum(rate(http_server_requests_seconds_count{job="basetool-frontend",
          uri!~"/|/actuator.*|NOT_FOUND|UNKNOWN|REDIRECTION"}[15m])) > 0.01)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Notification SSE push channel dead while users are online"
          description: "The backend has zero live SSE connections for 30 minutes while the frontend is still serving real user page traffic — the notification push channel is down and clients fell back to polling. Check reverse-proxy SSE buffering and the /notifications/stream relay."

      # (#1127) SSE relay pool near saturation — early warning for the silently-dropped-viewer
      # failure. The frontend->backend notification relay runs on a dedicated 1000-connection pool
      # (frontend-sse-pool in WebClientConfig); each live viewer holds one slot for as long as their
      # page is open, and past the 1000th concurrent viewer a new relay blocks on pendingAcquireTimeout
      # and then silently drops that user's live push. The basetool_notification_relay_connections
      # gauge counts the open relays held on this instance; >0.8 of the 1000 ceiling for 10m warns the
      # pool is about to start dropping viewers. Mirrors BulkheadNearSaturation (apps.yml).
      - alert: SseRelayPoolNearSaturation
        expr: basetool_notification_relay_connections > 800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification SSE relay pool near saturation"
          description: "The frontend has held more than 800 of its 1000 SSE relay slots for 10 minutes — past 1000 the next live viewer's push is silently dropped. Check the concurrent viewer count and per-user stream multiplication; consider raising frontend-sse-pool maxConnections or capping streams per user."

      # (REQ-SEC-025) Runaway session store. basetool_active_sessions counts live Spring
      # Session sessions in Redis. Un-authenticated requests mint throwaway sessions (a CSRF-token
      # render on a permit-all page, pre-login OAuth2 state); before the two-tier-TTL fix these
      # inherited the 30-day authenticated window and accreted to >16000 orphan CSRF-only sessions
      # against ~30 real principals, heading for the Redis `maxmemory noeviction` wall where login /
      # token-refresh writes start failing. Post-fix the anonymous window is short, so steady state is
      # a few hundred (concurrent logged-in users x devices, capped at maximumSessions=10, plus a
      # small anonymous float). >2000 for 1h therefore means the anonymous-session TTL split regressed
      # (or a genuine surge) — with days of lead time before the Redis ceiling.
      - alert: ActiveSessionsRunaway
        expr: basetool_active_sessions > 2000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Frontend session store growing unbounded (>2000 active sessions)"
          description: "basetool_active_sessions has held above 2000 for 1h. Expected steady state is a few hundred; a sustained climb means anonymous/orphan sessions are accreting again (REQ-SEC-025 two-tier TTL regressed) and Redis is heading for its maxmemory noeviction ceiling. Check the session store size (redis SCAN 'basetool:session:sessions:*') and the created-vs-login ratio."

      # (PR #1472) Concurrent-session evictions. Spring Security expires a principal's OLDEST session
      # once maximumSessions (10, SecurityConfig.MAX_CONCURRENT_SESSIONS) is exceeded, and until
      # SessionEvictionLoggingStrategy was wired that left no usable trace: Spring's own account of it
      # is DEBUG on org.springframework.security, which the app pins to INFO, and
      # ActiveSessionsRunaway above is blind to it because expireNow() only MARKS the session — the
      # registry entry and the Redis key both survive, so basetool_active_sessions does not so much as
      # dip. The visible end of the chain was a member's unexplained logout and nothing else.
      #
      # Eviction is rare BY CONSTRUCTION: a real user has to hold ten live sessions before the
      # eleventh login evicts anything, and then hovers at the cap producing at most one eviction per
      # further login. So this is not tuned against a busy baseline — it is tuned to separate that
      # from the failure mode the counter was written for, which looks identical from the outside: a
      # session registry that stopped reaping stale Redis entries, so the cap fills with DEAD sessions
      # and every fresh login evicts a LIVE one. That mode is not a burst but a floor that never
      # returns to zero, so the rule is a sustained rate — the `for` clause, not the count, is what
      # carries it. When it fires alongside ActiveSessionsRunaway the registry is leaking on both
      # ends; on its own it means the registry is stale rather than merely large.
      # baseline-tune: >3 evictions in 1h, held 30m (a member cycling devices produces one or two and
      # stops).
      - alert: SessionEvictionSpike
        expr: sum(increase(basetool_session_evicted_total[1h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Concurrent-session evictions sustained (session registry may be stale)"
          description: "The frontend has evicted more than 3 sessions per hour for 30 minutes because the per-principal concurrent-session cap (10) was full. Members are being logged out with 'This session has been expired'. A sustained stream means the session registry is holding dead Redis sessions against the cap rather than users genuinely cycling more than ten devices — check the registry against the live Redis keys (SCAN 'basetool:session:sessions:*') and correlate with ActiveSessionsRunaway; the backend log line names the cap and the victim's userId (sub)."

      # (#1041 item 18) Frontend login broken. This alert exists to catch the ONE break mode no other
      # signal sees: the code-to-token / JWKS / bad-IdP-response failure that hits AFTER the user has
      # already authenticated at Keycloak, so Keycloak emits no login_error user event and
      # KeycloakLoginErrorSpike's regex misses it. That failure class maps to reason="provider_error"
      # in LoginFailureMetricsHandler — so the failure side is scoped to that bucket.
      #
      # It is deliberately NOT scoped to all failures. The earlier `failure > 0 unless success > 0`
      # false-fired (2026-07-12): members hold 30-day "stay logged in" sessions, so genuinely fresh
      # successful logins are sparse — frequently ZERO per 15m window, especially off-hours — while a
      # single benign failure is trivial to produce. Unauthenticated bots/scanners hitting the OAuth
      # callback /login/oauth2/code/keycloak (BotProtectionFilter does NOT shield it) raise
      # reason="invalid_request" (a bare/partial callback is not a valid authorization response, so
      # OAuth2LoginAuthenticationFilter rejects it BEFORE any token exchange), and abandoned /
      # expired-state / back-button logins raise the state codes — LoginFailureMetricsHandler folds
      # ALL of these into the benign reason="invalid_state" bucket (2026-07-15 fix), so none of this
      # noise reaches provider_error. Before that fix invalid_request leaked into provider_error and
      # off-peak scanner traffic tripped this alert with nothing broken. So "provider_error failures
      # with zero successes" is now the token-exchange break mode only. A genuine all-users
      # state/session-loss break (SameSite or cookie-domain regression, Redis unreachable, broken
      # session deserialisation) shows as invalid_state, corroborated by the frontend `redis`
      # readiness indicator / TargetDown / deploy-time e2e — folding it in here is exactly what made
      # this alert noisy.
      #
      # >= 3 over 15m + for:10m: a real code-to-token/JWKS break fails EVERY attempt so provider_error
      # climbs fast and stays, while a lone transient token-endpoint blip (one flaky exchange, a brief
      # Keycloak restart) stays under the floor or does not sustain 10m. The `unless success > 0` guard
      # remains: any fresh success in the window proves login is not broken for everyone (a genuine
      # total break yields zero successes), so `unless` (not `and ... == 0`) still trips on the absent
      # success series instead of evaluating to no-data.
      - alert: FrontendLoginBroken
        expr: sum(increase(basetool_login_total{outcome="failure", reason="provider_error"}[15m])) >= 3 unless sum(increase(basetool_login_total{outcome="success"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frontend logins failing at the token exchange with zero successes"
          description: "The frontend recorded repeated OAuth2 provider errors (failed code-to-token exchange, JWKS or bad IdP response) and no successful logins in the last 15 minutes — login is likely broken for everyone at the token-exchange step. Check the frontend logs, Keycloak reachability from the frontend (issuer-uri / JWKS endpoint) and the OIDC client config. State/session-loss breaks surface as invalid_state and via the frontend redis readiness indicator instead."

      # (#1041 item 18) CSRF rejection spike. krtFetch's silent single-retry self-heal masks a
      # systematic CSRF-wiring regression as intermittent failed writes; the counter makes the rate
      # visible. A sustained rate is a wiring regression, not the occasional stale token.
      - alert: CsrfRejectionSpike
        expr: sum(rate(basetool_csrf_rejections_total[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Elevated CSRF-token rejection rate"
          description: "The frontend has been rejecting CSRF tokens at more than 0.1/s for 15 minutes — likely a systematic CSRF-wiring regression rather than occasional stale tokens (which krtFetch self-heals). Check recent security/template changes and the /csrf endpoint."

      # (PR #1472) Browser-side failures reported by the client error beacon (krt-client-error.js ->
      # ClientErrorReportController). A JS exception that kills a krtFetch handler produces NO
      # request, so it leaves no access-log line, no http_server_requests sample and no 5xx — "the
      # button did nothing" was a user report and nothing else. The controller logs at DEBUG on
      # purpose (any authenticated tab can trigger the endpoint at frame rate, so INFO/WARN would be
      # a self-inflicted log flood, REQ-OBS-001), which makes basetool_client_error_total the only
      # always-on signal — and this rule is what makes it one that is actually watched.
      #
      # Why a step change rather than an absolute ceiling: a handful of client errors is permanent
      # background — old browsers, extensions injecting into the page, a resource_error from a tab
      # left open across a deploy that still references the previous asset build. A fixed ceiling
      # either sits above that floor, and then misses a broken surface only a few members use, or
      # below it, and then fires forever. What is diagnostic is the SHAPE: a deploy that breaks the
      # client half of a live-update surface makes one `kind` jump within the hour and stay up.
      #
      # The baseline is the SAME series over 24h, deliberately not `offset 1d`: the counter is
      # registered lazily on the first report, so an offset comparison has an absent-baseline hole
      # (no series a day ago -> no right-hand side -> the rule silently never fires), whereas the
      # trailing window exists whenever the 1h window does. The spike hour is part of its own
      # denominator, which caps the achievable ratio at 24 and keeps the trigger honest. Per `kind`
      # (three bounded literals) so one class stepping up is not diluted by the other two.
      # baseline-tune: >20 reports/h of one kind AND >3x that kind's own daily average, held 30m.
      - alert: ClientErrorSpike
        expr: |
          sum by (kind) (increase(basetool_client_error_total[1h])) > 20
          and
          sum by (kind) (increase(basetool_client_error_total[1h])) > 3 * sum by (kind) (increase(basetool_client_error_total[24h])) / 24
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Browser client errors stepped up ({{ $labels.kind }})"
          description: "The frontend's client-error beacon has reported {{ $labels.kind }} failures well above their own daily baseline for 30 minutes — the browser half of a page is throwing, which produces no server-side error of any kind. Check what shipped in the last frontend deploy; a script_error / unhandled_rejection step means a krtFetch handler is dying (live update silently stops working on that surface), a resource_error step means an asset the templates still reference is 404ing. Raise ClientErrorReportController to DEBUG via /actuator/loggers to get the message and script URL for the duration of the investigation."

      # (#1041 item 19) Discord SPI precheck abuse. The endpoint sits outside /api/**, the rate
      # limiter AND the http_error funnel, so secret-guessing was previously log-only. A sustained
      # unauthorized rate is a brute-force attempt against the shared secret.
      # baseline-tune: the SPI is called only during first-broker-login, so any steady 401 stream is
      # already suspect; 0.1/s is a conservative starting threshold.
      - alert: DiscordPrecheckUnauthorizedSpike
        expr: sum(rate(basetool_discord_precheck_total{outcome="unauthorized"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Discord precheck unauthorized-rate elevated"
          description: "The Discord account-existence precheck has been returning 401 at more than 0.1/s for 10 minutes — likely someone guessing the X-KRT-SPI-Secret. Verify the SPI's configured secret matches the backend and check for abuse."

      # On prod the shared secret IS configured, so a `disabled` (503, blank-secret) outcome means
      # the secret regressed to blank after a rotation — the SPI then fails open and every Discord
      # login skips the duplicate-account precheck.
      - alert: DiscordPrecheckDisabledOnProd
        expr: sum(increase(basetool_discord_precheck_total{outcome="disabled"}[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Discord precheck disabled (blank secret) on prod"
          description: "The Discord account-existence precheck answered 503 (no shared secret configured) on a deployment where it should be enabled — a config-drift regression after a secret rotation. The SPI is now failing open; restore the X-KRT-SPI-Secret."

      # (#1041 item 19) Rate-limit rejection ratio. The rejections counter alone only fires AFTER
      # 429s begin; requests_total gives the denominator so a rising ratio surfaces the pressure
      # earlier. Per (application, bucket) so a single abusive bucket is not diluted by healthy ones.
      # baseline-tune: 1% sustained is the issue's initial threshold.
      - alert: RateLimitRejectionRatioHigh
        expr: (sum by (application, bucket) (rate(basetool_ratelimit_rejections_total[10m])) / sum by (application, bucket) (rate(basetool_ratelimit_requests_total[10m]))) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejection ratio >1% ({{ $labels.application }}/{{ $labels.bucket }})"
          description: "More than 1% of rate-limit evaluations on {{ $labels.application }} bucket {{ $labels.bucket }} have been rejected for 15 minutes — sustained pressure or abuse against that budget. Check the source and whether the limit needs tuning."

      # Audit silence: backend up but zero audited mutations recorded across a 5-DAY window — a
      # REQ-AUDIT-001 signal that audit logging may be broken. 5d (not hours) so ordinary quiet periods
      # (weekends, maintenance windows) never trip it; only a genuine multi-day silence does. Resolves
      # on the first audited action and stays quiet as long as one lands within any 5-day window.
      - alert: AuditSilenceAnomaly
        expr: (sum(increase(basetool_audit_events_total[5d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No audit events recorded in 5d while backend is up"
          description: "The backend has been up but recorded zero audit events for 5 days — possible audit-logging regression (REQ-AUDIT-001)."

      # (#1041 item 10) Bank audit silence. The bank — the most sensitive audited area — keeps its own
      # bank_audit_event table (deliberately excluded from AuditDomain), so AuditSilenceAnomaly above
      # is blind to it. Same 60-day-silence-while-up shape on the dedicated bank counter (counts only,
      # no amounts). Resolves on the first bank audit event within any 60-day window.
      - alert: BankAuditSilenceAnomaly
        expr: (sum(increase(basetool_bank_audit_events_total[60d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No bank audit events recorded in 60d while backend is up"
          description: "The backend has been up but recorded zero bank audit events for 60 days — possible bank audit-logging regression (REQ-AUDIT-001). Every bank mutation must write a bank_audit_event row."

      # (#1041 item 10) Per-domain audit silence. AuditSilenceAnomaly sums across all domains, so one
      # domain losing its audit wiring in a refactor (the exact REQ-AUDIT-001 failure mode) is masked
      # as long as any other domain stays active. This fires per domain.
      #
      # EXCLUSIONS — the domains whose silence carries no signal, and which therefore never notify at
      # any horizon: PROMOTION, PERSONAL_INVENTORY, MARKET (the Materialbörse is a young, bursty trade
      # board) and, since 2026-08-16, ROLE. ROLE covers role/membership admin, Kommando groups and
      # user deletion — admin actions, not daily traffic — so a fortnight without one is an ordinary
      # quiet period. It sat in the alerted set until then and fired continuously through every such
      # period: the condition is a LEVEL, not an event, so once true it re-notified on the
      # Alertmanager repeat_interval (four-hourly at the time; the mail cadence has since moved to
      # one notification per event) until somebody finally changed a role. Silence in
      # all four is reviewed on the 07 dashboard's per-domain tables (14d and 60d) instead of paged —
      # a deliberate trade of coverage for signal, decided by @greluc.
      #
      # Everything NOT named above is alerted, so a newly added AuditDomain is covered by default and
      # exempting it has to be a deliberate edit here rather than an omission. A domain that never
      # emitted has no series and cannot fire; only one that WAS active and went silent 14d does.
      # baseline-tune: the 14d window suits an active org; a very quiet squadron may need it widened.
      - alert: AuditDomainSilenceAnomaly
        expr: (sum by (domain) (increase(basetool_audit_events_total{domain!~"ROLE|PROMOTION|PERSONAL_INVENTORY|MARKET"}[14d])) == 0) and on() (up{job="basetool-backend"} == 1)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Audit domain silent 14d ({{ $labels.domain }})"
          description: "The {{ $labels.domain }} audit domain recorded zero events in 14 days while the backend is up — this domain may have lost its audit wiring (REQ-AUDIT-001) even though other domains are still active."

      # Frontend → backend call failures (bounded reason/method), sustained.
      - alert: BackendCallFailureSustained
        expr: sum(rate(basetool_backend_client_errors_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained frontend→backend call failures"
          description: "The frontend's backend-call failure rate has been elevated for 10 minutes ({{ $value }}/s)."

      # (#1041 item 1) Ingest handoff relay health. WoltLab is the account source of truth, so a dead
      # relay means identity-data drift that otherwise only surfaces much later via user-sync staleness.
      # The metrics (basetool_ingest_handoff_total/_errors_total) already ship from the ingest module.
      # baseline-tune: 0.05/s error rate is the issue's initial threshold.
      - alert: IngestHandoffErrors
        expr: sum by (reason) (rate(basetool_ingest_handoff_errors_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest handoff errors ({{ $labels.reason }})"
          description: "The ingest gateway is failing to relay handoffs (reason: {{ $labels.reason }}) at an elevated rate — WoltLab identity data may be drifting from basetool."

      - alert: IngestBackendUnavailable
        expr: rate(basetool_ingest_handoff_errors_total{reason="backend_unavailable"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest cannot reach the backend (handoffs failing)"
          description: "The ingest gateway could not reach the backend to relay handoffs in the last 5 minutes — staged identity data is not being applied. Check backend health and the ingest→backend path."

      # The Redis handoff staging (REQ-INGEST-003) is the gateway's only data store. When it is
      # unreachable the backend relay has already SUCCEEDED and only the browser pickup cannot be
      # parked, so the caller gets a retryable 503 — a very different operator action from
      # IngestBackendUnavailable, which is why this reason has its own alert instead of relying on
      # the by-reason IngestHandoffErrors threshold. Any sustained rate here means every ingest is
      # failing at the last step: check the redis container and the gateway's REDIS_* config.
      - alert: IngestStagingUnavailable
        expr: rate(basetool_ingest_handoff_errors_total{reason="staging_unavailable"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest cannot stage handoffs (Redis unreachable)"
          description: "The ingest gateway relayed the import to the backend but could not stage the draft in Redis for browser pickup — every send ends in a 503 and no pre-filled form opens. Check the redis container and the ingest Redis configuration."

      # (logging audit) The oversized-body DoS guard (PayloadSizeLimitFilter, INGEST-DOS-1) rejects a
      # too-large /v1 body with 413. It was previously silent — no log, no metric — unlike the sibling
      # bot / rate-limit filters, so a flood of oversized-body probes against the only internet-facing
      # surface was undetectable. basetool_ingest_payload_rejected_total counts each reject.
      # baseline-tune: >0.2/s sustained is a probing/DoS pattern (a real oversized upload is rare).
      - alert: IngestPayloadRejectedSpike
        expr: rate(basetool_ingest_payload_rejected_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest oversized-payload rejections spiking"
          description: "The ingest gateway is refusing oversized /v1 request bodies (413) at an elevated rate — likely an oversized-body probing / DoS attempt against the public ingest surface, or a misconfigured client. Check the NPM edge and the fail2ban jails."

      # (REQ-INGEST-011) The client-identity gate refused a caller whose CLIENT SOFTWARE is not
      # approved for the ingest path — the interface is restricted to clients the basetool developer
      # has explicitly approved (a Keycloak client registration plus an allowlist entry). Reaching
      # this point required a VALID realm token, so unlike the pre-auth bot / rate-limit rejects it
      # cannot be produced by an anonymous scanner and every occurrence is worth a look.
      #
      # The reason separates the two very different causes, which is why it is kept as a label:
      #   unknown_client / bad_provenance -> a foreign tool is calling the ingress
      #   missing_azp / missing_scope     -> a Keycloak mapper or scope assignment regressed, i.e.
      #                                      SELF-INFLICTED, and the legitimate extractor is being
      #                                      locked out right now
      # It also fires while `audit-only` is set (the gate counts what it WOULD have rejected), which
      # is exactly how the operator measures the blast radius before enforcing.
      #
      # Threshold: any sustained occurrence. This is deliberately not baseline-tuned away — a single
      # foreign client calling once a minute is the signal, not noise.
      - alert: IngestUnknownClient
        expr: sum by (reason) (rate(basetool_ingest_client_rejected_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest client-identity gate rejecting callers ({{ $labels.reason }})"
          description: "The ingest gateway refused a caller under reason '{{ $labels.reason }}'. unknown_client/bad_provenance means an unapproved tool is calling the restricted ingest interface; missing_azp/missing_scope means a Keycloak mapper or scope assignment regressed and the official extractor may be locked out. Check the gateway log for the matching WARN and the allowlist in APP_INGEST_CLIENT_IDENTITY_ALLOWED_CLIENT_IDS."

      # A8 / REQ-OBS-018: a client nobody registered here is driving the backend API.
      #
      # The backend counterpart of IngestUnknownClient above, and deliberately weaker: the ingest
      # gateway REFUSES an unlisted client, this one only counts it. The backend serves whichever
      # first-party clients the realm carries, and 403ing an unrecognised azp would lock out a
      # client the day it is registered in Keycloak and before it reaches a properties file. So the
      # allowlist bounds the label and this rule is what turns "counted" into "noticed".
      #
      # Reading it: client_id="other" means a token minted for some OTHER realm client called
      # /api/**. That is not automatically an attack — a new first-party client that nobody added
      # to app.monitoring.api-clients.known-client-ids reads identically — but both cases want the
      # same first move: find out which client, from the Keycloak event log or the vhost access log,
      # and then either register it or revoke it.
      #
      # Threshold: any sustained occurrence, like its ingest sibling. A foreign client calling once
      # a minute is the signal, not the noise. It counts requests the downstream gates went on to
      # refuse, on purpose — a client must not be able to hide behind its own 403s and 429s.
      - alert: ApiUnknownClient
        expr: sum (rate(basetool_api_client_requests_total{client_id="other"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unregistered client software is calling the backend API"
          description: "A token whose azp names no known client drove /api/** for 10 minutes. Either a first-party client was added to the realm without being added to app.monitoring.api-clients.known-client-ids, or something nobody approved is using the API. Identify it from the Keycloak client sessions and the api vhost access log; the label is deliberately bounded to 'other' and will never name it."

      # STAGED (REQ-OBS-014) — do NOT uncomment before the verification in
      # docs/MONITORING_ROLLOUT_RUNBOOK.md, Appendix C.
      #
      # client_id="none" means an authenticated caller whose token carries no azp claim at all.
      # Unlike "other" that is not a foreign client but a Keycloak mapper regression, and it blinds
      # the attribution for every client at once — worth alerting on precisely because nothing else
      # would notice. It ships disabled because the opposite failure is worse: if some legitimate
      # flow in this realm mints tokens without azp, the rule fires the day it merges and keeps
      # firing, and a permanently-firing rule is how an operator learns to ignore a channel. Enable
      # it once a week of production data shows the series flat at zero.
      # - alert: ApiClientAttributionBlind
      #   expr: sum (rate(basetool_api_client_requests_total{client_id="none"}[10m])) > 0
      #   for: 15m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "API requests arrive without a client identity (azp missing)"
      #     description: "Authenticated /api/** requests carry no azp claim, so basetool_api_client_requests_total can no longer attribute traffic to a client and ApiUnknownClient is blind. This is a realm-side regression (a removed/renamed protocol mapper on the client's dedicated scope), not a caller problem."

      # Terms-of-Use consent rollout stalled (REQ-SEC-028). After a wording change every member is
      # blocked until they accept, so the gate refusing callers is EXPECTED for a while — what is
      # not expected is refusals continuing while nobody gets through, which is what a broken
      # consent path looks like from the outside.
      #
      # Deliberately a conjunction. A flat basetool_terms_accepted_users alone proves nothing (it is
      # flat all night because nobody is online), and refusals alone are the feature working. Only
      # "people are hitting the gate AND none of them is getting past it" is a defect.
      #
      # `or vector(0)` is load-bearing: basetool_terms_acceptances_total does not exist as a series
      # until the first acceptance ever recorded, and an absent series makes the `and` yield nothing
      # — the alert could never fire in exactly the situation it is meant to catch (nobody has
      # managed to accept). See the increase()-cannot-fire trap.
      # Reads SUBJECTS, not requests. The refusal RATE cannot separate "the membership is locked
      # out" from "one client is retrying": 0.01/s is one refusal per 100 s, while a single consent
      # page render costs ~3, so any automated caller sustains the old threshold indefinitely. That
      # is how this fired twice overnight on 2026-08-03 with nobody awake — one browser tab whose
      # EventSource had been redirected into a reconnect loop (fixed separately). A looping tab, a
      # member reading the terms slowly, and a straggler whose extractor keeps retrying are each ONE
      # subject and can no longer fire it.
      #
      # max(), never sum(): the gauge is per process, so a subject refused on two instances would
      # otherwise count twice. >= 3 distinct people locked out simultaneously is the shape of a
      # broken consent path; for: 1h beats a deliberate read of a legal document, which the old 30m
      # did not. Known and accepted fail-quiet: a backend restart inside the 2h window makes
      # increase() extrapolate a phantom acceptance and suppresses the alert until it clears.

      # The gateway calls the backend under its own identity since ADR-0129, so this
      # client-credentials grant sits on the critical path of EVERY ingest upload. If it fails,
      # nobody can send, and the failure is in a hop no client can see or report — the extractor
      # only ever shows the gateway's 5xx. Any sustained failure is therefore worth waking up for.
      - alert: IngestServiceAccountTokenFailing
        expr: >-
          sum(rate(basetool_ingest_service_account_token_total{outcome="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway cannot obtain its own backend token"
          description: "The ingest gateway's client-credentials grant against Keycloak has been failing for 10 minutes. Every upload from the desktop extractor is refused for as long as this lasts, and the extractor cannot tell the user why. Check the gateway's app.ingest.service-account.* configuration, the client secret, and whether Keycloak is reachable from the gateway."

      # An impersonation attempt, or a misconfigured gateway client id - and the two are worth
      # telling apart quickly. The on-behalf-of header is the only way any caller can act as
      # somebody else in this application, so a non-zero rate is never routine.
      - alert: OnBehalfOfRefusedSpike
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="not_a_gateway"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Something other than the ingest gateway is sending an on-behalf-of header"
          description: "The backend refused an X-Ingest-On-Behalf-Of header from a caller whose azp is not on the gateway allowlist, repeatedly. Either app.security.ingest-gateway.client-ids does not match the gateway's actual client id - in which case ingest uploads are also failing - or somebody is probing for an impersonation primitive. Check the gateway's own token first, then the access log for the source."

      # A named subject does not expire the way a token does. That asymmetry is the whole reason
      # the liveness bound exists (ADR-0129), and this is the counter that says it is holding.
      # Two very different causes land here, and the runbook step is to tell them apart:
      #   - an offboarded member whose extractor is still installed and still sending, which is
      #     benign but should end with uninstalling it; and
      #   - a caller walking UUIDs to find out which subjects exist, which is not. The refusal is
      #     byte-identical for both by design, so this metric is the ONLY place they differ.
      # No `for:` clause as low as the others: a single refusal is meaningful here, but a
      # decommissioned laptop retrying on a schedule would flap a 0-tolerance rule, so this asks
      # for a sustained rate instead.
      - alert: ActingMemberNotLiveRefused
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="member_not_live"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Ingest gateway is naming a member the backend will not act for"
          description: "The backend has been refusing on-behalf-of requests for a member that is either unknown locally or that the last Keycloak roster sync no longer found. Most likely an offboarded member whose desktop extractor is still running - find them via the correlationId in the backend log and have it uninstalled. If the refused subjects VARY, this is somebody enumerating user ids instead, and the source belongs in the access log."

      # Two causes, and the rate tells them apart. The header ships in the extractor and is
      # documented, so an unauthenticated caller CAN send it - a probe, or a client whose token
      # expired mid-upload. That is ambient and single-shot. A sustained rate means the filter
      # cannot see a caller that should be there, i.e. the chain was reordered ahead of it, which
      # is the class of bug ADR-0129 was written after.
      # NOT a >0-over-an-hour rule: this reason was briefly reachable from ANY path, and that
      # version fired for a full hour off one internet probe. The endpoint bound now runs first, so
      # only the two ingest endpoints can produce it, and a sustained rate is meaningful.
      - alert: OnBehalfOfWithoutAuthenticatedCaller
        expr: >-
          sum(rate(basetool_on_behalf_of_refused_total{reason="no_authenticated_caller"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Sustained on-behalf-of traffic at an ingest endpoint with no authenticated caller"
          description: "ActingMemberFilter has been refusing on-behalf-of requests at an ingest endpoint because the SecurityContext held no authenticated caller, for half an hour. A single occurrence is a probe or an expired token; a sustained rate is not. Check whether ingest uploads are also failing - if they are, suspect the security filter chain being reordered ahead of this filter (compare SecurityConfig's addFilterAfter ordering against ADR-0129) or authentication failing silently. If uploads are fine, this is an unauthenticated caller sending the header, and the access log has the source."
      - alert: TermsConsentRolloutStalled
        expr: |
          (max(basetool_terms_refused_subjects) >= 3)
          and
          ((sum(increase(basetool_terms_acceptances_total[2h])) or vector(0)) == 0)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Terms-of-Use consent gate locking out several members, none getting through"
          description: "At least three distinct members have been refused by the consent gate for an hour while not a single acceptance was recorded in the last two hours. Expected right after a terms change only if nobody has logged in; otherwise the consent path is broken and those members are locked out of the tool AND the desktop extractor. Check /admin/terms for who is outstanding, and the frontend log for failures on POST /terms/accept."

      # Backend oversized-JSON-body rejections (RequestBodySizeLimitFilter) on the capped import
      # endpoints (refinery import-extract). baseline-tune: >0.2/s sustained is a probing/DoS pattern.
      - alert: RequestBodyRejectedSpike
        expr: rate(basetool_request_body_rejected_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend oversized request-body rejections spiking"
          description: "The backend is refusing oversized non-multipart JSON request bodies (413) on a capped import path at an elevated rate — likely a memory-DoS probing attempt against the refinery import-extract endpoint, or a misconfigured client bypassing the frontend proxy cap."

      # Keycloak login errors / Discord IdP broker error spike (primary login path).
      - alert: KeycloakLoginErrorSpike
        expr: rate(keycloak_user_events_total{event=~"login_error|identity_provider_login_error"}[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak login-error spike"
          description: "Keycloak is emitting login_error / IdP-error events at an elevated rate."

      # (#1041 item 6) KeycloakLoginErrorSpike reads keycloak_user_events_total; if Keycloak's event
      # metrics subsystem stops exporting while Keycloak itself is up, that alert goes silent (not
      # firing) with no other signal. This catches the absence directly.
      - alert: KeycloakEventMetricsAbsent
        expr: absent(keycloak_user_events_total) and on() (up{job="keycloak"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak user-event metrics absent while Keycloak is up"
          description: "keycloak_user_events_total is not being exported while the Keycloak scrape is up — KeycloakLoginErrorSpike is blind. Check the Keycloak metrics/event listener config."

      # (#1102, REQ-FE-015 / ADR-0094) Redis fan-out for cross-replica live delivery is erroring.
      # Both the live-sync changed-relay (basetool_livesync_redis_errors_total, frontend) and the
      # notification SSE fan-out (basetool_sse_redis_errors_total, backend) publish each locally-relayed
      # signal onto a Redis pub/sub channel so peer replicas relay it to their own rooms. The publish is
      # fire-and-forget AFTER the local relay, so a publish error does NOT drop same-replica delivery —
      # it silently degrades to single-instance: a viewer on replica A stops seeing changes/notifications
      # made on replica B, with no user-facing error and no 5xx. Only fires where the fan-out is enabled
      # (prod): a disabled fan-out issues no publishes and therefore no errors, so this never trips in
      # single-instance dev. Sustained publish errors mean the Redis channel is unreachable from a
      # replica (Redis down, ACL/network drift) — check Redis and the basetool:livesync:changed /
      # basetool:notify:published channels (the default user needs `&*` for PUBLISH/SUBSCRIBE).
      # The op="publish" selector is deliberate and load-bearing: since #1237/ADR-0126 the frontend
      # also gossips editor-presence snapshots on a THIRD channel (basetool:livesync:presence),
      # whose failures count under op="presence_publish"/"presence_consume". Those stay OUT of this
      # expression on purpose — a lost changed frame leaves a peer acting on stale data, a lost
      # presence gossip costs a cosmetic dot. Presence errors are visible on the `07` Redis fan-out
      # panel instead. If presence ever stops being cosmetic, widen the selector here, not the tag.
      - alert: LiveSyncRedisFanoutBroken
        expr: sum(rate(basetool_livesync_redis_errors_total{op="publish"}[5m])) > 0 or sum(rate(basetool_sse_redis_errors_total{op="publish"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis live-sync/notification fan-out publish errors (cross-replica delivery degraded)"
          description: "The live-sync and/or notification Redis fan-out has failed to publish for 10 minutes — cross-replica live delivery is silently degraded to single-instance (a viewer on one replica stops seeing another replica's changes/notifications; same-replica delivery still works, no user-facing error). Check Redis reachability from the app replicas and the basetool:livesync:changed / basetool:notify:published pub/sub channels (default-user ACL `&*`)."

      # (#1238, REQ-OBS-011) Live-sync relay drops. Every drop branch of the relay means a peer did
      # NOT get an update it should have had: a throttled or topic-throttled `changed` frame, a write
      # to a broken socket, a subscribe refused at the per-session topic cap, or a subscribe that
      # failed OPEN because the authorization executor was saturated. All of them leave a viewer
      # silently stale — no error client-side, no 5xx, nothing else to see it by.
      #
      # THRESHOLD IS MEASURED, NOT GUESSED. #1102 deferred this alert until a production baseline
      # existed; the baseline was read on 2026-08-03 over the preceding 21 days and is *exactly
      # zero*: `basetool_presence_relay_dropped_total` had not a single series in prod — Micrometer
      # creates a counter lazily on first increment, so an empty vector means no drop branch has ever
      # been taken, on any of the nine topic classes. Relay volume over the same window was small
      # (mission 1175 `changed` frames, then 53/53/12/10/7/2 for inventory_all, materialboard,
      # order_detail, bank_staff, orgunit_bank and bank_account; orders_queue 0), so the token
      # buckets (burst 24, refill 1/s) are nowhere near being exercised. Against a three-week zero,
      # >3 drops in an hour is a strong anomaly signal and still leaves headroom for the one drop
      # class that CAN occur benignly: `send_failed` races when a socket closes between the
      # `isOpen()` pre-check and the write. A one-off race can never reach 4/h, so it stays silent.
      #
      # `section_filtered` is deliberately excluded here — it is a code-skew defect, not a capacity
      # signal, and needs the far lower threshold of LiveSyncSectionKeySkew below.
      - alert: LiveSyncRelayDropsSustained
        expr: sum by (topic_class, reason) (increase(basetool_presence_relay_dropped_total{reason!="section_filtered"}[1h])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Live-sync relay dropping frames on {{ $labels.topic_class }} ({{ $labels.reason }})"
          description: "The live-sync relay dropped more than 3 frames in an hour on topic class {{ $labels.topic_class }} for reason {{ $labels.reason }}, sustained for 15m — peers on that surface are silently missing updates. Prod baseline for this counter is zero over 21d, so any sustained stream is anomalous. `throttled`/`topic_throttled`: a client or a room is exceeding its token bucket (misbehaving client, or a genuinely hot room needing a wider bound). `send_failed`: sockets breaking mid-write — check the reverse proxy's WebSocket timeouts. `topic_cap`: a client subscribing past its per-session topic cap (client bug). `authorize_saturated`: the subscribe-authorization executor is saturated and subscribes are failing OPEN — a subscribe was admitted without an authorization check, so treat it as security-relevant and check backend latency."

      # (#1238, REQ-FE-010 / REQ-OBS-011) A section key is being broadcast that the relay's
      # accept-list does not know, so the relay silently forwards nothing for it and every peer's
      # matching panel stays stale — with no error on either side. This is THE REQ-FE-010 defect
      # class, the one that shipped when `objectives`/`frequencies` were added to the mission write
      # seam but not to the receiver and relay maps, and `section_filtered` is what finally makes it
      # observable: the counter is bumped once per frame that lost at least one key to the whitelist.
      #
      # This replaces the `changed`-flatline alert #1238 originally proposed, which is NOT soundly
      # constructible: `relayLocal` skips the originating session, so a room with one viewer relays
      # zero `changed` frames however hard that viewer edits — a flatline is the normal state of an
      # unoccupied surface. The guard the issue assumed ("while `snapshot` frames keep flowing")
      # exists only for topic_class=mission, because every snapshot path is gated on
      # presenceEnabled(), true for MISSION alone. Measured peak CONCURRENT subscriptions per class
      # over the 21d to 2026-08-03 were mission 15, bank_staff 6, order_detail 4, {inventory_all,
      # materialboard, orders_queue, orgunit_bank} 3, bank_account 2 and operation 1 — co-presence
      # never once occurred on `operation`. So a flatline rule would be silent where it could fire
      # and false where it could not. This rule detects the same defect POSITIVELY instead, needing
      # no occupancy assumption at all. The new basetool_livesync_peer_rooms{topic_class} gauge is
      # the co-presence denominator a future flatline rule would need; it is panel-only until it has
      # its own baseline, and only `mission` looks likely to ever carry enough traffic for one.
      #
      # Persistence, not volume, is the discriminator: a real skew is deterministic and re-triggers
      # on every edit of that section, so `increase[1h] > 0` held for 2h means drops kept arriving
      # across at least two hours. A single isolated blip decays out of the 1h window and stays
      # silent. Baseline here is also zero over 21d. Known gap: on a barely-used surface
      # (bank_account relayed 2 frames in 21 days) a real skew may never sustain 2h — the dashboard
      # panel remains the backstop there.
      - alert: LiveSyncSectionKeySkew
        expr: sum by (topic_class) (increase(basetool_presence_relay_dropped_total{reason="section_filtered"}[1h])) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Live-sync section-key skew on {{ $labels.topic_class }} (peers going stale)"
          description: "The live-sync relay has been filtering unknown section keys out of `changed` frames on topic class {{ $labels.topic_class }} for over 2 hours — a broadcast key is missing from the relay's accept-list, so peers' matching panels stay stale with no visible error (the REQ-FE-010 defect class). A section key must exist at all three mirror points at once: the acting page's seam map, LiveSyncTopicClass.allowedSections, and the receiving client's apply map. Check what the last frontend deploy changed on that surface and raise LiveSyncWebSocketHandler to DEBUG to see the rejected key (logged sanitised, never a metric tag)."
