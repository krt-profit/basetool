groups:
  - name: apps-warning
    rules:
      - alert: Http5xxRateHigh
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "5xx rate >1% ({{ $labels.application }})"
          description: "More than 1% of requests to {{ $labels.application }} returned 5xx over the last 5 minutes."

      - alert: BackendAuthFailureSpike
        expr: rate(basetool_auth_failures_total{application="basetool-backend",reason="invalid_token"}[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rejected-token spike on backend (possible JWT brute force)"
          description: "The backend is rejecting presented tokens at an elevated rate - possible credential/JWT guessing. This series is normally zero: a caller with no token at all counts as reason=no_credentials, not here. Split the whole picture with sum by (reason) (rate(basetool_auth_failures_total{application=\"basetool-backend\"}[5m])): invalid_token is a rejected token (expired, wrong issuer/audience, bad signature), invalid_request a malformed Authorization header, insufficient_scope a valid token missing a scope, no_credentials a request that presented nothing (the ordinary background - probes, scanners, pre-login navigation), other an unenumerated failure worth reading the DEBUG line for."

      - alert: BackendUnauthenticatedFlood
        expr: rate(basetool_auth_failures_total{application="basetool-backend",reason="no_credentials"}[5m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sustained flood of credential-less requests on backend"
          description: "The backend is refusing more than 60 requests/minute that carry no Authorization header at all, for 15 minutes. That is an order of magnitude above the blackbox-probe floor, so it is scanning or a misconfigured client looping - not credential guessing, which would show on BackendAuthFailureSpike. Check basetool_ratelimit_rejections_total for whether the rate limiter is already absorbing it."

      - alert: IngestAuthFailureSpike
        expr: rate(basetool_ingest_auth_failures_total{application="basetool-ingest",reason="invalid_token"}[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rejected-token spike on ingest (possible JWT brute force)"
          description: "The ingest gateway is rejecting presented tokens at an elevated rate. Normally zero - a credential-less request counts as reason=no_credentials. Split with sum by (reason) (rate(basetool_ingest_auth_failures_total[5m]))."

      - alert: IngestUnauthenticatedFlood
        expr: rate(basetool_ingest_auth_failures_total{application="basetool-ingest",reason="no_credentials"}[5m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sustained flood of credential-less requests on ingest"
          description: "The ingest gateway is refusing more than 60 requests/minute that carry no Authorization header at all, for 15 minutes - far above its blackbox-probe baseline. Scanning or a looping client, not credential guessing. Check basetool_bot_blocked_total and the per-IP rate limiter before widening anything."

      - alert: JvmHeapHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap >90% ({{ $labels.application }})"
          description: "{{ $labels.application }} has used more than 90% of its max heap for 10 minutes."

      - alert: HikariPoolPending
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP has pending connection requests ({{ $labels.application }})"
          description: "Threads are waiting for a DB connection in {{ $labels.application }} — the pool may be undersized or a query is slow."

      - alert: HikariConnectionTimeouts
        expr: sum by (application) (increase(hikaricp_connections_timeout_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP connection-acquire timeouts ({{ $labels.application }})"
          description: "{{ $labels.application }} had connection-acquire timeouts in the last 10 minutes — each is a request that waited ~30s for a pool slot and then failed. Check for slow queries holding connections or an undersized pool."

      - alert: JvmFileDescriptorsHigh
        expr: process_files_open_files / process_files_max_files > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM file descriptors >85% ({{ $labels.application }})"
          description: "{{ $labels.application }} is using more than 85% of its file-descriptor limit for 10 minutes — likely an FD leak (unclosed sockets/files). Investigate before it hits the limit and the JVM starts failing to open files/sockets."

      - alert: JvmThreadsHigh
        expr: jvm_threads_live_threads > 1638
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM live threads >80% of the pids cap ({{ $labels.application }})"
          description: "{{ $labels.application }} holds more than 1638 live threads (>80% of the container's 2048 pids cap). At the cap the JVM throws 'unable to create native thread' and readiness/Keycloak calls fail (the 2026-07-09 native-thread exhaustion incident). A steady climb is a thread leak — investigate before it reaches 2048."

      - alert: JvmGcOverheadHigh
        expr: sum by (application) (rate(jvm_gc_pause_seconds_sum[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM GC overhead >20% ({{ $labels.application }})"
          description: "{{ $labels.application }} has spent more than 20% of wall time in GC pauses for 10 minutes — the collector is thrashing (latency degrades before the heap-90% alert trips). Check allocation pressure and heap sizing."

      - alert: LogbackErrorSpike
        expr: sum by (application) (rate(logback_events_total{level="error"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ERROR log spike ({{ $labels.application }})"
          description: "{{ $labels.application }} is logging errors at an elevated rate."

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker OPEN ({{ $labels.application }}/{{ $labels.name }})"
          description: "Resilience4j circuit breaker {{ $labels.name }} in {{ $labels.application }} is open — a downstream dependency is failing."

      - alert: BulkheadNearSaturation
        expr: resilience4j_bulkhead_available_concurrent_calls < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Bulkhead near saturation ({{ $labels.application }}/{{ $labels.name }})"
          description: "The {{ $labels.name }} bulkhead in {{ $labels.application }} has had fewer than 5 free concurrent-call slots for 10 minutes — the parallel backend fan-out is about to queue and slow page renders. Check backend latency and concurrent load."

      - alert: RetryRateElevated
        expr: sum by (application) (rate(resilience4j_retry_calls_total{kind="successful_with_retry"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend-call retry rate elevated ({{ $labels.application }})"
          description: "{{ $labels.application }} has been succeeding only after a retry at more than 0.2/s for 10 minutes — the frontend→backend hop is flaky (transient resets) even though the circuit breaker is still closed. Check backend health and the network path."

      - alert: HttpLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency >2s ({{ $labels.application }})"
          description: "The 95th-percentile request latency for {{ $labels.application }} exceeded 2 seconds for 10 minutes."

      - alert: FrontendBackendFanoutHigh
        expr: |
          sum(rate(http_client_requests_seconds_count{application="basetool-frontend"}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{application="basetool-frontend"}[5m])), 0.1) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Frontend->backend fan-out ratio high (read amplification)"
          description: "The frontend issued more than 10 backend calls per inbound request (5m avg) for 15 minutes — a per-render read-amplification regression (a page/fragment that lost its read-gating) inflates this well before HikariPoolPending / HttpLatencyP95High fire. Check recent frontend controller changes for an un-gated backend fan-out."

  - name: caches
    rules:
      - alert: CacheSizeEvictionsHigh
        expr: sum by (application, cache) (rate(cache_evictions_total{cause="SIZE"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cache at size cap evicting live entries ({{ $labels.application }}/{{ $labels.cache }})"
          description: "Cache {{ $labels.cache }} in {{ $labels.application }} is evicting entries because it reached maximumSize — raise the cap or investigate key explosion (e.g. an unbounded pageable-keyed cache), otherwise the hit ratio collapses and the DB/backend is re-hit."

      - alert: CacheHitRatioLow
        expr: |
          sum by (application, cache) (rate(cache_gets_total{result="hit"}[30m]))
            / sum by (application, cache) (rate(cache_gets_total[30m])) < 0.5
            and sum by (application, cache) (rate(cache_gets_total[30m])) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit ratio <50% ({{ $labels.application }}/{{ $labels.cache }})"
          description: "Cache {{ $labels.cache }} in {{ $labels.application }} served <50% hits over 30m at non-trivial traffic (>0.1 gets/s) — it may be thrashing its size cap or mis-keyed. The >0.1 gets/s guard suppresses noise from idle/rarely-read caches (e.g. the short-TTL roles cache under light load)."
