# Infrastructure alerts: host, containers, PostgreSQL, Redis, blackbox probes, certificates.
# Epic #936 alert catalog. Thresholds are the initial values; Phase 3 (#937 baseline week) tunes them.
groups:
  - name: infrastructure-critical
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.job }} / {{ $labels.instance }} for 3 minutes. For scratch-image monitoring services this is their only liveness signal."

      # Scoped to the two liveness jobs (blackbox-http + the 401-accepting blackbox-http-auth):
      # the deny/posture jobs (blackbox-edge-deny/-force-ssl/-hsts, REQ-OBS-012) have their own
      # alerts below and must not double-page through this one.
      - alert: BlackboxProbeFailed
        expr: probe_success{job=~"blackbox-http|blackbox-http-auth"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint probe failing: {{ $labels.instance }}"
          description: "The blackbox HTTPS probe for {{ $labels.instance }} has failed for 3 minutes."

      # The `and on()` guard suppresses the posture alert while the edge itself is down — that
      # case is already paged by BlackboxProbeFailed and the deny probe carries no signal then.
      - alert: EdgeActuatorDenyBroken
        expr: >-
          probe_success{job="blackbox-edge-deny"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Edge /actuator deny broken: {{ $labels.instance }}"
          description: "{{ $labels.instance }} no longer answers 404 — the `location /actuator` deny on the NPM proxy host has drifted (ADR-0072 compensating control). Re-add it in the proxy host's Advanced config."

      - alert: HostDiskCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk >90% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} is over 90% full. The monitoring stores share /var/iri with both PGDATA dirs — an overrun must never ENOSPC the databases."

      - alert: HostInodesCritical
        expr: (1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay"} / node_filesystem_files{fstype!~"tmpfs|overlay"})) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Inodes >90% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} has used over 90% of its inodes."

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "systemd unit failed: {{ $labels.name }}"
          description: "The systemd unit {{ $labels.name }} is in the failed state (e.g. iri-deploy / iri-backup / iri-restore-drill)."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name=~".+"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container restart loop: {{ $labels.name }}"
          description: "Container {{ $labels.name }} restarted more than 3 times in 15 minutes."

      # cAdvisor named-series blackout (#1041 item 7, REQ-OBS-014). This shipped as a real incident
      # (CHANGELOG v1.1.1): cAdvisor stayed "up" while emitting zero name-labelled series, silently
      # blinding ContainerRestartLoop / ContainerWorkingSetHigh — TargetDown cannot catch it because
      # the scrape still succeeds. The host runs ~20 containers, so a drop below 10 named series means
      # cAdvisor lost its labels. `container_last_seen{name=~".+"}` metric verified against cadvisor
      # v0.60.3.
      # baseline-tune: the < 10 floor assumes the current ~20-container footprint.
      - alert: ContainerMetricsMissing
        expr: >-
          count(container_last_seen{name=~".+"}) < 10
          or absent(container_last_seen{name=~".+"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor is emitting no named container series"
          description: "cAdvisor reports fewer than 10 name-labelled containers (or none at all) while its scrape succeeds — the container-level alerts (restart loop, working-set, OOM, CPU throttle) are silently blind. Restart cAdvisor and check the docker-socket-proxy."

      - alert: PostgresConnectionsCritical
        expr: sum by (database) (pg_stat_activity_count) / on(database) pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connections >80% ({{ $labels.database }})"
          description: "PostgreSQL {{ $labels.database }} is using more than 80% of its 100 connection slots."

      - alert: RedisRdbStale
        expr: (time() - redis_rdb_last_save_timestamp_seconds) > 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Redis RDB snapshot older than 1h"
          description: "The last Redis RDB save was more than an hour ago. AOF (appendfsync everysec) is the primary durability layer, so this is not a data-loss signal on its own, but a stale RDB slows restart and usually means write activity has stalled or the snapshot fork is failing — check the redis logs."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in <14 days"
          description: "The certificate served at {{ $labels.instance }} expires in under 14 days."

  - name: infrastructure-warning
    rules:
      - alert: HostDiskWarning
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk >80% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} is over 80% full."

      # (#1041 item 14) Host saturation. One CPX42 hosts both DBs, Redis, Keycloak, three JVMs and
      # the monitoring plane, so memory pressure is the DESIGNED failure mode (the oom_score_adj
      # sacrifice ordering already OOM-cycled Grafana/Tempo in prod). PSI series are collected by
      # node_exporter's default `pressure` collector; on a kernel without /proc/pressure they are
      # simply absent (the alert stays silent, safe). Memory "full" pressure = fraction of wall time
      # ALL tasks were stalled reclaiming memory — the earliest saturation signal, before the OOM
      # kill. baseline-tune: thresholds set in the baseline week.
      - alert: HostMemoryPressureStalled
        expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory full-pressure >10% ({{ $labels.instance }})"
          description: "The host spent more than 10% of wall time with all tasks stalled reclaiming memory for 10 minutes — memory saturation is building toward the OOM-kill sacrifice ordering. Check per-container working sets and free memory."

      - alert: HostCpuPressure
        expr: rate(node_pressure_cpu_waiting_seconds_total[5m]) > 0.50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU pressure >50% ({{ $labels.instance }})"
          description: "Tasks waited on CPU more than 50% of wall time for 15 minutes — the host is CPU-saturated. Identify the busy container (per-app CPU on 03) and the workload."

      - alert: HostIoPressure
        expr: rate(node_pressure_io_stalled_seconds_total[5m]) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host I/O full-pressure >30% ({{ $labels.instance }})"
          description: "The host spent more than 30% of wall time with all tasks stalled on I/O for 15 minutes — disk is the bottleneck (heavy Postgres/Loki writes or swapping). Check disk throughput and temp-file / WAL activity."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host MemAvailable <10% ({{ $labels.instance }})"
          description: "Less than 10% of host memory is available for 10 minutes — the next allocation spike risks the OOM killer (which sacrifices Grafana/Tempo first by design). Free memory or scale up."

      - alert: HostCpuHigh
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU >90% ({{ $labels.instance }})"
          description: "Host CPU has averaged more than 90% busy for 15 minutes — sustained saturation degrades every co-located service. Identify the workload."

      - alert: HostLoadHigh
        expr: node_load15 > 2 * count by (instance) (node_cpu_seconds_total{mode="idle"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host load15 >2x vCPU ({{ $labels.instance }})"
          description: "15-minute load average is more than twice the vCPU count for 15 minutes — the run queue is deep (CPU or I/O contention across the co-located services). Investigate the saturating workload."

      # Clock drift breaks JWT iat/exp validation (login failures) and TLS handshakes; the node_timex
      # collector reports the NTP-adjusted offset. > 0.25s is well beyond a healthy chrony/systemd-timesyncd.
      - alert: HostClockDrift
        expr: abs(node_timex_offset_seconds) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host clock drift >0.25s ({{ $labels.instance }})"
          description: "The host clock is more than 0.25s off NTP for 5 minutes — this breaks JWT iat/exp validation (spurious login failures) and TLS handshakes. Check the time-sync service (chrony / systemd-timesyncd)."

      # Physical NIC errors (excludes loopback and the virtual docker/veth/bridge interfaces, which
      # generate noise) — a failing NIC or a saturated link corrupts packets before the app sees a
      # timeout.
      - alert: HostNetworkErrors
        expr: |
          sum by (instance, device) (rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) + rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host NIC errors on {{ $labels.device }} ({{ $labels.instance }})"
          description: "The {{ $labels.device }} interface has had receive/transmit errors for 10 minutes — a failing NIC or saturated link corrupting packets. Check dmesg and the link/driver state."

      - alert: ContainerWorkingSetHigh
        expr: (container_memory_working_set_bytes{name=~".+"} / container_spec_memory_limit_bytes{name=~".+"}) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container working set >90% of limit: {{ $labels.name }}"
          description: "Container {{ $labels.name }} is within 10% of its memory limit — OOM early warning."

      # A single core app container dropping out of cAdvisor (#1041 item 7, REQ-OBS-014). Complements
      # the global ContainerMetricsMissing above: fires when fewer than the 7 core containers report a
      # cAdvisor series (or all are gone), catching a single core container whose container-level
      # metrics vanished while the plane keeps ~20 total series. Warning (not critical) because a truly
      # down app container also pages TargetDown on its app scrape.
      - alert: CoreContainerMetricsMissing
        expr: >-
          count(container_last_seen{name=~"backend|frontend|ingest|keycloak|db-backend|db-keycloak|redis"}) < 7
          or absent(container_last_seen{name=~"backend|frontend|ingest|keycloak|db-backend|db-keycloak|redis"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A core app container stopped reporting cAdvisor metrics"
          description: "Fewer than the 7 core app containers (backend/frontend/ingest/keycloak/db-backend/db-keycloak/redis) report a cAdvisor series — one is down or cAdvisor lost its series. Cross-check TargetDown and the container's health."

      # Single OOM kill (#1041 item 7, REQ-OBS-014). ContainerRestartLoop needs >3 restarts/15m; a
      # one-off OOM kill slips under that threshold. `container_oom_events_total` verified present in
      # cadvisor v0.60.3.
      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name=~".+"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container OOM-killed: {{ $labels.name }}"
          description: "Container {{ $labels.name }} recorded an out-of-memory kill in the last 15 minutes. Check its memory limit and working set; on the memory-capped host this is the designed sacrifice order — confirm it was the intended victim."

      # Sustained CPU throttling (#1041 item 7, REQ-OBS-014). container_cpu_cfs_* is emitted only for
      # containers with a CFS quota; the app containers all set cpus limits (backend 2.0, keycloak 2.0,
      # …), so this ratio has data for them. Verified against cadvisor v0.60.3.
      # baseline-tune: the 25% throttled-period ratio is the issue's initial threshold.
      - alert: ContainerCpuThrottledHigh
        expr: >-
          rate(container_cpu_cfs_throttled_periods_total{name=~".+"}[15m])
          / rate(container_cpu_cfs_periods_total{name=~".+"}[15m]) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU throttled >25%: {{ $labels.name }}"
          description: "Container {{ $labels.name }} had more than 25% of its CFS periods throttled for 15 minutes — it is CPU-starved against its limit, degrading latency. Consider raising its cpus limit."

      # Container cgroup-pids exhaustion (2026-07-12 ingest native-thread OOM). The `pids` cgroup cap
      # (2048 for the four JVM containers backend/frontend/ingest/keycloak — docker-compose.yml) limits
      # EVERY task in the container, not just JVM threads: unreaped child processes (the ssl_client
      # zombies the wget-https docker healthcheck spawned in the incident) and the OS carrier threads
      # behind virtual threads both count against it yet are INVISIBLE to Micrometer's
      # jvm_threads_live_threads — which stayed flat (~36) while ingest exhausted the cap, so
      # JvmThreadsHigh (apps.yml) never fired and only post-crash TargetDown / DeployHealthRestartFailing
      # paged. This is the JVM-blind companion that catches non-JVM pids and virtual-thread carriers.
      # cAdvisor's container_threads is the cgroup pids.current task count (its companion
      # container_threads_max = pids.max); the `process` metric group that emits it is enabled in
      # docker-compose.monitoring.yml. Scoped to the four containers that carry the 2048 pids cap —
      # keycloak is included because it shares that cap AND the wget-https healthcheck yet is NOT covered
      # by JvmThreadsHigh (which only sees the basetool-* Micrometer apps), so it would otherwise stay
      # entirely blind to pids exhaustion. The 2048 cap is hardcoded here to stay in lockstep with
      # JvmThreadsHigh and the compose pids limit (container_threads_max would export it, but the
      # hardcode keeps both alerts trivially comparable); >80% (=1638) is the early warning and a steady
      # climb is a task/zombie leak. Verified against cadvisor v0.60.5.
      - alert: ContainerPidsHigh
        expr: container_threads{name=~"backend|frontend|ingest|keycloak"} > 1638
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container pids >80% of the cgroup cap: {{ $labels.name }}"
          description: "Container {{ $labels.name }} holds more than 1638 tasks (>80% of its 2048 pids cgroup cap — container_threads is the cgroup pids.current count). At the cap the kernel refuses new tasks: the JVM throws 'unable to create native thread' and child-process spawns (healthcheck wget, ssl_client) fail — the 2026-07-12 ingest native-thread OOM, where unreaped zombies exhausted the cap while jvm_threads_live_threads (JVM-only) stayed flat and JvmThreadsHigh never fired. A steady climb is a task/zombie leak — investigate before it reaches 2048; do not raise the cap to silence it."

      - alert: RedisEvictions
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys"
          description: "Redis evicted keys in the last 15 minutes. The session store runs maxmemory-policy noeviction, which never evicts — so any eviction means the policy was changed to an evicting one (allkeys-*/volatile-*), which silently logs users out. Restore noeviction and check what changed the config."

      # (#1041 item 13) Redis memory approaching maxmemory — the real leading indicator. Under the
      # noeviction policy RedisEvictions never fires, so this ratio is the ONLY warning before Redis
      # starts rejecting new writes (failed logins / session writes) at the 192mb ceiling. Guard on
      # redis_memory_max_bytes > 0 so it stays inert if maxmemory is ever unset again (no divide-by-zero).
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory >85% of maxmemory"
          description: "Redis has used more than 85% of its 192mb maxmemory for 10 minutes. Under noeviction, hitting the ceiling makes NEW session writes / logins fail (existing sessions survive) — investigate session growth or a leak before it does."

      # Redis rejected new connections — the maxclients limit was reached (a connection leak or a
      # client storm). New Spring Session reads/writes then fail, so this is a pre-outage signal.
      - alert: RedisConnectionsRejected
        expr: increase(redis_rejected_connections_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejected connections"
          description: "Redis rejected new connections in the last 15 minutes — the maxclients limit was reached (a connection leak or storm). New sessions and Spring Session writes will start failing."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected ({{ $labels.datname }})"
          description: "PostgreSQL recorded deadlocks in the last 15 minutes."

      # (#1041 item 13) Long-running transaction — an idle-in-transaction session blocks autovacuum,
      # which lets bloat and XID age grow toward wraparound (plausible given the codebase's multi-step
      # transaction history). The metric IS genuinely in seconds and is 0 when none are open.
      - alert: PostgresLongTransaction
        expr: pg_long_running_transactions_oldest_timestamp_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL transaction open >1h"
          description: "A transaction has been open for more than 1 hour — an idle-in-transaction session blocks autovacuum (bloat + XID-age growth toward wraparound). Find and terminate it via pg_stat_activity."

      # Buffer-cache hit ratio below 90% means queries are hitting disk. Division is NaN when the DB is
      # idle (both rates 0), so the alert only fires under real block-access load.
      - alert: PostgresCacheHitLow
        expr: |
          sum by (datname) (rate(pg_stat_database_blks_hit{datname!~"template.*"}[30m]))
            / (sum by (datname) (rate(pg_stat_database_blks_hit{datname!~"template.*"}[30m])) + sum by (datname) (rate(pg_stat_database_blks_read{datname!~"template.*"}[30m]))) < 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit ratio <90% ({{ $labels.datname }})"
          description: "The buffer-cache hit ratio for {{ $labels.datname }} has been below 90% for 30 minutes — queries are reading from disk. Check shared_buffers sizing and recent query/plan changes."

      # Temp-file spill: queries whose sort/hash exceeds work_mem spill to disk. > 1 GB/h points at an
      # undersized work_mem or a bad plan.
      - alert: PostgresTempFiles
        expr: increase(pg_stat_database_temp_bytes{datname!~"template.*"}[1h]) > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL temp files >1GB/h ({{ $labels.datname }})"
          description: "{{ $labels.datname }} wrote more than 1 GB of temp files in the last hour — queries are spilling to disk (work_mem too small, or a bad plan). Check the heavy queries."

      # CRITICAL: transaction-ID wraparound. IMPORTANT — the metric value is an XID AGE COUNT
      # (age(datfrozenxid)), NOT seconds: postgres_exporter names it *_seconds but the underlying SQL
      # is age(datfrozenxid), which returns a transaction count. The hard wraparound limit is ~2.1e9;
      # autovacuum_freeze_max_age defaults to 2e8, so a healthy DB stays well below that. > 1.5e9 means
      # autovacuum has been failing to freeze for a very long time and the DB nears a forced read-only
      # shutdown. Do NOT "fix" this threshold to a seconds value.
      - alert: PostgresWraparoundCritical
        expr: pg_database_wraparound_age_datfrozenxid_seconds > 1500000000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL XID wraparound age critical ({{ $labels.datname }})"
          description: "The oldest un-frozen transaction-ID age for {{ $labels.datname }} exceeds 1.5 billion of the ~2.1 billion wraparound limit — autovacuum is not keeping up and PostgreSQL will refuse writes as it nears the limit. Investigate autovacuum and long-idle transactions urgently."

      # Posture assertions (REQ-OBS-012). Same `and on()` outage guard as EdgeActuatorDenyBroken.
      - alert: EdgeForceSslRedirectBroken
        expr: >-
          probe_success{job="blackbox-force-ssl"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HTTP→HTTPS redirect broken: {{ $labels.instance }}"
          description: "Port 80 on {{ $labels.instance }} no longer answers with a 301/308 to https:// — the Force SSL toggle on the NPM proxy host is off or drifted."

      - alert: EdgeHstsHeaderMissing
        expr: >-
          probe_success{job="blackbox-hsts"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "HSTS header missing: {{ $labels.instance }}"
          description: "The first response from {{ $labels.instance }} no longer carries Strict-Transport-Security (app-side HSTS, audit finding H-9) — check the frontend security config and the edge forwarding."

      # IPv6 reachability (owner-confirmed AAAA records, 2026-07-06). Fires only when a public vhost is
      # unreachable over IPv6 while its IPv4 probe of the SAME instance is up — an IPv6-specific
      # regression. A full outage is paged once by BlackboxProbeFailed on the v4 path (the on(instance)
      # guard suppresses this then). Warning: IPv4 remains a working path for most clients.
      - alert: EdgeIpv6Unreachable
        expr: >-
          (probe_success{job="blackbox-http-ipv6"} == 0
            and on(instance) probe_success{job="blackbox-http"} == 1)
          or (probe_success{job="blackbox-http-auth-ipv6"} == 0
            and on(instance) probe_success{job="blackbox-http-auth"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint unreachable over IPv6: {{ $labels.instance }}"
          description: "{{ $labels.instance }} answers over IPv4 but not IPv6 — an IPv6-only regression (broken AAAA path or lost edge v6 binding). IPv6 clients cannot reach it. Check the AAAA record and the edge IPv6 listener."

      # Public DNS resolution: the blackbox DNS probe against 1.1.1.1 failed — the apex is not resolving
      # an A or AAAA record (missing/removed record, or a zone/provider outage). Warning.
      - alert: DnsResolutionFailed
        expr: probe_success{job=~"blackbox-dns-a|blackbox-dns-aaaa"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Public DNS resolution failing ({{ $labels.job }})"
          description: "The blackbox DNS probe {{ $labels.job }} against 1.1.1.1 has failed for 5 minutes — profit-base.online is not resolving the expected record (A or AAAA missing/broken). Check the DNS provider and the zone."
