# Infrastructure alerts: host, containers, PostgreSQL, Redis, blackbox probes, certificates.
# Epic #936 alert catalog. Thresholds are the initial values; Phase 3 (#937 baseline week) tunes them.
groups:
  - name: infrastructure-critical
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.job }} / {{ $labels.instance }} for 3 minutes. For scratch-image monitoring services this is their only liveness signal."

      # Scoped to the two liveness jobs (blackbox-http + the 401-accepting blackbox-http-auth):
      # the deny/posture jobs (blackbox-edge-deny/-force-ssl/-hsts, REQ-OBS-012) have their own
      # alerts below and must not double-page through this one.
      - alert: BlackboxProbeFailed
        expr: probe_success{job=~"blackbox-http|blackbox-http-auth"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint probe failing: {{ $labels.instance }}"
          description: "The blackbox HTTPS probe for {{ $labels.instance }} has failed for 3 minutes."

      # The `and on()` guard suppresses the posture alert while the edge itself is down — that
      # case is already paged by BlackboxProbeFailed and the deny probe carries no signal then.
      - alert: EdgeActuatorDenyBroken
        expr: >-
          probe_success{job="blackbox-edge-deny"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Edge /actuator deny broken: {{ $labels.instance }}"
          description: "{{ $labels.instance }} no longer answers 404 — the `location /actuator` deny on the NPM proxy host has drifted (ADR-0072 compensating control). Re-add it in the proxy host's Advanced config."

      - alert: HostDiskCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk >90% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} is over 90% full. The monitoring stores share /var/iri with both PGDATA dirs — an overrun must never ENOSPC the databases."

      - alert: HostInodesCritical
        expr: (1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay"} / node_filesystem_files{fstype!~"tmpfs|overlay"})) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Inodes >90% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} has used over 90% of its inodes."

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "systemd unit failed: {{ $labels.name }}"
          description: "The systemd unit {{ $labels.name }} is in the failed state (e.g. iri-deploy / iri-backup / iri-restore-drill)."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name=~".+"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container restart loop: {{ $labels.name }}"
          description: "Container {{ $labels.name }} restarted more than 3 times in 15 minutes."

      # cAdvisor named-series blackout (#1041 item 7, REQ-OBS-014). This shipped as a real incident
      # (CHANGELOG v1.1.1): cAdvisor stayed "up" while emitting zero name-labelled series, silently
      # blinding ContainerRestartLoop / ContainerWorkingSetHigh — TargetDown cannot catch it because
      # the scrape still succeeds. The host runs ~20 containers, so a drop below 10 named series means
      # cAdvisor lost its labels. `container_last_seen{name=~".+"}` metric verified against cadvisor
      # v0.60.3.
      # baseline-tune: the < 10 floor assumes the current ~20-container footprint.
      - alert: ContainerMetricsMissing
        expr: >-
          count(container_last_seen{name=~".+"}) < 10
          or absent(container_last_seen{name=~".+"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor is emitting no named container series"
          description: "cAdvisor reports fewer than 10 name-labelled containers (or none at all) while its scrape succeeds — the container-level alerts (restart loop, working-set, OOM, CPU throttle) are silently blind. Restart cAdvisor and check the docker-socket-proxy."

      - alert: PostgresConnectionsCritical
        expr: sum by (database) (pg_stat_activity_count) / on(database) pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connections >80% ({{ $labels.database }})"
          description: "PostgreSQL {{ $labels.database }} is using more than 80% of its 100 connection slots."

      - alert: RedisRdbStale
        expr: (time() - redis_rdb_last_save_timestamp_seconds) > 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Redis RDB snapshot older than 1h"
          description: "The last Redis RDB save was more than an hour ago — the session-loss window (OAuth2 refresh tokens) is growing."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in <14 days"
          description: "The certificate served at {{ $labels.instance }} expires in under 14 days."

  - name: infrastructure-warning
    rules:
      - alert: HostDiskWarning
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk >80% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} is over 80% full."

      - alert: ContainerWorkingSetHigh
        expr: (container_memory_working_set_bytes{name=~".+"} / container_spec_memory_limit_bytes{name=~".+"}) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container working set >90% of limit: {{ $labels.name }}"
          description: "Container {{ $labels.name }} is within 10% of its memory limit — OOM early warning."

      # A single core app container dropping out of cAdvisor (#1041 item 7, REQ-OBS-014). Complements
      # the global ContainerMetricsMissing above: fires when fewer than the 7 core containers report a
      # cAdvisor series (or all are gone), catching a single core container whose container-level
      # metrics vanished while the plane keeps ~20 total series. Warning (not critical) because a truly
      # down app container also pages TargetDown on its app scrape.
      - alert: CoreContainerMetricsMissing
        expr: >-
          count(container_last_seen{name=~"backend|frontend|ingest|keycloak|db-backend|db-keycloak|redis"}) < 7
          or absent(container_last_seen{name=~"backend|frontend|ingest|keycloak|db-backend|db-keycloak|redis"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A core app container stopped reporting cAdvisor metrics"
          description: "Fewer than the 7 core app containers (backend/frontend/ingest/keycloak/db-backend/db-keycloak/redis) report a cAdvisor series — one is down or cAdvisor lost its series. Cross-check TargetDown and the container's health."

      # Single OOM kill (#1041 item 7, REQ-OBS-014). ContainerRestartLoop needs >3 restarts/15m; a
      # one-off OOM kill slips under that threshold. `container_oom_events_total` verified present in
      # cadvisor v0.60.3.
      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name=~".+"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container OOM-killed: {{ $labels.name }}"
          description: "Container {{ $labels.name }} recorded an out-of-memory kill in the last 15 minutes. Check its memory limit and working set; on the memory-capped host this is the designed sacrifice order — confirm it was the intended victim."

      # Sustained CPU throttling (#1041 item 7, REQ-OBS-014). container_cpu_cfs_* is emitted only for
      # containers with a CFS quota; the app containers all set cpus limits (backend 2.0, keycloak 2.0,
      # …), so this ratio has data for them. Verified against cadvisor v0.60.3.
      # baseline-tune: the 25% throttled-period ratio is the issue's initial threshold.
      - alert: ContainerCpuThrottledHigh
        expr: >-
          rate(container_cpu_cfs_throttled_periods_total{name=~".+"}[15m])
          / rate(container_cpu_cfs_periods_total{name=~".+"}[15m]) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU throttled >25%: {{ $labels.name }}"
          description: "Container {{ $labels.name }} had more than 25% of its CFS periods throttled for 15 minutes — it is CPU-starved against its limit, degrading latency. Consider raising its cpus limit."

      - alert: RedisEvictions
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys"
          description: "Redis evicted keys in the last 15 minutes — the 256 MB limit may be too small for the session set."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected ({{ $labels.datname }})"
          description: "PostgreSQL recorded deadlocks in the last 15 minutes."

      # Posture assertions (REQ-OBS-012). Same `and on()` outage guard as EdgeActuatorDenyBroken.
      - alert: EdgeForceSslRedirectBroken
        expr: >-
          probe_success{job="blackbox-force-ssl"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HTTP→HTTPS redirect broken: {{ $labels.instance }}"
          description: "Port 80 on {{ $labels.instance }} no longer answers with a 301/308 to https:// — the Force SSL toggle on the NPM proxy host is off or drifted."

      - alert: EdgeHstsHeaderMissing
        expr: >-
          probe_success{job="blackbox-hsts"} == 0
          and on() (probe_success{job="blackbox-http", instance="https://profit-base.online"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "HSTS header missing: {{ $labels.instance }}"
          description: "The first response from {{ $labels.instance }} no longer carries Strict-Transport-Security (app-side HSTS, audit finding H-9) — check the frontend security config and the edge forwarding."

      # IPv6 reachability (owner-confirmed AAAA records, 2026-07-06). Fires only when a public vhost is
      # unreachable over IPv6 while its IPv4 probe of the SAME instance is up — an IPv6-specific
      # regression. A full outage is paged once by BlackboxProbeFailed on the v4 path (the on(instance)
      # guard suppresses this then). Warning: IPv4 remains a working path for most clients.
      - alert: EdgeIpv6Unreachable
        expr: >-
          (probe_success{job="blackbox-http-ipv6"} == 0
            and on(instance) probe_success{job="blackbox-http"} == 1)
          or (probe_success{job="blackbox-http-auth-ipv6"} == 0
            and on(instance) probe_success{job="blackbox-http-auth"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint unreachable over IPv6: {{ $labels.instance }}"
          description: "{{ $labels.instance }} answers over IPv4 but not IPv6 — an IPv6-only regression (broken AAAA path or lost edge v6 binding). IPv6 clients cannot reach it. Check the AAAA record and the edge IPv6 listener."

      # Public DNS resolution: the blackbox DNS probe against 1.1.1.1 failed — the apex is not resolving
      # an A or AAAA record (missing/removed record, or a zone/provider outage). Warning.
      - alert: DnsResolutionFailed
        expr: probe_success{job=~"blackbox-dns-a|blackbox-dns-aaaa"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Public DNS resolution failing ({{ $labels.job }})"
          description: "The blackbox DNS probe {{ $labels.job }} against 1.1.1.1 has failed for 5 minutes — profit-base.online is not resolving the expected record (A or AAAA missing/broken). Check the DNS provider and the zone."
