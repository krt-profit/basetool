# Meta-monitoring: the monitoring plane watching itself, plus the dead-man's switch (Watchdog).
# Epic #936 alert catalog.
groups:
  - name: meta-watchdog
    rules:
      # Dead-man's switch: this alert ALWAYS fires and is routed by Alertmanager to the external
      # heartbeat (healthchecks.io). If Prometheus/Alertmanager/the host dies, the heartbeat stops
      # and the external service alerts — something an in-host blackbox by construction cannot see.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Monitoring watchdog — always firing"
          description: "This alert is always firing. Its purpose is to keep the external dead-man's-switch heartbeat green; if it stops arriving, the monitoring stack or the host is down."

  - name: meta-warning
    rules:
      - alert: PrometheusTsdbApproachingCap
        expr: prometheus_tsdb_storage_blocks_bytes > 36 * 1000 * 1000 * 1000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB approaching the 40GB cap"
          description: "On-disk TSDB block size exceeded 36 GB (90% of the 40 GB retention.size cap). Old data will be evicted before the 180-day target — investigate cardinality/retention."

      - alert: AlertmanagerNotificationsFailing
        expr: rate(alertmanager_notifications_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notification delivery failing ({{ $labels.integration }})"
          description: "Alertmanager failed to deliver notifications (e.g. SMTP) in the last 15 minutes — alerts may be silently lost."

      - alert: LokiDiscardingLines
        expr: sum by (reason) (rate(loki_discarded_samples_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki is discarding log lines ({{ $labels.reason }})"
          description: "Loki dropped log lines in the last 10 minutes (reason: {{ $labels.reason }}) — likely a rate-cap or stream-limit hit."

  # Monitoring-plane self-health (#1041 item 4, REQ-OBS-014). deploy.sh SIGHUP-reloads
  # prometheus/alloy/blackbox on config change; a FAILED reload silently keeps the old config
  # running and the Watchdog only proves the pipeline is alive, not that rules evaluate. These
  # alerts make the plane notice its own reload/rule-eval/notification/TSDB failures. Metric
  # names verified against the pinned images (prometheus v3.13.0, alertmanager v0.33.0,
  # alloy v1.17.1, loki 3.7.3, blackbox v0.28.0, node-exporter v1.11.1).
  # PrometheusConfigStale additionally catches a reload that never landed at all (a MISSED/lost
  # SIGHUP) — invisible to the *_config_last_reload_successful==0 checks, which only see a reload
  # that was attempted and failed. Precedent: 2026-07-11 ingest TargetDown (ADR-0090 port move).
  - name: meta-self-health
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus config reload failed"
          description: "Prometheus is running the LAST-GOOD config because the most recent reload failed — new scrape jobs / alert rules from the last deploy are NOT active. Check `deploy.sh` and `promtool check config`."

      # Catches a config that never LANDED in the running Prometheus, which PrometheusConfigReloadFailed
      # cannot: that alert only sees a reload that was ATTEMPTED and failed (last_reload_successful==0),
      # whereas a config that was never applied to the process leaves last_reload_successful==1 (the
      # last load, at startup, was fine) while the running config silently outruns the on-disk one. The
      # config files are inode-pinned single-file bind mounts, so deploy.sh force-recreates the service
      # to apply a change (a SIGHUP would re-read the stale inode); it stamps
      # basetool_monitoring_config_applied_timestamp (node_exporter textfile) on each Prometheus
      # recreate. If that stamp stays newer than Prometheus's own last-successful-reload timestamp, the
      # recreate was missed/lost. deploy.sh's self-healing reconcile retries on the next tick, so >15m of
      # drift means it is not converging (recreate failing, or the iri-deploy timer stopped). Precedent:
      # 2026-07-11 ingest TargetDown after ADR-0090 moved ingest's actuator 11262->11272 while the
      # running Prometheus kept the retired 11262 target through its pinned inode. scalar() bridges the
      # two single-series metrics' disjoint label sets (job=node vs job=prometheus).
      - alert: PrometheusConfigStale
        expr: |
          basetool_monitoring_config_applied_timestamp{component="prometheus"}
            > scalar(prometheus_config_last_reload_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus running a stale config (an apply was missed)"
          description: "deploy.sh applied an on-disk Prometheus config more recently than Prometheus's last SUCCESSFUL reload — the running Prometheus is serving a stale config (scrape targets / alert rules out of date), which PrometheusConfigReloadFailed cannot see. Check the deploy.sh monitoring-reload logs, force-recreate Prometheus (`docker compose -p iri-monitoring -f docker-compose.monitoring.yml up -d --force-recreate prometheus`), and verify the iri-deploy timer is running."

      # Catches the failure mode that made PrometheusConfigStale itself go blind (2026-07-13): a host
      # runs the iri-monitoring stack but IRI_MONITORING_ENABLED is unset, so deploy.sh's monitoring
      # reconcile returns early every tick. The config-bundle rsync keeps rewriting monitoring/** on
      # disk, but the running containers are never recreated — on-disk rule/scrape changes never reach
      # the running Prometheus (silent drift). PrometheusConfigStale cannot see this because its
      # basetool_monitoring_config_applied_timestamp series is written ONLY from inside the gated
      # reconcile: the same condition that causes the drift also disables its alarm. This alert instead
      # reads basetool_monitoring_reconcile_disabled, a gauge deploy.sh emits on its OWN path precisely
      # in the failure state (=1 when the stack is running but the reconcile is gated off; =0 when the
      # reconcile is enabled and runs), so it cannot be self-disabled the same way. Keep
      # PrometheusConfigStale too — it still covers the enabled-but-reload-missed case.
      - alert: MonitoringReconcileDisabled
        expr: basetool_monitoring_reconcile_disabled{component="deploy"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring reconcile is disabled while the stack is running"
          description: "deploy.sh sees the iri-monitoring stack running but IRI_MONITORING_ENABLED != 'true', so on-disk monitoring config changes are never reloaded into the running Prometheus/alloy/blackbox — silent config drift, and PrometheusConfigStale cannot catch it (its applied-stamp metric is written only from inside the gated reconcile). Fix: add /etc/systemd/system/iri-deploy.service.d/monitoring.conf with `Environment=IRI_MONITORING_ENABLED=true`, then `systemctl daemon-reload`."

      - alert: PrometheusRuleEvaluationFailures
        expr: rate(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluations failing ({{ $labels.rule_group }})"
          description: "Prometheus rule evaluations are failing — some alert rules are not being evaluated, so their alerts cannot fire. Check the rule group for a bad expression."

      - alert: PrometheusNotificationsDropped
        expr: rate(prometheus_notifications_dropped_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is dropping alert notifications"
          description: "Prometheus dropped notifications to Alertmanager — firing alerts may not be delivered. Check the Prometheus→Alertmanager connection and the notification queue."

      - alert: PrometheusTsdbProblems
        expr: >-
          increase(prometheus_tsdb_wal_corruptions_total[1h]) > 0
          or increase(prometheus_tsdb_compactions_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus TSDB problems (WAL corruption / failed compaction)"
          description: "Prometheus recorded a WAL corruption or a failed compaction in the last hour — metric history integrity is at risk. Check disk health/space on /var/iri and the Prometheus log."

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager config reload failed"
          description: "Alertmanager is running the LAST-GOOD config because the most recent reload failed — routing/receiver changes are NOT active and alerts may be misrouted. Check the rendered alertmanager.yml with `amtool check-config`."

      - alert: NodeTextfileScrapeError
        expr: node_textfile_scrape_error == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter textfile collector error"
          description: "The node_exporter textfile collector failed to parse a .prom file in the ops-automation textfile dir — a deploy/backup/restore-drill metric may be stale or missing, blinding the ops-automation alerts."

      - alert: AlloyConfigReloadFailed
        expr: alloy_config_last_load_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alloy config reload failed"
          description: "Alloy is running the LAST-GOOD config because the most recent reload failed — new log-shipping / trace-forwarding wiring from the last deploy is NOT active. Check the Alloy log and `alloy validate`."

      - alert: AlloyComponentUnhealthy
        expr: alloy_component_controller_running_components{health_type="unhealthy"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alloy has unhealthy components"
          description: "One or more Alloy components are in the unhealthy state — a log source or exporter may have stopped shipping. Open the Alloy UI/component graph to find the failing component."

      - alert: LokiRuleEvaluationFailures
        expr: rate(loki_prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki ruler rule evaluations failing"
          description: "The Loki ruler is failing to evaluate its LogQL rules — the log-derived alerts (SSH-compromise, Postgres-FATAL, …) may not fire. Check the Loki ruler log and the rule files."

      - alert: LokiRulerNotificationsFailing
        expr: rate(loki_prometheus_notifications_errors_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki ruler cannot notify Alertmanager"
          description: "The Loki ruler failed to send alert notifications to Alertmanager — log-derived alerts are evaluating but not being delivered. Check the ruler→Alertmanager connection."

      - alert: BlackboxConfigReloadFailed
        expr: blackbox_exporter_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox exporter config reload failed"
          description: "The blackbox exporter is running the LAST-GOOD module config because the most recent reload failed — new/changed probe modules from the last deploy are NOT active. Check the blackbox log and `blackbox.yml`."

      # (#1041 item 22) Trace-pipeline health. Metric names verified against a live Tempo 3.0.2
      # (scraped /metrics after sending test spans) — the plan's `tempo_discarded_spans_total` does
      # NOT exist; the real refused-span counter is `tempo_receiver_refused_spans`, and
      # `tempo_receiver_accepted_spans` has no `_total` suffix. REQ-OBS-013 keeps sink failures out of
      # the app logs, so nothing else catches a dead tracing pipeline.
      - alert: TempoSpansRefused
        expr: sum(increase(tempo_receiver_refused_spans[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tempo refused spans"
          description: "Tempo's OTLP receiver could not push spans into the pipeline in the last 15 minutes (backpressure or an overloaded live-store) — traces are being dropped at ingest. Check the Tempo log and its memory limit."

      # Silent-pipeline detector, robust to tracing being DISABLED: the accepted-spans counter stays 0
      # (so `sum(...) > 0` is false) when MONITORING_TRACING_ENABLED is off, so this only fires when
      # tracing WAS working (counter > 0 since Tempo start) but stopped for an hour.
      - alert: TempoReceiverSilent
        expr: sum(rate(tempo_receiver_accepted_spans[1h])) == 0 and sum(tempo_receiver_accepted_spans) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tempo received no spans in 1h while tracing is enabled"
          description: "Tempo accepted spans before but none in the last hour, while the accepted-spans counter is non-zero (tracing is enabled) — the OTLP export path from the apps/Keycloak or Alloy's OTLP forward is dead. Traces are not being stored."

      # 3.x write-path health (replaces the removed 2.x ingester metrics): live-store blocks failing to
      # complete or flush locally means accepted traces are lost before they reach a backend block.
      # Most common (self-resolving) cause: an UNGRACEFUL restart truncated the live-store WAL. A
      # `--force-recreate tempo` (deploy.sh's inode-pin config-apply) SIGKILLs Tempo before its 30s
      # dskit drain finishes if the container grace is too short — the compose now sets
      # stop_grace_period: 45s to prevent that (docker-compose.monitoring.yml, ADR-0072). A firing here
      # with no ContainerOomKilled / HostDisk* co-alert is almost always that restart transient.
      - alert: TempoWritePathFailing
        expr: sum(increase(tempo_live_store_failed_completions_total[15m])) > 0 or sum(increase(tempo_live_store_local_failed_flushes_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tempo live-store write path failing"
          description: "Tempo's live-store failed to complete or locally flush blocks in the last 15 minutes — accepted traces are being lost before they reach a persisted block. If this coincides with a Tempo restart/force-recreate and no ContainerOomKilled/HostDisk* alert, it is the ungraceful-shutdown WAL-truncation transient (self-heals; the 45s stop_grace_period is the fix). Otherwise check the Tempo log (Loki app=\"mon-tempo\"), disk space and I/O on the trace volume."

      # (#1041 item 22a) Metrics-generator remote_write to Prometheus is failing — the service-graph
      # series (traces_service_graph_*) are not reaching Prometheus, so the Grafana serviceMap/nodeGraph
      # go stale. Two causes seen in practice, both surface as HTTP 401: (a) the shared `grafana`
      # basic-auth credential drifted (rotated in prometheus-web.yml but not in Tempo's env); (b) the
      # credential is CORRECT everywhere on disk but prometheus-web.yml was (re)provisioned WITHOUT
      # recreating the running Prometheus (it keeps validating the stale loaded bcrypt hash) and/or Tempo
      # (its remote-write client wedges on a cached 401) — the single-file-bind-mount staleness trap; the
      # fix is `--force-recreate` of BOTH prometheus and tempo. Metric verified on a live 3.0.2 generator;
      # it is the generator's embedded Prometheus agent, scraped on the Tempo target.
      - alert: TempoGeneratorRemoteWriteFailing
        expr: sum(rate(prometheus_remote_storage_samples_failed_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tempo metrics-generator remote_write failing"
          description: "The Tempo metrics-generator has been failing to remote_write service-graph samples to Prometheus for 10 minutes — the service map/node graph will go stale. Triage in order: (1) the shared `grafana` web-auth credential matches — PROMETHEUS_WEB_PASSWORD in Tempo's env vs the bcrypt hash in prometheus-web.yml; (2) Prometheus AND Tempo were recreated after prometheus-web.yml last changed — a stale loaded hash or a wedged remote-write client both give 401 despite a correct password, fixed by `--force-recreate` of both; (3) Prometheus's remote-write receiver is enabled. Quick check from net-monitoring-core: an authenticated empty POST (HTTP basic auth as user grafana) to http://prometheus:9090/api/v1/write returns 400 = auth+receiver OK, 401 = auth, 404 = receiver off."

      # Cardinality cap hit: the generator dropped series once the max_active_series limit was reached,
      # so the service graph is incomplete. The plan's tempo_metrics_generator_registry_collections_failed_total
      # does NOT exist on 3.0.2 — series_limited_total is the real cardinality signal (verified live).
      - alert: TempoGeneratorSeriesLimited
        expr: sum(increase(tempo_metrics_generator_registry_series_limited_total[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tempo metrics-generator hit its active-series cap"
          description: "The Tempo metrics-generator dropped series against its max_active_series cap in the last hour — the service graph is incomplete and cardinality is higher than provisioned. Raise the cap or add service-graph filter_policies (tempo.yaml)."

  # Log-pipeline liveness (#1041 item 5, REQ-OBS-014). All 9 Loki ruler alerts — including the
  # critical SSH-compromise and Postgres-FATAL detectors — silently stop firing if Alloy stops
  # tailing: rate() over an absent stream is EMPTY, not zero, and TargetDown cannot see a
  # healthy-but-not-shipping Alloy. Metric names/labels verified against alloy v1.17.1 + loki 3.7.3.
  - name: meta-log-pipeline
    rules:
      # Whole-pipeline silence: the 30s blackbox probes guarantee npm-access baseline traffic, so a
      # 30-minute zero means the shipper or Loki ingest is dead. `or absent(...)` also catches the
      # case where the counter never registered (Loki restarted, nothing pushing).
      - alert: LokiIngestSilent
        expr: >-
          sum(rate(loki_distributor_lines_received_total[30m])) == 0
          or absent(loki_distributor_lines_received_total)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Loki received no log lines in 30m"
          description: "Loki ingested zero log lines for 30 minutes while baseline edge traffic should keep the npm-access stream flowing — the Alloy shipper or Loki ingest path is likely dead. All log-derived alerts are blind until it recovers."

      # Per-critical-path stream death. A tailed file keeps its loki_source_file_read_lines_total
      # series present (flat when quiet — verified against alloy v1.17.1), so ABSENCE of the series
      # means Alloy is not tailing the file at all — exactly the permission-drift failure config.alloy
      # warns about ("would stay silently empty"). Read-rate==0 is deliberately NOT used: the auditd
      # stream is legitimately quiet for days when healthy, so rate==0 would false-positive; total-flow
      # silence is already covered by LokiIngestSilent above.
      - alert: LogStreamSilent
        expr: absent(loki_source_file_read_lines_total{path="/hostlog/auth.log"})
        for: 1h
        labels:
          severity: warning
          stream: host-auth
        annotations:
          summary: "Log stream not being tailed: host auth.log"
          description: "Alloy is not tailing /hostlog/auth.log — the SSH failed-auth / root-login / password-on-key-only-host detectors are blind. Check the /var/log mount and file permissions (adm group readable)."

      - alert: LogStreamSilent
        expr: absent(loki_source_file_read_lines_total{path="/hostlog/audit/audit.log"})
        for: 1h
        labels:
          severity: warning
          stream: host-auditd
        annotations:
          summary: "Log stream not being tailed: host audit.log"
          description: "Alloy is not tailing /hostlog/audit/audit.log — the sshd_config/authorized_keys tamper detector is blind. Confirm /var/log/audit is traversable (0750 root:adm) and log_group=adm in auditd.conf."

      - alert: LogStreamSilent
        expr: absent(loki_source_file_read_lines_total{path=~"/logs/npm/.+_access\\.log"})
        for: 1h
        labels:
          severity: warning
          stream: npm-access
        annotations:
          summary: "Log stream not being tailed: NPM access logs"
          description: "Alloy is not tailing any /logs/npm/*_access.log — the edge 5xx/rate-limit/scan detectors and the npm-access baseline for LokiIngestSilent are blind. Check the NPM log mount."

      - alert: LokiWriteFailing
        expr: sum by (reason) (rate(loki_write_dropped_entries_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alloy is dropping log entries on the write path ({{ $labels.reason }})"
          description: "The Alloy loki.write client dropped log entries (reason: {{ $labels.reason }}) in the last 15 minutes — log lines are being lost before Loki. Check the Alloy→Loki connection and Loki ingest limits."
