rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - the gateway runs without its audience check
    interval: 1m
    input_series:
      - series: 'basetool_ingest_gate_enforcing{gate="audience", application="basetool-ingest", job="basetool-ingest"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: IngestAudienceGateOff
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-ingest
            exp_annotations:
              summary: "Ingest gateway runs without its JWT audience check"
              description: "basetool_ingest_gate_enforcing{gate=\"audience\"} is 0: the ingest gateway accepts any valid realm token at the decoder, including frontend session tokens. Set BASETOOL_INGEST_EXPECTED_AUDIENCES=basetool-ingest (never the backend's audience), the audience the exchange.* client scopes stamp — docs/archive/INGEST_KEYCLOAK_SETUP.md step 7a — then re-render env.d and restart ingest."

  - name: pending, not firing - inside the for window
    interval: 1m
    input_series:
      - series: 'basetool_ingest_gate_enforcing{gate="audience", application="basetool-ingest", job="basetool-ingest"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: IngestAudienceGateOff
        exp_alerts: []

  - name: silent - the audience is configured
    interval: 1m
    input_series:
      - series: 'basetool_ingest_gate_enforcing{gate="audience", application="basetool-ingest", job="basetool-ingest"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: IngestAudienceGateOff
        exp_alerts: []

  - name: silent - the gauge is absent (restart, or a gateway without it)
    interval: 1m
    input_series:
      - series: 'up{job="basetool-ingest"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: IngestAudienceGateOff
        exp_alerts: []

  - name: resolves - the operator sets the audience
    interval: 1m
    input_series:
      - series: 'basetool_ingest_gate_enforcing{gate="audience", application="basetool-ingest", job="basetool-ingest"}'
        values: "0x40 1x20"
    alert_rule_test:
      - eval_time: 35m
        alertname: IngestAudienceGateOff
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-ingest
            exp_annotations:
              summary: "Ingest gateway runs without its JWT audience check"
              description: "basetool_ingest_gate_enforcing{gate=\"audience\"} is 0: the ingest gateway accepts any valid realm token at the decoder, including frontend session tokens. Set BASETOOL_INGEST_EXPECTED_AUDIENCES=basetool-ingest (never the backend's audience), the audience the exchange.* client scopes stamp — docs/archive/INGEST_KEYCLOAK_SETUP.md step 7a — then re-render env.d and restart ingest."
      - eval_time: 50m
        alertname: IngestAudienceGateOff
        exp_alerts: []
