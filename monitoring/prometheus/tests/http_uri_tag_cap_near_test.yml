    alert_rule_test:
      - eval_time: 30m
        alertname: HttpUriTagCapNear
        exp_alerts:
          - exp_labels:
              severity: "warning"
              application: "basetool-frontend"
              meter: "http.client.requests"
            exp_annotations:
              summary: "http.client.requests uri tags near the cap (basetool-frontend)"
              description: "basetool-frontend reports 900 distinct uri values on http.client.requests, 90% of the 1000 its max-uri-tags allows (REQ-OBS-006). Past the cap Micrometer drops every new uri silently — one WARN from MaximumAllowableTagsMeterFilter, no metric — so the routes first hit after it vanish from Http5xxRateHigh, HttpLatencyP95High and every dashboard. Either the route count grew (raise management.metrics.web.*.max-uri-tags in the module's application.yml together with UriTagCapacityTest) or raw paths are leaking into the tag (check ObservationPrivacyFilter's id collapsing)."
