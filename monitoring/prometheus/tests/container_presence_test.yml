# promtool unit test for the container-presence alerts after they stopped reading cAdvisor's own
# series (REQ-OBS-005/-006, ADR-0163).
#
# WHAT THIS PINS, and why it is not a formality. `ContainerMetricsMissing` and
# `CoreContainerMetricsMissing` counted `container_last_seen` -- a series ONLY cAdvisor emits. The
# Podman migration removes cAdvisor by decision, so on the new host both alerts had no input at all
# and fired permanently: measured on the testing host 2026-09-20 with 200 `basetool_container_*`
# series present, 18 containers reported, and a CRITICAL firing anyway.
#
# A critical that is always on is worse than no alert. It is the thing that teaches an operator to
# skip criticals, and it would have started the moment the new production host began serving.
#
# So both now read `basetool:container:present`, the same `or` normalisation the six value alerts
# already use. The cases below assert the property that matters in both directions: SILENT on a
# healthy host of EITHER runtime, and still LOUD when the containers really stop reporting.

rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  # --- a healthy Podman host: the case that was broken ------------------------------------------
  # No cAdvisor anywhere, ten containers reporting through the cgroup collector. Before the change
  # this fired critical; it must be silent.
  - name: silent - a healthy Podman host with no cAdvisor at all
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="frontend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="ingest"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="redis"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="edge"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="prometheus"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="grafana"}'
        values: "100+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: CoreContainerMetricsMissing
        exp_alerts: []


  # --- the alert still has to work ---------------------------------------------------------------
  # Nothing reports at all. This is what the alert is FOR, and the whole risk of the change is
  # making it silent along with the false positive.
  - name: fires - nothing reports container metrics
    interval: 1m
    input_series:
      # A series from another family, so the test has a timeline without giving the alert input.
      - series: "up"
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No container metrics: fewer than 10 named containers are reporting"
              description: "Fewer than 10 name-labelled containers report metrics (or none at all) while the scrape succeeds — the container-level alerts (restart loop, working-set, OOM, CPU throttle) are silently blind. The source is scripts/cgroup-container-metrics.py and its iri-container-metrics.timer (`systemctl status iri-container-metrics.timer`, /var/iri/monitoring/textfile/containers.prom)."

  # --- one core container drops out --------------------------------------------------------------
  # Six of the seven, on a Podman host. The warning has to notice, or a stopped database is
  # invisible to the half of the plane that watches containers.
  - name: fires - one of the seven core containers stops reporting
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="frontend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="ingest"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-keycloak"}'
        values: "100+0x20"
      # redis is deliberately absent.
    alert_rule_test:
      - eval_time: 15m
        alertname: CoreContainerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A core app container stopped reporting metrics"
              description: "Fewer than the 7 core app containers (backend/frontend/ingest/keycloak/db-backend/db-keycloak/redis) report container metrics — one is down, or the collector lost its series. Cross-check TargetDown and the container's health."
