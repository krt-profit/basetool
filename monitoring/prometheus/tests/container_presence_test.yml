rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: silent - a healthy Podman host with no cAdvisor at all
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="frontend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="ingest"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="redis"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="edge"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="prometheus"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="grafana"}'
        values: "100+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: CoreContainerMetricsMissing
        exp_alerts: []

  - name: fires - nothing reports container metrics
    interval: 1m
    input_series:
      - series: "up"
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No container metrics: fewer than 10 named containers are reporting"
              description: "Fewer than 10 name-labelled containers report metrics (or none at all) while the scrape succeeds — the container-level alerts (restart loop, working-set, OOM, CPU throttle) are silently blind. The source is scripts/cgroup-container-metrics.py and its iri-container-metrics.timer (`systemctl status iri-container-metrics.timer`, /var/iri/monitoring/textfile/containers.prom)."

  - name: fires - one of the seven core containers stops reporting
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="frontend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="ingest"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="keycloak"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-backend"}'
        values: "100+0x20"
      - series: 'basetool_container_memory_usage_bytes{name="db-keycloak"}'
        values: "100+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: CoreContainerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A core app container stopped reporting metrics"
              description: "Fewer than the 7 core app containers (backend/frontend/ingest/keycloak/db-backend/db-keycloak/redis) report container metrics — one is down, or the collector lost its series. Cross-check TargetDown and the container's health."
