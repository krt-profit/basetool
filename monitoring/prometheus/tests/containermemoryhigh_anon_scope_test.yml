rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: fires - anonymous memory over the line (blackbox-exporter)
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="blackbox-exporter"}'
        values: "31932416x30"
      - series: 'basetool_container_memory_limit_bytes{name="blackbox-exporter"}'
        values: "33554432x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: blackbox-exporter
            exp_annotations:
              summary: "Container anonymous memory >90% of limit: blackbox-exporter"
              description: "Container blackbox-exporter holds unreclaimable (anonymous) memory within 10% of its limit — OOM early warning. This deliberately excludes page cache and the mapped binary, which the kernel reclaims instead of OOM-killing; cross-check basetool:container:memory_working_set_bytes only to explain a gap, never to size."

  - name: silent - limit filled by the mapped binary, not anonymous memory (alloy)
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="alloy"}'
        values: "217399296x30"
      - series: 'basetool_container_memory_working_set_bytes{name="alloy"}'
        values: "509206528x30"
      - series: 'basetool_container_memory_mapped_file_bytes{name="alloy"}'
        values: "192868352x30"
      - series: 'basetool_container_memory_limit_bytes{name="alloy"}'
        values: "536870912x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts: []

  - name: silent - small exporter whose binary is half its working set (alertmanager)
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="alertmanager"}'
        values: "24322048x30"
      - series: 'basetool_container_memory_working_set_bytes{name="alertmanager"}'
        values: "47775744x30"
      - series: 'basetool_container_memory_mapped_file_bytes{name="alertmanager"}'
        values: "25698304x30"
      - series: 'basetool_container_memory_limit_bytes{name="alertmanager"}'
        values: "50331648x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts: []

  - name: silent - JVM app at its measured steady state (frontend)
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="frontend"}'
        values: "931581952x30"
      - series: 'basetool_container_memory_limit_bytes{name="frontend"}'
        values: "1342177280x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts: []

  - name: silent - a zero limit does not permafire
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="edgecase"}'
        values: "104857600x30"
      - series: 'basetool_container_memory_limit_bytes{name="edgecase"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts: []
