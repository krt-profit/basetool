rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - more than 50 job-order writes an hour hit unknown or hidden orders
    interval: 1m
    input_series:
      - series: 'basetool_exchange_job_order_refused_total{job="basetool-backend", instance="backend:11261", reason="not_found"}'
        values: "0+1x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: JobOrderExchangeNotFoundSpike
        exp_alerts: []
      - eval_time: 70m
        alertname: JobOrderExchangeNotFoundSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Job-order exchange writes keep hitting unknown orders"
              description: "The backend answered more than 50 job-order writes of connected applications in the last hour with 404 NOT_FOUND, because the order is unknown, deleted or outside the member's read set, which answer alike. A client keeps writing on orders it should have dropped, or a client or a member is probing order ids. Check the job-order refusals and the job-order writes per client in the „Job orders“ row of the Exchange dashboard and the gateway logs for the members behind them; if one client's writes cause it, follow „Faulty release on job orders“ in arc42 §6 (REQ-OXCH-005, REQ-OBS-025)."

  - name: silent - a few unknown orders an hour and other refusals do not count
    interval: 1m
    input_series:
      - series: 'basetool_exchange_job_order_refused_total{job="basetool-backend", instance="backend:11261", reason="not_found"}'
        values: "0+0.5x120"
      - series: 'basetool_exchange_job_order_refused_total{job="basetool-backend", instance="backend:11261", reason="version_conflict"}'
        values: "0+5x120"
      - series: 'basetool_exchange_job_order_refused_total{job="basetool-backend", instance="backend:11261", reason="not_permitted"}'
        values: "0+5x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: JobOrderExchangeNotFoundSpike
        exp_alerts: []
