rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - both series registered at zero stay silent
    interval: 1m
    input_series:
      - series: 'basetool_security_expression_failures_total{kind="evaluation", application="basetool-backend"}'
        values: "0x40"
      - series: 'basetool_security_expression_failures_total{kind="other", application="basetool-backend"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SecurityExpressionEvaluationFailed
        exp_alerts: []

  - name: fires - one unresolvable bean is enough
    interval: 1m
    input_series:
      - series: 'basetool_security_expression_failures_total{kind="evaluation", application="basetool-backend"}'
        values: "0x10 1x30"
      - series: 'basetool_security_expression_failures_total{kind="other", application="basetool-backend"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: SecurityExpressionEvaluationFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-backend
              kind: evaluation
            exp_annotations:
              summary: "A method-security expression could not be evaluated on basetool-backend (evaluation)"
              description: "Spring Security failed to evaluate a @PreAuthorize expression in the last 10 minutes, so every call of that operation is refused with 400 ILLEGAL_ARGUMENT. The series is normally zero: kind=evaluation is a bean or method the expression names but the context lacks (a renamed security bean, a changed arity), kind=other an expression that yields no decision. The WARN log line of the 400 (code ILLEGAL_ARGUMENT, exceptionMessage) names the expression; it is a deploy defect, fix the expression or the bean and redeploy (REQ-OBS-020)."

  - name: silent - the alert clears once ten minutes pass without a new failure
    interval: 1m
    input_series:
      - series: 'basetool_security_expression_failures_total{kind="evaluation", application="basetool-backend"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: SecurityExpressionEvaluationFailed
        exp_alerts: []

  - name: fires - an expression without a decision is labelled other
    interval: 1m
    input_series:
      - series: 'basetool_security_expression_failures_total{kind="other", application="basetool-backend"}'
        values: "0x10 2x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: SecurityExpressionEvaluationFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-backend
              kind: other
            exp_annotations:
              summary: "A method-security expression could not be evaluated on basetool-backend (other)"
              description: "Spring Security failed to evaluate a @PreAuthorize expression in the last 10 minutes, so every call of that operation is refused with 400 ILLEGAL_ARGUMENT. The series is normally zero: kind=evaluation is a bean or method the expression names but the context lacks (a renamed security bean, a changed arity), kind=other an expression that yields no decision. The WARN log line of the 400 (code ILLEGAL_ARGUMENT, exceptionMessage) names the expression; it is a deploy defect, fix the expression or the bean and redeploy (REQ-OBS-020)."
