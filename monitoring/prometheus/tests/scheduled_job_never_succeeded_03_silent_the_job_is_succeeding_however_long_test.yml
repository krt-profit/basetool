rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - the job is succeeding, however long the backend has been up
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x40"
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="business_metrics"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: BusinessMetricsStale
        exp_alerts: []
