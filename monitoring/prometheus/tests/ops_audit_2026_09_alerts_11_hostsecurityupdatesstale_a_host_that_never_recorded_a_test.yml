rule_files:
  - ../alerts/infrastructure.yml
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: "HostSecurityUpdatesStale - a host that never recorded a run is not paged before its first window"
    interval: 1m
    input_series:
      - series: "basetool_host_reboot_required"
        values: "0x1900"
    alert_rule_test:
      - eval_time: 20h
        alertname: HostSecurityUpdatesStale
        exp_alerts: []
      - eval_time: 30h
        alertname: HostSecurityUpdatesStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Unattended security updates have not run"
              description: "dnf-automatic has not finished a run for more than two days, or has never recorded one -- the host is not being patched. Check `systemctl list-timers dnf-automatic.timer` and `systemctl status dnf-automatic.service`, and that /etc/systemd/system/dnf-automatic.service.d/20-basetool-metrics.conf (installed by the basetool_host role, tasks/45-updates.yml) is present."
