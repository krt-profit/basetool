rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - idle night with a large stale session backlog
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "0x180"
      - series: 'basetool_active_sessions{job="basetool-frontend"}'
        values: "365x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts: []

  - name: silent - only infrastructure traffic (blackbox probes and scanner 404s)
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "0x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/"}'
        values: "0+8x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="NOT_FOUND"}'
        values: "0+1x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="REDIRECTION"}'
        values: "0+2x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts: []

  - name: fires - zero SSE while real users browse
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "0x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/missions"}'
        values: "0+3x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/notifications/unread-count"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/"}'
        values: "0+8x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts:
          - exp_labels:
              severity: warning
              job: basetool-backend
            exp_annotations:
              summary: "Notification SSE push channel dead while users are online"
              description: "The backend has zero live SSE connections for 30 minutes while the frontend is still serving real user page traffic — the notification push channel is down and clients fell back to polling. Check reverse-proxy SSE buffering and the /notifications/stream relay."

  - name: silent - the ADR-0166 public-surface probes on an idle night
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "0x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/impressum"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/privacy"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/terms"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/licenses"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/manifest.webmanifest"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/.well-known/assetlinks.json"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/app/link-help"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/app/callback"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="REDIRECTION"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/**"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/"}'
        values: "0+8x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts: []

  - name: fires - real users still detected past the ADR-0166 exclusions
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "0x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/missions"}'
        values: "0+1x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/notifications/unread-count"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/**"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/.well-known/assetlinks.json"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/app/callback"}'
        values: "0+2x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/app/link-help"}'
        values: "0+2x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts:
          - exp_labels:
              severity: warning
              job: basetool-backend
            exp_annotations:
              summary: "Notification SSE push channel dead while users are online"
              description: "The backend has zero live SSE connections for 30 minutes while the frontend is still serving real user page traffic — the notification push channel is down and clients fell back to polling. Check reverse-proxy SSE buffering and the /notifications/stream relay."

  - name: silent - healthy site with live SSE connections
    interval: 1m
    input_series:
      - series: 'basetool_sse_connections{job="basetool-backend"}'
        values: "10x180"
      - series: 'http_server_requests_seconds_count{job="basetool-frontend", uri="/missions"}'
        values: "0+3x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: SsePushChannelDead
        exp_alerts: []
