rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - one client removes more than 100 entries in an hour
    interval: 1m
    input_series:
      - series: 'basetool_exchange_removals_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint"}'
        values: "0+3x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeRemoveSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "An exchange client removed unusually many entries"
              description: "One registered client (client_id) removed more than 100 blueprints, stock lots, ships or org-stock entries across its members in the last hour. The mass-change guard stops one member losing much at once, but not a faulty release doing it to many members. Under Administration - Verbundene Anwendungen, undo the client's changes for every member since the faulty release, which suspends it first and includes the org-stock writes (REQ-XCH-021, REQ-XCH-028, REQ-XCH-034, REQ-XCH-046)."

  - name: silent - ordinary removals
    interval: 1m
    input_series:
      - series: 'basetool_exchange_removals_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeRemoveSpike
        exp_alerts: []

  - name: fires - the guard holds a client's batches again and again
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock", outcome="held"}'
        values: "0+1x70"
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock", outcome="applied"}'
        values: "0+50x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeGuardStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "The mass-change guard keeps holding one client's batches"
              description: "The mass-change guard held back more than 10 change sets of one registered client (client_id) in the last hour. Members will see many confirmation links; a client that deletes by mistake, or a release that sends removals where it should not, looks like this. Check the client's recent writes and consider suspending it (REQ-XCH-021)."

  - name: fires - the guard holds a client's org-stock batches again and again
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="org_stock", outcome="held"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeGuardStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "The mass-change guard keeps holding one client's batches"
              description: "The mass-change guard held back more than 10 change sets of one registered client (client_id) in the last hour. Members will see many confirmation links; a client that deletes by mistake, or a release that sends removals where it should not, looks like this. Check the client's recent writes and consider suspending it (REQ-XCH-021)."

  - name: silent - many applied writes and a few held batches
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint", outcome="held"}'
        values: "0x30 1x40"
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="blueprint", outcome="applied"}'
        values: "0+100x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeGuardStorm
        exp_alerts: []

  - name: fires - a client keeps sending refused org-stock writes
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="org_stock", outcome="rejected"}'
        values: "0+2x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeOrgStockRejectionSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "An exchange client keeps sending org-stock writes the Basetool refuses"
              description: "More than 50 org-stock ops of one registered client (client_id) were rejected in the last hour: writes to pools the member is no Logistician of, to personal or foreign entries, with stale versions, unknown holders, earmarked or offered stock, or earmarks to wrong targets or beyond the entry. A client that ignores the per-op reasons, or one probing other units' pools, looks like this. Check the client's recent org-stock writes and consider suspending it (REQ-XCH-045, REQ-XCH-028)."

  - name: silent - rejected stock writes and a few refused org-stock ops
    interval: 1m
    input_series:
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="stock", outcome="rejected"}'
        values: "0+5x70"
      - series: 'basetool_exchange_writes_total{job="basetool-backend", instance="backend:11261", client_id="versekit", resource="org_stock", outcome="rejected"}'
        values: "0x30 10x40"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeOrgStockRejectionSpike
        exp_alerts: []

  - name: fires - a surge of new installations of one client
    interval: 1m
    input_series:
      - series: 'basetool_exchange_installations_created_total{job="basetool-backend", instance="backend:11261", client_id="versekit"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeInstallationSurge
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "Many new installations of one exchange client"
              description: "More than 20 new installations of one registered client (client_id) connected in the last hour. A release day can explain it; a device-code phishing wave or a leaked client cannot. Check the new-connection notifications and the installations on the admin page, and suspend the client if the connections are not expected (REQ-XCH-007, REQ-XCH-028)."

  - name: silent - a few new installations
    interval: 1m
    input_series:
      - series: 'basetool_exchange_installations_created_total{job="basetool-backend", instance="backend:11261", client_id="versekit"}'
        values: "0x30 5x40"
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeInstallationSurge
        exp_alerts: []

  - name: fires - tokens of a client outside the registry keep arriving
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11262", client_id="unregistered", reason="client_not_allowed"}'
        values: "0+2x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeUnknownClient
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Exchange tokens of a client outside the registry"
              description: "The ingest gateway refused more than 10 exchange requests in 15 minutes that carried a valid token of a Keycloak client the registry does not list. Either a client was provisioned in Keycloak but not registered yet, or a client id is being used that should not be. Register the client deliberately or remove it from Keycloak (REQ-XCH-003, REQ-XCH-028)."

  - name: silent - refusals of registered clients do not count
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11262", client_id="versekit", reason="scope_missing"}'
        values: "0+5x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeUnknownClient
        exp_alerts: []

  - name: fires - a bulk undo run failed
    interval: 1m
    input_series:
      - series: 'basetool_scheduled_job_executions_total{job="basetool-backend", instance="backend:11261", task="exchange_bulk_undo", outcome="failure"}'
        values: "0x10 1x20"
      - series: 'basetool_scheduled_job_executions_total{job="basetool-backend", instance="backend:11261", task="exchange_bulk_undo", outcome="success"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ExchangeBulkUndoFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "An admin's bulk undo of an exchange client failed"
              description: "A bulk undo under Administration - Verbundene Anwendungen ended FAILED: at least one member could not be processed, the run broke off, or the queue of ten runs was full and refused it (the client then stays suspended). The members it did process are undone; the others still carry the client's changes. Open the run's details on the admin page for the members marked as failed, check the backend log for the run id, and start the undo again once the cause is fixed - it only touches what is not undone yet (REQ-XCH-034)."

  - name: silent - bulk undo runs that completed
    interval: 1m
    input_series:
      - series: 'basetool_scheduled_job_executions_total{job="basetool-backend", instance="backend:11261", task="exchange_bulk_undo", outcome="failure"}'
        values: "0x30"
      - series: 'basetool_scheduled_job_executions_total{job="basetool-backend", instance="backend:11261", task="exchange_bulk_undo", outcome="success"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ExchangeBulkUndoFailed
        exp_alerts: []
