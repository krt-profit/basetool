rule_files:
  - ../alerts/infrastructure.yml
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: "RestoreDrillStaleOrMissing - one missed weekly drill is reported, seven days are not"
    interval: 1m
    input_series:
      - series: "basetool_restore_drill_last_success_timestamp"
        values: "0x14400"
    alert_rule_test:
      - eval_time: 7d
        alertname: RestoreDrillStaleOrMissing
        exp_alerts: []
      - eval_time: 9d
        alertname: RestoreDrillStaleOrMissing
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "Restore drill stale >8d or metric absent"
              description: "The weekly restore drill (basetool-restore-drill.timer, Sun 05:30) has not succeeded for more than 8 days -- at least one weekly drill failed or did not run -- or the metric is absent (never ran). `{app=\"ops-restore-drill\"} |~ \"FATAL|WARN\"` in Grafana -> Explore -> Loki over the last 10d carries the abort reason; an empty stream means the unit never fired — check `systemctl list-timers basetool-restore-drill.timer`. Not visible via `journalctl -u basetool-restore-drill.service` (stdout/stderr are appended to /var/log/basetool/restore-drill.log)."
