# promtool unit tests for RedisAclDenials (REQ-SEC-068, ADR-0207).
#
# With one Redis ACL user per service, an ACL refusal is a service whose password does not match
# the rendered users.acl, a rule too narrow for what the service does, or a client that is none of
# ours. The rollout's likeliest mistake -- a password typo in .env -- is a service failing AUTH on
# every connection attempt, which is the first case below.
#
# Run locally (no promtool on the host — use an ephemeral container, see monitoring/README.md):
#   docker run --rm --entrypoint sh -v "$PWD/monitoring/prometheus:/work" -w /work \
#     prom/prometheus:v3.14.0 -c 'promtool test rules tests/redis_acl_denials_test.yml'

rule_files:
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  # A service whose password is wrong retries its connection and fails AUTH every time.
  - name: fires - a service failing AUTH continuously
    interval: 1m
    input_series:
      - series: 'redis_acl_access_denied_auth_total{job="redis",instance="redis-exporter:9121"}'
        values: "0+4x30"
      - series: 'redis_acl_access_denied_cmd_total{job="redis",instance="redis-exporter:9121"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisAclDenials
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Redis is refusing authentication or commands under its ACL (20 in 5m)"
              description: "Redis counted ACL refusals (INFO acl_access_denied_auth/cmd/key/channel). With one ACL user per service (REQ-SEC-068) that is a service whose REDIS_<SVC>_PASSWORD does not match the rendered /var/iri/redis/users.acl, a rule in scripts/redis-users.acl.tmpl too narrow for what the service does, or a client that is none of ours. Run `redis-cli ACL LOG 20` inside the redis container as the admin user and read the username, reason and context fields only — the object field can carry a session key, i.e. a session id. See docs/deployment.md, The Redis ACL."

  # A rule too narrow for a real command: the refusals are channel refusals, not AUTH.
  - name: fires - a service refused a channel on every publish
    interval: 1m
    input_series:
      - series: 'redis_acl_access_denied_channel_total{job="redis",instance="redis-exporter:9121"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisAclDenials
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Redis is refusing authentication or commands under its ACL (5 in 5m)"
              description: "Redis counted ACL refusals (INFO acl_access_denied_auth/cmd/key/channel). With one ACL user per service (REQ-SEC-068) that is a service whose REDIS_<SVC>_PASSWORD does not match the rendered /var/iri/redis/users.acl, a rule in scripts/redis-users.acl.tmpl too narrow for what the service does, or a client that is none of ours. Run `redis-cli ACL LOG 20` inside the redis container as the admin user and read the username, reason and context fields only — the object field can carry a session key, i.e. a session id. See docs/deployment.md, The Redis ACL."

  # One stray refusal (an operator's mistyped redis-cli, a probe) must not page.
  - name: silent - a single refusal
    interval: 1m
    input_series:
      - series: 'redis_acl_access_denied_auth_total{job="redis",instance="redis-exporter:9121"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisAclDenials
        exp_alerts: []
      - eval_time: 16m
        alertname: RedisAclDenials
        exp_alerts: []
      - eval_time: 25m
        alertname: RedisAclDenials
        exp_alerts: []

  # The steady state.
  - name: silent - no refusals
    interval: 1m
    input_series:
      - series: 'redis_acl_access_denied_auth_total{job="redis",instance="redis-exporter:9121"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: RedisAclDenials
        exp_alerts: []
