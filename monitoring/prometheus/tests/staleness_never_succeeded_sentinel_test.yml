rule_files:
  - ../alerts/business.yml

evaluation_interval: 1h

tests:
  - name: suppressed - never-succeeded sentinel 0 does not read as 1970 staleness (ExternalSyncStale)
    interval: 1h
    input_series:
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="scwiki_sync"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 52h
        alertname: ExternalSyncStale
        exp_alerts: []

  - name: suppressed - sentinel 0 does not page the critical bank sweep rule
    interval: 1h
    input_series:
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="bank_ledger_integrity"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 52h
        alertname: BankLedgerIntegritySweepStale
        exp_alerts: []

  - name: fires - genuine >48h staleness on a real timestamp (ExternalSyncStale)
    interval: 1h
    input_series:
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="scwiki_sync"}'
        values: "3600x60"
    alert_rule_test:
      - eval_time: 52h
        alertname: ExternalSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              task: scwiki_sync
            exp_annotations:
              summary: "External sync stale >48h (scwiki_sync)"
              description: "The scwiki_sync catalogue sync last succeeded more than 48 hours ago."

  - name: fires - genuine >6h staleness on a real timestamp (BankLedgerIntegritySweepStale)
    interval: 1h
    input_series:
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="bank_ledger_integrity"}'
        values: "3600x60"
    alert_rule_test:
      - eval_time: 52h
        alertname: BankLedgerIntegritySweepStale
        exp_alerts:
          - exp_labels:
              severity: critical
              task: bank_ledger_integrity
            exp_annotations:
              summary: "Bank ledger-integrity sweep stale >6h"
              description: "The hourly bank ledger-integrity sweep last succeeded more than 6 hours ago. While it is stale the violations gauge is frozen and BankLedgerIntegrityViolation cannot fire — the data-corruption detector is blind. Restore the sweep before trusting a 'no violations' reading."

  - name: silent - healthy sync with a recent success
    interval: 1h
    input_series:
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="uex_sync"}'
        values: "176400x60"
    alert_rule_test:
      - eval_time: 52h
        alertname: ExternalSyncStale
        exp_alerts: []
