rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: ContainerMemoryHigh watches alloy as a host service
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="alloy"}'
        values: "503316480x20"
      - series: 'basetool_container_memory_limit_bytes{name="alloy"}'
        values: "536870912x20"
      - series: 'basetool_container_memory_usage_bytes{name="alloy"}'
        values: "503316480x20"
      - series: 'basetool_container_memory_usage_bytes{name="node-exporter"}'
        values: "16000000x20"
      - series: 'basetool_container_metrics_host_services'
        values: "2x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: alloy
            exp_annotations:
              summary: "Container anonymous memory >90% of limit: alloy"
              description: "Container alloy holds unreclaimable (anonymous) memory within 10% of its limit — OOM early warning. This deliberately excludes page cache and the mapped binary, which the kernel reclaims instead of OOM-killing; cross-check basetool:container:memory_working_set_bytes only to explain a gap, never to size."
      - eval_time: 15m
        alertname: HostServiceMetricsMissing
        exp_alerts: []

  - name: HostServiceMetricsMissing names the host service that vanished
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="node-exporter"}'
        values: "16000000x40"
      - series: 'basetool_container_metrics_host_services'
        values: "1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostServiceMetricsMissing
        exp_alerts: []
      - eval_time: 35m
        alertname: HostServiceMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              name: alloy
            exp_annotations:
              summary: "No resource metrics for the host service alloy"
              description: "The cgroup collector is running but has not published alloy's cgroup for 30 minutes. Either the service is stopped (SystemdUnitFailed or TargetDown will say so), or its unit was renamed or moved out of system.slice -- in which case its memory, OOM and pids alerts have lost their input. Compare DEFAULT_HOST_SERVICES in scripts/cgroup-container-metrics.py with `systemctl status` on the host."

  - name: HostServiceMetricsMissing is inert where the collector does not look for host services
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100000000x40"
      - series: 'basetool_container_metrics_containers'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: HostServiceMetricsMissing
        exp_alerts: []
