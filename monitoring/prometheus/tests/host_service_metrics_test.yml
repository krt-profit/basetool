# promtool unit test for the monitoring plane's two HOST services (added 2026-09-22).
#
# Under Compose, alloy and node-exporter were containers, so ContainerMemoryHigh, ContainerOomKilled
# and ContainerPidsHigh watched them. Under Podman both are systemd system units, and from the
# cutover on nothing read their cgroups: no memory alert could fire for either, and neither had a
# memory ceiling to alert against. scripts/cgroup-container-metrics.py now reads their unit cgroups
# and publishes them under the old container names, so the existing alerts cover them again with no
# change of their own.
#
# Two things are locked here:
#   1. the existing ContainerMemoryHigh really does fire for `alloy` when fed from the collector's
#      series -- i.e. the recording rules carry a host service through exactly like a container;
#   2. HostServiceMetricsMissing fires when one of the two disappears while the collector is known to
#      look for them, and stays inert where it is not (an older collector without the
#      `_host_services` gauge).
#
# Run it the way the other tests in this directory are run -- see monitoring/README.md.

rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: ContainerMemoryHigh watches alloy as a host service
    interval: 1m
    input_series:
      # 480 MiB anonymous against a 512M ceiling: 93.75 %, over the 0.90 line.
      - series: 'basetool_container_memory_anon_bytes{name="alloy"}'
        values: "503316480x20"
      - series: 'basetool_container_memory_limit_bytes{name="alloy"}'
        values: "536870912x20"
      - series: 'basetool_container_memory_usage_bytes{name="alloy"}'
        values: "503316480x20"
      - series: 'basetool_container_memory_usage_bytes{name="node-exporter"}'
        values: "16000000x20"
      - series: 'basetool_container_metrics_host_services'
        values: "2x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: alloy
            exp_annotations:
              summary: "Container anonymous memory >90% of limit: alloy"
              description: "Container alloy holds unreclaimable (anonymous) memory within 10% of its limit — OOM early warning. This deliberately excludes page cache and the mapped binary, which the kernel reclaims instead of OOM-killing; cross-check basetool:container:memory_working_set_bytes only to explain a gap, never to size."
      # Both host services are present, so the coverage alert stays quiet.
      - eval_time: 15m
        alertname: HostServiceMetricsMissing
        exp_alerts: []

  - name: HostServiceMetricsMissing names the host service that vanished
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_usage_bytes{name="node-exporter"}'
        values: "16000000x40"
      - series: 'basetool_container_metrics_host_services'
        values: "1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostServiceMetricsMissing
        exp_alerts: []
      - eval_time: 35m
        alertname: HostServiceMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              name: alloy
            exp_annotations:
              summary: "No resource metrics for the host service alloy"
              description: "The cgroup collector is running but has not published alloy's cgroup for 30 minutes. Either the service is stopped (SystemdUnitFailed or TargetDown will say so), or its unit was renamed or moved out of system.slice -- in which case its memory, OOM and pids alerts have lost their input. Compare DEFAULT_HOST_SERVICES in scripts/cgroup-container-metrics.py with `systemctl status` on the host."

  - name: HostServiceMetricsMissing is inert where the collector does not look for host services
    interval: 1m
    input_series:
      # An older collector: container series only, and no _host_services gauge.
      - series: 'basetool_container_memory_usage_bytes{name="backend"}'
        values: "100000000x40"
      - series: 'basetool_container_metrics_containers'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: HostServiceMetricsMissing
        exp_alerts: []
