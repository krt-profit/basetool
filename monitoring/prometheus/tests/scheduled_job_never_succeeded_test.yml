rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - business_metrics has never succeeded and the backend is past its window
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x40"
      - series: 'basetool_scheduled_job_enabled{task="business_metrics"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: BusinessMetricsStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
              task: "business_metrics"
            exp_annotations:
              summary: "Business-metrics sampler stale >10min"
              description: "BusinessMetricsCollector.refresh() has not completed successfully in over 10 minutes \u2014 the approval/work-queue depth gauges are frozen and the queue-overdue alerts may be evaluating stale values. Check the backend logs for the sampler's failure."

  - name: silent - the gauge is absent but the backend only just restarted
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "60x40"
      - series: 'basetool_scheduled_job_enabled{task="business_metrics"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: BusinessMetricsStale
        exp_alerts: []

  - name: silent - the job is succeeding, however long the backend has been up
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x40"
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="business_metrics"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: BusinessMetricsStale
        exp_alerts: []

  - name: fires - one of two tasks has never succeeded while the other is healthy
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x3100"
      - series: 'basetool_scheduled_job_enabled{task="uex_sync"}'
        values: "1x3100"
      - series: 'basetool_scheduled_job_enabled{task="scwiki_sync"}'
        values: "1x3100"
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="uex_sync"}'
        values: "0+60x3100"
    alert_rule_test:
      - eval_time: 50h
        alertname: ExternalSyncStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
              task: "scwiki_sync"
            exp_annotations:
              summary: "External sync stale >48h (scwiki_sync)"
              description: "The scwiki_sync catalogue sync last succeeded more than 48 hours ago."
  - name: silent - a retention sweep switched off on purpose is not a stale one
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x1900"
      - series: 'basetool_scheduled_job_enabled{task="notification_retention"}'
        values: "1x1900"
      - series: 'basetool_scheduled_job_last_success_timestamp_seconds{task="notification_retention"}'
        values: "0+60x1900"
    alert_rule_test:
      - eval_time: 30h
        alertname: ScheduledJobStale
        exp_alerts: []

  - name: fires - an enabled sweep that has never succeeded still fires
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x1900"
      - series: 'basetool_scheduled_job_enabled{task="audit_retention"}'
        values: "1x1900"
    alert_rule_test:
      - eval_time: 30h
        alertname: ScheduledJobStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
              task: "audit_retention"
            exp_annotations:
              summary: "Scheduled job stale >26h (audit_retention)"
              description: "The audit_retention job last succeeded more than 26 hours ago \u2014 it may have stopped being scheduled."

  - name: fires - one task is off and the other is dead, and only the dead one fires
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="basetool-backend"}'
        values: "0x3100"
      - series: 'basetool_scheduled_job_enabled{task="uex_sync"}'
        values: "1x3100"
    alert_rule_test:
      - eval_time: 50h
        alertname: ExternalSyncStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
              task: "uex_sync"
            exp_annotations:
              summary: "External sync stale >48h (uex_sync)"
              description: "The uex_sync catalogue sync last succeeded more than 48 hours ago."
