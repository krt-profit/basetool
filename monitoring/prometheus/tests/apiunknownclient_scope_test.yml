rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - an unregistered client drives the API
    interval: 1m
    input_series:
      - series: 'basetool_api_client_requests_total{client_id="other", application="basetool-backend"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiUnknownClient
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Unregistered client software is calling the backend API"
              description: "A token whose azp names no known client drove /api/** for 10 minutes. Either a first-party client was added to the realm without being added to app.monitoring.api-clients.known-client-ids, or something nobody approved is using the API. Identify it from the Keycloak client sessions and the frontend's and gateway's access logs; the label is deliberately bounded to 'other' and will never name it. Since ADR-0270 the backend also refuses a token whose azp is not in app.security.jwt.accepted-client-ids, so a caller that reaches /api/** at all is one of the named clients or the gateway acting for a member."

  - name: silent - only known clients, at high volume
    interval: 1m
    input_series:
      - series: 'basetool_api_client_requests_total{client_id="basetool-frontend", application="basetool-backend"}'
        values: "0+250x60"
      - series: 'basetool_api_client_requests_total{client_id="basetool-frontend", application="basetool-backend"}'
        values: "0+40x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiUnknownClient
        exp_alerts: []

  - name: silent - tokens without an azp claim are a different failure
    interval: 1m
    input_series:
      - series: 'basetool_api_client_requests_total{client_id="none", application="basetool-backend"}'
        values: "0+5x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiUnknownClient
        exp_alerts: []

  - name: silent - eight minutes in, the for-clause has not elapsed
    interval: 1m
    input_series:
      - series: 'basetool_api_client_requests_total{client_id="other", application="basetool-backend"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 8m
        alertname: ApiUnknownClient
        exp_alerts: []
