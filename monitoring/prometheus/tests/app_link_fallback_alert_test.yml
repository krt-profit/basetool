rule_files:
  - ../alerts/infrastructure.yml

evaluation_interval: 30s

tests:
  - name: EdgeAppLinkFallbackBroken fires while the edge is up
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-app-link", instance="https://profit-base.online/app/callback"}'
        values: "0x40"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: EdgeAppLinkFallbackBroken
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox-app-link
              instance: "https://profit-base.online/app/callback"
            exp_annotations:
              summary: "Android App Link fallback broken: https://profit-base.online/app/callback"
              description: "https://profit-base.online/app/callback no longer answers 303 to /app/link-help on its first response (REQ-SEC-038). A 200 means the authorization code is being left in the member's address bar and history; a 302 into /oauth2/authorization/keycloak means the permitAll entry was lost and the member is sent back into a login they cannot finish; a 404 means AppLinkController is gone from the image. Check the frontend SecurityConfig anonymous matchers, AppLinkController, and the NPM proxy host for a rule ahead of the app."

  - name: EdgeAppLinkFallbackBroken stays silent while the edge itself is down
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-app-link", instance="https://profit-base.online/app/callback"}'
        values: "0x40"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: EdgeAppLinkFallbackBroken
        exp_alerts: []

  - name: EdgeAppLinkFallbackBroken does not page inside the deploy window
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-app-link", instance="https://profit-base.online/app/callback"}'
        values: "0x40"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: EdgeAppLinkFallbackBroken
        exp_alerts: []

  - name: EdgeAppLinkFallbackBroken is silent while the fallback redirects
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-app-link", instance="https://profit-base.online/app/callback"}'
        values: "1x40"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: EdgeAppLinkFallbackBroken
        exp_alerts: []
