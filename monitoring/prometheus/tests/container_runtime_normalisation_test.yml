rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: podman shape - anonymous memory over the line fires ContainerMemoryHigh
    interval: 1m
    input_series:
      - series: 'basetool_container_memory_anon_bytes{name="backend"}'
        values: "966367641x30"
      - series: 'basetool_container_memory_limit_bytes{name="backend"}'
        values: "1030792151x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: backend
            exp_annotations:
              summary: "Container anonymous memory >90% of limit: backend"
              description: "Container backend holds unreclaimable (anonymous) memory within 10% of its limit — OOM early warning. This deliberately excludes page cache and the mapped binary, which the kernel reclaims instead of OOM-killing; cross-check basetool:container:memory_working_set_bytes only to explain a gap, never to size."

  - name: podman shape - pids at the cap fires ContainerPidsHigh
    interval: 1m
    input_series:
      - series: 'basetool_container_pids{name="grafana"}'
        values: "512x30"
      - series: 'basetool_container_pids_max{name="grafana"}'
        values: "512x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerPidsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: grafana
            exp_annotations:
              summary: "Container pids >80% of the cgroup cap: grafana"
              description: "Container grafana holds more than 80% of its pids cgroup cap (basetool:container:pids is the cgroup pids.current count, basetool:container:pids_max its pids.max). At the cap the kernel refuses new tasks: a JVM throws 'unable to create native thread' and child-process spawns (healthcheck wget, ssl_client) fail — the 2026-07-12 ingest native-thread OOM and the 2026-07-26 grafana zombie exhaustion. A steady climb is a task/zombie leak — investigate before it reaches the cap; do not raise the cap to silence it."

  - name: podman shape - an OOM kill fires ContainerOomKilled
    interval: 1m
    input_series:
      - series: 'basetool_container_oom_kills_total{name="ingest"}'
        values: "0+0x10 1+0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerOomKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              name: ingest
            exp_annotations:
              summary: "Container OOM-killed: ingest"
              description: "Container ingest recorded an out-of-memory kill in the last 15 minutes. Check its memory limit and working set; on the memory-capped host this is the designed sacrifice order — confirm it was the intended victim."

  - name: podman shape - sustained throttling fires ContainerCpuThrottledHigh
    interval: 1m
    input_series:
      - series: 'basetool_container_cpu_periods_total{name="frontend"}'
        values: "0+100x40"
      - series: 'basetool_container_cpu_throttled_periods_total{name="frontend"}'
        values: "0+50x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ContainerCpuThrottledHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: frontend
            exp_annotations:
              summary: "Container CPU throttled >25%: frontend"
              description: "Container frontend had more than 25% of its CFS periods throttled for 15 minutes — it is CPU-starved against its limit, degrading latency. Consider raising its cpus limit."

  - name: collector - a stale textfile fires, and takes every container alert down with it
    interval: 1m
    input_series:
      - series: 'basetool_container_metrics_timestamp_seconds'
        values: "0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerCgroupCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The cgroup container-metrics collector has stopped writing"
              description: "basetool_container_metrics_timestamp_seconds is more than 5 minutes old or absent, so every basetool_container_* series is stale or missing and the container memory, OOM, CPU-throttling and pids alerts have lost their input on this host. They will NOT fire while this is true. Check iri-container-metrics.timer and the textfile directory."

  - name: collector - a fresh textfile is silent
    interval: 1m
    input_series:
      - series: 'basetool_container_metrics_timestamp_seconds'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ContainerCgroupCollectorStale
        exp_alerts: []

  - name: collector - a fresh file listing zero containers fires its own alert
    interval: 1m
    input_series:
      - series: 'basetool_container_metrics_timestamp_seconds'
        values: "0+60x40"
      - series: 'basetool_container_metrics_containers'
        values: "0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerCgroupCollectorStale
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerCgroupCollectorFoundNothing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The cgroup container-metrics collector found no containers"
              description: "The collector is running and writing, but matched zero container cgroups for 10 minutes. Either nothing is running on this host, or the cgroup layout stopped matching its pattern -- in which case the file is fresh, ContainerCgroupCollectorStale stays green, and every container-level alert has no data to fire on."

  - name: collector - a collector that never wrote fires the staleness alert
    interval: 1m
    input_series:
      - series: 'container_last_seen{name="backend"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ContainerCgroupCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The cgroup container-metrics collector has stopped writing"
              description: "basetool_container_metrics_timestamp_seconds is more than 5 minutes old or absent, so every basetool_container_* series is stale or missing and the container memory, OOM, CPU-throttling and pids alerts have lost their input on this host. They will NOT fire while this is true. Check iri-container-metrics.timer and the textfile directory."
      - eval_time: 30m
        alertname: ContainerCgroupCollectorFoundNothing
        exp_alerts: []
