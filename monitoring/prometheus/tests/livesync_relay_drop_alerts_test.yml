rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - healthy relay with traffic and no drops
    interval: 1m
    input_series:
      - series: 'basetool_presence_relay_frames_total{job="basetool-frontend", topic_class="mission", type="changed"}'
        values: "0+2x240"
      - series: 'basetool_presence_relay_frames_total{job="basetool-frontend", topic_class="mission", type="snapshot"}'
        values: "0+9x240"
    alert_rule_test:
      - eval_time: 180m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts: []
      - eval_time: 180m
        alertname: LiveSyncSectionKeySkew
        exp_alerts: []

  - name: silent - a one-off send_failed race
    interval: 1m
    input_series:
      - series: 'basetool_presence_relay_dropped_total{job="basetool-frontend", topic_class="mission", reason="send_failed"}'
        values: "0x30 1x240"
    alert_rule_test:
      - eval_time: 120m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts: []

  - name: fires - sustained throttled drops on one room
    interval: 1m
    input_series:
      - series: 'basetool_presence_relay_dropped_total{job="basetool-frontend", topic_class="mission", reason="throttled"}'
        values: "0+1x240"
    alert_rule_test:
      - eval_time: 60m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              topic_class: mission
              reason: throttled
            exp_annotations:
              summary: "Live-sync relay dropping frames on mission (throttled)"
              description: "The live-sync relay dropped more than 3 frames in an hour on topic class mission for reason throttled, sustained for 15m — peers on that surface are silently missing updates. Prod baseline for this counter is zero over 21d, so any sustained stream is anomalous. `throttled`/`topic_throttled`: a client or a room is exceeding its token bucket (misbehaving client, or a genuinely hot room needing a wider bound). `send_failed`: sockets breaking mid-write — check the reverse proxy's WebSocket timeouts. `topic_cap`: a client subscribing past its per-session topic cap (client bug). `authorize_saturated`: the subscribe-authorization executor is saturated and subscribes are failing OPEN — a subscribe was admitted without an authorization check, so treat it as security-relevant and check backend latency."

  - name: fires - authorize_saturated fail-open stream
    interval: 1m
    input_series:
      - series: 'basetool_presence_relay_dropped_total{job="basetool-frontend", topic_class="order_detail", reason="authorize_saturated"}'
        values: "0+1x240"
    alert_rule_test:
      - eval_time: 60m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              topic_class: order_detail
              reason: authorize_saturated
            exp_annotations:
              summary: "Live-sync relay dropping frames on order_detail (authorize_saturated)"
              description: "The live-sync relay dropped more than 3 frames in an hour on topic class order_detail for reason authorize_saturated, sustained for 15m — peers on that surface are silently missing updates. Prod baseline for this counter is zero over 21d, so any sustained stream is anomalous. `throttled`/`topic_throttled`: a client or a room is exceeding its token bucket (misbehaving client, or a genuinely hot room needing a wider bound). `send_failed`: sockets breaking mid-write — check the reverse proxy's WebSocket timeouts. `topic_cap`: a client subscribing past its per-session topic cap (client bug). `authorize_saturated`: the subscribe-authorization executor is saturated and subscribes are failing OPEN — a subscribe was admitted without an authorization check, so treat it as security-relevant and check backend latency."

  - name: fires - persistent section-key skew at low volume
    interval: 5m
    input_series:
      - series: 'basetool_presence_relay_dropped_total{job="basetool-frontend", topic_class="mission", reason="section_filtered"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 130m
        alertname: LiveSyncSectionKeySkew
        exp_alerts:
          - exp_labels:
              severity: warning
              topic_class: mission
            exp_annotations:
              summary: "Live-sync section-key skew on mission (peers going stale)"
              description: "The live-sync relay has been filtering unknown section keys out of `changed` frames on topic class mission for over 2 hours — a broadcast key is missing from the relay's accept-list, so peers' matching panels stay stale with no visible error (the REQ-FE-010 defect class). A section key must exist at all three mirror points at once: the acting page's seam map, LiveSyncTopicClass.allowedSections, and the receiving client's apply map. Check what the last frontend deploy changed on that surface and raise LiveSyncWebSocketHandler to DEBUG to see the rejected key (logged sanitised, never a metric tag)."

  - name: silent - a one-off section_filtered burst that stops
    interval: 1m
    input_series:
      - series: 'basetool_presence_relay_dropped_total{job="basetool-frontend", topic_class="mission", reason="section_filtered"}'
        values: "0+1x10 11x300"
    alert_rule_test:
      - eval_time: 180m
        alertname: LiveSyncSectionKeySkew
        exp_alerts: []
      - eval_time: 180m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts: []
      - eval_time: 45m
        alertname: LiveSyncRelayDropsSustained
        exp_alerts: []
