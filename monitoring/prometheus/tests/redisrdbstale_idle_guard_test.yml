rule_files:
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: silent - idle store, snapshot two hours old, zero pending changes
    interval: 1m
    input_series:
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="redis-exporter:9121",job="redis"}'
        values: "0x150"
      - series: 'redis_rdb_changes_since_last_save{instance="redis-exporter:9121",job="redis"}'
        values: "0x150"
    alert_rule_test:
      - eval_time: 120m
        alertname: RedisRdbStale
        exp_alerts: []

  - name: fires - pending changes unsaved past the hour
    interval: 1m
    input_series:
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="redis-exporter:9121",job="redis"}'
        values: "0x150"
      - series: 'redis_rdb_changes_since_last_save{instance="redis-exporter:9121",job="redis"}'
        values: "1+3x149"
    alert_rule_test:
      - eval_time: 120m
        alertname: RedisRdbStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: redis-exporter:9121
              job: redis
            exp_annotations:
              summary: "Redis has unsaved changes and no RDB snapshot for over 1h"
              description: "Redis has held unsaved changes for more than an hour without completing an RDB snapshot, so the snapshot fork is failing or blocked. AOF (appendfsync everysec) is the primary durability layer, so this is not a data-loss signal on its own, but a stale RDB slows restart — check the redis log for save errors and the disk free space on /var/iri/redis. An idle store with no pending changes does NOT fire this: the save timestamp ageing on a quiet night is normal."

  - name: silent - pending changes but a recent save
    interval: 1m
    input_series:
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="redis-exporter:9121",job="redis"}'
        values: "7000x150"
      - series: 'redis_rdb_changes_since_last_save{instance="redis-exporter:9121",job="redis"}'
        values: "4x150"
    alert_rule_test:
      - eval_time: 120m
        alertname: RedisRdbStale
        exp_alerts: []

  - name: fires - bgsave status err on an otherwise idle store
    interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
      - series: 'redis_rdb_last_save_timestamp_seconds{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
      - series: 'redis_rdb_changes_since_last_save{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisRdbSaveFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: redis-exporter:9121
              job: redis
            exp_annotations:
              summary: "Redis background save is failing"
              description: "The last Redis RDB background save failed (INFO rdb_last_bgsave_status:err). The snapshot half of the RDB+AOF posture (ADR-0079) is broken, so a restart falls back to the AOF alone and takes longer. Usual causes are no disk space or no write permission on the /var/iri/redis bind mount, or a fork refused for lack of memory — check the redis log and the host filesystem."
      - eval_time: 20m
        alertname: RedisRdbStale
        exp_alerts: []

  - name: silent - bgsave status ok
    interval: 1m
    input_series:
      - series: 'redis_rdb_last_bgsave_status{instance="redis-exporter:9121",job="redis"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisRdbSaveFailing
        exp_alerts: []

  - name: fires - aof write status err while aof is enabled
    interval: 1m
    input_series:
      - series: 'redis_aof_last_write_status{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
      - series: 'redis_aof_enabled{instance="redis-exporter:9121",job="redis"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisAofWriteFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: redis-exporter:9121
              job: redis
            exp_annotations:
              summary: "Redis AOF writes are failing"
              description: "The last Redis AOF write failed (INFO aof_last_write_status:err) while AOF is enabled. AOF is the primary durability layer for the session store, so writes already acknowledged to the frontend are not reaching disk and a crash would log those members out. Check disk space and permissions on the /var/iri/redis bind mount and the redis log."

  - name: silent - aof disabled
    interval: 1m
    input_series:
      - series: 'redis_aof_last_write_status{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
      - series: 'redis_aof_enabled{instance="redis-exporter:9121",job="redis"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: RedisAofWriteFailing
        exp_alerts: []
