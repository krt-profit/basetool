rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - consumed series entirely absent while the web publishes to open app streams
    interval: 1m
    input_series:
      - series: 'basetool_livesync_redis_published_total{job="basetool-frontend"}'
        values: "0+6x120"
      - series: "basetool_livesync_streams"
        values: "4x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: AppLiveSyncBridgeSilent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "App live-sync bridge silent (web changes are not reaching the app)"
              description: "The web frontend has been publishing live-sync changed frames for 30 minutes and the backend has consumed none, while app live-sync streams are open — so a browser edit never reaches the app and an app write never reaches a browser, with no error on either side. Check app.live-sync.redis-fanout.enabled on the backend (must be true in prod), that its channel is the frontend's basetool:livesync:changed and not a channel of its own, and the Redis default-user ACL (`&*` for PUBLISH/SUBSCRIBE)."

  - name: fires - consumed counter exists but has flatlined
    interval: 1m
    input_series:
      - series: 'basetool_livesync_redis_published_total{job="basetool-frontend"}'
        values: "0+6x120"
      - series: 'basetool_livesync_redis_consumed_total{job="basetool-backend"}'
        values: "17x120"
      - series: "basetool_livesync_streams"
        values: "2x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: AppLiveSyncBridgeSilent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "App live-sync bridge silent (web changes are not reaching the app)"
              description: "The web frontend has been publishing live-sync changed frames for 30 minutes and the backend has consumed none, while app live-sync streams are open — so a browser edit never reaches the app and an app write never reaches a browser, with no error on either side. Check app.live-sync.redis-fanout.enabled on the backend (must be true in prod), that its channel is the frontend's basetool:livesync:changed and not a channel of its own, and the Redis default-user ACL (`&*` for PUBLISH/SUBSCRIBE)."

  - name: silent - frames are crossing
    interval: 1m
    input_series:
      - series: 'basetool_livesync_redis_published_total{job="basetool-frontend"}'
        values: "0+6x120"
      - series: 'basetool_livesync_redis_consumed_total{job="basetool-backend"}'
        values: "0+5x120"
      - series: "basetool_livesync_streams"
        values: "3x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: AppLiveSyncBridgeSilent
        exp_alerts: []

  - name: silent - no app stream is open
    interval: 1m
    input_series:
      - series: 'basetool_livesync_redis_published_total{job="basetool-frontend"}'
        values: "0+6x120"
      - series: "basetool_livesync_streams"
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: AppLiveSyncBridgeSilent
        exp_alerts: []

  - name: silent - the web is not publishing either
    interval: 1m
    input_series:
      - series: 'basetool_livesync_redis_published_total{job="basetool-frontend"}'
        values: "42x120"
      - series: "basetool_livesync_streams"
        values: "5x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: AppLiveSyncBridgeSilent
        exp_alerts: []
