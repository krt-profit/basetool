rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - user sync runs clean, failure counter flat at zero
    interval: 1m
    input_series:
      - series: "basetool_user_sync_failures_total"
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: UserSyncPerUserFailure
        exp_alerts: []

  - name: fires - a single per-user reconciliation failure
    interval: 1m
    input_series:
      - series: "basetool_user_sync_failures_total"
        values: "0+0x30 1+0x90"
    alert_rule_test:
      - eval_time: 45m
        alertname: UserSyncPerUserFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "User sync could not reconcile 1 account(s) in the last hour"
              description: "One or more users threw during the Keycloak->local reconciliation and were skipped. They keep the roles their local row last carried until a later run succeeds, and any Keycloak-side change to them has not landed. The backend log names the account id and the cause (never a handle); a repeating id is a permanent failure, not a hiccup. A duplicate Discord identity is the known cause -- check UserDiscordLinkCollision alongside this."

  - name: silent - no Discord identity is held twice
    interval: 1m
    input_series:
      - series: "basetool_user_discord_link_collisions_total"
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: UserDiscordLinkCollision
        exp_alerts: []

  - name: fires - one Discord identity held by two accounts, run after run
    interval: 1m
    input_series:
      - series: "basetool_user_discord_link_collisions_total"
        values: "0+0x20 1+0x40 2+0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: UserDiscordLinkCollision
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Discord identity held by two accounts: 1 skipped link write(s) in the last hour"
              description: "One Discord identity is reachable from two app_user rows, so the link could not be written to the second. One member has two accounts -- consolidate them from the member administration (the duplicate folds into the survivor, belongings and Discord identity move, the duplicate is removed). The alert repeats every run until then. The backend log names both account ids, never the snowflake."
