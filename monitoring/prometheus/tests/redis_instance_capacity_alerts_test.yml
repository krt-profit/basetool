rule_files:
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: fires - redis-session near its maxmemory, while redis-shared at half stays silent
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis-session-exporter:9121",job="redis",redis="session"}'
        values: "450x20"
      - series: 'redis_memory_max_bytes{instance="redis-session-exporter:9121",job="redis",redis="session"}'
        values: "500x20"
      - series: 'redis_memory_used_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "500x20"
      - series: 'redis_memory_max_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: redis-session-exporter:9121
              job: redis
              redis: session
            exp_annotations:
              summary: "Redis memory >85% of maxmemory (redis-session)"
              description: "redis-session has used 90% of its maxmemory for 10 minutes; the Redis dashboard shows each instance's maxmemory. Under noeviction, hitting the ceiling refuses every write that needs memory: NEW session writes / logins fail (existing sessions survive) — investigate session growth (ActiveSessionsRunaway) or a leak before it does."

  - name: fires - redis-shared near its maxmemory
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "870x20"
      - series: 'redis_memory_max_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: redis-shared-exporter:9121
              job: redis
              redis: shared
            exp_annotations:
              summary: "Redis memory >85% of maxmemory (redis-shared)"
              description: "redis-shared has used 87% of its maxmemory for 10 minutes; the Redis dashboard shows each instance's maxmemory. Under noeviction, hitting the ceiling refuses every write that needs memory: the backend can no longer refresh the exchange registry mirror and revocations, and the gateway can no longer stage handoffs or record quotas and idempotency answers, while sign-in is unaffected — check the exchange budget (ExchangeBudgetHigh, ExchangeClientBudgetHigh) and the handoff volume before it does."

  - name: silent - no maxmemory configured
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "870x20"
      - series: 'redis_memory_max_bytes{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisMemoryHigh
        exp_alerts: []

  - name: fires - redis-shared evicting keys is named with its own consequence
    interval: 1m
    input_series:
      - series: 'redis_evicted_keys_total{instance="redis-shared-exporter:9121",job="redis",redis="shared"}'
        values: "0+1x40"
      - series: 'redis_evicted_keys_total{instance="redis-session-exporter:9121",job="redis",redis="session"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: RedisEvictions
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: redis-shared-exporter:9121
              job: redis
              redis: shared
            exp_annotations:
              summary: "Redis is evicting keys (redis-shared)"
              description: "redis-shared evicted keys in the last 15 minutes. Both Redis instances run maxmemory-policy noeviction, which never evicts — so any eviction means its policy was changed to an evicting one (allkeys-*/volatile-*), which can drop an exchange revocation, re-opening the access it withdrew, or a staged handoff. Restore noeviction and check what changed the config."

  - name: fires - redis-session rejecting connections is named with its own consequence
    interval: 1m
    input_series:
      - series: 'redis_rejected_connections_total{instance="redis-session-exporter:9121",job="redis",redis="session"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: RedisConnectionsRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: redis-session-exporter:9121
              job: redis
              redis: session
            exp_annotations:
              summary: "Redis rejected connections (redis-session)"
              description: "redis-session rejected new connections in the last 15 minutes — the maxclients limit was reached (a connection leak or storm). New sessions and Spring Session writes will start failing."
