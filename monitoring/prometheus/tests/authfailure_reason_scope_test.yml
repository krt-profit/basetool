rule_files:
  - ../alerts/apps.yml

evaluation_interval: 1m

tests:
  - name: silent - the deployment's own blackbox probes are not a brute force
    interval: 1m
    input_series:
      - series: 'basetool_auth_failures_total{reason="no_credentials", application="basetool-backend"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackendAuthFailureSpike
        exp_alerts: []
      - eval_time: 30m
        alertname: BackendUnauthenticatedFlood
        exp_alerts: []

  - name: silent - a scanner sweep stays off the brute-force alert
    interval: 1m
    input_series:
      - series: 'basetool_auth_failures_total{reason="no_credentials", application="basetool-backend"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackendAuthFailureSpike
        exp_alerts: []

  - name: fires - a rejected token at the same rate the probes run
    interval: 1m
    input_series:
      - series: 'basetool_auth_failures_total{reason="invalid_token", application="basetool-backend"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackendAuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-backend
              reason: invalid_token
            exp_annotations:
              summary: "Rejected-token spike on backend (possible JWT brute force)"
              description: "The backend is rejecting presented tokens at an elevated rate - possible credential/JWT guessing. This series is normally zero: a caller with no token at all counts as reason=no_credentials, not here. Split the whole picture with sum by (reason) (rate(basetool_auth_failures_total{application=\"basetool-backend\"}[5m])): invalid_token is a rejected token (expired, wrong issuer/audience, bad signature), invalid_request a malformed Authorization header, insufficient_scope a valid token missing a scope, no_credentials a request that presented nothing (the ordinary background - probes, scanners, pre-login navigation), other an unenumerated failure worth reading the DEBUG line for."

  - name: silent - eight minutes of rejected tokens has not elapsed the for-clause
    interval: 1m
    input_series:
      - series: 'basetool_auth_failures_total{reason="invalid_token", application="basetool-backend"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 8m
        alertname: BackendAuthFailureSpike
        exp_alerts: []

  - name: fires - a sustained credential-less flood
    interval: 1m
    input_series:
      - series: 'basetool_auth_failures_total{reason="no_credentials", application="basetool-backend"}'
        values: "0+120x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: BackendUnauthenticatedFlood
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-backend
              reason: no_credentials
            exp_annotations:
              summary: "Sustained flood of credential-less requests on backend"
              description: "The backend is refusing more than 18 requests/minute that carry no Authorization header at all, for 15 minutes. Its floor is 2/minute from the internal TLS probe, and the backend is reachable only from the frontend and ingest, so this is an internal caller looping without a token - not credential guessing, which would show on BackendAuthFailureSpike. Check basetool_api_client_requests_total for the calling client and basetool_ratelimit_rejections_total for whether the rate limiter is already absorbing it."

  - name: silent - ingest probe traffic is not a brute force
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="no_credentials", application="basetool-ingest"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: IngestAuthFailureSpike
        exp_alerts: []

  - name: fires - a rejected token on the ingest gateway
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="invalid_token", application="basetool-ingest", path_scope="exchange"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: IngestAuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-ingest
              reason: invalid_token
              path_scope: exchange
            exp_annotations:
              summary: "Rejected-token spike on ingest (possible JWT brute force)"
              description: "The ingest gateway is rejecting presented tokens at an elevated rate on exchange (exchange = the exchange routes, other = every other path). Normally zero - a credential-less request counts as reason=no_credentials. Split with sum by (reason, path_scope) (rate(basetool_ingest_auth_failures_total[5m]))."

  - name: silent then firing - the gateway's own volume alert clears the probe floor
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="no_credentials", application="basetool-ingest"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: IngestUnauthenticatedFlood
        exp_alerts: []

  - name: fires - a credential-less flood on the gateway
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="no_credentials", application="basetool-ingest", path_scope="other"}'
        values: "0+120x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: IngestUnauthenticatedFlood
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-ingest
              reason: no_credentials
              path_scope: other
            exp_annotations:
              summary: "Sustained flood of credential-less requests on ingest"
              description: "The ingest gateway is refusing more than 60 requests/minute that carry no Authorization header at all on other, for 15 minutes - far above its blackbox-probe baseline. Scanning or a looping client, not credential guessing. Check basetool_bot_blocked_total and the per-IP rate limiter before widening anything."

  - name: fires - exchange proofs keep failing
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="invalid_dpop_proof", application="basetool-ingest", path_scope="exchange"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeDpopProofsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Exchange DPoP proofs keep failing on ingest"
              description: "Exchange clients keep presenting DPoP proofs the gateway refuses - invalid, replayed, or signed by another key than the token is bound to (REQ-XCH-006). A misimplemented client or a replay attempt; a missing server nonce is the normal first round trip and does not count here. Split by client in the gateway's access log."

  - name: silent - nonce challenges are the normal first round trip
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="use_dpop_nonce", application="basetool-ingest", path_scope="exchange"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeDpopProofsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: IngestAuthFailureSpike
        exp_alerts: []

  - name: silent - the DPoP proof limit is not a failing proof
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="dpop_proof_limit", application="basetool-ingest", path_scope="exchange"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeDpopProofsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: IngestAuthFailureSpike
        exp_alerts: []

  - name: silent - a full proof store is not a failing proof
    interval: 1m
    input_series:
      - series: 'basetool_ingest_auth_failures_total{reason="dpop_store_full", application="basetool-ingest", path_scope="exchange"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeDpopProofsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: IngestAuthFailureSpike
        exp_alerts: []

  - name: fires - the exchange replay cache is full
    interval: 1m
    input_series:
      - series: 'basetool_ingest_dpop_replay_refused_total{reason="full", application="basetool-ingest", path_scope="exchange"}'
        values: "0 0 0 3 3 3 3 3 3 3"
    alert_rule_test:
      - eval_time: 4m
        alertname: IngestDpopReplayCacheFull
        exp_alerts:
          - exp_labels:
              severity: warning
              path_scope: exchange
            exp_annotations:
              summary: "The ingest DPoP replay cache is full"
              description: "The DPoP jti replay cache of exchange holds its total cap of live proofs and refuses every new proof there - on exchange with 503 SERVICE_UNAVAILABLE and Retry-After (not counted by IdentityProviderUnavailable), on every other path with 401 (REQ-XCH-006). Each member is capped on its own, so this takes many members at their cap: look at basetool_ingest_dpop_replay_refused_total{reason=\"member_cap\"} and the per-IP rate limiter, and raise app.exchange.limits.dpop-proofs-total only for real load."

  - name: silent - one member at its cap does not fill the cache
    interval: 1m
    input_series:
      - series: 'basetool_ingest_dpop_replay_refused_total{reason="member_cap", application="basetool-ingest", path_scope="exchange"}'
        values: "0+50x30"
      - series: 'basetool_ingest_dpop_replay_refused_total{reason="full", application="basetool-ingest", path_scope="exchange"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: IngestDpopReplayCacheFull
        exp_alerts: []
