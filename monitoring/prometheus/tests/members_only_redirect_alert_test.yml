rule_files:
  - ../alerts/infrastructure.yml

evaluation_interval: 30s

tests:
  - name: EdgeMembersOnlyRedirectBroken fires per failing page while the edge is up
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/missions"}'
        values: "0x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/operations"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/orders"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: EdgeMembersOnlyRedirectBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-members-only
              instance: "https://profit-base.online/missions"
            exp_annotations:
              summary: "Members-only redirect broken: https://profit-base.online/missions"
              description: "https://profit-base.online/missions no longer answers a browser navigation with a 302 into /oauth2/authorization/keycloak. REQ-SEC-052 requires every page except /, /impressum, /privacy, /terms and /licenses to need a login; a 200 here means the page is being served to anonymous visitors. Check the NPM proxy host for a cache or location rule ahead of the app, and confirm the frontend image carries the members-only SecurityConfig."

  - name: EdgeMembersOnlyRedirectBroken stays silent while the edge itself is down
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/missions"}'
        values: "0x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/operations"}'
        values: "0x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/orders"}'
        values: "0x20"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: EdgeMembersOnlyRedirectBroken
        exp_alerts: []

  - name: EdgeMembersOnlyRedirectBroken is silent while every page redirects
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/missions"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/operations"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox-members-only", instance="https://profit-base.online/orders"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox-http", instance="https://profit-base.online"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: EdgeMembersOnlyRedirectBroken
        exp_alerts: []
