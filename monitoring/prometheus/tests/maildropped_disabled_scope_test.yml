rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: silent - deliberate kill-switch drops (dropped_disabled climbing)
    interval: 1m
    input_series:
      - series: 'basetool_mail_total{outcome="dropped_disabled"}'
        values: "0+5x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: MailDroppedConfigDrift
        exp_alerts: []

  - name: fires - mail enabled but spring.mail.host blank (dropped_no_host)
    interval: 1m
    input_series:
      - series: 'basetool_mail_total{outcome="dropped_no_host"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: MailDroppedConfigDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: dropped_no_host
            exp_annotations:
              summary: "Mail dropped by a config gate (dropped_no_host)"
              description: "Outgoing mail was dropped before delivery (dropped_no_host) — mail is enabled on this deployment but misconfigured (blank spring.mail.host, or no JavaMailSender bean), so registration / approval notifications are being lost. The deliberate app.mail.enabled=false kill-switch (dropped_disabled) is out of scope for this alert."

  - name: fires - host set but no JavaMailSender bean (dropped_no_sender)
    interval: 1m
    input_series:
      - series: 'basetool_mail_total{outcome="dropped_no_sender"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: MailDroppedConfigDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: dropped_no_sender
            exp_annotations:
              summary: "Mail dropped by a config gate (dropped_no_sender)"
              description: "Outgoing mail was dropped before delivery (dropped_no_sender) — mail is enabled on this deployment but misconfigured (blank spring.mail.host, or no JavaMailSender bean), so registration / approval notifications are being lost. The deliberate app.mail.enabled=false kill-switch (dropped_disabled) is out of scope for this alert."

  - name: silent - healthy deployment sending mail
    interval: 1m
    input_series:
      - series: 'basetool_mail_total{outcome="sent"}'
        values: "0+3x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: MailDroppedConfigDrift
        exp_alerts: []
