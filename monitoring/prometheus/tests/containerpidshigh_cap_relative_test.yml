rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: fires - 512-capped container at its cap (grafana zombie exhaustion)
    interval: 1m
    input_series:
      - series: 'basetool_container_pids{name="grafana"}'
        values: "512x30"
      - series: 'basetool_container_pids_max{name="grafana"}'
        values: "512x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerPidsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: grafana
            exp_annotations:
              summary: "Container pids >80% of the cgroup cap: grafana"
              description: "Container grafana holds more than 80% of its pids cgroup cap (basetool:container:pids is the cgroup pids.current count, basetool:container:pids_max its pids.max). At the cap the kernel refuses new tasks: a JVM throws 'unable to create native thread' and child-process spawns (healthcheck wget, ssl_client) fail — the 2026-07-12 ingest native-thread OOM and the 2026-07-26 grafana zombie exhaustion. A steady climb is a task/zombie leak — investigate before it reaches the cap; do not raise the cap to silence it."

  - name: fires - 2048-capped JVM container above 80 percent
    interval: 1m
    input_series:
      - series: 'basetool_container_pids{name="ingest"}'
        values: "1700x30"
      - series: 'basetool_container_pids_max{name="ingest"}'
        values: "2048x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerPidsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: ingest
            exp_annotations:
              summary: "Container pids >80% of the cgroup cap: ingest"
              description: "Container ingest holds more than 80% of its pids cgroup cap (basetool:container:pids is the cgroup pids.current count, basetool:container:pids_max its pids.max). At the cap the kernel refuses new tasks: a JVM throws 'unable to create native thread' and child-process spawns (healthcheck wget, ssl_client) fail — the 2026-07-12 ingest native-thread OOM and the 2026-07-26 grafana zombie exhaustion. A steady climb is a task/zombie leak — investigate before it reaches the cap; do not raise the cap to silence it."

  - name: silent - normal load on 512-capped and 2048-capped containers
    interval: 1m
    input_series:
      - series: 'basetool_container_pids{name="tempo"}'
        values: "64x30"
      - series: 'basetool_container_pids_max{name="tempo"}'
        values: "512x30"
      - series: 'basetool_container_pids{name="backend"}'
        values: "56x30"
      - series: 'basetool_container_pids_max{name="backend"}'
        values: "2048x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerPidsHigh
        exp_alerts: []

  - name: silent - zero pids.max must not divide to +Inf
    interval: 1m
    input_series:
      - series: 'basetool_container_pids{name="edgecase"}'
        values: "10x30"
      - series: 'basetool_container_pids_max{name="edgecase"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerPidsHigh
        exp_alerts: []
