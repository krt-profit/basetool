rule_files:
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: fires when the edge has not loaded its changed configuration for 30 minutes
    interval: 1m
    input_series:
      - series: 'basetool_edge_config_stale{component="edge", job="node", instance="host:9100"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: EdgeConfigNotLoaded
        exp_alerts: []
      - eval_time: 31m
        alertname: EdgeConfigNotLoaded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: edge
              job: node
              instance: host:9100
            exp_annotations:
              summary: "The edge has not loaded its configuration or certificates on disk"
              description: "deploy.sh saw the edge configuration under /opt/basetool/docker/edge or a certificate in the edge-certs volume change and could not load it: nginx refused the rendered configuration, so the edge keeps serving the one it has loaded, or the fallback recreate of an edge whose reload failed for another reason did not succeed. Until this clears the edge runs on its old configuration or certificate; every deploy tick retries. `{app=\"ops-deploy\"} |~ \"edge:\"` in Grafana -> Explore -> Loki quotes nginx's refusal. Fix the configuration in the repository and promote the fix; do not recreate the edge by hand while nginx refuses the configuration, because a new edge would not start on it (REQ-OPS-061)."

  - name: silent once the edge has loaded it
    interval: 1m
    input_series:
      - series: 'basetool_edge_config_stale{component="edge", job="node", instance="host:9100"}'
        values: "1x10 0x40"
    alert_rule_test:
      - eval_time: 45m
        alertname: EdgeConfigNotLoaded
        exp_alerts: []

  - name: silent when the series is absent (a deployer that predates the gauge)
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="host:9100"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: EdgeConfigNotLoaded
        exp_alerts: []
