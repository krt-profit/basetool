rule_files:
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: silent - the repository holds what the retention allows
    interval: 1m
    input_series:
      - series: 'basetool_backup_snapshots{instance="node-exporter:9100",job="node"}'
        values: "17x120"
      - series: 'basetool_backup_retention_limit{instance="node-exporter:9100",job="node"}'
        values: "17x120"
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRetentionNotApplied
        exp_alerts: []

  - name: fires - forget keeps every snapshot
    interval: 1m
    input_series:
      - series: 'basetool_backup_snapshots{instance="node-exporter:9100",job="node"}'
        values: "109x120"
      - series: 'basetool_backup_retention_limit{instance="node-exporter:9100",job="node"}'
        values: "17x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupRetentionNotApplied
        exp_alerts: []
      - eval_time: 2h
        alertname: BackupRetentionNotApplied
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              job: node
            exp_annotations:
              summary: "Backup repository keeps more snapshots than its retention allows (109)"
              description: "After the last successful backup the off-site restic repository held more snapshots than the GFS retention (IRI_KEEP_DAILY + IRI_KEEP_WEEKLY + IRI_KEEP_MONTHLY) can keep, so `restic forget` removed nothing it should have. The repository grows every night, and every run then reads more files from the store — a burst large enough to be blocked as a crawler by the store's edge. `{app=\"ops-backup\"} |~ \"retention|snapshots kept\"` in Grafana -> Explore -> Loki shows what forget kept; `backup.sh --dry-run` lists the snapshots and their paths. Not visible via `journalctl -u iri-backup.service` (stdout/stderr are appended to /var/log/iri-backup.log)."

  - name: silent - a backup that never counted its snapshots
    interval: 1m
    input_series:
      - series: 'basetool_backup_retention_limit{instance="node-exporter:9100",job="node"}'
        values: "17x120"
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupRetentionNotApplied
        exp_alerts: []
