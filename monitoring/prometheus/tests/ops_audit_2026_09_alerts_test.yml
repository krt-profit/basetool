rule_files:
  - ../alerts/infrastructure.yml
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: "DeployHeartbeatStale - a heartbeat that keeps pace with time() is silent"
    interval: 1m
    input_series:
      - series: "basetool_deploy_last_stack_healthy_timestamp"
        values: "0+60x240"
    alert_rule_test:
      - eval_time: 3h
        alertname: DeployHeartbeatStale
        exp_alerts: []

  - name: "DeployHeartbeatStale - a heartbeat frozen for over an hour fires"
    interval: 1m
    input_series:
      - series: "basetool_deploy_last_stack_healthy_timestamp"
        values: "0x240"
    alert_rule_test:
      - eval_time: 30m
        alertname: DeployHeartbeatStale
        exp_alerts: []
      - eval_time: 90m
        alertname: DeployHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Deploy heartbeat stale >1h (no tick has verified the stack)"
              description: "No deploy tick has observed the stack at its target and healthy for over an hour, or the heartbeat metric is absent -- so the running stack is not being verified and no release can reach it. Check `systemctl list-timers iri-deploy.timer` and `systemctl status iri-deploy.service`, then `{app=\"ops-deploy\"}` in Grafana -> Explore -> Loki for the last tick's lines (a FATAL, a lock message, or nothing at all). A deliberate skip (a gated stateful-infra change, a backoff after a rollback) also stops the heartbeat; DeployConfigBlocked and DeployRolledBack name those."

  - name: "DeployHeartbeatStale - a deployer that never wrote the gauge fires"
    interval: 1m
    input_series:
      - series: "basetool_deploy_last_success_timestamp"
        values: "0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: DeployHeartbeatStale
        exp_alerts: []
      - eval_time: 30m
        alertname: DeployHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Deploy heartbeat stale >1h (no tick has verified the stack)"
              description: "No deploy tick has observed the stack at its target and healthy for over an hour, or the heartbeat metric is absent -- so the running stack is not being verified and no release can reach it. Check `systemctl list-timers iri-deploy.timer` and `systemctl status iri-deploy.service`, then `{app=\"ops-deploy\"}` in Grafana -> Explore -> Loki for the last tick's lines (a FATAL, a lock message, or nothing at all). A deliberate skip (a gated stateful-infra change, a backoff after a rollback) also stops the heartbeat; DeployConfigBlocked and DeployRolledBack name those."

  - name: "RestoreDrillStaleOrMissing - one missed weekly drill is reported, seven days are not"
    interval: 1m
    input_series:
      - series: "basetool_restore_drill_last_success_timestamp"
        values: "0x14400"
    alert_rule_test:
      - eval_time: 7d
        alertname: RestoreDrillStaleOrMissing
        exp_alerts: []
      - eval_time: 9d
        alertname: RestoreDrillStaleOrMissing
        exp_alerts:
          - exp_labels:
              severity: "critical"
            exp_annotations:
              summary: "Restore drill stale >8d or metric absent"
              description: "The weekly restore drill (iri-restore-drill.timer, Sun 05:30) has not succeeded for more than 8 days -- at least one weekly drill failed or did not run -- or the metric is absent (never ran). `{app=\"ops-restore-drill\"} |~ \"FATAL|WARN\"` in Grafana -> Explore -> Loki over the last 10d carries the abort reason; an empty stream means the unit never fired — check `systemctl list-timers iri-restore-drill.timer`. Not visible via `journalctl -u iri-restore-drill.service` (stdout/stderr are appended to /var/log/iri-restore-drill.log)."

  - name: "PostgresDown - an exporter that answers pg_up 0 pages, one that answers 1 does not"
    interval: 1m
    input_series:
      - series: "pg_up{job=\"postgres-backend\", instance=\"postgres-exporter-backend:9187\", database=\"basetool-backend\"}"
        values: "1x2 0x10"
      - series: "pg_up{job=\"postgres-keycloak\", instance=\"postgres-exporter-keycloak:9187\", database=\"keycloak\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
              job: "postgres-backend"
              instance: "postgres-exporter-backend:9187"
              database: "basetool-backend"
            exp_annotations:
              summary: "PostgreSQL down: basetool-backend"
              description: "postgres-exporter for basetool-backend has not been able to connect to its database for 2 minutes (pg_up == 0) while the exporter itself answers -- the database is down, refusing connections, or out of connection slots. Check `sudo -u iri XDG_RUNTIME_DIR=/run/user/$(id -u iri) systemctl --user status db-backend.service` (or db-keycloak.service) and its journal (`journalctl CONTAINER_NAME=db-backend`)."

  - name: "RedisDown - redis_up 0 pages after two minutes"
    interval: 1m
    input_series:
      - series: "redis_up{job=\"redis\", instance=\"redis-exporter:9121\"}"
        values: "1x2 0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts: []
      - eval_time: 6m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
              job: "redis"
              instance: "redis-exporter:9121"
            exp_annotations:
              summary: "Redis down"
              description: "redis-exporter has not been able to reach Redis for 2 minutes (redis_up == 0) while the exporter itself answers. Redis holds every web session and the live-sync fan-out, so members are being logged out and live updates have stopped. Check `sudo -u iri XDG_RUNTIME_DIR=/run/user/$(id -u iri) systemctl --user status redis.service` and `journalctl CONTAINER_NAME=redis`; a missing or unreadable /var/iri/redis/users.acl stops it from starting at all (ADR-0088)."

  - name: "ContainerUnhealthy - an unhealthy container is named, a starting and a healthy one are not"
    interval: 1m
    input_series:
      - series: "podman_container_info{id=\"aaa\", image=\"x\", name=\"keycloak\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "1x30"
      - series: "podman_container_health{id=\"aaa\", pod_id=\"\", pod_name=\"\"}"
        values: "1x30"
      - series: "podman_container_info{id=\"bbb\", image=\"x\", name=\"backend\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "1x30"
      - series: "podman_container_health{id=\"bbb\", pod_id=\"\", pod_name=\"\"}"
        values: "2x30"
      - series: "podman_container_info{id=\"ccc\", image=\"x\", name=\"redis\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "1x30"
      - series: "podman_container_health{id=\"ccc\", pod_id=\"\", pod_name=\"\"}"
        values: "0x30"
      - series: "podman_container_info{id=\"ddd\", image=\"x\", name=\"acme\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "1x30"
      - series: "podman_container_health{id=\"ddd\", pod_id=\"\", pod_name=\"\"}"
        values: "-1x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerUnhealthy
        exp_alerts: []
      - eval_time: 15m
        alertname: ContainerUnhealthy
        exp_alerts:
          - exp_labels:
              severity: "warning"
              name: "keycloak"
            exp_annotations:
              summary: "Container unhealthy: keycloak"
              description: "Container keycloak has failed its own health check for 10 minutes. For backend, frontend and ingest deploy.sh restarts it on its next tick (DeployHealthRestartFailing pages if that does not help); for every other container nothing restarts it automatically. Check `sudo -u iri XDG_RUNTIME_DIR=/run/user/$(id -u iri) podman healthcheck run keycloak` and `journalctl CONTAINER_NAME=keycloak`."

  - name: "ContainerUnhealthy - a container recreated under a new id does not keep the old one's verdict"
    interval: 1m
    input_series:
      - series: "podman_container_info{id=\"old\", image=\"x\", name=\"grafana\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "1x5"
      - series: "podman_container_health{id=\"old\", pod_id=\"\", pod_name=\"\"}"
        values: "1x5"
      - series: "podman_container_info{id=\"new\", image=\"x\", name=\"grafana\", pod_id=\"\", pod_name=\"\", ports=\"\"}"
        values: "_x5 1x25"
      - series: "podman_container_health{id=\"new\", pod_id=\"\", pod_name=\"\"}"
        values: "_x5 0x25"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerUnhealthy
        exp_alerts: []

  - name: "HostSecurityUpdatesFailing - a failed dnf-automatic run warns after an hour"
    interval: 1m
    input_series:
      - series: "basetool_host_updates_last_run_success"
        values: "0x120"
      - series: "basetool_host_updates_last_run_timestamp_seconds"
        values: "0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostSecurityUpdatesFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: HostSecurityUpdatesFailing
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Unattended security updates failed on the host"
              description: "The last dnf-automatic run failed, so security advisories published since the previous good run are not installed. `journalctl -u dnf-automatic.service` on the host shows why (a repository that could not be reached, a dependency conflict, the runtime exclusion blocking a required update)."

  - name: "HostSecurityUpdatesStale - daily runs are silent, a run older than two days warns after a day"
    interval: 1m
    input_series:
      - series: "basetool_host_updates_last_run_timestamp_seconds"
        values: "0x1439 86400x1440 172800x5400"
    alert_rule_test:
      - eval_time: 70h
        alertname: HostSecurityUpdatesStale
        exp_alerts: []
      - eval_time: 110h
        alertname: HostSecurityUpdatesStale
        exp_alerts: []
      - eval_time: 125h
        alertname: HostSecurityUpdatesStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Unattended security updates have not run"
              description: "dnf-automatic has not finished a run for more than two days, or has never recorded one -- the host is not being patched. Check `systemctl list-timers dnf-automatic.timer` and `systemctl status dnf-automatic.service`, and that /etc/systemd/system/dnf-automatic.service.d/20-basetool-metrics.conf (installed by the basetool_host role, tasks/45-updates.yml) is present."

  - name: "HostSecurityUpdatesStale - a host that never recorded a run is not paged before its first window"
    interval: 1m
    input_series:
      - series: "basetool_host_reboot_required"
        values: "0x1900"
    alert_rule_test:
      - eval_time: 20h
        alertname: HostSecurityUpdatesStale
        exp_alerts: []
      - eval_time: 30h
        alertname: HostSecurityUpdatesStale
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Unattended security updates have not run"
              description: "dnf-automatic has not finished a run for more than two days, or has never recorded one -- the host is not being patched. Check `systemctl list-timers dnf-automatic.timer` and `systemctl status dnf-automatic.service`, and that /etc/systemd/system/dnf-automatic.service.d/20-basetool-metrics.conf (installed by the basetool_host role, tasks/45-updates.yml) is present."

  - name: "HostRebootRequired - an installed fix waiting a day for a reboot warns; the reboot clears it"
    interval: 1m
    input_series:
      - series: "basetool_host_reboot_required"
        values: "1x1800 0x600"
    alert_rule_test:
      - eval_time: 20h
        alertname: HostRebootRequired
        exp_alerts: []
      - eval_time: 28h
        alertname: HostRebootRequired
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Host reboot required to activate installed updates"
              description: "An installed update (typically a kernel, glibc or systemd fix) only takes effect after a reboot, and the host has not rebooted for a day since (`needs-restarting -r`). dnf-automatic never reboots on its own -- restarting the one production host is an owner decision. Plan a reboot; the stack comes back by itself (Quadlet units are WantedBy=default.target and the service user lingers)."
      - eval_time: 35h
        alertname: HostRebootRequired
        exp_alerts: []
