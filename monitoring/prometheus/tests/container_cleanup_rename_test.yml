# promtool unit test for ContainerCleanupStaleOrMissing (ADR-0194).
#
# The weekly cleanup was renamed from docker-cleanup to container-cleanup, and for the length of that
# rename the alert accepted both metric names; this file locked all four combinations. The old name
# was dropped on 2026-09-22 (OPS-SIMP-02) once both Rocky hosts had run the role, so what is locked
# now is the one name: fresh is silent, stale fires, absent fires -- and the old name alone no longer
# satisfies it, because nothing writes it any more and a host that did would be running the retired
# script.
#
# Run it the way the other tests in this directory are run — see monitoring/README.md.

rule_files:
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: silent - the metric is fresh
    interval: 1m
    input_series:
      - series: 'basetool_container_cleanup_last_success_timestamp'
        values: "0+60x180"          # tracks time(): always "just succeeded"
    alert_rule_test:
      - eval_time: 3h
        alertname: ContainerCleanupStaleOrMissing
        exp_alerts: []

  - name: fires - the metric is older than eight days
    interval: 1h
    input_series:
      - series: 'basetool_container_cleanup_last_success_timestamp'
        values: "0+0x240"
    alert_rule_test:
      - eval_time: 7d
        alertname: ContainerCleanupStaleOrMissing
        exp_alerts: []
      - eval_time: 9d
        alertname: ContainerCleanupStaleOrMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "container-cleanup stale >8d or metric absent"
              description: "The weekly container-cleanup last succeeded more than 8 days ago, or its metric is absent — an early disk-fill indicator. `{app=\"ops-cleanup\"}` in Grafana -> Explore -> Loki over the last 10d shows the last run and what it reclaimed; an empty stream means the timer never fired (`systemctl list-timers iri-container-cleanup.timer`) or the optional job was never installed on this host. Not visible via `journalctl -u iri-container-cleanup.service` (stdout/stderr are appended to /var/log/iri-container-cleanup.log). The job never prunes volumes (ADR-0194), so it reclaims less than the retired Docker host's did — that is correct rather than a partial run."

  - name: fires - only the retired name exists
    interval: 1m
    input_series:
      - series: 'basetool_docker_cleanup_last_success_timestamp'
        values: "0+60x180"
    alert_rule_test:
      - eval_time: 3h
        alertname: ContainerCleanupStaleOrMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "container-cleanup stale >8d or metric absent"
              description: "The weekly container-cleanup last succeeded more than 8 days ago, or its metric is absent — an early disk-fill indicator. `{app=\"ops-cleanup\"}` in Grafana -> Explore -> Loki over the last 10d shows the last run and what it reclaimed; an empty stream means the timer never fired (`systemctl list-timers iri-container-cleanup.timer`) or the optional job was never installed on this host. Not visible via `journalctl -u iri-container-cleanup.service` (stdout/stderr are appended to /var/log/iri-container-cleanup.log). The job never prunes volumes (ADR-0194), so it reclaims less than the retired Docker host's did — that is correct rather than a partial run."
