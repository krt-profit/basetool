rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - the frontend's live-sync subscription stays down while the shared Redis is gone
    interval: 1m
    input_series:
      - series: 'basetool_redis_fanout_subscribed{application="basetool-frontend", fanout="livesync"}'
        values: "0x20"
      - series: 'basetool_redis_fanout_subscribed{application="basetool-backend", fanout="notifications"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisFanoutUnsubscribed
        exp_alerts:
          - exp_labels:
              severity: warning
              application: basetool-frontend
              fanout: livesync
            exp_annotations:
              summary: "Redis livesync fan-out has not been subscribed for 10m"
              description: "The livesync pub/sub container of basetool-frontend is not listening, so cross-instance delivery for that channel is dead: a peer replica's change never reaches this instance (fanout=notifications on the backend, fanout=livesync on the frontend). The container retries every 5s, so 10 minutes means Redis is genuinely unreachable from that service rather than merely restarting — check the redis container and the service's net-redis-* network. The service deliberately stays up and serving while this is true (ADR-0084, ADR-0143), so nothing else will page."
