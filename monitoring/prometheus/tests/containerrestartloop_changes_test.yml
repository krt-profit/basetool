rule_files:
  - ../alerts/containers-runtime.yml
  - ../alerts/infrastructure.yml

evaluation_interval: 1m

tests:
  - name: ContainerRestartLoop counts restarts, not the start-time delta, on the podman exporter's series
    interval: 1m
    input_series:
      - series: 'podman_container_info{id="b0000000000a",name="backend",image="ghcr.io/x@sha256:a",pod_id="",pod_name="",ports=""}'
        values: "1x8"
      - series: 'podman_container_started_seconds{id="b0000000000a",pod_id="",pod_name=""}'
        values: "1000x8"
      - series: 'podman_container_info{id="b0000000000b",name="backend",image="ghcr.io/x@sha256:a",pod_id="",pod_name="",ports=""}'
        values: "_x9 1x30"
      - series: 'podman_container_started_seconds{id="b0000000000b",pod_id="",pod_name=""}'
        values: "_x9 2000x30"

      - series: 'podman_container_info{id="f00000000001",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "1"
      - series: 'podman_container_started_seconds{id="f00000000001",pod_id="",pod_name=""}'
        values: "1000"
      - series: 'podman_container_info{id="f00000000002",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "_ 1"
      - series: 'podman_container_started_seconds{id="f00000000002",pod_id="",pod_name=""}'
        values: "_ 1060"
      - series: 'podman_container_info{id="f00000000003",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "_x2 1"
      - series: 'podman_container_started_seconds{id="f00000000003",pod_id="",pod_name=""}'
        values: "_x2 1120"
      - series: 'podman_container_info{id="f00000000004",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "_x3 1"
      - series: 'podman_container_started_seconds{id="f00000000004",pod_id="",pod_name=""}'
        values: "_x3 1180"
      - series: 'podman_container_info{id="f00000000005",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "_x4 1"
      - series: 'podman_container_started_seconds{id="f00000000005",pod_id="",pod_name=""}'
        values: "_x4 1240"
      - series: 'podman_container_info{id="f00000000006",name="frontend",image="ghcr.io/x@sha256:b",pod_id="",pod_name="",ports=""}'
        values: "_x5 1x30"
      - series: 'podman_container_started_seconds{id="f00000000006",pod_id="",pod_name=""}'
        values: "_x5 1300x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: critical
              name: frontend
            exp_annotations:
              summary: "Container restart loop: frontend"
              description: "Container frontend restarted more than 3 times in 15 minutes."
      - eval_time: 25m
        alertname: ContainerRestartLoop
        exp_alerts: []
