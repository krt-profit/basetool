rule_files:
  - ../alerts/business.yml

evaluation_interval: 1m

tests:
  - name: fires - the gateway keeps failing closed
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="registry_unavailable"}'
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ExchangeRegistryUnreadableAtGateway
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The ingest gateway cannot read the exchange registry"
              description: "The ingest gateway cannot read the exchange registry mirror or the revocations in Redis and refuses exchange requests with 503 REGISTRY_UNAVAILABLE (fail-closed, REQ-XCH-003). Check that the backend writes exchange:registry (APP_EXCHANGE_MIRROR_ENABLED, ExchangeMirrorWriteFailed), that Redis is up, and that the ingest ACL user still reads ~exchange:*."

  - name: silent - other refusals are the clients' own
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="scope_missing"}'
        values: "0+5x30"
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="registry_unavailable"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExchangeRegistryUnreadableAtGateway
        exp_alerts: []

  - name: fires - relays keep failing
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="failed"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExchangeRelayFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Exchange relays to the backend keep failing"
              description: "The ingest gateway relayed admitted exchange requests but the backend answered unusably - 5xx, a refusal outside the exchange error registry, or no answer at all (unreachable, circuit open, no gateway token) - and the client got 502 BACKEND_RELAY_FAILED (REQ-XCH-011). An answer that breaks its contract is counted apart, see ExchangeAnswerContractBroken. Check the backend and its exchange layer and the gateway log lines 'Exchange relay to'."

  - name: fires - one answer breaks its contract
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="answer_contract_broken", client_id="versekit"}'
        values: "0x5 1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ExchangeAnswerContractBroken
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "The backend sent an exchange answer that breaks its contract"
              description: "The ingest gateway refused a 2xx answer of the backend for client versekit with 502 BACKEND_RELAY_FAILED, because it broke its v1 response schema or carried a property the schema does not declare (REQ-XCH-050). A new backend field that is not declared in the published schema is the usual cause; it may be a game text on its way to a third party. Find the route and the field path in the gateway log line 'Exchange answer breaks', then declare the field in the schema with its class in the field ratchet, or drop it from the exchange DTO."

  - name: fires - the first broken answer of a client, whose series starts at one
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="answer_contract_broken", client_id="versekit"}'
        values: "_x20 1x20"
    alert_rule_test:
      - eval_time: 25m
        alertname: ExchangeAnswerContractBroken
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "The backend sent an exchange answer that breaks its contract"
              description: "The ingest gateway refused a 2xx answer of the backend for client versekit with 502 BACKEND_RELAY_FAILED, because it broke its v1 response schema or carried a property the schema does not declare (REQ-XCH-050). A new backend field that is not declared in the published schema is the usual cause; it may be a game text on its way to a third party. Find the route and the field path in the gateway log line 'Exchange answer breaks', then declare the field in the schema with its class in the field ratchet, or drop it from the exchange DTO."

  - name: silent - answers that hold their contract

    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="answer_contract_broken", client_id="versekit"}'
        values: "0x30"
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="ok", client_id="versekit"}'
        values: "0+20x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExchangeAnswerContractBroken
        exp_alerts: []

  - name: silent - backend refusals with a registry code are the member's own
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_relay_total{job="basetool-ingest", instance="ingest:11272", outcome="refused"}'
        values: "0+5x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExchangeRelayFailing
        exp_alerts: []

  - name: fires - the exchange budget runs high
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_budget_used_ratio{job="basetool-ingest", instance="ingest:11272"}'
        values: "0.85x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ExchangeBudgetHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The exchange's Redis budget is more than 80 % used"
              description: "The exchange data the ingest gateway keeps in Redis (the idempotency cache) uses more than 80 % of its 128 MiB budget. Above 100 % every exchange write is refused with 503 EXCHANGE_BUDGET_EXHAUSTED, while sessions keep their room (REQ-XCH-023, ADR-0221). Check which client writes most (the per-client sets under ingest:xch:budget:c:*) and whether a client loops."

  - name: silent - a budget in normal use
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_budget_used_ratio{job="basetool-ingest", instance="ingest:11272"}'
        values: "0.3x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ExchangeBudgetHigh
        exp_alerts: []

  - name: fires - one registered client is refused again and again
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="client_version_unsupported", client_id="versekit"}'
        values: "0+3x40"
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="client_version_unsupported", client_id="sc-extractor"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeClientRefusalsSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "A registered exchange client is refused unusually often"
              description: "The ingest gateway refused more than 30 requests of one registered client (client_id) in 15 minutes for a reason other than its own limits - typically a release below the minimum version, a capability the registry does not grant, revoked keys or broken DPoP proofs after a client update (REQ-XCH-028). Check the per-client panel and the refusal reasons on the operations dashboard, then contact the client's author or suspend it under Administration - Verbundene Anwendungen."

  - name: fires - an extension origin keeps arriving with another client's token
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="origin_not_allowed", client_id="versekit"}'
        values: "0+3x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeClientRefusalsSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              client_id: versekit
            exp_annotations:
              summary: "A registered exchange client is refused unusually often"
              description: "The ingest gateway refused more than 30 requests of one registered client (client_id) in 15 minutes for a reason other than its own limits - typically a release below the minimum version, a capability the registry does not grant, revoked keys or broken DPoP proofs after a client update (REQ-XCH-028). Check the per-client panel and the refusal reasons on the operations dashboard, then contact the client's author or suspend it under Administration - Verbundene Anwendungen."

  - name: silent - a client over its own limits is not a spike
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="rate_limited", client_id="versekit"}'
        values: "0+10x40"
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="quota_exceeded", client_id="versekit"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeClientRefusalsSpike
        exp_alerts: []

  - name: silent - tokens the registry does not list are no client of ours
    interval: 1m
    input_series:
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="client_not_allowed", client_id="unregistered"}'
        values: "0+10x40"
      - series: 'basetool_ingest_exchange_refused_total{job="basetool-ingest", instance="ingest:11272", reason="dpop_required", client_id="none"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: ExchangeClientRefusalsSpike
        exp_alerts: []
