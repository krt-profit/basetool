rule_files:
  - ../alerts/infrastructure.yml
  - ../alerts/ops-automation.yml

evaluation_interval: 1m

tests:
  - name: "RedisDown - redis_up 0 pages after two minutes"
    interval: 1m
    input_series:
      - series: "redis_up{job=\"redis\", instance=\"redis-exporter:9121\"}"
        values: "1x2 0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts: []
      - eval_time: 6m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: "critical"
              job: "redis"
              instance: "redis-exporter:9121"
            exp_annotations:
              summary: "Redis down"
              description: "redis-exporter has not been able to reach Redis for 2 minutes (redis_up == 0) while the exporter itself answers. Redis holds every web session and the live-sync fan-out, so members are being logged out and live updates have stopped. Check `sudo -u basetool XDG_RUNTIME_DIR=/run/user/$(id -u basetool) systemctl --user status redis.service` and `journalctl CONTAINER_NAME=redis`; a missing or unreadable /var/lib/basetool/redis/users.acl stops it from starting at all (ADR-0088)."
