# Prometheus scrape + alerting configuration for the Profit Basetool monitoring plane.
# Epic #936, ADR-0072, REQ-OBS-005..011. Prometheus 3.13.x (verified 2026-07 latest LTS).
#
# Contains ZERO secrets. The scrape basic-auth password and the admin-API web.config
# basic-auth hash live in host-side files under /var/iri/monitoring/secrets/ (mounted
# read-only, provisioned by docs/MONITORING_ROLLOUT_RUNBOOK.md); the exported public CA
# for the apps' self-signed HTTPS lives under /var/iri/monitoring/certs/. Retention
# (180d + 40GB cap) and the admin API are set via command-line flags in
# docker-compose.monitoring.yml, not here.
#
# Transport model (REQ-OBS-008): the three apps are scraped over HTTPS with the pinned
# public CA (no insecure_skip_verify); everything else on the isolated monitoring networks
# is plain HTTP by the owner-approved carve-out.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: basetool-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # --- Prometheus self-monitoring -------------------------------------------------------
  # Prometheus's own web server is basic-auth protected (--web.config.file) because
  # --web.enable-admin-api exposes deletion endpoints (ADR-0072), so the self-scrape must
  # authenticate as well. The plaintext web password is provisioned on the host by the runbook;
  # Grafana and the backup snapshot use the same credential (user "grafana").
  - job_name: prometheus
    basic_auth:
      username: grafana
      password_file: /etc/prometheus/secrets/web_password
    static_configs:
      - targets: ["localhost:9090"]

  # --- Spring Boot apps: HTTPS scrape with pinned public CA + basic auth -----------------
  # username is fixed to "monitoring" (not a secret) and MUST equal MONITORING_SCRAPE_USER
  # in the prod .env; the password comes from the mounted secret file (fail-closed if the
  # app has no MONITORING_SCRAPE_* set — the endpoint then denies every request).
  # ADR-0134: the backend joined the ADR-0090 management-port posture (11271, internal-only), so
  # like the two jobs below it carries NO basic_auth — the port is unreachable from the internet and
  # from the host, which supersedes ADR-0072's fail-closed compensating control. Still HTTPS with
  # the pinned CA (same keystore.p12, SAN dns:backend) so REQ-OBS-008 holds unchanged.
  - job_name: basetool-backend
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: backend
    static_configs:
      - targets: ["backend:11271"]
        labels:
          application: basetool-backend

  # ADR-0090: frontend + ingest serve Actuator on a DEDICATED internal-only management port (18091 /
  # 11272), never host-published nor NPM-proxied, so /actuator/** is off the public connector. The
  # management port is unauthenticated (Boot's management-context security backs off given the apps'
  # custom chains), so — unlike the backend below — these jobs carry NO basic_auth: ADR-0072's
  # fail-closed basic-auth is superseded by the port isolation (REQ-OBS-005 amended). Still HTTPS with
  # the pinned CA (same keystore.p12, SAN dns:frontend / dns:ingest) so REQ-OBS-008 holds unchanged.
  - job_name: basetool-frontend
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: frontend
    static_configs:
      - targets: ["frontend:18091"]
        labels:
          application: basetool-frontend

  - job_name: basetool-ingest
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: ingest
    static_configs:
      - targets: ["ingest:11272"]
        labels:
          application: basetool-ingest

  # --- Keycloak: management port 9000, plain HTTP (carve-out) ----------------------------
  - job_name: keycloak
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["keycloak:9000"]

  # --- Infrastructure exporters (plain HTTP inside the monitoring plane) -----------------
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres-backend
    static_configs:
      - targets: ["postgres-exporter-backend:9187"]
        labels:
          database: basetool-backend

  - job_name: postgres-keycloak
    static_configs:
      - targets: ["postgres-exporter-keycloak:9187"]
        labels:
          database: keycloak

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # --- Monitoring-plane self health ------------------------------------------------------
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  # Blackbox exporter's OWN metrics (not /probe): exposes blackbox_exporter_config_last_reload_successful
  # so BlackboxConfigReloadFailed (meta.yml) can catch a failed SIGHUP reload that silently keeps the old
  # module config running. The /probe results are produced by the blackbox-* jobs below; this job scrapes
  # the exporter's self-instrumentation on the same port.
  - job_name: blackbox-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # --- Blackbox external probes: TLS + status of the public endpoints --------------------
  # Produces probe_success + probe_ssl_earliest_cert_expiry per target.
  #
  # Every /probe job below carries its OWN scrape_timeout: 15s (> the 10s module timeout, well under
  # the 30s interval). Rationale (2026-07-12 false-critical fix, REQ-OBS-008/-012): the blackbox
  # module timeout equalled the global scrape_timeout (both 10s), leaving blackbox's
  # min(module_timeout, scrape_timeout) - timeout_offset(0.5s) clamp only ~0.5s of slack. A probe that
  # runs to its deadline (an IPv6 connect with no v4 fallback that black-holes, or a slow internal-TLS
  # handshake under the host's designed memory pressure) then tips the Prometheus->exporter scrape
  # itself past 10s -> up==0 -> a false-critical TargetDown. Raising only this job's scrape_timeout to
  # 15s lets a hung probe return probe_success==0 WITHIN the scrape window (up stays 1), so a real
  # failure pages via its dedicated probe_success alert (BlackboxProbeFailed / EdgeIpv6Unreachable /
  # DnsResolutionFailed / CertificateExpiringSoon) and never through the generic TargetDown, which is
  # scoped off these jobs in infrastructure.yml.
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://profit-base.online
          - https://grafana.profit-base.online
          - https://keycloak.profit-base.online/realms/iri/.well-known/openid-configuration
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Auth-protected endpoint: the ingest gateway answers 401 on its root, which still proves it is
  # reachable with a valid cert. Uses the http_2xx_or_401 module so a healthy (401) ingest reads as up;
  # a real outage (timeout/5xx/connection error) still yields probe_success == 0 and alerts.
  - job_name: blackbox-http-auth
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_2xx_or_401]
    static_configs:
      - targets:
          - https://ingest.profit-base.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- Blackbox deny/posture assertions (REQ-OBS-012) ------------------------------------
  # These jobs assert edge configuration that lives only in the NPM admin DB: probe_success == 1
  # means the deny/redirect/header posture HOLDS; the matching alerts fire on == 0. They are
  # deliberately separate jobs so BlackboxProbeFailed (liveness, job=~"blackbox-http(-auth)?")
  # never overlaps with the posture alerts. The Keycloak /admin allow-list is asserted externally
  # by .github/workflows/edge-deny-probe.yml — from inside, hairpinned probe traffic is SNAT'd to
  # the allow-listed Docker bridge gateways and /admin always looks reachable.
  - job_name: blackbox-edge-deny
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_deny_404]
    static_configs:
      - targets:
          # The whole `/actuator` prefix is denied at the NPM edge (`location /actuator` → 404),
          # so NEITHER the metrics endpoint NOR the health endpoint is internet-reachable. Both are
          # asserted per public host: `/actuator/prometheus` (the credentialed metrics surface) and
          # `/actuator/health` (liveness/readiness/build info — a passive info leak if it drifts
          # open). Health/metrics reach Prometheus over net-monitoring-scrape and the Docker
          # HEALTHCHECK over localhost, so neither needs any edge exposure (REQ-OBS-005/-012).
          - https://profit-base.online/actuator/prometheus
          - https://profit-base.online/actuator/health
          - https://ingest.profit-base.online/actuator/prometheus
          - https://ingest.profit-base.online/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-force-ssl
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_force_ssl_redirect]
    static_configs:
      - targets:
          - http://profit-base.online
          - http://ingest.profit-base.online
          - http://grafana.profit-base.online
          - http://keycloak.profit-base.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HSTS asserted only where the header source is version-controlled (app-side HSTS on the
  # frontend, audit finding H-9). Extend to the keycloak/grafana/ingest vhosts once their
  # header posture is verified/enabled in the NPM UI (per-host state, not in git).
  - job_name: blackbox-hsts
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_2xx_hsts]
    static_configs:
      - targets:
          - https://profit-base.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- Internal self-signed TLS expiry probes (REQ-OBS-008, #1041 item 8) ----------------------------
  # Probe the app modules' basetool-CA-signed keystore.p12 cert and Grafana's own self-signed cert from
  # INSIDE the monitoring plane. Their probe_ssl_earliest_cert_expiry feeds the (unfiltered)
  # CertificateExpiringSoon alert, catching an internal-cert expiry ~14 days before it breaks all three
  # app scrapes + the frontend->backend WebClient + the NPM->Grafana re-encryption at once (today only a
  # same-day TargetDown warns). These jobs are deliberately OUTSIDE BlackboxProbeFailed's liveness
  # include-list (job=~"blackbox-http|blackbox-http-auth"), so a down app pages once via TargetDown, not
  # again here.
  - job_name: blackbox-internal-tls
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [https_internal]
    static_configs:
      - targets:
          - https://backend:11261
          - https://frontend:18081
          - https://ingest:11262
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Grafana serves its own self-signed cert (not basetool-CA-signed), so it uses the
  # insecure_skip_verify variant; probe_ssl_earliest_cert_expiry is still emitted for the same alert.
  - job_name: blackbox-internal-tls-grafana
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [https_internal_insecure]
    static_configs:
      - targets:
          - https://grafana:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- IPv6 reachability probes (owner-confirmed AAAA records, 2026-07-06) -------------------------
  # Mirror the IPv4 liveness jobs over IPv6 so an IPv6-only regression (broken AAAA path, lost edge v6
  # binding) is caught while IPv4 still answers. Same target URLs/instances as blackbox-http /
  # blackbox-http-auth so EdgeIpv6Unreachable can guard on(instance) against the matching v4 probe.
  - job_name: blackbox-http-ipv6
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_2xx_ipv6]
    static_configs:
      - targets:
          - https://profit-base.online
          - https://grafana.profit-base.online
          - https://keycloak.profit-base.online/realms/iri/.well-known/openid-configuration
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http-auth-ipv6
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [http_2xx_or_401_ipv6]
    static_configs:
      - targets:
          - https://ingest.profit-base.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- Public DNS resolution probes (owner request 2026-07-06) ------------------------------------
  # The probe target is the resolver (1.1.1.1); the query name/type live in the blackbox module.
  # Validates that basetool's apex still resolves an A and an AAAA record end-to-end via a public
  # resolver (NODATA — record silently removed — fails the probe, not only NXDOMAIN). blackbox has
  # internet egress on net-monitoring-core.
  - job_name: blackbox-dns-a
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [dns_apex_a]
    static_configs:
      - targets: ["1.1.1.1"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns-aaaa
    metrics_path: /probe
    scrape_timeout: 15s  # > the blackbox module timeout; see the blackbox-http note above (REQ-OBS-008/-012)
    params:
      module: [dns_apex_aaaa]
    static_configs:
      - targets: ["1.1.1.1"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
