global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: basetool-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: grafana
      password_file: /etc/prometheus/secrets/web_password
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: basetool-backend
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: backend
    static_configs:
      - targets: ["backend:11271"]
        labels:
          application: basetool-backend

  - job_name: basetool-frontend
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: frontend
    static_configs:
      - targets: ["frontend:18091"]
        labels:
          application: basetool-frontend

  - job_name: basetool-ingest
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/basetool-ca.crt
      server_name: ingest
    static_configs:
      - targets: ["ingest:11272"]
        labels:
          application: basetool-ingest

  - job_name: keycloak
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: podman-exporter
    static_configs:
      - targets: ["podman-exporter:9882"]

  - job_name: postgres-backend
    static_configs:
      - targets: ["postgres-exporter-backend:9187"]
        labels:
          database: basetool-backend

  - job_name: postgres-keycloak
    static_configs:
      - targets: ["postgres-exporter-keycloak:9187"]
        labels:
          database: keycloak

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: blackbox-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox-http
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://profit-base.online
          - https://grafana.profit-base.online
          - https://profit-base.online/auth/realms/iri/.well-known/openid-configuration
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http-auth
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_2xx_or_401]
    static_configs:
      - targets:
          - https://ingest.profit-base.online
          - https://api.profit-base.online/api/v1/terms/status
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-edge-deny
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_deny_404]
    static_configs:
      - targets:
          - https://profit-base.online/actuator/prometheus
          - https://profit-base.online/actuator/health
          - https://profit-base.online/auth/health
          - https://profit-base.online/auth/metrics
          - https://ingest.profit-base.online/actuator/prometheus
          - https://ingest.profit-base.online/actuator/health
          - https://api.profit-base.online/actuator/prometheus
          - https://api.profit-base.online/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-members-only
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_members_only_redirect]
    static_configs:
      - targets:
          - https://profit-base.online/missions
          - https://profit-base.online/operations
          - https://profit-base.online/orders
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-public-surface
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_public_200_no_redirect]
    static_configs:
      - targets:
          - https://profit-base.online/
          - https://profit-base.online/impressum
          - https://profit-base.online/privacy
          - https://profit-base.online/terms
          - https://profit-base.online/licenses
          - https://profit-base.online/robots.txt
          - https://profit-base.online/.well-known/assetlinks.json
          - https://profit-base.online/manifest.webmanifest?locale=de
          - https://profit-base.online/app/link-help
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-app-link
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_app_link_fallback_303]
    static_configs:
      - targets:
          - https://profit-base.online/app/callback
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-force-ssl
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [http_force_ssl_redirect]
    static_configs:
      - targets:
          - http://profit-base.online
          - http://ingest.profit-base.online
          - http://grafana.profit-base.online
          - http://api.profit-base.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-hsts
    metrics_path: /probe
    scrape_timeout: 15s
