  - job_name: blackbox-internal-tls
    metrics_path: /probe
    scrape_timeout: 15s
    params:
      module: [https_internal]
    static_configs:
      - targets:
          - https://backend:11261
          - https://frontend:18081
          - https://ingest:11262
          - https://keycloak:18443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-internal-tls-grafana
    metrics_path: /probe
    scrape_timeout: 15s
