# Loki single-binary config for the Basetool monitoring plane. Loki 3.7.x (verified 2026-07).
# Epic #936, REQ-OBS-007 (per-stream log-privacy rules), ADR-0072.
#
# Retention is 31 days, enforced by the compactor (table_manager is deprecated in 3.x and is NOT
# used). This bounds the deliberate, owner-approved 31-day IP retention for the NPM-access /
# SSH-host-auth / Keycloak streams; Loki data is deliberately excluded from backups so restic's GFS
# retention cannot silently extend those 31 days (ADR-0072). Rate caps guard against log storms.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # Rate caps against log storms (a bad deploy could otherwise flood the ingester).
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_streams_per_user: 10000
  max_line_size: 256KB
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # 31-day retention (744h). 0 would disable it.
  retention_period: 744h

compactor:
  working_directory: /loki/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Loki ruler: alerting rules evaluated by Loki over log streams (committed, not optional — the
# 3 Spring apps' logback_events cover only them; these catch Keycloak/Postgres/edge/host-auth).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  # Loki pushes its own firing alerts to the shared Alertmanager.
  alertmanager_url: http://alertmanager:9093
