# Loki ruler alerting rules (LogQL). Epic #936 — "committed in Phase 2, not optional".
# These catch failure signals that `logback_events_total` cannot see (it covers only the 3 Spring
# apps): Keycloak's fail-open Discord SPI error path, Postgres FATAL/PANIC, SSH auth attacks, NPM
# admin-UI login failures, and edge 5xx. The `app`/`level` stream labels are set by Alloy
# (config.alloy). "fake" is the single-tenant id when auth_enabled is false.
#
# NOTE: the exact NPM access-log, NPM admin-UI, and host auth.log line formats are verified ONCE on
# the test stack during rollout (docs/MONITORING_ROLLOUT_RUNBOOK.md) and the line filters below
# adjusted there if needed — they are the documented first-cut patterns.
groups:
  - name: log-alerts-critical
    rules:
      # A successful password OR keyboard-interactive SSH login on a key-only host implies a
      # compromise or misconfig. keyboard-interactive is the PAM password back door on UsePAM hosts
      # (logs as "Accepted keyboard-interactive/pam"); a bare "Accepted password" matcher misses it.
      - alert: SshPasswordLoginOnKeyOnlyHost
        expr: sum(rate({app="host-auth"} |~ "Accepted (password|keyboard-interactive)" [5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Successful password/keyboard-interactive SSH login on a key-only host"
          description: "auth.log shows an 'Accepted password' or 'Accepted keyboard-interactive' login. The host is key-only — investigate immediately."

      # High-signal theft detection: a SUCCESSFUL login from outside the operator's known networks.
      # DISABLED by default — it needs the operator's real egress prefix(es); with the example
      # placeholders it would fire on every legitimate login. To enable: replace the example
      # prefixes with your stable egress CIDR/prefix(es) (RE2 line filter on the logged source IP)
      # and uncomment. LogQL cannot restrict by IP structurally, so this is a negative line filter.
      # - alert: SshAcceptedFromUnexpectedIp
      #   expr: |
      #     sum(count_over_time(
      #       {app="host-auth"} |~ "Accepted " !~ "from (203\.0\.113\.|198\.51\.100\.)" [5m]
      #     )) > 0
      #   for: 0m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: "SSH login accepted from an unexpected source network"
      #     description: "A successful SSH login originated outside the operator's known networks — possible key theft. Verify it was you."

      - alert: PostgresFatalOrPanic
        expr: sum(rate({app=~"postgres-.+"} |~ "FATAL|PANIC" [5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL FATAL/PANIC in logs"
          description: "A PostgreSQL container logged FATAL or PANIC lines."

  - name: log-alerts-warning
    rules:
      # Fail-open Discord SPI: a persistently erroring precheck silently disables a security gate
      # while logins keep succeeding — only the Keycloak ERROR-rate catches it.
      - alert: KeycloakErrorRateHigh
        expr: sum(rate({app="keycloak"} |~ "(?i)\\bERROR\\b" [5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak ERROR-level log rate elevated"
          description: "Keycloak is logging ERRORs at an elevated rate — check the Discord SPI fail-open precheck path in particular."

      - alert: SshFailedAuthSpike
        expr: sum(rate({app="host-auth"} |~ "Failed password|authentication failure|Invalid user" [5m])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SSH failed-auth spike"
          description: "auth.log shows an elevated rate of failed SSH authentications / invalid users."

      # Every successful root login. root is the operator's admin/tunnel path and there is no other
      # SSH-capable account, so each login should be attributable — this fires on the operator's OWN
      # logins by design (an attributable audit trail); narrow to (password|keyboard-interactive) or
      # scope by source IP if the mail volume is unwanted.
      - alert: SshRootLoginAccepted
        expr: sum(rate({app="host-auth"} |~ "Accepted (publickey|password|keyboard-interactive) for root " [5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Successful SSH root login"
          description: "auth.log shows a successful root login. Expected only for operator admin/tunnel sessions — verify it was you."

      # The only non-root account (deploy) is nologin with no sudo, so any sudo failure is anomalous.
      - alert: SudoAuthFailure
        expr: sum(rate({app="host-auth"} |~ "sudo:.*(authentication failure|NOT in sudoers|command not allowed)" [10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "sudo authentication failure on the host"
          description: "auth.log shows a sudo failure. The only non-root account has no sudo, so a failure implies an unexpected actor — investigate."

      - alert: NpmAdminLoginFailure
        expr: sum(rate({app="npm"} |~ "(?i)(invalid|failed).*(login|password|token)" [10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NPM admin-UI login failure"
          description: "The NPM admin UI (loopback-only) recorded a failed login — any failure implies a host-local actor or tunnel. Verify the exact line format on the test stack."

      - alert: EdgeServerErrorSpike
        expr: sum(rate({app="npm-access"} |~ " 5[0-9][0-9] " [5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Edge (NPM) 5xx spike"
          description: "The NPM access logs show an elevated 5xx rate at the edge — catches upstream failures app metrics cannot see."
