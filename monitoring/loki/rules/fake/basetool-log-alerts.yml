# Loki ruler alerting rules (LogQL). Epic #936 — "committed in Phase 2, not optional".
# These catch failure signals that `logback_events_total` cannot see (it covers only the 3 Spring
# apps): Keycloak's fail-open Discord SPI error path, Postgres FATAL/PANIC, SSH auth attacks, and
# edge 5xx/429. The `app`/`level` stream labels are set by Alloy
# (config.alloy). "fake" is the single-tenant id when auth_enabled is false.
#
# NOTE: the exact NPM access-log and host auth.log line formats are verified ONCE on
# the test stack during rollout (docs/MONITORING_ROLLOUT_RUNBOOK.md) and the line filters below
# adjusted there if needed — they are the documented first-cut patterns.
groups:
  - name: log-alerts-critical
    rules:
      # A successful password OR keyboard-interactive SSH login on a key-only host implies a
      # compromise or misconfig. keyboard-interactive is the PAM password back door on UsePAM hosts
      # (logs as "Accepted keyboard-interactive/pam"); a bare "Accepted password" matcher misses it.
      - alert: SshPasswordLoginOnKeyOnlyHost
        expr: sum(rate({app="host-auth"} |~ "Accepted (password|keyboard-interactive)" [5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Successful password/keyboard-interactive SSH login on a key-only host"
          description: "auth.log shows an 'Accepted password' or 'Accepted keyboard-interactive' login. The host is key-only — investigate immediately."

      # High-signal theft detection: a SUCCESSFUL login from outside the operator's known networks.
      # DISABLED by default — it needs the operator's real egress prefix(es); with the example
      # placeholders it would fire on every legitimate login. To enable: replace the example
      # prefixes with your stable egress CIDR/prefix(es) (RE2 line filter on the logged source IP)
      # and uncomment. LogQL cannot restrict by IP structurally, so this is a negative line filter.
      # - alert: SshAcceptedFromUnexpectedIp
      #   expr: |
      #     sum(count_over_time(
      #       {app="host-auth"} |~ "Accepted " !~ "from (203\.0\.113\.|198\.51\.100\.)" [5m]
      #     )) > 0
      #   for: 0m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: "SSH login accepted from an unexpected source network"
      #     description: "A successful SSH login originated outside the operator's known networks — possible key theft. Verify it was you."

      # FATAL is Postgres's log level for many BENIGN connection-lifecycle events that occur on every
      # restart/deploy: a client (a dependent app retry-connecting) that hits the DB while it is
      # starting up, shutting down or in recovery, or a connection terminated by an admin command. The
      # unfiltered "FATAL|PANIC" matcher paged CRITICAL on every DB recreate (the 2026-07-15 restart
      # cascade) from those lifecycle lines. The four excluded substrings are the standard Postgres
      # server messages for exactly those benign cases; SECURITY-relevant FATALs (password
      # authentication failed, role/database does not exist, too many clients) are NOT excluded and
      # still page. PANIC stays effectively unconditional: a PANIC line (WAL/checkpoint/corruption) never
      # contains one of these connection-lifecycle phrases, so the != filters never drop a PANIC. Single
      # combined rate() on purpose — a two-term sum(PANIC)+sum(FATAL) would drop to an empty vector (and
      # miss a real FATAL) whenever one term has no matching lines. These are documented first-cut line
      # filters — verify/adjust against real prod Loki lines on the test stack per the file header +
      # rollout runbook.
      - alert: PostgresFatalOrPanic
        expr: |
          sum(rate({app=~"postgres-.+"} |~ "FATAL|PANIC" != "the database system is starting up" != "the database system is shutting down" != "the database system is in recovery mode" != "terminating connection due to administrator command" [5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL FATAL/PANIC in logs"
          description: "A PostgreSQL container logged a PANIC or a non-benign FATAL line (benign connection-lifecycle FATALs during a restart — starting up / shutting down / in recovery / admin-terminated — are excluded)."

      # JVM native-thread exhaustion breadcrumb (ADR-0095). The `<svc>-stdout` streams carry the
      # JVM/glibc native errors that bypass logback and never reach the masked JSON file — including the
      # `pthread_create failed (EAGAIN)` / `unable to create native thread` line of the 2026-07-12 ingest
      # pids-cap OOM. This is a LAGGING forensic complement: the LEADING indicator is ContainerPidsHigh
      # (infrastructure.yml, #1275 — watches the cgroup pids count, so it sees the zombie/task leak that
      # the JVM-only JvmThreadsHigh was blind to) and the root cause is fixed by init:true zombie reaping
      # (#1274), so a crash should not recur — this only leaves the native line in Loki when one does.
      #
      # STAGED, NOT ACTIVE (dead-alert guard, REQ-OBS-014): enable ONLY after verifying on the test/prod
      # stack that the native line actually lands in this stream once <svc>-stdout is shipped — i.e. that
      # `{app=~"(backend|frontend|ingest)-stdout"}` returns the `docker logs` stderr line (the JVM console
      # appender is active in prod, so the stream flows, but the native line is emitted outside logback
      # and its presence in the shipped stream must be confirmed, not assumed). See the Alloy stdout-stream
      # verification step in docs/MONITORING_ROLLOUT_RUNBOOK.md. Uncomment once confirmed.
      # - alert: JvmNativeThreadExhaustion
      #   expr: 'sum(count_over_time({app=~"(backend|frontend|ingest)-stdout"} |~ "pthread_create failed|unable to create native thread" [5m])) > 0'
      #   for: 0m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: "JVM native-thread exhaustion in a container ({{ $labels.app }})"
      #     description: "A JVM app's container stderr logged 'pthread_create failed' / 'unable to create native thread' — the container hit its cgroup pids cap and the JVM can no longer create OS threads (the 2026-07-12 native-thread OOM). Check the pids trend and container restarts; the leading warning is ContainerPidsHigh."

  - name: log-alerts-warning
    rules:
      # Fail-open Discord SPI: a persistently erroring precheck silently disables a security gate
      # while logins keep succeeding — only the Keycloak ERROR-rate catches it.
      - alert: KeycloakErrorRateHigh
        expr: sum(rate({app="keycloak"} |~ "(?i)\\bERROR\\b" [5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak ERROR-level log rate elevated"
          description: "Keycloak is logging ERRORs at an elevated rate — check the Discord SPI fail-open precheck path in particular."

      # Keycloak OAuth backchannel failing (2026-07-22 incident): the frontend's token grants
      # (refresh_token + authorization_code, ADR-0115 pool) died for 41 minutes with
      # PrematureCloseException while the edge, Keycloak and all metrics-level probes stayed green —
      # zero alerts fired. Each such line is one genuinely lost token grant (not retried by design,
      # REQ-SEC-012): sustained occurrences mean idle sessions cannot refresh and NEW LOGINS are at
      # risk, since the login code exchange shares the same transport. Pattern verified against the
      # real prod lines of the incident (logger reactor.netty HttpClientConnect, stack_trace
      # PrematureCloseException, remote keycloak.profit-base.online in the same JSON line).
      - alert: FrontendKeycloakBackchannelFailing
        expr: 'sum(count_over_time({app="frontend"} |~ "PrematureCloseException" |~ "keycloak" [10m])) > 10'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frontend->Keycloak token backchannel failing (PrematureClose)"
          description: "The frontend logs a sustained rate of PrematureCloseException against the Keycloak token endpoint — refresh grants are being lost and logins may fail. 2026-07-22 pattern: a transient L4 fault on the public hairpin stalled token POST bodies; the edge reaped each attempt after ~60s. Check the hairpin path (NPM, conntrack) and frontend re-auth rates."

      # A health contributor crossing Spring Boot's 10s slow-indicator threshold is always
      # pathological (the Docker HEALTHCHECK budget is 5s): during the 2026-07-22 incident the
      # frontend's reactive Redis PING hung for 161-836 SECONDS, readiness hung with it and the
      # container sat unhealthy for ~15 minutes — with no alert anywhere. Pattern verified against
      # the real prod lines ("Health contributor org.springframework...ReactiveHealthIndicatorAdapter
      # (redis) took 836643ms to respond"); backend included — its prod-enabled Redis indicator runs
      # without a Lettuce timeout bound and can log the same line.
      - alert: HealthContributorHanging
        expr: 'sum by (app) (count_over_time({app=~"backend|frontend"} |~ "Health contributor .+ took" [10m])) > 0'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Slow/hanging health contributor ({{ $labels.app }})"
          description: "A Spring Boot health contributor took >10s to respond (logged by HealthEndpointSupport) — readiness and the Docker healthcheck (5s budget) are already failing while the app looks alive. 2026-07-22 pattern: a hung reactive Redis PING queued successive checks for minutes. Check the named contributor and the container's health state."

      - alert: SshFailedAuthSpike
        expr: sum(rate({app="host-auth"} |~ "Failed password|authentication failure|Invalid user" [5m])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SSH failed-auth spike"
          description: "auth.log shows an elevated rate of failed SSH authentications / invalid users."

      # Every successful root login. root is the operator's admin/tunnel path and there is no other
      # SSH-capable account, so each login should be attributable — this fires on the operator's OWN
      # logins by design (an attributable audit trail); narrow to (password|keyboard-interactive) or
      # scope by source IP if the mail volume is unwanted.
      - alert: SshRootLoginAccepted
        expr: sum(rate({app="host-auth"} |~ "Accepted (publickey|password|keyboard-interactive) for root " [5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Successful SSH root login"
          description: "auth.log shows a successful root login. Expected only for operator admin/tunnel sessions — verify it was you."

      # The only non-root account (deploy) is nologin with no sudo, so any sudo failure is anomalous.
      - alert: SudoAuthFailure
        expr: sum(rate({app="host-auth"} |~ "sudo:.*(authentication failure|NOT in sudoers|command not allowed)" [10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "sudo authentication failure on the host"
          description: "auth.log shows a sudo failure. The only non-root account has no sudo, so a failure implies an unexpected actor — investigate."

      - alert: EdgeServerErrorSpike
        expr: sum(rate({app="npm-access"} |~ " 5[0-9][0-9] " [5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Edge (NPM) 5xx spike"
          description: "The NPM access logs show an elevated 5xx rate at the edge — catches upstream failures app metrics cannot see."

      # 429s come from the edge limiter (REQ-SEC-023, limit_req/limit_conn in the custom
      # server_proxy.conf snippet) or the backend Bucket4j limiter passing through the edge —
      # either way a sustained rate means someone is flooding or brute-forcing.
      - alert: EdgeRateLimitSpike
        expr: sum(rate({app="npm-access"} |~ " 429 " [5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Edge rate limiter engaged"
          description: "The NPM access logs show a sustained 429 rate — the edge per-IP limiter (or the backend rate limiter) is rejecting a flood. Check source IPs in the npm-access stream."

      # sshd_config / authorized_keys tamper: auditd emits a watch event (with the acting auid) on any
      # write to the sshd config or a root authorized_keys. Fires on the operator's OWN edits too (rare)
      # — each event carries the auid, so it stays attributable; raise to critical once the config is
      # stable. Needs the host-auditd stream (auditd installed + log_group=adm). Verify the raw-log key=
      # format once on the test stack (auditd hex-encodes keys with special chars; these two do not).
      - alert: AuditdSshTamper
        expr: 'sum(count_over_time({app="host-auditd"} |~ `key="(sshd-config|sshd-authkeys)"` [5m])) > 0'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSH config / authorized_keys modified (auditd)"
          description: "auditd recorded a write to sshd_config(.d) or a root authorized_keys file. Confirm the acting user (auid) was you; an unexpected change may be a backdoor key or a security downgrade."
