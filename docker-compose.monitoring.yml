x-mon-logging: &mon-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-mon-base: &mon-base
  restart: unless-stopped
  logging: *mon-logging
  security_opt:
    - no-new-privileges:true
  oom_score_adj: 500
  init: true

services:
  prometheus:
    <<: *mon-base
    container_name: prometheus
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "900MiB"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-admin-api
      - --web.config.file=/etc/prometheus/web.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - /var/iri/monitoring/secrets/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - /var/iri/monitoring/secrets/scrape_password:/etc/prometheus/secrets/scrape_password:ro
      - /var/iri/monitoring/secrets/prometheus_web_password:/etc/prometheus/secrets/web_password:ro
      - /var/iri/monitoring/certs/basetool-ca.crt:/etc/prometheus/certs/basetool-ca.crt:ro
      - /var/iri/monitoring/data/prometheus:/prometheus
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape

  grafana:
    <<: *mon-base
    container_name: grafana
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "768MiB"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.profit-base.online/}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set for the monitoring stack}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?GRAFANA_OAUTH_CLIENT_SECRET must be set for the monitoring stack}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${IRI_KEYCLOAK_HOSTNAME:-https://profit-base.online/auth}/realms/iri/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${IRI_KEYCLOAK_HOSTNAME:-https://profit-base.online/auth}/realms/iri/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${IRI_KEYCLOAK_HOSTNAME:-https://profit-base.online/auth}/realms/iri/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'Admin') && 'GrafanaAdmin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      PROMETHEUS_WEB_PASSWORD: ${PROMETHEUS_WEB_PASSWORD:?PROMETHEUS_WEB_PASSWORD must be set for the monitoring stack}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/iri/monitoring/certs/grafana.crt:/etc/grafana/certs/grafana.crt:ro
      - /var/iri/monitoring/certs/grafana.key:/etc/grafana/certs/grafana.key:ro
      - /var/iri/monitoring/data/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 512
    networks:
      - net-monitoring-core
      - net-proxy-grafana

  loki:
    <<: *mon-base
    container_name: loki
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "288MiB"
    command: -config.file=/etc/loki/loki-config.yml
    stop_grace_period: 45s
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - /var/iri/monitoring/data/loki:/loki
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 512
    networks:
      - net-monitoring-core

  tempo:
    <<: *mon-base
    container_name: tempo
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    cap_drop: [ALL]
    command: ["-target=all", "-config.expand-env=true", "-config.file=/etc/tempo/tempo.yaml"]
    environment:
      GOMEMLIMIT: "768MiB"
      PROMETHEUS_WEB_PASSWORD: ${PROMETHEUS_WEB_PASSWORD:?PROMETHEUS_WEB_PASSWORD must be set for the monitoring stack}
    stop_grace_period: 45s
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /var/iri/monitoring/data/tempo:/var/tempo
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 512
    networks:
      - net-monitoring-core

  alloy:
    <<: *mon-base
    container_name: alloy
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    cap_drop: [ALL]
    group_add: ["473", "4"]
    environment:
      GOMEMLIMIT: "360MiB"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/iri/monitoring/data/alloy:/var/lib/alloy/data
      - /var/iri/backend/log:/logs/backend:ro
      - /var/iri/frontend/log:/logs/frontend:ro
      - /var/iri/ingest/log:/logs/ingest:ro
      - /var/iri/keycloak/log:/logs/keycloak:ro
      - /var/log:/hostlog:ro
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape

  alertmanager:
    <<: *mon-base
    container_name: alertmanager
    image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "36MiB"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=744h
    volumes:
      - /var/iri/monitoring/secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /var/iri/monitoring/data/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 48M
          pids: 512
    networks:
      - net-monitoring-core

  node-exporter:
    <<: *mon-base
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    environment:
      GOMEMLIMIT: "24MiB"
    command:
      - --path.rootfs=/host
      - --collector.systemd
      - --collector.textfile.directory=/host/var/iri/monitoring/textfile
      - --no-collector.wifi
    volumes:
      - /:/host:ro,rslave
      - /run/systemd/private:/run/systemd/private:ro
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape

  postgres-exporter-backend:
    <<: *mon-base
    container_name: postgres-exporter-backend
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    cap_drop: [ALL]
    command:
      - --no-collector.stat_replication
      - --collector.database_wraparound
      - --collector.long_running_transactions
    environment:
      GOMEMLIMIT: "24MiB"
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-monitoring}:${PG_EXPORTER_BACKEND_PASSWORD:?PG_EXPORTER_BACKEND_PASSWORD must be set}@db-backend:15432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-db-backend

  postgres-exporter-keycloak:
    <<: *mon-base
    container_name: postgres-exporter-keycloak
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    cap_drop: [ALL]
    command:
      - --no-collector.stat_replication
      - --collector.database_wraparound
      - --collector.long_running_transactions
    environment:
      GOMEMLIMIT: "24MiB"
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-monitoring}:${PG_EXPORTER_KEYCLOAK_PASSWORD:?PG_EXPORTER_KEYCLOAK_PASSWORD must be set}@db-keycloak:15433/${KC_POSTGRES_DB:?KC_POSTGRES_DB must be set}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-db-keycloak

  redis-exporter:
    <<: *mon-base
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "24MiB"
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: ${REDIS_EXPORTER_USER:-monitoring}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD must be set}
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-redis-frontend

  blackbox-exporter:
    <<: *mon-base
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    cap_drop: [ALL]
    environment:
      GOMEMLIMIT: "44MiB"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - /var/iri/monitoring/certs/basetool-ca.crt:/etc/blackbox/certs/basetool-ca.crt:ro
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape
      - net-blackbox-v6

networks:
  net-monitoring-scrape:
    external: true
    name: net-monitoring-scrape
  net-proxy-grafana:
    external: true
    name: net-proxy-grafana
  net-monitoring-core:
    name: net-monitoring-core
    driver: bridge
  net-blackbox-v6:
    name: net-blackbox-v6
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:bb::/64
  net-db-backend:
    external: true
    name: net-db-backend
  net-db-keycloak:
    external: true
    name: net-db-keycloak
  net-redis-frontend:
    external: true
    name: net-redis-frontend
