# =============================================================================================
# Profit Basetool — operations monitoring stack (epic #936, ADR-0072, REQ-OBS-005..011).
#
# A DEDICATED compose project, deliberately NOT a profile of docker-compose.yml: this fully
# decouples monitoring from the 5-minute app-deploy loop (no --remove-orphans risk; a flapping
# monitoring healthcheck can never trigger an app-stack rollback). deploy.sh brings it up with a
# NON-GATING step (IRI_MONITORING_ENABLED=true) AFTER the app stack is healthy — a monitoring
# failure logs but never rolls back the apps.
#
# Image pins are the latest stable lines verified 2026-07 against the official release pages (owner
# version directive); Dependabot's docker-compose ecosystem (directory /) maintains the pins and
# adds @sha256 digests afterwards. Contains ZERO secrets — every credential is a host-side file
# under /var/iri/monitoring/secrets/ or an .env value, provisioned by
# docs/MONITORING_ROLLOUT_RUNBOOK.md.
#
# Transport (REQ-OBS-008): the apps are scraped over HTTPS with the pinned public CA; everything
# else inside the isolated monitoring networks is plain HTTP by the owner-approved carve-out.
# =============================================================================================

x-mon-logging: &mon-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared hardening (epic #936): drop privilege escalation, cap the pid table, and set a POSITIVE
# oom_score_adj so the kernel sacrifices monitoring BEFORE the apps/DBs under memory pressure.
# read_only rootfs is deferred to Phase-3 per-image tuning (verified on the test stack) to avoid
# startup regressions here. cap_drop is applied per-service (cAdvisor/socket-proxy need more access).
x-mon-base: &mon-base
  restart: unless-stopped
  logging: *mon-logging
  security_opt:
    - no-new-privileges:true
  oom_score_adj: 500

services:
  # ------------------------------------------------------------------------------------------
  # Prometheus — metrics DB. 180d retention + 40GB cap; admin API (for the weekly TSDB snapshot)
  # behind web.config basic auth. No Docker healthcheck: the web server is auth-protected, so the
  # self-scrape `up` metric + the TargetDown alert are its liveness signal.
  # ------------------------------------------------------------------------------------------
  prometheus:
    <<: *mon-base
    container_name: prometheus
    image: prom/prometheus:v3.13.0
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-admin-api
      - --web.config.file=/etc/prometheus/web.yml
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - /var/iri/monitoring/secrets/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - /var/iri/monitoring/secrets/scrape_password:/etc/prometheus/secrets/scrape_password:ro
      - /var/iri/monitoring/secrets/prometheus_web_password:/etc/prometheus/secrets/web_password:ro
      - /var/iri/monitoring/certs/basetool-ca.crt:/etc/prometheus/certs/basetool-ca.crt:ro
      - /var/iri/monitoring/data/prometheus:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape

  # ------------------------------------------------------------------------------------------
  # Grafana — the ONLY monitoring UI. Own TLS cert, Keycloak OIDC (realm role Admin), hardened.
  # ------------------------------------------------------------------------------------------
  grafana:
    <<: *mon-base
    container_name: grafana
    image: grafana/grafana-oss:13.0.2
    cap_drop: [ALL]
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.profit-base.online/}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
      # Hardening: basic auth / anonymous / sign-up off; secure cookies; no gravatar/telemetry.
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      # Break-glass admin — seeds ONLY on first boot (empty DB); rotate via `grafana cli` (runbook).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set for the monitoring stack}
      # Keycloak OIDC (PKCE). role_attribute_strict denies login without the Admin realm role.
      # Needs the "User Realm Role" mapper with "Add to ID token" ON (runbook + realm-config).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?GRAFANA_OAUTH_CLIENT_SECRET must be set for the monitoring stack}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.profit-base.online/realms/iri/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.profit-base.online/realms/iri/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.profit-base.online/realms/iri/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'Admin') && 'GrafanaAdmin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      # Consumed by the provisioned Prometheus datasource (basic auth to the auth-protected API).
      PROMETHEUS_WEB_PASSWORD: ${PROMETHEUS_WEB_PASSWORD:?PROMETHEUS_WEB_PASSWORD must be set for the monitoring stack}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/iri/monitoring/certs/grafana.crt:/etc/grafana/certs/grafana.crt:ro
      - /var/iri/monitoring/certs/grafana.key:/etc/grafana/certs/grafana.key:ro
      - /var/iri/monitoring/data/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          # Grafana 13 grows to ~500 MB+ under active dashboard use (bleve full-text indexes for
          # folders/dashboards/playlists/repositories + OIDC sessions + bundled-plugin processes).
          # 192M AND 512M both OOM-cycled it on the production host (95%+ usage -> SIGKILL -> restart
          # loop, ~every 5 min). 1G gives real headroom on the 16 GB host.
          memory: 1024M
          pids: 512
    networks:
      - net-monitoring-core
      # Reachable by NPM for the public grafana.profit-base.online host WITHOUT joining NPM to the
      # closed net-monitoring-core: a dedicated proxy net shared by ONLY NPM (app stack) + Grafana.
      - net-proxy-grafana

  # ------------------------------------------------------------------------------------------
  # Loki — log store (31d, compactor retention). Ruler pushes log-based alerts to Alertmanager.
  # ------------------------------------------------------------------------------------------
  loki:
    <<: *mon-base
    container_name: loki
    image: grafana/loki:3.7.3
    cap_drop: [ALL]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - /var/iri/monitoring/data/loki:/loki
    # No Docker healthcheck: the Loki image is distroless (no shell/wget), so a CMD-SHELL probe can
    # never run and would pin the container to (unhealthy) despite a healthy process. Liveness comes
    # from the Prometheus `up` metric on the loki scrape target (meta-monitoring), per the design note.
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 512
    networks:
      - net-monitoring-core

  # ------------------------------------------------------------------------------------------
  # Tempo — trace store (14d), monolithic (-target=all, no Kafka).
  # Pinned to the 3.x line (3.0.2): Tempo 3.0 is a breaking architecture rewrite (live-store +
  # backend-scheduler/worker replace the removed 2.x ingester/compactor), migrated and config-verified
  # for this deployment in #1036. We stay MONOLITHIC on the local filesystem backend — all components
  # run in one process and NO Kafka is required (Kafka is a microservices-only requirement in 3.x); our
  # span volume is far below Grafana's microservices threshold (ADR-0076, extends ADR-0072). The
  # rewritten monolithic config in tempo.yaml passes `tempo -config.verify`. The existing vParquet4
  # data dir is kept across the upgrade (3.0 reads 2.x RF3 blocks).
  # ------------------------------------------------------------------------------------------
  tempo:
    <<: *mon-base
    container_name: tempo
    image: grafana/tempo:3.0.2
    cap_drop: [ALL]
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /var/iri/monitoring/data/tempo:/var/tempo
    # No Docker healthcheck: the Tempo image is distroless (no shell/wget) — same rationale as Loki.
    # Liveness = the Prometheus `up` metric on the tempo scrape target (meta-monitoring).
    deploy:
      resources:
        limits:
          # Under active trace ingestion (Keycloak OTLP spans) the monolithic Tempo grew past its
          # former 256M cap and OOM-cycled every ~minute on the production host (RSS ~326 MB). 512M
          # holds with headroom on the 16 GB host (data-driven fine-tune tracked in #937).
          memory: 512M
          pids: 512
    networks:
      - net-monitoring-core

  # ------------------------------------------------------------------------------------------
  # Alloy — log shipper + OTLP collector. Receives app/Keycloak spans on the scrape net, forwards
  # to Tempo on the core net; ships logs to Loki. Reads container logs via the socket proxy only.
  # ------------------------------------------------------------------------------------------
  alloy:
    <<: *mon-base
    container_name: alloy
    image: grafana/alloy:v1.17.1
    # Runs as root to reach its own storage dir and read privileged host logs, but with ALL caps
    # dropped. Instead of restoring CAP_DAC_OVERRIDE we grant two supplementary groups (least
    # privilege, no capability bypass): GID 473 = the image's `alloy` group that owns /var/lib/alloy
    # (mode 0770) so root can traverse into the mounted data subdir; GID 4 = `adm` so it can read the
    # syslog:adm-owned /var/log/auth.log. Re-verify both GIDs if the alloy base image ever changes.
    cap_drop: [ALL]
    group_add: ["473", "4"]
    # GOMEMLIMIT is a SOFT cap set ~90% of the 256M hard limit below so the Go GC reclaims heap and
    # returns it to the OS BEFORE the cgroup OOM-kills Alloy. Without it Alloy's working set creeps
    # monotonically toward the cgroup limit (Go frees memory lazily when there is no pressure), which
    # eventually trips ContainerOomKilled and cuts the log/trace shipping stream. Keep it a notch under
    # deploy.resources.limits.memory whenever that limit changes.
    environment:
      GOMEMLIMIT: "230MiB"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/iri/monitoring/data/alloy:/var/lib/alloy/data
      # Log sources (read-only). App JSON is masked at source; NPM access + host auth.log keep IPs.
      - /var/iri/backend/log:/logs/backend:ro
      - /var/iri/frontend/log:/logs/frontend:ro
      - /var/iri/keycloak/log:/logs/keycloak:ro
      - /var/iri/npm/data/logs:/logs/npm:ro
      - /var/log:/hostlog:ro
    deploy:
      resources:
        limits:
          # 256M (was 192M): Alloy's OTLP receiver+exporter, ~8 file tailers and the docker log source
          # settle around 180-200M, so 192M ran within ~5% of the limit and crept upward. 256M gives
          # real headroom; GOMEMLIMIT above keeps the Go heap from drifting back into the OOM zone.
          memory: 256M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape
      - net-docker-proxy

  # ------------------------------------------------------------------------------------------
  # Alertmanager — SMTP routing + the Watchdog heartbeat to healthchecks.io. The config is rendered
  # from alertmanager.yml.tmpl by the runbook (Alertmanager does not expand env vars) to
  # /var/iri/monitoring/secrets/alertmanager.yml.
  # ------------------------------------------------------------------------------------------
  alertmanager:
    <<: *mon-base
    container_name: alertmanager
    image: quay.io/prometheus/alertmanager:v0.33.1
    cap_drop: [ALL]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - /var/iri/monitoring/secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /var/iri/monitoring/data/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 48M
          pids: 512
    networks:
      - net-monitoring-core

  # ------------------------------------------------------------------------------------------
  # node_exporter — host metrics + systemd collector + textfile collector (ops-automation metrics).
  # Needs the host namespaces, so it is intentionally the least-isolated monitoring service.
  # ------------------------------------------------------------------------------------------
  node-exporter:
    <<: *mon-base
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.11.1
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.systemd
      - --collector.textfile.directory=/host/var/iri/monitoring/textfile
      - --no-collector.wifi
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape

  # ------------------------------------------------------------------------------------------
  # cAdvisor — per-container metrics via the GET-only docker socket proxy (never the raw socket).
  # No cap_drop: ALL — it reads host cgroup/sys state and needs broader access than the exporters.
  # The Docker container factory ALSO opens a direct containerd client (Docker delegates runtime
  # state to containerd), so it needs /run/containerd/containerd.sock mounted: without it the
  # factory fails to register and, under --docker_only, cAdvisor emits ZERO name-labelled series —
  # every Container-dashboard panel then reads "No data". The socket-proxy speaks only the Docker
  # REST API, not containerd's gRPC, so it cannot cover this. The containerd socket is
  # root-equivalent; the security trade-off is recorded in ADR-0072 §6 (owner-approved, PR #982).
  # ------------------------------------------------------------------------------------------
  cadvisor:
    <<: *mon-base
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.3
    command:
      - --docker=tcp://socket-proxy:2375
      - --docker_only
      - --housekeeping_interval=30s
      - --listen_ip=0.0.0.0
      - --port=8080
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-docker-proxy

  # ------------------------------------------------------------------------------------------
  # docker-socket-proxy — GET-only Docker API for cAdvisor + Alloy. POST/EXEC/AUTH/SECRETS stay
  # denied (defaults); CONTAINERS/IMAGES/INFO/NETWORKS enabled for container discovery + log
  # streaming (Alloy's discovery.docker reads /networks to compute per-container network labels).
  # ------------------------------------------------------------------------------------------
  socket-proxy:
    <<: *mon-base
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      EXEC: "0"
      AUTH: "0"
      SECRETS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-docker-proxy

  # ------------------------------------------------------------------------------------------
  # postgres_exporter ×2 — one per DB, dedicated pg_monitor-only user. Each bridges into the app
  # data net to reach its DB AND the scrape net so Prometheus can scrape it (keeps the DBs off the
  # broad scrape net — no new lateral path). sslmode=disable: the DBs serve plain on isolated nets.
  #
  # --no-collector.stat_replication: the exporter's default-enabled `stat_replication` collector runs
  # `SELECT …, slot_name, … FROM pg_stat_replication`, but pg_stat_replication has NO slot_name column
  # (it lives in pg_stat_replication_slots / pg_stat_wal_receiver) — an upstream bug still present on
  # v0.20.0 and main. On every scrape both DBs logged `ERROR: column "slot_name" does not exist`,
  # spamming Loki. These are single-instance DBs with no streaming replicas, so the metric is dead
  # weight anyway; the flag (kingpin-only, no envar) disables the broken query. The valid `replication`
  # / `replication_slots` collectors stay on.
  #
  # --collector.database_wraparound + --collector.long_running_transactions (#1041 item 13): both are
  # default-OFF built-in collectors. They add pg_database_wraparound_age_datfrozenxid_seconds (an XID
  # AGE COUNT despite the _seconds name — the SQL is age(datfrozenxid)) and
  # pg_long_running_transactions_oldest_timestamp_seconds (genuinely seconds), backing the wraparound /
  # long-transaction alerts. Read-only queries against pg_database / pg_stat_activity — no extra grants
  # beyond the existing pg_monitor role. Recreate both exporter containers on deploy to pick up the flags.
  # ------------------------------------------------------------------------------------------
  postgres-exporter-backend:
    <<: *mon-base
    container_name: postgres-exporter-backend
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
    cap_drop: [ALL]
    command:
      - --no-collector.stat_replication
      - --collector.database_wraparound
      - --collector.long_running_transactions
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-monitoring}:${PG_EXPORTER_BACKEND_PASSWORD:?PG_EXPORTER_BACKEND_PASSWORD must be set}@db-backend:15432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-db-backend

  postgres-exporter-keycloak:
    <<: *mon-base
    container_name: postgres-exporter-keycloak
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
    cap_drop: [ALL]
    # --no-collector.stat_replication: see the backend exporter above — upstream slot_name bug.
    # --collector.database_wraparound + --collector.long_running_transactions: see the backend exporter.
    command:
      - --no-collector.stat_replication
      - --collector.database_wraparound
      - --collector.long_running_transactions
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_EXPORTER_USER:-monitoring}:${PG_EXPORTER_KEYCLOAK_PASSWORD:?PG_EXPORTER_KEYCLOAK_PASSWORD must be set}@db-keycloak:15433/${KC_POSTGRES_DB:?KC_POSTGRES_DB must be set}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-db-keycloak

  # ------------------------------------------------------------------------------------------
  # redis_exporter — dedicated ACL user (read-only monitoring commands, no key access — the session
  # store with OAuth2 refresh tokens stays unreadable). Bridges into net-redis-frontend to reach it.
  # ------------------------------------------------------------------------------------------
  redis-exporter:
    <<: *mon-base
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.86.0
    cap_drop: [ALL]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: ${REDIS_EXPORTER_USER:-monitoring}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD must be set}
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-scrape
      - net-redis-frontend

  # ------------------------------------------------------------------------------------------
  # blackbox_exporter — HTTPS probes + certificate expiry for the public endpoints. Needs egress.
  # ------------------------------------------------------------------------------------------
  blackbox-exporter:
    <<: *mon-base
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:v0.28.0
    cap_drop: [ALL]
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      # Basetool CA for the https_internal module (#1041 item 8) — validates the app keystore.p12
      # cert chain so probe_ssl_earliest_cert_expiry drives CertificateExpiringSoon on the internal
      # certs. Same host-side CA that Prometheus mounts for its HTTPS app scrapes.
      - /var/iri/monitoring/certs/basetool-ca.crt:/etc/blackbox/certs/basetool-ca.crt:ro
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 512
    networks:
      - net-monitoring-core
      - net-monitoring-scrape

networks:
  # Shared boundary net, created and owned by the app stack (docker-compose.yml); referenced here by
  # its fixed name. Prometheus scrapes the apps + keycloak here and Alloy receives their OTLP spans.
  net-monitoring-scrape:
    external: true
    name: net-monitoring-scrape
  # Dedicated NPM<->Grafana proxy net, created and owned by the app stack (docker-compose.yml, where
  # NPM lives). Lets NPM re-encrypt the public grafana.profit-base.online host to grafana:3000 without
  # ever joining the closed net-monitoring-core.
  net-proxy-grafana:
    external: true
    name: net-proxy-grafana
  # Monitoring-only backbone (Prometheus/Alertmanager/Loki/Tempo/Grafana/exporters). App containers
  # are NEVER members. Not `internal` because alertmanager (SMTP + healthchecks.io) and blackbox
  # need internet egress.
  net-monitoring-core:
    name: net-monitoring-core
    driver: bridge
  # cAdvisor/Alloy ↔ socket-proxy only. Internal: no internet path is needed here.
  net-docker-proxy:
    name: net-docker-proxy
    driver: bridge
    internal: true
  # App-owned data nets (created by docker-compose.yml), referenced so the exporters reach the
  # DBs/Redis without putting them on the broad scrape net.
  net-db-backend:
    external: true
    name: net-db-backend
  net-db-keycloak:
    external: true
    name: net-db-keycloak
  net-redis-frontend:
    external: true
    name: net-redis-frontend
