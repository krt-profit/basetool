}

/**
 * Renders the search status with progress and stop.
 * @returns {string} markup
 */
function statusBar() {
  const s = state.search;
  if (s.phase === 'running') {
    const label = ['Suche läuft · 2-Stopp-Durchgang', 'Zwischenergebnis · Suche läuft weiter', 'Verbessert · lokale Suche'][s.step] || 'Suche läuft';
    return `<div class="tr-status tr-status--running" role="status"><span class="krt-spinner" aria-hidden="true"></span><strong>${label}</strong><span class="tr-status__bar"><i style="width:${[15, 45, 80][s.step] || 10}%"></i></span><span class="muted num">${s.elapsed} s / 60 s</span><button class="btn btn-ghost btn-xs" data-act="stop-search">Suche stoppen</button></div>`;
  }
  const how = s.deadline ? 'Frist erreicht nach 60 s' : s.stopped ? `gestoppt nach ${s.elapsed} s` : `abgeschlossen in ${s.elapsed || 6} s`;
  const fresh = state.newPrices ? `<div class="tr-warnline tr-warnline--info" role="status">${ic('info')}<span>Neue Preise seit 15:00 Uhr. Die Route bleibt, bis du sie prüfst.</span><button class="btn btn-ghost btn-xs" data-act="recheck" style="margin-left:auto">Route prüfen</button></div>` : '';
  return `<div class="tr-status" role="status">${ic('check')}<span>Suche ${how} · ${state.results.length} Route${state.results.length > 1 ? 'n' : ''} · Datenstand 14:00 Uhr</span><span class="muted">Neue Preise kommen stündlich.</span></div>${fresh}`;
}

/**
 * Returns the ranked computed results of the last search.
 * @returns {Array<object>} the routes
 */
function results() {
  const ids = state.search.phase === 'running' ? [[], ['r3'], ['r1', 'r3']][state.search.step] || [] : state.results;
  return rank(ids.map((id) => computeRoute(ROUTES.find((x) => x.id === id), state.resultShips)), state.request);
}

const pageRoutes = {};

/**
 * Finds a computed route shown on the current page, falling back to the planner's results.
 * @param {string} id the route id
 * @returns {object|undefined} the computed route
 */
function routeById(id) {
  return pageRoutes[id] || results().find((x) => x.id === id);
}

/** PROTOTYPE request fields: every parameter of the route request, grouped, shared by the variants. */

/**

 * @param {string} key the request list
 * @param {Array<string>} values the options

function toggles(key, values) {

}

/**
 * Renders a switch bound to a Boolean of the request.
 * @param {string} key the request field
 * @param {string} label the label
 * @param {string} hint an optional hint
 * @returns {string} markup
 */
function sw(key, label, hint) {
  return `<label class="krt-switch"><input type="checkbox" role="switch" data-bind="${key}" ${state.request[key] ? 'checked' : ''}> ${label}${hint ? ` <span class="tr-hint">${hint}</span>` : ''}</label>`;
}

/**
 * Renders a picker for terminals or commodities with its chosen entries.
 * @param {string} key the request field
 * @param {string} kind terminal or commodity
 * @param {boolean} single whether the field holds one entry
 * @param {string} empty text shown without entries
 * @returns {string} markup
 */
function picker(key, kind, single, empty) {
  const cur = single ? (state.request[key] ? [state.request[key]] : []) : state.request[key];
  const name = (v) => (kind === 'terminal' ? TERMINALS[v].name : v);
  const tags = cur.map((v) => `<span class="filter-chip">${esc(name(v))}<button class="filter-chip__remove" data-act="list-remove" data-key="${key}" data-val="${esc(v)}" aria-label="${esc(name(v))} entfernen">×</button></span>`).join('');
  const disabled = key === 'end' && state.request.roundTrip;
  const hide = single && cur.length;
  return `<div class="tr-tags" data-empty="${esc(empty)}">${tags}</div>${hide ? '' : `<div class="tr-picker"><input type="search" autocomplete="off" data-picker="${key}" data-kind="${kind}" placeholder="${kind === 'terminal' ? 'Terminal oder Ort suchen …' : 'Ware suchen …'}" ${disabled ? 'disabled' : ''}><div class="tr-picker__list" hidden></div></div>`}`;
}

/**
 * Renders the picker options matching a query.
 * @param {string} key the request field
 * @param {string} kind terminal or commodity
 * @param {string} q the query
 * @returns {string} markup
 */
function pickerOptions(key, kind, q) {
  const needle = q.trim().toLowerCase();
  if (kind === 'terminal') {
    const places = Object.entries(PLACES).filter(([, p]) => !needle || p.name.toLowerCase().includes(needle));
    const terms = Object.entries(TERMINALS).filter(([, t]) => !needle || t.name.toLowerCase().includes(needle) || PLACES[t.place].name.toLowerCase().includes(needle));
    const placeOpts = ['forced', 'excluded'].includes(key) ? places.filter(([id]) => Object.values(TERMINALS).filter((t) => t.place === id).length > 1).map(([id, p]) => `<button type="button" class="tr-picker__opt" data-act="pick-place" data-key="${key}" data-val="${id}"><span>Ganzer Ort: ${esc(p.name)}</span><small>alle Terminals</small></button>`) : [];
    const termOpts = terms.map(([id, t]) => {
      const p = PLACES[t.place];
      return `<button type="button" class="tr-picker__opt" data-act="pick" data-key="${key}" data-val="${id}"><span>${esc(t.name)}</span><small>${p.kind} · ${p.system} · Gefahr ${dec(p.danger.m)} · Bugs ${dec(t.bugs.m)}</small></button>`;
    });
    return [...placeOpts, ...termOpts].join('') || '<div class="tr-hint" style="padding:8px">Keine Treffer. Signal verloren.</div>';
  }
  return COMMODITIES.filter((c) => !needle || c.name.toLowerCase().includes(needle)).map((c) => `<button type="button" class="tr-picker__opt" data-act="pick" data-key="${key}" data-val="${esc(c.name)}"><span>${esc(c.name)}</span><small>${c.cat}${c.warn ? ` · ⚠ ${c.warn}` : ''}${c.illegal ? ' · illegal' : ''}</small></button>`).join('') || '<div class="tr-hint" style="padding:8px">Keine Treffer.</div>';
}

/**
 * Summarises a field group in one line.
 * @param {string} g the group key
 * @returns {string} the summary
 */
function groupSummary(g) {
  const r = state.request;
  const n = (a) => (a.length ? a.join(', ') : '');
  switch (g) {
    case 'ships': return r.ships.map((s) => `${s.count > 1 ? `${s.count}× ` : ''}${s.type}`).join(' + ');
    case 'shape': return `bis ${r.maxStops} Stopps${r.roundTrip ? ', Rundreise' : ''}${r.start ? `, ab ${TERMINALS[r.start].name}` : ''}`;
    case 'objective': return { perHour: 'Gewinn pro Stunde', maxProfit: 'Höchster Gewinn', fastest: 'Am schnellsten' }[r.objective];
    case 'places': return [n(r.systems) || 'alle Systeme', r.refuel ? 'Tanken' : '', r.armistice ? 'Waffenstillstand' : ''].filter(Boolean).join(', ');
    case 'terminals': return `${r.forced.length} erzwungen, ${r.excluded.length} ausgeschlossen`;
    case 'jumps': return n(r.avoidConn) || 'keine';
    case 'goods': return [n(r.categories) || 'alle Kategorien', r.illegal ? 'illegal' : '', r.warning ? 'Warnwaren' : ''].filter(Boolean).join(', ');
    case 'data': return [r.probable ? 'nur wahrscheinlich' : '', r.dangerMax ? `Gefahr ≤ ${r.dangerMax}` : '', r.bugsMax ? `Bugs ≤ ${r.bugsMax}` : '', r.availMin ? `Verf. ≥ ${r.availMin} %` : ''].filter(Boolean).join(', ') || 'keine Schwellen';
    default: return '';
  }
}

/**
 * Renders variant A: request column on the left, alternatives as tabs and a vertical stop timeline.
 * @returns {string} markup
 */
function variantA() {
  const list = results();
  const sel = list[Math.min(state.sel, list.length - 1)];
  const aside = requestAside();
  const forMission = state.missionSearch ? `<div class="tr-warnline tr-warnline--info" role="status">${ic('info')}<span>Suche für die Einsatzroute „${esc(state.missionSearch.name)}“ im Einsatz „${esc(MISSION.name)}“: Schiffsliste ist die Routenflotte, Filter und Ziel kommen aus der Route. Der gespeicherte Plan bleibt, bis du ein Ergebnis übernimmst.</span></div>` : '';
  if (!sel) return `${pageHead()}<div class="tr-a">${aside}<section class="tr-a__result">${forMission}${statusBar()}<div class="empty-state">Die Suche läuft. Das erste Zwischenergebnis kommt nach dem 2-Stopp-Durchgang.</div></section></div>`;
  const tabs = list.map((r, i) => `<button class="tab ${r === sel ? 'active' : ''}" role="tab" aria-selected="${r === sel}" data-act="sel" data-val="${i}">${i === 0 ? 'Beste Route' : `Alternative ${i}`}<small>${fmt(r.perHour)} aUEC/h · ${fmtDur(r.duration)} · ${r.stops.length} Stopps</small></button>`).join('');
  const timeline = stopTimeline(sel);
  return `${pageHead()}<div class="tr-a">${aside}<section class="tr-a__result" aria-label="Ergebnis">
      ${forMission}${statusBar()}
      <div><div class="tab-nav tr-a__tabs" role="tablist">${tabs}</div>
      <div class="tr-a__routecard">
        <div class="tr-row tr-row--between"><div><div class="tr-stoptile__title">${esc(sel.name)}</div><div class="tr-hint">${sel.convoy ? `Konvoi · ${sel.ships.length} Schiffe` : esc(state.resultShips[0].name)}</div></div>${routeActions(sel)}</div>
        ${kpis(sel)}
        ${warnList(sel)}
        ${shipShares(sel)}
        ${timeline}
      </div></div>
    </section></div>`;
}

/**
 * Renders one assistant step of variant B.

 * @returns {string} markup
 */
function bStep(step) {
  const sec = (title, body) => `<div class="card"><h4 class="card-title">${title}</h4><div class="tr-stack">${body}</div></div>`;
  if (step === 0) return sec('Schiffe', `${fShips()}<button class="btn btn-ghost btn-xs" data-act="overheads" style="align-self:flex-start">Meine Stoppzeiten</button>`);
  if (step === 1) return `${sec('Route', fShape())}${sec('Ziel', fObjective())}`;
  if (step === 2) return `${sec('Orte', fPlaces())}${sec('Terminals', fTerminals())}${sec('Sprungpunkte', fJumps())}${sec('Waren', fGoods())}${sec('Daten & Bewertungen', fData())}`;
  const map = { ships: 0, shape: 1, objective: 1, places: 2, terminals: 2, jumps: 2, goods: 2, data: 2 };
  return sec('Prüfen', `<dl class="tr-b__review">${GROUPS.map(([k, label]) => `<dt>${label}</dt><dd>${esc(groupSummary(k))}</dd><dd><button class="btn btn-ghost btn-xs" data-act="b-step" data-val="${map[k]}">Ändern</button></dd>`).join('')}</dl>`);
}

/**
 * Renders a route as a compact card for comparison on phones and in variant C.
 * @param {object} r the computed route
 * @param {number} i its rank
 * @param {boolean} selected whether it is the chosen route
 * @returns {string} markup
 */
function routeCard(r, i, selected) {
  const o = state.request.objective;
  const flags = [r.legs.some((l) => l.detour) ? '<span class="tr-mark tr-mark--warn">Umleitung</span>' : '', r.estimated ? '<span class="tr-mark tr-mark--est">≈ geschätzt</span>' : '', r.stale ? '<span class="tr-mark tr-mark--warn">veraltete Preise</span>' : '', r.round ? '<span class="tr-mark tr-mark--muted">Rundreise</span>' : ''].join(' ');
  return `<button class="tr-c__card ${selected ? 'is-sel' : ''}" data-act="sel" data-val="${i}" aria-pressed="${selected}">
    <span class="tr-row tr-row--between"><span class="tr-cap">${i === 0 ? 'Beste Route' : `Alternative ${i}`}</span><span class="tr-hint">${r.stops.length} Stopps</span></span>
    <span class="tr-c__path">${r.stops.map((s) => esc(s.place.name)).join('<span class="sep">›</span>')}</span>
    <span class="tr-c__nums"><span class="${o === 'maxProfit' ? 'lead' : ''}">Gewinn<b>${fmt(r.profit)}</b></span><span class="${o === 'perHour' ? 'lead' : ''}">Pro h<b>${r.estimated ? '≈' : ''}${fmt(r.perHour)}</b></span><span class="${o === 'fastest' ? 'lead' : ''}">Dauer<b>${r.estimated ? '≈' : ''}${fmtDur(r.duration)}</b></span></span>
    <span class="tr-row">${flags}</span>
  </button>`;
}

/**
 * Renders variant B: a four-step assistant, then a comparison table and a horizontal route line.
 * @returns {string} markup
 */
function variantB() {
  const steps = `<div class="tr-b__steps" role="tablist">${B_STEPS.map((l, i) => `<button class="tr-b__step ${i === state.bStep ? 'is-current' : i < state.bStep ? 'is-done' : ''}" role="tab" aria-selected="${i === state.bStep}" data-act="b-step" data-val="${i}"><span>${i + 1}</span>${l}</button>`).join('')}</div>`;
  if (state.bView === 'form') {
    const last = state.bStep === B_STEPS.length - 1;
    return `${pageHead()}<div class="tr-b"><div class="tr-b__form">${steps}<div class="tr-stack">${bStep(state.bStep)}</div>
      <div class="tr-b__nav"><button class="btn btn-ghost" data-act="b-step" data-val="${state.bStep - 1}" ${state.bStep === 0 ? 'disabled' : ''}>${ic('arrow-left')} Zurück</button>
      <span class="tr-row">${state.results.length ? '<button class="btn btn-ghost" data-act="b-view" data-val="result">Zum letzten Ergebnis</button>' : ''}${last ? `<button class="btn btn--cta" data-act="compute">${ic('search')} Route berechnen</button>` : `<button class="btn btn--cta" data-act="b-step" data-val="${state.bStep + 1}">Weiter ${ic('arrow-right')}</button>`}</span></div></div></div>`;
  }
  const list = results();
  const sel = list[Math.min(state.sel, list.length - 1)];
  const head = `<div class="card tr-row tr-row--between" style="margin-bottom:12px"><div><div class="tr-cap">Anfrage</div><div class="tr-hint">${esc(GROUPS.slice(0, 3).map(([k]) => groupSummary(k)).join(' · '))} · ${activeFilters(state.request).length} Filter</div></div><button class="btn btn-ghost" data-act="b-view" data-val="form">${ic('edit')} Anfrage ändern</button></div>`;
  if (!sel) return `${pageHead()}<div class="tr-b">${head}${statusBar()}</div>`;
  const best = (f, dir) => list.reduce((a, b) => (dir * f(b) > dir * f(a) ? b : a));
  const row = (label, f, show, dir) => {
    const b = dir ? best(f, dir) : null;
    return `<tr><td>${label}</td>${list.map((r) => `<td class="${r === sel ? 'is-sel' : ''} ${r === b ? 'tr-best' : ''}">${show(r)}</td>`).join('')}</tr>`;
  };
  const table = `<div class="tr-b__compare-wrap card card--flush hud-scroll scroll-x"><table class="tr-b__compare"><thead><tr><th></th>${list.map((r, i) => `<th class="${r === sel ? 'is-sel' : ''}"><div class="tr-cap" style="color:var(--color-white)">${i === 0 ? 'Beste Route' : `Alternative ${i}`}</div><div class="tr-hint" style="font-weight:400;text-transform:none">${esc(r.name)}</div><button class="btn ${r === sel ? 'btn-outline' : 'btn-ghost'} btn-xs" data-act="sel" data-val="${i}" style="margin-top:6px">${r === sel ? 'Ausgewählt' : 'Anzeigen'}</button></th>`).join('')}</tr></thead><tbody>
    ${row('Gewinn', (r) => r.profit, (r) => fmt(r.profit), 1)}
    ${row('Pro Stunde', (r) => r.perHour, (r) => `${r.estimated ? '≈ ' : ''}${fmt(r.perHour)}`, 1)}
    ${row('Dauer', (r) => r.duration, (r) => `${r.estimated ? '≈ ' : ''}${fmtDur(r.duration)}`, -1)}
    ${row('Stopps', (r) => r.stops.length, (r) => `${r.stops.length}${r.round ? ' (Rundreise)' : ''}`, 0)}
    ${row('Kapital nötig', (r) => r.capital, (r) => fmt(r.capital), -1)}
    ${row('Bestand reicht', (r) => r.runs, (r) => `~${r.runs}×`, 1)}
    ${row('Datenstand', (r) => r.oldest, (r) => `${ageText(r.oldest)}${r.stale ? ' ⚠' : ''}`, -1)}
    ${row('Höchste Gefahr', (r) => Math.max(...r.stops.map((s) => s.place.danger.m)), (r) => dec(Math.max(...r.stops.map((s) => s.place.danger.m))), -1)}
    ${row('Umleitungen', (r) => r.legs.filter((l) => l.detour).length, (r) => r.legs.filter((l) => l.detour).length || '—', 0)}
    ${row('Hinweise', (r) => r.warnings.length, (r) => r.warnings.length, 0)}
  </tbody></table></div><div class="tr-b__cards">${list.map((r, i) => routeCard(r, i, r === sel)).join('')}</div>`;
  const stopIdx = Math.min(state.bStop, sel.stops.length - 1);
  const line = sel.stops.map((s, i) => {
    const leg = sel.legs[i];
    const legHtml = leg ? `<div class="tr-line__leg ${leg.detour ? 'tr-line__leg--detour' : ''}"><div class="tr-line__rail"></div><div>${leg.est.length ? '≈ ' : ''}${fmtShort(leg.dur)} · ${dec(leg.gm)} Gm</div>
      <div class="tr-hold" title="Laderaum auf der Etappe">${holdBars(sel, i)}</div><div class="tr-hint">${fmt(leg.aboard)} / ${fmt(leg.hold)} SCU</div>${leg.detour ? `<div class="warn-text">⚠ ${esc(leg.detour.text)}</div>` : ''}${leg.gateways ? `<div class="tr-hint">${leg.crossings} Sprung · ${esc(leg.gateways[0])} …</div>` : ''}</div>` : '';
    return `<button class="tr-line__stop ${i === stopIdx ? 'is-sel' : ''}" data-act="b-stop" data-val="${i}"><span class="tr-line__dot">${i + 1}</span><span><span class="tr-line__name">${esc(s.place.name)}</span><br><span class="tr-line__sys">${s.place.kind} · ${s.place.system}</span></span></button>${legHtml}`;
  }).join('');
  const s = sel.stops[stopIdx];
  const detail = `<div class="tr-b__detail"><div class="card"><div class="tr-stoptile__head"><div><div class="tr-stoptile__title">Stopp ${stopIdx + 1}: ${esc(s.term.name)}</div><div class="tr-stoptile__sub">${s.place.kind} · ${s.place.body} · ${s.place.system}</div></div>${stopEdit(s, sel)}</div><div class="tr-stack" style="margin-top:10px">${stopFacts(s)}${jobsTable(s, sel)}${shipLists(s, sel)}${stopTime(s)}<button class="btn btn-ghost btn-xs" data-act="edit" data-what="Stopp einfügen" style="align-self:flex-start">${ic('plus')} Stopp danach einfügen</button></div></div>
    <div class="tr-stack tr-b__side">${routeActions(sel).replace('tr-actions', 'tr-actions tr-stack')}${warnList(sel)}</div></div>`;
  return `${pageHead()}<div class="tr-b">${head}<div class="tr-stack">${statusBar()}${table}
    <div class="card"><h4 class="card-title">Route im Verlauf · Laderaum je Etappe</h4><div class="tr-line"><div class="tr-line__track">${line}</div></div></div>
    ${kpis(sel)}${shipShares(sel)}${detail}</div></div>`;
}

/**
 * Renders the cargo aboard a leg as stacked bars per commodity.
 * @param {object} r the computed route
 * @param {number} legIdx the leg
 * @returns {string} markup
 */
function holdBars(r, legIdx) {
  const aboard = {};
  r.stops.slice(0, legIdx + 1).forEach((s) => s.jobs.forEach((j) => { aboard[j.c] = (aboard[j.c] || 0) + (j.side === 'buy' ? j.qty : -j.qty); }));
  const hold = r.legs[legIdx].hold;
  return Object.entries(aboard).filter(([, q]) => q > 0).map(([c, q]) => `<i style="width:${(q / hold) * 100}%" title="${esc(c)}: ${fmt(q)} SCU"></i>`).join('');
}

/**
 * Renders variant C: a compact request bar with a filter drawer, route cards and a cargo-plan matrix.
 * @returns {string} markup
 */
function variantC() {
  const r = state.request;
  const filters = activeFilters(r);
  const bar = `<div class="tr-c__bar" role="search">
    <div class="tr-field"><span class="tr-cap">Schiffe</span><button class="btn btn-ghost tr-c__shipbtn" data-act="drawer" data-val="ships">${esc(groupSummary('ships'))}</button></div>
    <div class="tr-field" style="min-width:auto"><span class="tr-cap">Stopps bis</span><div class="krt-segmented" role="group">${[2, 3, 4, 5].map((n) => `<button type="button" class="krt-segmented__item" data-act="set" data-key="maxStops" data-val="${n}" aria-pressed="${r.maxStops === n}">${n}</button>`).join('')}</div></div>
    <div class="tr-field" style="min-width:auto;justify-content:flex-end">${sw('roundTrip', 'Rundreise')}</div>
    <div class="tr-field"><label for="c-obj">Ziel</label><select id="c-obj" data-bind="objective"><option value="perHour" ${r.objective === 'perHour' ? 'selected' : ''}>Gewinn pro Stunde</option><option value="maxProfit" ${r.objective === 'maxProfit' ? 'selected' : ''}>Höchster Gewinn</option><option value="fastest" ${r.objective === 'fastest' ? 'selected' : ''}>Am schnellsten</option></select></div>
    <div class="tr-field" style="min-width:auto"><span class="tr-cap">&nbsp;</span><button class="btn btn-ghost ${filters.length ? 'is-filtered' : ''}" data-act="drawer" data-val="all">${ic('filter')} Filter${filters.length ? ` <span class="filter-count">${filters.length}</span>` : ''}</button></div>
    <div class="tr-field" style="min-width:auto;margin-left:auto"><span class="tr-cap">&nbsp;</span><button class="btn btn--cta" data-act="compute">${ic('search')} Berechnen</button></div>
  </div>
  <div class="tr-c__chips">${filters.map((f) => `<span class="filter-chip">${esc(f.label)}<button class="filter-chip__remove" data-act="chip-remove" data-key="${f.key}" data-val="${esc(f.val)}" aria-label="Filter entfernen">×</button></span>`).join('')}</div>`;
  const list = results();
  const sel = list[Math.min(state.sel, list.length - 1)];
  if (!sel) return `${pageHead()}${bar}${statusBar()}`;
  const commodities = [...new Set(sel.stops.flatMap((s) => s.jobs.map((j) => j.c)))];
  const head = sel.stops.map((s, i) => `<th><div class="tr-row tr-row--between" style="flex-wrap:nowrap"><span>${i + 1} · ${esc(s.place.name)}</span>${stopEdit(s, sel)}</div><small>${esc(s.term.name)} · ${s.place.kind} · ${s.place.system}</small><div class="tr-stoptile__meta" style="margin-top:6px">${rateChip('Gefahr', s.place.danger, MIN_RATERS.danger)}${rateChip('Bugs', s.term.bugs, MIN_RATERS.bugs)}</div><div class="tr-row" style="margin-top:6px"><span class="tr-sym">${esc(s.mode)}</span>${s.forced ? '<span class="tr-mark tr-mark--forced">erzwungen</span>' : ''}</div></th>`).join('');
  const body = commodities.map((c) => {
    let aboard = 0;
    const cells = sel.stops.map((s) => {
      const js = s.jobs.filter((j) => j.c === c);
      if (!js.length) return `<td>${aboard > 0 ? `<span class="cell-hold">bleibt an Bord · ${fmt(aboard)}</span>` : ''}</td>`;
      return `<td>${js.map((j) => {
        aboard += j.side === 'buy' ? j.qty : -j.qty;
        const sold = state.soldOut[j.key];
        const marks = [j.side === 'sell' && j.demand === null ? '<span class="tr-mark tr-mark--est">Nachfrage ?</span>' : '', j.age > 168 ? '<span class="tr-mark tr-mark--warn">veraltet</span>' : '', sold ? '<span class="tr-mark tr-mark--danger">ausverkauft</span>' : ''].join(' ');
        return `<div class="${j.side === 'buy' ? 'cell-buy' : 'cell-sell'}">${j.side === 'buy' ? '+' : '−'}${fmt(j.qty)} SCU</div><small>${j.side === 'buy' ? 'Kauf' : 'Verkauf'} à ${fmt(j.p)} · ${ageText(j.age)}</small>${sel.convoy ? `<small>${j.shares.map((q, i) => `${esc(sel.ships[i].short)} ${fmt(q)}`).join(' · ')}</small>` : ''}<div>${availChip(j)}</div>${marks ? `<div>${marks}</div>` : ''}${j.side === 'buy' ? `<button class="btn btn-ghost btn-xs" style="margin-top:4px" data-act="soldout" data-key="${j.key}" data-route="${sel.id}" data-stop="${s.si}">${sold ? 'Aufheben' : 'Ausverkauft'}</button>` : ''}`;
      }).join('')}</td>`;
    }).join('');
    const info = COMMODITIES.find((x) => x.name === c) || {};
    return `<tr><td><span class="tr-cname">${esc(c)}</span>${info.warn ? `<small class="warn-text">⚠ ${esc(info.warn)}</small>` : ''}<small>${info.cat || ''}</small></td>${cells}</tr>`;
  }).join('');
  const foot = `<tr><td>Stoppzeit</td>${sel.stops.map((s) => `<td>${fmtShort(s.dur)}${s.fee ? `<small>Gebühr ${fmt(s.fee)} aUEC</small>` : ''}${s.surcharge ? `<small>inkl. Konvoi-Aufschlag</small>` : ''}</td>`).join('')}</tr>`;
  const legs = sel.legs.map((l, i) => `<div class="tr-c__leg ${l.detour ? 'tr-c__leg--detour' : ''}"><div class="tr-cap">Etappe ${i + 1}: ${esc(sel.stops[i].place.name)} → ${esc(sel.stops[i + 1].place.name)}</div>${legFacts(l, false)}</div>`).join('');
  return `${pageHead()}${bar}<div class="tr-stack">${statusBar()}
    <div class="tr-c__cards">${list.map((x, i) => routeCard(x, i, x === sel)).join('')}</div>
    <div class="tr-row tr-row--between"><div><div class="tr-stoptile__title">${esc(sel.name)}</div><div class="tr-hint">Kapital nötig ${fmt(sel.capital)} aUEC · Bestand reicht ~${sel.runs}× · Datenstand ${ageText(sel.oldest)}${sel.convoy ? ` · Konvoi ${sel.ships.length} Schiffe` : ''}</div></div>${routeActions(sel)}</div>
    ${warnList(sel)}
    <div><div class="tr-cap" style="margin-bottom:6px">Frachtplan</div><div class="tr-matrix-wrap"><table class="tr-matrix"><thead><tr><th>Ware</th>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    <div class="tr-row" style="margin-top:8px"><button class="btn btn-ghost btn-xs" data-act="edit" data-what="Stopp einfügen">${ic('plus')} Stopp einfügen</button><button class="btn btn-ghost btn-xs" data-act="edit" data-what="Stopps umordnen">${ic('swap')} Stopps umordnen</button></div></div>
    ${shipShares(sel)}
    <div class="tr-c__legs">${legs}</div>
  </div>
  ${state.drawer ? drawer() : ''}`;
}

    <div class="tr-drawer__foot"><button class="btn btn-ghost" data-act="reset">${ic('filter-off')} Zurücksetzen</button><button class="btn btn--cta" data-act="compute">${ic('search')} Übernehmen und berechnen</button></div></aside>`;

/** PROTOTYPE opened routes: a saved, unit or shared route recomputed on current data, with its deviations. */

/**
 * Computes the opened route of a source against its snapshot.
 * @param {string} src saved, unit or shared
 * @returns {{o: object, old: object, now: object}} the source, the snapshot and the recomputation
 */
function openedRoute(src) {
  const o = OPEN_SOURCES[src];
  const ships = src === 'saved' && !state.hangarGone ? [{ ...SHIP_C2 }] : o.ships;
  const old = computeRoute(ROUTES.find((x) => x.id === o.old), ships);
  const now = computeRoute(ROUTES.find((x) => x.id === o.now), ships);
  now.compared = true;
  now.frozen = false;
  pageRoutes[now.id] = now;
  return { o, old, now };
}

/**
 * Collects the deviations of a recomputed route against its snapshot.
 * @param {object} now the recomputed route
 * @returns {{hard: Array<string>, price: Array<string>, info: Array<string>}} hard deviations, price changes from 10 % and notes
 */
function deviations(now) {
  const hard = [];
  const price = [];
  const info = [];
  const side = (j) => (j.side === 'buy' ? 'Kauf' : 'Verkauf');
  if (state.hangarGone && state.routeSrc === 'saved') hard.push('Schiff: Das Hangarschiff „Lastesel“ gibt es nicht mehr. Gerechnet mit dem Typ Crusader C2 Hercules.');
  now.stops.forEach((s) => {
    const at = `Stopp ${s.si + 1} · ${s.term.name}`;
    s.gone.forEach((g) => hard.push(`${at}: ${g.c} (${side(g)}) ${g.gone}`));
    s.jobs.forEach((j) => {
      if (j.dev && j.dev.reason) hard.push(`${at}: ${j.c} (${side(j)}) ${j.dev.reason}: ${fmt(j.qty)} statt ${fmt(j.dev.wasQty)} SCU`);
      if (j.age > 360) hard.push(`${at}: Preis für ${j.c} abgelaufen (${ageText(j.age)})`);
      else if (j.age > 168) hard.push(`${at}: Preis für ${j.c} veraltet (${ageText(j.age)})`);
      if (j.dev && j.dev.was && Math.abs((j.p - j.dev.was) / j.dev.was) >= 0.1) price.push(`${at}: ${j.c} (${side(j)}) ${fmt(j.dev.was)} → ${fmt(j.p)} aUEC/SCU, ${pctChange(j.p, j.dev.was)}`);
      if (j.neu) info.push(`${at}: ${j.c} (${side(j)}) neu im Plan`);
    });
  });
  return { hard, price, info };
}

/**
 * Renders profit, duration and aUEC/h of the snapshot beside the recomputation.
 * @param {object} old the snapshot
 * @param {object} now the recomputation
 * @param {string} caption what the snapshot is
 * @returns {string} markup
 */
function compareStrip(old, now, caption) {
  const tile = (k, o, n, show, up) => {
    const d = ((n - o) / o) * 100;
    const good = up ? d > 0 : d < 0;
    const cls = Math.abs(d) < 0.05 ? '' : good ? 'pos' : 'neg';
    return `<div class="tr-kpi"><div class="tr-kpi__k">${k}</div><div class="tr-kpi__v">${show(n)}</div><div class="tr-kpi__s">vorher ${show(o)} · <span class="${cls}">${show(n - o, true)} · ${pctChange(n, o)}</span></div></div>`;
  };
  const money = (v, signed) => `${signed && v > 0 ? '+' : signed && v < 0 ? '−' : ''}${fmt(Math.abs(v))}`;
  const time = (v, signed) => `${signed && v > 0 ? '+' : signed && v < 0 ? '−' : ''}${fmtDur(Math.abs(v))}`;
  return `<div class="tr-compare"><div class="tr-cap">${esc(caption)}</div><div class="tr-compare__tiles">
    ${tile('Gewinn', old.profit, now.profit, money, true)}
    ${tile('Dauer', old.duration, now.duration, time, false)}
    ${tile('Pro Stunde', old.perHour, now.perHour, money, true)}
  </div></div>`;
}

/**
 * Renders the deviation box: hard deviations, price changes from 10 % and notes.
 * @param {object} now the recomputed route
 * @returns {string} markup
 */
function devBox(now) {
  const d = deviations(now);
  if (!d.hard.length && !d.price.length && !d.info.length) return `<div class="tr-warnline tr-warnline--ok">${ic('check')}<span>Keine Abweichungen gegenüber der Momentaufnahme.</span></div>`;
  const block = (title, list, cls, icon) => (list.length ? `<div class="tr-devgroup"><div class="tr-cap">${title} (${list.length})</div>${list.map((t) => `<div class="tr-warnline ${cls}">${ic(icon)}<span>${esc(t)}</span></div>`).join('')}</div>` : '');
  return `<div class="tr-devbox">
    ${block('Harte Abweichungen', d.hard, 'tr-warnline--danger', 'warning')}
    ${block('Preise ab 10 % geändert', d.price, '', 'warning')}
    ${block('Hinweise', d.info, 'tr-warnline--info', 'info')}
    <div class="tr-hint">Kleinere Preisänderungen stehen nur als Zahl an der Frachtzeile.</div>
  </div>`;
}

/**
 * Whether the viewer may write back the opened unit route.
 * @returns {boolean} true for its contributor, officers and mission managers of its unit
 */
function mayEditUnitRoute() {
  return state.role === 'officer';
}

/**
 * Renders the actions of an opened route for its source and edit state.
 * @param {string} src saved, unit or shared
 * @param {object} now the recomputed route
 * @returns {string} markup
 */
function openedActions(src, now) {
  const fly = (cls) => `<button class="btn ${cls}" data-act="fly" data-route="${now.id}">${ic('arrow-right')} Losfliegen</button>`;
  const mine = (cls) => `<button class="btn ${cls}" data-act="save-copy">${ic('save')} Als meine Route speichern</button>`;
  const myShip = '<button class="btn btn-ghost" data-act="my-ship">Mit meinem Schiff berechnen</button>';
  const toUnit = `<button class="btn btn-ghost" data-act="to-unit">${ic('users')} Für Einheit</button>`;
  const share = `<button class="btn btn-ghost" data-act="share" data-route="${now.id}">Teilen</button>`;
  let main = '';
  let more = '';
  if (src === 'saved') {
    main = state.edited
      ? `<button class="btn btn--cta" data-act="saved-update">${ic('save')} Gespeicherte Route aktualisieren</button><button class="btn btn-ghost" data-act="save-new">Als neue speichern</button>${fly('btn-outline')}`
      : `${fly('btn--cta')}${share}${toUnit}`;
    more = `<button class="btn btn-ghost btn-xs" data-act="research">${ic('search')} Mit diesen Einstellungen neu suchen</button><button class="btn btn-ghost btn-xs" data-act="pin-optimise">Mit festen Stopps optimieren</button>`;
  } else if (src === 'unit') {
    if (state.edited && mayEditUnitRoute()) main = `<button class="btn btn--cta" data-act="unit-update">${ic('save')} Einheitsroute aktualisieren</button>${mine('btn-ghost')}`;
    else if (state.edited) main = `${mine('btn--cta')}<span class="tr-hint">Zurückschreiben dürfen nur Vagabund (eingetragen), Offiziere und Einsatzleiter von ALPHA.</span>`;
    else main = `${fly('btn--cta')}${mine('btn-ghost')}${myShip}${share}`;
  } else {
    main = `${mine('btn--cta')}${fly('btn-outline')}<button class="btn btn-ghost" data-act="edit-in-planner">${ic('edit')} Im Planer bearbeiten</button>${myShip}${toUnit}`;
  }
  return `<div class="tr-actions">${main}</div>${more ? `<div class="tr-actions">${more}</div>` : ''}`;
}

/**
 * Renders the result side of an opened route: status, comparison, deviations, figures and timeline.
 * @param {string} src saved, unit or shared
 * @returns {string} markup
 */
function openedResult(src) {
  const { o, old, now } = openedRoute(src);
  const after = {
    saved: 'Die Momentaufnahme steht jetzt auf diesem Stand; das nächste Öffnen vergleicht hiermit.',
    unit: 'Nichts wird zurückgeschrieben. Die Momentaufnahme der Einheit ändert nur „Einheitsroute aktualisieren“.',
    shared: 'Eingefrorene Kopie: verglichen wird mit dem Stand beim Teilen, nichts wird zurückgeschrieben.',
  }[src];
  const edited = state.edited ? `<div class="tr-warnline tr-warnline--info">${ic('edit')}<span>Bearbeitet: Stopps geändert. Die ${src === 'unit' ? 'Einheitsroute' : 'gespeicherte Route'} bleibt, bis du sie aktualisierst.</span></div>` : '';
  return `<div class="tr-status" role="status">${ic('check')}<span>Fracht auf den ${src === 'shared' ? 'geteilten' : 'gespeicherten'} Stopps neu geplant · schnelle Spur · 0,8 s · Datenstand 14:00 Uhr</span><span class="muted">${after}</span></div>
    ${edited}
    ${compareStrip(old, now, `Vergleich mit der Momentaufnahme vom ${o.since}`)}
    ${devBox(now)}
    <div class="tr-a__routecard tr-routecard--open">
      <div class="tr-row tr-row--between"><div><div class="tr-stoptile__title">${esc(o.name)}</div><div class="tr-hint">${esc(now.name)}</div><div class="tr-hint">${esc(state.hangarGone && src === 'saved' ? 'Crusader C2 Hercules (Typ, statt Hangarschiff)' : (src === 'saved' ? SHIP_C2.name : 'Crusader C2 Hercules (Typ)'))}</div></div></div>

}

/**

  const note = `<p class="proto-note"><strong>PROTOTYP</strong> · Geöffnete ${o.label} · ${inPlanner ? 'Alternative A: eigene Route öffnet im Planer' : 'Alternative B: jede Route öffnet auf einer eigenen Routenseite'} · Bearbeiten (↑, ↓, Entfernen) setzt den Zustand „bearbeitet“.</p>`;

}

/** PROTOTYPE mission routes: a mission's routes tab with order, route fleet, binding plan, deviations and a crew's part. */

const MISSION_ROUTE_LIMIT = 10;
const MY_UNIT = 'ALPHA';

/**
 * Computes a mission route's stored plan and its recomputation on current data.
 * @param {object} mr the mission route
 * @returns {{plan: object, now: object}} the binding plan and the fresh computation
 */
function missionRoute(mr) {
  const fleet = mr.fleet.map((k) => FLEET_SHIPS[k]).filter(Boolean);
  const ships = fleet.length ? fleet : [{ ...SHIP_C2_TYPE }];
  const plan = computeRoute(ROUTES.find((x) => x.id === mr.base), ships);
  const now = computeRoute(ROUTES.find((x) => x.id === mr.now), ships);
  plan.frozen = true;
  now.compared = true;
  pageRoutes[plan.id] = plan;
  return { plan, now };
}

/**

 * @param {object} mr the mission route

 */
function fleetPanel(mr) {
  const manager = state.missionRole === 'manager';

    const why = !u.ship ? 'kein Schiff' : !u.cargo ? 'kein Frachtschiff' : '';
    const box = `<input type="checkbox" ${inFleet ? 'checked' : ''} ${!manager || why ? 'disabled' : ''} data-act="fleet-toggle" data-route="${mr.id}" data-val="${u.key}" aria-label="${u.key} trägt Fracht">`;
    const fields = inFleet
      ? `<td class="num">${manager ? '<input type="number" value="1500000" style="width:8rem">' : '1.500.000'}</td><td class="num">${manager ? '<input type="number" value="0" style="width:5rem">' : '0'}</td><td>${manager ? `<select>${DRIVES.map((d) => `<option>${d}</option>`).join('')}</select>` : 'Standard des Typs'}</td>`
      : `<td colspan="3" class="tr-hint">${why || 'nicht in dieser Routenflotte'}</td>`;
    return `<tr class="${inFleet ? '' : 'is-off'}"><td>${box}</td><td><span class="squadron-badge">${u.key}</span></td><td>${ship}</td>${fields}</tr>`;
  }).join('');
  const note = mr.fleetNote ? `<div class="tr-warnline tr-warnline--danger">${ic('warning')}<span>Flotte geändert: ${esc(mr.fleetNote)}. Nichts neu gerechnet, bis ein Einsatzleiter die Flotte übernimmt.</span></div>` : '';

  return `<div class="card card--inset tr-fleet"><div class="tr-row tr-row--between"><div class="tr-cap">Routenflotte</div>${manager ? '<span class="tr-hint">Vorausgewählt: Einheiten mit Frachtschiff und Quantum-Antrieb</span>' : ''}</div>
    ${note}${none}
    <div class="hud-scroll scroll-x"><table class="tr-jobs"><thead><tr><th></th><th>Einheit</th><th>Schiff</th><th class="num">Startkapital</th><th class="num">Reserve SCU</th><th>Antrieb</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${manager ? `<div class="tr-row"><button class="btn btn-outline btn-xs" data-act="fleet-apply" data-route="${mr.id}">${ic('check')} Flotte übernehmen</button><span class="tr-hint">Plant die Fracht auf den Stopps neu, speichert den Plan und benachrichtigt die Crews.</span></div>` : ''}
  </div>`;
}

/**
 * Renders one mission route as a tile with its expandable plan.
 * @param {object} mr the mission route
 * @param {number} i its position in the mission's route order
 * @param {number} count the number of routes
 * @returns {string} markup
 */
function missionTile(mr, i, count) {
  const { plan, now } = missionRoute(mr);
  const manager = state.missionRole === 'manager';
  const open = state.missionOpen.includes(mr.id);
  const mineIdx = state.missionRole === 'crew' ? mr.fleet.indexOf(MY_UNIT) : -1;
  const fleet = mr.fleet.length ? mr.fleet.map((k) => `<span class="tr-fleetchip ${k === MY_UNIT && state.missionRole === 'crew' ? 'is-mine' : ''}"><span class="squadron-badge">${k}</span>${esc(k === 'ALPHA' ? 'C2 Hercules „Lastesel“' : 'Drake Caterpillar (Typ)')}</span>`).join('') : '<span class="tr-hint">Schiffsliste der Quelle</span>';
  const marks = mr.marks.map((m) => `<span class="tr-mark tr-mark--${m.kind}">${esc(m.text)}</span>`).join(' ');
  const order = manager ? `<span class="tr-iconbtns">${rowBtn('m-up', 'chevron-up', 'Nach oben', '', `data-val="${i}" ${i === 0 ? 'disabled' : ''}`)}${rowBtn('m-down', 'chevron-down', 'Nach unten', '', `data-val="${i}" ${i === count - 1 ? 'disabled' : ''}`)}</span>` : '';
  const head = `<div class="tr-mroute__head">
      <span class="tr-mroute__n">${i + 1}</span>
      <div class="tr-mroute__title"><div class="tr-stoptile__title">${esc(mr.name)}</div><div class="tr-hint">${esc(plan.name)}</div><div class="tr-row" style="margin-top:6px">${fleet}</div></div>
      <div class="tr-mroute__nums"><span>Gewinn<b>${fmt(plan.profit)}</b></span><span>Dauer<b>${fmtDur(plan.duration)}</b></span><span>aUEC/h<b>${fmt(plan.perHour)}</b></span></div>
      <div class="tr-mroute__side"><div class="tr-row">${marks}</div><div class="tr-row">${order}<button class="btn btn-ghost btn-xs" data-act="m-open" data-val="${mr.id}" aria-expanded="${open}">${open ? 'Plan ausblenden' : 'Plan anzeigen'}</button></div></div>
    </div>`;
  if (!open) return `<article class="tr-mroute">${head}</article>`;
  const deviates = mr.marks.some((m) => m.kind !== 'muted');
  const adopt = manager
    ? `<button class="btn btn-outline btn-xs" data-act="m-adopt" data-val="${mr.id}">${ic('check')} Route aktualisieren</button><span class="tr-hint">übernimmt die Neuberechnung und benachrichtigt die Crews der Flotte</span>`
    : '<span class="tr-hint">Ein Einsatzleiter entscheidet, ob der Plan aktualisiert wird. Bis dahin gilt der gespeicherte Plan.</span>';
  const copyOut = `<div class="tr-actions">
      ${mineIdx >= 0 ? `<button class="btn btn--cta" data-act="fly-part" data-route="${plan.id}" data-ship="${mineIdx}">${ic('arrow-right')} Losfliegen (mein Teil)</button>` : `<button class="btn btn-outline" data-act="fly" data-route="${plan.id}">${ic('arrow-right')} Losfliegen</button>`}
      <button class="btn btn-ghost" data-act="save-copy">${ic('save')} Als meine Route speichern</button>
      <button class="btn btn-ghost" data-act="to-unit">${ic('users')} Für Einheit</button>
      <button class="btn btn-ghost" data-act="share" data-route="${plan.id}">Teilen</button>
    </div>`;
  const managerTools = manager ? `<div class="tr-actions"><button class="btn btn-ghost btn-xs" data-act="m-optimise" data-val="${mr.id}">${ic('search')} Für die Flotte optimieren</button><button class="btn btn-quiet-danger btn-xs" data-act="confirm-m-remove" data-val="${mr.id}">${ic('trash')} Aus dem Einsatz entfernen</button></div>` : '';
  return `<article class="tr-mroute is-open">${head}<div class="tr-mroute__body">
      ${deviates ? `${compareStrip(plan, now, 'Gespeicherter Plan (Briefing) gegenüber einer Neuberechnung auf aktuellen Daten')}${devBox(now)}<div class="tr-row">${adopt}</div>` : `<div class="tr-warnline tr-warnline--ok">${ic('check')}<span>Keine Abweichungen: der gespeicherte Plan gilt.</span></div>`}
      ${fleetPanel(mr)}
      ${routeOverheads()}
      ${copyOut}
      ${kpis(plan)}
      ${shipShares(plan)}
      ${stopTimeline(plan, { edit: manager, insert: manager, mine: mineIdx })}
      ${managerTools}
    </div></article>`;
}

/**
 * Renders the crew's part: the routes their unit flies in order, with its cargo per stop and the transfer legs.
 * @returns {string} markup
 */
function myPart() {
  const chain = state.missionRoutes.filter((mr) => mr.fleet.includes(MY_UNIT));
  if (!chain.length) return '<div class="empty-state"><div class="empty-title">Kein Teil</div><div class="empty-text">Deine Einheit ist in keiner Routenflotte dieses Einsatzes.</div></div>';
  let total = 0;
  const parts = chain.map((mr, ci) => {
    const { plan } = missionRoute(mr);
    const idx = mr.fleet.indexOf(MY_UNIT);
    total += plan.duration;
    const stops = plan.stops.map((s) => {
      const jobs = s.jobs.filter((j) => (plan.convoy ? j.shares[idx] : j.qty) > 0).map((j) => `<span class="${j.side === 'buy' ? 'neg' : 'pos'}">${j.side === 'buy' ? 'Kauf' : 'Verkauf'} ${fmt(plan.convoy ? j.shares[idx] : j.qty)} ${esc(j.c)}</span>`).join(' · ');
      return `<li><b>${esc(s.term.name)}</b><div class="tr-hint">${jobs || 'fliegt mit, lädt nichts'}</div></li>`;
    }).join('');
    const transfer = ci < chain.length - 1 ? (() => { total += TRANSFER.dur; return `<div class="tr-transfer">${ic('arrow-right')}<span><strong>Leerflug</strong> ${esc(TRANSFER.from)} → ${esc(TRANSFER.to)} · ≈ ${fmtShort(TRANSFER.dur)} · ${dec(TRANSFER.gm)} Gm · mit dem Antrieb deiner C2</span></div>`; })() : '';
    const pos = state.missionRoutes.indexOf(mr) + 1;
    return `<div class="tr-chain__route"><div class="tr-row tr-row--between"><div><span class="tr-cap">Route ${pos}</span> <strong>${esc(mr.name)}</strong> <span class="tr-hint">${fmtDur(plan.duration)}${plan.convoy ? ` · im Konvoi mit ${plan.ships.length - 1} Schiff` : ''}</span></div><button class="btn btn-ghost btn-xs" data-act="fly-part" data-route="${plan.id}" data-ship="${idx}">${ic('arrow-right')} Losfliegen</button></div><ol class="tr-chain__stops">${stops}</ol></div>${transfer}`;
  }).join('');
  return `<section class="card card--accent tr-chain"><div class="tr-row tr-row--between"><h4 class="card-title">Dein Teil · <span class="squadron-badge">${MY_UNIT}</span> C2 Hercules „Lastesel“</h4><span class="tr-hint">Kette ${fmtDur(total)} · ${chain.length} Routen in Einsatz-Reihenfolge</span></div>${parts}
    <div class="tr-hint">Nur Information: die Kette wird nicht optimiert, die nächste Route muss nicht dort beginnen, wo die letzte endet.</div></section>`;
}

/**
 * Renders the mission page with its routes tab.

 */
function missionPage() {
  const manager = state.missionRole === 'manager';
  const crew = state.missionRole === 'crew';
  const list = state.missionRoutes;
  const head = `<div class="page-head"><div class="page-head__main"><a class="page-eyebrow" href="#" data-act="followup" data-what="Einsätze">${ic('arrow-left')}<span>Einsätze</span></a><div class="page-title"><h1>${esc(MISSION.name)}</h1><span class="squadron-badge">ALP</span><span class="status-badge status-planned">Geplant</span></div></div>
      <div class="page-actions">${manager ? `<button class="btn btn-ghost">${ic('edit')} Bearbeiten</button>` : ''}<button class="btn btn--cta">${ic('user-plus')} Anmelden</button></div></div>
    <div class="facts-bar"><span class="fact"><span class="fact-k">TS</span> <span class="fact-v">20:00</span></span><span class="fact"><span class="fact-k">Server-Join</span> <span class="fact-v">20:15</span></span><span class="fact"><span class="fact-k">Ende</span> <span class="fact-v">23:30</span></span><span class="fact"><span class="fact-k">Treffpunkt</span> <span class="fact-v">Seraphim Station</span></span><span class="fact"><span class="fact-k">Leiter</span> <span class="fact-v">Nachtfalke</span></span><span class="fact"><span class="fact-k">Teilnehmer</span> <span class="fact-v">9 · 0 eingecheckt</span></span></div>
    <div class="tab-nav" role="tablist"><button class="tab" data-act="followup" data-what="Übersicht des Einsatzes">Übersicht</button><button class="tab" data-act="followup" data-what="Teilnehmer & Einheiten">Teilnehmer &amp; Einheiten <span class="tab-count">0/9</span></button><button class="tab" data-act="followup" data-what="Finanzen & Auszahlung">Finanzen &amp; Auszahlung</button><button class="tab active" aria-selected="true">Routen <span class="tab-count">${list.length}</span></button></div>`;
  const note = `<p class="proto-note"><strong>PROTOTYP</strong> · Ansicht als ${{ manager: 'Einsatzleiter', crew: `Crew von ${MY_UNIT} (${ME})`, reader: 'Mitglied ohne Rolle im Einsatz' }[state.missionRole]} · ${state.missionAlt === 'top' ? 'Alternative A: „Dein Teil“ steht über den Routen' : 'Alternative B: Umschalter „Alle Routen | Mein Teil“'}.</p>`;
  const toolbar = `<div class="tr-row tr-row--between"><div><div class="tr-cap">Routen des Einsatzes</div><span class="tr-hint">${list.length} von ${MISSION_ROUTE_LIMIT} · Reihenfolge von Hand. Der gespeicherte Plan ist das Briefing und sieht für alle gleich aus.</span></div>${manager ? `<button class="btn btn-outline" data-act="add-route">${ic('plus')} Route hinzufügen</button>` : ''}</div>`;
  const tiles = list.length ? list.map((mr, i) => missionTile(mr, i, list.length)).join('') : `<div class="empty-state"><div class="empty-title">Keine Routen</div><div class="empty-text">${manager ? 'Füge eine gespeicherte, eine Einheits- oder eine geteilte Route hinzu oder suche eine neue für die Flotte.' : 'Dieser Einsatz hat keine Handelsrouten.'}</div></div>`;
  let body = `${toolbar}${tiles}`;
  if (crew && state.missionAlt === 'top') body = `${myPart()}${body}`;
  if (crew && state.missionAlt === 'switch') {
    const seg = `<div class="krt-segmented" role="group"><button type="button" class="krt-segmented__item" data-act="m-view" data-val="all" aria-pressed="${state.missionView === 'all'}">Alle Routen</button><button type="button" class="krt-segmented__item" data-act="m-view" data-val="mine" aria-pressed="${state.missionView === 'mine'}">Mein Teil</button></div>`;
    body = `${seg}${state.missionView === 'mine' ? myPart() : body}`;
  }
  return `${head}${note}<div class="tr-stack tr-tabbody">${body}<span class="tr-hint">Eine Operation zeigt die Routen ihrer verknüpften Einsätze nur lesend.</span></div>`;
}

/** PROTOTYPE stop ratings: the list of places, a place's detail with distributions and reset, and "My reports". */

/**
 * Renders a distribution over the steps of a scale as bars.
 * @param {Array<number>} shares the weighted share per step in percent
 * @param {Array<string>} labels the step labels
 * @returns {string} markup
 */
function distBars(shares, labels) {
  return `<div class="tr-dist">${shares.map((p, i) => `<div class="tr-dist__row"><span class="tr-dist__k">${i + 1} · ${labels[i]}</span><span class="tr-dist__bar"><i style="width:${p}%"></i></span><span class="tr-dist__v num">${p} %</span></div>`).join('')}</div>`;
}

/**
 * Renders the three availability shares as one stacked bar.
 * @param {Array<number>} shares as shown, less, nothing, in percent
 * @returns {string} markup
 */
function availBar(shares) {
  return `<span class="tr-availbar" title="${AVAIL_STEPS.map((l, i) => `${l}: ${shares[i]} %`).join(' · ')}">${shares.map((p, i) => `<i class="s${i}" style="width:${p}%"></i>`).join('')}</span>`;
}

/**
 * Lists the terminals of a place.
 * @param {string} place the place id
 * @returns {Array<[string, object]>} terminal ids and terminals
 */
function terminalsOf(place) {
  return Object.entries(TERMINALS).filter(([, t]) => t.place === place);
}

/**
 * Renders the admin reset button for one object and scale.
 * @param {string} what the object and scale in words
 * @param {number} count the number of reports it removes
 * @returns {string} markup
 */
function resetBtn(what, count) {
  return state.role === 'admin' ? `<button class="btn btn-quiet-danger btn-xs" data-act="confirm-reset" data-what="${esc(what)}" data-val="${count}">${ic('reset')} Zurücksetzen</button>` : '';
}

/**
 * Renders the list of places with danger and their terminals with bugs.
 * @returns {string} markup
 */
function placesTab() {
  const f = state.ratingFilter;
  const worst = (id) => Math.max(...terminalsOf(id).map(([, t]) => t.bugs.m));
  let places = Object.entries(PLACES).filter(([, p]) => (!f.systems.length || f.systems.includes(p.system)) && (!f.kinds.length || f.kinds.includes(p.kind)));
  const key = { name: ([, p]) => p.name, danger: ([, p]) => -p.danger.m, bugs: ([id]) => -worst(id) }[f.sort];
  places = places.sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0));
  const sortTh = (k, label, cls) => `<th class="${cls || ''}" aria-sort="${f.sort === k ? 'descending' : 'none'}"><button type="button" class="sort-header" data-act="rating-sort" data-val="${k}">${label} <span class="sort-header__mark" aria-hidden="true"></span></button></th>`;
  const rows = places.map(([id, p]) => `<tr>
      <td><a class="row-link" href="#" data-act="go-place" data-val="${id}"><span class="cell-title">${esc(p.name)}</span><span class="cell-sub">${p.kind} · ${p.body} · ${p.system}</span></a></td>
      <td data-label="Gefahr">${rateChip('Gefahr', p.danger, MIN_RATERS.danger)}</td>
      <td class="cell-block" data-label="Terminals"><div class="tr-termlist">${terminalsOf(id).map(([, t]) => `<div><span>${esc(t.name)}</span> ${rateChip('Bugs', t.bugs, MIN_RATERS.bugs)}</div>`).join('')}</div></td>
      <td class="cell-actions"><svg class="krt-icon row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"></use></svg></td>
    </tr>`).join('');
  const tg = (key2, values) => `<div class="tr-toggles" role="group">${values.map((v) => `<button type="button" class="tr-toggle" data-act="rating-filter" data-key="${key2}" data-val="${esc(v)}" aria-pressed="${f[key2].includes(v)}">${esc(v)}</button>`).join('')}</div>`;
  return `<div class="tr-ratingfilter"><div class="tr-field"><span class="tr-cap">System</span>${tg('systems', SYSTEMS)}</div><div class="tr-field"><span class="tr-cap">Ortsart</span>${tg('kinds', KINDS.slice(0, 3))}</div></div>
    <span class="tr-hint">Anonym und organisationsweit. Ältere Meldungen zählen weniger (Halbwertszeit Gefahr 14, Bugs 30, Verfügbarkeit 7 Tage); jedes Mitglied zählt einmal. Unter 3 / 3 / 2 Meldern steht „wenige Meldungen“ und keine Schwelle greift.</span>
    <div class="card card--flush"><table class="data-table data-table--stack"><thead><tr>${sortTh('name', 'Ort')}${sortTh('danger', 'Gefahr')}${sortTh('bugs', 'Terminals · Bugs')}<th class="cell-actions"><span class="visually-hidden">Öffnen</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/**

function ratingsPage() {

/**
 * Renders a place's detail: danger with its distribution, each terminal's bugs and availability.
 * @returns {string} markup
 */
function placePage() {
  const id = state.place;
  const p = PLACES[id];
  const dist = DISTRIBUTION.danger[id] || [20, 40, 30, 10, 0];
  const terms = terminalsOf(id).map(([tid, t]) => {
    const avail = AVAILABILITY[tid] || [];
    const rows = avail.map((a) => {
      const few = a.n < MIN_RATERS.avail;
      return `<tr><td><span class="tr-cname">${esc(a.c)}</span></td><td><span class="tr-side tr-side--${a.side}">${a.side === 'buy' ? 'Kauf · Bestand' : 'Verkauf · Nachfrage'}</span></td>
        <td class="num"><b>${a.pct} %</b>${few ? ' <span class="tr-mark tr-mark--muted">wenige Meldungen</span>' : ''}</td><td>${availBar(a.shares)}</td><td class="tr-hint nowrap">${a.n} Melder · vor ${a.d} T.</td>
        <td class="num"><span class="tr-iconbtns"><button class="btn btn-ghost btn-xs" data-act="place-rate" data-key="avail" data-what="${esc(`${a.c} · ${a.side === 'buy' ? 'Kauf' : 'Verkauf'} · ${t.name}`)}">Melden</button>${resetBtn(`Verfügbarkeit ${a.c} (${a.side === 'buy' ? 'Kauf' : 'Verkauf'}) an ${t.name}`, a.n + 2)}</span></td></tr>`;
    }).join('');
    const table = rows ? `<div class="hud-scroll scroll-x"><table class="tr-jobs tr-jobs--avail"><thead><tr><th>Ware</th><th>Seite</th><th class="num">Zuverlässigkeit</th><th>wie angezeigt · weniger · nichts</th><th>Melder</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<span class="tr-hint">Noch keine Verfügbarkeitsmeldungen an diesem Terminal.</span>';
    return `<section class="card"><div class="card-head"><h3 class="card-title">${esc(t.name)}</h3></div>
      <div class="tr-place__grid"><div class="tr-stack" style="gap:8px"><div class="tr-row tr-row--between">${rateChip('Bugs', t.bugs, MIN_RATERS.bugs)}<span class="tr-row"><button class="btn btn-ghost btn-xs" data-act="place-rate" data-key="bugs" data-what="${esc(t.name)}">Bugs melden</button>${resetBtn(`Bugs an ${t.name}`, t.bugs.n + 3)}</span></div>${distBars(DISTRIBUTION.bugs, BUG_STEPS)}</div>
      <div class="tr-stack" style="gap:8px"><div class="tr-row tr-row--between"><span class="tr-cap">Verfügbarkeit je Ware und Seite</span><button class="btn btn-ghost btn-xs" data-act="place-rate" data-key="avail" data-what="${esc(t.name)}">Verfügbarkeit melden</button></div>${table}</div></div></section>`;
  }).join('');
  return `<div class="page-head"><div class="page-head__main"><a class="page-eyebrow" href="#" data-act="go" data-page="ratings">${ic('arrow-left')}<span>Stoppbewertungen</span></a><div class="page-title"><h1>${esc(p.name)}</h1></div></div></div>
    <div class="facts-bar"><span class="fact"><span class="fact-k">Ortsart</span> <span class="fact-v">${p.kind}</span></span><span class="fact"><span class="fact-k">Ort</span> <span class="fact-v">${p.body} · ${p.system}</span></span><span class="fact"><span class="fact-k">Waffenstillstand</span> <span class="fact-v">${p.armistice ? 'ja' : 'nein'}</span></span><span class="fact"><span class="fact-k">Überwacht</span> <span class="fact-v">${p.monitored ? 'ja' : 'nein'}</span></span></div>
    <p class="proto-note"><strong>PROTOTYP</strong> · Ansicht als ${state.role === 'admin' ? 'Admin: „Zurücksetzen“ je Objekt und Skala' : 'Mitglied'}. Verteilungen sind gewichtete Anteile der Melder, nicht Köpfe.</p>
    <div class="tr-stack tr-tabbody">
      <section class="card"><div class="card-head"><h3 class="card-title">Gefahr am Ort</h3></div>
        <div class="tr-place__grid"><div class="tr-stack" style="gap:8px"><div class="tr-row tr-row--between">${rateChip('Gefahr', p.danger, MIN_RATERS.danger)}<span class="tr-row"><button class="btn btn-ghost btn-xs" data-act="place-rate" data-key="danger" data-what="${esc(p.name)}">Gefahr melden</button>${resetBtn(`Gefahr an ${p.name}`, p.danger.n + 4)}</span></div>
        <span class="tr-hint">Gilt für alle Terminals dieses Orts. Deine letzte Meldung: 2 · gering, vor 3 Tagen.</span></div>${distBars(dist, DANGER_STEPS)}</div></section>
      ${terms}
    </div>`;
}

/** PROTOTYPE switch: the admin page of traderoutes.enabled and what members see while it is off. */

/**

function adminPage() {

/** PROTOTYPE wiring of the surfaces beside the planner: pages, actions, dialogs and the prototype bar. */

const PAGES = {
  planner: 'Routenplaner',
  routes: 'Routen (Listen)',
  route: 'Geöffnete Route',
  mission: 'Einsatz · Routen',
  ratings: 'Stoppbewertungen',
  place: 'Ort mit Bewertungen',
  admin: 'Admin · Schalter',
  off: 'Schalter aus',
};

/**
 * Switches to a page and resets the working states that belong to the page left.
 * @param {string} page a key of PAGES
 * @returns {void}
 */
function goPage(page) {
  if (page !== 'planner') state.missionSearch = null;
  state.page = page;
  state.edited = false;
  state.modal = null;
  state.flight = null;
  window.scrollTo(0, 0);
}

/**
 * Asks for confirmation before a destructive action.
 * @param {string} title the question
 * @param {string} text the consequence
 * @param {string} ok the label of the confirming button
 * @param {string} act the action run on confirmation
 * @param {string} val the value handed to that action
 * @returns {void}
 */
function confirmFirst(title, text, ok, act, val) {
  state.modal = { kind: 'confirm', title, text, ok, act, val };
}

/**
 * Reads the share code typed into a field, without separators and in upper case.
 * @param {string} id the input id
 * @returns {string} the normalised code
 */
function typedCode(id) {
  const el = document.getElementById(id);
  return (el ? el.value : '').replace(/[^0-9a-z]/gi, '').toUpperCase();
}

/**
 * Renders the dialogs of the surfaces; the planner's own dialogs stay in modal().
 * @param {object} m the open dialog
 * @param {function(string, string, string, boolean): string} shell the dialog frame
 * @returns {string} markup, or an empty string for a dialog of the planner
 */
function surfaceModal(m, shell) {
  const cancel = '<button class="btn btn-ghost" data-act="modal-close">Abbrechen</button>';
  if (m.kind === 'confirm') {
    return `<div class="krt-confirm-overlay" data-act="modal-scrim"><div class="krt-confirm-dialog" role="alertdialog" aria-modal="true"><h3 class="krt-confirm-title">${esc(m.title)}</h3><p class="krt-confirm-message">${esc(m.text)}</p><div class="krt-confirm-actions"><button class="btn btn-secondary" type="button" data-act="modal-close">Abbrechen</button><button class="btn btn-danger" type="button" data-act="confirm-ok">${esc(m.ok)}</button></div></div></div>`;
  }
  if (m.kind === 'rename') {
    return shell(`${m.what} umbenennen`, `<div class="tr-field"><label for="m-rn">Name</label><input id="m-rn" type="text" maxlength="80" value="Abendrunde Crusader – ArcCorp"></div><div class="tr-field"><label for="m-rnote">Notiz</label><textarea id="m-rnote" rows="3" maxlength="500">Stims nur, wenn Seraphim mehr als 300 SCU hat.</textarea></div><span class="tr-hint">Ändert nur Name und Notiz; kollidiert nicht mit einer gleichzeitigen Aktualisierung des Inhalts.</span>`, `${cancel}<button class="btn btn--cta" data-act="modal-ok" data-val="Name und Notiz gespeichert">${ic('save')} Speichern</button>`);
  }
  if (m.kind === 'to-unit') {
    return shell('In eine Einheit speichern', `<div class="tr-field"><label for="m-unit">Einheit</label><select id="m-unit">${MY_UNITS.map((u) => `<option>${u.label} · ${u.used} von ${UNIT_LIMIT}</option>`).join('')}</select><span class="tr-hint">Einheiten, in denen du Mitglied bist oder die du als Offizier erreichst. Später nicht änderbar.</span></div><div class="tr-field"><label for="m-uname">Name</label><input id="m-uname" type="text" maxlength="80" value="Seraphim › Area18 › Baijini Point"></div><div class="tr-field"><label for="m-unote">Notiz <span class="tr-hint">sehen alle in der Einheit</span></label><textarea id="m-unote" rows="2" maxlength="500"></textarea></div><span class="tr-hint">Die Einheit bekommt eine unabhängige Kopie; Hangarschiffe werden zu Typen. Du bleibst als „eingetragen von“ sichtbar und kannst sie ändern, solange du Mitglied bist.</span>`, `${cancel}<button class="btn btn--cta" data-act="to-unit-confirm">${ic('users')} In Einheit speichern</button>`);
  }
  if (m.kind === 'my-ship') {
    const opts = [['C2 Hercules „Lastesel“', 'Hangarschiff · 696 SCU'], ['Freelancer MAX „Kiste“', 'Hangarschiff · 120 SCU'], ['Katalogtyp wählen …', 'beliebiger Frachttyp']];
    return shell('Mit meinem Schiff berechnen', `<span class="tr-hint">Plant die Fracht auf denselben Stopps für dein Schiff neu. Die Route selbst bleibt unverändert.</span><div class="tr-stack" style="gap:6px">${opts.map(([n, s], i) => `<label class="tr-radio"><input type="radio" name="m-ship" ${i === 0 ? 'checked' : ''}> <span><strong>${n}</strong> <span class="tr-hint">${s}</span></span></label>`).join('')}</div>`, `${cancel}<button class="btn btn--cta" data-act="my-ship-confirm">${ic('search')} Neu planen</button>`);
  }
  if (m.kind === 'add-route') {
    const src = [['saved', 'Aus meinen gespeicherten Routen'], ['unit', 'Aus den Einheitsrouten'], ['code', 'Geteilte Route per Code'], ['search', 'Neue Suche für die Flotte']];
    const pick = { saved: `<select>${SAVED_ROUTES.map((s) => `<option>${esc(s.name)}</option>`).join('')}</select>`, unit: `<select>${UNIT_ROUTES.map((s) => `<option>${esc(s.name)} · ${s.unit}</option>`).join('')}</select>`, code: '<input type="text" placeholder="z. B. K7Q2-M9XA-P3">', search: '<span class="tr-hint">Öffnet den Routenplaner mit den Einheiten des Einsatzes als Schiffsliste; „In den Einsatz übernehmen“ legt die Route an.</span>' }[m.from];
    return shell('Route hinzufügen', `<div class="tr-scale" role="group">${src.map(([k, l]) => `<button type="button" class="tr-toggle" data-act="add-route-from" data-val="${k}" aria-pressed="${m.from === k}">${l}</button>`).join('')}</div><div class="tr-field">${pick}</div><span class="tr-hint">Der Einsatz bekommt eine unabhängige Kopie mit den Stoppzeiten der Quelle. Danach wählst du die Routenflotte. 3 von ${MISSION_ROUTE_LIMIT}.</span>`, `${cancel}<button class="btn btn--cta" data-act="add-route-confirm">${ic('plus')} Hinzufügen</button>`, true);
  }
  if (m.kind === 'place-rate') {
    const scale = (key, labels) => `<div class="tr-scale" role="group">${labels.map((l, i) => `<button type="button" class="tr-toggle" data-act="rate-val" data-key="${key}" data-val="${i + 1}" aria-pressed="${m.vals[key] === i + 1}">${key === 'avail' ? l : `${i + 1} · ${l}`}</button>`).join('')}</div>`;
    let body = '';
    if (m.key === 'danger') body = `<div class="tr-field"><span class="tr-cap">Gefahr am Ort ${esc(m.what)}</span>${scale('danger', DANGER_STEPS)}</div>`;
    if (m.key === 'bugs') body = `<div class="tr-field"><span class="tr-cap">Bugs am Terminal ${esc(m.what)}</span>${scale('bugs', BUG_STEPS)}</div>`;
    if (m.key === 'avail') body = `<div class="tr-grid2"><div class="tr-field"><label for="m-ac">Ware</label><select id="m-ac">${COMMODITIES.slice(0, 8).map((c) => `<option>${esc(c.name)}</option>`).join('')}</select></div><div class="tr-field"><span class="tr-cap">Seite</span><div class="krt-segmented" role="group"><button type="button" class="krt-segmented__item" data-act="rate-val" data-key="side" data-val="1" aria-pressed="${m.vals.side !== 2}">Kauf · Bestand</button><button type="button" class="krt-segmented__item" data-act="rate-val" data-key="side" data-val="2" aria-pressed="${m.vals.side === 2}">Verkauf · Nachfrage</button></div></div></div><div class="tr-field"><span class="tr-cap">Wie hast du es vorgefunden?</span>${scale('avail', AVAIL_STEPS)}</div>`;
    return shell('Melden', `<div class="tr-hint">Anonym und organisationsweit; sichtbar sind nur Durchschnitte. Eine zweite Meldung am selben Tag ersetzt die erste.</div>${body}`, `${cancel}<button class="btn btn--cta" data-act="place-rate-send">Melden</button>`, true);
  }
  return '';
}

/**
 * Renders the prototype bar's controls for the current page.
 * @returns {string} markup
 */
function surfaceBarControls() {
  const btn = (act, val, label, on) => `<button data-act="${act}" data-val="${val}" aria-pressed="${on}">${label}</button>`;
  const sep = '<span class="proto-bar__sep"></span>';
  const select = `<select class="proto-bar__page" data-proto-page aria-label="Fläche">${Object.entries(PAGES).map(([k, l]) => `<option value="${k}" ${state.page === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  let extra = '';
  if (state.page === 'route') {

  }

/**
 * Renders the flight view for following a route stop by stop.
 * @returns {string} markup
 */
function flightView() {
  const f = state.flight;
  const r = routeById(f.route);
  if (!r) return '';
  const stop = r.stops[f.idx];
  const qty = (j) => (r.convoy && f.ship >= 0 ? j.shares[f.ship] : j.qty);
  const shipSel = r.convoy ? `<div class="tr-field"><span class="tr-cap">Ansicht für</span><div class="tr-fly__shipsel">${[-1, ...r.ships.map((_, i) => i)].map((i) => `<button class="tr-toggle" data-act="fly-ship" data-val="${i}" aria-pressed="${f.ship === i}">${i < 0 ? 'Ganzer Konvoi' : esc(r.ships[i].label)}</button>`).join('')}</div></div>` : '';
  let main = '';
  let foot = '';
  if (f.phase === 'stop') {
    const jobs = [...stop.jobs].sort((a, b) => (a.side === b.side ? 0 : a.side === 'sell' ? -1 : 1)).filter((j) => qty(j) > 0);
    const open = jobs.filter((j) => !f.done[j.key]).length;
    main = `<div class="tr-fly__next"><div class="tr-fly__eyebrow">Stopp ${f.idx + 1} von ${r.stops.length} · ${stop.place.kind} · ${stop.place.system}</div>
      <div class="tr-fly__big">${esc(stop.term.name)}</div>
      ${stopFacts(stop)}
      <div class="tr-stack" style="gap:8px">${jobs.map((j) => {
        const sold = state.soldOut[j.key];
        return `<div class="tr-fly__job ${f.done[j.key] ? 'is-done' : ''} ${sold ? 'is-soldout' : ''}"><label><input type="checkbox" data-act="fly-job" data-key="${j.key}" ${f.done[j.key] ? 'checked' : ''}><span><span class="tr-side tr-side--${j.side}" style="font-weight:900;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:${j.side === 'buy' ? 'var(--color-danger-text)' : 'var(--color-success-text)'}">${j.side === 'buy' ? 'Kaufen' : 'Verkaufen'}</span><br><strong style="color:var(--color-white)">${fmt(qty(j))} SCU ${esc(j.c)}</strong> <span class="tr-hint">à ${fmt(j.p)} aUEC${j.side === 'sell' && j.demand === null ? ' · Nachfrage unbekannt' : ''}</span></span></label>${j.side === 'buy' ? `<button class="btn ${sold ? 'btn-outline' : 'btn-ghost'} btn-xs" data-act="soldout" data-key="${j.key}" data-route="${r.id}" data-stop="${stop.si}">${sold ? 'Alternativen' : 'Ausverkauft'}</button>` : ''}</div>`;
      }).join('')}</div>
      ${stopTime(stop)}
      <button class="btn btn-ghost btn-xs" data-act="rate" data-route="${r.id}" data-stop="${stop.si}" style="align-self:flex-start">Stopp bewerten</button></div>`;
    const last = f.idx === r.stops.length - 1;
    foot = `<button class="btn btn--cta" data-act="fly-next">${ic('check')} ${last ? 'Route abschließen' : 'Stopp erledigt'}${open ? ` (${open} offen)` : ''}</button>`;
  } else if (f.phase === 'leg') {
    const leg = r.legs[f.idx];
    const next = r.stops[f.idx + 1];
    main = `<div class="tr-fly__next"><div class="tr-fly__eyebrow">Etappe ${f.idx + 1} von ${r.legs.length}</div>
      <div class="tr-fly__big">Fliege zu ${esc(next.term.name)}</div>
      <div><strong>${leg.est.length ? '≈ ' : ''}${fmtShort(leg.dur)}</strong> · ${dec(leg.gm)} Gm · an Bord ${fmt(leg.aboard)} SCU${leg.est.length ? ` <span class="tr-mark tr-mark--est">≈ geschätzt</span>` : ''}</div>
      ${leg.detour ? `<div class="tr-fly__detour">⚠ ${esc(leg.detour.text)}<div class="tr-hint" style="color:inherit;font-weight:400">Die Navigation im Spiel plottet den kürzeren Weg. +${fmtDur(leg.detour.extra)}</div></div>` : ''}
      ${leg.gateways ? `<ol class="ablauf">${[...leg.gateways, next.place.name].map((g) => `<li class="step"><span class="step-num"></span><span class="step-body"><span class="step-title">${esc(g)}</span></span></li>`).join('')}</ol>` : ''}
    </div>`;
    foot = `<button class="btn btn-ghost" data-act="fly-back">${ic('arrow-left')} Zurück</button><button class="btn btn--cta" data-act="fly-next">${ic('map-pin')} Angekommen</button>`;
  } else {
    main = `<div class="tr-fly__next"><div class="tr-fly__eyebrow">Fertig</div><div class="tr-fly__big">Route abgeschlossen</div><div>Gewinn laut Plan <strong class="pos">+${fmt(r.profit)} aUEC</strong> in ${fmtDur(r.duration)}.</div><span class="tr-hint">Stimmte etwas nicht? Bewerte die Stopps, damit die nächste Crew es weiß.</span></div>`;
    foot = `<button class="btn btn-ghost" data-act="fly-restart">Nochmal fliegen</button><button class="btn btn--cta" data-act="fly-close">Schließen</button>`;
  }
  const later = f.phase === 'done' ? '' : `<div class="card"><h4 class="card-title">Danach</h4>${r.stops.slice(f.idx + 1).map((s) => `<div class="tr-row tr-row--between" style="padding:6px 0;border-top:1px solid var(--color-gray-3)"><span>${s.si + 1} · ${esc(s.term.name)}</span><span class="tr-hint">${s.jobs.map((j) => `${j.side === 'buy' ? 'Kauf' : 'Verkauf'} ${esc(j.c)}`).join(', ')}</span></div>`).join('') || '<span class="tr-hint">Letzter Stopp.</span>'}</div>`;
  return `<div class="tr-fly" role="dialog" aria-modal="true" aria-label="Flugansicht"><div class="tr-fly__inner">
    <div class="tr-fly__head"><div><div class="tr-fly__eyebrow">Flugansicht</div><h1>${esc(r.name)}</h1></div><button class="btn btn-ghost" data-act="fly-close">${ic('close')} Schließen</button></div>
    <div class="tr-fly__progress" aria-hidden="true">${r.stops.map((_, i) => `<i class="${f.phase === 'done' || i < f.idx ? 'is-done' : i === f.idx ? 'is-now' : ''}"></i>`).join('')}</div>
    <p class="proto-note"><strong>Offen:</strong> Der Fortschritt soll am Server liegen und auf allen Geräten gleich sein; wie, entscheidet ein eigenes Ticket. Im Prototyp lebt er nur im Speicher.</p>
    ${shipSel}${main}${later}</div><div class="tr-fly__foot">${foot}</div></div>`;
}

/**

function modal() {

  const own = surfaceModal(m, shell);

  }

  }
  if (m.kind === 'rate') {

    const avail = s.jobs.map((j) => `<div class="tr-field"><span class="tr-cap">${esc(j.c)} · ${j.side === 'buy' ? 'Bestand' : 'Nachfrage'}</span><div class="tr-scale" role="group">${['wie angezeigt oder mehr', 'weniger', 'nichts da'].map((l, i) => `<button type="button" class="tr-toggle" data-act="rate-val" data-key="avail:${j.key}" data-val="${i + 1}" aria-pressed="${m.vals[`avail:${j.key}`] === i + 1}">${l}</button>`).join('')}</div></div>`).join('');
    return shell(`Stopp bewerten`, `<div class="tr-hint">${esc(s.term.name)} · Meldungen sind anonym und zählen organisationsweit; sichtbar sind nur Durchschnitte. Eine zweite Meldung am selben Tag ersetzt die erste.</div>
      <div class="tr-field"><span class="tr-cap">Gefahr am Ort ${esc(s.place.name)}</span>${scale('danger', ['sicher', 'gering', 'mittel', 'hoch', 'sehr hoch'])}</div>
      <div class="tr-field"><span class="tr-cap">Bugs am Terminal</span>${scale('bugs', ['läuft', 'selten', 'häufig', 'meistens', 'unbrauchbar'])}</div>
      <div class="tr-cap">Verfügbarkeit, wie du sie vorgefunden hast</div>${avail}`, `${cancel}<button class="btn btn--cta" data-act="rate-send">Melden</button>`, true);
  }
  if (m.kind === 'soldout') {
    return shell('Als ausverkauft markiert', `<div>${esc(m.c)} bei ${esc(m.term)} ist für <strong>deine</strong> Route als ausverkauft markiert. Die Markierung wird nicht geteilt.</div>
      <div class="card card--inset"><div class="tr-cap">Verfügbarkeit melden?</div><div class="tr-hint" style="margin:4px 0 8px">Vorbelegt mit „nichts da“. Anonym, hilft der nächsten Crew.</div><button class="btn btn-ghost btn-xs" data-act="soldout-report">Melden: nichts da</button></div>
      <button class="btn btn-outline" data-act="edit" data-what="Alternative Waren an diesem Stopp">Alternative Waren anzeigen</button>`, '<button class="btn btn-ghost" data-act="modal-close">Schließen</button>');
  }
  if (m.kind === 'overheads') {
    return shell('Meine Stoppzeiten', `<span class="tr-hint">Gelten für alle deine Berechnungen, auch über Clients. Am Server gespeichert.</span><table class="tr-jobs"><thead><tr><th>Ortsart</th><th class="num">Grundzeit (min)</th><th class="num">Konvoi-Aufschlag je Schiff (min)</th></tr></thead><tbody>${KINDS.map((k) => `<tr><td>${k}</td><td class="num"><input type="number" min="0" value="${OVERHEADS[k]}" style="width:5rem"></td><td class="num"><input type="number" min="0" value="${SURCHARGE[k] / 60}" style="width:5rem"></td></tr>`).join('')}</tbody></table>`, `<button class="btn btn-ghost" data-act="modal-close">Standard</button><button class="btn btn--cta" data-act="modal-ok" data-val="Stoppzeiten gespeichert">${ic('save')} Speichern</button>`, true);

  }
  return '';
}

/** PROTOTYPE app: in-memory state, rendering, events and the simulated route search. */

const state = {

  bStep: 0,
  bView: 'form',
  bStop: 0,
  drawer: '',
  flight: null,
  modal: null,
  toast: null,
  saved: [],

  showState: false,
  newPrices: params.get('open') === 'new-prices',

  missionView: 'all',
