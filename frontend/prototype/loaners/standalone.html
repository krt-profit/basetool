    return `<tr><td><span class="cell-title">„${esc(t.text)}"</span><span class="cell-sub">${t.kind === 'ship' ? 'Schiff (gewährt)' : 'Loaner'}${t.group ? ' · gruppierte Form' : ''}</span></td><td>${mapping}</td><td class="cell-status">${textState(t)}</td><td class="cell-actions">${actions}</td></tr>`;
  }).join('');
  return `<section class="card ln-card card--flush-body"><div class="card-head"><h2 class="card-title">Texte <span class="count-badge count-badge--sm">${TEXTS.length}</span></h2></div>
    <div class="toolbar"><div class="toolbar__search">${icon('search')}<input type="search" data-input="text-search" value="${esc(MATRIX.textSearch)}" placeholder="Text oder Schiffstyp suchen" aria-label="Texte suchen"></div>
    ${segmented('textFilter', [['all', 'Alle'], ['open', 'Offen', count('open')], ['confirmed', 'Bestätigt', count('confirmed')], ['ignored', 'Ignoriert', count('ignored')], ['resting', 'Ruht', count('resting')]], MATRIX.textFilter, 'Status')}</div>
    <div class="table-responsive"><table class="data-table ln-table"><thead><tr><th>Text im Artikel</th><th>Schiffstyp</th><th class="cell-status">Status</th><th class="cell-actions"><span class="visually-hidden">Aktion</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

/**
 * Renders the pairs per granting type with the three-state override.
 * @returns {string}
 */
function pairsCard() {
  const granting = Object.keys(PAIRS).sort((a, b) => typeSortKey(a).localeCompare(typeSortKey(b)));
  const g = MATRIX.granting;
  const list = granting.map((k) => `<button type="button" class="master-row${k === g ? ' is-active' : ''}" data-act="granting" data-key="${k}"><span class="cell-title">${esc(typeLabel(k))}</span> ${typeChip(k)}<span class="cell-sub">${grantsOf(k).length} Loaner wirksam${PAIRS[k].some((p) => p.flag) ? ' · Hinweis' : ''}</span></button>`).join('');
  const rows = (PAIRS[g] || []).map((p, i) => {
    const state = p.source === 'own' ? 'grant' : p.source === 'off' ? 'deny' : 'auto';
    const src = p.source === 'own' ? '<span class="chip chip--primary">Eigener Eintrag</span>' : p.source === 'off' ? '<span class="chip chip--muted">Abgeschaltet</span>' : '<span class="chip">Artikel</span>';
    const flags = [
      p.flag === 'covered' ? '<span class="chip chip--info" title="Die angewendete Revision gewährt das Paar inzwischen selbst">Artikel deckt ab · Eintrag kann weg</span>' : '',
      p.flag === 'resting' ? '<span class="chip chip--danger" title="Der Loaner-Typ ist nicht flugbereit">Ruht · Typ nicht flugbereit</span>' : '',
      g === 'pioneer' && p.loaner === 'carrack' ? '<span class="chip chip--warning" title="Die wartende Revision enthält das Paar nicht mehr">Greift nach der wartenden Revision nicht mehr</span>' : '',
    ].join(' ');
    const seg = segmented(`ov-${g}-${i}`, [['auto', 'Automatisch'], ['grant', 'Gewähren'], ['deny', 'Nicht gewähren']], state, 'Einstellung');
    return `<tr><td><span class="cell-title">${esc(typeLabel(p.loaner))}</span> ${flags}</td><td>${src}</td><td class="ln-ov">${seg}</td></tr>`;
  }).join('');
  return `<section class="card ln-card"><div class="card-head"><h2 class="card-title">Paare je gewährendem Typ</h2></div>
    <p class="ln-section-hint">Automatisch: der Artikel entscheidet. Gewähren: euer eigener Eintrag. Nicht gewähren: ein Artikelpaar abgeschaltet. Jede Änderung wirkt sofort und wird protokolliert.</p>
    <div class="master-detail ln-md"><div class="master-list ln-master">${list}</div>
    <div class="detail-pane"><h3 class="ln-detail-title">${esc(typeLabel(g))} ${typeChip(g)}</h3>
      <div class="table-responsive"><table class="data-table ln-table"><thead><tr><th>Loaner</th><th>Quelle</th><th>Einstellung</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="ln-add-pair"><select aria-label="Loaner-Typ">${Object.keys(TYPES).filter((k) => TYPES[k].kind === 'flight' && !(PAIRS[g] || []).some((p) => p.loaner === k)).map((k) => `<option value="${k}">${esc(typeLabel(k))}</option>`).join('')}</select>
      <button type="button" class="btn btn-outline btn-xs" data-act="add-pair">${icon('plus')} <span>Loaner gewähren</span></button></div>
    </div></div></section>`;
}

/**
 * Renders the revision history with the rollback action.
 * @returns {string}
 */
function historyCard() {
  const rows = REVISIONS.map((r) => {
    const state = r.state === 'pending' ? '<span class="status-pill status-pill--warning">Wartet</span>' : r.state === 'applied' ? '<span class="status-pill status-pill--success">Angewendet</span>' : '<span class="status-pill">Früher angewendet</span>';
    const action = r.state === 'kept' ? `<button type="button" class="btn btn-ghost btn-xs" data-act="rollback" data-id="${r.id}">${icon('reset')} Diese Revision anwenden</button>` : '';
    return `<tr><td><span class="cell-title">Stand ${esc(r.stamp)}</span><span class="cell-sub">gelesen ${esc(r.read)}${r.applied ? ` · angewendet ${esc(r.applied)}` : ''}</span></td><td class="num">${r.rows}</td><td class="cell-status">${state}</td><td class="cell-actions">${action}</td></tr>`;
  }).join('');
  return `<section class="card ln-card"><div class="card-head"><h2 class="card-title">Revisionsverlauf</h2></div>
    <div class="table-responsive"><table class="data-table ln-table"><thead><tr><th>Revision</th><th class="num">Zeilen</th><th class="cell-status">Status</th><th class="cell-actions"><span class="visually-hidden">Aktion</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

/**
 * Returns the banner shown while a revision waits.
 * @returns {string}
 */
function matrixBanner() {
  const open = TEXTS.filter((t) => t.state === 'open').length;
  const pending = REVISIONS.find((r) => r.state === 'pending');
  if (!pending || !open) return '';
  return `<div class="alert alert-warning ln-banner">${icon('warning')}<span><strong>Loaner-Matrix wartet.</strong> Die Revision vom ${esc(pending.stamp)} braucht ${open} Bestätigungen. Bis dahin gilt die angewendete Revision.</span></div>`;
}

/**
 * Renders the admin page „Loaner-Matrix".
 * @param {{layout: string}} o A one page of stacked sections, B tabs
 * @returns {string}
 */
function renderMatrix(o) {
  const head = pageHead({ eyebrow: 'Stammdaten', title: 'Loaner-Matrix', actions: `<a href="#" class="btn btn-ghost" data-go="shipdata">${icon('list')} <span>Schiffsdaten</span></a><button type="button" class="btn btn-ghost" data-act="read-now">${icon('download')} <span>Jetzt lesen</span></button>` });
  if (o.layout === 'B') {
    const open = TEXTS.filter((t) => t.state === 'open').length;
    const tabs = `<nav class="tab-nav" aria-label="Loaner-Matrix">${[['revisions', 'Revisionen', open], ['texts', 'Texte', TEXTS.length], ['pairs', 'Paare', Object.keys(PAIRS).length]].map(([k, l, n]) => `<a href="#" class="tab${MATRIX.tab === k ? ' active' : ''}" data-act="mtab" data-tab="${k}"><span>${l}</span><span class="tab-count">${n}</span></a>`).join('')}</nav>`;
    const body = MATRIX.tab === 'texts' ? textsCard() : MATRIX.tab === 'pairs' ? pairsCard() : `${pendingCard()}${appliedCard()}${historyCard()}`;
    return `${head}${matrixBanner()}${tabs}<div class="ln-stack">${body}</div>`;
  }
  return `${head}${matrixBanner()}<div class="ln-stack">${pendingCard()}${appliedCard()}${textsCard()}${pairsCard()}${historyCard()}</div>`;
}

/**
 * Applies the pending revision once every text is resolved.
 */
function applyPendingIfComplete() {
  if (TEXTS.some((t) => t.state === 'open')) return;
  const pending = REVISIONS.find((r) => r.state === 'pending');
  if (!pending) return;
  for (const r of REVISIONS) if (r.state === 'applied') r.state = 'kept';
  pending.state = 'applied';
  pending.applied = '24.11.2026 · automatisch nach der letzten Bestätigung';
  toast(`Revision vom ${pending.stamp} angewendet: 2 Mitglieder, +1 Loaner, −0 Loaner.`);
}

/**
 * Handles the matrix page's clicks and inputs.
 * @param {Event} ev
 * @returns {boolean} whether the page needs a re-render
 */
function matrixEvent(ev) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'input' && t instanceof HTMLInputElement && t.dataset.input === 'text-search') { MATRIX.textSearch = t.value; return true; }
  if (ev.type === 'change' && t instanceof HTMLInputElement) {
    if (t.name === 'textFilter') { MATRIX.textFilter = t.value; return true; }
    if (t.dataset.pick) { const id = Number(t.dataset.pick); if (t.checked) MATRIX.selected.add(id); else MATRIX.selected.delete(id); return true; }
    if (t.name.startsWith('ov-')) {
      const [, g, i] = t.name.split('-');
      const p = PAIRS[g][Number(i)];
      if (t.value === 'grant' && p.source === 'article') { toast('Abgelehnt: der Artikel gewährt dieses Paar schon.', 'info'); return true; }
      p.source = t.value === 'grant' ? 'own' : t.value === 'deny' ? 'off' : 'article';
      delete p.flag;
      toast(`${TYPES[g].name} → ${TYPES[p.loaner].name}: ${t.value === 'deny' ? 'nicht gewährt' : t.value === 'grant' ? 'gewährt' : 'automatisch'}. Wirkt sofort: 3 Mitglieder, Lückenhinweis an 1 Einsatz.`);
      return true;
    }
  }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act]'));
  if (!btn || ev.type !== 'click') return false;
  const id = Number(btn.dataset.id);
  const text = TEXTS.find((x) => x.id === id);
  switch (btn.dataset.act) {
    case 'mtab': ev.preventDefault(); MATRIX.tab = String(btn.dataset.tab); return true;
    case 'granting': MATRIX.granting = String(btn.dataset.key); return true;
    case 'read-now': toast('Artikel gelesen: unverändert seit dem letzten Lesevorgang (304).', 'info'); return false;
    case 'confirm-selected':
      for (const x of TEXTS) {
        if (!MATRIX.selected.has(x.id)) continue;
        const sel = /** @type {HTMLSelectElement|null} */ (document.querySelector(`select[data-map="${x.id}"]`));
        x.state = 'confirmed';
        x.mapped = sel?.value || x.proposal;
      }
      toast(`${MATRIX.selected.size} Zuordnungen bestätigt.`);
      MATRIX.selected.clear();
      applyPendingIfComplete();
      return true;
    case 'confirm-one': {
      const sel = /** @type {HTMLSelectElement|null} */ (document.querySelector(`select[data-map="${id}"]`));
      if (!text || !sel?.value) { toast('Erst einen Schiffstyp wählen – oder „Ignorieren".', 'info'); return false; }
      text.state = 'confirmed'; text.mapped = sel.value; text.note = undefined;
      toast(`„${text.text}" bestätigt.`);
      applyPendingIfComplete();
      return true;
    }
    case 'ignore':
      if (text) { text.state = 'ignored'; MATRIX.selected.delete(id); toast(`„${text.text}" wird ignoriert. Wirkt sofort.`); }
      applyPendingIfComplete();
      return true;
    case 'edit-text': MATRIX.editing = id; return true;
    case 'edit-cancel': MATRIX.editing = 0; return true;
    case 'edit-save': {
      const sel = /** @type {HTMLSelectElement|null} */ (document.querySelector(`select[data-map="${id}"]`));
      if (text && sel?.value) { text.mapped = sel.value; text.state = TYPES[sel.value].kind === 'flight' || text.kind === 'ship' ? 'confirmed' : 'resting'; text.version += 1; }
      MATRIX.editing = 0;
      toast('Zuordnung geändert. Wirkt sofort: 4 Mitglieder, −1 Loaner, Lückenhinweis an 1 Einsatz.');
      return true;
    }
    case 'add-pair': {
      const sel = /** @type {HTMLSelectElement|null} */ (btn.parentElement?.querySelector('select') || null);
      if (sel?.value) { PAIRS[MATRIX.granting].push({ loaner: sel.value, source: 'own' }); toast(`Eigener Eintrag: ${TYPES[MATRIX.granting].name} → ${TYPES[sel.value].name}. Wirkt sofort.`); }
      return true;
    }
    case 'rollback': {
      const r = REVISIONS.find((x) => x.id === id);
      if (!r) return false;
      openDialog({ title: 'Revision anwenden', body: `<p class="m-0">Die Revision vom ${esc(r.stamp)} gilt dann wieder, bis der Artikel sich ändert; die nächste neue Revision wird wie gewohnt automatisch angewendet. Betroffen: 5 Mitglieder, −3 Loaner, Lückenhinweis an 2 Einsätze.</p>`, foot: `<button type="button" class="btn btn-ghost" data-act="close-dialog">Abbrechen</button><button type="button" class="btn btn-danger" data-act="rollback-ok" data-id="${r.id}">Revision anwenden</button>`, danger: true });
      return false;
    }
    case 'rollback-ok': {
      for (const r of REVISIONS) if (r.state === 'applied') r.state = 'kept';
      const r = REVISIONS.find((x) => x.id === id);
      if (r) { r.state = 'applied'; r.applied = '24.11.2026 · durch Admin'; }
      closeDialog();
      toast('Revision angewendet.');
      return true;
    }
    default: return false;
  }
}

/** View state of /ship-data. */
const SHIPDATA = { search: '', open: new Set() };

/**
 * Returns the granting types of a loaner type under the effective pairs.
 * @param {string} loaner
 * @returns {string[]}
 */
function grantersOf(loaner) {
  return Object.keys(PAIRS).filter((g) => grantsOf(g).includes(loaner));
}

/**
 * Renders the loaner facts of a type: what it grants, or what it is a loaner for; for
 * administrators each pair's source.
 * @param {string} key
 * @param {boolean} admin
 * @returns {string}
 */
function loanerFacts(key, admin) {
  if (TYPES[key].kind === 'concept') {
    const pairs = (PAIRS[key] || []).filter((p) => admin || (p.source !== 'off' && TYPES[p.loaner].kind === 'flight'));
    if (!pairs.length) return '<span class="muted">gewährt keine Loaner</span>';
    const items = pairs.map((p) => {
      const off = p.source === 'off' || TYPES[p.loaner].kind !== 'flight';
      const src = !admin ? '' : p.source === 'own' ? ' <small class="ln-src ln-src--own">eigener Eintrag</small>' : p.source === 'off' ? ' <small class="ln-src">abgeschaltet</small>' : TYPES[p.loaner].kind !== 'flight' ? ' <small class="ln-src">ruht</small>' : ' <small class="ln-src">Artikel</small>';
      return `<span class="ln-pair${off ? ' ln-pair--off' : ''}">${esc(TYPES[p.loaner].name)}${src}</span>`;
    }).join('');
    return `<span class="ln-facts-line"><span class="ln-facts-line__k">Gewährt</span>${items}</span>`;
  }
  const granting = grantersOf(key);
  if (granting.length) return `<span class="ln-facts-line"><span class="ln-facts-line__k">Loaner für</span>${granting.map((g) => `<span class="ln-pair">${esc(TYPES[g].name)}</span>`).join('')}</span>`;
  return '<span class="muted">–</span>';
}

/**
 * Renders the three-state concept-ship override with what the sources say.
 * @param {string} key
 * @returns {string}
 */
function conceptOverride(key) {
  const t = TYPES[key];
  const state = t.override === 'FLIGHT' ? 'flight' : t.override === 'CONCEPT' ? 'concept' : 'auto';
  const sources = [
    t.p4kx ? `p4kx: ${t.p4kx === 'IN_PRODUCTION' ? 'In Produktion' : 'Im Konzept'}` : `p4kx: ${t.guid ? 'flugbereit' : 'kein Eintrag'}`,
    t.matrix ? 'Matrix: gewährt Loaner' : null,
    `P4K-GUID: ${t.guid ? 'ja' : 'nein'}`,
  ].filter(Boolean).join(' · ');
  const sourcesSay = Boolean(t.p4kx) || (Boolean(t.matrix) && !t.guid);
  const disagree = (state === 'flight' && sourcesSay) || (state === 'concept' && !sourcesSay);
  return `<div class="ln-override">${segmented(`co-${key}`, [['auto', 'Automatisch'], ['concept', 'Konzeptschiff'], ['flight', 'Flugbereit']], state, 'Konzeptschiff')}
    <span class="cell-sub">${esc(sources)}${disagree ? ' <span class="chip chip--warning">Widerspricht den Quellen</span>' : ''}</span></div>`;
}

/**
 * Renders /ship-data's ship-type list.
 * @param {{admin: boolean, layout: string}} o A loaners as a column, B in an expandable detail row
 * @returns {string}
 */
function renderShipData(o) {
  const q = SHIPDATA.search.trim().toLowerCase();
  const keys = Object.keys(TYPES).filter((k) => !q || typeLabel(k).toLowerCase().includes(q)).sort((a, b) => typeSortKey(a).localeCompare(typeSortKey(b)));
  const actions = o.admin ? `<a href="#" class="btn btn-ghost" data-go="matrix">${icon('list')} <span>Loaner-Matrix</span></a>` : '';
  const head = pageHead({ eyebrow: 'Einsatz & Flotte', title: 'Schiffsdaten', actions });
  const banner = o.admin ? matrixBanner().replace('</span></div>', ' <a href="#" data-go="matrix">Zur Loaner-Matrix</a></span></div>') : '';
  const nameCell = (/** @type {string} */ k) => `<span class="cell-title">${esc(TYPES[k].name)}</span> ${typeChip(k)}<span class="cell-sub">${esc(TYPES[k].maker)}</span>`;
  const hideBtn = '<button type="button" class="btn btn-ghost btn-xs">Ausblenden</button>';
  let table;
  if (o.layout === 'B') {
    const rows = keys.map((k) => {
      const open = SHIPDATA.open.has(k);
      const has = TYPES[k].kind === 'concept' || grantersOf(k).length > 0 || o.admin;
      const detail = open ? `<tr class="ln-detail-row"><td colspan="${o.admin ? 3 : 2}"><div class="ln-detail-grid"><div><p class="ln-detail-k">Loaner</p>${loanerFacts(k, o.admin)}</div>${o.admin ? `<div><p class="ln-detail-k">Konzeptschiff</p>${conceptOverride(k)}</div>` : ''}</div></td></tr>` : '';
      return `<tr><td><div class="hangar-tree__type"><span class="hangar-tree__toggle-slot">${has ? `<button type="button" class="btn-icon hangar-tree__toggle" aria-expanded="${open}" data-act="sd-toggle" data-key="${k}" aria-label="Details">${icon('chevron-right')}</button>` : ''}</span><span>${nameCell(k)}</span></div></td>
        <td class="ln-desc">${TYPES[k].kind === 'concept' ? `Gewährt ${grantsOf(k).length} Loaner` : grantersOf(k).length ? `Loaner für ${grantersOf(k).map((g) => esc(TYPES[g].name)).join(', ')}` : '–'}</td>${o.admin ? `<td class="cell-actions">${hideBtn}</td>` : ''}</tr>${detail}`;
    }).join('');
    table = `<table class="data-table hangar-tree"><thead><tr><th>Name</th><th>Loaner</th>${o.admin ? '<th class="cell-actions">Aktion</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const rows = keys.map((k) => `<tr><td>${nameCell(k)}</td><td>${loanerFacts(k, o.admin)}</td>${o.admin ? `<td>${conceptOverride(k)}</td><td class="cell-actions">${hideBtn}</td>` : ''}</tr>`).join('');
    table = `<table class="data-table data-table--stack"><thead><tr><th>Name</th><th>Loaner</th>${o.admin ? '<th>Konzeptschiff</th><th class="cell-actions">Aktion</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  const memberNote = o.admin ? '' : protoNote('Ansicht als Mitglied: nur die wirksamen Loaner, keine Quellen und keine Einstellungen. Im Prototyp-Balken auf „Admin" stellen.');
  return `${head}${banner}${memberNote}<section class="sd-section"><div class="sd-section__head"><h2 class="sd-section__title"><span>Schiffstypen</span><span class="count-badge count-badge--sm">${keys.length}</span></h2></div>
    <section class="list-panel"><div class="toolbar"><div class="toolbar__search">${icon('search')}<input type="search" data-input="sd-search" value="${esc(SHIPDATA.search)}" placeholder="Nach Namen filtern" aria-label="Nach Namen filtern"></div></div>
    <div class="card card--flush"><div class="table-responsive">${table}</div></div></section></section>`;
}

/**
 * Handles /ship-data's clicks and inputs.
 * @param {Event} ev
 * @returns {boolean} whether the page needs a re-render
 */
function shipDataEvent(ev) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'input' && t instanceof HTMLInputElement && t.dataset.input === 'sd-search') { SHIPDATA.search = t.value; return true; }
  if (ev.type === 'change' && t instanceof HTMLInputElement && t.name.startsWith('co-')) {
    const key = t.name.slice(3);
    TYPES[key].override = t.value === 'flight' ? 'FLIGHT' : t.value === 'concept' ? 'CONCEPT' : undefined;
    toast(`${TYPES[key].name}: ${t.value === 'auto' ? 'Quellen entscheiden' : t.value === 'concept' ? 'als Konzeptschiff erzwungen' : 'als flugbereit erzwungen'}. Wirkt sofort.`);
    return true;
  }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act="sd-toggle"]'));
  if (!btn || ev.type !== 'click') return false;
  const key = String(btn.dataset.key);
  if (SHIPDATA.open.has(key)) SHIPDATA.open.delete(key); else SHIPDATA.open.add(key);
  return true;
}

/** Row-look alternatives of the hangar pages. */
const ROW_DIM = { key: 'row', label: 'Loaner-Zeile', opts: [['A', 'Tag in der Unterzeile'], ['B', 'Streifen + Tag-Chip']] };

/** Type-picker alternatives of the add and edit dialogs. */
const ADD_DIM = { key: 'add', label: 'Typwahl im Dialog', opts: [['A', 'eine Liste mit Status'], ['B', 'Gruppe „Nicht flugbereit"']] };

/**
 * The surfaces of the prototype with their roles and alternatives.
 * @type {Array<{key: string, label: string, admin?: boolean, roles?: string[][], dims: Array<{key: string, label: string, opts: string[][]}>}>}
 */
const PAGES = [
  { key: 'mine', label: 'Meine Schiffe', dims: [ROW_DIM, ADD_DIM] },
  { key: 'admin-hangar', label: 'Admin: Mitglieds-Hangar', admin: true, dims: [ROW_DIM, ADD_DIM] },
  { key: 'unit', label: 'Org-Einheit (Übersicht)', roles: [['member', 'Mitglied'], ['officer', 'Offizier']], dims: [
    { key: 'count', label: 'Loaner in der Typzeile', opts: [['A', 'nicht genannt'], ['B', '„davon n Loaner"'], ['C', 'Chip an der Anzahl']] },
    { key: 'section', label: 'Nicht flugbereit', opts: [['A', 'in derselben Tabelle'], ['B', 'eigene Box']] },
  ] },
  { key: 'mission', label: 'Einsatz: Einheiten', dims: [{ key: 'picker', label: 'Schiffswahl', opts: [['A', 'Zusatz „· Loaner"'], ['B', 'Gruppen Schiffe / Loaner']] }] },
  { key: 'matrix', label: 'Admin: Loaner-Matrix', admin: true, dims: [{ key: 'mlayout', label: 'Aufbau', opts: [['A', 'eine Seite'], ['B', 'Tabs']] }] },
  { key: 'shipdata', label: 'Schiffsdaten', roles: [['member', 'Mitglied'], ['admin', 'Admin']], dims: [{ key: 'sdlayout', label: 'Loaner', opts: [['A', 'als Spalte'], ['B', 'aufklappbar']] }] },
];

/**
 * Returns the current page definition.
 * @returns {typeof PAGES[number]}
 */
function currentPage() {
  const key = param('page', 'mine');
  return PAGES.find((p) => p.key === key) || PAGES[0];
}

/**
 * Returns the chosen alternative of a dimension.
 * @param {string} key
 * @returns {string}
 */
function dim(key) {
  return param(key, 'A');
}

/** Renders the current surface and the prototype bar, keeping the focus of a search field. */
function render() {
  const page = currentPage();
  const active = document.activeElement;
  const focusKey = active instanceof HTMLInputElement ? active.dataset.input : undefined;
  const caret = active instanceof HTMLInputElement ? active.selectionStart : null;
  const role = param('role', page.roles ? page.roles[0][0] : '');
  document.body.classList.toggle('admin-mode', Boolean(page.admin));
  const app = /** @type {HTMLElement} */ (document.getElementById('app'));
  let html = '';
  switch (page.key) {
    case 'mine': html = renderHangar({ admin: false, row: dim('row') }); break;
    case 'admin-hangar': html = renderHangar({ admin: true, row: dim('row') }); break;
    case 'unit': html = renderUnit({ officer: role === 'officer', count: dim('count'), section: dim('section') }); break;
    case 'mission': html = renderMission({ picker: dim('picker') }); break;
    case 'matrix': html = renderMatrix({ layout: dim('mlayout') }); break;
    case 'shipdata': html = renderShipData({ admin: role === 'admin', layout: dim('sdlayout') }); break;
    default: html = '';
  }
  app.innerHTML = html;
  renderBar(page, role);
  if (focusKey) {
    const el = /** @type {HTMLInputElement|null} */ (app.querySelector(`[data-input="${focusKey}"]`));
    if (el) { el.focus(); if (caret !== null) el.setSelectionRange(caret, caret); }
  }
}

/**
 * Renders the floating prototype bar: surface, role and the alternatives of the surface.
 * @param {typeof PAGES[number]} page
 * @param {string} role
 */
function renderBar(page, role) {
  const root = /** @type {HTMLElement} */ (document.getElementById('proto-root'));
  const pages = PAGES.map((p) => `<option value="${p.key}"${p.key === page.key ? ' selected' : ''}>${esc(p.label)}</option>`).join('');
  const roles = page.roles ? `<label class="ln-bar__field"><span>Rolle</span><select data-bar="role">${page.roles.map(([v, l]) => `<option value="${v}"${v === role ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>` : '';
  const dims = page.dims.map((d) => `<label class="ln-bar__field"><span>${esc(d.label)}</span><select data-bar="${d.key}">${d.opts.map(([v, l]) => `<option value="${v}"${v === dim(d.key) ? ' selected' : ''}>${v} · ${esc(l)}</option>`).join('')}</select></label>`).join('');
  root.innerHTML = `<div class="ln-bar" role="region" aria-label="Prototyp-Steuerung"><span class="ln-bar__tag">Prototyp</span>
    <button type="button" class="ln-bar__arrow" data-bar-step="-1" aria-label="Vorherige Oberfläche">‹</button>
    <label class="ln-bar__field"><span>Oberfläche</span><select data-bar="page">${pages}</select></label>
    <button type="button" class="ln-bar__arrow" data-bar-step="1" aria-label="Nächste Oberfläche">›</button>${roles}${dims}
    <span class="ln-bar__note">Daten erfunden · nichts wird gespeichert</span></div>`;
}

/**
 * Switches to a surface.
 * @param {string} key
 */
function go(key) {
  setParams({ page: key, role: null });
  closeDialog();
  window.scrollTo(0, 0);
  render();
}

/**
 * Routes an event to the current surface and re-renders when it asks for it.
 * @param {Event} ev
 */
function route(ev) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'change' && t instanceof HTMLSelectElement && t.dataset.bar) {
    if (t.dataset.bar === 'page') go(t.value); else { setParams({ [t.dataset.bar]: t.value }); render(); }
    return;
  }
  if (ev.type === 'click') {
    const step = /** @type {HTMLElement|null} */ (t.closest('[data-bar-step]'));
    if (step) {
      const i = PAGES.indexOf(currentPage());
      go(PAGES[(i + Number(step.dataset.barStep) + PAGES.length) % PAGES.length].key);
      return;
    }
    const link = /** @type {HTMLElement|null} */ (t.closest('[data-go]'));
    if (link) { ev.preventDefault(); go(String(link.dataset.go)); return; }
    if (t.closest('a[href="#"]')) ev.preventDefault();
    if (t.closest('[data-act="close-dialog"]')) { closeDialog(); return; }
  }
  const page = currentPage().key;
  let dirty = false;
  if (page === 'mine' || page === 'admin-hangar') dirty = importEvent(ev) || hangarEvent(ev, { admin: page === 'admin-hangar', add: dim('add') });
  else if (page === 'unit') dirty = unitEvent(ev);
  else if (page === 'mission') dirty = missionEvent(ev, { picker: dim('picker') });
  else if (page === 'matrix') dirty = matrixEvent(ev);
  else if (page === 'shipdata') dirty = shipDataEvent(ev);
  if (dirty) render();
}

document.addEventListener('click', route);
document.addEventListener('input', (ev) => { if (ev.target instanceof HTMLInputElement && ev.target.type === 'search') route(ev); });
document.addEventListener('change', (ev) => { if (!(ev.target instanceof HTMLInputElement && ev.target.type === 'search')) route(ev); });
document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (t instanceof HTMLInputElement || t instanceof HTMLSelectElement || t instanceof HTMLTextAreaElement || document.querySelector('#dialog-root dialog')) return;
  if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
  const i = PAGES.indexOf(currentPage());
  go(PAGES[(i + (ev.key === 'ArrowRight' ? 1 : -1) + PAGES.length) % PAGES.length].key);
});
render();

</script>
</body>
</html>
