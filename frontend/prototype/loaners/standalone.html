        --fw-thin: 300;
        --fw-regular: 400;
        --fw-bold: 700;
        --fw-black: 900;

        --tracking-display: 0.05em;
        --tracking-overline: 0.15em;
        --lh-body: 1.5;

        --radius-none: 0;
        --radius-sm: 4px;
        --radius-control: 6px;
        --radius-tile: 8px;
        --radius-box: 10px;
        --radius-pill: 999px;

        --border-hairline: 1px solid var(--color-gray-3);
        --border-accent: 1px solid var(--color-primary);
        --border-heading: 2px solid var(--color-primary);

        --glow-primary: 0 0 5px color-mix(in srgb, var(--color-primary) 30%, transparent);
        --glow-primary-lg: 0 0 20px color-mix(in srgb, var(--color-primary) 20%, transparent);
        --glow-danger-lg: 0 0 20px color-mix(in srgb, var(--color-danger) 20%, transparent);
        --shadow-drawer: 5px 0 15px color-mix(in srgb, var(--color-bg-black) 50%, transparent);
        --shadow-dropdown: 0 8px 16px color-mix(in srgb, var(--color-bg-black) 80%, transparent);

        --touch-target-dense: 32px;

        --content-max-data: 1600px;
        --content-max-form: 760px;

        --bp-tablet-max: 1024px;
        --bp-wide-min: 1440px;
        --measure: 80ch;

        --krt-panel-viewport-rest: calc(100vh - var(--krt-footer-height, 5rem));

        --z-popover-raised: 60;
        --z-dropdown: 99;
        --z-sticky-head: 900;
        --z-footer: 999;
        --z-header: 1000;
        --z-header-control: 1001;
        --z-floating: 1100;
        --z-floating-raised: 1200;
        --z-drawer-scrim: 1999;
        --z-drawer: 2000;
        --z-tabbar: 2100;
        --z-modal: 3000;
        --z-hint: 4000;
        --z-status-pill: 9000;
        --z-toast: 9999;
        --z-confirm: 10000;

    @supports (height: 1dvh) {
        :root {
            --krt-panel-viewport-rest: calc(100dvh - var(--krt-footer-height, 5rem));
        }
    }

    @media (width <= 1024px) {
        :root {
            --page-gutter: var(--space-6);
        }
    }

    @media (width <= 768px) {
        :root {
            --page-gutter: var(--space-4);
        }

        :root:has(.mobile-tabbar) {
            --krt-tabbar-height: calc(64px + env(safe-area-inset-bottom));
        }
    }
}

@layer components {
    body {
        background-color: var(--surface-canvas);
        color: var(--color-gray-1);
        font-family: var(--font-body);
        font-weight: var(--fw-regular);
        font-size: var(--fs-body);
        line-height: var(--lh-body);
        margin: 0;
        padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        min-height: 100vh;
        min-height: 100dvh;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--font-headline);
        color: var(--color-white);
        text-transform: uppercase;
        letter-spacing: var(--tracking-display);
        font-weight: var(--fw-bold);
    }

    h1 {
        color: var(--color-primary);
    }

    h4,
    h5,
    h6 {
        color: var(--color-gray-1);
    }

    .lead {
        font-size: 1.1rem;
        font-weight: var(--fw-thin);
        color: var(--color-gray-1);
    }

    a {
        color: var(--color-primary);
        text-decoration: none;
        transition: color 0.2s;
    }

    a:hover {
        color: var(--color-accent-light);
    }

    code,
    kbd,
    samp {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
    }

    strong,
    b {
        font-weight: var(--fw-bold);
    }

    ::selection {
        background: var(--color-primary);
        color: var(--color-bg-black);
    }

    body > header {
        background-color: var(--surface-bar);
        border-bottom: var(--border-heading);
        padding: calc(var(--space-4) + env(safe-area-inset-top)) 1.25rem var(--space-4)
            var(--space-8);
        position: sticky;
        top: 0;
        z-index: var(--z-header);
    }

    .header-spacer {
        flex: 1;
        min-width: 0;
    }

    body.admin-mode > header {
        border-bottom-color: var(--color-accent-dark);
    }

    .admin-mode-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
        padding: 0.35rem 0.7rem;
        background-color: color-mix(in srgb, var(--color-accent-dark) 15%, transparent);
        border: 1px solid var(--color-accent-dark);
        color: var(--color-accent-light);
        font-family: var(--font-headline);
        font-weight: var(--fw-bold);
        font-size: var(--fs-2xs);
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    body:not(.admin-mode) > header .admin-mode-chip {
        display: none;
    }

    nav {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: var(--space-8);
    }

    .hamburger-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        position: relative;
        z-index: var(--z-header-control);
    }

    .hamburger-btn span {
        display: block;
        width: 30px;
        height: 2px;
        background-color: var(--color-primary);
        transition: all 0.3s ease;
        pointer-events: none;
    }

    .hamburger-btn:hover span {
        background-color: var(--color-accent-light);
        box-shadow: 0 0 10px var(--color-primary);
    }

    nav .brand {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        min-width: 0;
        text-decoration: none;
    }

    nav .logo-text {
        font-family: var(--font-headline);
        font-weight: var(--fw-bold);
        font-size: 1.2rem;
        color: var(--color-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .palette-trigger {
        flex: 0 1 320px;
        width: 320px;
        min-width: 0;
        height: 40px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0 0.6rem 0 var(--space-3);
        background-color: var(--control-bg);
        border: var(--border-hairline);
        border-radius: var(--radius-control);
        color: var(--color-gray-1);
        font-family: var(--font-body);
        font-weight: var(--fw-thin);
        font-size: 0.85rem;
        text-align: left;
        cursor: pointer;
        transition: border-color 0.2s;
    }

    .palette-trigger:hover {
        border-color: var(--color-primary);
    }

    .palette-trigger .krt-icon {
        flex: none;
        width: 16px;
        height: 16px;
    }

    .palette-trigger-text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .nav-kbd {
        flex: none;
        padding: 0.2rem 0.35rem;
        border: var(--border-hairline);
        font-family: var(--font-body);
        font-size: 0.65rem;
        font-weight: var(--fw-bold);
        letter-spacing: var(--tracking-display);
        line-height: 1;
        white-space: nowrap;
    }

    .krt-modal.shortcuts-modal {
        max-width: 34rem;
    }

    .shortcuts-heading {
        margin: var(--space-4) 0 var(--space-2);
        color: var(--color-gray-2-text);
        font-size: var(--fs-2xs);
        font-weight: var(--fw-bold);
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .shortcuts-heading:first-child {
        margin-top: 0;
    }

    .shortcuts-list {
        margin: 0;
    }

    .shortcuts-row {
        display: grid;
        grid-template-columns: minmax(8rem, 12rem) 1fr;
        gap: var(--space-3);
        align-items: baseline;
        padding: var(--space-1) 0;
        border-bottom: var(--border-hairline);
    }

    .shortcuts-row dt {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        align-items: center;
        color: var(--color-gray-1);
        font-size: var(--fs-sm);
    }

    .shortcuts-row dd {
        margin: 0;
        color: var(--color-gray-1);
        font-size: var(--fs-sm);
    }

    .nav-link-button {
        width: 100%;
        border: 0;
        background: transparent;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
    }

    .header-search-btn {
        display: none;
    }

    nav .links {
        display: none;
    }

    nav .links a {
        margin-left: var(--space-6);
        font-family: var(--font-body);
        font-weight: var(--fw-bold);
        font-size: var(--fs-sm);
        text-transform: uppercase;
        color: var(--color-gray-1);
    }

    nav .links a:hover {
        color: var(--color-primary);
    }

    main {
        padding: var(--space-8) var(--page-gutter);
        padding-bottom: calc(var(--krt-footer-height, 5rem) + 5rem);
        width: 100%;
        max-width: var(--content-max);
        margin: 0 auto;
        box-sizing: border-box;
    }

    .greeting {
        margin-bottom: var(--space-8);
        border-left: 4px solid var(--color-primary);
        padding-left: var(--space-6);
        padding-top: var(--space-2);
        padding-bottom: var(--space-2);
        background: linear-gradient(90deg, var(--surface-panel) 0%, transparent 100%);
    }

    .greeting h1 {
        margin: 0;
        font-size: var(--fs-h1);
    }

    .greeting p {
        color: var(--color-gray-1);
        font-size: 1.1rem;
        margin-top: var(--space-2);
    }

    .krt-landing-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        align-items: center;
    }

    .krt-landing-notice,
    .krt-landing-hint {
        color: var(--color-gray-2-text);
        font-size: var(--fs-sm);
    }

    .greeting p.krt-landing-notice,
    .greeting p.krt-landing-hint {
        font-size: var(--fs-sm);
    }

    .krt-landing-legal {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
        font-size: var(--fs-sm);
    }

    .krt-landing-legal a {
        color: var(--color-gray-2-text);
    }

    .krt-landing-legal a:hover,
    .krt-landing-legal a:focus-visible {
        color: var(--color-primary);
    }

    table,
    .krt-table,
    .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: var(--space-4);
        background-color: var(--color-bg-dark-gray);
        border: var(--border-hairline);
    }

    th,
    td {
        padding: var(--space-4);
        text-align: left;
        border-bottom: var(--border-hairline);
    }

    th {
        background-color: var(--surface-bar);
        color: var(--color-gray-1);
        font-family: var(--font-body);
        font-size: var(--fs-sm);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: var(--border-heading);
    }

    td {
        color: var(--color-gray-1);
    }

    tr {
        transition:
            background-color 0.2s ease,
            color 0.2s ease;
    }

    tbody tr:nth-child(even of :not([hidden], .detail-row)) {
        background-color: var(--table-stripe-bg);
    }

    tbody tr:hover,
    tbody tr:nth-child(even of :not([hidden], .detail-row)):hover {
        background-color: var(--table-row-hover);
    }

    .card--inset tbody tr:nth-child(even of :not([hidden], .detail-row)) {
        background-color: var(--table-stripe-tile);
    }

    .card--inset tbody tr:hover,
    .card--inset tbody tr:nth-child(even of :not([hidden], .detail-row)):hover {
        background-color: var(--table-row-hover-tile);
    }

    .tree-table {
        width: 100%;
        min-width: 100%;
        border: var(--border-hairline);
        background-color: var(--color-bg-dark-gray);
    }

    .tree-row {
        display: grid;
        grid-template-columns: var(
            --tree-cols,
            minmax(210px, 1.5fr) minmax(220px, 1.7fr) 132px 124px 172px
        );
        align-items: center;
        border-bottom: var(--border-hairline);
    }

    .tree-row:last-child {
        border-bottom: none;
    }

    .tree-cell {
        min-width: 0;
        padding: 0.5rem 0.8rem;
        font-size: 0.86rem;
    }

    .tree-cell--num {
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    .tree-cell--actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.4rem;
        padding-left: 1.5rem;
    }

    .tree-head {
        position: sticky;
        top: 0;
        z-index: 2;
        align-items: stretch;
    }

    .tree-head .tree-cell {
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: var(--color-gray-1);
        background-color: var(--surface-bar);
        border-bottom: var(--border-heading);
        font-size: 0.74rem;
        font-weight: var(--fw-bold);
        text-transform: uppercase;
        letter-spacing: 0.07em;
    }

    .tree-name {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
    }

    .tree-name .tree-label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    @media (width <= 1024px), (pointer: coarse) {
        .tree-name .tree-label {
            white-space: normal;
            overflow-wrap: break-word;
        }
    }

    .tree-chevron {
        position: relative;
        flex: none;
        width: 14px;
        height: 14px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--color-primary);
        font-family: inherit;
        font-size: 0.7rem;
        line-height: 1;
        cursor: pointer;
        transition: transform 0.15s ease;
    }

    .tree-chevron[aria-expanded='true'],
    .tree-chevron.is-open {
        transform: rotate(90deg);
    }

    .tree-row--group {
        background-color: var(--color-surface-input);
        border-left: 4px solid var(--color-primary);
    }

    .tree-row--group .tree-label {
        color: var(--color-white);
        font-size: 0.95rem;
        font-weight: var(--fw-bold);
        text-transform: none;
    }

    .tree-row--mid {
        border-left: 4px solid transparent;
        box-shadow: inset 18px 0 0 -17px var(--color-gray-2);
    }

    .tree-row--mid .tree-name {
        padding-left: 1.5rem;
    }

    .tree-row--mid .tree-label {
        color: var(--color-gray-1);
        font-weight: var(--fw-bold);
    }

    .tree-row--mid:hover {
        background-color: color-mix(in srgb, var(--color-white) 2.5%, transparent);
    }

    .tree-row--leaf {
        background-color: color-mix(in srgb, var(--color-bg-black) 35%, transparent);
        border-left: 4px solid transparent;
    }

    .tree-row--leaf .tree-name {
        padding-left: 3rem;
    }

    .tree-leaf-main {
        display: flex;
        grid-column: 1 / 4;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
        padding: 0.4rem 0.8rem 0.4rem 3rem;
    }

    .tree-fieldset {
        display: flex;
        flex: 1;
        gap: 0.85rem;
        min-width: 0;
    }

    .tree-field {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-width: 0;

    .notification-toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: var(--z-toast);
        max-width: 400px;
        background-color: var(--surface-panel);
        border: var(--border-accent);
        padding: var(--space-6);
        box-shadow: var(--glow-primary-lg);
        opacity: 0;
        transform: translateX(30px);
        transition:

            transform 0.5s ease;
        pointer-events: none;
    }

    .notification-toast.visible {
        opacity: 1;
        transform: translateX(0);
    }

    .notification-toast::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 18px;
        height: 18px;
        border-top: 2px solid var(--color-primary);
        border-left: 2px solid var(--color-primary);
        border-top-left-radius: var(--radius-box);
    }

    .notification-toast::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 18px;
        height: 18px;
        border-bottom: 2px solid var(--color-primary);
        border-right: 2px solid var(--color-primary);
        border-bottom-right-radius: var(--radius-box);
    }

    .notification-toast h4 {
        margin: 0 0 var(--space-2) 0;
        color: var(--color-primary);
        font-family: var(--font-headline);
        font-weight: var(--fw-bold);
        font-size: var(--fs-body);
        text-transform: uppercase;
    }

        margin: 0;
        color: var(--color-gray-1);
        font-size: var(--fs-body);
    }

        box-shadow: var(--glow-danger-lg);
    }

    .notification-toast.error-toast::before {
        border-top-color: var(--color-danger);
        border-left-color: var(--color-danger);
    }

    .notification-toast.error-toast::after {
        border-bottom-color: var(--color-danger);
        border-right-color: var(--color-danger);
    }

    .notification-toast.error-toast h4 {

        border: 1px solid var(--color-gray-3);
        border-top: 3px solid var(--color-primary);
        box-shadow: var(--shadow-drawer);
    }

    .nav-rail-item--avatar .nav-rail-flyout {
        width: max-content;
        min-width: 280px;
        max-width: calc(100vw - var(--krt-nav-width, 64px));
        top: auto;
        bottom: var(--krt-footer-height, 5rem);
        max-height: calc(100dvh - var(--krt-header-height, 83px) - var(--krt-footer-height, 5rem));
    }

    .nav-rail-flyout-head {
        padding: var(--space-3) 0 var(--space-2);
        border-bottom: var(--border-hairline);
        margin-bottom: var(--space-2);
        color: var(--color-primary);
        font-family: var(--font-headline);
        font-weight: var(--fw-bold);
        font-size: var(--fs-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .nav-rail-user {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-transform: none;
        letter-spacing: normal;
    }

    .nav-rail-flyout .nav-link {
        padding-left: var(--space-3);
    }

    .nav-rail-switcher,
    .nav-rail-actions,
    .nav-rail-mode-switch {
        padding: var(--space-3) 0;
        border-top: var(--border-hairline);
    }

    /* The actions wrap inside the flyout's width instead of widening it to fit on one line. */
    .nav-rail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        contain: inline-size;
    }

    /* The org-unit select fills the flyout but must not widen it with a long option label. */
    .nav-rail-switcher {
        contain: inline-size;
    }

    .nav-rail-user-foot {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding-top: var(--space-3);
        border-top: var(--border-hairline);
    }

    .nav-rail-lang-menu {
        display: flex;
        gap: var(--space-4);
    }

    .nav-rail-lang {
        flex: none;
        font-size: var(--fs-sm);
    }

    .nav-rail-logout-form {
        margin-left: auto;
    }

    @media (width > 1024px) {
        .nav-mode-bar {
            display: block;
        }

        body[data-nav-mode='rail'] .nav-rail,
        body[data-nav-mode='pinned'] .nav-rail {
            display: flex;
        }

        :root:has(body[data-nav-mode='rail']),
        :root:has(body[data-nav-mode='pinned']) {
            --krt-nav-width: 64px;
            scroll-padding-inline-start: var(--krt-nav-width);
        }

        body[data-nav-mode='rail'],
        body[data-nav-mode='pinned'] {
            padding-inline-start: calc(var(--krt-nav-width) + env(safe-area-inset-left));
        }

        body[data-nav-mode='rail'] > header,
        body[data-nav-mode='pinned'] > header {
            margin-inline-start: calc(-1 * var(--krt-nav-width));
        }

        body[data-nav-mode='rail'] .hamburger-btn,
        body[data-nav-mode='pinned'] .hamburger-btn {
            display: none;
        }
    }

    @media (width >= 1280px) {
        body[data-nav-mode='pinned'] .nav-rail {
            display: none;
        }

        :root:has(body[data-nav-mode='pinned']) {
            --krt-nav-width: 300px;
        }

        body[data-nav-mode='pinned'] .sidebar {
            top: var(--krt-header-height, 83px);
            bottom: var(--krt-footer-height, 5rem);
            width: var(--krt-nav-width);
            max-width: none;
            z-index: var(--z-footer);
            padding-top: 0;
            border-right: var(--border-hairline);
            box-shadow: none;
            transform: none;
            transition: none;
        }

        body[data-nav-mode='pinned'] .sidebar .nav-head,
        body[data-nav-mode='pinned'] .sidebar .close-sidebar-btn,
        body[data-nav-mode='pinned'] .sidebar-overlay {
            display: none;
        }
    }
}

        color: var(--color-white);
        border: 1px solid var(--control-border);
        font-family: var(--font-body);
        font-size: 0.78rem;
        padding: 7px 9px;
        min-height: 34px;
        font-weight: var(--fw-bold);
    }
    .ae-fields input.ae-meta {
        color: var(--color-gray-1);
        font-weight: 400;
    }
    .ae-fields select.ae-kind {
        width: 100%;
        box-sizing: border-box;
        background: var(--control-bg);
        color: var(--color-white);
        border: 1px solid var(--control-border);
        font-family: var(--font-body);
        font-size: 0.78rem;
        padding: 7px 9px;
        min-height: 34px;
        font-weight: var(--fw-bold);
    }
    .ae-move {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: none;
    }
    .ae-move button {
        min-height: 18px;
        min-width: 26px;
        padding: 0;
    }
    .ae-row .btn-icon {
        flex: none;
    }

    .charhint {
        color: var(--color-gray-2-text);
        font-variant-numeric: tabular-nums;
        float: right;
    }
    .ph-extra {
        color: var(--color-gray-2-text);
        font-weight: var(--fw-bold);
        text-transform: none;
    }
    @media (pointer: coarse) {
        .multiselect-hint {
            display: none;
        }
    }

    .mission-create-frequency {
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(6rem, 0.6fr);
        gap: var(--space-3);
    }

    .mission-create-frequency:has([data-frequency-name][hidden]) > .form-group:first-child {
        grid-column: span 2;
    }

    @media (width <= 768px) {
        .mission-create-frequency {
            grid-template-columns: minmax(0, 1fr);
        }

        .mission-create-frequency:has([data-frequency-name][hidden]) > .form-group:first-child {
            grid-column: auto;
        }
    }

    .mission-template-apply-parts {
        display: grid;
        gap: var(--space-2);
        margin: 0;
        padding: 0;
        border: 0;
    }

    .mission-template-apply-part {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-2) var(--space-3);
        margin: 0;
        padding: var(--space-2) var(--space-3);
        border: var(--border-hairline);
        border-radius: var(--radius-tile);
        background: var(--surface-inset);
        cursor: pointer;
    }

    .mission-template-apply-part[hidden],
    .mission-template-apply-part .chip[hidden],
    .mission-template-apply-part [data-apply-count][hidden],
    .mission-template-apply-part__summary:empty {
        display: none;
    }

    .mission-template-apply-part input {
        margin: 0;
    }

    .mission-template-apply-part__text {
        display: grid;
        gap: var(--space-1);
        min-inline-size: 0;
    }

    .mission-template-apply-part__name {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-white);
        font-weight: var(--fw-bold);
    }

    .mission-template-apply-part__summary {
        overflow: hidden;
        color: var(--color-gray-2-text);
        font-size: var(--fs-sm);
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .mission-template-apply-part:not(:has(input:checked)) .mission-template-apply-part__name {
        color: var(--color-gray-2-text);
    }

    @container krt-modal (width < 28rem) {
        .mission-template-apply-part {
            grid-template-columns: auto minmax(0, 1fr);
        }

        .mission-template-apply-part .chip {
            grid-column: 2;
            justify-self: start;
        }
    }
}

  phoenixEm: { maker: 'RSI', name: 'Constellation Phoenix Emerald', kind: 'notInGame' },

/**

  hulle: [{ loaner: 'hullc', source: 'article' }, { loaner: 'arrow', source: 'own', flag: 'covered' }, { loaner: 'retaliator', source: 'article', flag: 'resting' }],
  pioneer: [{ loaner: 'hullc', source: 'article' }, { loaner: 'carrack', source: 'off' }],
  endeavor: [{ loaner: 'carrack', source: 'article' }],
};

/** Ordered list of locations the pickers offer. */
const LOCATIONS = ['Area18', 'Lorville', 'New Babbage', 'Orison', 'Everus Harbor', 'Seraphim Station'];

/** Org units the viewer may stamp, by shorthand. */
const UNITS = { ALP: 'Alpha-Staffel', BRV: 'Bravo-Staffel', SAR: 'Search and Rescue' };

/**
 * The viewer's own ships in „Meine Schiffe".
 * `formerLoaner` marks an import-locked ship without a pledge id whose type the member now holds as

 */

  { id: 5, type: 'kraken', name: 'Mutterschiff', origin: 'PLEDGE', ins: 'LTI', loc: null, fitted: false, unit: 'ALP', pledge: 'Pledge #51290044 · 22.11.2020' },
  { id: 6, type: 'hulld', name: null, origin: 'PLEDGE', ins: 'LTI', loc: null, fitted: false, unit: 'ALP' },
  { id: 7, type: 'hulle', name: null, origin: 'PLEDGE', ins: 'LTI', loc: null, fitted: false, unit: 'BRV' },
  { id: 8, type: 'pioneer', name: 'Baustelle', origin: 'PLEDGE', ins: 'LTI', loc: null, fitted: false, unit: 'ALP' },
  { id: 9, type: 'phoenixEm', name: null, origin: 'PLEDGE', ins: 'LTI', loc: null, fitted: false, unit: 'ALP' },
  { id: 10, type: 'mpuv', name: null, origin: 'PLEDGE', ins: null, loc: 'Area18', fitted: false, unit: 'ALP', formerLoaner: true },
  { id: 11, type: 'buccaneer', name: null, origin: 'PLEDGE', ins: null, loc: 'Area18', fitted: false, unit: 'ALP', formerLoaner: true },

/**

/** The viewer's display name. */
const ME = 'Kestrel';

/** The member whose hangar the admin view shows. */
const ADMIN_MEMBER = 'Vex';

/**
 * Escapes text for HTML.
 * @param {unknown} s
 * @returns {string}
 */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/**
 * Returns an icon of the sprite.
 * @param {string} name
 * @returns {string}
 */
function icon(name) {
  return `<svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-${name}"></use></svg>`;
}

/**
 * Returns the full type label, manufacturer first.
 * @param {string} key
 * @returns {string}
 */
function typeLabel(key) {
  const t = TYPES[key];
  return `${t.maker} ${t.name}`;
}

/**
 * Returns the type chip a ship type carries: RSI's status for a concept ship, „Konzeptschiff"
 * without one, „Nicht im Spiel" for a type without a GUID that is no concept ship.
 * @param {string} key
 * @returns {string}
 */
function typeChip(key) {
  const t = TYPES[key];
  if (t.kind === 'concept') {
    if (t.status === 'IN_PRODUCTION') return '<span class="chip chip--info" title="Nicht flugbereit · laut RSI in Produktion">In Produktion</span>';
    if (t.status === 'IN_CONCEPT') return '<span class="chip chip--warning" title="Nicht flugbereit · laut RSI im Konzept">Im Konzept</span>';
    return '<span class="chip chip--warning" title="Nicht flugbereit · markiert durch die Loaner-Matrix">Konzeptschiff</span>';
  }
  if (t.kind === 'notInGame') return '<span class="chip chip--warning">Nicht im Spiel</span>';
  return '';
}

/**
 * Returns the loaner types a type grants now: the effective pairs without those switched off.
 * @param {string} key
 * @returns {string[]}
 */
function grantsOf(key) {
  if (TYPES[key].kind !== 'concept') return [];
  return (PAIRS[key] || []).filter((p) => p.source !== 'off' && TYPES[p.loaner].kind === 'flight').map((p) => p.loaner);
}

/**
 * Derives the held loaners from a member's ships: loaner type → distinct granting types in order.
 * @param {Array<{type: string}>} ships
 * @returns {Map<string, string[]>}
 */
function heldLoaners(ships) {
  const held = new Map();
  for (const s of ships) {
    for (const l of grantsOf(s.type)) {
      const g = held.get(l) || [];
      if (!g.includes(s.type)) g.push(s.type);
      held.set(l, g);
    }
  }
  return held;
}

/**
 * Returns the tag text of a loaner: up to two granting types, then „+n".
 * @param {string[]} granting
 * @returns {{text: string, title: string}}
 */
function loanerFor(granting) {
  const names = granting.map((g) => TYPES[g].name);
  const shown = names.length > 2 ? `${names.slice(0, 2).join(', ')} +${names.length - 2}` : names.join(', ');
  return { text: `Loaner für ${shown}`, title: `Loaner für ${names.join(', ')}` };
}

/**
 * Returns a squadron badge.
 * @param {string|null} unit
 * @returns {string}
 */
function unitBadge(unit) {
  return unit ? `<span class="squadron-badge" title="${esc(UNITS[unit])}">${esc(unit)}</span>` : '<span class="squadron-badge squadron-badge-muted">—</span>';
}

/**
 * Returns a status cell for the fitted mark.
 * @param {boolean} ready
 * @returns {string}
 */
function fitBadge(ready) {
  return `<span class="hangar-fit${ready ? ' hangar-fit--ready' : ''}"><span class="status-dot${ready ? ' status-dot--on' : ''}" aria-hidden="true"></span><span class="hangar-fit__label">${ready ? 'Einsatzbereit' : 'Nicht bereit'}</span></span>`;
}

/**
 * Returns a segmented control.
 * @param {string} name
 * @param {Array<[string, string, (number|undefined)?]>} options value, label, optional count
 * @param {string} selected
 * @param {string} [label]
 * @returns {string}
 */
function segmented(name, options, selected, label) {
  const items = options.map(([v, l, n]) => `<label class="krt-segmented__item"><input type="radio" name="${name}" value="${v}"${v === selected ? ' checked' : ''}><span>${esc(l)}</span>${n !== undefined ? `<span class="krt-segmented__count">${n}</span>` : ''}</label>`).join('');
  return `<div class="krt-segmented" role="radiogroup" aria-label="${esc(label || name)}">${items}</div>`;
}

/**
 * Returns the page head.
 * @param {{eyebrow: string, title: string, count?: number, actions?: string, back?: boolean}} o
 * @returns {string}
 */
function pageHead(o) {
  const eyebrow = o.back ? `<a class="page-eyebrow" href="#">${icon('arrow-left')}<span>${esc(o.eyebrow)}</span></a>` : `<span class="page-eyebrow">${esc(o.eyebrow)}</span>`;
  const count = o.count !== undefined ? `<span class="count-badge count-badge--sm">${o.count}</span>` : '';
  return `<div class="page-head"><div class="page-head__main">${eyebrow}<div class="page-title"><h1>${esc(o.title)}</h1>${count}</div></div>${o.actions ? `<div class="page-actions">${o.actions}</div>` : ''}</div>`;
}

/**
 * Opens a dialog in the app's modal shape.
 * @param {{title: string, body: string, foot: string, wide?: boolean, danger?: boolean, id?: string}} o
 * @returns {HTMLDialogElement}
 */
function openDialog(o) {
  const root = /** @type {HTMLElement} */ (document.getElementById('dialog-root'));
  root.innerHTML = `<dialog class="krt-modal-overlay is-open" id="${o.id || 'proto-dialog'}" aria-label="${esc(o.title)}"><div class="krt-modal${o.wide ? ' krt-modal--wide' : ''}${o.danger ? ' krt-modal--danger' : ''}"><div class="krt-modal-head"><h2>${esc(o.title)}</h2><button type="button" class="krt-modal-close" data-act="close-dialog" aria-label="Schließen">&#10005;</button></div><div class="krt-modal-body">${o.body}</div><div class="krt-modal-foot">${o.foot}</div></div></dialog>`;
  const d = /** @type {HTMLDialogElement} */ (root.firstElementChild);
  d.showModal();
  d.addEventListener('close', () => { root.innerHTML = ''; });
  return d;
}

/** Closes the open dialog. */
function closeDialog() {
  const d = document.querySelector('#dialog-root dialog');
  if (d instanceof HTMLDialogElement) d.close();
}

/**
 * Shows a toast that fades after a few seconds.
 * @param {string} msg
 * @param {string} [kind]
 */
function toast(msg, kind) {
  const root = /** @type {HTMLElement} */ (document.getElementById('toast-root'));
  const el = document.createElement('div');
  el.className = `ln-toast${kind === 'info' ? ' ln-toast--info' : ''}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/**
 * Reads a URL search parameter.
 * @param {string} key
 * @param {string} fallback
 * @returns {string}
 */
function param(key, fallback) {
  return new URLSearchParams(location.search).get(key) || fallback;
}

/**
 * Writes URL search parameters without reloading.
 * @param {Record<string, string|null>} values
 */
function setParams(values) {
  const p = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries(values)) {
    if (v === null) p.delete(k); else p.set(k, v);
  }
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

/**
 * Returns the type sort key of REQ-HANGAR-002: manufacturer, then type name.
 * @param {string} key
 * @returns {string}
 */
function typeSortKey(key) {
  return `${TYPES[key].maker}\u0000${TYPES[key].name}`;
}

/**
 * Returns a prototype note line, set apart from the design under review.
 * @param {string} html
 * @returns {string}
 */
function protoNote(html) {
  return `<p class="ln-proto-note">${html}</p>`;
}

/** Filter and selection state of „Meine Schiffe" and the admin member hangar. */
const HANGAR = { fit: '', kind: 'all', showHidden: false, unknownOnly: false, search: '', selected: new Set() };

/**
 * Builds the hangar entries: own ships and held loaners, sorted by type with a type's own ships
 * before its loaner.
 * @returns {Array<{id: string, loaner: boolean, type: string, ship?: typeof MY_SHIPS[number], granting?: string[], state?: typeof MY_LOANER_STATE[string]}>}
 */
function hangarEntries() {
  const entries = MY_SHIPS.map((s) => ({ id: `s${s.id}`, loaner: false, type: s.type, ship: s }));
  for (const [type, granting] of heldLoaners(MY_SHIPS)) {
    entries.push({ id: `l:${type}`, loaner: true, type, granting, state: MY_LOANER_STATE[type] });
  }
  return entries.sort((a, b) => typeSortKey(a.type).localeCompare(typeSortKey(b.type)) || Number(a.loaner) - Number(b.loaner));
}

/**
 * Tells whether an entry counts toward readiness: flight-ready own ships and shown loaners.
 * @param {ReturnType<typeof hangarEntries>[number]} e
 * @returns {boolean}
 */
function countsForReadiness(e) {
  if (e.loaner) return !e.state?.hidden;
  return TYPES[e.type].kind !== 'concept';
}

/**
 * Tells whether an entry is fitted.
 * @param {ReturnType<typeof hangarEntries>[number]} e
 * @returns {boolean}
 */
function isFitted(e) {
  return e.loaner ? Boolean(e.state?.fitted) : Boolean(e.ship?.fitted);
}

/**
 * Applies the toolbar filters.
 * @param {ReturnType<typeof hangarEntries>} entries
 * @returns {ReturnType<typeof hangarEntries>}
 */
function filterEntries(entries) {
  const q = HANGAR.search.trim().toLowerCase();
  return entries.filter((e) => {
    if (e.loaner && e.state?.hidden && !HANGAR.showHidden) return false;
    if (HANGAR.kind === 'ships' && e.loaner) return false;
    if (HANGAR.kind === 'loaners' && !e.loaner) return false;
    if (HANGAR.unknownOnly && (e.loaner || e.ship?.origin !== null)) return false;
    if (HANGAR.fit !== '') {
      if (!countsForReadiness(e)) return false;
      if ((HANGAR.fit === 'true') !== isFitted(e)) return false;
    }
    if (q) {
      const hay = `${typeLabel(e.type)} ${e.ship?.name || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/**
 * Returns the origin chip of an own ship.
 * @param {string|null} origin
 * @returns {string}
 */
function originChip(origin) {
  if (origin === 'PLEDGE') return '<span class="chip chip--primary">Gepledged</span>';
  if (origin === 'IN_GAME') return '<span class="chip chip--warning">Ingame gekauft</span>';
  return '<span class="chip chip--muted">Herkunft unbekannt</span>';
}

/**
 * Returns the insurance cell of an own ship.
 * @param {string|null} ins
 * @returns {string}
 */
function insuranceCell(ins) {
  if (ins === 'LTI') return '<span class="chip chip--primary">LTI</span>';
  if (ins === '0') return '<span class="chip chip--muted">Keine</span>';
  if (ins) return `<span class="chip">${esc(ins)} Mon.</span>`;
  return '<span class="hangar-ins-unset">–</span>';
}

/**
 * Renders one hangar row.
 * @param {ReturnType<typeof hangarEntries>[number]} e
 * @param {string} variant row look: A tag in the sub line, B stripe and tag chip
 * @returns {string}
 */
function hangarRow(e, variant) {
  const checked = HANGAR.selected.has(e.id) ? ' checked' : '';
  const pick = `<label class="hangar-row__pick"><input type="checkbox" data-sel="${e.id}"${checked} aria-label="Auswählen"></label>`;
  if (e.loaner && e.state && e.granting) {
    const tag = loanerFor(e.granting);
    const hidden = e.state.hidden;
    const title = `<span class="cell-title">${esc(typeLabel(e.type))}</span>`;
    const sub = variant === 'B' ? '<span class="cell-sub">Ohne Namen</span>' : `<span class="cell-sub ln-loaner-for" title="${esc(tag.title)}">${esc(tag.text)}</span>`;
    const meta = variant === 'B'
      ? `<span class="chip chip--info ln-chip-loaner" title="${esc(tag.title)}">${esc(tag.text)}</span>`
      : '<span class="chip chip--info ln-chip-loaner">Loaner</span>';
    const hiddenChip = hidden ? '<span class="chip chip--muted">Ausgeblendet</span>' : '';
    const toggle = hidden
      ? `<button type="button" class="btn btn-ghost btn-xs" data-act="unhide" data-type="${e.type}">${icon('eye')} Einblenden</button>`
      : `<button type="button" class="btn btn-ghost btn-icon" data-act="hide" data-type="${e.type}" title="Ausblenden" aria-label="Ausblenden">${icon('eye-off')}</button>`;
    return `<tr class="ln-row--loaner${variant === 'B' ? ' ln-row--stripe' : ''}${hidden ? ' ln-row--hidden' : ''}">
      <td><div class="hangar-row__ship">${pick}<span class="hangar-row__name ln-dim">${title}${sub}<span class="hangar-row__meta">${meta}${hiddenChip}</span></span></div></td>
      <td class="hangar-cell-loc"><span class="ln-dim">${esc(e.state.loc || '–')}</span></td>
      <td class="hangar-cell-ins"><span class="hangar-ins-unset ln-dim" title="Ein Loaner hat keine Versicherung">–</span></td>
      <td class="cell-status"><span class="ln-dim">${fitBadge(e.state.fitted)}</span></td>
      <td class="hangar-cell-unit"><span class="ln-dim">${unitBadge(e.state.unit)}</span></td>
      <td class="cell-actions">
        <button type="button" class="btn btn-ghost btn-icon" data-act="unit" data-id="${e.id}" title="Einheit ändern" aria-label="Einheit ändern">${icon('users')}</button>
        <button type="button" class="btn btn-ghost btn-icon" data-act="edit-loaner" data-type="${e.type}" title="Bearbeiten" aria-label="Bearbeiten">${icon('edit')}</button>
        ${toggle}
      </td></tr>`;
  }
  const s = /** @type {typeof MY_SHIPS[number]} */ (e.ship);
  const concept = TYPES[s.type].kind === 'concept';
  const grants = grantsOf(s.type);
  const grantsLine = grants.length ? `<span class="ln-grants">${icon('arrow-right')}<span>Loaner: ${grants.map((g) => esc(TYPES[g].name)).join(' · ')}</span></span>` : '';
  const pledge = s.pledge ? `<span class="hangar-row__pledge">${esc(s.pledge)}</span>` : '';
  const status = concept ? '<span class="ln-nofit" title="Ein Konzeptschiff hat keinen Einsatzstatus">–</span>' : fitBadge(s.fitted);
  return `<tr>
    <td><div class="hangar-row__ship">${pick}<span class="hangar-row__name">
      <span class="cell-title">${esc(s.name || typeLabel(s.type))}</span> ${typeChip(s.type)}
      <span class="cell-sub">${esc(s.name ? typeLabel(s.type) : 'Ohne Namen')}</span>
      <span class="hangar-row__meta">${originChip(s.origin)}${pledge}</span>${grantsLine}</span></div></td>
    <td class="hangar-cell-loc">${esc(s.loc || '–')}</td>
    <td class="hangar-cell-ins">${insuranceCell(s.ins)}</td>
    <td class="cell-status">${status}</td>
    <td class="hangar-cell-unit">${unitBadge(s.unit)}</td>
    <td class="cell-actions">
      <button type="button" class="btn btn-ghost btn-icon" data-act="unit" data-id="${e.id}" title="Einheit ändern" aria-label="Einheit ändern">${icon('users')}</button>
      <button type="button" class="btn btn-ghost btn-icon" data-act="edit-ship" data-id="${s.id}" title="Bearbeiten" aria-label="Bearbeiten">${icon('edit')}</button>
    </td></tr>`;
}

/**
 * Renders „Meine Schiffe" or, for `admin`, the admin member hangar.
 * @param {{admin: boolean, row: string}} o
 * @returns {string}
 */
function renderHangar(o) {
  const all = hangarEntries();
  const rows = filterEntries(all);
  const shownLoaners = all.filter((e) => e.loaner && !e.state?.hidden);
  const hiddenCount = all.filter((e) => e.loaner && e.state?.hidden).length;
  const readiness = all.filter(countsForReadiness);
  const fitted = readiness.filter(isFitted).length;
  const tabCount = MY_SHIPS.length + shownLoaners.length;
  const actions = o.admin ? '' : `
    <button type="button" class="btn btn-ghost" data-act="import">${icon('upload')} <span>Schiffsliste importieren</span></button>
    <button type="button" class="btn btn--cta" data-act="add-ship">${icon('plus')} <span>Schiff hinzufügen</span></button>`;
  const head = o.admin
    ? pageHead({ eyebrow: 'Mitglieder', back: true, title: `Hangar von ${ADMIN_MEMBER}` })
    : pageHead({ eyebrow: 'Einsatz & Flotte', title: 'Hangar', actions });
  const tabs = o.admin ? '' : `<nav class="tab-nav hangar-tabs" aria-label="Hangar">
      <a href="#" class="tab active" aria-current="page"><span>Meine Schiffe</span><span class="tab-count">${tabCount}</span></a>
      <a href="#" class="tab" data-go="unit"><span>Org-Einheit ALP</span><span class="tab-count">${unitTabCount()}</span></a></nav>`;
  const adminNote = o.admin ? `<p class="alert alert-info">${ADMIN_MEMBER} wird über jede Änderung benachrichtigt, auch über ausgeblendete und eingeblendete Loaner.</p>` : '';
  const toolbar = `<div class="toolbar">
      <div class="toolbar__search">${icon('search')}<input type="search" data-input="search" value="${esc(HANGAR.search)}" placeholder="Schiff, Typ oder Hersteller suchen" aria-label="Suchen"></div>
      ${segmented('fit', [['', 'Alle'], ['true', 'Bereit'], ['false', 'Nicht bereit']], HANGAR.fit, 'Einsatzbereit')}
      ${segmented('kind', [['all', 'Alle'], ['ships', 'Schiffe', MY_SHIPS.length], ['loaners', 'Loaner', shownLoaners.length]], HANGAR.kind, 'Art')}
      <label class="krt-switch"><input type="checkbox" role="switch" data-input="unknown"${HANGAR.unknownOnly ? ' checked' : ''}><span>Herkunft unbekannt</span></label>
      <label class="krt-switch"><input type="checkbox" role="switch" data-input="showHidden"${HANGAR.showHidden ? ' checked' : ''}><span>Ausgeblendete Loaner zeigen</span>${hiddenCount ? `<span class="count-badge count-badge--sm" title="${hiddenCount} Loaner ausgeblendet">${hiddenCount}</span>` : ''}</label>
      <span class="toolbar__spacer"></span>
      <span class="toolbar__count" title="Konzeptschiffe zählen nicht; ausgeblendete Loaner zählen nicht">${fitted} von ${readiness.length} einsatzbereit</span>
    </div>`;
  const table = rows.length ? `<div class="table-responsive"><table class="data-table data-table--stack hangar-table">
      <thead><tr><th><div class="hangar-row__ship"><label class="hangar-row__pick"><input type="checkbox" data-sel="all" aria-label="Alle auswählen"></label><span>Schiff</span></div></th><th>Standort</th><th>Versicherung</th><th class="cell-status">Status</th><th>Einheit</th><th class="cell-actions"><span class="visually-hidden">Aktion</span></th></tr></thead>
      <tbody>${rows.map((e) => hangarRow(e, o.row)).join('')}</tbody></table></div>`
    : '<div class="empty-state"><span class="empty-title">Keine Treffer</span><span class="empty-text">Kein Eintrag passt zum Filter.</span></div>';
  const foot = `<div class="list-foot"><span>1–${rows.length} von ${rows.length}</span></div>`;
  return `${head}${tabs}${adminNote}<section class="list-panel">${toolbar}<div class="card card--flush">${table}${foot}</div></section>${selectionBar()}`;
}

/**
 * Renders the selection bar for the selected entries.
 * @returns {string}
 */
function selectionBar() {
  if (!HANGAR.selected.size) return '';
  const sel = hangarEntries().filter((e) => HANGAR.selected.has(e.id));
  const canHide = sel.some((e) => e.loaner && !e.state?.hidden);
  const canShow = sel.some((e) => e.loaner && e.state?.hidden);
  return `<div class="form-actions--sticky hangar-selection-bar ln-selection" role="region" aria-label="Auswahl">
    <span class="form-actions__summary"><strong>${sel.length}</strong> ausgewählt</span>
    <button type="button" class="btn btn-ghost" data-act="clear-sel">Auswahl aufheben</button>
    <button type="button" class="btn btn-outline" data-act="bulk-origin" data-origin="PLEDGE">Als gepledged markieren</button>
    <button type="button" class="btn btn-outline" data-act="bulk-origin" data-origin="IN_GAME">Als ingame gekauft markieren</button>
    <button type="button" class="btn btn-outline" data-act="bulk-unit">${icon('users')} <span>Einheit ändern</span></button>
    <button type="button" class="btn btn-outline" data-act="bulk-hide"${canHide ? '' : ' disabled'}>${icon('eye-off')} <span>Ausblenden</span></button>
    <button type="button" class="btn btn-outline" data-act="bulk-unhide"${canShow ? '' : ' disabled'}>${icon('eye')} <span>Einblenden</span></button>
  </div>`;
}

/**
 * Returns the options of the ship-type picker in the add and edit dialogs.
 * @param {string} variant A one list with the status as suffix, B a group „Nicht flugbereit"
 * @param {string} selected
 * @returns {string}
 */
function typeOptions(variant, selected) {
  const keys = Object.keys(TYPES).filter((k) => TYPES[k].kind !== 'notInGame').sort((a, b) => typeSortKey(a).localeCompare(typeSortKey(b)));
  /** @param {string} k @param {boolean} suffix */
  const opt = (k, suffix) => {
    const t = TYPES[k];
    const status = t.status === 'IN_PRODUCTION' ? 'In Produktion' : t.status === 'IN_CONCEPT' ? 'Im Konzept' : 'Konzeptschiff';
    const label = suffix && t.kind === 'concept' ? `${typeLabel(k)} · ${status}` : typeLabel(k);
    return `<option value="${k}"${k === selected ? ' selected' : ''}>${esc(label)}</option>`;
  };
  if (variant === 'B') {
    return `<option value="">Bitte wählen …</option><optgroup label="Flugbereit">${keys.filter((k) => TYPES[k].kind === 'flight').map((k) => opt(k, false)).join('')}</optgroup><optgroup label="Nicht flugbereit (immer gepledged)">${keys.filter((k) => TYPES[k].kind === 'concept').map((k) => opt(k, true)).join('')}</optgroup>`;
  }
  return `<option value="">Bitte wählen …</option>${keys.map((k) => opt(k, true)).join('')}`;
}

/**
 * Returns the location picker.
 * @param {string|null} selected
 * @returns {string}
 */
function locationSelect(selected) {
  return `<select id="f-loc"><option value="">Bitte wählen …</option>${LOCATIONS.map((l) => `<option${l === selected ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}

/**

 * @param {string} variant
 */
function openShipDialog(ship, variant) {
  const type = ship ? ship.type : '';
  const body = `
    <div class="form-group"><label for="f-type">Schiffstyp</label><select id="f-type" data-input="dialog-type">${typeOptions(variant, type)}</select>
      <p class="form-hint ln-concept-hint" data-concept-hint hidden></p></div>
    <div class="form-group"><label for="f-name">Name</label><input type="text" id="f-name" value="${esc(ship?.name || '')}"></div>

    <div class="form-group"><label for="f-loc">Ort</label>${locationSelect(ship?.loc || null)}</div>

    <fieldset class="form-group ship-origin" data-origin-row><legend>Herkunft</legend>
      <div data-origin-free>${segmented('origin', [['PLEDGE', 'Gepledged'], ['IN_GAME', 'Ingame gekauft'], ['', 'Unbekannt']], ship?.origin || '')}</div>
      <div data-origin-fixed hidden>${segmented('origin-fixed', [['PLEDGE', 'Gepledged'], ['IN_GAME', 'Ingame gekauft'], ['', 'Unbekannt']], 'PLEDGE')}<p class="form-hint">Ein Konzeptschiff ist immer gepledged.</p></div>
    </fieldset>
    <div class="form-group"><label for="f-unit">Einheit</label><select id="f-unit"><option value="">Keine Einheit</option>${Object.entries(UNITS).map(([k, v]) => `<option value="${k}"${ship?.unit === k ? ' selected' : ''}>${esc(v)} (${k})</option>`).join('')}</select></div>`;
  const foot = `${ship ? `<button type="button" class="btn btn-quiet-danger foot-start" data-act="close-dialog">${icon('trash')} <span>Löschen</span></button>` : ''}
    <button type="button" class="btn btn--cta" data-act="save-ship" data-id="${ship?.id ?? ''}">${icon('save')} <span>Speichern</span></button>`;

  syncShipDialog(d);
}

/**
 * Adapts the ship dialog to the chosen type: a concept ship has no fitted switch and a fixed origin.
 * @param {ParentNode} d
 */
function syncShipDialog(d) {
  const sel = /** @type {HTMLSelectElement|null} */ (d.querySelector('#f-type'));
  const key = sel?.value || '';
  const concept = key !== '' && TYPES[key].kind === 'concept';
  /** @param {string} q @param {boolean} hidden */
  const hide = (q, hidden) => { const el = /** @type {HTMLElement|null} */ (d.querySelector(q)); if (el) el.hidden = hidden; };
  hide('[data-fitted-row]', concept);
  hide('[data-origin-free]', concept);
  hide('[data-origin-fixed]', !concept);
  const hint = /** @type {HTMLElement|null} */ (d.querySelector('[data-concept-hint]'));
  if (hint) {
    const grants = concept ? grantsOf(key) : [];
    hint.hidden = !concept;
    hint.innerHTML = concept ? `${typeChip(key)} Nicht flugbereit: zählt nirgends mit und kann keinem Einsatz zugeteilt werden.${grants.length ? ` Gewährt Loaner: ${grants.map((g) => esc(typeLabel(g))).join(' · ')}.` : ''}` : '';
  }
}

/**
 * Handles the hangar page's clicks and inputs.
 * @param {Event} ev
 * @param {{admin: boolean, add: string}} o
 * @returns {boolean} whether the page needs a re-render
 */
function hangarEvent(ev, o) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'input' || ev.type === 'change') {
    const inp = /** @type {HTMLInputElement} */ (t);
    if (inp.dataset.input === 'search') { HANGAR.search = inp.value; return true; }
    if (inp.dataset.input === 'unknown') { HANGAR.unknownOnly = inp.checked; return true; }
    if (inp.dataset.input === 'showHidden') { HANGAR.showHidden = inp.checked; return true; }
    if (inp.dataset.input === 'dialog-type') { syncShipDialog(/** @type {ParentNode} */ (inp.closest('dialog'))); return false; }
    if (inp.name === 'fit') { HANGAR.fit = inp.value; return true; }
    if (inp.name === 'kind') { HANGAR.kind = inp.value; return true; }
    if (inp.dataset.sel === 'all') {
      const visible = filterEntries(hangarEntries());
      visible.forEach((e) => (inp.checked ? HANGAR.selected.add(e.id) : HANGAR.selected.delete(e.id)));
      return true;
    }
    if (inp.dataset.sel) { if (inp.checked) HANGAR.selected.add(inp.dataset.sel); else HANGAR.selected.delete(inp.dataset.sel); return true; }
    return false;
  }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act]'));
  if (!btn) return false;
  const act = btn.dataset.act;
  const sel = hangarEntries().filter((e) => HANGAR.selected.has(e.id));
  switch (act) {
    case 'add-ship': openShipDialog(null, o.add); return false;
    case 'edit-ship': openShipDialog(MY_SHIPS.find((s) => s.id === Number(btn.dataset.id)) || null, o.add); return false;
    case 'edit-loaner': openLoanerDialog(String(btn.dataset.type), o.admin); return false;
    case 'save-ship': closeDialog(); toast(btn.dataset.id ? 'Schiff aktualisiert.' : 'Schiff hinzugefügt.'); return false;
    case 'save-loaner': {
      const d = /** @type {HTMLElement} */ (btn.closest('dialog'));
      const st = MY_LOANER_STATE[String(btn.dataset.type)];
      st.loc = /** @type {HTMLSelectElement} */ (d.querySelector('#f-loc')).value || null;
      st.fitted = /** @type {HTMLInputElement} */ (d.querySelector('#f-fit')).checked;
      closeDialog();
      toast(`Loaner aktualisiert.${o.admin ? ` ${ADMIN_MEMBER} wird benachrichtigt.` : ''}`);
      return true;
    }
    case 'hide': closeDialog(); setHidden([String(btn.dataset.type)], true, o.admin); return true;
    case 'unhide': closeDialog(); setHidden([String(btn.dataset.type)], false, o.admin); return true;
    case 'unit': openUnitDialog([String(btn.dataset.id)]); return false;
    case 'bulk-unit': openUnitDialog(sel.map((e) => e.id)); return false;
    case 'save-unit': {
      const d = /** @type {HTMLElement} */ (btn.closest('dialog'));
      const unit = /** @type {HTMLSelectElement} */ (d.querySelector('#f-unit')).value || null;
      for (const id of String(btn.dataset.ids).split(',')) {
        if (id.startsWith('l:')) MY_LOANER_STATE[id.slice(2)].unit = unit;
        else { const s = MY_SHIPS.find((x) => `s${x.id}` === id); if (s) s.unit = unit; }
      }
      closeDialog();
      toast('Einheit geändert.');
      return true;
    }
    case 'bulk-origin': {
      const target = String(btn.dataset.origin);
      const ok = sel.filter((e) => !e.loaner && !(target === 'IN_GAME' && TYPES[e.type].kind === 'concept'));
      const skipped = sel.length - ok.length;
      toast(`Herkunft bei ${ok.length} Schiffen gesetzt${skipped ? `, ${skipped} übersprungen (Loaner und Konzeptschiffe)` : ''}.`);
      return false;
    }
    case 'bulk-hide': setHidden(sel.filter((e) => e.loaner && !e.state?.hidden).map((e) => e.type), true, o.admin); return true;
    case 'bulk-unhide': setHidden(sel.filter((e) => e.loaner && e.state?.hidden).map((e) => e.type), false, o.admin); return true;
    case 'clear-sel': HANGAR.selected.clear(); return true;
    default: return false;
  }
}

/**
 * Handles the import dialogs' clicks and choices.
 * @param {Event} ev
 * @returns {boolean} whether the page needs a re-render
 */
function importEvent(ev) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'change' && t instanceof HTMLInputElement && t.name.startsWith('pl-')) {
    const d = /** @type {HTMLElement} */ (t.closest('dialog'));
    const any = [...d.querySelectorAll('input[name^="pl-"]:checked')].some((i) => /** @type {HTMLInputElement} */ (i).value === 'own');
    const apply = /** @type {HTMLButtonElement} */ (d.querySelector('[data-act="import-apply"]'));
    apply.disabled = !any;
    return false;
  }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act]'));
  if (!btn || ev.type !== 'click') return false;
  switch (btn.dataset.act) {
    case 'import': openImportStart(); return false;
    case 'import-run': openImportResult(String(btn.dataset.format)); return false;
    case 'import-apply': closeDialog(); toast('Gewählte Einträge als eigene Schiffe importiert.'); return true;
    case 'former-delete': {
      const id = Number(btn.dataset.id);
      const i = MY_SHIPS.findIndex((s) => s.id === id);
      if (i >= 0) MY_SHIPS.splice(i, 1);
      const row = btn.closest('.ln-choice');
      if (row) row.remove();
      toast('Schiff gelöscht. Dein Loaner dieses Typs bleibt.');
      return true;
    }
    default: return false;
  }
}

/** Search and open drill-downs of the unit overview. */
const UNIT_VIEW = { search: '', open: new Set() };

/**
 * Collects the entries of unit ALP: the viewer's ships and shown loaners stamped ALP plus the
 * other members' entries.
 * @returns {Array<{owner: string, type: string, loaner: boolean, fitted: boolean, loc: string|null}>}
 */
function unitEntries() {
  const mine = MY_SHIPS.filter((s) => s.unit === 'ALP').map((s) => ({ owner: ME, type: s.type, loaner: false, fitted: s.fitted, loc: s.loc }));
  const loaners = [...heldLoaners(MY_SHIPS).keys()]
    .filter((t) => MY_LOANER_STATE[t].unit === 'ALP' && !MY_LOANER_STATE[t].hidden)
    .map((t) => ({ owner: ME, type: t, loaner: true, fitted: MY_LOANER_STATE[t].fitted, loc: MY_LOANER_STATE[t].loc }));
  const others = UNIT_OTHERS.map((o) => ({ ...o, loaner: Boolean(o.loaner) }));
  return [...mine, ...loaners, ...others];
}

/**
 * Groups entries by type in the fixed type order.
 * @param {ReturnType<typeof unitEntries>} entries
 * @returns {Array<{type: string, items: ReturnType<typeof unitEntries>}>}
 */
function groupByType(entries) {
  const map = new Map();
  for (const e of entries) map.set(e.type, [...(map.get(e.type) || []), e]);
  return [...map.entries()].sort(([a], [b]) => typeSortKey(a).localeCompare(typeSortKey(b))).map(([type, items]) => ({ type, items }));
}

/**
 * Returns the count of the unit tab: every entry outside „Nicht flugbereit".
 * @returns {number}
 */
function unitTabCount() {
  return unitEntries().filter((e) => TYPES[e.type].kind !== 'concept').length;
}

/**
 * Renders the owner rows of one type.
 * @param {string} id
 * @param {ReturnType<typeof unitEntries>} items
 * @param {boolean} concept
 * @returns {string}
 */
function ownerRows(id, items, concept) {
  const open = UNIT_VIEW.open.has(id);
  const rows = items.map((d) => `<tr class="hangar-tree__owner"><td><span class="hangar-tree__owner-name">${esc(d.owner)}${d.loaner ? ' <span class="chip chip--info ln-chip-loaner">Loaner</span>' : ''}</span></td><td class="num hangar-tree__owner-gap"></td>
    <td><div class="hangar-tree__owner-meta">${concept ? '<span class="ln-nofit">kein Einsatzstatus</span>' : fitBadge(d.fitted)}<span class="hangar-tree__owner-loc">${esc(d.loc || '–')}</span></div></td></tr>`).join('');
  return `<tbody class="hangar-tree__owners" id="${id}"${open ? '' : ' hidden'}>${rows}</tbody>`;
}

/**
 * Renders a type row of the overview.
 * @param {{type: string, items: ReturnType<typeof unitEntries>}} g
 * @param {string} id
 * @param {{officer: boolean, count: string}} o
 * @returns {string}
 */
function typeRow(g, id, o) {
  const n = g.items.length;
  const fitted = g.items.filter((e) => e.fitted).length;
  const loaners = g.items.filter((e) => e.loaner).length;
  const pct = n ? Math.round((fitted * 100) / n) : 0;
  const open = UNIT_VIEW.open.has(id);
  const toggle = o.officer ? `<button type="button" class="btn-icon hangar-tree__toggle" aria-expanded="${open}" data-act="toggle-owners" data-id="${id}" aria-label="Besitzer zeigen">${icon('chevron-right')}</button>` : '';
  const sub = o.count === 'B' && loaners ? `<span class="cell-sub">${TYPES[g.type].maker} · davon ${loaners} Loaner</span>` : `<span class="cell-sub">${esc(TYPES[g.type].maker)}</span>`;
  const countCell = o.count === 'C' && loaners ? `${n} <span class="chip chip--info ln-chip-loaner ln-chip-count" title="davon ${loaners} Loaner">${loaners} Loaner</span>` : String(n);
  return `<tbody class="hangar-tree__group"><tr class="hangar-tree__row${open ? ' is-open' : ''}"><td><div class="hangar-tree__type"><span class="hangar-tree__toggle-slot">${toggle}</span>
    <span class="hangar-tree__name"><span class="cell-title">${esc(TYPES[g.type].name)}</span> ${typeChip(g.type)}${sub}</span></div></td>
    <td class="num hangar-tree__count">${countCell}</td>
    <td class="hangar-tree__fit"><div class="hangar-tree__fit-inner"><div class="meter hangar-tree__meter" aria-hidden="true"><i class="meter__fill--success" style="width:${pct}%"></i></div><span class="hangar-tree__fit-text">${fitted} von ${n}</span></div></td></tr></tbody>
    ${o.officer ? ownerRows(id, g.items, false) : ''}`;
}

/**
 * Renders a row of the section „Nicht flugbereit": count, no readiness bar.
 * @param {{type: string, items: ReturnType<typeof unitEntries>}} g
 * @param {string} id
 * @param {boolean} officer
 * @returns {string}
 */
function conceptRow(g, id, officer) {
  const open = UNIT_VIEW.open.has(id);
  const toggle = officer ? `<button type="button" class="btn-icon hangar-tree__toggle" aria-expanded="${open}" data-act="toggle-owners" data-id="${id}" aria-label="Besitzer zeigen">${icon('chevron-right')}</button>` : '';

    <td class="num hangar-tree__count">${g.items.length}</td>
    <td class="hangar-tree__fit"><span class="ln-nofit">zählt nicht zur Einsatzbereitschaft</span></td></tr></tbody>
    ${officer ? ownerRows(id, g.items, true) : ''}`;
}

/**
 * Renders the unit overview tab.
 * @param {{officer: boolean, count: string, section: string}} o
 * @returns {string}
 */
function renderUnit(o) {
  const q = UNIT_VIEW.search.trim().toLowerCase();
  const entries = unitEntries().filter((e) => !q || typeLabel(e.type).toLowerCase().includes(q));
  const groups = groupByType(entries);
  const ships = groups.filter((g) => TYPES[g.type].kind !== 'concept');
  const concepts = groups.filter((g) => TYPES[g.type].kind === 'concept');
  const head = pageHead({ eyebrow: 'Einsatz & Flotte', title: 'Hangar' });
  const tabs = `<nav class="tab-nav hangar-tabs" aria-label="Hangar"><a href="#" class="tab" data-go="mine"><span>Meine Schiffe</span><span class="tab-count">${MY_SHIPS.length + [...heldLoaners(MY_SHIPS).keys()].filter((t) => !MY_LOANER_STATE[t].hidden).length}</span></a>
    <a href="#" class="tab active" aria-current="page"><span>Org-Einheit ALP</span><span class="tab-count">${unitTabCount()}</span></a></nav>`;
  const toolbar = `<div class="toolbar"><div class="toolbar__search">${icon('search')}<input type="search" data-input="unit-search" value="${esc(UNIT_VIEW.search)}" placeholder="Schiff, Typ oder Hersteller suchen" aria-label="Suchen"></div><span class="toolbar__spacer"></span>
    <span class="hangar-legend" aria-hidden="true"><span class="hangar-legend__item"><span class="hangar-legend__swatch hangar-legend__swatch--ready"></span><span>einsatzbereit</span></span><span class="hangar-legend__item"><span class="hangar-legend__swatch"></span><span>nicht bereit</span></span></span></div>`;
  const thead = '<thead><tr><th>Schiffstyp</th><th class="num">Anzahl</th><th>Einsatzbereit</th></tr></thead>';
  const shipRows = ships.map((g, i) => typeRow(g, `t${i}`, o)).join('');
  const conceptBody = concepts.map((g, i) => conceptRow(g, `c${i}`, o.officer)).join('');
  const sectionHint = 'Konzeptschiffe: nicht flugbereit, nicht in den Summen, nicht zuteilbar.';
  let content;
  if (o.section === 'B') {
    content = `<div class="card card--flush"><div class="table-responsive"><table class="data-table data-table--stack hangar-tree">${thead}${shipRows}</table></div><div class="list-foot"><span>1–${ships.length} von ${ships.length}</span></div></div>
      ${concepts.length ? `<h2 class="ln-section-title">Nicht flugbereit <span class="count-badge count-badge--sm">${concepts.reduce((n, g) => n + g.items.length, 0)}</span></h2><p class="ln-section-hint">${sectionHint}</p>
      <div class="card card--flush"><div class="table-responsive"><table class="data-table data-table--stack hangar-tree">${thead.replace('Einsatzbereit', '')}${conceptBody}</table></div></div>` : ''}`;
  } else {
    const sep = concepts.length ? `<tbody class="ln-tree-sep"><tr><td colspan="3"><span class="ln-tree-sep__title">Nicht flugbereit</span><span class="ln-tree-sep__hint">${sectionHint}</span></td></tr></tbody>` : '';
    content = `<div class="card card--flush"><div class="table-responsive"><table class="data-table data-table--stack hangar-tree">${thead}${shipRows}${sep}${conceptBody}</table></div><div class="list-foot"><span>1–${ships.length} von ${ships.length} · Nicht flugbereit ohne Seiten</span></div></div>`;
  }
  const roleNote = o.officer ? '' : protoNote('Ansicht als Mitglied ohne Offiziersreichweite: keine Besitzerzeilen. Im Prototyp-Balken auf „Offizier" stellen.');
  return `${head}${tabs}<section class="list-panel">${toolbar}${roleNote}${content}</section>`;
}

/**
 * Handles the unit overview's clicks and inputs.
 * @param {Event} ev
 * @returns {boolean} whether the page needs a re-render
 */
function unitEvent(ev) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'input' && t instanceof HTMLInputElement && t.dataset.input === 'unit-search') { UNIT_VIEW.search = t.value; return true; }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act="toggle-owners"]'));
  if (!btn || ev.type !== 'click') return false;
  const id = String(btn.dataset.id);
  if (UNIT_VIEW.open.has(id)) UNIT_VIEW.open.delete(id); else UNIT_VIEW.open.add(id);
  return true;
}

/**
 * Units of the sample mission: name, type, the assigned ship (owner and loaner flag) and crew.
 * `loanerOf` names the viewer's loaner type a unit holds; `gapped` marks a unit whose loaner left,
 * which keeps its type and name and is not assigned again when the loaner returns.
 * @type {Array<{name: string, type: string, owner: string|null, loaner: boolean, loanerOf?: string, gapped?: boolean, crew: string[]}>}
 */
const MISSION_UNITS = [
  { name: 'Träger', type: 'polaris', owner: ME, loaner: true, loanerOf: 'polaris', crew: [ME, 'Vex'] },
  { name: 'Jäger 1', type: 'arrow', owner: 'Morrow', loaner: false, crew: ['Morrow'] },
  { name: 'Begleitschutz', type: 'buccaneer', owner: ME, loaner: true, loanerOf: 'buccaneer', crew: ['Talon'] },
];

/** Participants registered for the sample mission. */
const PARTICIPANTS = [ME, 'Vex', 'Morrow', 'Talon'];

/**
 * Lists the ships a unit may take: the participants' own ships and shown loaners, never a concept
 * ship.
 * @returns {Array<{type: string, owner: string, loaner: boolean, label: string}>}
 */
function missionShipOptions() {
  const own = MY_SHIPS.filter((s) => TYPES[s.type].kind === 'flight').map((s) => ({ type: s.type, owner: ME, loaner: false, label: s.name || '' }));
  const mine = [...heldLoaners(MY_SHIPS).keys()].filter((t) => !MY_LOANER_STATE[t].hidden).map((t) => ({ type: t, owner: ME, loaner: true, label: '' }));
  const others = UNIT_OTHERS.filter((o) => TYPES[o.type].kind === 'flight' && PARTICIPANTS.includes(o.owner)).map((o) => ({ type: o.type, owner: o.owner, loaner: Boolean(o.loaner), label: '' }));
  return [...own, ...mine, ...others];
}

/**
 * Renders one unit panel of the crew board.
 * @param {typeof MISSION_UNITS[number]} u
 * @param {number} i
 * @returns {string}
 */
function unitPanel(u, i) {
  const gap = Boolean(u.gapped);
  const owner = gap ? null : u.owner;
  const loanerChip = u.loaner && !gap ? ' <span class="chip chip--info ln-chip-loaner chip-xs">Loaner</span>' : '';
  const gapChip = gap ? ' <span class="chip chip--muted chip-xs" title="Kein Schiff zugeteilt, nur der Typ">nur Typ</span>' : '';
  const crew = u.crew.map((c) => `<div class="person-row"><span class="status-dot status-dot--on" aria-hidden="true"></span><span>${esc(c)}</span></div>`).join('');
  return `<div class="kpanel unit-panel mission-unit-box unit-color-${i}"><div class="kpanel-head"><span class="uname"><span>${esc(u.name)}</span>
    <small>— <span>${esc(TYPES[u.type].name)}</span>${loanerChip}${gapChip}${owner ? ` · <span title="Verantwortlich">${esc(owner)}</span>` : ''}</small></span>
    <span class="unit-head-actions"><span class="ucount">${u.crew.length} an Bord</span><button type="button" class="btn btn-ghost btn-icon" data-act="edit-unit" data-i="${i}" title="Bearbeiten" aria-label="Bearbeiten">${icon('edit')}</button></span></div>
    <div class="drop-zone">${crew}</div></div>`;
}

/**
 * Renders the mission's crew board with its units.
 * @param {{picker: string}} o
 * @returns {string}
 */
function renderMission(o) {
  const head = pageHead({ eyebrow: 'Einsätze', back: true, title: 'Bergbau am Aaron Halo', actions: `<button type="button" class="btn btn--cta" data-act="add-unit">${icon('plus')} <span>Einheit hinzufügen</span></button>` });
  const tabs = '<nav class="tab-nav" aria-label="Einsatz"><a href="#" class="tab">Überblick</a><a href="#" class="tab active" aria-current="page">Crew &amp; Einheiten <span class="tab-count">3</span></a><a href="#" class="tab">Finanzen &amp; Auszahlung</a></nav>';
  const gapUnit = MISSION_UNITS.find((u) => u.gapped);
  const notice = gapUnit ? `<div class="alert alert-warning ln-notice">${icon('warning')} <span><strong>Mitteilung an Einsatzleitung und Verantwortliche:</strong> Die Einheit „${esc(gapUnit.name)}" hat ihr Schiff verloren. Der Loaner ${esc(typeLabel(gapUnit.type))} von ${esc(ME)} wird nicht mehr gehalten. Typ und Name der Einheit bleiben. (Code und Wortlaut entscheidet das Audit-Ticket.)</span></div>` : '';
  const begleit = MISSION_UNITS[2];
  const simText = !begleit.gapped ? `${ME} blendet den Loaner Buccaneer aus` : MY_LOANER_STATE.buccaneer.hidden ? 'Buccaneer wieder einblenden (die Einheit bekommt ihn nicht zurück)' : 'Lücke bleibt: ein zurückkehrender Loaner wird nicht wieder zugeteilt';
  const sim = protoNote(`Prototyp: <button type="button" class="ln-linkbtn" data-act="sim-gap">${simText}</button> · Variante der Schiffswahl im Prototyp-Balken (${o.picker === 'B' ? 'Gruppen' : 'Zusatz im Namen'}).`);
  return `${head}${tabs}${sim}${notice}<div class="board-units ln-board">${MISSION_UNITS.map(unitPanel).join('')}</div>`;
}

/**
 * Returns the options of the unit-ship picker for one type.
 * @param {string} type
 * @param {string} variant A suffix „· Loaner", B option groups
 * @param {string} selectedKey
 * @returns {string}
 */
function shipOptions(type, variant, selectedKey) {
  const opts = missionShipOptions().filter((s) => s.type === type);
  /** @param {typeof opts[number]} s */
  const key = (s) => `${s.owner}|${s.type}|${s.loaner}`;
  /** @param {typeof opts[number]} s @param {boolean} suffix */
  const opt = (s, suffix) => `<option value="${esc(key(s))}"${key(s) === selectedKey ? ' selected' : ''}>${esc(`${TYPES[s.type].name}${s.label ? ` „${s.label}"` : ''} (${s.owner})${suffix && s.loaner ? ' · Loaner' : ''}`)}</option>`;
  const none = '<option value="">— keines · nur Typ verwenden —</option>';
  if (variant === 'B') {
    const ships = opts.filter((s) => !s.loaner);
    const loaners = opts.filter((s) => s.loaner);
    return `${none}${ships.length ? `<optgroup label="Schiffe">${ships.map((s) => opt(s, false)).join('')}</optgroup>` : ''}${loaners.length ? `<optgroup label="Loaner">${loaners.map((s) => opt(s, false)).join('')}</optgroup>` : ''}`;
  }
  return `${none}${opts.map((s) => opt(s, true)).join('')}`;
}

/**
 * Opens the add or edit dialog of a mission unit.
 * @param {typeof MISSION_UNITS[number]|null} unit
 * @param {string} variant
 */
function openUnitShipDialog(unit, variant) {
  const types = Object.keys(TYPES).filter((k) => TYPES[k].kind === 'flight').sort((a, b) => typeSortKey(a).localeCompare(typeSortKey(b)));
  const type = unit ? unit.type : 'arrow';
  const gap = Boolean(unit?.gapped);
  const selected = unit && unit.owner && !gap ? `${unit.owner}|${unit.type}|${unit.loaner}` : '';
  const body = `
    <div class="form-group"><label for="f-mtype">Schiffstyp</label><select id="f-mtype" data-input="mission-type">${types.map((k) => `<option value="${k}"${k === type ? ' selected' : ''}>${esc(typeLabel(k))}</option>`).join('')}</select>
      <p class="form-hint">Konzeptschiffe (Javelin, Kraken, Hull D …) stehen nicht zur Wahl.</p></div>
    <div class="form-group"><label for="f-mship">Schiff (optional)</label><select id="f-mship" data-variant="${variant}">${shipOptions(type, variant, selected)}</select>
      <p class="form-hint">Angeboten werden die Schiffe und eingeblendeten Loaner der angemeldeten Teilnehmer.</p></div>
    <div class="form-group"><label for="f-mname">Anzeigename</label><input type="text" id="f-mname" value="${esc(unit?.name || '')}" placeholder="leer: Name des Typs"></div>`;
  openDialog({ title: unit ? 'Einheit bearbeiten' : 'Einheit hinzufügen', body, foot: `<button type="button" class="btn btn-ghost" data-act="close-dialog">Abbrechen</button><button type="button" class="btn btn--cta" data-act="close-dialog">${icon('save')} <span>Speichern</span></button>`, wide: true });
}

/**
 * Handles the mission page's clicks and inputs.
 * @param {Event} ev
 * @param {{picker: string}} o
 * @returns {boolean} whether the page needs a re-render
 */
function missionEvent(ev, o) {
  const t = /** @type {HTMLElement} */ (ev.target);
  if (ev.type === 'change' && t instanceof HTMLSelectElement && t.dataset.input === 'mission-type') {
    const ship = /** @type {HTMLSelectElement} */ (document.getElementById('f-mship'));
    ship.innerHTML = shipOptions(t.value, o.picker, '');
    return false;
  }
  const btn = /** @type {HTMLElement|null} */ (t.closest('[data-act]'));
  if (!btn || ev.type !== 'click') return false;
  switch (btn.dataset.act) {
    case 'add-unit': openUnitShipDialog(null, o.picker); return false;
    case 'edit-unit': openUnitShipDialog(MISSION_UNITS[Number(btn.dataset.i)], o.picker); return false;
    case 'sim-gap': {
      const u = MISSION_UNITS[2];
      if (!u.gapped) { MY_LOANER_STATE.buccaneer.hidden = true; u.gapped = true; } else if (MY_LOANER_STATE.buccaneer.hidden) { MY_LOANER_STATE.buccaneer.hidden = false; }
      return true;
    }
    default: return false;
  }
}

  { id: 17, text: 'Mustang Alpha', kind: 'loaner', state: 'ignored', note: 'Arena-Commander-Ersatz', version: 1 },
];

/** View state of the matrix page. */
const MATRIX = { tab: 'revisions', textFilter: 'all', textSearch: '', granting: 'kraken', selected: new Set(), editing: 0 };

/**
 * Returns the state label of a text.
 * @param {typeof TEXTS[number]} t
 * @returns {string}
 */
function textState(t) {
  switch (t.state) {
    case 'open': return '<span class="status-pill status-pill--warning">Offen</span>';
    case 'ignored': return '<span class="status-pill">Ignoriert</span>';
    case 'resting': return '<span class="status-pill status-pill--danger" title="Die Zuordnung bleibt, gewährt aber nichts">Ruht</span>';
    default: return '<span class="status-pill status-pill--success">Bestätigt</span>';
  }
}

/**
 * Returns a type picker for a text: a ship text takes any type, a loaner text only flight-ready
 * game types.
 * @param {typeof TEXTS[number]} t
 * @param {string} selected
 * @returns {string}
 */
function mappingSelect(t, selected) {
  const keys = Object.keys(TYPES).filter((k) => t.kind === 'ship' || TYPES[k].kind === 'flight').sort((a, b) => typeSortKey(a).localeCompare(typeSortKey(b)));
  return `<select data-map="${t.id}" aria-label="Schiffstyp für ${esc(t.text)}"><option value="">Typ wählen …</option>${keys.map((k) => `<option value="${k}"${k === selected ? ' selected' : ''}>${esc(typeLabel(k))}</option>`).join('')}</select>`;
}

/**
 * Renders the pending revision with its diff and its open texts.
 * @returns {string}
 */
function pendingCard() {
  const rev = REVISIONS.find((r) => r.state === 'pending');
  if (!rev) return '';
  const open = TEXTS.filter((t) => t.state === 'open');
  const selectable = open.filter((t) => !t.group && t.proposal);
  const rows = open.map((t) => {
    const single = t.group || !t.proposal;
    const flag = t.group ? '<span class="chip chip--warning">Gruppierte Form · einzeln bestätigen</span>' : !t.proposal ? '<span class="chip chip--warning">Kein Vorschlag · einzeln bestätigen</span>' : '';
    const pick = single ? '<span class="ln-pick-gap" aria-hidden="true"></span>' : `<input type="checkbox" data-pick="${t.id}"${MATRIX.selected.has(t.id) ? ' checked' : ''} aria-label="${esc(t.text)} auswählen">`;
    const proposal = t.proposal ? `${mappingSelect(t, t.proposal)}<span class="cell-sub">Vorschlag aus ${esc(t.source || '')}</span>` : `${mappingSelect(t, '')}${t.note ? `<span class="cell-sub">${esc(t.note)}</span>` : ''}`;
    const one = single ? `<button type="button" class="btn btn-ghost btn-xs" data-act="confirm-one" data-id="${t.id}">${icon('check')} Bestätigen</button>` : '';
    return `<tr><td class="ln-pick">${pick}</td><td><span class="cell-title">„${esc(t.text)}"</span><span class="cell-sub">${t.kind === 'ship' ? 'Schiff (gewährt)' : 'Loaner'}</span> ${flag}</td><td>${proposal}</td>
      <td class="cell-actions">${one}<button type="button" class="btn btn-ghost btn-xs" data-act="ignore" data-id="${t.id}">Ignorieren</button></td></tr>`;
  }).join('');
  return `<section class="card ln-card ln-card--pending">
    <div class="card-head"><h2 class="card-title">Wartende Revision · Stand ${esc(rev.stamp)}</h2><span class="ln-card-meta">gelesen ${esc(rev.read)} · ${rev.rows} Zeilen</span></div>
    <div class="ln-diff">
      <div><span class="ln-diff__k">Neu</span><span>Odin → Idris-P, Javelin · Kraken → Ironclad &amp; Ironclad Assault (statt Ironclad Assault)</span></div>
      <div><span class="ln-diff__k">Entfällt</span><span>Pioneer → Carrack. Eure Einstellung „Nicht gewähren" für dieses Paar greift danach nicht mehr und wird markiert.</span></div>
      <div><span class="ln-diff__k">Wirkung</span><span>Nach dem Anwenden: 2 Mitglieder, +1 Loaner, −0 Loaner.</span></div>
    </div>
    ${open.length ? `<p class="ln-section-hint">Die Revision wird automatisch angewendet, sobald jeder Text zugeordnet oder ignoriert ist. Bis dahin gilt die Revision vom ${esc(REVISIONS.find((r) => r.state === 'applied')?.stamp || '')}.</p>
    <div class="table-responsive"><table class="data-table ln-table"><thead><tr><th class="ln-pick"><span class="visually-hidden">Auswahl</span></th><th>Text im Artikel</th><th>Zuordnung</th><th class="cell-actions"><span class="visually-hidden">Aktion</span></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="ln-card-foot"><span class="muted">${MATRIX.selected.size} von ${selectable.length} ausgewählt · nichts ist vorausgewählt</span><button type="button" class="btn btn--cta" data-act="confirm-selected"${MATRIX.selected.size ? '' : ' disabled'}>${icon('check')} <span>Ausgewählte bestätigen</span></button></div>`
    : '<p class="alert alert-success">Alle Texte sind zugeordnet. Die Revision wird angewendet.</p>'}
  </section>`;
}

/**
 * Renders every text with its mapping, searchable and filterable.
 * @returns {string}
 */
function textsCard() {
  const q = MATRIX.textSearch.trim().toLowerCase();
  const list = TEXTS.filter((t) => (MATRIX.textFilter === 'all' || t.state === MATRIX.textFilter) && (!q || t.text.toLowerCase().includes(q) || (t.mapped && typeLabel(t.mapped).toLowerCase().includes(q))));
  /** @param {string} s */
  const count = (s) => TEXTS.filter((t) => t.state === s).length;
  const rows = list.map((t) => {
    const editing = MATRIX.editing === t.id;
    const mapping = editing ? `${mappingSelect(t, t.mapped || '')}<span class="cell-sub">Wirkt sofort für alle Mitglieder.</span>` : t.mapped ? `<span class="data-value">${esc(typeLabel(t.mapped))}</span>${t.note ? `<span class="cell-sub">${esc(t.note)}</span>` : ''}` : `<span class="muted">${esc(t.note || '–')}</span>`;

      ? `<button type="button" class="btn btn-ghost btn-xs" data-act="edit-cancel">Abbrechen</button><button type="button" class="btn btn-outline btn-xs" data-act="edit-save" data-id="${t.id}">${icon('save')} Speichern</button>`
