# Class ordering for the e2e suite (E6, 2026-09-13).
#
# TouchClassLayoutE2eTest measures layout against whatever rows the OTHER classes have created, and
# that dependency was undeclared: the same guard reported clean against a fresh stack and produced
# 118 findings inside the destructive suite, where the CRUD flows populate the tables first. The
# ordering that delivered those rows was JUnit's unspecified discovery order — rename the class or
# upgrade JUnit and the sweep silently returns to measuring empty <thead>s and passing.
#
# `OrderAnnotation` gives every class without @Order the default Integer.MAX_VALUE / 2, so a single
# `@Order(Integer.MAX_VALUE)` on the sweep puts it last without annotating the other 93.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
