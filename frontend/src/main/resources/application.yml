server:
  tomcat:
    relaxed-query-chars: "{,},[,]"
    relaxed-path-chars: "{,},[,]"
    accept-count: 200
    max-connections: 10000
    max-part-count: 1000
  max-http-request-header-size: 65536
  http2:
    enabled: true
  port: 18081
  forward-headers-strategy: none
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: basetool
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/plain,text/css,application/javascript,application/json,image/svg+xml
  servlet:
    session:
      timeout: 720h
      cookie:
        name: __Host-SESSION
        secure: true
        http-only: true
        same-site: strict
        max-age: 30d

spring:
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 72MB
  threads:
    virtual:
      enabled: true
  data:
    redis:
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=600s
  application:
    name: frontend
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      add-mappings: false
      chain:
        strategy:
          content:
            enabled: true
    error:
      whitelabel:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: basetool-frontend
            client-secret: ${KEYCLOAK_FRONTEND_CLIENT_SECRET:}
            client-authentication-method: none
            scope: openid, profile, email, roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            user-name-attribute: preferred_username

app:
  android-app-link:
    package-name: ${APP_ANDROID_PACKAGE_NAME:de.greluc.krt.profit.basetool.android}
    sha256-cert-fingerprints: "${APP_ANDROID_CERT_FINGERPRINTS:E8:40:20:5E:EC:16:F5:FD:CD:BA:8B:44:81:18:06:3C:4A:37:E6:16:20:99:CC:49:00:DF:23:80:C1:AF:50:64}"
  http:
    verify-backend-hostname: ${INTERNAL_TLS_VERIFY_HOSTNAME:false}
    connect-timeout: 2s
    response-timeout: 5s
    export-response-timeout: ${APP_HTTP_EXPORT_RESPONSE_TIMEOUT:120s}
    read-timeout: 3s
    write-timeout: 3s
    backend-protocol: ${APP_HTTP_BACKEND_PROTOCOL:H2}
    max-concurrent-streams: ${APP_HTTP_MAX_CONCURRENT_STREAMS:20}
    codec: ${APP_HTTP_CODEC:CBOR}
  livesync:
    redis:
      enabled: ${APP_LIVESYNC_REDIS_ENABLED:true}
      channel: ${APP_LIVESYNC_REDIS_CHANNEL:basetool:livesync:changed}
      presence-channel: ${APP_LIVESYNC_REDIS_PRESENCE_CHANNEL:basetool:livesync:presence}
  session:
    anonymous-timeout: ${APP_SESSION_ANONYMOUS_TIMEOUT:30m}
    authenticated-timeout: ${APP_SESSION_AUTHENTICATED_TIMEOUT:720h}
    type-allow-list: ${APP_SESSION_TYPE_ALLOW_LIST:report}
    configure-keyspace-notifications: true
  ui:
    notification-duration: 5000
  logging:
    correlation-id-header: X-Correlation-Id
    correlation-id-mdc-key: correlationId
    user-id-mdc-key: userId
    slow-request-threshold-ms: 2000
    slow-backend-call-threshold-ms: 1500
    structured-enabled: false
  monitoring:
    scrape:
      username: ${MONITORING_SCRAPE_USER:}
      password: ${MONITORING_SCRAPE_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, loggers
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, backend, redis, diskSpace, ssl
  metrics:
    tags:
      application: basetool-frontend
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.server.requests.active]": false
        "[http.client.requests.active]": false
        "[http.client.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
        "[http.client.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 10s
        "[http.client.requests]": 10s
  tracing:
    export:
      otlp:
        enabled: ${MONITORING_TRACING_ENABLED:false}
    sampling:
      probability: ${MONITORING_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    enabled: ${MONITORING_TRACING_ENABLED:false}
    resource-attributes:
      "service.name": basetool-frontend
    tracing:
      export:
        otlp:
          endpoint: ${MONITORING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    io.github.resilience4j: INFO
    io.opentelemetry.exporter: WARN
    org.springframework.web.servlet.PageNotFound: ERROR

resilience4j:
  spring:
    boot:
      verifier:
        enabled: false
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        ignoreExceptions:
          - org.springframework.security.oauth2.client.ClientAuthorizationException
    instances:
      backendApi:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      backendApi:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.security.oauth2.client.ClientAuthorizationException
    instances:
      backendApi:
        baseConfig: default
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 100
        maxWaitDuration: 1s
    instances:
      backendApi:
        baseConfig: default
