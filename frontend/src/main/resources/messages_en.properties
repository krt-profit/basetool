privacy.h1_1=1. Privacy at a glance
privacy.h2_1_1=General notes
privacy.p_1_1=The following information provides a simple overview of what happens to your personal data when you visit this website. Personal data is any data that can be used to personally identify you.
privacy.h2_1_2=Who is responsible for the data collection on this website?
privacy.p_1_2=Data processing on this website is carried out by the website operator named in the legal notice.
privacy.h2_1_3=What do we use your data for?
privacy.p_1_3=Some data is collected to ensure the error-free provision and security of the website (e.g. via server log files and technically necessary cookies). Other data is processed to provide your member account and the functions of the squadron-management tool, such as your profile information (display name, description) and your entries in mission, bank, warehouse, order, inventory and material-exchange management.
privacy.h2_1_4=What rights do you have regarding your data?
privacy.p_1_4=You have the right at any time to obtain information about the origin, recipient and purpose of your stored personal data. You also have the right to demand rectification, deletion or restriction of processing. You also have the right to object and the right to lodge a complaint with the competent supervisory authority.

privacy.h1_2=2. General notes and mandatory information
privacy.h2_2_1=Controller
privacy.p_2_1=The controller responsible for data processing on this website is:
privacy.address.name=Lucas Greuloch
privacy.address.street=Stauffenbergallee 20a
privacy.address.city=56410 Montabaur
privacy.contact.phone=Phone: 0170-9677429
privacy.contact.email_label=E-Mail:
privacy.contact.email_value=lucas.greuloch@gmail.com
privacy.h2_2_2=Storage duration
privacy.p_2_2=We store your personal data for as long as your user account exists. Upon a deletion request we remove the account-identifying data (e-mail address, display name / player name, Discord account id, Discord server nickname and your profile description). Your warehouse stock, your hangar, your personal inventory (My Inventory) including its free-text notes, your blueprints, your notifications and your evaluation / promotion grades are deleted in full. Content you created that has lasting organisational relevance is not deleted but, for data-integrity reasons, reassigned to an administrator; this covers missions and refinery orders. Your participation in missions and operations is retained so their settlement stays auditable, but you appear there only as \u201cDeleted user\u201d with no link to your name. Bank and account transactions and the account-holder registry, by contrast, are not reassigned: only the link to your account is removed, while the player name used at the time of the booking is retained permanently in the booking history as a tamper-evident record. Likewise, administrative audit and bank logs remain as tamper-evident records and continue to contain the player name used at the time of the respective activity; the legal basis for this is our legitimate interest in the traceability and integrity of the organisational and financial data (Art. 6 (1) (f) GDPR). Individual transient or purely relational content, by contrast, is removed entirely on deletion, e.g. your offers and expressions of interest on the material exchange, granted account permissions and your own registration-approval records. Your right to full erasure under Art. 17 GDPR remains unaffected; you may request the further deletion of these log and booking entries as part of your deletion request, insofar as no overriding legal or legitimate interests conflict with it.
privacy.h2_2_3=Your rights as a data subject
privacy.p_2_3=Under the applicable statutory provisions (especially the GDPR) you have the following rights:
privacy.list_2_3_1=Right of access under Art. 15 GDPR
privacy.list_2_3_2=Right to rectification under Art. 16 GDPR
privacy.list_2_3_3=Right to erasure (“right to be forgotten”) under Art. 17 GDPR
privacy.list_2_3_4=Right to restriction of processing under Art. 18 GDPR
privacy.list_2_3_5=Right to data portability under Art. 20 GDPR
privacy.list_2_3_6=Right to object under Art. 21 GDPR
privacy.list_2_3_7=Right to lodge a complaint with a supervisory authority under Art. 77 GDPR
privacy.h2_2_4=Withdrawal of your consent to data processing
privacy.p_2_4=Many data processing operations are only possible with your express consent. You can revoke any consent you have already given at any time. An informal notification by e-mail to us is sufficient. The lawfulness of the data processing carried out until the revocation remains unaffected by the revocation.
privacy.h2_2_5=Right to lodge a complaint with the competent supervisory authority
privacy.p_2_5_1=In the event of violations of data protection law, you have the right to lodge a complaint with the competent supervisory authority. The supervisory authority responsible for us is:
privacy.p_2_5_2=The State Commissioner for Data Protection and Freedom of Information of Rhineland-Palatinate
privacy.p_2_5_3=Hintere Bleiche 34
privacy.p_2_5_4=55116 Mainz
privacy.p_2_5_5=Phone: +49 (0) 6131 8920-0
privacy.p_2_5_6=Fax: +49 (0) 6131 8920-299
privacy.p_2_5_7=Website: https://www.datenschutz.rlp.de/
privacy.p_2_5_8=E-Mail: poststelle(at)datenschutz.rlp.de

privacy.h1_3=3. Data collection on this website
privacy.h2_3_1=External hosting
privacy.p_3_1_1=This website is hosted by an external service provider. The personal data collected on this website is stored on the servers of the host. This may primarily include IP addresses, contact requests, meta and communication data, contact data, names and website accesses.
privacy.p_3_1_2=The use of the host serves the purpose of fulfilling the contract with our users (Art. 6 (1) (b) GDPR) and is in the interest of secure, fast and efficient provision of our online offering by a professional provider (Art. 6 (1) (f) GDPR).
privacy.p_3_1_3=We use the following host:<br>Hetzner Online GmbH<br>Industriestr. 25<br>91710 Gunzenhausen<br>Germany
privacy.p_3_1_4=We have concluded a data processing agreement (DPA) with our host in accordance with Art. 28 GDPR.
privacy.h2_3_2=Cookies and comparable technologies
privacy.p_3_2_1=Our internet pages exclusively use technically necessary and functional cookies as well as comparable local storage technologies. We do not use cookies for analytics, tracking or marketing purposes. Cookies are small text files that are stored on your end device. Because these cookies are required to provide the service you have expressly requested, no consent is needed for them under § 25 (2) no. 2 TDDDG. The processing of any personal data is based on Art. 6 (1) (f) GDPR; our legitimate interest lies in the technically faultless, secure and convenient provision of our services.
privacy.p_3_2_2=<strong>SESSION (session cookie)</strong><br>This cookie stores a randomly generated session identifier, maintains your login status and at the same time protects the session against cross-site request forgery (CSRF). It is required for basic functions of the application and is set with the Secure, HttpOnly and SameSite=Strict attributes. Sessions of visitors who are not logged in are short-lived; only after a successful login is the cookie stored for up to 30 days so that your login survives a browser restart.
privacy.p_3_2_3=<strong>XSRF-TOKEN</strong><br>This security cookie protects against cross-site request forgery attacks and is set by our programming interface (API) when you interact with it directly. It is session-bound and is automatically deleted at the end of the session.
privacy.p_3_2_4=<strong>KRT_LOCALE</strong><br>Stores the display language you have selected (German or English) so that the interface appears in the desired language on your next visit. This cookie is only set when you actively switch the language and is stored for up to 3 months.
privacy.p_3_2_6=<strong>SSO_ATTEMPTED</strong><br>Short-lived helper cookie for automatic re-authentication (single sign-on). It prevents redirect loops when your session has expired and is automatically deleted after just 60 seconds.
privacy.p_3_2_7=<strong>Cookies of the login service (Keycloak)</strong><br>Sign-in is handled via our single sign-on service Keycloak. During authentication it sets its own technically necessary cookies to manage your login session. These cookies are strictly required for logging in.
privacy.p_3_2_8=<strong>Local browser storage (Local Storage / Session Storage)</strong><br>In addition, we store technically necessary display and flow-control settings directly in your browser (e.g. expanded or collapsed sections, the selected sort and filter choices including the status and squadron filters of the order overview, the active tab, the selected view variant and short-lived technical helper values for the login flow). Individual entries are named with your account name; if you take part in a mission as a guest (without logging in), a short authorisation key is additionally stored with which you can later edit or withdraw your own entry. This data generally remains local on your device; only the aforementioned guest authorisation key is sent back exclusively to our own servers, never to third parties. Session-storage entries are deleted when the browser tab is closed; local-storage entries can be deleted at any time via your browser settings. This use is exempt from consent under Section 25 (2) no. 2 TDDDG.
privacy.h2_3_3=Server log files
privacy.p_3_3_1=The provider of the pages automatically collects and stores information in server log files which your browser transmits. The collection is based on Art. 6 (1) (f) GDPR. Our legitimate interest lies in ensuring the stability and security of our website.
privacy.p_3_3_2=The application itself logs only technical key data per request (HTTP method, requested path, status code and response time); names, e-mail addresses and access tokens are automatically masked and not logged. Each log entry contains a pseudonymous account identifier (the internal user id of your login account) as well as technical context identifiers for the active organisational unit (squadron) and for request tracing. To protect against abuse and overload, the application also evaluates your IP address in memory for a request limit (rate limiting); if the limits are exceeded the affected request is rejected (HTTP 429). The IP address is not stored in a separate application log; like every request it only appears in the access log of the upstream reverse proxy (see "Security monitoring and abuse detection"). These technical application logs are kept for at most 31 days in our internal log store and then deleted automatically. The legal basis in each case is our legitimate interest in stability and security (Art. 6 (1) (f) GDPR).
privacy.h2_3_4=Member account and squadron-related data
privacy.p_3_4_1=To use the tool, we maintain a member account for you. Login and account management is handled via our single sign-on service Keycloak (see "Cookies of the login service"); the data listed below is stored in our application database.
privacy.p_3_4_2=<strong>Account data:</strong> e-mail address, display name / player name (Star Citizen handle), an optional self-written description, rank and join date, and, when logging in via Discord, your Discord account id and your Discord server nickname. We do not collect a first or last name.
privacy.p_3_4_3=<strong>Usage and squadron data:</strong> the content you create in the tool or that is linked to your account, in particular mission planning and participation, bank and account transactions (including the recorded counterparty), warehouse, refinery and item stock, your personal inventory and personal blueprints (My Inventory, each with optional free-text notes), your ships (hangar), orders including the recipient recorded on a handover (player name and squadron), your offers and expressions of interest on the material exchange, your promotion / evaluation levels, notifications and administrative audit logs. Many of these records contain free-text fields (e.g. notes, comments or booking justifications) that are stored as entered and may contain personal data if you enter it there. The legal basis is the provision of the functions you have requested (Art. 6 (1) (b) GDPR) and our legitimate interest in operating the organisation management (Art. 6 (1) (f) GDPR).
privacy.p_3_4_4=<strong>Visibility within the organisation:</strong> Certain content is visible to other members of your organisation. On the material exchange, your player name, the offered material or item with quantity and an optional free-text note are shown organisation-wide; if you express interest in an offer, your player name is shown to the offering member and delivered to them as a notification. In mission and organisation management, participants, party leads and role holders are visible to authorised members. The legal basis is our legitimate interest in functioning organisational collaboration (Art. 6 (1) (f) GDPR).
privacy.p_3_4_5=<strong>Information about non-registered persons:</strong> In some places members can record names or player names of persons who do not (yet) have their own account in the tool - e.g. as a guest participant or party lead of a mission, as the recipient of an order handover, or as a placeholder in the organisation structure. This information is stored exclusively for organisation management (Art. 6 (1) (f) GDPR). If you are affected and wish to have it rectified or deleted, please contact the controller named above.
privacy.h2_3_5=Login via Discord
privacy.p_3_5_1=As an alternative for signing in, you can authenticate with your Discord account. This login is brokered to Discord via our login service (Keycloak). The provider is Discord Netherlands BV, Schiphol Boulevard 195, 1118 BG Schiphol, Netherlands (parent company: Discord Inc., 444 De Haro Street #200, San Francisco, CA 94107, USA).
privacy.p_3_5_2=During login you are redirected to Discord. After a successful login, Discord transmits to us the profile data required for authentication (in particular Discord user id, username, e-mail address where applicable, and profile picture). With your Discord authorization we also access your membership and your roles in the DAS KARTELL server (Discord permissions identify, email and guilds.members.read) in order to check whether you are an eligible member. If this requirement is not met, the login is denied and no account is created.
privacy.p_3_5_3=From this data we permanently store your Discord account id (to recognise your linked account on each login) and your server nickname in the DAS KARTELL server (so that administrators can identify your registration). Both are updated on every Discord login and removed when your account is deleted.
privacy.p_3_5_4=The legal basis is Art. 6 (1) (f) GDPR (legitimate interest in a secure, simple login and in member verification) or Art. 6 (1) (b) GDPR. Since Discord Inc. in the USA is involved in the login, personal data is transferred to the USA in this process; the provider bases this transfer on the European Commission's standard contractual clauses or its certification under the EU-US Data Privacy Framework. Further information: <a href="https://discord.com/privacy" target="_blank" rel="noopener noreferrer">https://discord.com/privacy</a>
privacy.h2_3_6=Notifications and live features
privacy.p_3_6_1=Within the tool we provide you with notifications about events relevant to you. These are stored associated with your account (with read status and the data needed to render them, which may contain the player name of a triggering member), automatically deleted after a retention period of 90 days and delivered exclusively within the application; they are not sent by e-mail or to any third party.
privacy.p_3_6_2=Some areas (e.g. mission planning) offer real-time collaboration: while you have a mission open, other members present at the same time can see your player name and which section you are currently editing, in order to avoid editing conflicts. This presence data is held only transiently in memory, discarded shortly after you leave the page, and not stored permanently. The legal basis is our legitimate interest in smooth joint editing (Art. 6 (1) (f) GDPR).
privacy.h2_3_7=Companion desktop application (data import)
privacy.p_3_7_1=Optionally, you can use a companion desktop application to import data into the tool - e.g. refinery results (from screenshots, say) or personal blueprints (e.g. from a local extraction or an scmdb.net export). The source data is analysed entirely locally on your device; only the result you review is transmitted to our servers in text form. The desktop application signs in to our login service via a device-based login procedure (device login). The imported data is only briefly cached - single-use and exclusively for your own account - for handover to the web interface and is not permanently stored by this service; it is only stored permanently once you confirm it in the web interface.

privacy.h2_3_8=Security monitoring and abuse detection
privacy.p_3_8_1=To protect operations we run internal security monitoring. To detect and defend against attacks and abuse, technical access and authentication logs are stored temporarily including IP addresses. This concerns the access logs of the upstream reverse proxy (all requests to the publicly reachable services), the server authentication and host security logs (SSH/host authentication, intrusion prevention and integrity monitoring of security-relevant configuration) and the login service (Keycloak) logs; these may contain IP addresses and usernames. These logs are made accessible to administrators only and are automatically deleted after at most 31 days. The legal basis is Art. 6(1)(f) GDPR (legitimate interest in secure and fault-free operation).
privacy.p_3_8_2=The operational metrics and dashboards derived from operations contain no personal data, only aggregated counts, and are kept for up to 180 days. The associated internal analysis interface (Grafana) is accessible to administrators only; through it, the security logs mentioned above and the technical tracing described below are also accessible.
privacy.p_3_8_3=To analyse errors and response times we also record technical traces of individual requests. A trace contains the requested path (without query parameters and with identifiers reduced to placeholders), the status code and timing measurements; names, e-mail addresses, IP addresses or account identifiers are not stored. The traces are kept in an internal store (Tempo) for at most 14 days, are accessible to administrators only and are then deleted automatically. The legal basis is our legitimate interest in stable and error-free operation (Art. 6 (1) (f) GDPR).
privacy.h2_3_9=Companion Android app
privacy.p_3_9_1=You may optionally use the Basetool app for Android. It shows the same content as the web interface and with the same permissions; it performs no processing of its own. The app is published exclusively via GitHub and not through an app store; GitHub, Inc.'s privacy terms apply to downloading it and to its update checks (see <a href="https://docs.github.com/site-policy/privacy-policies" target="_blank" rel="noopener noreferrer">GitHub Privacy Statement</a>).
privacy.p_3_9_2=Sign-in uses the same authentication service as the browser and takes place in a browser window on the device; the app never receives your password. Stored on the device are only an encrypted sign-in credential (refresh token, encrypted through the device's Android keystore) and the content last retrieved, for display. Both are excluded from Android backup and device-to-device transfer, never leave the device, and are deleted on sign-out.
privacy.p_3_9_3=The app contains no analytics, advertising or tracking components and no automatic crash reporting. A crash log stays on the device and is transmitted only if you send it yourself. The app uses no push service: notifications are shown only while the app is running, and without content on the lock screen. The legal basis is the provision of the functions you requested (Art. 6(1)(b) GDPR).
privacy.last_updated=Last updated: 24 August 2026
