# ===================================================================
# Production Configuration for Frontend
#
# JVM Tuning Recommendations (apply via JAVA_TOOL_OPTIONS in Docker):
#   -XX:+UseContainerSupport
#   -XX:MaxRAMPercentage=75.0
#   -XX:InitialRAMPercentage=50.0
#   -XX:+HeapDumpOnOutOfMemoryError
#   -XX:HeapDumpPath=/tmp/heapdump.hprof
# ===================================================================
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.profit-base.online/realms/iri}
  session:
    store-type: redis
    redis:
      namespace: basetool:session
      flush-mode: immediate
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  # Spring Boot SSL bundle that exposes the bind-mounted `keystore.p12` as a
  # truststore for the backend WebClient. The backend's HTTPS endpoint
  # (`https://backend:11261`) is served by the same self-signed cert that this
  # keystore carries, so by trusting the keystore the frontend trusts the
  # backend without falling back to the InsecureTrustManagerFactory (which
  # M-13 in the 2026-05-20 audit rightly restricted to dev/test). The location
  # and password resolve from the same env vars Tomcat already consumes for
  # the frontend's own HTTPS listener -- no new compose secrets needed.
  # Consumed by WebClientConfig via `SslBundles.getBundle("backend-trust")`;
  # if the bundle is absent (e.g. a future operator fronts the backend with a
  # publicly-trusted cert), WebClientConfig falls back to the default JVM
  # trust store.
  ssl:
    bundle:
      jks:
        backend-trust:
          truststore:
            location: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
            password: ${SERVER_SSL_KEY_STORE_PASSWORD}
            type: PKCS12

spring.thymeleaf.cache: true

server:
  shutdown: graceful

# ADR-0090: serve Actuator (/actuator/health for the Docker HEALTHCHECK, /actuator/prometheus for the
# scrape) on a DEDICATED internal-only management port instead of the public 18081 connector. NPM
# fronts only 18081, and this port is never host-published nor on any net-proxy-* network, so
# /actuator/** is unreachable from the internet by construction — the public connector answers 404
# for it (belt to the REQ-OBS-012 NPM edge-deny braces). Prometheus reaches it over
# net-monitoring-scrape; the Docker HEALTHCHECK reaches it over localhost (compose overrides the
# image's default healthcheck to this port). HTTPS with the SAME bind-mounted keystore.p12 as the
# 18081 connector (cert SAN carries dns:frontend) so the scrape stays HTTPS + pinned-CA (REQ-OBS-008).
# Boot serves this from a separate management context whose security auto-config backs off given the
# custom SecurityConfig chains, so the endpoint is UNAUTHENTICATED here — acceptable because it is
# internal-only, mirroring Keycloak's port 9000 (REQ-SEC-014); ADR-0072's basic-auth is superseded by
# this port isolation (REQ-OBS-005 amended). Prod-only: dev/test/e2e set no management port and keep
# Actuator on 18081 with MonitoringScrapeSecurityConfig's fail-closed guard.
management:
  server:
    port: 18091
    ssl:
      enabled: true
      key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
      key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
      key-store-type: PKCS12
      key-alias: basetool
  endpoint:
    # REQ-OBS-016, prod only: the exposure list (application.yml) includes `loggers`, and its POST
    # variant MUTATES a live log level. On the management port above there is no authentication to
    # gate that on — every container on net-monitoring-scrape reaches 18091 unauthenticated — and a
    # ROOT logger flipped to TRACE makes Spring Security / WebClient / Netty write bearer tokens and
    # request bodies into a Loki stream retained for 744 h. So the write is not merely gated here,
    # it does not exist: `read-only` keeps GET /actuator/loggers (the whole diagnostic value during
    # an incident) and leaves the write operation unregistered.
    # The backend is deliberately the OTHER shape and that asymmetry is intentional. Since ADR-0134
    # it has a management port too (11271), so the difference is no longer whether one exists: its
    # ManagementPortSecurityConfig scopes the permit-all chain to an enumerated READ surface rather
    # than to /actuator/**, so /actuator/loggers selects that chain not at all and falls through to
    # SecurityConfig's filter chain, where the mutator CAN carry an identity check and is gated on
    # ROLE_ADMIN instead of being removed. Full runtime control stays available in dev/test/e2e,
    # which set no management port and never load this file.
    loggers:
      access: read-only

app:
  backend-url: ${BACKEND_URL:https://backend:11261}
  # The backend's ACTUATOR base URL, which in prod is NOT its API base URL: ADR-0134 moved the
  # backend's Actuator to the internal-only management port 11271, so
  # https://backend:11261/actuator/health/readiness answers 404 here. BackendHealthIndicator sits in
  # the readiness group that gates the Docker HEALTHCHECK, so leaving it pointed at the API port
  # made the frontend container permanently unhealthy and the deploy loop rolled v1.5.47 back
  # (2026-08-18). The port must track backend/src/main/resources/application-prod.yml's
  # management.server.port — BackendHealthUrlProdParityTest fails if the two drift apart. The host
  # deliberately mirrors BACKEND_URL's default: the management connector binds every interface, so
  # net-backend-frontend reaches it without a new network (REQ-OBS-005, ADR-0090/-0134).
  backend-health-url: ${BACKEND_HEALTH_URL:https://backend:11271}
  logging:
    structured-enabled: true
  # SEC-02 / REQ-SEC-011: the reverse proxies whose X-Forwarded-For the frontend trusts when
  # resolving the originating client IP it relays to the backend's per-IP rate limiter. In
  # production nginx-proxy-manager fronts the frontend on net-proxy-frontend, and every compose
  # bridge is PINNED under 172.28.0.0/16 (docker-compose.yml, since #974) — NOT the default Docker
  # bridge (172.17.0.0/16). A mismatch silently collapses every per-IP bucket onto NPM's address
  # (no leak, but the limiter degrades into one shared org-wide budget) — exactly what caused the
  # 2026-07-06 multi-user mission-page outage, where the frontend relayed NPM's address 172.28.3.2
  # for every user and the shared bucket was exhausted for everyone at once. Mirrors the backend's
  # app.rate-limit.trusted-proxies; it MUST match the real compose subnet. Override via
  # APP_CLIENT_IP_TRUSTED_PROXIES only if you re-pin the networks.
  client-ip:
    trusted-proxies:
      - 172.28.0.0/16
