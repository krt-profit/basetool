spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://profit-base.online/auth/realms/iri}
  session:
    store-type: redis
    redis:
      namespace: basetool:session
      flush-mode: immediate
  data:
    redis:
      host: redis
      port: 6379
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
  ssl:
    bundle:
      jks:
        backend-trust:
          truststore:
            location: ${INTERNAL_TLS_TRUSTSTORE:${SERVER_SSL_KEY_STORE:classpath:keystore.p12}}
            password: ${INTERNAL_TLS_TRUSTSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD}}
            type: PKCS12

spring.thymeleaf.cache: true

server:
  shutdown: graceful

management:
  server:
    port: 18091
    ssl:
      enabled: true
      key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
      key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
      key-store-type: PKCS12
      key-alias: basetool
  endpoint:
    loggers:
      access: read-only

app:
  backend-url: ${BACKEND_URL:https://backend:11261}
  backend-health-url: ${BACKEND_HEALTH_URL:https://backend:11271}
  logging:
    structured-enabled: true
  client-ip:
    trusted-proxies:
      - 172.28.0.0/16
