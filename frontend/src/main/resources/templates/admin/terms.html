<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="${appTitle} + ' - ' + #{adminTerms.title}">Profit Basetool - Zustimmungen</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />
<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.members', titleText=#{adminTerms.title},
        count=${termsPage != null ? termsPage.totalElements() : null}, countId='admin-terms-count', countFor='admin-terms-results')}"></th:block>

    <form id="admin-terms-filter-form" method="get" th:action="@{/admin/terms}" class="no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: segmented(name='filter', labelKey='adminTerms.filter.label', selected=${termsFilter},
                options=${ {{value: 'PENDING', labelKey: 'adminTerms.filter.pending', count: termsPendingCount},
                            {value: 'ACCEPTED', labelKey: 'adminTerms.filter.accepted'},
                            {value: 'ALL', labelKey: 'adminTerms.filter.all'}} })}"></th:block>
        </div>
    </form>

    <div id="admin-terms-results" class="card card--flush">
        <th:block th:fragment="adminTermsResults">
            <div th:if="${termsLoadFailed}" class="alert alert-danger" role="alert" th:text="#{adminTerms.loadFailed}">Die &Uuml;bersicht konnte nicht geladen werden.</div>

            <th:block th:if="${!termsLoadFailed and #lists.isEmpty(termsRows)}">
                <th:block th:replace="~{fragments/components :: emptyState(titleKey='adminTerms.empty', textKey='adminTerms.empty.text')}"></th:block>
            </th:block>

            <table th:if="${!#lists.isEmpty(termsRows)}" class="data-table data-table--stack">
                <thead>
                <tr>
                    <th th:text="#{adminTerms.column.user}">Nutzer</th>
                    <th class="cell-status" th:text="#{adminTerms.column.status}">Status</th>
                    <th th:text="#{adminTerms.column.acceptedAt}">Zugestimmt am</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${termsRows}">
                    <td>
                        <span class="cell-title" th:text="${row.displayName() != null ? row.displayName() : row.username()}">Rufzeichen</span>
                    </td>
                    <td class="cell-status">
                        <span th:if="${row.accepted()}" class="chip chip--success" th:text="#{adminTerms.status.accepted}">Zugestimmt</span>
                        <span th:unless="${row.accepted()}" class="chip chip--warning" th:text="#{adminTerms.status.pending}">Offen</span>
                    </td>
                    <td th:attr="data-label=#{adminTerms.column.acceptedAt}"
                        th:text="${row.acceptedAt() != null ? #temporals.format(row.acceptedAt(), 'dd.MM.yyyy HH:mm', 'UTC') + ' UTC' : '—'}">—</td>
                </tr>
                </tbody>
            </table>

            <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${termsPage}, baseUrl=${'/admin/terms?filter=' + termsFilter})}"></th:block>
        </th:block>
    </div>
</main>
<script th:src="@{/js/admin-terms.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
