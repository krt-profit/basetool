<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{admin.syncReports.title} + ' - ' + ${appTitle}">Sync-Berichte - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/admin-sync-reports.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.system', titleText=#{admin.syncReports.title},
        count=${totalElements}, countId='sync-count', countFor='sync-results', actions=~{::sync-actions})}">
        <th:block th:ref="sync-actions">
            <th:block th:replace="~{fragments/components :: overflowMenu(id='sync-menu', items=~{::sync-menu-items})}">
                <th:block th:ref="sync-menu-items">
                    <button type="button" id="purge-trigger" class="overflow-menu__item overflow-menu__item--danger" role="menuitem"
                            th:text="#{admin.syncReports.delete.title}">Alte Berichte l&ouml;schen</button>
                </th:block>
            </th:block>
        </th:block>
    </th:block>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{${error}}">Fehler beim Laden.</div>

    <div th:if="${deletedCount != null}" class="alert alert-success" role="status"
         th:text="#{admin.syncReports.delete.success(${deletedCount})}">Berichte gel&ouml;scht.</div>

    <nav class="tab-nav sync-tabs" th:attr="aria-label=#{admin.syncReports.col.source}">
        <a th:href="@{/admin/sync-reports}" class="tab" th:classappend="${activeTab == 'ALL'} ? 'active'"
           th:attr="aria-current=${activeTab == 'ALL'} ? 'page' : null" th:text="#{admin.syncReports.tab.all}">Alle</a>
        <a th:href="@{/admin/sync-reports/scwiki}" class="tab" th:classappend="${activeTab == 'SCWIKI'} ? 'active'"
           th:attr="aria-current=${activeTab == 'SCWIKI'} ? 'page' : null" th:text="#{admin.syncReports.tab.scwiki}">SC Wiki</a>
        <a th:href="@{/admin/sync-reports/uex}" class="tab" th:classappend="${activeTab == 'UEX'} ? 'active'"
           th:attr="aria-current=${activeTab == 'UEX'} ? 'page' : null" th:text="#{admin.syncReports.tab.uex}">UEX</a>
    </nav>

    <div id="sync-results" class="card card--flush">
    <th:block th:fragment="results">
    <table th:if="${!#lists.isEmpty(events)}" id="syncReportsTable" class="data-table data-table--stack">
        <thead>
            <tr>
                <th th:text="#{admin.syncReports.col.name}">Name</th>
                <th class="cell-status" th:text="#{admin.syncReports.col.eventType}">Ereignis</th>
                <th th:text="#{admin.syncReports.col.source}">Quelle</th>
                <th th:text="#{admin.syncReports.col.aggregate}">Aggregat</th>
                <th th:text="#{admin.syncReports.col.ranAt}">Zeitpunkt</th>
                <th th:text="#{admin.syncReports.col.detail}">Detail</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ev : ${events}">
                <td><span class="cell-title" th:text="${ev.externalName != null and !#strings.isEmpty(ev.externalName)} ? ${ev.externalName} : '—'">Name</span></td>
                <td class="cell-status">
                    <span class="chip event-type"
                          th:text="${#messages.msgOrNull('admin.syncReports.event.' + ev.eventType) ?: ev.eventType}">Nur im Wiki angelegt</span>
                </td>
                <td th:attr="data-label=#{admin.syncReports.col.source}"
                    th:text="${ev.sourceSystem == null} ? '—' : (${#messages.msgOrNull('admin.syncReports.tab.' + #strings.toLowerCase(ev.sourceSystem))} ?: ${ev.sourceSystem})">SC Wiki</td>
                <td th:attr="data-label=#{admin.syncReports.col.aggregate}" th:text="${ev.aggregate}">commodity</td>
                <td><span class="utc-time" th:text="${ev.ranAt}">2026-05-28T00:00:00Z</span></td>
                <td class="event-detail" th:text="${ev.detail}">-</td>
            </tr>
        </tbody>
    </table>
    <th:block th:if="${#lists.isEmpty(events)}">
        <th:block th:replace="~{fragments/components :: emptyState(titleKey='admin.syncReports.empty', textKey='admin.syncReports.empty.text')}"></th:block>
    </th:block>
    <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${eventsPage}, baseUrl=${basePath})}"></th:block>
    </th:block>
    </div>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='purge-confirm-modal', titleKey='admin.syncReports.delete.title', variant='krt-modal--danger', body=~{::purge-confirm-modal-body})}">
        <th:block th:ref="purge-confirm-modal-body">
            <form id="purge-form" th:action="@{/admin/sync-reports/delete-old}" method="post" class="no-track purge-form">
                <input type="hidden" name="source" th:value="${activeTab == 'ALL' ? '' : activeTab}">
                <div class="krt-modal-body stack gap-3">
                    <p th:text="#{admin.syncReports.delete.help}">Berichte l&ouml;schen, die &auml;lter als die angegebene Anzahl Tage sind.</p>
                    <div class="form-group">
                        <label for="purge-days" th:text="#{admin.syncReports.delete.label}">Berichte &auml;lter als (Tage)</label>
                        <input type="number" id="purge-days" name="days" min="1" step="1" value="30" required>
                    </div>
                    <p id="purge-confirm-message" class="m-0"
                       th:data-template="#{admin.syncReports.delete.confirm.message}"
                       th:text="#{admin.syncReports.delete.confirm.message(30)}">Wirklich l&ouml;schen?</p>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" id="purge-cancel"
                            th:text="#{general.cancel}">Abbrechen</button>
                    <button type="button" class="btn btn-danger" id="purge-confirm"
                            th:text="#{admin.syncReports.delete.button}">Alte l&ouml;schen</button>
                </div>
            </form>
        </th:block>
    </th:block>
</main>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const SYNC_MSG = {
        successTemplate: /*[[#{admin.syncReports.delete.success}]]*/ '{0} Berichte gelöscht.',
        deleteError:     /*[[#{error.admin.syncReports.delete}]]*/ 'Löschen fehlgeschlagen.'
    };
</script>
<script th:src="@{/js/sync-reports.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
