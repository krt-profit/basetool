<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{admin.blueprints.title} + ' - ' + ${appTitle}">Blueprints - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/admin-blueprints.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.masterdata', titleText=#{admin.blueprints.title},
        count=${totalElements}, countId='admin-bp-count', countFor='admin-bp-results')}"></th:block>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{${error}}">Fehler beim Laden.</div>

    <form id="admin-bp-filter" method="get" th:action="@{/admin/blueprints}" class="no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('admin-bp-search', 'search', ${search}, 'admin.blueprints.search.placeholder')}"></th:block>
        </div>
    </form>

    <div id="admin-bp-results" class="card card--flush">
        <th:block th:fragment="results">
            <table class="bp-table" th:if="${!#lists.isEmpty(blueprints)}">
                <thead>
                    <tr>
                        <th th:text="#{admin.blueprint.col.blueprint}">Blueprint</th>
                        <th th:text="#{admin.blueprint.col.ingredients}">Zutaten</th>
                        <th th:text="#{admin.blueprint.col.dependency}">Stat-Beitrag nach Zutat-Qualit&auml;t</th>
                    </tr>
                </thead>
                <tbody>
                    <th:block th:each="bp : ${blueprints}">
                        <tr th:each="g, gStat : ${bp.requirementGroups()}">
                            <td class="bp-cell-blueprint" th:if="${gStat.first}"
                                th:rowspan="${bp.requirementGroups().size()}">
                                <span class="bp-name" th:text="${bp.outputName() != null ? bp.outputName() : bp.scwikiKey()}">Output</span>
                                <span class="bp-key" th:if="${bp.scwikiKey() != null}" th:text="${bp.scwikiKey()}">BP_KEY</span>
                            </td>
                            <td th:attr="data-label=#{admin.blueprint.col.ingredients}">
                                <span class="bp-ingredient" th:each="ing : ${g.ingredients()}">
                                    <span th:text="${ing.name() != null ? ing.name() : '?'}">Zutat</span>
                                    <span class="bp-meta" th:if="${ing.quantityScu() != null}"
                                          th:text="'· ' + ${#numbers.formatDecimal(ing.quantityScu(),1,2,'POINT')} + ' SCU'">· 0.36 SCU</span>
                                    <span class="bp-meta" th:if="${ing.quantityUnits() != null}"
                                          th:text="'· ' + ${ing.quantityUnits()} + 'x'">· 7x</span>
                                    <span class="bp-meta" th:if="${ing.minQuality() != null}">
                                        · <span th:text="#{admin.blueprint.minQuality}">min. Qual.</span>
                                        <span th:text="${ing.minQuality()}">1</span>
                                    </span>
                                </span>
                                <span class="bp-empty-hint" th:if="${#lists.isEmpty(g.ingredients())}">&ndash;</span>
                            </td>
                            <td th:attr="data-label=#{admin.blueprint.col.dependency}">
                                <span class="bp-stat" th:each="m : ${g.modifiers()}">
                                    <span class="bp-stat-label" th:text="${m.label() != null ? m.label() : m.propertyKey()}">Stat</span>
                                    <span class="bp-stat-bw" th:if="${m.betterWhen() == 'higher'}" th:text="'(' + #{admin.blueprint.betterWhen.higher} + ')'">(h&ouml;her ist besser)</span>
                                    <span class="bp-stat-bw" th:if="${m.betterWhen() == 'lower'}" th:text="'(' + #{admin.blueprint.betterWhen.lower} + ')'">(niedriger ist besser)</span>
                                    <span class="bp-stat-bw" th:if="${m.betterWhen() == 'neutral'}" th:text="'(' + #{admin.blueprint.betterWhen.neutral} + ')'">(neutral)</span>

                                    <span class="bp-slider"
                                          th:if="${m.effectiveQualityMin() != null and m.effectiveQualityMax() != null and m.effectiveQualityMax() > m.effectiveQualityMin()}"
                                          th:attr="data-qmin=${m.effectiveQualityMin()},data-qmax=${m.effectiveQualityMax()},data-vmin=${m.modifierAtMinQuality()},data-vmax=${m.modifierAtMaxQuality()},data-vrt=${m.valueRangeType()}">
                                        <span class="bp-seg" th:each="seg : ${m.segments()}"
                                              th:attr="data-qmin=${seg.qualityMin()},data-qmax=${seg.qualityMax()},data-vstart=${seg.modifierAtStart()},data-vend=${seg.modifierAtEnd()}"></span>
                                        <span class="bp-slider-row">
                                            <span class="bp-slider-end" th:text="${#numbers.formatDecimal(m.effectiveQualityMin(),1,0,'POINT')}">0</span>
                                            <input type="range" class="bp-range" step="1"
                                                   th:attr="min=${m.effectiveQualityMin()},max=${m.effectiveQualityMax()},value=${m.effectiveQualityMax()}">
                                            <span class="bp-slider-end bp-slider-end-max" th:text="${#numbers.formatDecimal(m.effectiveQualityMax(),1,0,'POINT')}">1000</span>
                                        </span>
                                        <span class="bp-slider-out">
                                            <output class="bp-q">&ndash;</output>
                                            <span class="bp-slider-arrow">&rarr;</span>
                                            <output class="bp-out">&times;?</output>
                                        </span>
                                    </span>
                                    <span class="bp-dep"
                                          th:unless="${m.effectiveQualityMin() != null and m.effectiveQualityMax() != null and m.effectiveQualityMax() > m.effectiveQualityMin()}">
                                        <span class="bp-dep-val" th:if="${m.modifierAtMaxQuality() != null}"
                                              th:text="'×' + ${#numbers.formatDecimal(m.modifierAtMaxQuality(),1,2,'POINT')}">&times;1.05</span>
                                        <span class="bp-empty-hint" th:unless="${m.modifierAtMaxQuality() != null}">&ndash;</span>
                                    </span>
                                </span>
                                <span class="bp-empty-hint" th:if="${#lists.isEmpty(g.modifiers())}">&ndash;</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bp.requirementGroups())}">
                            <td class="bp-cell-blueprint">
                                <span class="bp-name" th:text="${bp.outputName() != null ? bp.outputName() : bp.scwikiKey()}">Output</span>
                                <span class="bp-key" th:if="${bp.scwikiKey() != null}" th:text="${bp.scwikiKey()}">BP_KEY</span>
                            </td>
                            <td th:attr="data-label=#{admin.blueprint.col.ingredients}">
                                <span class="bp-ingredient" th:each="ing : ${bp.ingredients()}"
                                      th:text="${ing.name()}">Zutat</span>
                                <span class="bp-empty-hint" th:if="${#lists.isEmpty(bp.ingredients())}">&ndash;</span>
                            </td>
                            <td th:attr="data-label=#{admin.blueprint.col.dependency}"><span class="bp-empty-hint">&ndash;</span></td>
                        </tr>
                    </th:block>
                </tbody>
            </table>

            <th:block th:if="${#lists.isEmpty(blueprints)}">
                <th:block th:replace="~{fragments/components :: emptyState(titleKey='admin.blueprints.empty.title', textKey='admin.blueprints.empty.text')}"></th:block>
            </th:block>

            <div class="list-foot" th:if="${totalElements > 0}" th:data-list-total="${totalElements}">
                <span class="bp-count" data-testid="list-count" th:text="#{admin.blueprints.total} + ': ' + ${totalElements}">Gesamt: 0</span>
                <div class="pager" th:if="${totalPages > 1}">
                    <a th:if="${currentPage > 0}" class="btn btn-ghost" data-swap
                       th:href="@{/admin/blueprints(page=${currentPage - 1}, search=${search})}"
                       th:text="#{general.pagination.previous}">Zur&uuml;ck</a>
                    <span th:text="${currentPage + 1} + ' / ' + ${totalPages}">1 / 1</span>
                    <a th:if="${currentPage + 1 < totalPages}" class="btn btn-ghost" data-swap
                       th:href="@{/admin/blueprints(page=${currentPage + 1}, search=${search})}"
                       th:text="#{general.pagination.next}">Weiter</a>
                </div>
            </div>
        </th:block>
    </div>
</main>

<script th:src="@{/js/admin-blueprints.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
