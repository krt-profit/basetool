<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{info.title} + ' - ' + ${appTitle}">Informationen - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/admin-announcement.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main th:with="announcementContent=${adminAnnouncement != null and adminAnnouncement.content != null ? adminAnnouncement.content : ''}">
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.members', titleText=#{info.edit.title}, actions=~{::announcement-actions})}">
        <th:block th:ref="announcement-actions">
            <th:block th:replace="~{fragments/components :: overflowMenu(id='announcement-menu', items=~{::announcement-menu-items})}">
                <th:block th:ref="announcement-menu-items">
                    <button type="button" id="trigger-delete-confirm" class="overflow-menu__item overflow-menu__item--danger" role="menuitem"
                            data-testid="announcement-delete-open"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg> <span th:text="#{info.delete}">Löschen</span></button>
                </th:block>
            </th:block>
        </th:block>
    </th:block>

    <form id="announcement-update-form" class="form-layout card" th:action="@{/admin/announcement/update}" method="post">
        <input type="hidden" name="version" th:value="${adminAnnouncement != null ? adminAnnouncement.version : 0}">
        <fieldset class="form-section">
            <legend class="form-section__head" th:text="|1 · #{info.edit.section.text}|">1 · Text</legend>
            <div class="form-group">
                <label for="info-edit-content" class="form-label" th:text="#{info.edit.content}">Inhalt</label>
                <textarea name="content" id="info-edit-content" class="announcement-text" rows="12" aria-describedby="info-edit-hint info-edit-counter"
                          th:text="${announcementContent}"></textarea>
                <div class="announcement-meta">
                    <span id="info-edit-hint" class="form-hint" th:text="#{mission.description.markdown_hint}">Markdown wird unterstützt (z. B. **fett**, Listen, Links).</span>
                    <span id="info-edit-counter" class="form-hint announcement-counter" data-testid="announcement-counter"
                          th:data-template="#{info.edit.counter}"
                          th:text="#{info.edit.counter(${#strings.length(announcementContent)})}">0 Zeichen</span>
                </div>
            </div>
        </fieldset>

        <div class="form-actions--sticky">
            <button type="submit" class="btn btn--cta" data-testid="announcement-save"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{info.edit.save}">Information speichern</span></button>
        </div>
    </form>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='delete-confirm-modal', titleKey='info.delete.confirm.title', variant='krt-modal--danger', closeTrigger='', closeClass='close-delete-modal', body=~{::delete-confirm-modal-body})}">
        <th:block th:ref="delete-confirm-modal-body">
            <div class="krt-modal-body">
                <p th:text="#{info.delete.confirm.message}" class="m-0">Wirklich löschen?</p>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost close-delete-modal" th:text="#{general.cancel}">Abbrechen</button>
                <form id="announcement-delete-form" th:action="@{/admin/announcement/delete}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger" th:text="#{info.delete}">Löschen</button>
                </form>
            </div>
        </th:block>
    </th:block>
</main>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const ANNOUNCE_MSG = {
        saveSuccess:   /*[[#{notification.success.save}]]*/ 'Gespeichert.',
        saveError:     /*[[#{notification.error.save}]]*/ 'Speichern fehlgeschlagen.',
        deleteSuccess: /*[[#{notification.success.delete}]]*/ 'Gelöscht.',
        deleteError:   /*[[#{notification.error.delete}]]*/ 'Löschen fehlgeschlagen.'
    };
    const ANNOUNCE_CONFLICT = {
        title:                /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Bitte neu laden.',
        reloadLabel:          /*[[#{frontend.ajax.conflict.reload}]]*/ 'Aktuelle Werte laden',
        dismissLabel:         /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        reloadQuestion:       /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
</script>
<script th:src="@{/js/announcement.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
