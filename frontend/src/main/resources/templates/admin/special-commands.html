<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{admin.specialcommands.title} + ' - ' + ${appTitle}">Spezialkommandos - IRIDIUM Basetool</title>
    <th:block th:fragment="extraLinks">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <link rel="stylesheet" th:href="@{/css/pages/admin-special-commands.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.members', titleText=#{admin.specialcommands.title},
        count=${specialCommands != null ? #lists.size(specialCommands) : 0}, countId='sc-count', countFor='sc-results', actions=~{::sc-actions})}">
        <th:block th:ref="sc-actions">
            <button type="button" id="add-sc-btn" class="btn btn--cta" data-testid="page-head-primary"
                    th:data-action="@{/admin/special-commands}" th:text="#{admin.specialcommands.create}">Neues Spezialkommando</button>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/components :: alert(type='danger', msgKey=${error}, extraClass=null)}"></th:block>

    <form th:action="@{/admin/special-commands}" method="get" id="sc-filter-form" class="no-track">
        <div class="toolbar">
            <label class="switch" for="includeInactive">
                <input type="checkbox" id="includeInactive" name="includeInactive" th:checked="${includeInactive}">
                <span class="switch__track" aria-hidden="true"></span>
                <span th:text="#{admin.specialcommands.show_inactive}">Inaktive anzeigen</span>
            </label>
        </div>
    </form>

    <div id="sc-results" class="card card--flush">
        <th:block th:fragment="results">
        <th:block th:if="${catalogTruncated}">
            <div th:replace="~{fragments/components :: alert('warning', 'admin.catalog.truncated', null)}"></div>
        </th:block>
        <div class="table-responsive" th:if="${specialCommands != null and !#lists.isEmpty(specialCommands)}">
            <table class="data-table data-table--stack"
                   th:data-list-total="${#lists.size(specialCommands)}">
                <thead>
                    <tr>
                        <th th:text="#{admin.specialcommands.column.name}">Name</th>
                        <th th:text="#{admin.specialcommands.column.shorthand}">K&uuml;rzel</th>
                        <th th:text="#{admin.specialcommands.column.description}">Beschreibung</th>
                        <th class="cell-actions"><span class="visually-hidden" th:text="#{admin.specialcommands.column.actions}">Aktion</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sc : ${specialCommands}" th:classappend="${!sc.active} ? 'sc-row--inactive' : ''">
                        <td>
                            <a class="row-link" data-testid="row-link" th:href="@{/organisation/special-commands/{id}(id=${sc.id})}"
                               th:title="#{admin.specialcommands.members.manage}">
                                <span class="cell-title"><span th:text="${sc.name}">Name</span><span th:if="${!sc.active}" class="badge-inactive" th:text="#{admin.specialcommands.inactive}">Inaktiv</span></span>
                            </a>
                        </td>
                        <td th:attr="data-label=#{admin.specialcommands.column.shorthand}" th:text="${sc.shorthand}">K&uuml;rzel</td>
                        <td class="sc-desc" th:text="${sc.description}">Desc</td>
                        <td class="cell-actions">
                            <button type="button" class="btn btn-ghost btn-icon edit-sc-btn"
                                    th:data-action="@{/admin/special-commands/{id}/update(id=${sc.id})}"
                                    th:data-id="${sc.id}"
                                    th:data-name="${sc.name}"
                                    th:data-shorthand="${sc.shorthand}"
                                    th:data-desc="${sc.description}"
                                    th:data-version="${sc.version}"
                                    th:title="#{members.edit}" th:aria-label="#{members.edit}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-edit"/></svg></button>
                            <button th:if="${sc.active}" type="button" class="btn btn-quiet-danger btn-icon delete-btn"
                                    th:data-action="@{/admin/special-commands/{id}/delete(id=${sc.id})}"
                                    th:data-name="${sc.name}"
                                    th:title="#{info.delete}" th:aria-label="#{info.delete}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                            <form th:if="${!sc.active}" th:action="@{/admin/special-commands/{id}/activate(id=${sc.id})}" method="post" class="sc-inline-form">
                                <button type="submit" class="btn btn-success btn-xs" th:text="#{admin.specialcommands.activate}">Aktivieren</button>
                            </form>
                            <svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${specialCommands == null or #lists.isEmpty(specialCommands)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='admin.specialcommands.empty.title', textKey='admin.specialcommands.empty')}"></th:block>
        </th:block>
        </th:block>
    </div>
</main>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='specialcommand-modal', titleKey='admin.specialcommands.create', variant='krt-modal--wide', titleId='sc-modal-title', open=${openModal == 'specialcommand-modal'}, closeTrigger='', closeClass='close-sc-modal', body=~{::specialcommand-modal-body})}">
    <th:block th:ref="specialcommand-modal-body">
        <form id="sc-form" method="post" th:action="${modalAction != null and openModal == 'specialcommand-modal'} ? ${modalAction} : @{/admin/special-commands}" th:object="${specialCommandForm}">
            <input type="hidden" name="version" id="edit-sc-version" th:value="*{version}">
            <div class="krt-modal-body">
                <div class="form-group">
                    <label th:text="#{admin.specialcommands.column.name}">Name</label>
                    <input type="text" name="name" id="sc-name" th:value="*{name}" required>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></div>
                </div>
                <div class="form-group">
                    <label th:text="#{admin.specialcommands.column.shorthand}">Kürzel</label>
                    <input type="text" name="shorthand" id="sc-shorthand" th:value="*{shorthand}" required>
                    <div th:if="${#fields.hasErrors('shorthand')}" th:errors="*{shorthand}" class="field-error"></div>
                </div>
                <div class="form-group">
                    <label th:text="#{admin.specialcommands.column.description}">Beschreibung</label>
                    <textarea name="description" id="sc-desc" rows="3" th:text="*{description}"></textarea>
                    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></div>
                </div>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost close-sc-modal" th:text="#{general.cancel}">Abbrechen</button>
                <button type="submit" class="btn btn--cta"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{members.save}">Speichern</span></button>
            </div>
        </form>
    </th:block>
</th:block>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='sc-delete-modal', titleKey='info.delete.confirm.title', variant='krt-modal--danger', closeTrigger='', closeClass='close-sc-delete-modal', body=~{::sc-delete-modal-body})}">
    <th:block th:ref="sc-delete-modal-body">
        <div class="krt-modal-body">
            <p th:text="#{admin.specialcommands.delete.confirm}" class="mb-2">Möchten Sie dieses Spezialkommando wirklich löschen?</p>
            <p class="m-0"><strong id="sc-delete-name" class="sc-delete-name"></strong></p>
        </div>
        <div class="krt-modal-foot">
            <button type="button" class="btn btn-ghost close-sc-delete-modal" th:text="#{general.cancel}">Abbrechen</button>
            <form id="sc-delete-form" th:action="@{/admin/special-commands}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger" th:text="#{info.delete}">Löschen</button>
            </form>
        </div>
    </th:block>
</th:block>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    var SC_MSG = {
        saved:   /*[[#{notification.success.save}]]*/ '',
        deleted: /*[[#{notification.success.delete}]]*/ '',
        error:   /*[[#{notification.error.save}]]*/ '',
        createTitle: /*[[#{admin.specialcommands.create}]]*/ '',
        editTitle:   /*[[#{admin.specialcommands.edit}]]*/ ''
    };
    var SC_CONFLICT = {
        title:                /*[[#{frontend.ajax.conflict.title}]]*/ '',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ '',
        reloadLabel:          /*[[#{frontend.ajax.conflict.reload}]]*/ '',
        dismissLabel:         /*[[#{frontend.ajax.conflict.dismiss}]]*/ '',
        reloadQuestion:       /*[[#{frontend.ajax.conflict.question}]]*/ ''
    };
</script>
<script th:src="@{/js/special-commands.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
