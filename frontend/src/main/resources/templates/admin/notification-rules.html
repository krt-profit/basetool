<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{admin.notificationRules.title} + ' - ' + ${appTitle}">Notification rules - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/admin-notification-rules.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/basetool-logo.svg}" alt="" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <span id="rule-i18n" hidden
          th:attr="data-confirm-delete-title=#{admin.notificationRules.confirmDelete.title},data-confirm-delete-body=#{admin.notificationRules.confirmDelete.body},data-confirm-ok=#{notifications.confirm.ok},data-confirm-cancel=#{general.cancel},data-saved=#{admin.notificationRules.success.saved},data-deleted=#{admin.notificationRules.success.deleted},data-error=#{notification.error.title},data-unknown-value=#{admin.notificationRules.selector.unknown}"></span>

    <div class="greeting hud-box">
        <h1 th:text="#{admin.notificationRules.title}">Benachrichtigungsregeln</h1>
        <p th:text="#{admin.notificationRules.subtitle}">Wer wird bei welchem Ereignis benachrichtigt.</p>
    </div>

    <div class="hud-box mt-2">
        <h2 th:text="#{admin.notificationRules.existing}">Vorhandene Regeln</h2>
        <!--/* .table-responsive (REQ-UI-009): seven columns of rule metadata measure 1303px, which
             is wider than every device class this app supports — the page scrolled SIDEWAYS even at
             1280px, and on a phone it widened the layout viewport to 1329px and took the header and
             the notification bell out of view with it. Found the day /admin/notification-rules was
             added to the touch-class sweep, having never been measured before.
             #rules-host is the swap container: after a create, update or delete notification-rules.js
             re-fetches the `rules` fragment (?fragment=rules) into it instead of reloading the page
             (REQ-FE-001). The load-failure message lives inside the fragment, so a swap that finds
             the backend down says so in place. */-->
        <div class="table-responsive" id="rules-host">
        <th:block th:fragment="rules">
        <table id="rules-table">
            <thead>
            <tr>
                <th th:text="#{admin.notificationRules.eventType}">Ereignis</th>
                <th th:text="#{admin.notificationRules.notificationType}">Benachrichtigungstyp</th>
                <th th:text="#{admin.notificationRules.enabled}">Aktiv</th>
                <th th:text="#{admin.notificationRules.selectors}">Empfänger-Selektoren</th>
                <th th:text="#{admin.notificationRules.description}">Beschreibung</th>
                <th th:text="#{admin.notificationRules.actions}">Aktion</th>
            </tr>
            </thead>
            <tbody>
            <!--/* A code this page has no label for (a backend enum value newer than the bundles)
                 shows as the raw code rather than as ??key??. */-->
            <tr th:each="r : ${rules}" th:attr="data-rule-id=${r.id}">
                <td th:text="${#messages.msgOrNull('admin.notificationRules.eventType.' + r.eventType) ?: r.eventType}">Auftrag angelegt</td>
                <td th:text="${#messages.msgOrNull('admin.notificationRules.notificationType.' + r.notificationType) ?: r.notificationType}">Auftrag angelegt</td>
                <td th:text="${r.enabled} ? '✓' : '–'">✓</td>
                <td th:text="${#lists.size(r.selectors)}">4</td>
                <td th:text="${r.description}">…</td>
                <td>
                    <button type="button" class="btn btn-icon" data-rule-edit
                            th:title="#{admin.notificationRules.edit}" th:aria-label="#{admin.notificationRules.edit}">
                        <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-edit"></use></svg>
                    </button>
                    <button type="button" class="btn btn-quiet-danger btn-icon" data-rule-delete
                            th:title="#{admin.notificationRules.delete}" th:aria-label="#{admin.notificationRules.delete}">
                        <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"></use></svg>
                    </button>
                </td>
            </tr>
            <tr th:if="${error}">
                <td colspan="6" class="text-danger" th:text="#{${error}}">Fehler beim Laden.</td>
            </tr>
            <tr th:if="${error == null and #lists.isEmpty(rules)}">
                <td colspan="6" th:text="#{admin.notificationRules.empty}">Noch keine Regeln.</td>
            </tr>
            </tbody>
        </table>
        </th:block>
        </div>
    </div>

    <div class="hud-box mt-2">
        <h2 id="rule-form-title" th:text="#{admin.notificationRules.create}">Regel anlegen</h2>
        <form id="rule-form" data-rule-id="">
            <input type="hidden" id="rule-version" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label for="rule-eventType" th:text="#{admin.notificationRules.eventType}">Ereignis</label>
                    <!--/* Every option list on this page is rendered from the controller's code lists
                         (backend enum declaration order); the value stays the enum code, the text is
                         its localized label. */-->
                    <select id="rule-eventType">
                        <option th:each="code : ${eventTypes}" th:value="${code}"
                                th:text="#{admin.notificationRules.eventType.__${code}__}">Auftrag angelegt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rule-notificationType" th:text="#{admin.notificationRules.notificationType}">Benachrichtigungstyp</label>
                    <select id="rule-notificationType">
                        <option th:each="code : ${notificationTypes}" th:value="${code}"
                                th:text="#{admin.notificationRules.notificationType.__${code}__}">Auftrag angelegt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rule-description" th:text="#{admin.notificationRules.description}">Beschreibung</label>
                    <input type="text" id="rule-description" maxlength="255">
                </div>
            </div>
            <div class="form-grid mt-2">
                <div class="form-group">
                    <label><input type="checkbox" id="rule-enabled" checked>
                        <span th:text="#{admin.notificationRules.enabled}">Aktiv</span></label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="rule-excludeActor" checked>
                        <span th:text="#{admin.notificationRules.excludeActor}">Ersteller ausnehmen</span></label>
                </div>
            </div>

            <h3 class="mt-2" th:text="#{admin.notificationRules.selectors}">Empfänger-Selektoren</h3>
            <div id="selectors-container"></div>
            <button type="button" class="btn btn-secondary" id="add-selector"
                    th:text="#{admin.notificationRules.addSelector}">Selektor hinzufügen</button>

            <div class="mt-2">
                <button type="submit" class="btn btn--cta" th:text="#{admin.notificationRules.save}">Speichern</button>
                <button type="button" class="btn btn-secondary" id="rule-cancel"
                        th:text="#{general.cancel}">Abbrechen</button>
            </div>
        </form>
    </div>

    <template id="selector-row-template">
        <div class="selector-row" data-selector-row>
            <div class="form-group">
                <label th:text="#{admin.notificationRules.selector.kind}">Art</label>
                <!--/* A new row is set to ORG_RELATIVE_ROLE by notification-rules.js, not to the first
                     option, so an empty row never starts out as a user picker with no user. */-->
                <select data-selector-kind>
                    <option th:each="code : ${selectorKinds}" th:value="${code}"
                            th:text="#{admin.notificationRules.selector.kind.__${code}__}">Bestimmter Nutzer</option>
                </select>
            </div>
            <div class="form-group" data-field="orgRelativeRole">
                <label th:text="#{admin.notificationRules.selector.orgRelativeRole}">Org-relative Rolle</label>
                <select data-selector-orgRelativeRole>
                    <option th:each="code : ${orgRelativeRoles}" th:value="${code}"
                            th:text="#{admin.notificationRules.selector.orgRelativeRole.__${code}__}">Offizier</option>
                </select>
            </div>
            <div class="form-group" data-field="contextRole">
                <label th:text="#{admin.notificationRules.selector.contextRole}">Kontext-Einheit</label>
                <select data-selector-contextRole>
                    <option th:each="code : ${contextRoles}" th:value="${code}"
                            th:text="#{admin.notificationRules.selector.contextRole.__${code}__}">Zuständige Einheit</option>
                </select>
            </div>
            <div class="form-group" data-field="roleCode">
                <label th:text="#{admin.notificationRules.selector.roleCode}">Rollencode</label>
                <select data-selector-roleCode>
                    <option th:each="code : ${roleCodes}" th:value="${code}"
                            th:text="#{admin.notificationRules.selector.roleCode.__${code}__}">Admin</option>
                </select>
            </div>
            <!--/* The three event-derived kinds (ACCOUNT_GRANT, EVENT_RECIPIENT, ACCOUNT_RESPONSIBLE)
                 have no further field: the account or the recipient comes from the event. */-->
            <div class="form-group" data-field="fromEvent">
                <p class="form-hint" th:text="#{admin.notificationRules.selector.fromEvent}">Die Empfänger ergeben sich aus dem Ereignis.</p>
            </div>
            <div class="form-group" data-field="userId">
                <label th:text="#{admin.notificationRules.selector.userId}">Benutzer</label>
                <!--/* Server-side searchable combobox (remote-users, #1193): the roster is searched on
                     demand via /users/search. An existing rule's chosen user is seeded in edit mode
                     by notification-rules.js (resolves the name via /users/{id}). */-->
                <select data-selector-userId data-krt-combobox="remote-users">
                    <option value="" th:text="#{admin.notificationRules.selector.userId.placeholder}">-- Nutzer wählen --</option>
                </select>
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-quiet-danger" data-selector-remove
                        th:text="#{admin.notificationRules.removeSelector}">Entfernen</button>
            </div>
        </div>
    </template>
</main>

<script th:src="@{/js/notification-rules.js}" th:attr="nonce=${cspNonce}"></script>
</body>
</html>
