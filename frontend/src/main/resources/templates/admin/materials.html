<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{admin.materials.title} + ' - ' + ${appTitle}">Materialien verwalten - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
    <link rel="stylesheet" th:href="@{/css/promotion-admin.css}">
    <link rel="stylesheet" th:href="@{/css/pages/admin-materials.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.masterdata', titleText=#{admin.materials.title},
        count=${materials != null ? materials.size() : null}, countId='materials-count', countFor='materials-results', actions=~{::materials-actions})}">
        <th:block th:ref="materials-actions">
            <button type="button" class="btn btn--cta" data-trigger="materials-open-create-modal" data-testid="page-head-primary"
                    th:text="#{admin.materials.create.button}">Material anlegen</button>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/components :: alert('danger', ${error}, null)}"></th:block>

    <th:block th:if="${catalogTruncated}">
        <div th:replace="~{fragments/components :: alert('warning', 'admin.catalog.truncated', null)}"></div>
    </th:block>

    <div class="toolbar">
        <div class="toolbar__search">
            <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-search"/></svg>
            <input type="search" id="filterMaterials" autocomplete="off" data-testid="toolbar-search"
                   data-trigger="filter-table" data-table-id="materialsTable"
                   th:attr="placeholder=#{general.filter.name.placeholder},aria-label=#{general.filter.name.placeholder}">
        </div>
        <datalist id="materialNames-data" hidden>
            <option th:each="mat : ${materials}" th:value="${mat.name}"></option>
        </datalist>
    </div>

    <div id="materials-results" class="card card--flush">
        <div data-materials-table th:hidden="${materials == null or materials.isEmpty()}"
             th:data-list-total="${materials != null ? materials.size() : 0}">
            <div class="table-responsive">
                <table id="materialsTable" class="data-table data-table--stack admin-materials-table">
                    <thead>
                        <tr>
                            <th th:text="#{admin.material.name}">Name</th>
                            <th th:text="#{admin.material.type}">MaterialType</th>
                            <th th:text="#{admin.materials.quantityType}">Mengentyp</th>
                            <th th:text="#{admin.materials.categories.name}">Kategorie</th>
                            <th th:text="#{admin.material.refined}">Veredeltes Material</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="mat : ${materials}" th:data-mat-id="${mat.id}" th:data-version="${mat.version}" data-testid="material-row">
                            <td>
                                <span class="cell-title" th:text="${mat?.name}">Name</span>
                                <div class="cluster gap-1 admin-material-flags"
                                     th:if="${mat?.isManualEntry == true or mat?.isVisible == false or mat?.isIllegal == true or mat?.isVolatileQt == true or mat?.isVolatileTime == true}">
                                    <span th:if="${mat?.isManualEntry == true}" class="material-manual-badge" th:title="#{admin.material.manual_entry.tooltip}" th:text="#{admin.material.manual_entry}">Manuell</span>
                                    <span th:if="${mat?.isVisible == false}" class="material-hidden-badge" th:title="#{admin.material.hidden.tooltip}" th:text="#{admin.material.hidden}">Versteckt</span>
                                    <span th:if="${mat?.isIllegal == true}" class="text-danger admin-material-flag" th:title="#{material.is_illegal}">&#9888;</span>
                                    <span th:if="${mat?.isVolatileQt == true}" class="text-warning admin-material-flag" th:title="#{material.is_volatile_qt}">&#9888;</span>
                                    <span th:if="${mat?.isVolatileTime == true}" class="text-warning admin-material-flag" th:title="#{material.is_volatile_time}">&#9888;</span>
                                </div>
                            </td>
                            <td th:attr="data-label=#{admin.material.type}">
                                <span class="nowrap" th:text="${mat?.type != null ? #messages.msg('material.type.' + mat.type) : '-'}">Type</span>
                                <div sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)" class="stack gap-1 admin-material-toggles">
                                    <label class="admin-material-toggle">
                                        <input type="checkbox" name="isManualRawMaterial" data-update-type="MANUAL_RAW" th:checked="${mat.isManualRawMaterial == true}" data-trigger="admin-materials-update" />
                                        <span th:text="#{admin.material.manual_raw}">Manuelles Rohmaterial</span>
                                    </label>
                                    <label class="admin-material-toggle">
                                        <input type="checkbox" name="isJobOrder" data-update-type="JOB_ORDER" th:checked="${mat.isJobOrder == true}" data-trigger="admin-materials-update" />
                                        <span th:text="#{admin.material.job_order}">Auftrag</span>
                                    </label>
                                    <label class="admin-material-toggle">
                                        <input type="checkbox" name="isVisible" data-update-type="VISIBILITY" th:checked="${mat.isVisible != false}" data-trigger="admin-materials-update" />
                                        <span th:text="#{admin.material.visible}">Sichtbar</span>
                                    </label>
                                </div>
                            </td>
                            <td th:attr="data-label=#{admin.materials.quantityType}">
                                <select name="quantityType" data-update-type="QUANTITY_TYPE" data-trigger="admin-materials-update" class="w-full"
                                        th:attr="aria-label=#{admin.materials.quantityType}">
                                    <option value="SCU" th:text="#{admin.materials.quantityType.scu}" th:selected="${mat.quantityType == 'SCU' || mat.quantityType == null}">SCU</option>
                                    <option value="PIECE" th:text="#{admin.materials.quantityType.piece}" th:selected="${mat.quantityType == 'PIECE'}">Stück</option>
                                </select>
                            </td>
                            <td th:attr="data-label=#{admin.materials.categories.name}">
                                <select name="categoryId" data-update-type="CATEGORY" data-trigger="admin-materials-update" class="w-full"
                                        th:attr="aria-label=#{admin.materials.categories.name}">
                                    <option value="" th:text="#{admin.materials.categories.unsorted}">Unsortiert</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${mat.category != null and mat.category.id == cat.id}">Category</option>
                                </select>
                            </td>
                            <td th:attr="data-label=#{admin.material.refined}">
                                <th:block th:if="${mat?.type == 'RAW' or mat?.isManualRawMaterial == true}">
                                    <select sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)" name="refinedMaterialId" data-update-type="REFINED" data-trigger="admin-materials-update" class="w-full"
                                            th:attr="aria-label=#{admin.material.refined}">
                                        <option value="" th:text="#{general.please_select}">Bitte wählen...</option>
                                        <option th:each="rm : ${refinedMaterials}" th:value="${rm.id}" th:text="${rm.name}" th:selected="${mat.refinedMaterial != null and mat.refinedMaterial.id == rm.id}">Refined Material</option>
                                    </select>
                                    <span sec:authorize="!hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)" th:text="${mat.refinedMaterial != null ? mat.refinedMaterial.name : '-'}">-</span>
                                </th:block>
                                <th:block th:if="${mat?.type != 'RAW' and mat?.isManualRawMaterial != true}">
                                    <span>-</span>
                                </th:block>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <th:block th:if="${materials == null or materials.isEmpty()}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='admin.materials.empty', textKey='admin.materials.empty.text')}"></th:block>
        </th:block>
    </div>

    <section class="card admin-materials-categories" aria-labelledby="material-categories-title">
        <div class="card-head">
            <h2 id="material-categories-title" class="card-title" th:text="#{admin.materials.categories.title}">Kategorien verwalten</h2>
        </div>
        <form method="post" th:action="@{/admin/materials/categories}" class="cluster gap-2 admin-materials-category-form" data-category-create>
            <input type="text" name="name" required class="grow" th:placeholder="#{general.name}" th:attr="aria-label=#{general.name}">
            <button type="submit" class="btn btn-ghost" th:text="#{general.add}">Hinzufügen</button>
        </form>
        <div data-category-table th:hidden="${categories == null or categories.isEmpty()}">
            <div class="table-responsive">
                <table class="data-table data-table--stack">
                    <thead>
                        <tr>
                            <th th:text="#{admin.materials.categories.name}">Kategorie</th>
                            <th class="cell-actions"><span class="visually-hidden" th:text="#{general.action}">Aktion</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}" data-category-row>
                            <td><span class="cell-title" th:text="${cat.name}">Category Name</span></td>
                            <td class="cell-actions">
                                <form method="post" th:action="@{/admin/materials/categories/{id}/delete(id=${cat.id})}" class="m-0"
                                      data-krt-confirm th:data-krt-confirm-message="#{admin.materials.categories.delete.confirm}"
                                      th:data-category-id="${cat.id}">
                                    <button type="submit" class="btn btn-quiet-danger btn-icon" th:title="#{general.delete}" th:aria-label="#{general.delete}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="empty-state" data-testid="empty-state" data-category-empty th:hidden="${categories != null and !categories.isEmpty()}">
            <th:block th:replace="~{fragments/components :: emptyStateBody('admin.materials.categories.empty', 'admin.materials.categories.empty.text', null)}"></th:block>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='modal-create-material', titleKey='admin.materials.create.modal.title', variant='krt-modal--wide krt-modal-create-material', titleId='modal-create-material-title', closeTrigger='materials-close-create-modal', body=~{::modal-create-material-body})}">
    <th:block th:ref="modal-create-material-body">
        <div class="krt-modal-body">
        <p class="form-hint mb-1" th:text="#{admin.materials.create.modal.intro}">Für Materialien, die noch nicht in UEX vorhanden sind.</p>

        <div class="form-group">
            <label class="form-label" for="cm-name" th:text="#{admin.materials.create.field.name}">Name</label>
            <input id="cm-name" class="form-input" type="text" maxlength="255" required th:placeholder="#{admin.materials.create.field.name.placeholder}">
            <span class="form-hint" th:text="#{admin.materials.create.field.name.help}">Eindeutig, identisch zum späteren UEX-Namen.</span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="cm-type" th:text="#{admin.materials.create.field.type}">Typ</label>
                <select id="cm-type" class="form-input" required>
                    <option value="RAW" th:text="#{material.type.RAW}">Rohmaterial</option>
                    <option value="REFINED" th:text="#{material.type.REFINED}">Veredelt</option>
                    <option value="NO_REFINE" th:text="#{material.type.NO_REFINE}">Nicht veredelbar</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="cm-quantity-type" th:text="#{admin.materials.create.field.quantityType}">Mengentyp</label>
                <select id="cm-quantity-type" class="form-input" required>
                    <option value="SCU" th:text="#{admin.materials.quantityType.scu}">SCU</option>
                    <option value="PIECE" th:text="#{admin.materials.quantityType.piece}">Stück</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="cm-description" th:text="#{admin.materials.create.field.description}">Beschreibung</label>
            <textarea id="cm-description" class="form-input" rows="2" maxlength="4000" th:placeholder="#{admin.materials.create.field.description.placeholder}"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="cm-refined" th:text="#{admin.materials.create.field.refined}">Veredeltes Material</label>
                <select id="cm-refined" class="form-input">
                    <option value="" th:text="#{general.please_select}">Bitte wählen...</option>
                    <option th:each="rm : ${refinedMaterials}" th:value="${rm.id}" th:text="${rm.name}">Refined</option>
                </select>
                <span class="form-hint" th:text="#{admin.materials.create.field.refined.help}">Nur bei RAW oder Manuelles Rohmaterial.</span>
            </div>
            <div class="form-group">
                <label class="form-label" for="cm-category" th:text="#{admin.materials.create.field.category}">Kategorie</label>
                <select id="cm-category" class="form-input">
                    <option value="" th:text="#{admin.materials.categories.unsorted}">Unsortiert</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" th:text="#{admin.materials.create.field.flags}">Flags</label>
            <div class="form-checkboxes">
                <label><input id="cm-manual-raw" type="checkbox" checked> <span th:text="#{admin.material.manual_raw}">Manuelles Rohmaterial</span></label>
                <label><input id="cm-job-order" type="checkbox"> <span th:text="#{admin.material.job_order}">Auftrag</span></label>
                <label><input id="cm-illegal" type="checkbox"> <span th:text="#{material.is_illegal}">Illegal</span></label>
                <label><input id="cm-volatile-qt" type="checkbox"> <span th:text="#{material.is_volatile_qt}">Flüchtig (QT)</span></label>
                <label><input id="cm-volatile-time" type="checkbox"> <span th:text="#{material.is_volatile_time}">Flüchtig (Zeit)</span></label>
            </div>
        </div>

        </div>
        <div class="krt-modal-foot">
            <button type="button" class="btn btn-ghost" data-trigger="materials-close-create-modal" th:text="#{general.cancel}">Abbrechen</button>
            <button type="button" class="btn btn--cta" data-trigger="materials-submit-create" th:text="#{admin.materials.create.submit}">Anlegen</button>
        </div>
    </th:block>
</th:block>

<script th:src="@{/js/autocomplete.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const CAT_MSG = {
        createSuccess: /*[[#{notification.success.save}]]*/ 'Gespeichert.',
        createError:   /*[[#{notification.error.save}]]*/ 'Speichern fehlgeschlagen.',
        deleteSuccess: /*[[#{notification.success.delete}]]*/ 'Gelöscht.',
        deleteError:   /*[[#{notification.error.delete}]]*/ 'Löschen fehlgeschlagen.',
        deleteConfirm: /*[[#{admin.materials.categories.delete.confirm}]]*/ 'Wirklich löschen?',
        deleteTitle:   /*[[#{general.delete}]]*/ 'Löschen'
    };
    const CAT_CONFLICT = {
        title:                /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Bitte neu laden.',
        reloadLabel:          /*[[#{frontend.ajax.conflict.reload}]]*/ 'Aktuelle Werte laden',
        dismissLabel:         /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        reloadQuestion:       /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
    const MSG_UPDATE_SUCCESS = /*[[#{notification.success.save}]]*/ 'Erfolgreich gespeichert.';
    const MSG_UPDATE_ERROR = /*[[#{notification.error.save}]]*/ 'Fehler beim Speichern.';
    const MSG_CREATE_SUCCESS = /*[[#{admin.materials.create.success}]]*/ 'Material wurde angelegt.';
    const MSG_CREATE_ERROR = /*[[#{admin.materials.create.error}]]*/ 'Material konnte nicht angelegt werden.';
</script>
<script th:src="@{/js/admin-materials.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
