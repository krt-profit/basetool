<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="${specialCommand != null ? specialCommand.name() + ' - ' + appTitle : appTitle}">Spezialkommando - IRIDIUM Basetool</title>
    <th:block th:fragment="extraLinks">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <link rel="stylesheet" th:href="@{/css/organisation-unit-detail.css}">
        <link rel="stylesheet" th:href="@{/css/pages/organisation-special-command-detail.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main th:with="backHref=${canToggleLead or specialCommand == null} ? ${backUrl} : ${backUrl + '?unit=' + specialCommand.id()}">
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey=${canToggleLead ? 'admin.specialcommands.title' : 'leitung.title'}, eyebrowHref=@{${backHref}},
        titleText=${specialCommand != null ? specialCommand.name() : ''}, actions=~{::sk-actions})}">
        <th:block th:ref="sk-actions">
            <button id="add-member-btn" class="btn btn--cta" type="button" data-testid="page-head-primary"
                    ><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-user-plus"/></svg><span th:text="#{admin.specialcommands.members.add}">Mitglied hinzufügen</span></button>
        </th:block>
    </th:block>

    <p class="sk-meta" th:if="${specialCommand != null}">
        <span class="page-eyebrow" th:text="${specialCommand.shorthand() != null} ? (#{admin.orgStructure.kind.SPECIAL_COMMAND} + ' · ' + ${specialCommand.shorthand()}) : #{admin.orgStructure.kind.SPECIAL_COMMAND}">Spezialkommando · SHRT</span>
        <span class="sk-meta__description"
              th:if="${specialCommand.description() != null and !#strings.isEmpty(specialCommand.description())}"
              th:text="${specialCommand.description()}">Beschreibung</span>
    </p>

    <div class="card card--flush unit-detail" id="members-box" th:data-sc-id="${specialCommand != null ? specialCommand.id() : ''}">
        <div class="tab-nav unit-tabs" role="tablist" th:aria-label="${specialCommand != null ? specialCommand.name() : ''}">
            <button type="button" class="tab active" role="tab" aria-selected="true" id="sk-tab-members" aria-controls="members-results"
                    ><span th:text="#{admin.specialcommands.members.title}">Mitglieder</span> <span class="tab-count" id="sk-members-count" th:text="${members != null ? #lists.size(members) : 0}">0</span></button>
        </div>
        <div id="members-results" class="unit-tabpanel" role="tabpanel" aria-labelledby="sk-tab-members">
        <th:block th:fragment="membersResults">
            <th:block th:replace="~{organisation/unit-detail :: skRoster(skId=${specialCommand.id()}, members=${members}, showFlags=true, canLead=${canToggleLead}, canRemove=true, leadMode='admin', selfUserId=null, admin=true, refreshUrl=${'/organisation/special-commands/' + specialCommand.id()}, refreshContainer='#members-results', refreshFragment='members')}"></th:block>
        </th:block>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='add-member-modal', titleKey='admin.specialcommands.members.add', closeTrigger='', closeClass='close-add-member-modal', body=~{::add-member-modal-body})}">
    <th:block th:ref="add-member-modal-body">
        <form th:action="@{/organisation/special-commands/{id}/members(id=${specialCommand.id()})}" method="post">
            <div class="krt-modal-body">
                <div class="form-group">
                    <label for="add-member-userid" th:text="#{admin.specialcommands.members.user_picker}">Nutzer</label>
                    <select id="add-member-userid" name="userId" required data-krt-combobox="remote-users">
                        <option value="" th:text="#{admin.specialcommands.members.user_picker.placeholder}">-- Bitte wählen --</option>
                    </select>
                </div>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost close-add-member-modal" th:text="#{general.cancel}">Abbrechen</button>
                <button type="submit" class="btn btn--cta" th:text="#{admin.specialcommands.members.add.submit}">Hinzufügen</button>
            </div>
        </form>
    </th:block>
</th:block>

<th:block th:replace="~{fragments/toast :: toast}"/>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    var MEMBER_MSG = {
        saved: /*[[#{notification.success.save}]]*/ 'Gespeichert.',
        deleted: /*[[#{notification.success.delete}]]*/ 'Entfernt.',
        error: /*[[#{notification.error.save}]]*/ 'Fehler.',
        confirm: /*[[#{general.confirm}]]*/ 'Bestätigen',
        cancel: /*[[#{general.cancel}]]*/ 'Abbrechen',
        confirmRemove: /*[[#{leitung.confirm.remove}]]*/ 'Wirklich entfernen?',
        confirmPromote: /*[[#{leitung.confirm.skLeadPromote}]]*/ 'Ernennen?',
        confirmDemote: /*[[#{leitung.confirm.skLeadDemote}]]*/ 'Entfernen?'
    };
    var MEMBER_CONFLICT = {
        title: /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Neu laden.',
        reloadLabel: /*[[#{frontend.ajax.conflict.reload}]]*/ 'Neu laden',
        dismissLabel: /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        reloadQuestion: /*[[#{frontend.ajax.conflict.question}]]*/ 'Neu laden?'
    };
</script>
<script th:src="@{/js/special-command-detail.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
