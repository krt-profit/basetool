<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="holderRoute(r)" th:with="linked=${r.linked()}"
          th:text="${@handles.display(r.holderHandle())} + ' &#8594; ' + ${@handles.display(linked.destinationHolderHandle())}">nova &#8594; talon</th:block>
<span th:fragment="fee(r)" th:if="${r.linked() != null and r.type() != 'AUTHORISATION' and r.type() != 'DEPOSIT'}"
      class="cell-sub" data-linked-fee data-testid="bank-request-linked-fee"
      th:with="feeKey=${r.holderTransfer() ? 'bank.request.linked.krtFee' : 'bank.request.linked.fee'}"
      th:text="#{__${feeKey}__(${#numbers.formatInteger(@moneyFormat.round(r.linked().fee()), 1, 'DEFAULT')})}">Transfergeb&uuml;hr 20.000 aUEC</span>
</body>
</html>
