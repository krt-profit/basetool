<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="${gameItemName ?: #messages.msg('inventory.items.drilldown.title')} + ' - ' + ${appTitle}">Item - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/inventory-game-item.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.inventory', eyebrowHref=@{/inventory(view='items')},
        titleText=${gameItemName ?: #messages.msg('inventory.items.drilldown.title')},
        count=${inventoryGameItemPage != null ? inventoryGameItemPage.totalElements() : null},
        countId='inventory-game-item-count', countFor='inventory-game-item-results', actions=null)}"></th:block>

    <div id="inventory-game-item-results" class="card card--flush">
        <th:block th:fragment="inventoryGameItemResults">
        <div th:if="${error}" class="alert alert-danger drill-alert" role="alert" th:text="#{__${error}__}">Fehler</div>

        <table th:if="${!#lists.isEmpty(items)}" class="data-table data-table--stack">
            <thead>
                <tr>
                    <th th:text="#{inventory.items.drilldown.col.user}">Nutzer</th>
                    <th th:text="#{inventory.items.drilldown.col.location}">Ort</th>
                    <th class="num" th:text="#{inventory.items.drilldown.col.amount}">Menge</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}" data-testid="inventory-game-item-row">
                    <td><span class="cell-title" th:text="${item.user.effectiveName}">Username</span></td>
                    <td th:attr="data-label=#{inventory.items.drilldown.col.location}" th:text="${item.location.name}">Ort</td>
                    <td class="num" th:attr="data-label=#{inventory.items.drilldown.col.amount}"><span th:text="${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'}">10</span> <span th:text="#{material.quantity.piece}">St&uuml;ck</span></td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(items)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='inventory.items.drilldown.empty', textKey='inventory.drilldown.empty.text')}"></th:block>
        </th:block>

        <div class="list-foot" th:if="${inventoryGameItemPage != null and inventoryGameItemPage.totalElements() > 0}"
             th:data-list-total="${inventoryGameItemPage.totalElements()}"
             th:with="itemBase=${'/inventory/game-item/' + selectedGameItemId}">
            <span data-testid="list-count"
                  th:text="#{list.countOf(${inventoryGameItemPage.page() * inventoryGameItemPage.size() + 1}, ${inventoryGameItemPage.page() * inventoryGameItemPage.size() + #lists.size(inventoryGameItemPage.content())}, ${inventoryGameItemPage.totalElements()})}">1–50 von 120</span>
            <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${inventoryGameItemPage}, baseUrl=${itemBase}, sizes=${pageSizes})}"></nav>
            <nav th:replace="~{fragments/pagination :: pagination(pageResponse=${inventoryGameItemPage}, baseUrl=${itemBase})}"></nav>
        </div>
        </th:block>
    </div>
</main>
<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/inventory-game-item.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
