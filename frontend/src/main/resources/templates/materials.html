<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{nav.materials.list} + ' - ' + ${appTitle}">Materialien - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/materials.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.materials', titleText=#{nav.materials.list},
        count=${materials != null ? #lists.size(materials) : null}, countId='materials-count')}"></th:block>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{__${error}__}">Fehler</div>

    <div class="toolbar">
        <div class="toolbar__search">
            <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-search"/></svg>
            <input type="search" id="materialFilter" data-trigger="materials-filter" autocomplete="off"
                   data-testid="toolbar-search"
                   th:attr="placeholder=#{filter.material.placeholder},aria-label=#{filter.material}">
            <datalist id="materialNames-data">
                <option th:each="mat : ${materials}" th:value="${mat.name}"></option>
            </datalist>
        </div>
        <label class="switch" data-testid="materials-group-switch">
            <input type="checkbox" id="groupByCategory" data-trigger="materials-toggle-grouping" checked>
            <span class="switch__track" aria-hidden="true"></span>
            <span th:text="#{filter.groupByCategory}">Nach Kategorie gruppieren</span>
        </label>
    </div>

    <div id="materialsGrouped" class="stack gap-3">
        <section th:each="entry, kind : ${materialsByKind}" class="kind-group"
                 th:with="kindId=${'materials-kind-' + kind.index}">
            <h2 class="kind-head">
                <button type="button" class="kind-toggle" data-trigger="materials-toggle-kind"
                        aria-expanded="false" th:aria-controls="${kindId}">
                    <svg class="krt-icon kind-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                    <span class="kind-name" th:text="${entry.key == 'Unsortiert' ? #messages.msg('material.category.unsorted') : entry.key}">Kategorie Name</span>
                    <span class="chip chip--muted kind-count" th:text="${#lists.size(entry.value)}">3</span>
                </button>
            </h2>

            <div class="grid-auto-cards materialsGrid" th:id="${kindId}" hidden>
                <th:block th:each="mat : ${entry.value}">
                    <div th:replace="~{fragments/material-card :: materialCard(${mat})}"></div>
                </th:block>
            </div>
        </section>
    </div>

    <div id="materialsFlat" class="grid-auto-cards" hidden>
        <th:block th:each="mat : ${materials}">
            <div th:replace="~{fragments/material-card :: materialCard(${mat})}"></div>
        </th:block>
    </div>

    <div id="noResultsMsg" class="card card--flush" th:hidden="${materials != null and !materials.isEmpty()}">
        <th:block th:replace="~{fragments/components :: emptyState(titleKey='materials.list.noResults', textKey='materials.list.noResults.text')}"></th:block>
    </div>
</main>

<script th:src="@{/js/autocomplete.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/materials.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
