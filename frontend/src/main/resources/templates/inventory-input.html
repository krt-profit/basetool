<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{inventory.input.title} + ' - Profit Basetool'">Lagereintrag einbuchen - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<style th:attr="nonce=${cspNonce}">
        .form-container {
            max-width: 600px;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--color-surface-input);
            border: 1px solid var(--color-gray-3);
            color: var(--color-gray-1);
            font-family: var(--font-body);
            box-sizing: border-box;
        }
    </style>
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/krt.webp}" alt="Logo" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1 th:text="#{inventory.input.title}">Lagereintrag einbuchen</h1>
    </div>

    <div class="hud-box mt-2">
        <div th:if="${error}" class="hud-box hud-box-error">
            <p th:text="#{__${error}__}">Fehler</p>
        </div>


        <div class="form-container">
            <form id="inventory-input-form" th:action="@{/inventory/input}" method="post" th:object="${inventoryForm}">
                <div th:if="${#fields.hasErrors('*')}" class="hud-box hud-box-error">
                    <ul class="text-danger">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Fehler</li>
                    </ul>
                </div>
                <input type="hidden" th:field="*{isGlobal}" />
                <input type="hidden" th:field="*{source}" />
                
                <div class="form-group" th:if="*{isGlobal}">
                    <label for="userId">Nutzer zuordnen</label>
                    <!-- #1193: server-side user search (remote-users) replaces the preloaded ${users} full list; the roster is queried on demand via /users/search. The empty option ("own entry") stays as the placeholder / self-assign choice. -->
                    <select id="userId" th:field="*{userId}" data-krt-combobox="remote-users">
                        <option value="">-- Eigener Eintrag --</option>
                        <option th:if="${selectedUser != null}" th:value="${selectedUser.id}" th:text="${selectedUser.effectiveName != null ? selectedUser.effectiveName : selectedUser.username}"></option>
                    </select>
                </div>

                <th:block th:replace="~{fragments/owner-picker :: ownerPicker(options=${ownerOptions}, name='owningOrgUnitId', selected=*{owningOrgUnitId}, required=false)}"></th:block>

                <div class="form-group">
                    <label for="materialId">Material</label>
                    <select id="materialId" th:field="*{materialId}" required>
                        <option value="" data-quantity-type="">-- Bitte wählen --</option>
                        <option th:each="mat : ${materials}" th:value="${mat.id}" th:data-quantity-type="${mat.quantityType}" th:text="${mat.name}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="locationId">Ort</label>
                    <select id="locationId" th:field="*{locationId}" required>
                        <option value="">-- Bitte wählen --</option>
                        <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="quality">Qualität</label>
                    <input type="number" id="quality" th:field="*{quality}" min="0" max="1000" value="100" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Menge <span id="amount-unit"></span><th:block th:replace="~{fragments/scu-hint :: scuHint('amount-scu-hint', true)}"></th:block></label>
                    <input type="text" inputmode="decimal" data-scu-decimal id="amount" th:field="*{amount}" step="0.001" min="0" required>
                </div>
                
                <!-- Variante C (REQ-INV-027, R4): split at check-in — assign the new stock to several
                     job orders / missions with their own amounts. inventory-input.js clones a row
                     from the hidden template and binds it as indexed params the FormData submit
                     carries; an empty section falls back to no assignment. -->
                <div class="form-group" id="jobOrderAllocGroup">
                    <label th:text="#{inventory.input.orders.label}">Aufträge zuordnen (optional)</label>
                    <div id="jobOrderAllocRows" data-alloc-rows="jobOrder"></div>
                    <button type="button" class="btn btn-ghost" data-trigger="inv-input-add-order" th:text="#{inventory.assoc.add.order}">+ Auftrag</button>
                    <template id="jobOrderRowTemplate">
                        <div class="flex-gap-sm mb-1" data-alloc-row>
                            <select class="w-full" data-alloc-target>
                                <option value="" th:text="#{inventory.order.none}">-- Kein Auftrag --</option>
                                <option th:each="order : ${jobOrders}" th:value="${order.id}" th:data-materials="${order.materials != null and !order.materials.isEmpty() ? #strings.listJoin(order.materials.![material.id], ',') : ''}" th:text="${'#' + order.displayId + ' - ' + order.handle + ' (' + order.status + ')'}"></option>
                            </select>
                            <input type="number" class="assoc-menge-input" data-alloc-amount step="0.001" min="0" th:placeholder="#{inventory.assoc.amount}">
                            <button type="button" class="btn btn-ghost" data-trigger="inv-input-remove-alloc" th:title="#{inventory.assoc.remove}" th:aria-label="#{inventory.assoc.remove}">&#215;</button>
                        </div>
                    </template>
                </div>

                <div class="form-group" id="missionAllocGroup">
                    <label th:text="#{inventory.input.missions.label}">Einsätze zuordnen (optional)</label>
                    <div id="missionAllocRows" data-alloc-rows="mission"></div>
                    <button type="button" class="btn btn-ghost" data-trigger="inv-input-add-mission" th:text="#{inventory.assoc.add.mission}">+ Einsatz</button>
                    <template id="missionRowTemplate">
                        <div class="flex-gap-sm mb-1" data-alloc-row>
                            <select class="w-full" data-alloc-target>
                                <option value="" th:text="#{inventory.mission.none}">-- Kein Einsatz --</option>
                                <option th:each="mission : ${missions}" th:value="${mission.id}" th:text="${mission.plannedStartTime != null} ? |${mission.name} - ${#temporals.format(mission.plannedStartTime, #messages.msg('format.date'), #locale)}| : ${mission.name}"></option>
                            </select>
                            <input type="number" class="assoc-menge-input" data-alloc-amount step="0.001" min="0" th:placeholder="#{inventory.assoc.amount}">
                            <button type="button" class="btn btn-ghost" data-trigger="inv-input-remove-alloc" th:title="#{inventory.assoc.remove}" th:aria-label="#{inventory.assoc.remove}">&#215;</button>
                        </div>
                    </template>
                </div>

                <p id="inputAllocOver" class="form-hint krtm-hidden" th:text="#{inventory.input.alloc.over}">Zuordnung übersteigt die Menge</p>

                <div class="form-group krtm-display-flex-align-items-center-gap-0-5rem-m-c9b5" th:unless="*{isGlobal}">
                    <input type="checkbox" id="personal" th:field="*{personal}" class="krtm-width-auto-margin-0-5449">
                    <label for="personal" th:text="#{inventory.personal.label}" class="krtm-margin-0-display-inline-block-00ba">Als persönlicher Eintrag markieren</label>
                    <span class="krtm-font-size-0-8rem-color-var-color-gray-2-marg-f610" th:text="#{inventory.personal.help}">Dieser Eintrag ist nur für dich sichtbar und taucht nicht im globalen Lager auf.</span>
                </div>

                <!-- REQ-INV-026: per-action stock-merge opt-in. Shown by inventory-input.js only for an
                     SCU material (a PIECE book-in always merges, so no choice is offered). -->
                <div class="form-group krtm-display-flex-align-items-center-gap-0-5rem-m-c9b5 krtm-hidden" id="merge-stock-row">
                    <input type="checkbox" id="mergeStock" th:field="*{mergeStock}" class="krtm-width-auto-margin-0-5449">
                    <label for="mergeStock" th:text="#{inventory.merge.label}" class="krtm-margin-0-display-inline-block-00ba">Mit vorhandenem Bestand zusammenführen</label>
                    <span class="krtm-font-size-0-8rem-color-var-color-gray-2-marg-f610" th:text="#{inventory.merge.help}">Fügt diese Menge mit vorhandenem, gleichartigem Bestand zu einem Eintrag zusammen. Gilt nur für diese Buchung.</span>
                </div>

                <div class="mt-2-flex-gap">
                    <button type="submit" class="btn btn--cta"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{general.save}">Speichern</span></button>
                    <a th:href="@{/inventory}" data-trigger="history-back" class="btn btn-ghost krtm-text-align-center-display-flex-align-items-c-a651" th:text="#{general.cancel}">Abbrechen</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    // Thymeleaf-interpolated i18n strings only; the imperative logic (both former blocks, combined in
    // document order) lives in the inventory-input.js page module loaded right after this bootstrap
    // (ADR-0069). The two unit labels replace the former raw '([[#{...}]])' text-inline sites.
    /*<![CDATA[*/
    const MSG_UNIT_PIECE = /*[[#{material.quantity.piece}]]*/ 'Stueck';
    const MSG_UNIT_SCU = /*[[#{material.quantity.scu}]]*/ 'SCU';
    const INV_ADD_MSG = {
        failed: /*[[#{error.inventory.add.failed}]]*/ 'Fehler.',
        personalAssignment: /*[[#{error.inventory.personal.assignment}]]*/ 'Ungueltig.',
        validation: /*[[#{error.validation.failed}]]*/ 'Eingaben pruefen.'
    };
    /*]]>*/
</script>
<script th:src="@{/js/inventory-input.js}" th:attr="nonce=${cspNonce}"></script>
</body>
</html>
