<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{error.generic.title} + ' - ' + ${appTitle}">System Error - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/error-error.css}">
    </th:block>
</head>
<body>

<header>
    <nav>
        <a th:href="@{/}" class="brand ml-1">
            <img th:src="@{/logos/basetool-logo.svg}" alt="" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>
<main>
    <div class="greeting hud-box error-container">
        <!--/* Display status code if available, otherwise 'ERROR' */-->
        <div class="error-code" th:text="${status} ?: 'ERROR'">ERROR</div>
        
        <div class="error-title" th:text="#{error.generic.title}">System Malfunction</div>
        
        <!--/* Display specific message if available, otherwise generic */-->
        <p class="error-message" th:text="${message} ?: #{error.generic.message}">
            Critical system failure detected. Technical personnel notified.
        </p>

        <!--/* Correlation id so the user can quote it to support (RFC-7807 hardening) */-->
        <p class="error-correlation" th:if="${correlationId}">
            <span th:text="#{error.correlationId}">Reference code</span>:
            <code th:text="${correlationId}">00000000-0000-0000-0000-000000000000</code>
        </p>

        <div class="error-actions">
            <a th:if="${unauthenticated}" th:href="@{/oauth2/authorization/keycloak}" class="btn-return btn-signin" th:text="#{error.signin}">Sign in</a>
            <a th:href="@{/}" class="btn-return" th:text="#{error.return}">Return to Base</a>
        </div>
    </div>
</main>
<script th:attr="nonce=${cspNonce}">
    document.addEventListener('DOMContentLoaded', function() {
    });
</script>
</body>
</html>
