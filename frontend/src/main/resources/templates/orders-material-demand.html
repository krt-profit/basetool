<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{orders.demand.title} + ' - ' + ${appTitle}">Materialbedarf - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/orders-material-demand.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.logistics', titleText=#{orders.demand.title},
        actions=~{::demand-actions})}">
        <th:block th:ref="demand-actions">
            <a th:href="@{/orders}" class="btn btn-ghost" data-testid="demand-back-link"
               th:text="#{orders.demand.back}">Zurück zur Auftragsverwaltung</a>
        </th:block>
    </th:block>

    <div class="toolbar demand-toolbar">
        <th:block th:replace="~{fragments/components :: filterPopover(panelId='demandFilterPanel', panelName='material-demand',
            testid='demand-filter-toggle', body=~{::demand-filter-body})}">
            <th:block th:ref="demand-filter-body">
                <div class="demand-filter-field">
                    <span class="demand-filter-label" th:text="#{orders.demand.col.material}">Material</span>
                    <div class="multi-select-container" id="demandMaterialContainer">
                        <div class="multi-select-header" data-trigger="demand-toggle-multi"
                             data-multi-target="demandMaterialOptions" id="demandMaterialHeader"
                             th:data-all="#{filter.all}" th:data-selected="#{filter.selected}">
                            <span class="selected-text" id="demandMaterialSelectedText" th:text="#{filter.all}">Alle</span>
                        </div>
                        <div class="multi-select-options" id="demandMaterialOptions">
                            <div class="demand-material-search">
                                <input type="search" id="demandMaterialSearch" class="demand-search-input"
                                       data-trigger="demand-material-search" autocomplete="off"
                                       th:placeholder="#{filter.material.placeholder}"
                                       th:aria-label="#{filter.material.placeholder}"
                                       data-testid="demand-material-search">
                            </div>
                            <label class="multi-select-option demand-material-all">
                                <span th:text="#{filter.all}">Alle</span>
                                <input type="checkbox" id="demandMatAll" value="ALL" checked
                                       data-trigger="demand-toggle-material-all">
                            </label>
                            <label class="multi-select-option demand-material-option"
                                   th:each="mat : ${materialOptions}"
                                   th:data-material-name="${mat.name()}">
                                <span th:text="${mat.name()}">Titanium</span>
                                <input type="checkbox" class="demandMatCheck" th:value="${mat.id()}" checked
                                       data-trigger="demand-update-material-state">
                            </label>
                        </div>
                    </div>
                </div>

                <fieldset class="demand-filter-field demand-filter-qualities">
                    <legend class="demand-filter-label" th:text="#{orders.demand.col.quality}">Qualit&auml;t</legend>
                    <div class="demand-filter-checks">
                        <label class="demand-filter-check" th:each="tier : ${qualityOptions}">
                            <input type="checkbox" class="demandQualCheck" th:value="${tier.code()}" checked
                                   data-trigger="demand-update-quality"
                                   th:data-testid="${'demand-quality-' + #strings.toLowerCase(tier.code())}">
                            <span th:text="${tier.label(#locale)}">Keine</span>
                        </label>
                    </div>
                </fieldset>

                <label class="demand-filter-check">
                    <input type="checkbox" id="demandHideCovered"
                           data-trigger="demand-toggle-hide-covered" data-testid="demand-hide-covered">
                    <span th:text="#{orders.demand.filter.hideCovered}">Gedeckte ausblenden</span>
                </label>

                <button type="button" class="btn btn-ghost demand-filter-reset"
                        data-trigger="demand-reset-filters" data-testid="demand-filter-reset"
                        th:text="#{orders.demand.filter.reset}">Filter zur&uuml;cksetzen</button>
            </th:block>
        </th:block>
    </div>

    <div id="orders-material-demand-results" class="stack gap-6">
        <th:block th:fragment="demandResults">
        <th:block th:if="${demand == null or demand.groups() == null or demand.groups().isEmpty()}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='orders.demand.empty.title', textKey='orders.demand.empty')}"></th:block>
        </th:block>

        <th:block th:unless="${demand == null or demand.groups() == null or demand.groups().isEmpty()}">

            <section class="card card--flush demand-group" th:each="group : ${demand.groups()}"
                     data-testid="demand-group">
                <h2 class="demand-group-title">
                    <span th:if="${group.orgUnit() != null}" class="squadron-badge"
                          th:title="${group.orgUnit().name()}"
                          th:text="${group.orgUnit().shorthand()}">IRI</span>
                    <span th:if="${group.orgUnit() == null}" class="squadron-badge squadron-badge-muted"
                          th:title="#{orders.demand.group.unassigned}">—</span>
                    <span th:if="${group.orgUnit() != null}" th:text="${group.orgUnit().name()}">Iridium</span>
                    <span th:if="${group.orgUnit() == null}" th:text="#{orders.demand.group.unassigned}">Ohne bearbeitende Einheit</span>
                </h2>

                <div class="table-responsive">
                    <table class="data-table data-table--stack demand-table">
                        <thead>
                        <tr>
                            <th class="demand-sortable" data-sort-col="material" aria-sort="none">
                                <button type="button" class="demand-sort-btn" data-trigger="demand-sort"
                                        data-sort-key="material" data-testid="demand-sort-material">
                                    <span th:text="#{orders.demand.col.material}">Material</span>
                                    <span class="demand-sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="cell-status" th:text="#{orders.demand.col.quality}">Qualit&auml;t</th>
                            <th class="num demand-sortable" data-sort-col="required" aria-sort="none">
                                <button type="button" class="demand-sort-btn" data-trigger="demand-sort"
                                        data-sort-key="required" data-testid="demand-sort-required">
                                    <span th:text="#{orders.demand.col.required}">Bedarf</span>
                                    <span class="demand-sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="num demand-sortable" data-sort-col="booked" aria-sort="none">
                                <button type="button" class="demand-sort-btn" data-trigger="demand-sort"
                                        data-sort-key="booked" data-testid="demand-sort-booked">
                                    <span th:text="#{orders.demand.col.booked}">Bestand</span>
                                    <span class="demand-sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="num demand-sortable" data-sort-col="claimed" aria-sort="none">
                                <button type="button" class="demand-sort-btn" data-trigger="demand-sort"
                                        data-sort-key="claimed" data-testid="demand-sort-claimed">
                                    <span th:text="#{orders.demand.col.claimed}">Eintragungen</span>
                                    <span class="demand-sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="num demand-sortable" data-sort-col="outstanding" aria-sort="none">
                                <button type="button" class="demand-sort-btn" data-trigger="demand-sort"
                                        data-sort-key="outstanding" data-testid="demand-sort-outstanding">
                                    <span th:text="#{orders.demand.col.outstanding}">Offen</span>
                                    <span class="demand-sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th class="demand-coverage-head" th:text="#{orders.demand.col.coverage}">Deckung</th>
                        </tr>
                        </thead>
                        <tbody>
                        <th:block th:each="row : ${group.materials()}"
                                  th:with="bucketKey=${(group.orgUnit() != null ? group.orgUnit().id() : 'none') + '|' + row.material().id() + '|' + row.qualityRequirement()},
                                           req=${row.requiredAmount() ?: 0.0},
                                           bk=${row.bookedAmount() ?: 0.0},
                                           cl=${row.claimedAmount() ?: 0.0},
                                           bookedPct=${req > 0 ? (bk >= req ? 100.0 : bk * 100.0 / req) : 0.0},
                                           coveredPct=${req > 0 ? (bk + cl >= req ? 100.0 : (bk + cl) * 100.0 / req) : 0.0}">
                            <tr data-testid="demand-row" th:data-bucket-key="${bucketKey}"
                                th:data-material-id="${row.material().id()}"
                                th:data-material-name="${row.material().name()}"
                                th:data-quality="${row.qualityRequirement()}"
                                th:data-required="${row.requiredAmount()}"
                                th:data-booked="${row.bookedAmount()}"
                                th:data-claimed="${row.claimedAmount()}"
                                th:data-outstanding="${row.outstandingAmount()}">
                                <td>
                                    <button type="button" class="btn btn-ghost demand-orders-toggle"
                                            data-trigger="demand-toggle-orders"
                                            th:data-bucket-key="${bucketKey}"
                                            aria-expanded="false"
                                            th:aria-label="#{orders.demand.orders.toggle}">
                                        <span class="toggle-icon" aria-hidden="true">&#9654;</span>
                                        <span class="cell-title" th:text="${row.material().name()}" th:title="${row.material().name()}">Titanium</span>
                                        <span class="text-muted"
                                              th:text="'(' + ${row.orders() != null ? row.orders().size() : 0} + ')'">(0)</span>
                                    </button>
                                </td>
                                <td class="cell-status">
                                    <th:block th:replace="~{fragments/quality-tier :: badge(${row.qualityTier()})}"></th:block>
                                </td>
                                <td class="num" data-testid="demand-required" th:attr="data-label=#{orders.demand.col.required}">
                                    <th:block th:replace="~{fragments/material-amount :: amount(${row.requiredAmount()}, ${row.material().quantityType()})}" />
                                </td>
                                <td class="num" data-testid="demand-booked" th:attr="data-label=#{orders.demand.col.booked}">
                                    <th:block th:replace="~{fragments/material-amount :: amount(${row.bookedAmount()}, ${row.material().quantityType()})}" />
                                </td>
                                <td class="num" data-testid="demand-claimed" th:attr="data-label=#{orders.demand.col.claimed}">
                                    <th:block th:replace="~{fragments/material-amount :: amount(${row.claimedAmount()}, ${row.material().quantityType()})}" />
                                </td>
                                <td class="num demand-outstanding" data-testid="demand-outstanding"
                                    th:attr="data-label=#{orders.demand.col.outstanding}"
                                    th:classappend="${row.outstandingAmount() != null and row.outstandingAmount() <= 0} ? 'demand-covered' : ''">
                                    <th:block th:replace="~{fragments/material-amount :: amount(${row.outstandingAmount()}, ${row.material().quantityType()})}" />
                                </td>
                                <td class="demand-coverage" data-testid="demand-coverage">
                                    <span class="demand-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                                          th:aria-valuenow="${#numbers.formatInteger(coveredPct, 1)}"
                                          th:aria-label="#{orders.demand.coverage.aria(${#numbers.formatInteger(coveredPct, 1)})}"
                                          th:title="#{orders.demand.coverage.aria(${#numbers.formatInteger(coveredPct, 1)})}">
                                        <i class="demand-bar__booked" th:attr="data-krtm-width=${bookedPct}"></i>
                                        <i class="demand-bar__claimed" th:attr="data-krtm-width=${coveredPct - bookedPct}"></i>
                                    </span>
                                    <span class="demand-bar__value" aria-hidden="true"
                                          th:text="${#numbers.formatInteger(coveredPct, 1)} + ' %'">0 %</span>
                                </td>
                            </tr>
                            <tr class="demand-orders-row" hidden th:data-bucket-orders="${bucketKey}">
                                <td colspan="7" class="demand-orders-cell">
                                    <table class="data-table data-table--compact demand-orders-table">
                                        <thead>
                                        <tr>
                                            <th th:text="#{orders.demand.orders.col.order}">Auftrag</th>
                                            <th class="cell-status" th:text="#{orders.demand.orders.col.status}">Status</th>
                                            <th class="num" th:text="#{orders.demand.col.required}">Bedarf</th>
                                            <th class="num" th:text="#{orders.demand.col.booked}">Bestand</th>
                                            <th class="num" th:text="#{orders.demand.col.claimed}">Eintragungen</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="share : ${row.orders()}" data-testid="demand-order-share">
                                            <td>
                                                <a th:href="@{/orders/{id}(id=${share.jobOrderId()})}"
                                                   th:text="'#' + ${share.displayId()}">#42</a>
                                                <span class="order-kind-badge"
                                                      th:classappend="${share.type() == 'ITEM'} ? 'order-kind-item' : 'order-kind-material'"
                                                      th:text="${share.type() == 'ITEM'} ? #{orders.kind.item} : #{orders.kind.material}">Material</span>
                                            </td>
                                            <td class="cell-status">
                                                <span class="status-pill"
                                                      th:classappend="${'status-' + #strings.toLowerCase(share.status())}"
                                                      th:text="#{__${'status.' + share.status()}__}">Offen</span>
                                            </td>
                                            <td class="num" th:attr="data-label=#{orders.demand.col.required}">
                                                <th:block th:replace="~{fragments/material-amount :: amount(${share.requiredAmount()}, ${row.material().quantityType()})}" />
                                            </td>
                                            <td class="num" th:attr="data-label=#{orders.demand.col.booked}">
                                                <th:block th:replace="~{fragments/material-amount :: amount(${share.bookedAmount()}, ${row.material().quantityType()})}" />
                                            </td>
                                            <td class="num" th:attr="data-label=#{orders.demand.col.claimed}">
                                                <th:block th:replace="~{fragments/material-amount :: amount(${share.claimedAmount()}, ${row.material().quantityType()})}" />
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </th:block>
                        </tbody>
                    </table>
                </div>
            </section>

            <div id="demandNoMatch" hidden data-testid="demand-no-match">
                <th:block th:replace="~{fragments/components :: emptyState(titleKey='orders.demand.filter.noMatch.title', textKey='orders.demand.filter.noMatch')}"></th:block>
            </div>
        </th:block>
        </th:block>
    </div>
</main>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const KRT_DEMAND_SECTION_REFRESH_ERROR = /*[[#{orders.demand.section.refresh.error}]]*/ 'Aktualisierung fehlgeschlagen.';
    const KRT_DEMAND_LIVESYNC_UPDATES = /*[[#{orders.demand.livesync.updates}]]*/ 'Neue Daten verfügbar';
</script>
<script th:src="@{/js/orders-material-demand.js}" defer th:attr="nonce=${cspNonce}"></script>

<th:block th:replace="~{fragments/toast :: toast}" />
</body>
</html>
