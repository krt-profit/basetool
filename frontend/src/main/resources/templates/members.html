<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="#{members.title} + ' - ' + ${appTitle}">Mitgliederverwaltung - Profit Basetool</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />
<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.members', titleText=#{members.title},
        count=${usersPage != null ? usersPage.totalElements() : null}, countId='members-count', countFor='members-results', actions=~{::members-actions})}">
        <th:block th:ref="members-actions">
            <th:block sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)">
                <th:block th:replace="~{fragments/components :: overflowMenu(id='members-more', items=~{::members-more-items})}">
                    <th:block th:ref="members-more-items">
                        <button type="button" class="overflow-menu__item" role="menuitem" data-trigger="members-sync"
                                data-testid="members-sync" th:title="#{members.sync.title}" th:text="#{members.sync.button}">Jetzt synchronisieren</button>
                    </th:block>
                </th:block>
            </th:block>
        </th:block>
    </th:block>

    <form id="members-filter-form" method="get" th:action="@{/members}" class="no-track" role="search">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('member-search', 'search', ${search}, 'members.search.placeholder')}"></th:block>
        </div>
    </form>

    <div id="members-results" class="card card--flush">
        <th:block th:fragment="membersTableFragment">
        <div class="table-responsive" th:if="${users != null and !users.isEmpty()}">
            <table class="data-table data-table--stack">
                <thead>
                    <tr>
                        <th th:text="#{profile.username}">Username</th>
                        <th th:text="#{members.field.squadron}">Staffel</th>
                        <th th:text="#{members.list.specialcommands}">SK</th>
                        <th class="num" th:text="#{profile.rank}">Rang</th>
                        <th th:text="#{members.discord}">Discord</th>
                        <th class="cell-status" th:text="#{members.status}">Status</th>
                        <th class="cell-actions"><span class="visually-hidden" th:text="#{general.action}">Aktion</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}" data-testid="member-row">
                        <td>
                            <a class="row-link" data-testid="row-link" th:href="@{/members/{id}/edit(id=${user.id}, source='members')}">
                                <span class="cell-title" th:text="${user.effectiveName}">Username</span>
                            </a>
                        </td>
                        <td th:attr="data-label=#{members.field.squadron}">
                            <span th:if="${user.squadrons != null and !user.squadrons.isEmpty()}">
                                <th:block th:each="sq, st : ${user.squadrons}">
                                    <span class="squadron-badge"
                                          th:title="${sq.name()}"
                                          th:text="${sq.shorthand()}">IRI</span><span th:if="${!st.last}">&#160;&middot;&#160;</span>
                                </th:block>
                            </span>
                            <span th:if="${user.squadrons == null or user.squadrons.isEmpty()}"
                                  class="squadron-badge squadron-badge-muted">&mdash;</span>
                        </td>
                        <td th:attr="data-label=#{members.list.specialcommands}">
                            <span th:if="${userSkMemberships != null and userSkMemberships.get(user.id) != null and !userSkMemberships.get(user.id).isEmpty()}">
                                <th:block th:each="sk, st : ${userSkMemberships.get(user.id)}">
                                    <span class="squadron-badge squadron-badge-sk"
                                          th:title="${sk.orgUnitName()}"
                                          th:text="${sk.orgUnitShorthand() != null ? sk.orgUnitShorthand() : sk.orgUnitName()}">ALPHA</span><span th:if="${!st.last}">&#160;&middot;&#160;</span>
                                </th:block>
                            </span>
                            <span th:if="${userSkMemberships == null or userSkMemberships.get(user.id) == null or userSkMemberships.get(user.id).isEmpty()}"
                                  class="squadron-badge squadron-badge-muted"
                                  th:utext="#{members.list.specialcommands.none}">&mdash;</span>
                        </td>
                        <td class="num" th:attr="data-label=#{profile.rank}" th:text="${user.rank}">Rang</td>
                        <td th:attr="data-label=#{members.discord}">
                            <span th:if="${user.discordLinked}" role="img"
                                  th:title="#{members.discord.linked}" th:aria-label="#{members.discord.linked}">
                                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-discord"/></svg>
                            </span>
                            <span th:unless="${user.discordLinked}" class="text-muted"
                                  th:title="#{members.discord.not_linked}" th:aria-label="#{members.discord.not_linked}">&mdash;</span>
                        </td>
                        <td class="cell-status">
                            <span th:if="${user.inKeycloak}" class="status-pill status-active" th:text="#{members.in_keycloak}">In Keycloak</span>
                            <span th:unless="${user.inKeycloak}" class="status-pill status-rejected" th:text="#{members.not_in_keycloak}">Nicht in Keycloak</span>
                        </td>
                        <td class="cell-actions">
                            <button sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)"
                                    type="button"
                                    class="btn btn-ghost btn-icon"
                                    th:data-user-id="${user.id}"
                                    th:data-user-version="${user.version}"
                                    data-trigger="members-consolidate"
                                    th:title="#{members.consolidate.hint}" th:aria-label="#{members.consolidate}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-users"/></svg></button>
                            <button th:if="${!user.inKeycloak}" sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)"
                                    type="button"
                                    class="btn btn-quiet-danger btn-icon"
                                    th:data-user-id="${user.id}"
                                    data-trigger="members-delete-user"
                                    th:title="#{members.delete}" th:aria-label="#{members.delete}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                            <svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <th:block th:if="${error == null and (users == null or users.isEmpty())}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='members.empty', textKey='members.empty.text')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${usersPage}, baseUrl='/members')}"></th:block>
        </th:block>
    </div>

    <th:block sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)">
        <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='consolidate-modal', titleKey='members.consolidate.modal.title', variant='krt-modal--wide', body=~{::consolidate-modal-body})}">
            <th:block th:ref="consolidate-modal-body">
                <div class="krt-modal-body">
                    <label for="consolidate-target" th:text="#{members.consolidate.modal.targetLabel}">Konto, das bleibt</label>
                    <select id="consolidate-target" data-krt-combobox="remote-users"
                            th:attr="data-combobox-placeholder=#{members.consolidate.modal.targetPlaceholder}">
                        <option value="" th:text="#{members.consolidate.modal.targetPlaceholder}">-- Konto wählen --</option>
                    </select>
                    <p class="reg-when mt-2" th:text="#{members.consolidate.modal.hint}"></p>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" id="consolidate-cancel" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="button" class="btn btn--cta" id="consolidate-confirm" th:text="#{members.consolidate}">Zusammenführen</button>
                </div>
            </th:block>
        </th:block>
    </th:block>
</main>
<script th:src="@{/js/autocomplete.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('member-search');
        const filterForm = document.getElementById('members-filter-form');
        const resultsContainer = document.getElementById('members-results');
        let membersFilterTimer = null;

        function applyMembersFilter() {
            if (!filterForm || !resultsContainer || !window.krtFetch) {
                if (filterForm) filterForm.submit();
                return;
            }
            const data = new FormData(filterForm);
            const params = new URLSearchParams();
            for (const [key, value] of data.entries()) {
                if (value !== '') params.append(key, value);
            }
            const query = params.toString();
            window.krtFetch.swap({
                url: '/members' + (query ? '?' + query : ''),
                container: resultsContainer,
                history: true,
            });
        }

        if (filterForm) {
            filterForm.addEventListener('submit', function (event) {
                event.preventDefault();
                clearTimeout(membersFilterTimer);
                applyMembersFilter();
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', function () {
                clearTimeout(membersFilterTimer);
                membersFilterTimer = setTimeout(applyMembersFilter, 300);
            });
            krtAutocomplete(searchInput, async (query) => {
                if (query.length < 2) return [];
                try {
                    const data = await window.krtFetch.getJson(`/members/api/search?query=${encodeURIComponent(query)}`);
                    return [...new Set((data || []).map(u => u.effectiveName).filter(Boolean))].slice(0, 10);
                } catch (_err) {
                    return [];
                }
            }, {
                onSelect: function(item) {
                    searchInput.value = item;
                    clearTimeout(membersFilterTimer);
                    applyMembersFilter();
                }
            });
        }
    });

    const MSG_DELETE_TITLE = /*[[#{members.delete.title}]]*/ "";
    const MSG_DELETE_CONFIRM = /*[[#{members.delete_confirm}]]*/ "";
    const MSG_DELETE_LABEL = /*[[#{members.delete}]]*/ "";
    const MSG_CANCEL_LABEL = /*[[#{general.cancel}]]*/ "";
    const MSG_DELETE_SUCCESS = /*[[#{success.user.delete}]]*/ "";
    const MSG_DELETE_ERROR = /*[[#{error.user.delete}]]*/ "";
    const MSG_SYNC_SUCCESS = /*[[#{members.sync.success}]]*/ "";
    const MSG_SYNC_ERROR = /*[[#{members.sync.error}]]*/ "";
    const MSG_CONSOLIDATE_SUCCESS = /*[[#{success.user.consolidate}]]*/ "";
    const MSG_CONSOLIDATE_ERROR = /*[[#{error.user.consolidate}]]*/ "";
    const MSG_CONSOLIDATE_NO_TARGET = /*[[#{error.user.consolidate.no_target}]]*/ "";

    function refreshMembersResults() {
        const container = document.getElementById('members-results');
        if (!container || !window.krtFetch) {
            location.reload();
            return;
        }
        window.krtFetch.swap({
            url: window.location.pathname + window.location.search,
            container: container
        });
    }

    window.krtRefreshMembersResults = refreshMembersResults;

    async function deleteUser(userId) {
        const confirmed = await window.showKrtConfirm(MSG_DELETE_TITLE, MSG_DELETE_CONFIRM, MSG_DELETE_LABEL, MSG_CANCEL_LABEL);
        if (!confirmed) return;
        window.krtFetch.write({
            method: 'DELETE',
            url: '/members/' + encodeURIComponent(userId),
            successMessage: MSG_DELETE_SUCCESS,
            errorMessage: MSG_DELETE_ERROR,
            onSuccess: function () {
                refreshMembersResults();
            }
        });
    }

    function syncMembersNow() {
        window.krtFetch.write({
            method: 'POST',
            url: '/members/sync',
            successMessage: MSG_SYNC_SUCCESS,
            errorMessage: MSG_SYNC_ERROR,
            onSuccess: function () {
                refreshMembersResults();
            }
        });
    }

    let consolidateSource = null;

    function openConsolidate(el) {
        const modal = document.getElementById('consolidate-modal');
        if (!modal || !window.krtModal) return;
        consolidateSource = {
            id: el.getAttribute('data-user-id'),
            version: el.getAttribute('data-user-version')
        };
        const picker = document.getElementById('consolidate-target');
        if (picker) {
            picker.value = '';
            if (picker.krtComboboxReset) picker.krtComboboxReset();
        }
        window.krtModal.open(modal);
    }

    function closeConsolidate() {
        consolidateSource = null;
        if (window.krtModal) window.krtModal.close('consolidate-modal');
    }

    function confirmConsolidate() {
        if (!consolidateSource) return;
        const picker = document.getElementById('consolidate-target');
        const targetUserId = picker && picker.value ? picker.value : '';
        if (!targetUserId) {
            if (window.showFrontendErrorToast) {
                window.showFrontendErrorToast(MSG_CONSOLIDATE_NO_TARGET);
            }
            return;
        }
        const source = consolidateSource;
        window.krtFetch.write({
            method: 'POST',
            url: '/members/' + encodeURIComponent(source.id) + '/consolidate',
            payload: {
                targetUserId: targetUserId,
                version: source.version == null || source.version === '' ? null : Number(source.version)
            },
            toast: false,
            errorMessage: MSG_CONSOLIDATE_ERROR,
            onSuccess: function () {
                if (window.showFrontendSuccessToast) {
                    window.showFrontendSuccessToast(MSG_CONSOLIDATE_SUCCESS);
                }
                closeConsolidate();
                refreshMembersResults();
            }
        });
    }

    document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target : null;
        if (!target) return;
        if (target.closest('#consolidate-cancel')) {
            closeConsolidate();
        } else if (target.closest('#consolidate-confirm')) {
            confirmConsolidate();
        }
    });

    if (window.krtEvents && typeof window.krtEvents.on === 'function') {
        window.krtEvents.on('click', 'members-delete-user', function (el) {
            deleteUser(el.getAttribute('data-user-id'));
        });
        window.krtEvents.on('click', 'members-sync', function () {
            syncMembersNow();
        });
        window.krtEvents.on('click', 'members-consolidate', function (el) {
            openConsolidate(el);
        });
    }
</script>
<script th:src="@{/js/members.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
