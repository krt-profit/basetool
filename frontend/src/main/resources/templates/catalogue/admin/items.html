<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(pagePickers=false, pageNumbers=false, pageDates=false, pageFocus=false, pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{admin.items.title} + ' - ' + ${appTitle}">Gegenstände - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/catalogue/admin-items.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='admin.items', eyebrowKey='nav.admin.group.masterdata', titleText=#{admin.items.title},
        count=null, actions=null)}"></th:block>

    <p class="form-hint" th:text="#{admin.items.intro}">Die Gegenstände stammen aus dem P4K-Katalog.</p>

    <section class="admin-items-section" aria-labelledby="admin-items-title" data-testid="admin-items">
        <h2 id="admin-items-title" class="admin-items-section-title" th:text="#{admin.items.list.title}">Katalog</h2>
        <form id="admin-items-filter" class="no-track" role="search">
            <div class="toolbar">
                <th:block th:replace="~{kernel/fragments/components :: toolbarSearch('admin-items-query', 'query', null, 'admin.items.filter.search')}"></th:block>
                <label class="krt-switch" for="admin-items-unobtainable">
                    <input type="checkbox" role="switch" id="admin-items-unobtainable" name="unobtainableOnly" data-testid="admin-items-unobtainable" data-filter-chip-ignore>
                    <span th:text="#{admin.items.filter.unobtainableOnly}">Nur nicht erhältliche</span>
                </label>
            </div>
        </form>
        <div class="card card--flush">
            <div class="table-responsive">
                <table class="data-table data-table--stack">
                    <thead>
                    <tr>
                        <th th:text="#{admin.items.col.name}">Name</th>
                        <th th:text="#{admin.items.col.type}">Typ</th>
                        <th class="cell-status" th:text="#{admin.items.col.status}">Status</th>
                        <th class="cell-actions"><span class="visually-hidden" th:text="#{admin.items.col.actions}">Aktionen</span></th>
                    </tr>
                    </thead>
                    <tbody id="admin-items-rows">
                    </tbody>
                </table>
            </div>
            <div id="admin-items-empty" class="empty-state" data-testid="empty-state" hidden>
                <th:block th:replace="~{kernel/fragments/components :: emptyStateBody('admin.items.empty.title', 'admin.items.empty', null)}"></th:block>
            </div>
            <nav id="admin-items-pager" class="pagination" hidden th:aria-label="#{general.pagination.aria}"></nav>
        </div>
    </section>
</main>
</th:block>
<th:block th:fragment="pageTail">
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    window.krtAdminItemsI18n = {
        'offered': /*[[#{admin.items.offered}]]*/ 'In pickers',
        'unobtainable': /*[[#{admin.items.unobtainable}]]*/ 'Not obtainable',
        'since': /*[[#{admin.items.since}]]*/ 'since',
        'retired': /*[[#{catalogue.noLongerInGame}]]*/ 'No longer in the game',
        'actionHide': /*[[#{admin.items.action.hide}]]*/ 'Hide as not obtainable',
        'actionShow': /*[[#{admin.items.action.show}]]*/ 'Offer again',
        'toastHidden': /*[[#{admin.items.toast.hidden}]]*/ 'Item hidden as not obtainable.',
        'toastShown': /*[[#{admin.items.toast.shown}]]*/ 'Item offered again.',
        'busy': /*[[#{admin.items.toast.busy}]]*/ 'A P4K import or a Wiki or UEX sync is running.',
        'error': /*[[#{admin.items.toast.error}]]*/ 'Saving failed.',
        'loadError': /*[[#{admin.items.toast.loadError}]]*/ 'The list could not be loaded.',
        'pagePrevious': /*[[#{general.pagination.previous}]]*/ 'Previous',
        'pageNext': /*[[#{general.pagination.next}]]*/ 'Next'
    };
</script>
<script type="module" th:src="@{/js/catalogue/admin-items.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
