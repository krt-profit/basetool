<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent})}">
<head>
    <title th:text="#{admin.locations.title} + ' - ' + ${appTitle}">Orte - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/catalogue/admin-locations.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='admin.locations', eyebrowKey='nav.admin.group.masterdata', titleText=#{admin.locations.title},
        count=${locationsPage.totalElements()}, countId='locations-count', countFor='locations-results', actions=null)}"></th:block>

    <th:block th:replace="~{kernel/fragments/components :: alert('danger', ${error}, null)}"></th:block>

    <th:block th:if="${catalogTruncated}">
        <div th:replace="~{kernel/fragments/components :: alert('warning', 'admin.catalog.truncated', null)}"></div>
    </th:block>

    <section class="list-panel">
    <form id="locations-filter" class="no-track" role="search" method="get" th:action="@{/admin/locations}">
        <div class="toolbar">
            <th:block th:replace="~{kernel/fragments/components :: toolbarSearch('filterLocations', 'query', ${query}, 'general.filter.name.placeholder')}"></th:block>
            <datalist id="locationNames-data" hidden>
                <option th:each="name : ${locationNames}" th:value="${name}"></option>
            </datalist>
        </div>
        <input type="hidden" name="size" th:value="${pageSize}">
    </form>

    <div id="locations-results" class="card card--flush">
        <th:block th:fragment="locationsResults">
        <div class="table-responsive" th:if="${locations != null and !locations.isEmpty()}">
            <table id="locationsTable" class="data-table data-table--stack">
                <thead>
                    <tr>
                        <th th:text="#{admin.location.name}">Name</th>
                        <th th:text="#{admin.location.description}">Beschreibung</th>
                        <th class="cell-actions" th:text="#{general.action}">Aktion</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="loc : ${locations}" data-testid="location-row">
                        <td><span class="cell-title" th:text="${loc.name}">Name</span></td>
                        <td th:text="${loc.description}">Desc</td>
                        <td class="cell-actions">
                            <div class="cluster gap-2">
                                <form sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" method="post" th:action="@{/admin/locations/{id}/toggle-visibility(id=${loc.id})}" class="m-0" data-location-toggle="visibility">
                                    <input type="hidden" name="hidden" th:value="${!loc.hidden}">
                                    <button type="submit" class="btn btn-ghost btn-xs"
                                            th:data-label-on="#{admin.location.visibility.show}"
                                            th:data-label-off="#{admin.location.visibility.hide}"
                                            th:text="${loc.hidden} ? #{admin.location.visibility.show} : #{admin.location.visibility.hide}">Toggle</button>
                                </form>
                                <form sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" method="post" th:action="@{/admin/locations/{id}/toggle-home-location(id=${loc.id})}" class="m-0" data-location-toggle="home">
                                    <input type="hidden" name="homeLocation" th:value="${!loc.homeLocation}">
                                    <button type="submit" class="btn btn-ghost btn-xs"
                                            th:data-label-on="#{admin.location.home.unmark}"
                                            th:data-label-off="#{admin.location.home.mark}"
                                            th:text="${loc.homeLocation} ? #{admin.location.home.unmark} : #{admin.location.home.mark}">Home</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <th:block th:if="${locations == null or locations.isEmpty()}">
            <th:block th:replace="~{kernel/fragments/components :: emptyState(titleKey='admin.locations.empty', textKey='admin.locations.empty.text')}"></th:block>
        </th:block>
        <th:block th:replace="~{kernel/fragments/components :: listFoot(pageResponse=${locationsPage}, baseUrl=${paginationBaseUrl})}"></th:block>
        <nav th:replace="~{kernel/fragments/pagination :: pageSizePicker(pageResponse=${locationsPage}, baseUrl=${paginationBaseUrl}, sizes=${pageSizes})}"></nav>
        </th:block>
    </div>
    </section>
</main>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const LOCATION_MSG = {
        success:    /*[[#{notification.success.save}]]*/ 'Gespeichert.',
        error:      /*[[#{notification.error.save}]]*/ 'Speichern fehlgeschlagen.'
    };
    const LOCATION_CONFLICT = {
        title:                /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Bitte neu laden.',
        reloadLabel:          /*[[#{frontend.ajax.conflict.reload}]]*/ 'Aktuelle Werte laden',
        dismissLabel:         /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        reloadQuestion:       /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
</script>
<script type="module" th:src="@{/js/catalogue/locations.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
