<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{admin.shops.title} + ' - ' + ${appTitle}">Shops - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/catalogue/admin-shops.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='admin.shops', eyebrowKey='nav.admin.group.masterdata', titleText=#{admin.shops.title},
        count=null, actions=null)}"></th:block>

    <p class="form-hint" th:text="#{admin.shops.intro}">Die Shops stammen aus dem P4K-Import.</p>

    <section class="shops-section" th:aria-label="#{admin.shops.title}" data-testid="shops">
        <form id="shops-filter" class="no-track" role="search">
            <div class="toolbar">
                <th:block th:replace="~{kernel/fragments/components :: toolbarSearch('shops-query', 'query', null, 'admin.shops.filter.search')}"></th:block>
                <div class="shops-filter">
                    <label for="shops-system" class="visually-hidden" th:text="#{admin.shops.filter.system}">Sternensystem</label>
                    <input type="text" id="shops-system" name="starSystem" autocomplete="off" data-filter-chip-ignore
                           th:attr="placeholder=#{admin.shops.filter.system}">
                </div>
                <label class="krt-switch" for="shops-unlinked">
                    <input type="checkbox" role="switch" id="shops-unlinked" name="unlinkedOnly" data-testid="shops-unlinked" data-filter-chip-ignore>
                    <span th:text="#{admin.shops.filter.unlinkedOnly}">Nur unverknüpfte</span>
                </label>
            </div>
        </form>
        <div class="card card--flush">
            <div class="table-responsive">
                <table class="data-table data-table--stack">
                    <thead>
                    <tr>
                        <th th:text="#{admin.shops.col.name}">Shop</th>
                        <th th:text="#{admin.shops.col.system}">System</th>
                        <th th:text="#{admin.shops.col.place}">Ort</th>
                        <th th:text="#{admin.shops.col.kind}">Art</th>
                        <th th:text="#{admin.shops.col.items}">Artikelliste</th>
                        <th th:text="#{admin.shops.col.terminal}">UEX-Terminal</th>
                        <th class="cell-actions"><span class="visually-hidden" th:text="#{admin.shops.col.actions}">Aktionen</span></th>
                    </tr>
                    </thead>
                    <tbody id="shops-rows">
                    </tbody>
                </table>
            </div>
            <div id="shops-empty" class="empty-state" data-testid="empty-state" hidden>
                <th:block th:replace="~{kernel/fragments/components :: emptyStateBody('admin.shops.empty.title', 'admin.shops.empty', null)}"></th:block>
            </div>
            <nav id="shops-pager" class="pagination" hidden th:aria-label="#{general.pagination.aria}"></nav>
        </div>
    </section>
</main>

<th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='shops-link-modal', titleKey='admin.shops.dialog.title', variant='krt-modal--wide', body=~{::shops-link-modal-body})}">
    <th:block th:ref="shops-link-modal-body">
        <div class="krt-modal-body">
            <p class="m-0">
                <span class="text-muted" th:text="#{admin.shops.dialog.shop}">Shop</span>:
                <span id="shops-link-shop" class="data-value"></span>
            </p>
            <div class="form-group">
                <label for="shops-link-search" class="form-label" th:text="#{admin.shops.dialog.search}">Terminal suchen</label>
                <input type="search" id="shops-link-search" autocomplete="off">
            </div>
            <ul id="shops-link-candidates" class="shops-candidates" data-testid="shops-link-candidates"></ul>
            <p id="shops-link-empty" class="text-muted" hidden th:text="#{admin.shops.dialog.empty}">Kein Terminal gefunden.</p>
        </div>
        <div class="krt-modal-foot">
            <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                    data-modal-id="shops-link-modal" th:text="#{general.cancel}">Abbrechen</button>
        </div>
    </th:block>
</th:block>
</th:block>
<th:block th:fragment="pageTail">
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    window.krtShopsI18n = {
        'itemsKnown': /*[[#{admin.shops.itemsKnown}]]*/ 'known',
        'itemsUnknown': /*[[#{admin.shops.itemsUnknown}]]*/ 'unknown',
        'unlinked': /*[[#{admin.shops.unlinked}]]*/ 'not linked',
        'manual': /*[[#{admin.shops.manual}]]*/ 'manual',
        'retired': /*[[#{admin.shops.retired}]]*/ 'no longer in game',
        'exchange': /*[[#{admin.shops.exchange}]]*/ 'Commodity exchange',
        'actionLink': /*[[#{admin.shops.action.link}]]*/ 'Link',
        'actionClear': /*[[#{admin.shops.action.clear}]]*/ 'Unlink',
        'actionRelease': /*[[#{admin.shops.action.release}]]*/ 'Hand back to import',
        'pick': /*[[#{admin.shops.dialog.pick}]]*/ 'Select',
        'toastLinked': /*[[#{admin.shops.toast.linked}]]*/ 'Link set.',
        'toastCleared': /*[[#{admin.shops.toast.cleared}]]*/ 'Link removed.',
        'toastReleased': /*[[#{admin.shops.toast.released}]]*/ 'Link handed back to the import.',
        'conflict': /*[[#{admin.shops.toast.conflict}]]*/ 'The entry changed meanwhile.',
        'error': /*[[#{admin.shops.toast.error}]]*/ 'Saving failed.',
        'loadError': /*[[#{admin.shops.toast.loadError}]]*/ 'The list could not be loaded.',
        'kind.ADMIN': /*[[#{admin.shops.kind.ADMIN}]]*/ 'ADMIN',
        'kind.ARMOR': /*[[#{admin.shops.kind.ARMOR}]]*/ 'ARMOR',
        'kind.BAR': /*[[#{admin.shops.kind.BAR}]]*/ 'BAR',
        'kind.CARGO_ADMIN': /*[[#{admin.shops.kind.CARGO_ADMIN}]]*/ 'CARGO_ADMIN',
        'kind.CLOTHING': /*[[#{admin.shops.kind.CLOTHING}]]*/ 'CLOTHING',
        'kind.COMMEX': /*[[#{admin.shops.kind.COMMEX}]]*/ 'COMMEX',
        'kind.CONVENIENCE_STORE': /*[[#{admin.shops.kind.CONVENIENCE_STORE}]]*/ 'CONVENIENCE_STORE',
        'kind.COURIER': /*[[#{admin.shops.kind.COURIER}]]*/ 'COURIER',
        'kind.DEALERSHIP': /*[[#{admin.shops.kind.DEALERSHIP}]]*/ 'DEALERSHIP',
        'kind.ELECTRONICS': /*[[#{admin.shops.kind.ELECTRONICS}]]*/ 'ELECTRONICS',
        'kind.FOOD': /*[[#{admin.shops.kind.FOOD}]]*/ 'FOOD',
        'kind.MARKET_STALLS': /*[[#{admin.shops.kind.MARKET_STALLS}]]*/ 'MARKET_STALLS',
        'kind.MEDICAL': /*[[#{admin.shops.kind.MEDICAL}]]*/ 'MEDICAL',
        'kind.PERSONAL_WEAPON': /*[[#{admin.shops.kind.PERSONAL_WEAPON}]]*/ 'PERSONAL_WEAPON',
        'kind.REFINERY': /*[[#{admin.shops.kind.REFINERY}]]*/ 'REFINERY',
        'kind.SERVICE': /*[[#{admin.shops.kind.SERVICE}]]*/ 'SERVICE',
        'kind.SHIP_PART': /*[[#{admin.shops.kind.SHIP_PART}]]*/ 'SHIP_PART',
        'kind.SHIP_WEAPON': /*[[#{admin.shops.kind.SHIP_WEAPON}]]*/ 'SHIP_WEAPON',
        'kind.SHOP_COMM': /*[[#{admin.shops.kind.SHOP_COMM}]]*/ 'SHOP_COMM',
        'kind.SHOP_FOOD': /*[[#{admin.shops.kind.SHOP_FOOD}]]*/ 'SHOP_FOOD',
        'pagePrevious': /*[[#{general.pagination.previous}]]*/ 'Previous',
        'pageNext': /*[[#{general.pagination.next}]]*/ 'Next'
    };
</script>
<script type="module" th:src="@{/js/catalogue/shops.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
