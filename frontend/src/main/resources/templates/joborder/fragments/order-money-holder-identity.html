<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="action">
    <button th:if="${money.canMaintainHolders and currentUserId != null}" type="button"
            class="btn btn-ghost" data-trigger="od-money-holder-identity"
            th:data-holder-id="${holder.id}" data-testid="order-money-holder-maintain"
            th:aria-label="#{orders.money.holder.identity.editNamed(${name})}"
            th:text="#{orders.money.holder.identity.edit}"></button>
</th:block>

<th:block th:fragment="history">
    <ul th:unless="${#lists.isEmpty(money.holderIdentityHistory)}" class="od-assignee-list">
        <li class="od-assignee split" th:each="change : ${money.holderIdentityHistory}"
            data-testid="order-money-holder-identity-history"
            th:with="previous=${@handles.display(change.previousName) ?: #messages.msg('orders.money.nameUnavailable')},
                     name=${@handles.display(change.name) ?: #messages.msg('orders.money.nameUnavailable')}">
            <div>
                <strong th:text="${#messages.msg('orders.money.holder.identity.history.' + change.kind, previous, name)}"></strong>
                <div th:text="#{orders.money.history.recordedBy(
                    ${@handles.display(change.actorName) ?: #messages.msg('orders.money.nameUnavailable')})}"></div>
            </div>
            <time class="od-money-date" th:datetime="${change.recordedAt}" th:data-utc="${change.recordedAt}"></time>
        </li>
    </ul>
</th:block>

<th:block th:fragment="dialog">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-holder-identity-modal',
        titleKey='orders.money.holder.identity.edit', body=~{joborder/fragments/order-money-holder-identity :: form})}"></th:block>
</th:block>

<form th:fragment="form" id="order-money-holder-identity-form">
    <div class="krt-modal-body">
        <p data-holder-identity-label></p>
        <div class="alert alert-info" data-holder-identity-basis hidden>
            <p role="status" th:text="#{orders.money.basis.changed}"></p>
            <button type="button" class="btn btn-ghost" data-holder-identity-review
                    th:text="#{orders.money.holder.identity.review}"></button>
        </div>
        <div class="form-group">
            <label for="order-money-holder-identity-kind" th:text="#{orders.money.holder.identity.action}"></label>
            <select id="order-money-holder-identity-kind" name="kind" data-testid="order-money-holder-identity-kind" required>
                <option value="NAME" th:text="#{orders.money.holder.identity.name}"></option>
                <option value="LINK" th:text="#{orders.money.holder.identity.link}"></option>
                <option value="MERGE" th:text="#{orders.money.holder.identity.merge}"></option>
                <option value="CORRECT_LINK" th:text="#{orders.money.holder.identity.correctLink}"></option>
            </select>
        </div>
        <div class="form-group" hidden>
            <label for="order-money-holder-identity-name" th:text="#{orders.money.holder.identity.correctedName}"></label>
            <input type="text" id="order-money-holder-identity-name" name="name" maxlength="200"
                   data-testid="order-money-holder-identity-name" required disabled>
        </div>
        <div th:replace="~{joborder/fragments/order-money-movement :: partyChoice('order-money-holder-identity-party', 'party')}"></div>
        <div class="form-group" hidden>
            <label for="order-money-holder-identity-survivor" th:text="#{orders.money.holder.identity.survivor}"></label>
            <select id="order-money-holder-identity-survivor" name="target" required disabled>
                <option value="" th:text="#{orders.create.select}"></option>
            </select>
            <p class="text-muted" th:text="#{orders.money.holder.identity.mergeHelp}"></p>
        </div>
    </div>
    <div class="krt-modal-foot">
        <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                data-modal-id="order-money-holder-identity-modal" th:text="#{general.cancel}"></button>
        <button type="submit" class="btn btn--cta" data-testid="order-money-holder-identity-save"
                th:text="#{orders.detail.save}" disabled></button>
    </div>
</form>
</body>
</html>
