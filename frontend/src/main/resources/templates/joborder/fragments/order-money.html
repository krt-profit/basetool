<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="money">
    <p th:if="${money == null}" class="alert alert-danger" role="alert" th:text="#{orders.money.load.error}"></p>
    <section th:if="${money != null}" class="od-kpi od-money" aria-labelledby="order-money-heading"
             th:data-can-provide-self="${money.canProvideSelf}" th:data-can-provide-on-behalf="${money.canProvideOnBehalf}"
             th:data-can-record-movement="${!order.responsibilityInvalid and (order.status == 'OPEN' or order.status == 'IN_PROGRESS')
                 and (money.canMoveForOthers or money.canProvideSelf or money.canRecordRequesterHandover)}"
             th:data-can-move-for-others="${money.canMoveForOthers}"
             th:data-can-record-requester-handover="${money.canRecordRequesterHandover}"
             th:data-can-designate-recipient="${money.canDesignateRecipient}"
             th:data-can-edit-target="${money.canEditTarget}" th:data-can-edit-information="${money.canEditInformation}"
             th:data-target="${money.target}" th:data-target-version="${money.targetVersion}"
             th:data-information-version="${money.informationVersion}" th:data-remaining="${money.remaining}"
             th:data-net-handed-over="${money.netHandedOver}" th:data-status="${order.status}"
             th:data-handle="${money.canEditInformation ? order.handle : null}"
             th:data-comment="${money.canEditInformation ? order.comment : null}">
        <h2 id="order-money-heading" class="section-title" th:text="#{orders.money.title}"></h2>
        <div class="kpi-grid" data-testid="order-progress">
            <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.target', ${money.target}, 'order-money-target')}"></div>
            <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.handedOver', ${money.netHandedOver}, 'order-money-handed-over')}"></div>
            <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.remaining', ${money.remaining}, 'order-money-remaining')}"></div>
            <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.provided', ${money.provided}, 'order-money-provided')}"></div>
            <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.holdings', ${money.holdings}, 'order-money-holdings')}"></div>
            <th:block th:if="${money.fees != '0'}">
                <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.fees', ${money.fees}, 'order-money-fees')}"></div>
            </th:block>
            <th:block th:if="${money.overpaid != '0'}">
                <div th:replace="~{joborder/fragments/order-money :: figure('orders.money.overpaid', ${money.overpaid}, 'order-money-overpaid')}"></div>
            </th:block>
        </div>
        <p class="text-muted" th:text="#{orders.money.manual}"></p>
        <div th:if="${currentUserId != null and !order.responsibilityInvalid and (order.status == 'OPEN' or order.status == 'IN_PROGRESS')}"
             class="od-pane-actions" th:with="canProvide=${money.canProvideSelf or money.canProvideOnBehalf},
                 canMove=${!#lists.isEmpty(money.holders) and (money.canMoveForOthers or money.canProvideSelf or money.canRecordRequesterHandover)}">
            <button th:if="${canProvide}" type="button" class="btn btn--cta" data-trigger="od-money-open"
                    data-testid="order-money-provide" th:text="#{orders.money.provide}"></button>
            <button th:if="${canMove}" type="button" class="btn" th:classappend="${canProvide ? 'btn-ghost' : 'btn--cta'}"
                    data-trigger="od-money-move" data-testid="order-money-move" th:text="#{orders.money.move}"></button>
        </div>
        <section class="card" th:unless="${#lists.isEmpty(money.holders)}" aria-labelledby="order-money-holders">
            <h3 id="order-money-holders" class="section-title" th:text="#{orders.money.holders}"></h3>
            <ul class="od-assignee-list">
                <li class="od-assignee split" th:each="holder : ${money.holders}"
                    th:with="name=${@handles.display(holder.displayName) ?: #messages.msg('orders.money.nameUnavailable')},
                             label=${#messages.msg(holder.userId != null ? 'orders.money.holder.linkedLabel' : 'orders.money.holder.accountlessLabel', name)}"
                    th:data-money-holder="${holder.id}" th:data-user-id="${holder.userId}"
                    th:data-version="${holder.version}" th:data-holder-label="${label}">
                    <span th:text="${label}"></span>
                    <span th:text="#{orders.money.amount.display(${money.formatAmount(holder.amount, #locale)})}"></span>
                </li>
            </ul>
        </section>
        <section class="card" th:if="${money.canDesignateRecipient or money.recipients.?[active].size() > 0}"
                 aria-labelledby="order-money-recipients">
            <div class="split">
                <h3 id="order-money-recipients" class="section-title" th:text="#{orders.money.recipients}"></h3>
                <button th:if="${money.canDesignateRecipient and currentUserId != null}" type="button"
                        class="btn btn-ghost" data-trigger="od-money-designate-recipient"
                        data-testid="order-money-designate-recipient" th:text="#{orders.money.recipient.add}"></button>
            </div>
            <ul th:if="${money.recipients.?[active].size() > 0}" class="od-assignee-list">
                <li class="od-assignee split" th:each="recipient : ${money.recipients}" th:if="${recipient.active}"
                    th:with="name=${@handles.display(recipient.name) ?: #messages.msg('orders.money.nameUnavailable')},
                             label=${#messages.msg(recipient.userId != null ? 'orders.money.holder.linkedLabel' : 'orders.money.holder.accountlessLabel', name)}"
                    th:data-money-recipient="${recipient.id}" th:data-holder-id="${recipient.holderId}"
                    th:data-user-id="${recipient.userId}" th:data-recipient-label="${label}">
                    <span th:text="${label}"></span>
                    <button th:if="${money.canDesignateRecipient and currentUserId != null}" type="button"
                            class="btn btn-ghost" data-trigger="od-money-remove-recipient"
                            th:data-recipient-id="${recipient.id}" th:aria-label="#{orders.money.recipient.removeNamed(${name})}"
                            th:text="#{orders.money.recipient.remove}"></button>
                </li>
            </ul>
        </section>
        <section class="card" th:if="${!#lists.isEmpty(money.history) or !#lists.isEmpty(money.targetChanges)}" aria-labelledby="order-money-history">
            <h3 id="order-money-history" class="section-title" th:text="#{orders.money.history}"></h3>
            <ul th:unless="${#lists.isEmpty(money.history)}" class="od-assignee-list">
                <li class="od-assignee split" th:each="entry : ${money.history}" data-testid="order-money-history-entry">
                    <div>
                        <th:block th:with="holder=${@handles.display(entry.holderName) ?: #messages.msg('orders.money.nameUnavailable')},
                                           actor=${@handles.display(entry.actorName) ?: #messages.msg('orders.money.nameUnavailable')},
                                           principal=${money.formatAmount(entry.amount, #locale)}">
                            <th:block th:if="${entry.kind == 'PROVISION'}">
                                <strong th:text="#{orders.money.history.provision(${principal})}"></strong>
                                <div th:text="#{orders.money.history.names(${holder}, ${actor})}"></div>
                            </th:block>
                            <th:block th:unless="${entry.kind == 'PROVISION'}">
                                <strong th:text="${#messages.msg('orders.money.history.' + entry.kind, principal)}"></strong>
                                <div th:text="#{orders.money.history.parties(${holder},
                                    ${@handles.display(entry.recipientName) ?: #messages.msg('orders.money.nameUnavailable')}, ${actor})}"></div>
                                <span th:if="${entry.fee != null and entry.fee != '0'}"
                                      th:text="#{orders.money.history.fee(${money.formatAmount(entry.fee, #locale)})}"></span>
                                <span th:if="${entry.provision != null and entry.provision != '0'}"
                                      th:text="#{orders.money.history.additional(${money.formatAmount(entry.provision, #locale)})}"></span>
                            </th:block>
                        </th:block>
                    </div>
                    <time class="od-money-date" th:datetime="${entry.recordedAt}" th:data-utc="${entry.recordedAt}"></time>
                </li>
            </ul>
            <ul th:unless="${#lists.isEmpty(money.targetChanges)}" class="od-assignee-list">
                <li class="od-assignee split" th:each="change : ${money.targetChanges}"
                    data-testid="order-money-target-change">
                    <div>
                        <strong th:text="#{orders.money.history.target(
                            ${money.formatAmount(change.previousTarget, #locale)}, ${money.formatAmount(change.target, #locale)})}"></strong>
                        <div th:text="#{orders.money.history.recordedBy(
                            ${@handles.display(change.actorName) ?: #messages.msg('orders.money.nameUnavailable')})}"></div>
                    </div>
                    <time class="od-money-date" th:datetime="${change.recordedAt}" th:data-utc="${change.recordedAt}"></time>
                </li>
            </ul>
        </section>
    </section>
</th:block>

<div th:fragment="figure(labelKey, amount, testId)" class="kpi-total" th:data-testid="${testId}">
    <div class="kpi-label" th:text="#{__${labelKey}__}"></div>
    <div class="kpi-value">
        <span th:text="${money.formatAmount(amount, #locale)}"></span>
        <span class="kpi-unit" th:text="#{orders.kind.auec}"></span>
    </div>
</div>

<th:block th:fragment="provision">
    <div id="order-money-operation" th:data-account-id="${currentUserId}" th:data-order-id="${order.id}"
         th:data-recorded="#{orders.money.recorded}" th:data-storage-error="#{orders.money.storage.error}"
         th:data-refused="#{orders.money.recovery.refused}" th:data-name-unavailable="#{orders.money.nameUnavailable}"
         th:data-provide-error="#{orders.money.provide.error}">
        <div class="alert alert-warning" data-money-recovery hidden>
            <p data-testid="order-money-unknown" role="status" th:text="#{orders.money.recovery.unknown}"></p>
            <div class="cluster gap-2">
                <button type="button" class="btn btn-ghost" data-money-check
                        th:text="#{orders.money.recovery.check}"></button>
                <button type="button" class="btn btn--cta" data-money-retry hidden
                        th:text="#{orders.money.recovery.retry}"></button>
            </div>
        </div>
        <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-provision-modal',
            titleKey='orders.money.provide', body=~{joborder/fragments/order-money :: provisionForm})}"></th:block>
        <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-movement-modal',
            titleKey='orders.money.move', body=~{joborder/fragments/order-money-movement :: movementForm})}"></th:block>
        <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-recipient-modal',
            titleKey='orders.money.recipient.add', body=~{joborder/fragments/order-money-settings :: recipientForm})}"></th:block>
        <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-edit-modal',
            titleKey='orders.detail.edit', body=~{joborder/fragments/order-money-settings :: editForms})}"></th:block>
    </div>
</th:block>

<form th:fragment="provisionForm" id="order-money-provision-form">
    <div class="krt-modal-body">
        <p class="text-muted" th:text="#{orders.money.manual}"></p>
        <p class="alert alert-info" role="status" data-money-basis-changed hidden
           th:text="#{orders.money.basis.changed}"></p>
        <fieldset class="form-section">
            <legend class="visually-hidden" th:text="#{orders.money.provide}"></legend>
            <div class="form-group" data-money-mode-field hidden>
                <label for="order-money-holder-mode" th:text="#{orders.money.holder}"></label>
                <select id="order-money-holder-mode" name="holderMode" data-testid="order-money-holder-mode">
                    <option value="self" th:text="#{orders.money.holder.self}"></option>
                    <option value="existing" th:text="#{orders.money.holder.existing}"></option>
                    <option value="new" th:text="#{orders.money.holder.new}"></option>
                </select>
            </div>
            <div class="form-group" data-money-existing-field hidden>
                <label for="order-money-existing-holder" th:text="#{orders.money.holder.existing}"></label>
                <select id="order-money-existing-holder" name="holderId"
                        data-testid="order-money-existing-holder" required disabled>
                    <option value="" th:text="#{orders.create.select}"></option>
                </select>
            </div>
            <div th:replace="~{joborder/fragments/order-money-movement :: partyChoice('order-money-holder-choice', 'holderChoice')}"></div>
            <div class="form-group">
                <label for="order-money-amount" th:text="#{orders.money.amount.withUnit}"></label>
                <input type="text" id="order-money-amount" name="amount" inputmode="numeric" data-number-input="exact-whole"
                       data-testid="order-money-amount" th:data-invalid="#{orders.money.amount.invalid}"
                       aria-describedby="order-money-amount-error" required>
                <p id="order-money-amount-error" class="field-error" data-money-amount-error hidden
                   th:text="#{orders.money.amount.invalid}"></p>
            </div>
            <label class="cluster gap-2">
                <input type="checkbox" name="bankFree" data-testid="order-money-bank-free" required>
                <span th:text="#{orders.money.bankFree}"></span>
            </label>
        </fieldset>
        <div data-money-preview data-testid="order-money-preview" role="status" hidden>
            <dl class="facts-bar">
                <div>
                    <dt class="fact-k" th:text="#{orders.money.amount.withUnit}"></dt>
                    <dd class="fact-v" data-preview-value="amount"></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.preview.fee}"></dt>
                    <dd class="fact-v" data-preview-value="fee"></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.preview.holding}"></dt>
                    <dd class="fact-v" data-preview-value="holding"></dd>
                </div>
            </dl>
        </div>
        <button type="button" class="btn btn-ghost" data-money-preview-retry hidden
                th:text="#{orders.money.preview.retry}"></button>
    </div>
    <div class="krt-modal-foot">
        <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                data-modal-id="order-money-provision-modal" th:text="#{general.cancel}"></button>
        <button type="submit" class="btn btn--cta" data-testid="order-money-save" th:text="#{orders.detail.save}" disabled></button>
    </div>
</form>
</body>
</html>
