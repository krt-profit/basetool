<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="mode-auec" th:fragment="form(auecMode)" th:hidden="${!auecMode}">
    <form class="orders-create__form" th:action="@{/orders/auec}" method="post"
          th:data-error="#{orders.money.create.error}">
        <fieldset class="form-section">
            <legend class="form-section__head" th:text="|1 · #{orders.create.section.order}|"></legend>
            <div class="form-grid">
                <div th:replace="~{joborder/fragments/orgunit-select :: orgUnitSelect('auec-responsible-org-unit', 'responsibleOrgUnitId', ${responsibleOptions}, ${auecOrderForm.responsibleOrgUnitId}, 'orders.create.responsible', true)}"></div>
                <div th:replace="~{joborder/fragments/orgunit-select :: orgUnitSelect('auec-requesting-org-unit', 'requestingOrgUnitId', ${requestingOptions}, ${auecOrderForm.requestingOrgUnitId}, 'orders.create.requesting', true)}"></div>
                <div class="form-group">
                    <label for="auec-handle" th:text="#{orders.create.handle}"></label>
                    <input type="text" id="auec-handle" name="handle" data-testid="order-auec-handle"
                           th:value="${auecOrderForm.handle}" autocomplete="off" maxlength="200" required>
                </div>
                <div class="form-group">
                    <label for="auec-target" th:text="#{orders.money.target.withUnit}"></label>
                    <input type="text" id="auec-target" name="target" inputmode="numeric" data-number-input="exact-whole"
                           data-testid="order-auec-target" th:data-invalid="#{orders.money.amount.invalid}" th:value="${auecTarget}" required>
                </div>
            </div>
        </fieldset>
        <fieldset class="form-section" th:with="comment=${auecOrderForm.comment},commentLimit=1000">
            <legend class="form-section__head">
                <label for="auec-comment"><span aria-hidden="true">2 · </span><span th:text="#{orders.create.comment}"></span></label>
                <span class="opt" th:text="|· #{form.optional}|"></span>
            </legend>
            <div class="form-group">
                <textarea id="auec-comment" name="comment" rows="4" th:maxlength="${commentLimit}" th:placeholder="#{orders.create.comment.placeholder}"
                          aria-describedby="auec-comment-count" data-counter="auec-comment-count" th:text="${comment}"></textarea>
                <p class="form-hint orders-create__counter" id="auec-comment-count"
                   th:text="|${comment == null ? 0 : comment.length()} / ${commentLimit}|"></p>
            </div>
        </fieldset>
        <div class="form-actions--sticky">
            <span class="form-actions__summary" id="orders-auec-summary" data-testid="order-auec-summary"
                  th:attr="data-amount=#{orders.money.amount.display},data-for=#{orders.create.summary.for}"></span>
            <a th:href="@{/orders}" class="btn btn-ghost" th:text="#{orders.create.cancel}"></a>
            <button type="submit" class="btn btn--cta" data-testid="order-auec-submit">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg>
                <span th:text="#{orders.create.submit.create}"></span>
            </button>
        </div>
    </form>
</div>
</body>
</html>
