<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="action">
    <button th:if="${money.canCorrectRecipient and recipient.correctable and currentUserId != null}" type="button"
            class="btn btn-ghost" data-trigger="od-money-recipient-identity"
            th:data-recipient-id="${recipient.id}" th:data-recipient-label="${name}"
            data-testid="order-money-recipient-correct"
            th:aria-label="#{orders.money.recipient.identity.correctNamed(${name})}"
            th:text="#{orders.money.recipient.identity.correct}"></button>
</th:block>

<th:block th:fragment="retired">
    <ul class="od-assignee-list" th:if="${!#lists.isEmpty(money.recipients.?[!active])}">
        <li class="od-assignee split" th:each="recipient : ${money.recipients.?[!active]}"
            th:if="${(money.canCorrectRecipient and recipient.correctable) or money.returnableRecipientIds.contains(recipient.id)}"
            th:with="name=${@handles.display(recipient.name) ?: #messages.msg('orders.money.nameUnavailable')},
                     returnable=${money.returnableRecipientIds.contains(recipient.id)},
                     label=${#messages.msg(recipient.userId != null ? 'orders.money.holder.linkedLabel' : 'orders.money.holder.accountlessLabel', name)}"
            th:data-money-recipient="${returnable and !recipient.bankDestination ? recipient.id : null}"
            th:data-holder-id="${recipient.holderId}" th:data-user-id="${recipient.userId}"
            th:data-recipient-label="${label}" data-money-recipient-active="false"
            th:data-money-recipient-returnable="${returnable}"
            th:hidden="${!money.canCorrectRecipient or !recipient.correctable}">
            <span th:text="#{orders.money.recipient.identity.retired(${name})}"></span>
            <th:block th:replace="~{joborder/fragments/order-money-recipient-identity :: action}"></th:block>
        </li>
    </ul>
</th:block>

<th:block th:fragment="history">
    <ul th:if="${!#lists.isEmpty(money.recipients.?[correctsId != null])}" class="od-assignee-list">
        <li class="od-assignee split" th:each="recipient : ${money.recipients.?[correctsId != null]}"
            data-testid="order-money-recipient-identity-history"
            th:with="previous=${@handles.display(recipient.previousName) ?: #messages.msg('orders.money.nameUnavailable')},
                     corrected=${@handles.display(recipient.correctionName) ?: #messages.msg('orders.money.nameUnavailable')}">
            <div>
                <strong th:text="#{orders.money.recipient.identity.history(${previous}, ${corrected})}"></strong>
                <div th:text="#{orders.money.history.recordedBy(
                    ${@handles.display(recipient.correctionActorName) ?: #messages.msg('orders.money.nameUnavailable')})}"></div>
            </div>
            <time class="od-money-date" th:datetime="${recipient.correctedAt}" th:data-utc="${recipient.correctedAt}"></time>
        </li>
    </ul>
</th:block>

<th:block th:fragment="dialog">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-recipient-identity-modal',
        titleKey='orders.money.recipient.identity.correct', body=~{joborder/fragments/order-money-recipient-identity :: form})}"></th:block>
</th:block>

<form th:fragment="form" id="order-money-recipient-identity-form">
    <div class="krt-modal-body">
        <p data-recipient-identity-label></p>
        <p class="text-muted" th:text="#{orders.money.recipient.identity.explanation}"></p>
        <p class="alert alert-info" role="status" data-recipient-identity-stale hidden
           th:text="#{orders.money.recipient.identity.stale}"></p>
        <div th:replace="~{joborder/fragments/order-money-movement :: partyChoice('order-money-recipient-identity-party', 'party')}"></div>
    </div>
    <div class="krt-modal-foot">
        <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                data-modal-id="order-money-recipient-identity-modal" th:text="#{general.cancel}"></button>
        <button type="submit" class="btn btn--cta" data-testid="order-money-recipient-identity-save"
                th:text="#{orders.detail.save}" disabled></button>
    </div>
</form>
</body>
</html>
