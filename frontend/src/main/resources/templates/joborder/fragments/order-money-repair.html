<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="dialog">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='order-money-repair-modal',
        titleKey='orders.money.bank.repair', body=~{joborder/fragments/order-money-repair :: form})}"></th:block>
</th:block>

<form th:fragment="form" id="order-money-repair-form">
    <div class="krt-modal-body">
        <p class="alert alert-info" role="status" data-repair-paid hidden th:text="#{orders.money.bank.repair.paid}"></p>
        <p class="alert alert-warning" role="status" data-repair-stale hidden th:text="#{orders.money.basis.changed}"></p>
        <fieldset class="form-section" data-repair-fields>
            <legend class="visually-hidden" th:text="#{orders.money.bank.repair}"></legend>
            <fieldset th:replace="~{joborder/fragments/order-money-bank :: mode('order-money-repair-bank')}"></fieldset>
            <div class="form-group">
                <label for="order-money-repair-amount" th:text="#{orders.money.amount.withUnit}"></label>
                <input type="text" name="amount" id="order-money-repair-amount" data-testid="order-money-repair-amount"
                       inputmode="numeric" data-number-input="exact-whole" th:data-invalid="#{orders.money.amount.invalid}" required>
            </div>
            <div class="form-group" hidden>
                <label for="order-money-repair-provision" th:text="#{orders.money.provide}"></label>
                <input type="text" name="provision" id="order-money-repair-provision" inputmode="numeric"
                       data-number-input="exact-whole" th:data-invalid="#{orders.money.amount.invalid}" disabled>
            </div>
            <div class="form-group" hidden>
                <label for="order-money-repair-account" th:text="#{orders.money.bank.account}"></label>
                <select name="bankAccountId" id="order-money-repair-account" data-testid="order-money-repair-account" disabled>
                    <option value="" th:text="#{orders.money.bank.repair.keepAccount}"></option>
                </select>
            </div>
            <div class="form-group" hidden>
                <label for="order-money-repair-reason" th:text="#{orders.money.bank.justification}"></label>
                <textarea name="justification" id="order-money-repair-reason" maxlength="1000"
                          data-testid="order-money-repair-reason" disabled></textarea>
            </div>
        </fieldset>
        <div data-money-preview data-testid="order-money-repair-preview" hidden>
            <dl class="facts-bar">
                <div>
                    <dt class="fact-k" th:text="#{orders.money.amount.withUnit}"></dt>
                    <dd class="fact-v" data-preview-value="amount"></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.preview.fee}"></dt>
                    <dd class="fact-v" data-preview-value="fee"></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.bank.preview.feePayer}"></dt>
                    <dd class="fact-v" data-repair-fee-payer
                    th:data-payer-order="#{orders.money.bank.preview.payer.order}"
                    th:data-payer-krt="#{orders.money.bank.preview.payer.krt}"
                    th:data-payer-depositor="#{orders.money.bank.preview.payer.depositor}"
                    th:data-payer-bank-source="#{orders.money.bank.preview.payer.bankSource}"></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.bank.repair.rate}"></dt>
                    <dd class="fact-v" data-repair-rate></dd>
                </div>
                <div>
                    <dt class="fact-k" th:text="#{orders.money.bank.repair.sourceCharge}"></dt>
                    <dd class="fact-v" data-preview-value="sourceCharge"></dd>
                </div>
                <div data-preview-bank-debit hidden>
                    <dt class="fact-k" th:text="#{orders.money.bank.preview.debit}"></dt>
                    <dd class="fact-v" data-preview-value="bankDebit"></dd>
                </div>
            </dl>
            <p th:replace="~{joborder/fragments/order-money-bank :: disposition}"></p>
        </div>
        <p th:replace="~{joborder/fragments/order-money-bank :: problem}"></p>
        <button type="button" class="btn btn-ghost" data-money-preview-retry hidden
                th:text="#{orders.money.bank.repair.retryPreview}"></button>
    </div>
    <div class="krt-modal-foot">
        <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                data-modal-id="order-money-repair-modal" th:text="#{general.cancel}"></button>
        <button type="submit" class="btn btn--cta" data-testid="order-money-repair-save" disabled
                th:text="#{orders.detail.save}"></button>
    </div>
</form>
</body>
</html>
