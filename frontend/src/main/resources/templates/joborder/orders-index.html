<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="${requesterView} ? #{nav.orders.own} : #{nav.orders}">Aufträge</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/joborder/orders-index.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='orders.list', eyebrowKey='nav.group.logistics', titleText=(${requesterView} ? #{nav.orders.own} : #{nav.orders}),
        count=${ordersPage != null ? ordersPage.totalElements() : null}, countId='orders-count', countFor='orders-results', actions=~{::orders-actions})}">
        <th:block th:ref="orders-actions">
            <a th:href="@{/orders/create(source='index')}" class="btn btn--cta" data-testid="orders-create-link"
               th:text="#{orders.index.new}">Neuer Auftrag</a>
        </th:block>
    </th:block>

    <section class="list-panel">
    <form id="orders-filter-form" class="no-track" method="get" th:action="@{/orders}">
        <div class="toolbar orders-toolbar">
            <th:block th:if="${!scopeOptions.isEmpty()}">
                <th:block th:replace="~{kernel/fragments/components :: segmented(name='scope', labelKey='orders.index.scope.label', selected=${scope},
                    options=${scopeOptions})}"></th:block>
            </th:block>
            <th:block th:replace="~{kernel/fragments/components :: filterPopover(panelId='orders-filter-panel', panelName='orders',
                testid='orders-filter-toggle', body=~{::orders-filter-body})}">
                <th:block th:ref="orders-filter-body">
                    <fieldset class="orders-filter-field">
                        <legend class="orders-filter-label" th:text="#{orders.index.status}">Status</legend>
                        <div class="cluster gap-3">
                            <label class="orders-filter-check">
                                <input type="checkbox" name="status" value="OPEN" th:checked="${selectedStatuses != null and selectedStatuses.contains('OPEN')}">
                                <span th:text="#{status.OPEN}">Offen</span>
                            </label>
                            <label class="orders-filter-check">
                                <input type="checkbox" name="status" value="IN_PROGRESS" th:checked="${selectedStatuses != null and selectedStatuses.contains('IN_PROGRESS')}">
                                <span th:text="#{status.IN_PROGRESS}">In Bearbeitung</span>
                            </label>
                            <label class="orders-filter-check">
                                <input type="checkbox" name="status" value="REJECTED" th:checked="${selectedStatuses != null and selectedStatuses.contains('REJECTED')}">
                                <span th:text="#{status.REJECTED}">Abgelehnt</span>
                            </label>
                            <label class="orders-filter-check">
                                <input type="checkbox" name="status" value="COMPLETED" th:checked="${selectedStatuses != null and selectedStatuses.contains('COMPLETED')}">
                                <span th:text="#{status.COMPLETED}">Abgeschlossen</span>
                            </label>
                        </div>
                    </fieldset>
                    <div th:if="${squadronFilterAvailable}" id="ordersSquadronField" class="orders-filter-field" data-filter-chip-ignore
                         th:hidden="${squadronFilterHidden}">
                        <span class="orders-filter-label" th:text="#{orders.index.filter.squadron}">Staffel</span>
                        <div class="multi-select-container" id="squadronFilterContainer">
                            <div class="multi-select-header" data-trigger="ord-toggle-squadron-multi"
                                 data-multi-target="squadronOptions"
                                 th:data-all="#{filter.all}" th:data-selected="#{filter.selected}" id="squadronHeader">
                                <span class="selected-text" id="squadronSelectedText" th:text="#{filter.all}">Alle</span>
                            </div>
                            <div class="multi-select-options" id="squadronOptions">
                                <label class="multi-select-option">
                                    <span th:text="#{filter.all}">Alle</span>
                                    <input type="checkbox" id="sqAll" value="ALL" data-filter-ignore
                                           data-trigger="ord-toggle-squadron-all"
                                           data-all-id="sqAll" data-check-class="sqCheck" data-header-id="squadronHeader">
                                </label>
                                <label class="multi-select-option" th:each="sq : ${squadrons}">
                                    <span th:text="${sq.shorthand() != null ? sq.shorthand() : sq.name()}" th:title="${sq.name()}">ALP</span>
                                    <input type="checkbox" class="sqCheck" name="squadronId" th:value="${sq.id}"
                                           th:checked="${selectedSquadronIds == null or selectedSquadronIds.isEmpty() or selectedSquadronIds.contains(sq.id)}"
                                           data-trigger="ord-update-squadron-state"
                                           data-all-id="sqAll" data-check-class="sqCheck" data-header-id="squadronHeader">
                                </label>
                            </div>
                        </div>
                    </div>
                </th:block>
            </th:block>
        </div>
        <th:block th:replace="~{kernel/fragments/components :: filterChips('orders-filter-form')}"></th:block>
    </form>

    <div th:if="${error}" class="alert alert-danger" th:text="#{__${error}__}">Fehler</div>
    <div th:if="${success}" class="alert alert-success" th:text="#{__${success}__}">Erfolg</div>

    <div id="orders-results" class="card card--flush">
        <th:block th:fragment="ordersResults">
        <div class="table-responsive" th:if="${orders != null and !orders.isEmpty()}">
            <table class="data-table data-table--stack orders-table">
                <thead>
                <tr>
                    <th th:text="#{orders.index.order}">Auftrag</th>
                    <th class="cell-status" th:text="#{orders.index.status}">Status</th>
                    <th class="num" th:text="#{orders.index.prio}">Prio</th>
                    <th th:text="#{orders.index.requesting}">Auftraggeber</th>
                    <th th:text="#{orders.index.materials}">Materialien</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.open}">Öffnen</span></th>
                </tr>
                </thead>
                <tbody th:with="queue=${orders.?[priority != null]}">
                <tr th:each="order : ${orders}" data-testid="order-row"
                    th:with="reorderable=${isLogisticianOrAbove and order.priority != null}"
                    th:attr="data-id=${order.id}, data-priority=${order.priority}, data-reorder-name=${reorderable} ? #{orders.index.reorderName(${order.displayId})} : null"
                    th:classappend="${reorderable} ? 'draggable-row' : ''"
                    th:draggable="${reorderable} ? 'true' : 'false'">
                    <td>
                        <a class="row-link" data-testid="row-link" draggable="false" th:href="@{/orders/{id}(id=${order.id})}">
                            <span class="cell-title">
                                <span class="order-id-display" th:data-utc="${order.createdAt}" th:text="'#' + ${order.displayId}">#42</span>
                            </span>
                            <span class="cell-sub orders-meta">
                                <th:block th:switch="${order.type}">
                                    <span th:case="'ITEM'" class="order-kind-badge order-kind-item" th:text="#{orders.kind.item}">Item</span>
                                    <span th:case="*" class="order-kind-badge order-kind-material" th:text="#{orders.kind.material}">Material</span>
                                </th:block>
                                <span class="order-responsible-label" th:text="#{orders.index.responsible}">Bearbeitende Einheit</span>
                                <span th:if="${order.responsibleOrgUnit != null}" class="squadron-badge"
                                      th:title="${order.responsibleOrgUnit.name()}"
                                      th:text="${order.responsibleOrgUnit.shorthand()}">ALP</span>
                                <span th:if="${order.responsibleOrgUnit == null}" class="squadron-badge squadron-badge-muted"
                                      th:title="#{orders.index.responsible}">—</span>
                            </span>
                        </a>
                    </td>
                    <td class="cell-status">
                        <span class="status-pill" th:classappend="${'status-' + #strings.toLowerCase(order.status)}"
                              th:text="#{__${'status.' + order.status}__}">Offen</span>
                    </td>
                    <td class="num" th:attr="data-label=#{orders.index.prio}">
                        <span th:if="${reorderable}" class="orders-drag-handle" aria-hidden="true"
                              th:title="#{orders.index.dragHandle}">☰</span>
                        <span th:text="${order.priority != null ? order.priority : '-'}">1</span>
                        <th:block th:if="${reorderable}">
                            <span th:replace="~{kernel/fragments/components :: reorderControls(itemName=#{orders.index.reorderName(${order.displayId})},
                                first=${queue[0].id == order.id}, last=${queue[#lists.size(queue) - 1].id == order.id})}"></span>
                        </th:block>
                    </td>
                    <td th:attr="data-label=#{orders.index.requesting}">
                        <span th:if="${order.requestingOrgUnit != null}" class="squadron-badge"
                              th:title="${order.requestingOrgUnit.name()}"
                              th:text="${order.requestingOrgUnit.shorthand()}">ALP</span>
                        <span th:if="${order.requestingOrgUnit == null}" class="squadron-badge squadron-badge-muted">—</span>
                        <span class="cell-sub" th:text="${@handles.display(order.handle)}">Handle</span>
                    </td>
                    <td class="orders-materials-cell" th:with="matCount=${order.type == 'ITEM' ? (order.aggregatedMaterials != null ? order.aggregatedMaterials.size() : 0) : (order.materials != null ? order.materials.size() : 0)}">
                        <button type="button" class="btn btn-ghost btn-xs ord-materials-toggle" data-trigger="ord-toggle-materials" th:data-order-id="${order.id}" aria-expanded="false">
                            <span class="toggle-icon" aria-hidden="true">&#9654;</span>
                            <span th:text="#{orders.index.materials}">Materialien</span>
                            <span class="text-muted" th:text="'(' + ${matCount} + ')'">(0)</span>
                        </button>
                        <div class="ord-materials-body" hidden th:data-order-materials="${order.id}">
                        <table th:if="${order.type != 'ITEM'}" class="data-table data-table--compact orders-materials-table">
                            <thead>
                                <tr>
                                    <th th:text="#{orders.material.name}">Material</th>
                                    <th class="num" th:text="#{orders.material.amount}">Gefordert</th>
                                    <th th:unless="${ownScope}" class="num" th:text="#{orders.material.progress}">Fortschritt</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="mat : ${order.materials}">
                                    <td class="orders-material-name" th:text="${mat.material.name}" th:title="${mat.material.name}">Titanium</td>
                                    <td class="num" th:switch="${mat.material.quantityType}">
                                        <span th:case="'PIECE'" th:text="|${mat.amount != null ? #numbers.formatInteger(mat.amount, 1) : '0'} #{material.quantity.piece}|"></span>
                                        <span th:case="*" th:text="|${mat.amount != null ? #numbers.formatDecimal(mat.amount, 1, 'DEFAULT', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|"></span>
                                    </td>
                                    <td th:unless="${ownScope}" class="num" th:attr="data-label=#{orders.material.progress}" th:text="${#numbers.formatDecimal(mat.amount > 0 ? (mat.currentStock >= mat.amount ? 100.0 : (mat.currentStock * 100.0 / mat.amount)) : 0, 1, 0)} + ' %'">0 %</td>
                                </tr>
                            </tbody>
                        </table>
                        <table th:if="${order.type == 'ITEM' and order.aggregatedMaterials != null and !order.aggregatedMaterials.isEmpty()}"
                               class="data-table data-table--compact orders-materials-table">
                            <thead>
                                <tr>
                                    <th th:text="#{orders.material.name}">Material</th>
                                    <th class="num" th:text="#{orders.material.amount}">Gefordert</th>
                                    <th th:unless="${ownScope}" class="num" th:text="#{orders.material.progress}">Fortschritt</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="agg : ${order.aggregatedMaterials}">
                                    <td class="orders-material-name" th:text="${agg.material != null ? agg.material.name() : '-'}" th:title="${agg.material != null ? agg.material.name() : '-'}">Titanium</td>
                                    <td class="num" th:switch="${agg.material != null ? agg.material.quantityType() : 'SCU'}">
                                        <span th:case="'PIECE'" th:text="|${agg.totalQuantity != null ? #numbers.formatInteger(agg.totalQuantity, 1) : '0'} #{material.quantity.piece}|"></span>
                                        <span th:case="*" th:text="|${agg.totalQuantity != null ? #numbers.formatDecimal(agg.totalQuantity, 1, 'DEFAULT', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|"></span>
                                    </td>
                                    <td th:unless="${ownScope}" class="num" th:attr="data-label=#{orders.material.progress}" th:text="${#numbers.formatDecimal((agg.totalQuantity != null and agg.totalQuantity > 0) ? ((agg.currentStock != null ? agg.currentStock : 0) >= agg.totalQuantity ? 100.0 : ((agg.currentStock != null ? agg.currentStock : 0) * 100.0 / agg.totalQuantity)) : 0, 1, 0)} + ' %'">0 %</td>
                                </tr>
                            </tbody>
                        </table>
                        <p th:if="${order.type == 'ITEM' and (order.aggregatedMaterials == null or order.aggregatedMaterials.isEmpty())}"
                           class="orders-materials-empty" th:text="#{orders.detail.aggregated.empty}">Keine Materialien abgeleitet.</p>
                        </div>
                    </td>
                    <td class="cell-actions"><svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg></td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block th:if="${orders == null or orders.isEmpty()}">
            <th:block th:replace="~{kernel/fragments/components :: emptyState(titleKey='orders.index.empty', textKey='orders.index.empty.text')}"></th:block>
        </th:block>

        <th:block th:replace="~{kernel/fragments/components :: listFoot(pageResponse=${ordersPage}, baseUrl=${paginationBaseUrl})}"></th:block>
        <nav th:replace="~{kernel/fragments/pagination :: pageSizePicker(pageResponse=${ordersPage}, baseUrl=${paginationBaseUrl}, sizes=${pageSizes})}"></nav>
        </th:block>
    </div>
    <th:block th:if="${isLogisticianOrAbove}">
        <p th:replace="~{kernel/fragments/components :: reorderLive}"></p>
    </th:block>
    </section>
</main>
</th:block>
<th:block th:fragment="pageTail">
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const KRT_ORDERS_AGE_YELLOW = /*[[${ageYellowDays}]]*/ 30;
    const KRT_ORDERS_AGE_RED = /*[[${ageRedDays}]]*/ 90;
    const KRT_ORDERS_LIVESYNC_UPDATES = /*[[#{livesync.updates_available}]]*/ 'Aktualisierungen verfuegbar';
    const KRT_ORDERS_SECTION_REFRESH_ERROR = /*[[#{orders.section.refresh.error}]]*/ 'Die Liste konnte nicht aktualisiert werden. Bitte Seite neu laden.';
</script>
<script type="module" th:src="@{/js/joborder/orders-index.js}" th:attr="nonce=${cspNonce}"></script>
<script th:if="${isLogisticianOrAbove}" th:inline="javascript" th:attr="nonce=${cspNonce}">
    const KRT_ORDERS_REORDER_I18N = {
        success: /*[[#{success.joborder.priority}]]*/ 'Priority updated.',
        error: /*[[#{error.joborder.priority.failed}]]*/ 'Could not update priority.',
        conflict: {
            title: /*[[#{orders.conflict.toast.title}]]*/ 'Conflict',
            detail: /*[[#{orders.conflict.toast.detail}]]*/ 'The data changed in the meantime.',
            reloadLabel: /*[[#{orders.conflict.action.reload}]]*/ 'Load current values',
            reloadQuestion: /*[[#{orders.conflict.action.reload.question}]]*/ 'Load current values?',
            dismissLabel: /*[[#{orders.conflict.action.dismiss}]]*/ 'Cancel'
        }
    };
</script>
<script type="module" th:if="${isLogisticianOrAbove}" th:src="@{/js/joborder/orders-index-reorder.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
