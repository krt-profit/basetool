<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="${detail != null ? detail.account().name() : ''} + ' - ' + ${appTitle}">Konto - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/bank.css}">
        <link rel="stylesheet" th:href="@{/css/bank-account-detail.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main class="bank-detail" th:if="${detail != null}" th:with="acct=${detail.account()}, caps=${detail.capabilities()}"
      th:attr="data-bank-generic-error=#{bank.error.network},data-bank-saved=#{frontend.ajax.saved},data-bank-refresh-error=#{bank.refresh.failed},data-bank-approval-request-filed=#{bank.movement.approvalRequestFiled},data-bank-livesync-updates=#{livesync.updates_available},data-bank-account-id=${acct.id()},data-user-id=${#authentication.name},data-transfer-fee-rate=${transferFeeRate}">
    <div id="bank-account-results">
    <th:block th:fragment="accountBody" th:if="${detail != null}"
              th:with="acct=${detail.account()}, caps=${detail.capabilities()}">
    <th:block th:replace="~{fragments/bank-account-detail :: detailHead(acct=${acct}, eyebrowKey='bank.dashboard.title',
        eyebrowHref=@{/bank}, noTestId='bank-account-no', actions=~{::bank-detail-actions})}">
        <th:block th:ref="bank-detail-actions">
            <button type="button" class="btn btn-ghost"
                    data-trigger="open-modal-display" data-modal-id="bank-statement-modal"
                    data-testid="bank-statement-open">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-pdf"/></svg>
                <span th:text="#{bank.action.statement}">Kontoauszug</span>
            </button>
            <button type="button" class="btn btn--cta"
                    th:if="${acct.status() == 'ACTIVE' and caps != null and (caps.canDeposit() or caps.canWithdraw() or caps.canTransfer())}"
                    data-trigger="open-modal-display" data-modal-id="bank-movement-modal"
                    data-testid="bank-movement-open">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-swap"/></svg>
                <span th:text="#{bank.action.movement}">Kontobewegung</span>
            </button>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/bank-account-detail :: kpis(acct=${acct}, delta=${detail.delta30d()},
        bookingCount=${detail.bookingCount()}, balanceTestId='bank-balance', targetTestId='bank-detail-target')}"></th:block>

    <th:block th:replace="~{fragments/bank-approval-limits :: limitsDisplay(${detail.approvalLimits()})}"></th:block>

    <th:block th:replace="~{fragments/bank-account-detail :: tabNav(idPrefix='bank-detail', testIdPrefix='bank-detail',
        bookingCount=${detail.bookingCount()}, secondTab='info', secondLabelKey='bank.detail.info',
        secondTestId='bank-detail-tab-info', storageKey='bank_account_tab_', tabsLabel=${acct.name()})}"></th:block>

    <div class="stack bank-detail-panel" id="bank-detail-panel-history" data-tabpanel="history" role="tabpanel"
         aria-labelledby="bank-detail-tab-history">
        <section class="card bank-chart-card" data-testid="bank-chart-panel">
            <div id="bank-chart-results" data-bank-swap="balanceChart">
            <th:block th:fragment="balanceChart">
                <th:block th:replace="~{fragments/bank-balance-chart :: chartBody}"></th:block>
            </th:block>
            </div>
        </section>

        <section class="card card--flush bank-bookings-card" data-testid="bank-bookings-panel">
            <th:block th:replace="~{fragments/bank-account-detail :: historyFilter(idPrefix='bank-history',
                testIdPrefix='bank-history', resultsId='bank-bookings-results', fragmentName='bookings')}"></th:block>
            <div id="bank-bookings-results" data-bank-swap="bookings" data-bank-swap-history="true">
            <th:block th:fragment="bookings">
                <th:block th:replace="~{fragments/bank-account-detail :: bookingsTable(staff=true,
                    rowTestId='bank-booking-row', testIdPrefix='bank-booking', emptyTestId='bank-bookings-empty')}"></th:block>
            </th:block>
            </div>
        </section>
    </div>

    <div class="stack bank-detail-panel" id="bank-detail-panel-info" data-tabpanel="info" role="tabpanel"
         aria-labelledby="bank-detail-tab-info" hidden>
        <th:block th:replace="~{fragments/bank-account-detail :: infoCard(${acct})}"></th:block>
    </div>

    <th:block th:if="${caps != null and (caps.canDeposit() or caps.canWithdraw() or caps.canTransfer())}">
        <th:block th:replace="~{fragments/bank-movement-modal :: movementModal('bank-movement-modal', 'accountBody', ${acct.id()}, false, ${acct.type() == 'CARTEL' or acct.type() == 'CARTEL_BANK' or acct.type() == 'SPECIAL'}, ${caps.canDeposit()}, ${caps.canWithdraw()}, ${caps.canTransfer()})}"></th:block>
    </th:block>

    <th:block sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).BANK_MANAGEMENT)">
    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='bank-reverse-modal', titleKey='bank.modal.reverse.title', variant='krt-modal--danger', body=~{::bank-reverse-modal-body})}">
        <th:block th:ref="bank-reverse-modal-body">
            <form class="bank-ajax-form no-track" data-refresh="accountBody"
                  data-livesync="bank:@account/account,bookings,chart bank/grid orgunit-bank/orgUnitBank"
                  th:data-livesync-account="${acct.id()}"
                  data-endpoint="/api/proxy/bank/transactions/{id}/reversal" data-method="POST">
                <input type="hidden" name="_id">
                <div class="krt-modal-body">
                    <p th:text="#{bank.modal.reverse.text}">Erzeugt eine negierte Gegenbuchung. Die Originalbuchung bleibt unver&auml;ndert im Ledger.</p>
                    <div class="bank-form-row">
                        <label for="bank-reverse-note" th:text="#{bank.field.note}">Notiz</label>
                        <input type="text" id="bank-reverse-note" name="note" maxlength="500"
                               th:placeholder="#{bank.modal.reverse.note.placeholder}">
                    </div>
                    <span class="bank-field-error" data-error-for="_global"></span>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                            data-modal-id="bank-reverse-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn-danger" data-testid="bank-reverse-submit"
                            th:text="#{bank.action.reverse}">Stornieren</button>
                </div>
            </form>
        </th:block>
    </th:block>
    </th:block>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='bank-statement-modal', titleKey='bank.modal.statement.title', body=~{::bank-statement-modal-body})}">
        <th:block th:ref="bank-statement-modal-body">
            <form class="bank-download-form no-track"
                  th:attr="data-endpoint='/api/proxy/bank/accounts/' + ${acct.id()} + '/statement',data-filename='kontoauszug-' + ${acct.accountNo()} + '.pdf',data-period-required=#{bank.error.periodRequired}">
                <div class="krt-modal-body">
                    <p class="bank-field-hint" th:text="#{bank.modal.statement.hint}">Zeitraum in deiner Lokalzeit; das PDF rendert die Zeitstempel ebenfalls lokal.</p>
                    <div class="bank-form-row datetime-split-group" data-datetime-filter-role="start">
                        <label for="bank-statement-from-date" th:text="#{bank.field.period.from}">Von</label>
                        <input type="hidden" name="from">
                        <div class="bank-datetime-row">
                            <input type="date" id="bank-statement-from-date" class="date-part"
                                   data-testid="bank-statement-from-date">
                            <input type="time" id="bank-statement-from-time" class="time-part"
                                   th:aria-label="#{bank.field.period.from}">
                        </div>
                        <span class="bank-field-error" data-error-for="from"></span>
                    </div>
                    <div class="bank-form-row datetime-split-group" data-datetime-filter-role="end">
                        <label for="bank-statement-to-date" th:text="#{bank.field.period.to}">Bis</label>
                        <input type="hidden" name="to">
                        <div class="bank-datetime-row">
                            <input type="date" id="bank-statement-to-date" class="date-part"
                                   data-testid="bank-statement-to-date">
                            <input type="time" id="bank-statement-to-time" class="time-part"
                                   th:aria-label="#{bank.field.period.to}">
                        </div>
                        <span class="bank-field-error" data-error-for="to"></span>
                    </div>
                    <span class="bank-field-error" data-error-for="_global"></span>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                            data-modal-id="bank-statement-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn--cta" data-testid="bank-statement-submit"
                            th:text="#{bank.modal.statement.submit}">PDF herunterladen</button>
                </div>
            </form>
        </th:block>
    </th:block>
    </th:block>
    </div>
</main>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/bank-account-detail.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/bank.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
