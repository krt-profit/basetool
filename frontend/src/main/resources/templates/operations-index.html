<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{operations.title} + ' - ' + ${appTitle}">Operations - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/operations-index.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />
<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.mission_planning', titleText=#{operations.title},
        count=${operationsPage != null ? operationsPage.totalElements() : null}, countId='operations-count', countFor='operations-results', actions=~{::operations-actions})}">
        <th:block th:ref="operations-actions">
            <button sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).MISSION_MANAGER)"
                    type="button" class="btn btn--cta" data-testid="page-head-primary" th:text="#{operation.create}"
                    data-trigger="open-modal-display" data-modal-id="create-operation-modal">Create New</button>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/components :: alert(type='success', msgKey=${successMessage}, extraClass=null)}"></th:block>
    <th:block th:replace="~{fragments/components :: alert(type='danger', msgKey=${errorMessage}, extraClass=null)}"></th:block>
    <th:block th:replace="~{fragments/components :: alert(type='danger', msgKey=${error}, extraClass=null)}"></th:block>

    <form id="operations-filter-form" method="get" th:action="@{/operations}" class="no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('operation-search', 'search', ${search}, 'operation.search.placeholder')}"></th:block>
            <th:block th:replace="~{fragments/components :: segmented(name='period', labelKey='mission.period.label', selected=${period},
                options=${ {{value: 'UPCOMING', labelKey: 'mission.period.upcoming'}, {value: 'PAST', labelKey: 'mission.period.past'}, {value: 'ALL', labelKey: 'filter.all'}} })}"></th:block>
            <th:block th:replace="~{fragments/components :: filterPopover(panelId='operations-filter-panel', panelName='operations',
                testid='operations-filter-toggle', body=~{::operations-filter-body})}">
                <th:block th:ref="operations-filter-body">
                    <div class="datetime-split-group" data-datetime-filter-role="start">
                        <label for="operation-start" th:text="#{operation.filter.start}">From</label>
                        <input type="hidden" name="start" id="operation-start" th:value="${start}" data-chip-format="datetime" th:attr="data-chip-label=#{operation.filter.start}">
                        <div class="datetime-split-inputs">
                            <input type="date" class="date-part" th:aria-label="#{a11y.datetime.date}">
                            <input type="time" class="time-part" th:aria-label="#{a11y.datetime.time}">
                        </div>
                    </div>
                    <div class="datetime-split-group" data-datetime-filter-role="end" th:attr="data-validate-after='operation-start', data-error-after=#{validation.datetime.after}">
                        <label for="operation-end" th:text="#{operation.filter.end}">To</label>
                        <input type="hidden" name="end" id="operation-end" th:value="${end}" data-chip-format="datetime" th:attr="data-chip-label=#{operation.filter.end}">
                        <div class="datetime-split-inputs">
                            <input type="date" class="date-part" th:aria-label="#{a11y.datetime.date}">
                            <input type="time" class="time-part" th:aria-label="#{a11y.datetime.time}">
                        </div>
                    </div>
                    <button type="button" id="operations-filter-reset" class="btn btn-ghost" th:text="#{general.reset}">Reset</button>
                </th:block>
            </th:block>
            <span id="operations-loading-indicator" hidden><span class="krt-loading-indicator"></span></span>
        </div>
        <th:block th:replace="~{fragments/components :: filterChips('operations-filter-form')}"></th:block>
    </form>

    <div id="operations-results" class="card card--flush">
        <th:block th:fragment="operationsResults">
        <table th:if="${operations != null and !operations.isEmpty()}" class="data-table data-table--stack operations-table">
            <thead>
                <tr>
                    <th th:text="#{operation.name}">Name</th>
                    <th class="cell-status" th:text="#{operation.status}">Status</th>
                    <th th:if="${isAllSquadronsMode}" th:text="#{mission.owning_squadron}">Staffel</th>
                    <th th:text="#{general.created}">Erstellt</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.action}">Action</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="op : ${operations}" data-testid="operation-row">
                    <td>
                        <a class="row-link" data-testid="row-link" th:href="@{/operations/{id}(id=${op.id})}">
                            <span class="cell-title" th:text="${op.name}">Name</span>
                            <span class="cell-sub operations-desc" th:if="${op.description != null and !#strings.isEmpty(op.description)}"
                                  th:text="${op.description}">Description</span>
                        </a>
                    </td>
                    <td class="cell-status">
                        <span class="status-pill" th:classappend="${'status-' + #strings.toLowerCase(op.status)}"
                              th:text="#{__${'operation.status.' + #strings.toLowerCase(op.status)}__}">Status</span>
                    </td>
                    <td th:if="${isAllSquadronsMode}" th:attr="data-label=#{mission.owning_squadron}">
                        <span th:if="${op.owningSquadron != null}" class="squadron-badge"
                              th:title="${op.owningSquadron.name()}"
                              th:text="${op.owningSquadron.shorthand()}">IRI</span>
                        <span th:if="${op.owningSquadron == null}" class="squadron-badge squadron-badge-muted">&mdash;</span>
                    </td>
                    <td th:attr="data-label=#{general.created}">
                        <span th:if="${op.createdAt != null}" class="utc-time" data-format="short" th:text="${op.createdAt}">Created</span>
                        <span th:if="${op.createdAt == null}">&mdash;</span>
                    </td>
                    <td class="cell-actions">
                        <button sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.support.Roles).ADMIN)" type="button"
                                class="btn btn-quiet-danger btn-icon" th:title="#{general.delete}" th:aria-label="#{general.delete}"
                                th:data-id="${op.id}" data-trigger="operations-open-delete"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                        <svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                    </td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${operations == null or operations.isEmpty()}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='operation.empty', textKey='operation.empty.text')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${operationsPage}, baseUrl='/operations')}"></th:block>
        </th:block>
    </div>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='create-operation-modal', titleKey='operation.create', variant='krt-modal--wide', body=~{::create-operation-modal-body})}">
        <th:block th:ref="create-operation-modal-body">
            <form id="create-operation-form" th:action="@{/operations/create}" method="post">
                <div class="krt-modal-body">
                <div class="form-group">
                    <label for="create-name" class="form-label" th:text="#{operation.name}">Name</label>
                    <input type="text" id="create-name" name="name" class="w-full" required>
                </div>
                <div class="form-group">
                    <label for="create-desc" class="form-label" th:text="#{operation.description}">Description</label>
                    <textarea id="create-desc" name="description" class="w-full"></textarea>
                </div>
                <div class="form-group">
                    <label for="create-status" class="form-label" th:text="#{operation.status}">Status</label>
                    <select id="create-status" name="status" class="w-full" required>
                        <option value="PLANNED" th:text="#{operation.status.planned}">PLANNED</option>
                        <option value="ACTIVE" th:text="#{operation.status.active}">ACTIVE</option>
                        <option value="COMPLETED" th:text="#{operation.status.completed}">COMPLETED</option>
                        <option value="CANCELED" th:text="#{operation.status.canceled}">CANCELED</option>
                    </select>
                </div>
                <th:block th:replace="~{fragments/owner-picker :: ownerPicker(options=${ownerOptions}, name='owningOrgUnitId', selected=null, required=false)}"></th:block>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="create-operation-modal" th:text="#{general.cancel}">Cancel</button>
                    <button type="submit" class="btn btn--cta"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{general.save}">Save</span></button>
                </div>
            </form>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='delete-operation-modal', titleKey='general.confirm', variant='krt-modal--danger', body=~{::delete-operation-modal-body})}">
        <th:block th:ref="delete-operation-modal-body">
            <form id="delete-operation-form" th:action="@{/operations/delete}" method="post">
                <div class="krt-modal-body">
                    <p class="m-0" th:text="#{operation.delete.confirm}">Confirm that you want to delete this operation.</p>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="delete-operation-modal" th:text="#{general.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-danger" th:text="#{general.delete}">Delete</button>
                </div>
            </form>
        </th:block>
    </th:block>
</main>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const OPS_MSG = {
        createSuccess: /*[[#{operation.create.success}]]*/ 'Operation angelegt.',
        createError: /*[[#{operation.create.error}]]*/ 'Fehler beim Anlegen.',
        deleteSuccess: /*[[#{operation.delete.success}]]*/ 'Operation geloescht.',
        deleteError: /*[[#{operation.delete.error}]]*/ 'Fehler beim Loeschen.',
        conflictTitle: /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        conflictDetail: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Geaendert.',
        conflictReload: /*[[#{frontend.ajax.conflict.reload}]]*/ 'Neu laden',
        conflictDismiss: /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        conflictQuestion: /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
</script>
<script th:src="@{/js/operations-index.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/operations.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
