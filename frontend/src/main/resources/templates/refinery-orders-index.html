<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{refineryorder.index.title} + ' - ' + ${appTitle}">Raffinerie - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/refinery-orders-index.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main class="refinery-index">
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.logistics', titleText=#{refineryorder.index.title}, actions=~{::refinery-actions})}">
        <th:block th:ref="refinery-actions">
            <a th:href="@{/refinery-orders/create(source='index')}" class="btn btn--cta" data-testid="refinery-create-link"
               ><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-plus"/></svg> <span th:text="#{refineryorder.create.btn}">Neuer Auftrag</span></a>
        </th:block>
    </th:block>

    <form id="refinery-filter-form" method="get" th:action="@{/refinery-orders}" class="no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: segmented(name='view', labelKey='refineryorder.view.label', selected=${view}, variant='refinery-segments',
                options=${ {{value: 'RUNNING', labelKey: 'refineryorder.view.running', count: refineryCounts?.running()},
                            {value: 'READY', labelKey: 'refineryorder.view.ready', count: refineryCounts?.ready()},
                            {value: 'COMPLETED', labelKey: 'refineryorder.view.completed', count: refineryCounts?.completed()},
                            {value: 'ALL', labelKey: 'filter.all', count: refineryCounts?.all()}} })}"></th:block>
            <th:block th:replace="~{fragments/components :: toolbarSearch('refinery-search', 'q', ${searchQuery}, 'refineryorder.search.placeholder')}"></th:block>
            <label class="switch" for="refinery-only-mine">
                <input type="checkbox" id="refinery-only-mine" name="onlyMine" value="true" th:checked="${onlyMine}">
                <span class="switch__track" aria-hidden="true"></span>
                <span th:text="#{refineryorder.index.filter.onlyMine}">Meine Auftr&auml;ge</span>
            </label>
            <span id="refinery-loading-indicator" hidden><span class="krt-loading-indicator"></span></span>
        </div>
        <th:block th:replace="~{fragments/components :: filterChips('refinery-filter-form')}"></th:block>
    </form>

    <div id="refinery-orders-results" class="card card--flush">
        <th:block th:fragment="refineryOrdersResults">
        <span hidden data-refinery-counts
              th:attr="data-running=${refineryCounts?.running()},data-ready=${refineryCounts?.ready()},data-completed=${refineryCounts?.completed()},data-all=${refineryCounts?.all()}"></span>

        <table th:if="${!#lists.isEmpty(orderRows)}" class="data-table data-table--stack refinery-table"
               th:attr="data-msg-ready=#{refinery.readyFor},data-msg-ready-unknown=#{refineryorder.list.ready},data-msg-ends-in=#{refineryorder.list.endsIn}">
            <thead>
            <tr>
                <th th:text="#{refineryorder.list.yield}">Ausbeute</th>
                <th th:text="#{refineryorder.list.refinery}">Raffinerie</th>
                <th th:text="#{refineryorder.list.done}">Fertig</th>
                <th th:text="#{refineryorder.index.owner}">Besitzer</th>
                <th class="cell-actions"><span class="visually-hidden" th:text="#{refineryorder.index.actions}">Aktionen</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${orderRows}" th:with="o=${row.order()},endsLabel=${row.endsAt() != null ? #temporals.format(@relativeDays.local(row.endsAt()), 'dd.MM. HH:mm') : null}" data-testid="refinery-order-row"
                th:classappend="${row.ready()} ? 'refinery-row--ready'"
                th:attr="data-state=${row.state().name()},data-ends-at=${row.endsAt() != null ? row.endsAt().toEpochMilli() : null},data-started-at=${o.startedAt != null ? o.startedAt.toEpochMilli() : null},data-ends-label=${endsLabel}">
                <td>
                    <a class="row-link" data-testid="row-link" th:href="@{/refinery-orders/{id}(id=${o.id})}">
                        <span class="cell-title" th:text="${row.outputLabel()}">Quantanium 18,4 SCU</span>
                        <span class="cell-sub"><span th:text="'#' + ${row.shortId()}">#1042</span><th:block th:if="${row.inputCount() == 1}"> &middot; <span th:text="#{refineryorder.list.input.one(${row.inputName()}, ${row.inputUnits()})}">Quantanium-Erz 2.300 Units</span></th:block><th:block th:if="${row.inputCount() > 1}"> &middot; <span th:text="#{refineryorder.list.input.many(${row.inputCount()}, ${row.inputUnits()})}">2 Erze &middot; 1.650 Units</span></th:block></span>
                    </a>
                </td>
                <td th:attr="data-label=#{refineryorder.list.refinery}">
                    <span class="cell-title refinery-location" th:text="${o.location != null ? o.location.name : '—'}">ARC-L1</span>
                    <span class="cell-sub" th:if="${o.refiningMethod != null}" th:text="${o.refiningMethod.name}">Dinyx Solventation</span>
                </td>
                <td class="refinery-done" th:attr="data-label=#{refineryorder.list.done}">
                    <th:block th:switch="${row.state().name()}">
                        <span th:case="'RUNNING'" class="refinery-done__text" data-refinery-done-text
                              th:text="#{refineryorder.list.endsIn(${row.remaining()}, ${#temporals.format(@relativeDays.local(row.endsAt()), 'dd.MM. HH:mm')})}">in 3 h 20 min &middot; 03.10. 18:00</span>
                        <span th:case="'READY'" class="refinery-done__text refinery-done__text--ready" data-refinery-done-text
                              th:text="${row.readySince() != null} ? #{refinery.readyFor(${row.readySince()})} : #{refineryorder.list.ready}">abholbereit seit 1 h</span>
                        <span th:case="'COMPLETED'" class="refinery-done__text refinery-done__text--muted"
                              th:text="#{refineryorder.status.COMPLETED}">Abgeschlossen</span>
                        <span th:case="*" class="refinery-done__text refinery-done__text--danger"
                              th:text="#{refineryorder.status.CANCELED}">Abgebrochen</span>
                    </th:block>
                    <span th:if="${row.state().name() == 'RUNNING' or row.ready()}" class="meter refinery-meter" aria-hidden="true"
                          ><i th:classappend="${row.ready()} ? 'meter__fill--success'" th:attr="data-krtm-width=${row.progressPercent()}"></i></span>
                </td>
                <td th:attr="data-label=#{refineryorder.index.owner}" th:text="${o.owner != null ? o.owner.effectiveName : '—'}">greluc</td>
                <td class="cell-actions">
                    <a th:if="${row.storable()}" th:hidden="${!row.ready()}" class="btn btn-ghost btn-xs" data-refinery-store
                       data-testid="refinery-row-store" th:href="@{/refinery-orders/{id}(id=${o.id},store='open')}"
                       th:text="#{refineryorder.action.store}">Einlagern</a>
                    <svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                </td>
            </tr>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(orderRows)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='refineryorder.list.empty.title', textKey='refineryorder.list.empty.text')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${ordersPage}, baseUrl=${paginationBaseUrl})}"></th:block>
        <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${ordersPage}, baseUrl=${paginationBaseUrl}, sizes=${pageSizes})}"></nav>
        </th:block>
    </div>
</main>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/refinery-orders-index.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
