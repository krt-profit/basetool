<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title>Material Details - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/inventory-material.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/basetool-logo.svg}" alt="" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1>Detailansicht Material</h1>
    </div>

    <div class="hud-box mt-2">
        <div class="actions-bar">
            <a th:href="@{/inventory}" class="btn btn-ghost">&laquo; Zurück zur Übersicht</a>
            
            <div class="krtm-margin-left-auto-display-flex-gap-0-5rem-ali-7023">
                <label for="materialSelect" class="krtm-font-family-var-font-body-font-size-0-8rem-8675">Anderes Material:</label>
                <select id="materialSelect" class="material-select" data-trigger="navigate-select" data-url-template="/inventory/material/{value}" data-krt-combobox="remote-materials">
                    <option th:each="mat : ${materials}" th:if="${mat.id == selectedMaterialId}" th:value="${mat.id}" th:text="${mat.name}" th:selected="${mat.id == selectedMaterialId}"></option>
                </select>
            </div>
        </div>

        <div id="inventory-material-results">
        <th:block th:fragment="inventoryMaterialResults">
        <div class="overflow-x-auto">
            <div class="table-responsive">
            <table class="krt-table">
                <thead>
                    <tr>
                        <th>Nutzer</th>
                        <th>Ort</th>
                        <th>Qualität</th>
                        <th>Menge</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.user.effectiveName}">Username</td>
                        <td th:text="${item.location.name}">Ort</td>
                        <td th:text="${item.quality}">100</td>
                        <td th:switch="${item.material.quantityType}">
                            <span th:case="'PIECE'" th:text="|${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'} #{material.quantity.piece}|">10 Stück</span>
                            <span th:case="*" th:text="|${item.amount != null ? #numbers.formatDecimal(item.amount, 1, 'NONE', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|">10.500 SCU</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="4" class="text-center text-muted">Keine Einträge für dieses Material gefunden.</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
        <div class="pagination-controls" th:if="${inventoryMaterialPage != null}"
             th:with="matBase=${'/inventory/material/' + selectedMaterialId}">
            <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${inventoryMaterialPage}, baseUrl=${matBase}, sizes=${pageSizes})}"></nav>
            <nav th:replace="~{fragments/pagination :: pagination(pageResponse=${inventoryMaterialPage}, baseUrl=${matBase})}"></nav>
        </div>
        </th:block>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/inventory-material.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
