<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="${materialName ?: #messages.msg('inventory.material.drilldown.title')} + ' - ' + ${appTitle}">Material - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/inventory-material.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.inventory', eyebrowHref=@{/inventory},
        titleText=${materialName ?: #messages.msg('inventory.material.drilldown.title')},
        count=${inventoryMaterialPage != null ? inventoryMaterialPage.totalElements() : null},
        countId='inventory-material-count', countFor='inventory-material-results', actions=null)}"></th:block>

    <div class="toolbar drill-toolbar">
        <label for="materialSelect" class="form-label-xs" th:text="#{inventory.material.switch}">Anderes Material</label>
        <select id="materialSelect" class="material-select" data-trigger="navigate-select" data-url-template="/inventory/material/{value}" data-krt-combobox="remote-materials">
            <option th:each="mat : ${materials}" th:if="${mat.id == selectedMaterialId}" th:value="${mat.id}" th:text="${mat.name}" th:selected="${mat.id == selectedMaterialId}"></option>
        </select>
    </div>

    <div id="inventory-material-results" class="card card--flush">
        <th:block th:fragment="inventoryMaterialResults">
        <div th:if="${error}" class="alert alert-danger drill-alert" role="alert" th:text="#{__${error}__}">Fehler</div>

        <table th:if="${!#lists.isEmpty(items)}" class="data-table data-table--stack">
            <thead>
                <tr>
                    <th th:text="#{inventory.user}">Nutzer</th>
                    <th th:text="#{inventory.location}">Standort</th>
                    <th class="num" th:text="#{inventory.quality}">Qualit&auml;t</th>
                    <th class="num" th:text="#{inventory.amount}">Menge</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}" data-testid="inventory-material-row">
                    <td><span class="cell-title" th:text="${item.user.effectiveName}">Username</span></td>
                    <td th:attr="data-label=#{inventory.location}" th:text="${item.location.name}">Ort</td>
                    <td class="num" th:attr="data-label=#{inventory.quality}" th:text="${item.quality}">100</td>
                    <td class="num" th:attr="data-label=#{inventory.amount}" th:switch="${item.material.quantityType}">
                        <span th:case="'PIECE'" th:text="|${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'} #{material.quantity.piece}|">10 St&uuml;ck</span>
                        <span th:case="*" th:text="|${item.amount != null ? #numbers.formatDecimal(item.amount, 1, 'NONE', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|">10.500 SCU</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(items)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='inventory.material.drilldown.empty', textKey='inventory.drilldown.empty.text')}"></th:block>
        </th:block>

        <div class="list-foot" th:if="${inventoryMaterialPage != null and inventoryMaterialPage.totalElements() > 0}"
             th:data-list-total="${inventoryMaterialPage.totalElements()}"
             th:with="matBase=${'/inventory/material/' + selectedMaterialId}">
            <span data-testid="list-count"
                  th:text="#{list.countOf(${inventoryMaterialPage.page() * inventoryMaterialPage.size() + 1}, ${inventoryMaterialPage.page() * inventoryMaterialPage.size() + #lists.size(inventoryMaterialPage.content())}, ${inventoryMaterialPage.totalElements()})}">1–50 von 120</span>
            <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${inventoryMaterialPage}, baseUrl=${matBase}, sizes=${pageSizes})}"></nav>
            <nav th:replace="~{fragments/pagination :: pagination(pageResponse=${inventoryMaterialPage}, baseUrl=${matBase})}"></nav>
        </div>
        </th:block>
    </div>
</main>
<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/inventory-material.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
