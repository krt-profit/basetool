<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{nav.inventory} + ' - ' + ${appTitle}">Lagerverwaltung - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/inventory-index.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.logistics', titleText=#{nav.inventory},
        count=${inventoryPage != null ? inventoryPage.totalElements() : null}, countId='inventory-count', countFor='inventory-results', actions=~{::inventory-actions})}">
        <th:block th:ref="inventory-actions">
            <a th:href="${view == 'items'} ? @{/inventory/all(view='items')} : @{/inventory/all}" class="btn btn-ghost"
               data-testid="inventory-global-link" th:text="#{inventory.overview.global}">Globales Lager</a>
            <a th:href="${view == 'items'} ? @{/inventory/my(view='items')} : @{/inventory/my}" class="btn btn--cta"
               data-testid="inventory-my-link" th:text="#{inventory.overview.my}">Mein Lager</a>
        </th:block>
    </th:block>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{__${error}__}">Fehler</div>
    <div th:if="${isAllSquadronsMode}" class="alert alert-info" th:text="#{inventory.index.all_squadrons_notice}">
        Aggregation across all squadrons. Select a single squadron to filter.
    </div>

    <div class="tab-nav inventory-tabs" role="tablist" th:aria-label="#{inventory.items.view.aria}">
        <a th:href="@{/inventory}" class="tab" role="tab"
           th:classappend="${view != 'items'} ? ' active' : ''" th:aria-selected="${view != 'items'}"
           data-testid="lager-view-material" th:text="#{inventory.items.view.material}">Material</a>
        <a th:href="@{/inventory(view='items')}" class="tab" role="tab"
           th:classappend="${view == 'items'} ? ' active' : ''" th:aria-selected="${view == 'items'}"
           data-testid="lager-view-items" th:text="#{inventory.items.view.items}">Items</a>
    </div>

    <div id="inventory-results" class="card card--flush">
        <th:block th:fragment="inventoryResults">
        <th:block th:if="${view != 'items'}">
        <table th:if="${!#lists.isEmpty(aggregated)}" class="data-table data-table--stack">
            <thead>
                <tr>
                    <th th:text="#{inventory.aggregated.col.material}">Material</th>
                    <th class="num" th:text="#{inventory.aggregated.col.avgQuality}">Ø Qualität</th>
                    <th class="num" th:text="#{inventory.aggregated.col.maxQuality}">Max. Qualität</th>
                    <th class="num" th:text="#{inventory.aggregated.col.totalAmount}">Gesamtmenge</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.open}">Open</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${aggregated}" data-testid="inventory-aggregate-row">
                    <td>
                        <a class="row-link" data-testid="row-link" th:href="@{/inventory/all(materialIds=${item.material.id})}">
                            <span class="cell-title" th:text="${item.material.name}">Material</span>
                        </a>
                    </td>
                    <td class="num" th:attr="data-label=#{inventory.aggregated.col.avgQuality}"
                        th:text="${item.quality != null ? #numbers.formatDecimal(item.quality, 1, 'NONE', 2, 'DEFAULT') : '0.00'}">100.00</td>
                    <td class="num" th:attr="data-label=#{inventory.aggregated.col.maxQuality}"
                        th:text="${item.maxQuality != null ? #numbers.formatDecimal(item.maxQuality, 1, 'NONE', 2, 'DEFAULT') : '0.00'}">100.00</td>
                    <td class="num" th:switch="${item.material.quantityType}">
                        <span th:case="'PIECE'" th:text="|${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'} #{material.quantity.piece}|">10 Stück</span>
                        <span th:case="*" th:text="|${item.amount != null ? #numbers.formatDecimal(item.amount, 1, 'NONE', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|">10.500 SCU</span>
                    </td>
                    <td class="cell-actions"><svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg></td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(aggregated)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='inventory.aggregated.empty', textKey='inventory.aggregated.empty.text',
                actionHref=@{/inventory/my}, actionKey='inventory.overview.my')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${inventoryPage}, baseUrl='/inventory')}"></th:block>
        </th:block>
        <th:block th:if="${view == 'items'}">
        <table th:if="${!#lists.isEmpty(aggregated)}" class="data-table data-table--stack">
            <thead>
                <tr>
                    <th th:text="#{inventory.items.aggregated.col.item}">Item</th>
                    <th th:text="#{inventory.items.aggregated.col.kind}">Art</th>
                    <th class="num" th:text="#{inventory.aggregated.col.totalAmount}">Gesamtmenge</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.open}">Open</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${aggregated}" data-testid="inventory-aggregate-row">
                    <td>
                        <a class="row-link" data-testid="row-link" th:href="@{/inventory/all(view='items', gameItemIds=${item.gameItem.id})}">
                            <span class="cell-title" th:text="${item.gameItem.name}">Item</span>
                            <span class="cell-sub" th:text="${item.gameItem.manufacturer} ?: '&mdash;'">Hersteller</span>
                        </a>
                    </td>
                    <td>
                        <span th:if="${item.gameItem.kind != null}"
                              th:with="kindKey=|inventory.items.kind.${item.gameItem.kind}|"
                              th:text="${#messages.msgOrNull(kindKey)} ?: ${item.gameItem.kind}">Art</span>
                    </td>
                    <td class="num" th:text="|${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'} #{material.quantity.piece}|">10 Stück</td>
                    <td class="cell-actions"><svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg></td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(aggregated)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='inventory.items.aggregated.empty', textKey='inventory.items.aggregated.empty.text',
                actionHref=@{/inventory/my(view='items')}, actionKey='inventory.overview.my')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${inventoryPage}, baseUrl='/inventory?view=items')}"></th:block>
        </th:block>
        </th:block>
    </div>
</main>
<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/inventory-index.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
