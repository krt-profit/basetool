<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title>Lagerverwaltung - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<style th:attr="nonce=${cspNonce}">
        .actions-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .material-select {
            padding: 0.5rem;
            background-color: var(--color-surface-input);
            border: 1px solid var(--color-gray-3);
            color: var(--color-gray-1);
            font-family: var(--font-body);
        }
    </style>
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/krt.webp}" alt="Logo" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1>Lagerverwaltung</h1>
    </div>

    <div class="hud-box mt-2">
        <div th:if="${error}" class="hud-box hud-box-error">
            <p th:text="#{__${error}__}">Fehler</p>
        </div>

        <div class="krtm-display-flex-justify-content-space-between-a-3a17">
            <h3 class="krtm-font-family-lato-sans-serif-font-weight-700-957b" th:text="#{inventory.overview.aggregated}">Aggregiertes Staffellager</h3>
            <div class="actions-bar krtm-margin-bottom-0-5043">
                <a th:href="@{/inventory/my}" class="btn btn-outline" th:text="#{inventory.overview.my}">Mein Lager</a>
                <a th:href="@{/inventory/all}" class="btn btn-outline" th:text="#{inventory.overview.global}">Globales Lager</a>
            </div>
        </div>
        <!-- The aggregated view buckets quantities per material across the entire active
             squadron context. In admin "all squadrons" mode the bucket merges items from
             every staffel - the row is per-material, not per-squadron-per-material - so
             tell the admin the totals span all staffeln. Members never enter this mode. -->
        <div th:if="${isAllSquadronsMode}" class="squadron-badge squadron-badge-muted krtm-display-block-padding-0-6rem-0-9rem-margin-b-3373"
             th:text="#{inventory.index.all_squadrons_notice}">
            Aggregation across all squadrons. Select a single squadron to filter.
        </div>
        <div class="overflow-x-auto">
            <div id="inventory-results">
            <th:block th:fragment="inventoryResults">
            <div class="table-responsive">
            <table class="krt-table">
                <thead>
                    <tr>
                        <th th:text="#{inventory.aggregated.col.material}">Material</th>
                        <th th:text="#{inventory.aggregated.col.avgQuality}">Ø Qualität</th>
                        <th th:text="#{inventory.aggregated.col.maxQuality}">Max. Qualität</th>
                        <th th:text="#{inventory.aggregated.col.totalAmount}">Gesamtmenge</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${aggregated}"
                        th:data-href="@{/inventory/all(materialIds=${item.material.id})}"
                        data-trigger="navigate-href"
                        class="clickable-row krtm-cursor-pointer-74fa">
                        <td th:text="${item.material.name}" class="krtm-color-var-color-white-c482">Material</td>
                        <td th:text="${item.quality != null ? #numbers.formatDecimal(item.quality, 1, 'NONE', 2, 'DEFAULT') : '0.00'}">100.00</td>
                        <td th:text="${item.maxQuality != null ? #numbers.formatDecimal(item.maxQuality, 1, 'NONE', 2, 'DEFAULT') : '0.00'}">100.00</td>
                        <td th:switch="${item.material.quantityType}">
                            <span th:case="'PIECE'" th:text="|${item.amount != null ? #numbers.formatInteger(item.amount, 1) : '0'} #{material.quantity.piece}|">10 Stück</span>
                            <span th:case="*" th:text="|${item.amount != null ? #numbers.formatDecimal(item.amount, 1, 'NONE', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|">10.500 SCU</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(aggregated)}">
                        <td colspan="4" class="text-center text-muted" th:text="#{inventory.aggregated.empty}">Keine Einträge vorhanden.</td>
                    </tr>
                </tbody>
            </table>
            </div>
            
            <div th:replace="~{fragments/pagination :: pagination(pageResponse=${inventoryPage}, baseUrl='/inventory')}"></div>
            </th:block>
            </div>

        </div>
    </div>
</main>
<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/inventory-index.js}" th:attr="nonce=${cspNonce}"></script>
</body>
</html>
