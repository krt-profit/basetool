<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent})}">
<head>
    <title th:text="${appTitle} + ' - ' + (${terms} != null ? ${terms.title} : ${#messages.msg('terms.unavailable.title')})">Profit Basetool - Nutzungsbedingungen</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/shell/legal.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(eyebrowKey='nav.legal',
        titleText=${terms != null ? terms.title : #messages.msg('terms.unavailable.title')})}"></th:block>
    <div class="card legal-doc" data-testid="legal-doc">
        <th:block th:if="${terms != null}">
            <th:block th:replace="~{identity/fragments/terms-body :: termsBody(${terms})}" />
        </th:block>
        <p th:if="${terms == null}" class="alert alert-warning" th:text="#{terms.unavailable}">Die Nutzungsbedingungen k&ouml;nnen gerade nicht geladen werden.</p>
    </div>
</main>
</th:block>
</body>
</html>
