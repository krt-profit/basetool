<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent})}">
<head>
    <title th:text="#{members.export.title} + ' - ' + ${appTitle}">Datenauskunft - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/identity/member-export.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(eyebrowKey='nav.members', eyebrowHref=@{/members}, titleText=${user.effectiveName})}"></th:block>

    <th:block th:replace="~{identity/fragments/member-tabs :: tabs(${user.id}, 'export')}"></th:block>

    <section class="card member-export stack"
             sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
        <h2 class="member-export__title" th:text="#{members.export.title}">Datenauskunft</h2>
        <div class="alert alert-info" th:text="#{members.export.hint}">F&uuml;r eine Auskunftsanfrage eines Mitglieds, das sich nicht anmelden kann. Namen anderer Mitglieder sind entfernt.</div>
        <div class="cluster">
            <a th:href="@{/admin/members/{id}/export/pdf(id=${user.id})}" class="btn btn-outline"
               data-testid="member-export-pdf">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-pdf"/></svg>
                <span th:text="#{members.export.pdf}">Als PDF</span>
            </a>
            <a th:href="@{/admin/members/{id}/export/json(id=${user.id})}" class="btn btn-ghost"
               data-testid="member-export-json">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-download"/></svg>
                <span th:text="#{members.export.json}">Als JSON</span>
            </a>
        </div>
    </section>
</main>
</th:block>
</body>
</html>
