<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{blueprintOverview.title} + ' - ' + ${appTitle}">Blueprint Availability - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/blueprint-overview.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.logistics', titleText=#{blueprintOverview.title},
        count=${overviewPage != null ? overviewPage.totalElements() : null}, countId='bp-overview-count', countFor='bp-overview-results')}"></th:block>

    <div th:if="${error}" class="alert alert-danger" th:text="#{__${error}__}">Error</div>

    <div th:if="${isAllSquadronsMode}" class="alert alert-info" data-testid="bp-overview-all-units"
         th:text="#{blueprintOverview.all_orgunits_notice}">Aggregation across all org units.</div>

    <form id="bp-overview-filter-form" class="bpo-filter-form no-track" method="get" th:action="@{/blueprint-overview}"
          th:if="${overviewPage != null and (overviewPage.totalElements() > 0 or search != null)}">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('bp-overview-filter', 'search', ${search}, 'blueprintOverview.filter.placeholderPeople')}"></th:block>
        </div>
        <input type="hidden" name="size" th:value="${overviewPage.size()}">
    </form>

    <div id="bp-overview-results" class="card card--flush">
    <th:block th:fragment="results">
        <table th:if="${!#lists.isEmpty(overview)}" class="data-table data-table--stack bpo-table">
            <thead>
            <tr>
                <th th:text="#{blueprintOverview.column.blueprint}">Blueprint</th>
                <th class="num" th:text="#{blueprintOverview.column.count}">Anzahl</th>
                <th th:text="#{blueprintOverview.column.canCraft}">Kann craften</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="item, iter : ${overview}">
            <tr class="bpo-row" data-testid="bp-overview-row"
                th:attr="data-product-key=${item.productKey},data-owner-count=${item.ownerCount}">
                <td><span class="cell-title" th:text="${item.productName}">Blueprint</span></td>
                <td class="num" th:attr="data-label=#{blueprintOverview.column.count}">
                    <span class="bpo-count" th:text="${item.ownerCount}">0</span>
                </td>
                <td class="bpo-owners-cell" th:attr="data-label=#{blueprintOverview.column.canCraft}">
                    <div class="bpo-chips" data-loaded="false"
                         th:attr="data-more-for=${'bpo-more-' + iter.index}"></div>
                </td>
            </tr>
            <tr class="details-row" th:id="${'bpo-more-' + iter.index}">
                <td colspan="3" class="p-0">
                    <div class="bp-owners-panel"></div>
                </td>
            </tr>
            </th:block>
            </tbody>
        </table>

        <th:block th:if="${#lists.isEmpty(overview) and search == null}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='blueprintOverview.empty.title', textKey='blueprintOverview.empty')}"></th:block>
        </th:block>
        <th:block th:if="${#lists.isEmpty(overview) and search != null}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='blueprintOverview.filter.no_results.title', textKey='blueprintOverview.filter.no_results')}"></th:block>
        </th:block>

        <th:block th:if="${overviewPage != null}"
                  th:with="bpBase=${search != null ? '/blueprint-overview?search=' + #uris.escapeQueryParam(search) : '/blueprint-overview'}">
            <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${overviewPage}, baseUrl=${bpBase})}"></th:block>
            <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${overviewPage}, baseUrl=${bpBase}, sizes=${pageSizes})}"></nav>
        </th:block>
    </th:block>
    </div>
</main>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    window.krtBlueprintOverview = {
        ownersUrl: /*[[@{/blueprint-overview/owners}]]*/ '/blueprint-overview/owners',
        i18n: {
            loading: /*[[#{blueprintOverview.owners.loading}]]*/ 'Loading owners...',
            empty: /*[[#{blueprintOverview.owners.empty}]]*/ 'No owners.',
            error: /*[[#{blueprintOverview.owners.error}]]*/ 'Could not load owners.',
            notMember: /*[[#{blueprintOverview.owners.notMember}]]*/ 'not a unit member',
            notMemberHint: /*[[#{blueprintOverview.owners.notMember.hint}]]*/ 'Visible via global blueprint sharing.',
            more: /*[[#{blueprintOverview.owners.more}]]*/ '+{0} more',
            less: /*[[#{blueprintOverview.owners.less}]]*/ 'Show less'
        }
    };
</script>
<script th:src="@{/js/blueprint-overview.js}" defer th:attr="nonce=${cspNonce}"></script>

</body>
</html>
