<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="#{blueprintOverview.title} + ' - ' + ${appTitle}">Blueprint Availability - Profit Basetool</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/krt.webp}" alt="Logo" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1 th:text="#{blueprintOverview.title}">Blueprint Availability</h1>
    </div>

    <div class="hud-box mt-2">
        <div th:if="${error}" class="hud-box hud-box-error">
            <p th:text="#{__${error}__}">Error</p>
        </div>

        <style th:attr="nonce=${cspNonce}">
            .details-row {
                display: none;
            }
            /* Toggled per row by blueprint-overview.js. A tr:has(details[open]) sibling
               rule here forced a style recalculation across the whole (up to 1000-row)
               table on every expand and visibly janked the UI (REQ-INV-012). */
            .details-row.bp-expanded {
                display: table-row;
            }
            .details-row td {
                border-left: 2px solid var(--color-primary) !important;
                padding: 0 !important;
                background-color: rgba(0, 0, 0, 0.1);
            }
            .bp-owners-panel {
                padding: 0.75rem 1rem;
            }
            .bp-owners-loading,
            .bp-owners-empty,
            .bp-owners-error {
                font-size: 0.85rem;
                color: var(--color-gray-2);
            }
            .bp-owners-error {
                color: var(--color-danger);
            }
            .bp-owners-list {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .bp-owners-list .bp-owner {
                padding: 0.2rem 0.6rem;
                font-size: 0.85rem;
                color: var(--color-gray-1);
                background-color: rgba(231, 126, 35, 0.08);
                border: 1px solid rgba(231, 126, 35, 0.25);
            }
            /* Discreet marker for an owner shown only via global blueprint sharing
               (REQ-INV-018) — not a member of the caller's oversight org unit. */
            .bp-owners-list .bp-owner-external {
                margin-left: 0.4rem;
                color: var(--color-gray-2);
                font-size: 0.78rem;
                font-style: italic;
            }
            .bp-owner-count {
                font-weight: 700;
            }
            /* ---- Blueprint live filter ---- */
            .bp-filter {
                position: relative;
                max-width: 360px;
                margin-bottom: 1.25rem;
            }
            .bp-filter .bp-filter-icon {
                position: absolute;
                left: 0.85rem;
                top: 50%;
                transform: translateY(-50%);
                display: inline-flex;
                color: var(--color-gray-2);
                pointer-events: none;
            }
            .bp-filter input[type="search"] {
                width: 100%;
                padding-left: 2.6rem;
            }
        </style>

        <!-- The overview aggregates owned blueprints per product across the caller's oversight
             org units. In admin "all org units" mode the bucket merges every org unit - tell the
             admin the totals span all of them. Officers / SK leads only ever see their own. -->
        <div th:if="${isAllSquadronsMode}" class="squadron-badge squadron-badge-muted krtm-display-block-padding-0-6rem-0-9rem-margin-b-3373"
             th:text="#{blueprintOverview.all_orgunits_notice}">
            Aggregation across all org units.
        </div>

        <!-- Server-side search (REQ-INV-013): the table is paginated, so a client-side row
             filter would only ever see the current page. Submitting reloads page 0 with the
             search applied before pagination; the chosen page size is carried along. -->
        <form class="bp-filter" method="get" th:action="@{/blueprint-overview}"
              th:if="${overviewPage != null and (overviewPage.totalElements() > 0 or search != null)}">
            <span class="bp-filter-icon" aria-hidden="true">
                <svg class="krt-icon"><use href="#krt-icon-search"/></svg>
            </span>
            <input type="search" id="bp-overview-filter" name="search" th:value="${search}" autocomplete="off"
                   th:attr="placeholder=#{blueprintOverview.filter.placeholder},aria-label=#{blueprintOverview.filter.placeholder}">
            <input type="hidden" name="size" th:value="${overviewPage.size()}">
        </form>

        <!-- AJAX swap target (REQ-FE-002): filter, paging and the size picker re-render only
             this block via blueprint-overview.js + krtFetch; the no-JS GET fallback still
             reloads the whole page. -->
        <div id="bp-overview-results">
        <th:block th:fragment="results">
        <div class="table-responsive">
        <table class="data-table">
            <thead>
            <tr>
                <th th:text="#{blueprintOverview.column.blueprint}">Blueprint</th>
                <th th:text="#{blueprintOverview.column.owners}">Available from</th>
                <th th:text="#{general.actions}" class="nowrap">Actions</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="item : ${overview}">
            <tr class="bp-row">
                <td th:text="${item.productName}" class="krtm-vertical-align-top-padding-top-1rem-7058">Blueprint</td>
                <td class="krtm-vertical-align-top-padding-top-1rem-7058">
                    <span class="bp-owner-count" th:text="${item.ownerCount}">0</span>
                </td>
                <td class="krtm-vertical-align-top-padding-top-0-5rem-8539">
                    <details th:attr="data-product-key=${item.productKey}">
                        <summary class="btn btn-ghost krtm-cursor-pointer-display-inline-flex-align-ite-c175" th:text="#{general.details}">Details</summary>
                    </details>
                </td>
            </tr>
            <tr class="details-row">
                <td colspan="3" class="p-0">
                    <div class="bp-owners-panel" data-loaded="false"></div>
                </td>
            </tr>
            </th:block>
            <tr th:if="${#lists.isEmpty(overview) and search == null}">
                <td colspan="3" class="text-center" th:text="#{blueprintOverview.empty}">No blueprints recorded.</td>
            </tr>
            <tr th:if="${#lists.isEmpty(overview) and search != null}">
                <td colspan="3" class="text-center" th:text="#{blueprintOverview.filter.no_results}">No results for this search.</td>
            </tr>
            </tbody>
        </table>
        </div>

        <!-- Footer bar: size picker left, page-nav right (REQ-INV-013). The base URL keeps the
             active search so paging and re-sizing never drop the filter. -->
        <div class="pagination-controls" th:if="${overviewPage != null}"
             th:with="bpBase=${search != null ? '/blueprint-overview?search=' + #uris.escapeQueryParam(search) : '/blueprint-overview'}">
            <nav th:replace="~{fragments/pagination :: pageSizePicker(pageResponse=${overviewPage}, baseUrl=${bpBase}, sizes=${pageSizes})}"></nav>
            <nav th:replace="~{fragments/pagination :: pagination(pageResponse=${overviewPage}, baseUrl=${bpBase})}"></nav>
        </div>
        </th:block>
        </div>
    </div>
</main>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    /*<![CDATA[*/
    window.krtBlueprintOverview = {
        ownersUrl: /*[[@{/blueprint-overview/owners}]]*/ '/blueprint-overview/owners',
        i18n: {
            loading: /*[[#{blueprintOverview.owners.loading}]]*/ 'Loading owners...',
            empty: /*[[#{blueprintOverview.owners.empty}]]*/ 'No owners.',
            error: /*[[#{blueprintOverview.owners.error}]]*/ 'Could not load owners.',
            notMember: /*[[#{blueprintOverview.owners.notMember}]]*/ 'not a unit member',
            notMemberHint: /*[[#{blueprintOverview.owners.notMember.hint}]]*/ 'Visible via global blueprint sharing.'
        }
    };
    /*]]*/
</script>
<script th:src="@{/js/blueprint-overview.js}" th:attr="nonce=${cspNonce}"></script>

</body>
</html>
