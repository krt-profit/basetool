<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="${material != null ? material.name : 'Material'} + ' - ' + ${appTitle}">Material Detail - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<style th:attr="nonce=${cspNonce}">
        .material-title {
            font-family: var(--font-body);
            font-weight: 700;
            color: var(--color-primary);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
        }

        .data-section {
            margin-top: 2rem;
        }

        .number-cell {
            text-align: right;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .form-group {
            margin-bottom: 1rem;
            max-width: 400px;
        }
        /* Exclude checkboxes/radios: the full-width padded field styling would otherwise win the
           specificity tie against the global KRT 1.2rem square rule (page <style> renders after
           styles.css) — no .form-group checkbox/radio exists here today, but that latent trap is
           exactly how the admin/materials flag checkboxes broke when they were added later. */
        .form-group input:not([type='checkbox']):not([type='radio']) {
            width: 100%;
            padding: 0.5rem;
            background-color: var(--color-surface-input);
            border: 1px solid var(--color-gray-3);
            color: var(--color-gray-1);
            font-family: var(--font-body);
            box-sizing: border-box;
        }
    </style>
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/krt.webp}" alt="Logo" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1 th:if="${material != null}" th:text="${material.name}">Material Name</h1>
        <h1 th:if="${material == null}" th:text="#{materials.detail.notFound}">Material nicht gefunden</h1>
        <a th:href="@{/materials}" class="btn btn-ghost" th:text="#{orders.detail.back}">Zurück zur Übersicht</a>
    </div>

    <div class="hud-box mt-2">
        <div th:if="${error}" class="hud-box hud-box-error">
            <p th:text="#{__${error}__}">Fehler</p>
        </div>

        <div th:if="${material != null}">
            <div class="krtm-margin-bottom-2rem-color-var-color-gray-1-fo-c8dd">
                <p th:if="${material.description != null && !material.description.isEmpty()}" th:text="${material.description}">Beschreibung...</p>
            </div>

            <div class="data-section">
                <div class="flex-between-mb">
                    <h2 class="krtm-color-var-color-primary-font-family-var-font-1e8a" th:text="#{materials.detail.pricesTitle}">Preise und Terminals</h2>
                    <div class="form-group krtm-margin-0-position-relative-9ca0">
                        <label for="terminalFilter" class="visually-hidden" th:text="#{materials.detail.filterPlaceholder}">Terminal suchen</label>
                        <input type="text" id="terminalFilter" th:placeholder="#{materials.detail.filterPlaceholder}" placeholder="Terminal suchen..." data-trigger="material-detail-filter-terminals" autocomplete="off">
                        <!--/*
                          Terminal names are exposed to JavaScript via this server-
                          rendered <datalist> instead of a Thymeleaf JS-inline
                          expression. Thymeleaf 3.1 truncates the surrounding
                          <script> block right after the first List/Collection
                          JS-inline serialisation, so the data-trigger handler
                          registrations further down for filterTerminals + sortTable
                          would silently never bind. Keep the datalist; do NOT move
                          this back into the <script> block.
                        */-->
                        <datalist id="terminalNames-data" class="krtm-display-none-5790">
                            <option th:if="${prices != null}" th:each="p : ${prices}" th:value="${p.terminalName}"></option>
                        </datalist>
                    </div>
                </div>
                
                <div class="table-responsive">
                <table class="data-table" id="priceTable">
                    <thead>
                        <tr>
                            <th class="sortable-header krtm-cursor-pointer-user-select-none-5942" data-trigger="material-detail-sort" data-sort-column="0" title="Klicken zum Sortieren">
                                <div class="krtm-display-flex-align-items-center-justify-cont-43da">
                                    <span th:text="#{materials.detail.th.terminal}">Terminal</span>
                                    <span class="sort-icon krtm-margin-left-0-5rem-color-var-color-gray-2-fo-60ed" id="sort-icon-0">↕</span>
                                </div>
                            </th>
                            <th class="sortable-header krtm-cursor-pointer-user-select-none-5942" data-trigger="material-detail-sort" data-sort-column="1" title="Klicken zum Sortieren">
                                <div class="flex-end">
                                    <span th:text="#{materials.detail.th.priceBuy}">Einkaufspreis</span>
                                    <span class="sort-icon krtm-margin-left-0-5rem-color-var-color-gray-2-fo-60ed" id="sort-icon-1">↕</span>
                                </div>
                            </th>
                            <th class="sortable-header krtm-cursor-pointer-user-select-none-5942" data-trigger="material-detail-sort" data-sort-column="2" title="Klicken zum Sortieren">
                                <div class="flex-end">
                                    <span th:text="#{materials.detail.th.priceSell}">Verkaufspreis</span>
                                    <span class="sort-icon krtm-margin-left-0-5rem-color-var-color-gray-2-fo-60ed" id="sort-icon-2">↕</span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="price : ${prices}">
                            <td class="terminal-name" th:text="${price.terminalName}">Area18</td>
                            <td class="number-cell" th:text="${price.priceBuy != null && price.priceBuy > 0 ? #numbers.formatInteger(price.priceBuy, 1, 'POINT') + ' aUEC' : '-'}">-</td>
                            <td class="number-cell" th:text="${price.priceSell != null && price.priceSell > 0 ? #numbers.formatInteger(price.priceSell, 1, 'POINT') + ' aUEC' : '-'}">-</td>
                        </tr>
                        <tr id="noDataRow" th:if="${prices == null || prices.isEmpty()}">
                            <td colspan="3" class="krtm-text-align-center-font-style-italic-d125" th:text="#{materials.detail.noData}">Keine Preisdaten verfügbar.</td>
                        </tr>
                        <tr id="noResultsRow" class="krtm-display-none-5790" th:unless="${prices == null || prices.isEmpty()}">
                            <td colspan="3" class="krtm-text-align-center-font-style-italic-color-va-46f9" th:text="#{materials.detail.noResults}">Keine Terminals gefunden.</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/autocomplete.js}" th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/material-detail.js}" th:attr="nonce=${cspNonce}"></script>
</body>
</html>
