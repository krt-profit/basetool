<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{scLinks.title} + ' - ' + ${appTitle}">Star-Citizen-Links - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/shell/sc-links.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(eyebrowKey='nav.section.resources', titleText=#{scLinks.title})}"></th:block>
    <div>
        <p class="lead" th:text="#{scLinks.intro}">Hilfreiche Websites rund um Star Citizen.</p>

        <section class="sc-links-section" th:each="category : ${scLinkCategories}"
                 th:attr="data-testid='sc-links-' + ${category.key}">
            <h2 class="section-title sc-links-head">
                <button type="button" class="sc-links-toggle" data-trigger="sc-links-toggle-category"
                        aria-expanded="true"
                        th:attr="aria-controls='sc-links-grid-' + ${category.key},data-category=${category.key},data-testid='sc-links-toggle-' + ${category.key}">
                    <svg class="krt-icon sc-links-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
                    <span class="sc-links-name" th:text="#{${'scLinks.category.' + category.key}}">Organisation</span>
                    <span class="chip chip--muted" th:text="${#lists.size(category.links())}">2</span>
                </button>
            </h2>
            <ul class="sc-links-grid" th:id="'sc-links-grid-' + ${category.key}">
                <li th:each="link : ${category.links()}">
                    <a class="card sc-link-card" th:href="${link.url}"
                       target="_blank" rel="noopener noreferrer"
                       th:attr="data-testid='sc-link-' + ${link.key}">
                        <img class="sc-link-logo" th:src="@{'/images/sc-links/' + ${link.icon}}"
                             alt="" width="48" height="48" loading="lazy" decoding="async">
                        <span class="sc-link-text">
                            <span class="sc-link-name" th:text="#{${'scLinks.link.' + link.key + '.name'}}">DAS KARTELL</span>
                            <span class="sc-link-host" th:text="${link.displayHost()}">das-kartell.org</span>
                            <span class="sc-link-description" th:text="#{${'scLinks.link.' + link.key + '.description'}}">Beschreibung</span>
                        </span>
                        <span class="visually-hidden" th:text="#{scLinks.newTab}">(&ouml;ffnet in neuem Tab)</span>
                    </a>
                </li>
            </ul>
        </section>

        <p class="sc-links-disclaimer" th:text="#{scLinks.disclaimer}">Externe Angebote Dritter.</p>
    </div>
</main>
</th:block>
<th:block th:fragment="pageTail">
<script th:src="@{/js/shell/sc-links.js}" defer th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
