<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{nav.materials.profit_calculation} + ' - ' + ${appTitle}">Profitberechnung - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/materials-profit-calculation.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.materials', titleText=#{nav.materials.profit_calculation}, count=null)}"></th:block>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{__${error}__}">Fehler</div>

    <div id="profitConfig" hidden
         th:data-label-select-ship="#{profit.info.select_ship}"
         th:data-label-loading="#{profit.info.loading}"
         th:data-label-no-data="#{profit.info.no_data}"
         th:data-label-fetch-error="#{profit.error.fetch}"
         th:data-label-all="#{filter.all}"
         th:data-label-buy="#{profit.route.buy}"
         th:data-label-sell="#{profit.route.sell}"></div>

    <section class="card profit-inputs" data-testid="profit-inputs">
        <div class="form-group profit-inputs__ship">
            <label for="shipSelect" th:text="#{profit.filter.ship}">Schiff</label>
            <select id="shipSelect" data-trigger="profit-update">
                <option value="" th:text="#{profit.filter.ship.placeholder}">-- Schiff wählen --</option>
                <option th:each="ship : ${shipTypes}"
                        th:value="${ship.id}"
                        th:selected="${ship.id == defaultShipId}"
                        th:attr="data-hull-c=${ship.name != null and #strings.containsIgnoreCase(ship.name, 'hull c')}"
                        th:text="${ship.name} + ' · ' + (${ship.scu} ?: '0') + ' SCU'"></option>
            </select>
        </div>

        <div class="form-group profit-inputs__systems">
            <span class="form-label" id="systemLabel" th:text="#{profit.filter.systems}">Systeme</span>
            <div class="filter-popover profit-dropdown">
                <button type="button" class="profit-dropdown__toggle" id="systemHeader"
                        aria-controls="systemOptions" aria-expanded="false" aria-describedby="systemLabel">
                    <span class="selected-text" id="systemSelectedText" th:text="#{filter.all}">Alle</span>
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-chevron-down"/></svg>
                </button>
                <div class="filter-popover__panel profit-dropdown__panel" id="systemOptions" role="group"
                     data-filter-panel="profit-systems" data-filter-transient aria-labelledby="systemLabel">
                    <label class="profit-option profit-option--all">
                        <input type="checkbox" id="sysAll" value="ALL" checked data-trigger="profit-toggle-all"
                               data-check-class="sysCheck" data-header-id="systemHeader">
                        <span th:text="#{filter.all}">Alle</span>
                    </label>
                    <label class="profit-option" th:each="sys : ${starSystems}">
                        <input type="checkbox" class="sysCheck" th:value="${sys}" checked data-trigger="profit-update-state"
                               data-all-id="sysAll" data-check-class="sysCheck" data-header-id="systemHeader">
                        <span th:text="${sys}">System</span>
                    </label>
                </div>
            </div>
        </div>

        <span id="profitHullC" class="chip chip--info profit-inputs__chip" data-testid="profit-hull-c" hidden
              th:text="#{profit.info.hullcChip}">Hull C · nur Loading Dock</span>

        <span class="grow"></span>

        <p class="profit-inputs__note">
            <span th:text="#{profit.info.sortedByMaxProfit}">Sortiert nach Max. Profit je Ladung</span>
            <span th:text="#{profit.info.autoload}">Berücksichtigt nur Auto-Load Terminals.</span>
        </p>
    </section>

    <div id="profitResults" class="card card--flush" data-state="idle" aria-live="polite">
        <table id="resultsTable" class="data-table data-table--stack profit-table">
            <thead>
                <tr>
                    <th scope="col"><span class="profit-rank" aria-hidden="true">#</span><span th:text="#{profit.col.material}">Material</span></th>
                    <th scope="col" th:text="#{profit.col.route}">Route</th>
                    <th scope="col" class="num" th:text="#{profit.col.per_scu}">je SCU</th>
                    <th scope="col" class="num" th:text="#{profit.col.margin}">Marge</th>
                    <th scope="col" class="num" th:text="#{profit.col.capital}">Kapital</th>
                    <th scope="col" class="num" th:text="#{profit.col.total_profit}">Max. Profit</th>
                </tr>
            </thead>
            <tbody id="profitBody"></tbody>
        </table>
        <div id="profitState" class="empty-state profit-state" data-testid="profit-state">
            <span class="empty-title" id="profitStateText" th:text="#{profit.info.select_ship}">Bitte wähle ein Schiff aus, um die Berechnung zu starten.</span>
        </div>
    </div>
</main>

<script th:src="@{/js/materials-profit-calculation.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
