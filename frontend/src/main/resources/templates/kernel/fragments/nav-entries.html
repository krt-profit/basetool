<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="de">
<body>
<a th:fragment="link(entry, linkClass, crumb, icon, filterOnly)" th:href="${entry.external()} ? ${entry.href()} : @{${entry.href()}}" th:data-nav-group="${crumb}" th:data-nav-icon="${icon}" th:data-nav-keywords="${entry.keywordsKey() != null} ? #{${entry.keywordsKey()}} : null" th:class="${linkClass}" th:data-testid="${filterOnly} ? null : ${entry.testId()}" th:data-nav-skip="${filterOnly or entry.notIndexed()} ? 'true' : null" th:target="${entry.external()} ? '_blank' : null" th:rel="${entry.external()} ? 'noopener noreferrer' : null" th:data-entry-key="${entry.key()}" th:data-nav-paths="${navigation != null} ? ${navigation.areaPaths(entry)} : ${null}"><th:block th:if="${entry.unreadBadge()}"><span class="nav-top-label" th:text="#{${entry.labelKey()}}">Notifications</span>
        <span class="nav-count-pill" data-notif-badge
              th:classappend="${unreadNotificationCount > 0} ? '' : 'notification-badge-hidden'"
              th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}">0</span></th:block><th:block th:if="${entry.labelWithIcon()}"><span th:text="#{${entry.labelKey()}}">Login</span>
        <svg class="krt-icon" aria-hidden="true" focusable="false"><use th:href="|#krt-icon-${entry.icon()}|"/></svg></th:block><th:block th:unless="${entry.unreadBadge() or entry.labelWithIcon()}" th:text="#{${entry.labelKey()}}">Label</th:block></a>
<div th:fragment="row(entry, hideable, first, last)" class="nav-row" th:data-entry-key="${entry.key()}"
     th:data-reorder-name="#{__${entry.labelKey()}__}">
    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, 'nav-link', null, null, false)}" />
    <div class="nav-edit-controls" data-nav-edit-controls th:if="${navigationFavourites.loaded()}">
        <th:block th:replace="~{kernel/fragments/nav-favourites :: star(${entry}, true)}" />
        <th:block th:if="${hideable}"><th:block th:replace="~{kernel/fragments/nav-favourites :: hide(${entry})}" /></th:block>
        <th:block th:if="${first != null}"><th:block th:replace="~{kernel/fragments/components :: reorderControls(#{__${entry.labelKey()}__}, ${first}, ${last})}" /></th:block>
    </div>
</div>
<section th:fragment="group(item, crumb, filterOnly, first, last)" class="nav-group"
         th:classappend="${filterOnly} ? 'nav-group-filter-only' : (${item.links().isEmpty()} ? 'nav-group-emptied' : '')"
         th:attr="data-collapsed=${item.group().collapsed()} ? 'true' : null"
         th:data-group-key="${item.group().key()}" th:data-nav-icon="${item.group().icon()}"
         th:data-reorder-name="#{${item.group().labelKey()}}"
         th:data-nav-group="${crumb}" th:hidden="${filterOnly}">
    <button type="button" class="nav-group-head" aria-expanded="true"
            th:aria-controls="|nav-group-${item.group().key()}|" th:tabindex="${filterOnly} ? '-1' : null">
        <svg class="krt-icon nav-group-icon" aria-hidden="true"><use th:href="|#krt-icon-${item.group().icon()}|"></use></svg>
        <span class="nav-group-label" th:text="#{${item.group().labelKey()}}">Group</span>
        <span class="nav-group-count"></span>
        <svg class="krt-icon nav-group-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"></use></svg>
    </button>
    <div class="nav-edit-controls nav-group-controls" data-nav-edit-controls
         th:if="${!filterOnly and navigationFavourites.loaded()}">
        <th:block th:replace="~{kernel/fragments/components :: reorderControls(#{${item.group().labelKey()}}, ${first}, ${last})}" />
    </div>
    <div class="nav-group-links" th:id="|nav-group-${item.group().key()}|">
        <th:block th:each="entry, position : ${item.links()}">
            <th:block th:if="${filterOnly}"><th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, 'nav-link', null, null, true)}" /></th:block>
            <th:block th:unless="${filterOnly}"><th:block th:replace="~{kernel/fragments/nav-entries :: row(${entry}, true, ${position.first}, ${position.last})}" /></th:block>
        </th:block>
        <p th:if="${item.links().isEmpty()}" class="nav-group-emptied-note" th:text="#{nav.hidden.groupEmpty}">Alle Einträge ausgeblendet – unter „Mehr“.</p>
    </div>
</section>
<th:block th:fragment="mainList">
    <th:block th:replace="~{kernel/fragments/nav-favourites :: block('member')}" />
    <th:block th:each="item, position : ${navigation.main()}" th:unless="${item.links().isEmpty() and item.hiddenLinks().isEmpty()}">
        <th:block th:replace="~{kernel/fragments/nav-entries :: group(${item}, #{${item.group().labelKey()}}, false, ${position.first}, ${position.last})}" />
    </th:block>
    <th:block th:replace="~{kernel/fragments/nav-favourites :: more('member')}" />
    <th:block th:replace="~{kernel/fragments/nav-entries :: resetOrder('member', ${navigationOrder.member().scopes().isEmpty()})}" />
    <th:block th:replace="~{kernel/fragments/nav-entries :: group(${navigation.personal()}, #{${navigation.personal().group().labelKey()}}, true, false, false)}" />
</th:block>
<div th:fragment="resetOrder(mode, isDefault)" class="nav-edit-controls nav-edit-reset" data-nav-edit-controls
     th:if="${navigationFavourites.loaded()}">
    <button type="button" class="btn btn-ghost nav-edit-reset-btn" data-trigger="nav-order-reset"
            data-testid="nav-order-reset" th:data-mode="${mode}" th:disabled="${isDefault}"
            th:text="#{nav.order.reset}">Standardreihenfolge</button>
</div>
<th:block th:fragment="adminList">
    <div class="nav-top" th:data-nav-group="#{nav.admin.crumb}">
        <th:block th:each="entry : ${navigation.adminTop().links()}">
            <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, 'nav-top-link', null, ${entry.icon()}, false)}" />
        </th:block>
    </div>
    <th:block th:replace="~{kernel/fragments/nav-favourites :: block('admin')}" />
    <th:block th:each="item, position : ${navigation.admin()}" th:unless="${item.links().isEmpty() and item.hiddenLinks().isEmpty()}">
        <th:block th:replace="~{kernel/fragments/nav-entries :: group(${item}, |#{nav.admin.crumb} · #{${item.group().labelKey()}}|, false, ${position.first}, ${position.last})}" />
    </th:block>
    <th:block th:replace="~{kernel/fragments/nav-favourites :: more('admin')}" />
    <th:block th:replace="~{kernel/fragments/nav-entries :: resetOrder('admin', ${navigationOrder.admin().scopes().isEmpty()})}" />
</th:block>
<th:block th:fragment="swap">
    <th:block th:replace="~{kernel/fragments/nav-favourites :: state}" />
    <div class="palette-source-pages"><th:block th:replace="~{kernel/fragments/palette :: sourcePages}" /></div>
    <div class="nav-mode nav-mode-main" data-nav-mode="main"><th:block th:replace="~{kernel/fragments/nav-entries :: mainList}" /></div>
    <div class="nav-mode nav-mode-admin" data-nav-mode="admin" th:unless="${navigation.admin().isEmpty()}"><th:block th:replace="~{kernel/fragments/nav-entries :: adminList}" /></div>
</th:block>
<th:block th:fragment="pageTabs(entryKey)" th:with="tabs=${navigation != null} ? ${navigation.pageTabs(entryKey, currentRequestUri)} : ${null}">
<nav th:unless="${tabs == null or #lists.isEmpty(tabs)}" class="tab-nav" th:aria-label="#{nav.tabs.aria}" data-testid="page-tabs">
    <a th:each="tab : ${tabs}" th:href="@{${tab.entry().href()}}" class="tab"
       th:classappend="${tab.current()} ? 'active'"
       th:attr="aria-current=${tab.current()} ? 'page' : null"
       th:data-entry-key="${tab.entry().key()}" th:data-testid="|page-tab-${tab.entry().key()}|"
       th:text="#{${tab.entry().tabLabel()}}">Tab</a>
</nav>
</th:block>
</body>
</html>
