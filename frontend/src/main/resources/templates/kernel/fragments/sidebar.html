<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<body>
<th:block th:fragment="sidebar">
    <div id="sidebar" class="sidebar" inert
         th:aria-label="#{nav.drawer.aria}" role="navigation">
        <div class="nav-grip" aria-hidden="true"></div>
        <div class="nav-head">
            <img th:src="@{/logos/basetool-logo.svg}" alt="" width="30" height="30">
            <span class="nav-head-title" th:text="${appTitle}">Profit Basetool</span>
            <button id="close-sidebar" class="close-sidebar-btn" type="button"
                    th:aria-label="#{nav.close}" th:title="#{nav.close}">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-close"></use></svg>
            </button>
        </div>
        <div class="nav-context" sec:authorize="isAuthenticated()">
            <form id="squadron-switcher-form"
                  th:if="${availableOrgUnits != null and availableOrgUnits.size() > 1}"
                  th:action="@{/me/active-org-unit}" method="post" class="squadron-switcher no-track">
                <input type="hidden" name="_referer" th:value="${currentRequestUri}" />
                <label for="squadron-switcher-select" class="squadron-switcher-label"
                       th:text="#{orgUnit.switcher.label}">Active OrgUnit</label>
                <select id="squadron-switcher-select" name="orgUnitId" class="squadron-switcher-select">
                    <option value=""
                            sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)"
                            th:selected="${activeSquadronId == null}"
                            th:text="#{orgUnit.switcher.all}">All org units</option>
                    <option value=""
                            sec:authorize="!hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)"
                            th:selected="${activeSquadronId == null}"
                            th:text="#{orgUnit.switcher.allMine}">All my org units</option>
                    <option th:each="ou : ${availableOrgUnits}"
                            th:value="${ou.orgUnitId()}"
                            th:selected="${activeSquadronId != null and activeSquadronId == ou.orgUnitId()}"
                            th:text="${ou.orgUnitShorthand() != null ? ou.orgUnitShorthand() + ' — ' + ou.orgUnitName() : ou.orgUnitName()}">ALP — ALPHA</option>
                </select>
                <noscript>
                    <button type="submit" class="squadron-switcher-submit">&#x2713;</button>
                </noscript>
            </form>
            <div class="nav-filter">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-filter"></use></svg>
                <input type="search" id="nav-filter" class="nav-filter-input" data-testid="nav-filter"
                       autocomplete="off" spellcheck="false"
                       th:placeholder="#{nav.filter.placeholder}" th:aria-label="#{nav.filter.aria}">
            </div>
        </div>
        <div class="nav-list" id="nav-list">
            <th:block sec:authorize="isAuthenticated()">
                <div class="nav-admin-bar" hidden
                     sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
                    <button type="button" class="nav-admin-back" data-testid="nav-admin-back">
                        <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-arrow-left"></use></svg>
                        <span th:text="#{nav.admin.back}">Hauptmenü</span>
                    </button>
                    <span class="admin-mode-chip" th:text="#{nav.adminMode.chip}">ADMIN</span>
                </div>
                <div class="nav-mode nav-mode-main" data-nav-mode="main">
                    <div class="nav-top" th:data-nav-group="#{${navigation.top().group().labelKey()}}">
                        <th:block th:each="entry : ${navigation.top().links()}">
                            <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, 'nav-top-link', null, ${entry.icon()}, false)}" />
                        </th:block>
                    </div>
                    <th:block th:each="item : ${navigation.main()}" th:unless="${item.links().isEmpty()}">
                        <th:block th:replace="~{kernel/fragments/nav-entries :: group(${item}, #{${item.group().labelKey()}}, false)}" />
                    </th:block>
                    <th:block th:replace="~{kernel/fragments/nav-entries :: group(${navigation.personal()}, #{${navigation.personal().group().labelKey()}}, true)}" />
                </div>
                <div class="nav-mode nav-mode-admin" data-nav-mode="admin" th:unless="${navigation.admin().isEmpty()}">
                    <th:block th:each="item : ${navigation.admin()}" th:unless="${item.links().isEmpty()}">
                        <th:block th:replace="~{kernel/fragments/nav-entries :: group(${item}, |#{nav.admin.crumb} · #{${item.group().labelKey()}}|, false)}" />
                    </th:block>
                </div>
                <p class="nav-filter-empty" hidden th:text="#{nav.filter.empty}">Kein Menüeintrag gefunden.</p>
                <button type="button" class="nav-filter-to-palette" data-testid="nav-filter-to-palette" hidden>
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-search"></use></svg>
                    <span class="nav-filter-to-palette-label" th:text="#{nav.filter.toPalette}">Im Schnellzugriff suchen</span>
                    <span class="nav-filter-to-palette-label-short" th:text="#{nav.filter.toPaletteShort}">Überall suchen</span>
                    <span class="nav-kbd" data-palette-kbd th:text="#{palette.kbd}">STRG K</span>
                </button>
            </th:block>
            <div class="nav-mode nav-mode-main" sec:authorize="isAnonymous()">
                <div class="nav-top">
                    <th:block th:each="entry : ${navigation.anonymous().links()}">
                        <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, ${entry.labelWithIcon()} ? 'nav-top-link nav-discord-login' : 'nav-top-link', null, null, false)}" />
                    </th:block>
                </div>
            </div>
            <div class="nav-legal" th:data-nav-group="#{${navigation.legal().group().labelKey()}}" th:data-nav-icon="${navigation.legal().group().icon()}">
                <th:block th:each="entry : ${navigation.legal().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, null, null, false)}" />
                </th:block>
                <span class="nav-legal-version" th:text="#{app.version.display(${appVersion})}">v0.0.1</span>
                <span class="nav-legal-fansite" th:text="#{fankit.fansite}">This is an unofficial Star Citizen fan site, not affiliated with the Cloud Imperium group of companies. All content on this site not authored by its host or users are property of their respective owners.</span>
                <th:block th:each="entry : ${navigation.fanKit().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, null, null, false)}" />
                </th:block>
            </div>
        </div>
        <div class="nav-foot">
            <button type="button" class="nav-admin-entry" data-testid="nav-admin-toggle"
                    sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
                <svg class="krt-icon nav-admin-entry-icon" aria-hidden="true"><use href="#krt-icon-gear"></use></svg>
                <span class="nav-admin-entry-label" th:text="#{nav.administration}">Administration</span>
                <svg class="krt-icon nav-admin-entry-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"></use></svg>
            </button>
            <div class="nav-personal" id="nav-personal" hidden sec:authorize="isAuthenticated()"
                 th:data-nav-group="#{${navigation.personal().group().labelKey()}}" th:data-nav-icon="${navigation.personal().group().icon()}">
                <span class="nav-personal-title" th:text="#{${navigation.personal().group().labelKey()}}">Persönlich</span>
                <th:block th:each="entry : ${navigation.personal().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, 'nav-link', null, null, false)}" />
                </th:block>
            </div>
            <div class="nav-user-row">
                <button type="button" class="nav-user-toggle" data-testid="nav-user-toggle"
                        aria-expanded="false" aria-controls="nav-personal"
                        sec:authorize="isAuthenticated()" th:title="#{nav.user.toggle}">
                    <span class="nav-user-avatar" aria-hidden="true">
                        <svg class="krt-icon"><use href="#krt-icon-user"></use></svg>
                    </span>
                    <span class="nav-user-text">
                        <span class="nav-user-name" sec:authentication="name">greluc</span>
                        <span class="nav-user-meta">
                            <th:block th:if="${activeOrgUnit != null}"><span th:text="${activeOrgUnit.orgUnitName()}">ALPHA</span> · </th:block><span sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" th:text="#{nav.user.role.admin}">Admin</span><span sec:authorize="!hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" th:if="${hasOfficerReach}" th:text="#{nav.user.role.officer}">Offizier</span><span sec:authorize="!hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" th:unless="${hasOfficerReach}" th:text="#{nav.user.role.member}">Mitglied</span>
                        </span>
                    </span>
                    <svg class="krt-icon nav-user-chevron" aria-hidden="true"><use href="#krt-icon-chevron-up"></use></svg>
                </button>
                <div class="nav-lang">
                    <button type="button" class="nav-lang-btn" aria-haspopup="true" aria-expanded="false"
                            aria-controls="nav-lang-menu" th:title="#{nav.language}" th:aria-label="#{nav.language}">
                        <img th:src="@{${#locale.language == 'de'} ? '/images/flags/de.svg' : '/images/flags/gb.svg'}"
                             width="18" height="12" class="nav-flag" alt="">
                        <span th:text="${#locale.language == 'de'} ? #{lang.de} : #{lang.en}">DE</span>
                    </button>
                    <div class="nav-lang-menu" id="nav-lang-menu" hidden>
                        <a th:href="@{''(lang='de')}" lang="de">
                            <img th:src="@{/images/flags/de.svg}" width="18" height="12" class="nav-flag" alt="">
                            <span th:text="#{lang.de}">DE</span>
                        </a>
                        <a th:href="@{''(lang='en')}" lang="en">
                            <img th:src="@{/images/flags/gb.svg}" width="18" height="12" class="nav-flag" alt="">
                            <span th:text="#{lang.en}">EN</span>
                        </a>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post" class="nav-logout-form" id="nav-logout-form"
                      sec:authorize="isAuthenticated()">
                    <button type="submit" class="nav-logout-btn" data-testid="nav-logout"
                            th:aria-label="#{nav.logout}" th:title="#{nav.logout}">
                        <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-logout"></use></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <th:block sec:authorize="isAuthenticated()">
        <th:block th:replace="~{kernel/fragments/mobile-nav :: tabbar}" />
        <th:block th:replace="~{kernel/fragments/palette :: palette}" />
    </th:block>
    <script type="module" th:src="@{/js/kernel/sidebar.js}" th:attr="nonce=${cspNonce}"></script>
    <script type="module" th:src="@{/js/kernel/krt-palette.js}" th:attr="nonce=${cspNonce}" sec:authorize="isAuthenticated()"></script>
    <th:block th:replace="~{kernel/fragments/toast :: toast}" />
    <th:block th:replace="~{kernel/fragments/unsaved-modal :: unsavedModal}" />
    <th:block th:replace="~{kernel/fragments/footer :: footer}" />
    <th:block th:replace="~{kernel/fragments/icons :: sprite}" />
    <script type="module" th:src="@{/js/kernel/unsaved-changes.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
