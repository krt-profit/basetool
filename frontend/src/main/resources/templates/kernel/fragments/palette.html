<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="de">
<body>
<th:block th:fragment="palette">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='nav-palette', titleKey='palette.aria',
        variant='palette-modal', body=~{kernel/fragments/palette :: palette-body})}">
    </th:block>
</th:block>
<th:block th:fragment="palette-body">
    <div class="palette"
         th:attr="data-recent=#{palette.recent},data-favourites=#{palette.favourites},data-frequent=#{palette.frequent},data-action-customise=#{palette.action.customise},data-action-shortcuts=#{palette.action.shortcuts},data-live-favourite-added=#{palette.live.favouriteAdded('{name}')},data-live-favourite-removed=#{palette.live.favouriteRemoved('{name}')},data-results=#{palette.results},data-help=#{palette.help},data-actions=#{palette.actions},data-action-crumb=#{palette.action.crumb},data-action-ou-switch=#{palette.action.ouSwitch},data-action-admin=#{palette.action.admin},data-action-logout=#{nav.logout},data-entries-url=@{/quick-access/entries},data-entity-search-url=@{/quick-access/search}">
        <div class="palette-input-row">
            <svg class="krt-icon palette-input-icon" aria-hidden="true"><use href="#krt-icon-search"></use></svg>
            <input type="text" id="palette-input" class="palette-input" data-testid="palette-input" autofocus
                   autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list"
                   aria-expanded="true" aria-controls="palette-results"
                   th:placeholder="#{palette.placeholder}" th:aria-label="#{palette.input.aria}">
            <button type="button" class="palette-cancel" th:text="#{mobile.search.cancel}">Abbrechen</button>
        </div>
        <div id="palette-results" class="palette-results" role="listbox" th:aria-label="#{palette.aria}"></div>
        <p class="visually-hidden" role="status" aria-live="polite" data-palette-live data-testid="palette-live"></p>
        <p class="palette-empty" hidden th:text="#{palette.empty}">Keine Treffer. Signal verloren.</p>
        <div class="palette-foot" aria-hidden="true">
            <span class="palette-hint"><span class="nav-kbd">&uarr; &darr;</span><span th:text="#{palette.hint.navigate}">Navigieren</span></span>
            <span class="palette-hint"><span class="nav-kbd">&crarr;</span><span th:text="#{palette.hint.open}">Öffnen</span></span>
            <span class="palette-hint"><span class="nav-kbd" th:text="#{palette.kbd.newTab}">Strg &crarr;</span><span th:text="#{palette.hint.newTab}">Neuer Tab</span></span>
            <span class="palette-hint"><span class="nav-kbd" th:text="#{palette.kbd.favourite}">Strg D</span><span th:text="#{palette.hint.favourite}">Favorit</span></span>
            <span class="palette-hint"><span class="nav-kbd">ESC</span><span th:text="#{palette.hint.close}">Schließen</span></span>
            <span class="palette-hint"><span class="nav-kbd">?</span><span th:text="#{palette.hint.prefixes}">Präfixe</span></span>
        </div>
        <div class="palette-source" hidden>
            <div class="palette-source-prefixes" data-testid="palette-source-prefixes">
                <span data-prefix-kind="action" th:text="#{palette.prefix.action}">Nur Aktionen</span>
                <span data-prefix-kind="page" th:text="#{palette.prefix.page}">Nur Seiten und Tabs</span>
                <span data-prefix-kind="job_order" th:text="#{palette.prefix.order}">Nur Aufträge nach Nummer</span>
                <span data-prefix-kind="member" th:text="#{palette.prefix.member}">Nur Mitglieder</span>
                <span data-prefix-kind="mission" th:text="#{palette.prefix.mission}">Nur Missionen</span>
                <span data-prefix-kind="operation" th:text="#{palette.prefix.operation}">Nur Operationen</span>
                <span data-prefix-kind="material" th:text="#{palette.prefix.material}">Nur Material</span>
                <span data-prefix-kind="blueprint" th:text="#{palette.prefix.blueprint}">Nur Blueprints</span>
                <span data-prefix-kind="ship" th:text="#{palette.prefix.ship}">Nur Schiffe</span>
                <span data-prefix-kind="org_unit" th:text="#{palette.prefix.unit}">Nur Org-Einheiten</span>
            </div>
            <div class="palette-source-pages" data-testid="palette-source-pages">
                <th:block th:replace="~{kernel/fragments/palette :: sourcePages}" />
            </div>
            <div class="palette-source-actions" data-testid="palette-source-actions">
                <th:block th:each="entry : ${navigation.actions().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, null, ${entry.icon()}, false)}" />
                </th:block>
            </div>
            <div class="palette-source-tail" data-testid="palette-source-tail">
                <th:block th:each="entry : ${navigation.paletteTail().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, null, ${entry.icon()}, false)}" />
                </th:block>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="sourcePages">
                <th:block th:each="entry : ${navigation.top().links()}">
                    <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, #{${navigation.top().group().labelKey()}}, ${entry.icon()}, false)}" />
                </th:block>
                <th:block th:each="item : ${navigation.main()}">
                    <th:block th:each="entry : ${item.palettePages()}">
                        <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, #{${item.group().labelKey()}}, ${item.group().icon()}, false)}" />
                    </th:block>
                </th:block>
                <th:block th:each="item : ${navigation.admin()}">
                    <th:block th:each="entry : ${item.palettePages()}">
                        <th:block th:replace="~{kernel/fragments/nav-entries :: link(${entry}, null, |#{nav.admin.crumb} · #{${item.group().labelKey()}}|, ${item.group().icon()}, false)}" />
                    </th:block>
                </th:block>
</th:block>
</body>
</html>
