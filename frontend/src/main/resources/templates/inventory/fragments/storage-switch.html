<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="storageSwitch" class="krt-segmented" th:aria-label="#{inventory.overview.switch.aria}">
    <a th:href="${view == 'items'} ? @{/inventory/all(view='items')} : @{/inventory/all}" class="krt-segmented__item"
       data-testid="inventory-global-link" th:text="#{inventory.overview.global}">Globales Lager</a>
    <a th:href="${view == 'items'} ? @{/inventory/my(view='items')} : @{/inventory/my}" class="krt-segmented__item"
       data-testid="inventory-my-link" th:text="#{inventory.overview.my}">Mein Lager</a>
</nav>
</body>
</html>
