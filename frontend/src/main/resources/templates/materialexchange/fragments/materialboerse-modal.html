<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<th:block th:fragment="releaseModal">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='mb-modal', titleKey='materialboerse.modal.release.title', variant='krt-modal--wide', titleId='mb-modal-title', closeTrigger='', closeClass='mb-modal-close', body=~{materialexchange/fragments/materialboerse-modal :: mb-modal-body})}">
        <th:block th:ref="mb-modal-body">
            <div class="krt-modal-body">
                <div class="mb-modal-picker" data-mb-picker hidden>
                    <th:block th:replace="~{kernel/fragments/components :: segmented(name='mb-release-kind', labelKey='materialboerse.modal.kind.label',
                        variant='krt-segmented--block', selected='MATERIAL',
                        options=${ {{value: 'MATERIAL', labelKey: 'materialboerse.modal.kind.material'}, {value: 'ITEM', labelKey: 'materialboerse.modal.kind.item'}} })}"></th:block>
                    <label class="form-label-sm" for="mb-release-row" th:text="#{materialboerse.modal.material.label}">Material oder Item</label>
                    <select id="mb-release-row" data-mb-row-select data-testid="mb-release-picker"></select>
                </div>
                <div class="mb-modal-picker" data-mb-item-picker hidden>
                    <label class="form-label-sm" for="mb-item" th:text="#{materialboerse.modal.item.label}">Item</label>
                    <select id="mb-item" data-mb-item-select data-testid="mb-item-picker"></select>
                </div>
                <div class="facts-bar mb-modal-facts" data-mb-facts>
                    <span><span class="fact-k" th:text="#{materialboerse.facts.material}">Material</span><span class="fact-v" data-mb-fact-material>—</span></span>
                    <span data-mb-fact-quality-wrap><span class="fact-k" th:text="#{materialboerse.facts.quality}">Qualität</span><span class="fact-v" data-mb-fact-quality>—</span></span>
                </div>
                <div class="mb-modal-amount" data-mb-amount-block>
                    <label class="form-label-sm" for="mb-amount" th:text="#{materialboerse.modal.offeredAmount.label}">Menge anbieten</label>
                    <div class="mb-modal-amount-row">
                        <input id="mb-amount" data-mb-amount type="text" data-number-input min="0" step="0.001"
                               inputmode="decimal" th:aria-label="#{materialboerse.modal.offeredAmount.label}"/>
                        <span class="mb-modal-amount-unit" data-mb-amount-unit th:text="#{material.quantity.scu}">SCU</span>
                        <button type="button" class="btn btn-ghost btn-xs" data-mb-amount-max
                                th:text="#{materialboerse.modal.offeredAmount.all}">Alles</button>
                    </div>
                    <span class="mb-modal-amount-hint" data-mb-amount-hint></span>
                </div>
                <div class="mb-modal-qty" data-mb-qty-block hidden>
                    <label class="form-label-sm" for="mb-item-qty" th:text="#{materialboerse.modal.quantity.label}">Menge (Stück)</label>
                    <input id="mb-item-qty" type="text" data-number-input min="1" step="1" inputmode="numeric" data-mb-item-qty
                           th:placeholder="#{materialboerse.modal.quantity.placeholder}"/>
                    <span class="mb-modal-qty-error" data-mb-qty-error hidden th:text="#{materialboerse.modal.quantity.invalid}">Bitte eine Menge angeben.</span>
                </div>
                <label class="form-label-sm mb-modal-remark-label" for="mb-remark">
                    <span th:text="#{materialboerse.modal.remark.label}">Bemerkung</span>
                    <span class="mb-modal-remark-hint" th:text="#{materialboerse.modal.remark.hint}">— was suchst du im Gegenzug? (Markdown, max. 20.000 Zeichen)</span>
                </label>
                <textarea id="mb-remark" data-mb-remark rows="8" maxlength="20000"
                          th:placeholder="#{materialboerse.modal.remark.placeholder}"></textarea>
                <div class="mb-modal-footnote">
                    <span class="mb-modal-privacy">
                        <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-info"/></svg>
                        <span th:text="#{materialboerse.modal.privacy.note}">Standort/Übergabeort bleiben privat.</span>
                    </span>
                    <span data-mb-charcount>0 / 20.000</span>
                </div>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-mb-modal-close th:text="#{materialboerse.modal.cancel}">Abbrechen</button>
                <button type="button" class="btn btn--cta" data-mb-modal-submit>
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-check"/></svg>
                    <span data-mb-submit-label th:text="#{materialboerse.modal.submit.release}">Freigeben</span>
                </button>
            </div>
        </th:block>
    </th:block>
    <script th:inline="javascript" th:attr="nonce=${cspNonce}">
        window.materialboerseModalI18n = {
            releaseTitle: /*[[#{materialboerse.modal.release.title}]]*/ 'Material für die Börse freigeben',
            editTitle: /*[[#{materialboerse.modal.edit.title}]]*/ 'Angebot bearbeiten',
            itemTitle: /*[[#{materialboerse.modal.itemOffer.title}]]*/ 'Item für die Börse freigeben',
            submitRelease: /*[[#{materialboerse.modal.submit.release}]]*/ 'Freigeben',
            submitSave: /*[[#{materialboerse.modal.submit.save}]]*/ 'Speichern',
            itemReleased: /*[[#{materialboerse.toast.itemReleased}]]*/ 'Item auf die Börse gestellt.',
            itemPickerPlaceholder: /*[[#{materialboerse.modal.item.placeholder}]]*/ 'Item suchen …',
            itemPickerEmpty: /*[[#{materialboerse.modal.item.empty}]]*/ 'Keine passenden Items gefunden.',
            quantityInvalid: /*[[#{materialboerse.modal.quantity.invalid}]]*/ 'Bitte eine Menge angeben.',
            amountMax: /*[[#{materialboerse.modal.offeredAmount.max}]]*/ 'max. {0} verfügbar',
            amountInvalid: /*[[#{materialboerse.modal.offeredAmount.invalid}]]*/ 'Bitte eine Menge größer als 0 angeben.',
            amountExceeds: /*[[#{materialboerse.modal.offeredAmount.exceeds}]]*/ 'Die Menge darf den Lagerbestand nicht überschreiten.',
            released: /*[[#{materialboerse.toast.released}]]*/ 'Auf die Börse gestellt.',
            remarkSaved: /*[[#{materialboerse.toast.remarkSaved}]]*/ 'Bemerkung gespeichert.',
            error: /*[[#{notification.error.save}]]*/ 'Fehler.',
            charCounter: /*[[#{materialboerse.modal.remark.counter}]]*/ '{0} / 20.000',
            pickerPlaceholder: /*[[#{materialboerse.modal.material.placeholder}]]*/ 'Lager-Posten suchen …',
            pickerEmpty: /*[[#{materialboerse.modal.material.empty}]]*/ 'Keine freigebbaren Lager-Posten gefunden.',
            pickerAlready: /*[[#{materialboerse.modal.material.already}]]*/ 'bereits auf der Börse',
            pickerStolen: /*[[#{inventory.stolen.chip}]]*/ 'Gestohlen',
            unitScu: /*[[#{material.quantity.scu}]]*/ 'SCU',
            unitPiece: /*[[#{material.quantity.piece}]]*/ 'Stück',
            conflict: {
                title: /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
                reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Neu laden.',
                reloadLabel: /*[[#{frontend.ajax.conflict.reload}]]*/ 'Neu laden',
                dismissLabel: /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
                reloadQuestion: /*[[#{frontend.ajax.conflict.question}]]*/ 'Neu laden?'
            }
        };
    </script>
    <script type="module" th:src="@{/js/materialexchange/materialboerse-release.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
