<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<a th:fragment="materialCard(mat)" th:href="@{/materials/{id}(id=${mat.id})}" class="card material-card">
    <h3 class="material-title">
        <span th:if="${mat.isIllegal == true}" class="text-danger material-flag" th:title="#{material.is_illegal}">&#9888;</span><span th:if="${mat.isVolatileQt == true}" class="text-warning material-flag" th:title="#{material.is_volatile_qt}">&#9888;</span><span th:if="${mat.isVolatileTime == true}" class="text-warning material-flag" th:title="#{material.is_volatile_time}">&#9888;</span><span th:text="${mat.name}">Material Name</span>
    </h3>

    <div class="price-info">
        <div>
            <div class="price-label" th:text="#{materials.minPriceBuy}">Min. Einkaufspreis</div>
            <div class="price-value" th:text="${mat.minPriceBuy != null ? #numbers.formatInteger(mat.minPriceBuy, 1, 'POINT') + ' aUEC' : '-'}">-</div>
        </div>
        <div class="price-info__end">
            <div class="price-label" th:text="#{materials.maxPriceSell}">Max. Verkaufspreis</div>
            <div class="price-value" th:text="${mat.maxPriceSell != null ? #numbers.formatInteger(mat.maxPriceSell, 1, 'POINT') + ' aUEC' : '-'}">-</div>
        </div>
    </div>
</a>
</body>
</html>
