<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="scuHint(hintId, startHidden)"
      class="scu-hint"
      th:id="${hintId}"
      th:classappend="${startHidden} ? 'krtm-hidden' : ''"
      tabindex="0"
      role="img"
      th:aria-label="#{material.scu.hint}">
    <span aria-hidden="true">?</span>
    <span class="scu-hint__bubble" aria-hidden="true"
          th:text="#{material.scu.hint}">Eingabe in SCU. cSCU ist 0,01 SCU. &#181;SCU ist 0,001 SCU.</span>
</span>

<span th:fragment="fieldHint(messageKey)"
      class="scu-hint field-hint-marker"
      tabindex="0"
      role="img"
      th:aria-label="#{__${messageKey}__}">
    <span aria-hidden="true">?</span>
    <span class="scu-hint__bubble" aria-hidden="true"
          th:text="#{__${messageKey}__}">Hinweis</span>
</span>
</body>
</html>
