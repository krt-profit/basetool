<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="stolenMarkModal(prefix)">
<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='stolenMarkModal', titleKey='inventory.stolen.mark.title', titleId='stolenMarkTitle', variant='krt-modal--wide', closeTrigger=${prefix + '-close-stolen'}, body=~{fragments/inventory-stolen-mark :: stolenMarkBody(${prefix})})}"></th:block>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    var stolenMarkI18n = {
        markTitle: /*[[#{inventory.stolen.mark.title}]]*/ 'Als gestohlen markieren',
        unmarkTitle: /*[[#{inventory.stolen.unmark.title}]]*/ 'Gestohlen-Markierung entfernen',
        markMessage: /*[[#{inventory.stolen.mark.message}]]*/ 'Welche Menge dieses Eintrags ist gestohlen?',
        unmarkMessage: /*[[#{inventory.stolen.unmark.message}]]*/ 'Von welcher Menge soll die Markierung entfernt werden?',
        confirmMark: /*[[#{inventory.stolen.confirm.mark}]]*/ 'Markieren',
        confirmUnmark: /*[[#{inventory.stolen.confirm.unmark}]]*/ 'Markierung entfernen',
        successMark: /*[[#{inventory.stolen.success.mark}]]*/ 'Als gestohlen markiert.',
        successUnmark: /*[[#{inventory.stolen.success.unmark}]]*/ 'Gestohlen-Markierung entfernt.',
        error: /*[[#{inventory.stolen.error}]]*/ 'Die Markierung konnte nicht geändert werden.',
        errorAmount: /*[[#{inventory.stolen.error.amount}]]*/ 'Bitte eine gültige Menge angeben.',
        errorEmpty: /*[[#{inventory.orgUnitChange.error.empty}]]*/ 'Bitte mindestens einen Eintrag auswählen.',
        successBulk: /*[[#{inventory.stolen.bulk.success}]]*/ 'Markierung bei {0} Einträgen geändert, {1} übersprungen.',
        noneChanged: /*[[#{inventory.stolen.bulk.none}]]*/ 'Keine Änderung.'
    };
</script>
</th:block>

<th:block th:fragment="stolenMarkBody(prefix)">
    <form id="stolenMarkForm">
    <div class="krt-modal-body">
        <p id="stolenMarkMessage" class="lager-modal-message"></p>
        <div class="form-group mb-1">
            <label for="stolenMarkAmount" class="form-label">
                <span th:text="#{inventory.stolen.amount}">Menge</span>
                <th:block th:replace="~{fragments/scu-hint :: scuHint('stolen-mark-scu-hint', true)}"></th:block>
            </label>
            <div class="flex-gap-sm">
                <input type="text" inputmode="decimal" data-scu-decimal id="stolenMarkAmount" step="0.001" min="0" required class="w-full" data-testid="stolen-mark-amount">
                <span id="stolenMarkAmountOfText" class="lager-amount-of" th:data-template="#{inventory.bookout.amount.of('{0}')}"></span>
                <button type="button" class="btn btn-ghost btn-xs" th:data-trigger="${prefix + '-stolen-all'}" data-testid="stolen-mark-all" th:text="#{inventory.stolen.all}">Alles</button>
            </div>
        </div>
    </div>
    <div class="krt-modal-foot">
        <button type="button" class="btn btn-ghost" th:data-trigger="${prefix + '-close-stolen'}" th:text="#{inventory.stolen.cancel}">Abbrechen</button>
        <button type="submit" id="stolenMarkSubmitBtn" class="btn btn--cta" data-testid="stolen-mark-submit" th:text="#{inventory.stolen.confirm.mark}">Markieren</button>
    </div>
    </form>
</th:block>

</body>
</html>
