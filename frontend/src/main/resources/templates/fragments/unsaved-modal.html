<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="unsavedModal">
    <dialog id="unsaved-changes-modal" class="krt-modal-overlay krtm-display-none-z-index-9999-e8d9">
        <div class="krt-modal" role="dialog" aria-modal="true" th:aria-label="#{unsaved.modal.title}">
            <div class="krt-modal-head">
                <h2 th:text="#{unsaved.modal.title}">Ungespeicherte Änderungen</h2>
                <button type="button" class="krt-modal-close" id="unsaved-close-btn" th:aria-label="#{general.a11y.closeModal}">&#10005;</button>
            </div>
            <div class="krt-modal-body">
                <p th:text="#{unsaved.modal.message}" class="m-0">Du hast ungespeicherte Änderungen. Möchtest du die Seite wirklich verlassen und die Änderungen verwerfen?</p>
            </div>
            <div class="krt-modal-foot">
                <button type="button" id="unsaved-leave-btn" class="btn btn-secondary" th:text="#{unsaved.modal.btn.leave}">Ohne Speichern verlassen</button>
                <button type="button" id="unsaved-stay-btn" class="btn" th:text="#{unsaved.modal.btn.stay}">Zurück</button>
            </div>
        </div>
    </dialog>
</th:block>
</body>
</html>
