<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The one dialog shell (REQ-UI-013, ADR-0177). Every `.krt-modal-overlay` in the app is rendered
  here; SingleModalShapeTest fails the build on a hand-written one. A page supplies only what is
  its own — the body and the footer. The shell is the same everywhere: a native <dialog>
  (FE-SIMP-04b) holding the `.krt-modal` frame (orange top edge + corner brackets, from styles.css),
  whose head carries an <h2> title and the ✕ close control, as the design system's modal specimen
  draws it. Until 2026-09-23, 90 of the 96 dialogs wrote this shell by hand and it had drifted:
  <h2> in 76 and <h3> in 20, an ✕ in 74 and an icon button in 22, the accessible name on the
  overlay in some and on the frame in others, and five close controls that closed nothing.

  The fragment declares no signature: a call names only the parameters it needs.

    modalId      required. The <dialog> id; also the close control's data-modal-id.
    titleKey     required. i18n key of the <h2> title.
    body         required. A fragment expression for everything below the head. By convention it
                 is a `<th:block th:ref="<modalId>-body">` directly inside the call, holding the
                 `.krt-modal-body` and the `.krt-modal-foot`, or a <form> wrapping both so the submit
                 button sits inside the form it submits.
    variant      extra class(es) on `.krt-modal`: 'krt-modal--wide', 'krt-modal--xwide',
                 'krt-modal--danger', or a page's own frame class.
    titleId      id of the <h2>, for a script that retitles the dialog (add / edit). With it the
                 dialog is labelled BY the heading (aria-labelledby), so its accessible name follows
                 the retitle; without it the dialog carries the title as its aria-label.
    open         true renders the dialog open, e.g. to re-show a form after a server-side
                 validation error. krt-modal.js makes it modal on load.
    closeTrigger the close control's data-trigger. The default is 'close-modal-display', which
                 closes the dialog through window.krtModal. A page whose close does more (reset a
                 form, guard unsaved changes) names its own handler here, and that handler ends in
                 window.krtModal.close. Pass '' when a page script binds the close by closeClass.
    closeClass   extra class(es) on the close control, for a page script that binds to a class.
    closeId      id of the close control.

  A server-side condition (th:if, sec:authorize) or an iteration (th:each) goes on a <th:block>
  around the call, not on the call itself.
*/-->
<dialog th:fragment="modal"
        class="krt-modal-overlay" th:id="${modalId}"
        th:classappend="${open == true} ? 'krtm-modal-open'"
        th:aria-labelledby="${titleId}"
        th:aria-label="${titleId == null} ? #{__${titleKey}__}">
  <div class="krt-modal" th:classappend="${variant}">
    <div class="krt-modal-head">
      <h2 th:id="${titleId}" th:text="#{__${titleKey}__}">Titel</h2>
      <button type="button" class="krt-modal-close" th:classappend="${closeClass}"
              th:id="${closeId}"
              th:data-trigger="${closeTrigger == null} ? 'close-modal-display' : (${closeTrigger == ''} ? null : ${closeTrigger})"
              th:data-modal-id="${modalId}"
              th:aria-label="#{general.a11y.closeModal}">&#10005;</button>
    </div>
    <th:block th:replace="${body}"></th:block>
  </div>
</dialog>
</body>
</html>
