<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="amount(value, quantityType)" th:switch="${quantityType}">
    <span th:case="'PIECE'" th:text="|${value != null ? #numbers.formatInteger(value, 1) : '0'} #{material.quantity.piece}|">0 Stück</span>
    <span th:case="*" th:text="|${value != null ? #numbers.formatDecimal(value, 1, 'NONE', 3, 'DEFAULT') : '0.000'} #{material.quantity.scu}|">0.000 SCU</span>
</th:block>
</body>
</html>
