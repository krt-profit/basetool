<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<button th:fragment="button(label, variant, type, extraClass)"
        th:attr="type=${type != null ? type : 'button'}"
        class="btn"
        th:classappend="${(variant != null and variant != '' ? 'btn-' + variant : '') + (extraClass != null and extraClass != '' ? ' ' + extraClass : '')}"
        th:text="${label}">Button</button>

<div th:fragment="alert(type, msgKey, extraClass)"
     th:if="${msgKey != null}"
     class="alert"
     th:classappend="${'alert-' + type + (extraClass != null and extraClass != '' ? ' ' + extraClass : '')}"
     th:text="#{${msgKey}}">Alert message</div>

<th:block th:fragment="emptyStateBody(titleKey, textKey, filterHintKey)">
  <span class="empty-title" th:text="#{${titleKey}}">Noch keine Eintr&auml;ge</span>
  <span class="empty-text" th:text="#{${textKey}}">Noch keine Eintr&auml;ge vorhanden.</span>
  <span class="empty-text"
        th:if="${filterHintKey != null and filterQuery != null and !filterQuery.isBlank()}"
        th:text="#{${filterHintKey}}">Filter aktiv.</span>
</th:block>

<div th:fragment="bankAccSearch(inputId, filterScope, filterEmpty)" class="bank-acc-search">
  <label th:for="${inputId}" class="visually-hidden" th:text="#{bank.filter.label}"
    >Konten nach Namen filtern</label
  >
  <svg class="krt-icon bank-acc-search-icon" aria-hidden="true"><use href="#krt-icon-search" /></svg>
  <input
    type="search"
    th:id="${inputId}"
    class="bank-acc-search-input"
    autocomplete="off"
    data-bank-acc-filter
    th:attr="data-filter-scope=${filterScope},data-filter-empty=${filterEmpty},placeholder=#{bank.filter.placeholder},aria-label=#{bank.filter.label}" />
</div>

<div th:fragment="dataTable(head, body)" class="table-responsive">
    <table class="krt-table">
        <thead><tr th:insert="${head}"></tr></thead>
        <tbody th:insert="${body}"></tbody>
    </table>
</div>

<button th:fragment="filterToggle(panelId, testid)"
        type="button" class="btn btn-ghost filter-toggle"
        th:attr="aria-controls=${panelId},data-testid=${testid}"
        aria-expanded="true">
    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-filter"/></svg>
    <span th:text="#{filter.toggle}">Filter</span>
    <span class="chip chip--primary filter-count" data-filter-count hidden
          th:data-label="#{filter.activeCount}">
        <span data-filter-count-value aria-hidden="true">0</span>
        <span data-filter-count-label class="visually-hidden"></span>
    </span>
    <svg class="krt-icon filter-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg>
</button>

</body>
</html>
