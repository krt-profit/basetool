<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="counterpartyBlock(movementType, prefix, labelKey, hintKey)"
     data-counterparty-section th:attr="data-movement-types=${movementType}"
     th:hidden="${movementType != 'DEPOSIT'}">

    <div class="bank-form-row" data-cp-registered-row>
        <label th:for="${prefix} + '-user'">
            <span th:text="#{__${labelKey}__}">Einzahler</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint(${hintKey})}"></th:block>
        </label>
        <select th:id="${prefix} + '-user'" name="counterpartyUserId"
                data-counterparty-user data-krt-combobox="remote-bank-users"
                th:attr="data-orgunit-target=${prefix} + '-ou',data-testid=${prefix} + '-user'">
            <option value="" th:text="#{bank.field.counterparty.placeholder}">Person w&auml;hlen &hellip;</option>
        </select>
        <span class="bank-field-error" data-error-for="counterpartyUserId"></span>
    </div>

    <div class="bank-form-row" data-cp-external-row hidden>
        <label th:for="${prefix} + '-name'">
            <span th:text="#{bank.field.counterparty.externalName}">Name (extern)</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.counterparty.externalName.hint')}"></th:block>
        </label>
        <input type="text" th:id="${prefix} + '-name'" name="counterpartyExternalName" maxlength="100" disabled
               data-counterparty-name th:attr="data-testid=${prefix} + '-name'"
               th:placeholder="#{bank.field.counterparty.externalName.placeholder}">
        <span class="bank-field-error" data-error-for="counterpartyExternalName"></span>
    </div>

    <div class="bank-form-row">
        <label class="bank-check-label">
            <input type="checkbox" disabled data-role="bank-cp-external-toggle"
                   th:attr="data-testid=${prefix} + '-external'">
            <span th:text="#{bank.field.counterparty.external}">Kein Tool-Account</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.counterparty.external.hint')}"></th:block>
        </label>
    </div>

    <div class="bank-form-row">
        <label th:for="${prefix} + '-ou'">
            <span th:text="#{bank.field.counterparty.orgUnit}">Einheit</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.counterparty.orgUnit.hint')}"></th:block>
        </label>
        <select th:id="${prefix} + '-ou'" name="counterpartyOrgUnitId" data-counterparty-orgunit disabled
                th:attr="data-testid=${prefix} + '-ou'">
            <option value="" th:text="#{bank.field.counterparty.orgUnit.placeholder}">Einheit w&auml;hlen &hellip;</option>
        </select>
        <span class="bank-field-error" data-error-for="counterpartyOrgUnitId"></span>
    </div>
</div>

<div th:fragment="requestCounterpartyBlock(requesterId, requesterHandle)"
     data-request-withdrawal-only hidden>
    <div class="bank-form-row">
        <label for="org-unit-request-cp-user">
            <span th:text="#{bank.field.counterparty.recipient}">Empf&auml;nger</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.request.counterparty.recipient.hint')}"></th:block>
        </label>
        <select id="org-unit-request-cp-user" name="counterpartyUserId" disabled
                data-counterparty-user data-krt-combobox="remote-bank-users"
                data-orgunit-target="org-unit-request-cp-ou"
                data-testid="org-unit-request-cp-user">
            <option value="" th:text="#{bank.field.counterparty.placeholder}">Person w&auml;hlen &hellip;</option>
            <option th:if="${requesterId != null and requesterHandle != null}"
                    th:value="${requesterId}" th:selected="true"
                    th:text="${requesterHandle}">greluc</option>
        </select>
        <span class="bank-field-error" data-error-for="counterpartyUserId"></span>
    </div>
    <div class="bank-form-row">
        <label for="org-unit-request-cp-ou">
            <span th:text="#{bank.field.counterparty.orgUnit}">Einheit</span>
            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.counterparty.orgUnit.hint')}"></th:block>
        </label>
        <select id="org-unit-request-cp-ou" name="counterpartyOrgUnitId" data-counterparty-orgunit disabled
                data-testid="org-unit-request-cp-ou">
            <option value="" th:text="#{bank.field.counterparty.orgUnit.placeholder}">Einheit w&auml;hlen &hellip;</option>
        </select>
        <span class="bank-field-error" data-error-for="counterpartyOrgUnitId"></span>
    </div>
</div>
</body>
</html>
