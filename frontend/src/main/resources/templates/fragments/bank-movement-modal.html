<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="movementModal(modalId, refreshTarget, accountId, accountSelectable, justificationRequired, canDeposit, canWithdraw, canTransfer)">
<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId=${modalId}, titleKey='bank.modal.movement.title', body=~{fragments/bank-movement-modal :: bank-movement-modal-body})}">
    <th:block th:ref="bank-movement-modal-body">
        <form class="bank-ajax-form no-track" data-method="POST"
              data-livesync="bank:@account/account,bookings,chart bank:@destination/account,bookings,chart bank/grid orgunit-bank/orgUnitBank"
              th:with="initEndpoint=${canDeposit} ? '/api/proxy/bank/deposits' : (${canWithdraw} ? '/api/proxy/bank/withdrawals' : '/api/proxy/bank/transfers'),initAccountField=${canDeposit or canWithdraw} ? 'accountId' : 'sourceAccountId'"
              th:attr="data-refresh=${refreshTarget},data-account-id=${accountId},data-justification-required=${justificationRequired},data-endpoint=${initEndpoint},data-account-id-field=${initAccountField}">
            <div class="krt-modal-body">

                <div class="bank-form-row">
                    <label for="bank-mv-type" th:text="#{bank.request.field.type}">Vorgang</label>
                    <select id="bank-mv-type" data-role="bank-movement-type"
                            data-testid="bank-movement-type">
                        <option th:if="${canDeposit}" value="DEPOSIT" th:text="#{bank.request.type.DEPOSIT}">Einzahlung</option>
                        <option th:if="${canWithdraw}" value="WITHDRAWAL" th:text="#{bank.request.type.WITHDRAWAL}">Auszahlung</option>
                        <option th:if="${canTransfer}" value="TRANSFER" th:text="#{bank.request.type.TRANSFER}">Transfer</option>
                    </select>
                </div>

                <div class="bank-form-row" th:if="${accountSelectable}">
                    <label for="bank-mv-source-account">
                        <span data-role="bank-movement-account-label"
                              th:attr="data-label-deposit=#{bank.field.targetAccount},data-label-withdrawal=#{bank.movement.field.sourceAccount},data-label-transfer=#{bank.movement.field.sourceAccount}"
                              th:text="#{bank.movement.field.sourceAccount}">Quellkonto</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.movement.field.sourceAccount.hint')}"></th:block>
                    </label>
                    <select id="bank-mv-source-account" data-role="bank-movement-source" required
                            data-krt-combobox="remote-bank-accounts"
                            th:attr="data-combobox-placeholder=#{bank.account.search.placeholder},data-combobox-no-results=#{bank.account.search.noResults}"
                            data-testid="bank-movement-source-account">
                        <option value="" th:text="#{bank.movement.field.sourceAccount.placeholder}">Konto w&auml;hlen &hellip;</option>
                    </select>
                    <span class="bank-field-error" data-error-for="accountId"></span>
                    <span class="bank-field-error" data-error-for="sourceAccountId"></span>
                </div>

                <div class="bank-form-row" data-movement-types="TRANSFER" hidden>
                    <label for="bank-mv-target" th:text="#{bank.field.targetAccount}">Zielkonto</label>
                    <select id="bank-mv-target" name="destinationAccountId" disabled
                            data-krt-combobox="remote-bank-accounts"
                            th:attr="data-combobox-placeholder=#{bank.field.targetAccount.placeholder},data-combobox-no-results=#{bank.account.search.noResults}"
                            data-testid="bank-movement-target">
                        <option value="" th:text="#{bank.field.targetAccount.placeholder}">Konto w&auml;hlen &hellip;</option>
                    </select>
                    <span class="bank-field-error" data-error-for="destinationAccountId"></span>
                </div>

                <div class="bank-form-row">
                    <label for="bank-mv-amount">
                        <span th:text="#{bank.field.amount}">Betrag (aUEC)</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.amount.hint')}"></th:block>
                    </label>
                    <input type="number" id="bank-mv-amount" name="amount" min="1" step="1" required
                           data-testid="bank-movement-amount" th:placeholder="#{bank.field.amount.placeholder}">
                    <span class="bank-field-error" data-error-for="amount"></span>
                    <p class="bank-field-hint bank-fee-preview" data-fee-preview hidden
                       data-testid="bank-movement-fee-preview">
                        <span th:text="#{bank.fee.label}">Geb&uuml;hr</span>:
                        <span data-fee-value>0</span> aUEC &middot;
                        <span th:text="#{bank.fee.debited.label}">wird abgebucht</span>:
                        <span data-fee-debit>0</span> aUEC &middot;
                        <span th:text="#{bank.fee.net.label}">kommt an</span>:
                        <span data-fee-arrives>0</span> aUEC
                    </p>
                </div>

                <div class="bank-form-row" data-fee-inclusive-row hidden>
                    <label class="bank-check-label">
                        <input type="checkbox" name="feeInclusive" value="true" disabled
                               data-testid="bank-movement-fee-inclusive">
                        <span th:text="#{bank.field.feeInclusive}">Geb&uuml;hr im Betrag enthalten</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.feeInclusive.hint')}"></th:block>
                    </label>
                </div>

                <div data-movement-types="DEPOSIT" data-split-deposit-only hidden>
                    <div class="bank-form-row">
                        <label class="bank-check-label">
                            <input type="checkbox" name="splitEnabled" value="true" disabled
                                   data-role="bank-split-toggle" data-testid="bank-movement-split-toggle">
                            <span th:text="#{bank.split.toggle}">Anteil auf alle Staffelkonten verteilen</span>
                        </label>
                    </div>
                    <div class="bank-form-row" data-split-row hidden>
                        <label for="bank-mv-split-percent">
                            <span th:text="#{bank.split.percent}">Prozentsatz (%)</span>
                            <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.split.hint')}"></th:block>
                        </label>
                        <input type="number" id="bank-mv-split-percent" name="splitPercent"
                               min="1" max="100" step="1" disabled
                               data-testid="bank-movement-split-percent" th:placeholder="#{bank.split.percent.placeholder}">
                        <p class="bank-field-hint bank-split-preview" data-split-preview hidden
                           data-testid="bank-movement-split-preview">
                            <span th:text="#{bank.split.preview.label}">Aufteilung:</span>
                            <span data-split-slice>0</span>
                            <span th:text="#{bank.split.preview.toSquadrons}">aUEC auf die Staffelkonten,</span>
                            <span data-split-remainder>0</span>
                            <span th:text="#{bank.split.preview.remainder}">aUEC verbleiben auf dem Zielkonto.</span>
                        </p>
                        <span class="bank-field-error" data-error-for="splitPercent"></span>
                    </div>
                </div>

                <div class="bank-form-row" data-movement-types="DEPOSIT">
                    <label for="bank-mv-deposit-holder" th:text="#{bank.field.holder}">Halter</label>
                    <select id="bank-mv-deposit-holder" name="holderId" required data-krt-combobox
                            data-testid="bank-movement-deposit-holder">
                        <option value="" th:text="#{bank.field.holder.placeholder}">Halter w&auml;hlen &hellip;</option>
                        <option th:each="h : ${activeHolders}" th:value="${h.id()}" th:text="${@handles.display(h.handle())}">greluc</option>
                    </select>
                    <span class="bank-field-error" data-error-for="holderId"></span>
                </div>
                <div class="bank-form-row" data-movement-types="WITHDRAWAL" hidden>
                    <label for="bank-mv-withdraw-holder">
                        <span th:text="#{bank.field.holder.payer}">Von Halter</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.holder.payer.hint')}"></th:block>
                    </label>
                    <select id="bank-mv-withdraw-holder" name="holderId" required disabled data-krt-combobox
                            data-testid="bank-movement-withdraw-holder">
                        <option value="" th:text="#{bank.field.holder.placeholder}">Halter w&auml;hlen &hellip;</option>
                        <option th:each="h : ${holders}" th:value="${h.id()}"
                                th:text="${@handles.display(h.handle())} + (${!h.active()} ? ' (' + #{bank.holder.inactive} + ')' : '')">greluc</option>
                    </select>
                    <span class="bank-field-error" data-error-for="holderId"></span>
                </div>
                <div class="bank-form-row" data-movement-types="TRANSFER" hidden>
                    <label for="bank-mv-source-holder">
                        <span th:text="#{bank.field.holder.source}">Von Halter</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.holder.payer.hint')}"></th:block>
                    </label>
                    <select id="bank-mv-source-holder" name="sourceHolderId" required disabled data-krt-combobox
                            data-testid="bank-movement-source-holder">
                        <option value="" th:text="#{bank.field.holder.placeholder}">Halter w&auml;hlen &hellip;</option>
                        <option th:each="h : ${holders}" th:value="${h.id()}"
                                th:text="${@handles.display(h.handle())} + (${!h.active()} ? ' (' + #{bank.holder.inactive} + ')' : '')">greluc</option>
                    </select>
                    <span class="bank-field-error" data-error-for="sourceHolderId"></span>
                </div>
                <div class="bank-form-row" data-movement-types="TRANSFER" hidden>
                    <label for="bank-mv-dest-holder">
                        <span th:text="#{bank.field.holder.target}">An Halter (Zielkonto)</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.holder.target.hint')}"></th:block>
                    </label>
                    <select id="bank-mv-dest-holder" name="destinationHolderId" required disabled data-krt-combobox
                            data-testid="bank-movement-dest-holder">
                        <option value="" th:text="#{bank.field.holder.placeholder}">Halter w&auml;hlen &hellip;</option>
                        <option th:each="h : ${activeHolders}" th:value="${h.id()}" th:text="${@handles.display(h.handle())}">greluc</option>
                    </select>
                    <span class="bank-field-error" data-error-for="destinationHolderId"></span>
                </div>

                <th:block th:replace="~{fragments/bank-counterparty :: counterpartyBlock('DEPOSIT', 'bank-mv-cp-deposit', 'bank.field.counterparty.depositor', 'bank.field.counterparty.depositor.hint')}"></th:block>
                <th:block th:replace="~{fragments/bank-counterparty :: counterpartyBlock('WITHDRAWAL', 'bank-mv-cp-withdraw', 'bank.field.counterparty.recipient', 'bank.field.counterparty.recipient.hint')}"></th:block>

                <select data-bank-all-orgunits hidden aria-hidden="true" tabindex="-1"
                        th:if="${allOrgUnits != null}">
                    <option th:each="o : ${allOrgUnits}" th:value="${o.orgUnitId()}"
                            th:text="${o.orgUnitName()} + (${o.orgUnitShorthand() != null} ? ' (' + ${o.orgUnitShorthand()} + ')' : '')">Bereich</option>
                </select>

                <div class="bank-form-row" data-movement-types="WITHDRAWAL TRANSFER" hidden>
                    <label for="bank-mv-justification">
                        <span th:text="#{bank.field.justification}">Begr&uuml;ndung</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.justification.hint')}"></th:block>
                    </label>
                    <input type="text" id="bank-mv-justification" name="justification" maxlength="500" disabled
                           data-testid="bank-movement-justification" th:placeholder="#{bank.field.justification.placeholder}">
                    <span class="bank-field-error" data-error-for="justification"></span>
                </div>

                <div class="bank-form-row">
                    <label for="bank-mv-note" th:text="#{bank.field.note}">Notiz</label>
                    <input type="text" id="bank-mv-note" name="note" maxlength="500"
                           th:placeholder="#{bank.field.note.placeholder}">
                </div>

                <div class="bank-form-row">
                    <label for="bank-mv-staff-note">
                        <span th:text="#{bank.field.staffNote}">Notiz Bankmitarbeiter</span>
                        <th:block th:replace="~{fragments/scu-hint :: fieldHint('bank.field.staffNote.hint')}"></th:block>
                    </label>
                    <input type="text" id="bank-mv-staff-note" name="staffNote" maxlength="500"
                           data-testid="bank-movement-staff-note">
                    <span class="bank-field-error" data-error-for="staffNote"></span>
                </div>
                <span class="bank-field-error" data-error-for="_global"></span>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                        th:attr="data-modal-id=${modalId}" th:text="#{general.cancel}">Abbrechen</button>
                <button type="submit" class="btn btn--cta" data-testid="bank-movement-submit"
                        th:attr="data-label-deposit=#{bank.action.deposit},data-label-withdrawal=#{bank.action.withdraw},data-label-transfer=#{bank.action.transfer}"
                        th:text="#{bank.action.deposit}">Einzahlen</button>
            </div>
        </form>
    </th:block>
</th:block>
</th:block>
</body>
</html>
