<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{purchasing.deals.title} + ' - ' + ${appTitle}">Ankauf - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<th:block th:replace="~{purchasing/fragments/purchasing-links :: purchasingLinks}"></th:block>
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(eyebrowKey='nav.section.supply', titleText=#{purchasing.deals.title}, count=${dealsPage.totalElements()}, countId='purchasing-deals-count', countFor='purchasing-deals-results', actions=~{::deals-actions})}">
        <th:block th:ref="deals-actions">
            <button type="button" class="btn btn-ghost" data-trigger="purchasing-open-pause" data-testid="purchasing-pause"
                    th:if="${purchasingState.governing() or !#lists.isEmpty(pausableUnits)}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-warning"/></svg> <span th:text="#{purchasing.pause.action}">Ankauf pausieren</span></button>
            <button type="button" class="btn btn--cta" data-trigger="purchasing-open-deal" data-testid="purchasing-new-deal"
                    th:if="${purchasingState.delegate()}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-plus"/></svg> <span th:text="#{purchasing.deal.new}">Neues Gesch&auml;ft</span></button>
        </th:block>
    </th:block>

    <th:block th:replace="~{purchasing/fragments/purchasing-tabs :: tabs(active='deals')}"></th:block>

    <section class="list-panel">
        <form id="purchasing-deals-filter" class="no-track" role="search" method="get" th:action="@{/purchasing/deals}">
            <div class="toolbar">
                <label class="visually-hidden" for="purchasing-filter-status" th:text="#{purchasing.filter.status}">Status</label>
                <select id="purchasing-filter-status" name="status" data-testid="purchasing-filter-status">
                    <option value="" th:text="#{purchasing.filter.status.all}">Alle Zust&auml;nde</option>
                    <option th:each="s : ${ {'DRAFT','SUBMITTED','FUNDED','IN_DELIVERY','DELIVERED','SETTLED','CANCELLED','FAILED'} }" th:value="${s}"
                            th:selected="${s == selectedStatus}" th:text="#{'purchasing.deal.status.' + ${s}}">Entwurf</option>
                </select>
                <label class="krt-switch" for="purchasing-filter-mine">
                    <input type="checkbox" role="switch" id="purchasing-filter-mine" name="mine" value="true" th:checked="${mine}">
                    <span th:text="#{purchasing.filter.mine}">Nur meine</span>
                </label>
                <label class="krt-switch" for="purchasing-filter-overdue">
                    <input type="checkbox" role="switch" id="purchasing-filter-overdue" name="overdue" value="true" th:checked="${overdue}">
                    <span th:text="#{purchasing.filter.overdue}">Nur &uuml;berf&auml;llige</span>
                </label>
            </div>
            <input type="hidden" name="size" th:value="${pageSize}">
        </form>

        <div id="purchasing-deals-results" th:data-live-sync-topic="${purchasingLiveSyncTopic}">
        <th:block th:fragment="dealsResults">
            <div class="alert alert-warning" role="status" data-testid="purchasing-paused-banner"
                 th:if="${pauseState != null and (pauseState.globalPaused() or !#lists.isEmpty(pauseState.units()))}">
                <p class="m-0" th:if="${pauseState.globalPaused()}"
                   th:text="#{purchasing.pause.banner.global(#{'purchasing.pause.reason.' + ${pauseState.globalReason()}})}">Der Ankauf ist pausiert.</p>
                <p class="m-0" th:each="u : ${pauseState.units()}"
                   th:text="#{purchasing.pause.banner.unit(${u.orgUnitName()}, #{'purchasing.pause.reason.' + ${u.reason()}})}">Der Ankauf f&uuml;r ARGON ist pausiert.</p>
                <div class="purchasing-actions" th:if="${purchasingState.governing()}">
                    <button type="button" class="btn btn-ghost btn-xs" data-trigger="purchasing-resume" data-testid="purchasing-resume-global"
                            th:if="${pauseState.globalPaused()}" th:text="#{purchasing.pause.resume}">Fortsetzen</button>
                    <button type="button" class="btn btn-ghost btn-xs" data-trigger="purchasing-resume"
                            th:each="u : ${pauseState.units()}" th:data-unit-id="${u.orgUnitId()}"
                            th:text="#{purchasing.pause.resume.unit(${u.orgUnitName()})}">ARGON fortsetzen</button>
                </div>
            </div>
            <div class="card card--flush">
            <div class="table-responsive" th:if="${!#lists.isEmpty(deals)}">
                <table class="data-table data-table--stack">
                    <thead>
                        <tr>
                            <th th:text="#{purchasing.deal.no}">Nr.</th>
                            <th th:text="#{purchasing.deal.unit}">Einheit</th>
                            <th th:text="#{purchasing.deal.entry}">Material / Item</th>
                            <th class="num" th:text="#{purchasing.deal.amount}">Menge</th>
                            <th class="num" th:text="#{purchasing.deal.total}">Summe</th>
                            <th class="cell-status" th:text="#{purchasing.deal.status}">Status</th>
                            <th class="cell-actions"><span class="visually-hidden" th:text="#{purchasing.actions}">Aktionen</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${deals}" data-testid="purchasing-deal-row" th:data-deal-id="${d.id()}">
                            <td><span class="cell-title" th:text="'#' + ${d.dealNo()}">#1</span></td>
                            <td th:attr="data-label=#{purchasing.deal.unit}" th:text="${d.raisingOrgUnit().name()}">ARGON</td>
                            <td th:attr="data-label=#{purchasing.deal.entry}">
                                <span class="cell-title" th:text="${d.material() != null ? d.material().name() : d.gameItem().name()}">Quantanium</span>
                                <span class="cell-sub" th:if="${d.qualityTier() != null}"
                                      th:text="#{purchasing.deal.quality(${#locale.language == 'en' ? d.qualityTier().labelEn() : d.qualityTier().labelDe()})}">Qualit&auml;t: Keine</span>
                            </td>
                            <td class="num" th:attr="data-label=#{purchasing.deal.amount}"
                                th:text="#{purchasing.deal.amountOf(${d.acceptedAmount()}, ${d.amount()}, #{'purchasing.unit.' + ${d.quantityType()}})}">3 von 10 SCU</td>
                            <td class="num" th:attr="data-label=#{purchasing.deal.total}"
                                th:text="#{purchasing.money(${#numbers.formatInteger(d.total(), 1, 'DEFAULT')})}">10.000 aUEC</td>
                            <td class="cell-status">
                                <th:block th:replace="~{purchasing/fragments/status-chip :: chip(labelKey=${'purchasing.deal.status.' + d.status()}, status=${d.status()})}"></th:block>
                                <span class="chip chip--warning" th:if="${d.overdue()}" data-testid="purchasing-overdue"
                                      th:text="#{purchasing.deal.overdue}">&uuml;berf&auml;llig</span>
                            </td>
                            <td class="cell-actions">
                                <a class="btn btn-ghost btn-xs" th:href="@{/purchasing/deals/{id}(id=${d.id()})}" data-testid="purchasing-open-deal"
                                   th:text="#{purchasing.deal.open}">&Ouml;ffnen</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <th:block th:if="${#lists.isEmpty(deals)}">
                <th:block th:replace="~{kernel/fragments/components :: emptyState(titleKey='purchasing.deals.empty.title', textKey='purchasing.deals.empty.text')}"></th:block>
            </th:block>
            <th:block th:replace="~{kernel/fragments/components :: listFoot(pageResponse=${dealsPage}, baseUrl=${paginationBaseUrl})}"></th:block>
            <nav th:replace="~{kernel/fragments/pagination :: pageSizePicker(pageResponse=${dealsPage}, baseUrl=${paginationBaseUrl}, sizes=${pageSizes})}"></nav>
            </div>
        </th:block>
        </div>
    </section>

    <th:block th:if="${purchasingState.delegate()}">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='purchasing-deal-modal', titleKey='purchasing.deal.new', titleId='purchasing-deal-title', variant='krt-modal--wide', body=~{::purchasing-deal-modal-body})}">
        <th:block th:ref="purchasing-deal-modal-body">
            <form id="purchasing-deal-form" class="no-track" novalidate>
                <div class="krt-modal-body">
                    <div class="form-group">
                        <label for="purchasing-deal-need" th:text="#{purchasing.deal.need}">Bedarf</label>
                        <select id="purchasing-deal-need" required data-testid="purchasing-deal-need">
                            <option th:each="n : ${openNeeds}" th:value="${n.id()}"
                                    th:data-entry="${n.material() != null ? n.material().name() : n.gameItem().name()}"
                                    th:data-open="${n.openAmount()}" th:data-max-price="${n.maxUnitPrice()}"
                                    th:data-unit="${n.orgUnitName()}"
                                    th:text="${n.orgUnitName() + ' - ' + (n.material() != null ? n.material().name() : n.gameItem().name())}">ARGON - Quantanium</option>
                        </select>
                        <p id="purchasing-deal-need-hint" class="form-hint"></p>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-deal-partner" th:text="#{purchasing.deal.partner}">Partner</label>
                        <select id="purchasing-deal-partner" required data-testid="purchasing-deal-partner">
                            <option th:each="p : ${partners}" th:value="${p.id()}" th:text="${p.name()}">Partner</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-deal-amount" th:text="#{purchasing.deal.amount}">Menge</label>
                        <input type="text" data-number-input id="purchasing-deal-amount" min="0.001" step="any" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-deal-price" th:text="#{purchasing.deal.unitPrice}">Einzelpreis (aUEC)</label>
                        <input type="text" data-number-input id="purchasing-deal-price" min="1" step="1" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-deal-model" th:text="#{purchasing.deal.paymentModel}">Zahlungsmodell</label>
                        <select id="purchasing-deal-model">
                            <option th:each="m : ${ {'ADVANCE','ON_DELIVERY','PARTIAL'} }" th:value="${m}"
                                    th:text="#{'purchasing.deal.paymentModel.' + ${m}}">Vorkasse</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-deal-class" th:text="#{purchasing.deal.riskClass.raise}">Risikoklasse erh&ouml;hen (optional)</label>
                        <select id="purchasing-deal-class">
                            <option value="" th:text="#{purchasing.deal.riskClass.computed}">Berechnete Klasse</option>
                            <option th:each="c : ${ {'A','B','C'} }" th:value="${c}" th:text="#{'purchasing.deal.riskClass.' + ${c}}">A</option>
                        </select>
                    </div>
                    <div class="form-group check-row">
                        <input type="checkbox" id="purchasing-deal-escort">
                        <label for="purchasing-deal-escort" th:text="#{purchasing.deal.escort}">Begleitschutz gew&uuml;nscht</label>
                    </div>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="purchasing-deal-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn--cta" data-testid="purchasing-deal-submit"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{general.save}">Speichern</span></button>
                </div>
            </form>
        </th:block>
    </th:block>
    </th:block>

    <th:block th:if="${purchasingState.governing() or !#lists.isEmpty(pausableUnits)}">
    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='purchasing-pause-modal', titleKey='purchasing.pause.action', titleId='purchasing-pause-title', variant='krt-modal--danger', body=~{::purchasing-pause-modal-body})}">
        <th:block th:ref="purchasing-pause-modal-body">
            <form id="purchasing-pause-form" class="no-track" novalidate>
                <div class="krt-modal-body">
                    <div class="form-group">
                        <label for="purchasing-pause-scope" th:text="#{purchasing.pause.scope}">Geltungsbereich</label>
                        <select id="purchasing-pause-scope" data-testid="purchasing-pause-scope">
                            <option value="" th:if="${purchasingState.governing()}" th:text="#{purchasing.pause.scope.global}">Gesamte Organisation</option>
                            <option th:each="u : ${pausableUnits}" th:value="${u.orgUnitId()}" th:text="${u.name()}">ARGON</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-pause-reason" th:text="#{purchasing.pause.reason}">Grund</label>
                        <select id="purchasing-pause-reason">
                            <option th:each="r : ${ {'TRUST_CONCERN','BUDGET','INCIDENT','OTHER'} }" th:value="${r}"
                                    th:text="#{'purchasing.pause.reason.' + ${r}}">Vertrauensbedenken</option>
                        </select>
                    </div>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="purchasing-pause-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn-danger" data-testid="purchasing-pause-submit" th:text="#{purchasing.pause.submit}">Pausieren</button>
                </div>
            </form>
        </th:block>
    </th:block>
    </th:block>
</main>
</th:block>

<th:block th:fragment="pageTail">
<th:block th:replace="~{purchasing/fragments/purchasing-script :: purchasingBootstrap}"></th:block>
<script type="module" th:src="@{/js/purchasing/purchasing-deals.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
