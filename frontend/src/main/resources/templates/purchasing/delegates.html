<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{purchasing.delegates.title} + ' - ' + ${appTitle}">Handelsbeauftragte - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<th:block th:replace="~{purchasing/fragments/purchasing-links :: purchasingLinks}"></th:block>
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(eyebrowKey='nav.section.supply', titleText=#{purchasing.delegates.title}, count=${#lists.size(delegates)}, countId='purchasing-delegates-count', countFor='purchasing-delegates-results', actions=~{::delegates-actions})}">
        <th:block th:ref="delegates-actions">
            <button type="button" class="btn btn--cta" data-trigger="purchasing-open-appoint" data-testid="purchasing-appoint">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-user-plus"/></svg> <span th:text="#{purchasing.delegate.appoint}">Bestellen</span></button>
        </th:block>
    </th:block>

    <th:block th:replace="~{purchasing/fragments/purchasing-tabs :: tabs(active='delegates')}"></th:block>

    <div id="purchasing-delegates-results" th:data-live-sync-topic="${purchasingLiveSyncTopic}">
    <th:block th:fragment="delegatesResults">
        <div class="card card--flush" th:data-list-total="${#lists.size(delegates)}">
            <table class="data-table data-table--stack" th:if="${!#lists.isEmpty(delegates)}">
                <thead>
                    <tr>
                        <th th:text="#{purchasing.delegate.member}">Mitglied</th>
                        <th th:text="#{purchasing.delegate.appointed}">Bestellt</th>
                        <th th:text="#{purchasing.delegate.until}">G&uuml;ltig bis</th>
                        <th class="num" th:text="#{purchasing.delegate.limit}">Monatslimit</th>
                        <th class="cell-status" th:text="#{purchasing.delegate.state}">Stand</th>
                        <th class="cell-actions"><span class="visually-hidden" th:text="#{purchasing.actions}">Aktionen</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${delegates}" data-testid="purchasing-delegate-row" th:data-delegate-id="${d.id()}">
                        <td th:text="${d.displayName() != null ? d.displayName() : '&ndash;'}">Name</td>
                        <td th:attr="data-label=#{purchasing.delegate.appointed}">
                            <span th:text="${#temporals.format(d.appointedAt(), 'dd.MM.yyyy')}">01.01.2026</span>
                            <span class="cell-sub" th:if="${d.appointedByName() != null}" th:text="${d.appointedByName()}">Leitung</span>
                        </td>
                        <td th:attr="data-label=#{purchasing.delegate.until}"
                            th:text="${d.validUntil() != null ? #temporals.format(d.validUntil(), 'dd.MM.yyyy') : '&ndash;'}">&ndash;</td>
                        <td class="num" th:attr="data-label=#{purchasing.delegate.limit}">
                            <span th:text="#{purchasing.money(${#numbers.formatInteger(d.effectiveLimit(), 1, 'POINT')})}">0 aUEC</span>
                            <span class="cell-sub" th:if="${d.monthlyLimit() == null}" th:text="#{purchasing.delegate.limit.default}">Standard</span>
                        </td>
                        <td class="cell-status">
                            <th:block th:replace="~{purchasing/fragments/status-chip :: chip(labelKey=${d.active() ? 'purchasing.delegate.active' : 'purchasing.delegate.inactive'}, status=${d.active() ? 'ACTIVE' : 'INACTIVE'})}"></th:block>
                        </td>
                        <td class="cell-actions">
                            <div class="purchasing-actions" th:if="${d.revokedAt() == null}">
                                <button type="button" class="btn btn-ghost btn-xs" data-trigger="purchasing-delegate-limit" data-testid="purchasing-delegate-limit"
                                        th:data-delegate-id="${d.id()}" th:data-version="${d.version()}" th:data-limit="${d.monthlyLimit()}"
                                        th:text="#{purchasing.delegate.setLimit}">Limit</button>
                                <th:block th:replace="~{kernel/fragments/components :: overflowMenu(id=${'purchasing-delegate-more-' + d.id()}, items=~{::purchasing-delegate-more-items})}">
                                    <th:block th:ref="purchasing-delegate-more-items">
                                        <button type="button" class="overflow-menu__item overflow-menu__item--danger" role="menuitem"
                                                data-trigger="purchasing-delegate-revoke" data-testid="purchasing-delegate-revoke"
                                                th:data-delegate-id="${d.id()}" th:data-version="${d.version()}"
                                                th:text="#{purchasing.delegate.revoke}">Widerrufen</button>
                                    </th:block>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <th:block th:if="${#lists.isEmpty(delegates)}">
                <th:block th:replace="~{kernel/fragments/components :: emptyState(titleKey='purchasing.delegates.empty.title', textKey='purchasing.delegates.empty.text')}"></th:block>
            </th:block>
        </div>
    </th:block>
    </div>

    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='purchasing-appoint-modal', titleKey='purchasing.delegate.appoint', titleId='purchasing-appoint-title', body=~{::purchasing-appoint-modal-body})}">
        <th:block th:ref="purchasing-appoint-modal-body">
            <form id="purchasing-appoint-form" class="no-track" novalidate>
                <div class="krt-modal-body">
                    <div class="form-group">
                        <label for="purchasing-appoint-user" th:text="#{purchasing.delegate.member}">Mitglied</label>
                        <select id="purchasing-appoint-user" data-krt-combobox="remote-users" data-testid="purchasing-appoint-user">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purchasing-appoint-until" th:text="#{purchasing.delegate.until}">G&uuml;ltig bis (optional)</label>
                        <input type="date" id="purchasing-appoint-until">
                    </div>
                    <div class="form-group">
                        <label for="purchasing-appoint-limit" th:text="#{purchasing.delegate.limit.personal}">Pers&ouml;nliches Monatslimit in aUEC (optional)</label>
                        <input type="number" id="purchasing-appoint-limit" min="0" step="1" inputmode="numeric">
                    </div>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="purchasing-appoint-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn--cta" data-testid="purchasing-appoint-submit" th:text="#{purchasing.delegate.appoint.submit}">Bestellen</button>
                </div>
            </form>
        </th:block>
    </th:block>

    <th:block th:replace="~{kernel/fragments/modal-wrapper :: modal(modalId='purchasing-limit-modal', titleKey='purchasing.delegate.setLimit', titleId='purchasing-limit-title', body=~{::purchasing-limit-modal-body})}">
        <th:block th:ref="purchasing-limit-modal-body">
            <form id="purchasing-limit-form" class="no-track" novalidate>
                <div class="krt-modal-body">
                    <input type="hidden" id="purchasing-limit-id">
                    <input type="hidden" id="purchasing-limit-version">
                    <div class="form-group">
                        <label for="purchasing-limit-value" th:text="#{purchasing.delegate.limit.personal}">Pers&ouml;nliches Monatslimit in aUEC (leer = Standard)</label>
                        <input type="number" id="purchasing-limit-value" min="0" step="1" inputmode="numeric" data-testid="purchasing-limit-value">
                    </div>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display" data-modal-id="purchasing-limit-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn--cta" data-testid="purchasing-limit-submit" th:text="#{general.save}">Speichern</button>
                </div>
            </form>
        </th:block>
    </th:block>
</main>
</th:block>

<th:block th:fragment="pageTail">
<th:block th:replace="~{purchasing/fragments/purchasing-script :: purchasingBootstrap}"></th:block>
<script type="module" th:src="@{/js/purchasing/purchasing-delegates.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
