<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{orders.create.title} + ' - ' + ${appTitle}">Neuer Auftrag - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/orders-create.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='orders.create.back', eyebrowHref=@{/orders},
        titleText=(${editOrderId != null} ? #{orders.create.editTitle} : #{orders.create.title}))}"></th:block>

    <div class="form-layout card orders-create">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="#{__${error}__}">Fehler</div>
        <div th:if="${success}" class="alert alert-success" role="status" th:text="#{__${success}__}">Erfolg</div>

        <div class="segmented segmented--block segmented--lg orders-create__kind" role="radiogroup"
             th:attr="aria-label=#{orders.create.kind}" data-segmented="orderModeToggle"
             th:hidden="${editOrderId != null}">
            <label data-testid="order-mode-material">
                <input type="radio" name="orderModeToggle" value="material"
                       th:checked="${editOrderId == null}"
                       data-trigger="order-mode-toggle" />
                <span th:text="#{orders.create.kind.material}">Materialauftrag</span>
            </label>
            <label data-testid="order-mode-item">
                <input type="radio" name="orderModeToggle" value="item"
                       th:checked="${editOrderId != null}"
                       data-trigger="order-mode-toggle" />
                <span th:text="#{orders.create.kind.item}">Item-Auftrag</span>
            </label>
        </div>

        <div id="mode-material" th:hidden="${editOrderId != null}">
            <form class="orders-create__form" th:action="@{/orders/create}" method="post" th:object="${jobOrderForm}">
                <input type="hidden" th:field="*{source}" />

                <fieldset class="form-section">
                    <legend class="form-section__head" th:text="|1 · #{orders.create.section.order}|">1 · Auftrag</legend>
                    <div th:if="${#lists.isEmpty(responsibleOptions)}" class="alert alert-danger" role="alert"
                         th:text="#{orders.create.responsible.none}">Keine bearbeitende Einheit freigeschaltet.</div>
                    <div class="form-grid">
                        <div th:replace="~{fragments/orgunit-select :: orgUnitSelect('responsibleOrgUnitId', 'responsibleOrgUnitId', ${responsibleOptions}, ${jobOrderForm.responsibleOrgUnitId}, 'orders.create.responsible', true)}"></div>
                        <div th:replace="~{fragments/orgunit-select :: orgUnitSelect('requestingOrgUnitId', 'requestingOrgUnitId', ${requestingOptions}, ${jobOrderForm.requestingOrgUnitId}, 'orders.create.requesting', true)}"></div>
                        <div class="form-group">
                            <label for="handle" th:text="#{orders.create.handle}">Handle Ansprechpartner</label>
                            <input type="text" id="handle" th:field="*{handle}" autocomplete="off" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend class="form-section__head">
                        <span th:text="|2 · #{orders.create.materials.title}|">2 · Materialien</span>
                        <span class="grow"></span>
                        <button type="button" class="btn btn-ghost btn-xs" data-trigger="open-modal-display"
                                data-modal-id="orders-scmdb-modal" data-testid="orders-scmdb-open"
                                th:text="#{orders.create.scmdb.open}">Aus scmdb importieren</button>
                    </legend>

                    <div class="material-grid material-grid--head" aria-hidden="true">
                        <span th:text="#{orders.create.material}">Material</span>
                        <span th:text="#{orders.create.amount}">Menge</span>
                        <span th:text="#{orders.create.minQuality}">Min. Qualität</span>
                        <span></span>
                    </div>

                    <div id="materials-container" th:attr="data-remove-label=#{orders.create.material.remove}">
                        <div class="material-row material-grid" th:each="mat, stat : *{materials}">
                            <div class="form-group">
                                <label class="visually-hidden" th:text="#{orders.create.material}">Material</label>
                                <select th:field="*{materials[__${stat.index}__].materialId}" data-testid="order-material-select" data-role="material-select" data-krt-combobox="remote-materials-joborder" required>
                                    <option value="" th:text="#{orders.create.select}">-- Bitte wählen --</option>
                                    <option th:each="m : ${materials}" th:if="${m.id == jobOrderForm.materials[stat.index].materialId}" th:value="${m.id}" th:data-quantity-type="${m.quantityType}" th:text="${m.name}"></option>
                                </select>
                            </div>
                            <div class="form-group material-row__amount">
                                <input type="text" inputmode="decimal" data-scu-decimal th:field="*{materials[__${stat.index}__].amount}" data-testid="order-material-amount" data-role="material-amount" step="0.001" min="0" required
                                       th:attr="aria-label=#{orders.create.amount}">
                                <span class="material-row__unit" data-role="amount-unit"></span>
                                <th:block th:replace="~{fragments/scu-hint :: scuHint(null, true)}"></th:block>
                            </div>
                            <div class="form-group">
                                <select th:field="*{materials[__${stat.index}__].minQuality}" th:title="#{orders.create.minQuality.hint}"
                                        th:attr="aria-label=#{orders.create.minQuality}">
                                    <th:block th:replace="~{fragments/quality-tier :: floorOptions(${qualityTiers}, ${jobOrderForm.materials[__${stat.index}__].minQuality})}"></th:block>
                                </select>
                            </div>
                            <button type="button" class="btn btn-ghost btn-icon material-row__remove" data-trigger="orders-remove-material"
                                    data-testid="order-material-remove"
                                    th:attr="aria-label=#{orders.create.material.remove},title=#{orders.create.material.remove}"
                                    th:disabled="${#lists.size(jobOrderForm.materials) <= 1}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-ghost orders-create__add" data-trigger="orders-add-material" th:text="#{orders.create.addMaterial}">+ Material hinzufügen</button>
                </fieldset>

                <fieldset class="form-section">
                    <legend class="form-section__head">
                        <label for="comment"><span aria-hidden="true">3 · </span><span th:text="#{orders.create.comment}">Kommentar</span></label>
                        <span class="opt" th:text="|· #{form.optional}|">· optional</span>
                    </legend>
                    <div class="form-group">
                        <textarea id="comment" th:field="*{comment}" rows="4" maxlength="1000" th:placeholder="#{orders.create.comment.placeholder}"
                                  aria-describedby="comment-count" data-counter="comment-count"></textarea>
                        <p class="form-hint orders-create__counter" id="comment-count"
                           th:text="${(jobOrderForm.comment == null ? 0 : jobOrderForm.comment.length()) + ' / 1000'}">0 / 1000</p>
                    </div>
                </fieldset>

                <div class="form-actions--sticky">
                    <span class="form-actions__summary" id="orders-material-summary" data-testid="order-summary"
                          th:attr="data-one=#{orders.create.summary.material.one},data-other=#{orders.create.summary.material.other},data-for=#{orders.create.summary.for},data-unit=#{material.quantity.scu}"></span>
                    <a th:href="@{/orders}" class="btn btn-ghost" th:text="#{orders.create.cancel}">Abbrechen</a>
                    <button type="submit" class="btn btn--cta" data-testid="order-submit"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{orders.create.submit.create}">Auftrag anlegen</span></button>
                </div>
            </form>
        </div>

        <div id="mode-item" th:hidden="${editOrderId == null}">
            <form class="orders-create__form" th:action="${editOrderId != null} ? @{/orders/{id}/items/update(id=${editOrderId})} : @{/orders/items}" method="post" th:object="${jobOrderItemForm}">
                <input type="hidden" th:field="*{source}" />

                <fieldset class="form-section">
                    <legend class="form-section__head" th:text="|1 · #{orders.create.section.order}|">1 · Auftrag</legend>
                    <div th:if="${#lists.isEmpty(responsibleOptions)}" class="alert alert-danger" role="alert"
                         th:text="#{orders.create.responsible.none}">Keine bearbeitende Einheit freigeschaltet.</div>
                    <div class="form-grid">
                        <div th:replace="~{fragments/orgunit-select :: orgUnitSelect('item-responsibleOrgUnitId', 'responsibleOrgUnitId', ${responsibleOptions}, ${jobOrderItemForm.responsibleOrgUnitId}, 'orders.create.responsible', true)}"></div>
                        <div th:replace="~{fragments/orgunit-select :: orgUnitSelect('item-requestingOrgUnitId', 'requestingOrgUnitId', ${requestingOptions}, ${jobOrderItemForm.requestingOrgUnitId}, 'orders.create.requesting', true)}"></div>
                        <div class="form-group">
                            <label for="item-handle" th:text="#{orders.create.handle}">Handle Ansprechpartner</label>
                            <input type="text" id="item-handle" th:field="*{handle}" autocomplete="off" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend class="form-section__head" th:text="|2 · #{orders.create.items.title}|">2 · Items</legend>
                    <div th:if="${!hasOrderableItems}" class="alert alert-danger" role="alert"
                         th:text="#{orders.create.item.noItems}">Keine bestellbaren Items verfügbar.</div>
                    <div id="item-lines"></div>
                    <button type="button" class="btn btn-ghost orders-create__add" data-trigger="orders-add-item" th:text="#{orders.create.item.add}">+ Item hinzufügen</button>
                </fieldset>

                <fieldset class="form-section">
                    <legend class="form-section__head">
                        <label for="item-comment"><span aria-hidden="true">3 · </span><span th:text="#{orders.create.comment}">Kommentar</span></label>
                        <span class="opt" th:text="|· #{form.optional}|">· optional</span>
                    </legend>
                    <div class="form-group">
                        <textarea id="item-comment" th:field="*{comment}" rows="4" maxlength="1000" th:placeholder="#{orders.create.comment.placeholder}"
                                  aria-describedby="item-comment-count" data-counter="item-comment-count"></textarea>
                        <p class="form-hint orders-create__counter" id="item-comment-count"
                           th:text="${(jobOrderItemForm.comment == null ? 0 : jobOrderItemForm.comment.length()) + ' / 1000'}">0 / 1000</p>
                    </div>
                </fieldset>

                <div class="form-actions--sticky">
                    <span class="form-actions__summary" id="orders-item-summary" data-testid="order-item-summary"
                          th:attr="data-one=#{orders.create.summary.item.one},data-other=#{orders.create.summary.item.other},data-for=#{orders.create.summary.for}"></span>
                    <a th:href="@{/orders}" class="btn btn-ghost" th:text="#{orders.create.cancel}">Abbrechen</a>
                    <button type="submit" class="btn btn--cta" data-testid="order-item-submit"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="${editOrderId != null} ? #{orders.create.submit.edit} : #{orders.create.submit.create}">Auftrag anlegen</span></button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='orders-scmdb-modal', titleKey='orders.create.scmdb.open', variant='krt-modal--wide', body=~{::orders-scmdb-modal-body})}">
        <th:block th:ref="orders-scmdb-modal-body">
            <div class="krt-modal-body">
                <div class="form-group">
                    <label for="scmdb-import-text" th:text="#{orders.create.scmdb.label}">scmdb.net Export</label>
                    <textarea id="scmdb-import-text" rows="8" th:placeholder="#{orders.create.scmdb.placeholder}"></textarea>
                </div>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                        data-modal-id="orders-scmdb-modal" th:text="#{general.cancel}">Abbrechen</button>
                <button type="button" class="btn btn-outline" data-trigger="orders-import-scmdb"
                        data-testid="orders-scmdb-import" th:text="#{orders.create.scmdb.button}">Materialien extrahieren</button>
            </div>
        </th:block>
    </th:block>

    <select id="minquality-options-template" hidden>
        <th:block th:replace="~{fragments/quality-tier :: floorOptionsSelected(${qualityTiers}, ${qualityTiers.?[active() and minQuality() == 650].isEmpty() ? null : 650})}"></th:block>
    </select>

    <select id="item-quality-options-template" hidden>
        <th:block th:replace="~{fragments/quality-tier :: codeOptions(${qualityTiers})}"></th:block>
    </select>

    <select id="item-options-template" hidden>
        <option value="" th:text="#{orders.create.item.select}">-- Item wählen --</option>
    </select>
</main>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    let materialIndex = /*[[${jobOrderForm.materials.size()}]]*/ 1;

    const MSG_UNIT_SCU = /*[[#{material.quantity.scu}]]*/ 'SCU';
    const MSG_UNIT_PIECE = /*[[#{material.quantity.piece}]]*/ 'Stueck';
    const MSG_MATERIAL_LABEL = /*[[#{orders.create.material}]]*/ 'Material';
    const MSG_AMOUNT_LABEL = /*[[#{orders.create.amount}]]*/ 'Menge';
    const MSG_MINQUALITY_LABEL = /*[[#{orders.create.minQuality}]]*/ 'Min. Qualitaet';
    const SCU_HINT_TEXT = /*[[#{material.scu.hint}]]*/ 'Eingabe in SCU.';

    const MSG_SCMDB_SUCCESS = /*[[#{orders.create.scmdb.success}]]*/ 'Materialien erfolgreich extrahiert.';
    const MSG_SCMDB_SOME_UNKNOWN = /*[[#{orders.create.scmdb.error.some_unknown}]]*/ 'einige unbekannt';
    const MSG_SCMDB_NO_MATCH = /*[[#{orders.create.scmdb.error.no_match}]]*/ 'Keine bekannten Materialien im Export gefunden.';
    const MSG_SCMDB_NOT_FOUND = /*[[#{orders.create.scmdb.error.not_found}]]*/ 'Folgende Materialien wurden nicht im System gefunden';

    const ITEM_I18N = {
        item: /*[[#{orders.create.item}]]*/ 'Item',
        blueprint: /*[[#{orders.create.item.blueprint}]]*/ 'Bauplan',
        amount: /*[[#{orders.create.item.amount}]]*/ 'Anzahl',
        remove: /*[[#{orders.create.item.remove}]]*/ 'Entfernen',
        materialsTitle: /*[[#{orders.create.item.materials.title}]]*/ 'Materialien',
        subTitle: /*[[#{orders.create.item.subassembly.title}]]*/ 'Unterbaugruppen',
        subAdopt: /*[[#{orders.create.item.subassembly.adopt}]]*/ 'Uebernehmen',
        unresolved: /*[[#{orders.create.item.unresolved}]]*/ 'Nicht aufgeloeste Zutaten:',
        searchPlaceholder: /*[[#{orders.create.item.search.placeholder}]]*/ 'Item suchen oder waehlen...',
        searchNoResults: /*[[#{orders.create.item.search.noResults}]]*/ 'Keine passenden Items',
        searchHint: /*[[#{orders.create.item.search.hint}]]*/ 'Weiter tippen, um die Liste einzugrenzen...',
        searchInvalid: /*[[#{orders.create.item.search.invalid}]]*/ 'Bitte ein Item aus der Liste waehlen.',
        searchLoading: /*[[#{orders.create.item.search.loading}]]*/ 'Suche laeuft...',
        producedLocked: /*[[#{orders.create.item.producedLocked}]]*/ 'Bereits {0} Stueck hergestellt.'
    };
    const EDIT_ITEMS = /*[[${editItems}]]*/ null;

    const MSG_MATERIAL_INVALID = /*[[#{error.joborder.material.invalid}]]*/ 'Invalid material.';
    const MSG_ITEM_INVALID = /*[[#{error.joborder.item.invalid}]]*/ 'Invalid item.';
    const MSG_CREATE_FAILED = /*[[#{error.joborder.create.failed}]]*/ 'Create failed.';
    const MSG_UPDATE_FAILED = /*[[#{error.joborder.update.failed}]]*/ 'Update failed.';
</script>
<script th:src="@{/js/orders-create.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
