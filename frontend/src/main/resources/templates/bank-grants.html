<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{bank.grants.title} + ' - ' + ${appTitle}">Bank-Berechtigungen - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/bank.css}">
        <link rel="stylesheet" th:href="@{/css/pages/bank-grants.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main th:attr="data-bank-generic-error=#{bank.error.network},data-bank-saved=#{frontend.ajax.saved},data-bank-refresh-error=#{bank.refresh.failed},data-bank-livesync-updates=#{livesync.updates_available},data-user-id=${#authentication.name}">
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.bank', eyebrowHref=@{/bank}, titleText=#{bank.grants.title}, actions=~{::bank-grants-actions})}">
        <th:block th:ref="bank-grants-actions">
            <button type="button" class="btn btn--cta"
                    data-trigger="open-modal-display" data-modal-id="bank-grant-create-modal"
                    data-testid="bank-grant-create-open" th:text="#{bank.grants.create}">+ Berechtigung erteilen</button>
        </th:block>
    </th:block>

    <form id="bank-grants-filter-form" class="no-track" method="get" th:action="@{/bank/grants}">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: segmented(name='view', labelKey='bank.grants.view.aria', selected=${byEmployee ? 'employee' : 'account'},
                options=${ {{value: 'account', labelKey: 'bank.grants.view.account'}, {value: 'employee', labelKey: 'bank.grants.view.employee'}} })}"></th:block>
            <div class="bank-grants-filter" th:if="${!byEmployee}">
                <label for="bank-grants-account-filter" class="visually-hidden" th:text="#{bank.grants.filter.account}">Konto</label>
                <select id="bank-grants-account-filter" data-role="bank-grants-filter"
                        data-view="account" data-param="accountId"
                        data-krt-combobox="remote-bank-accounts"
                        th:attr="data-combobox-placeholder=#{bank.account.search.placeholder},data-combobox-no-results=#{bank.account.search.noResults}"
                        data-testid="bank-grants-filter">
                    <option value="" th:text="#{bank.grants.filter.allAccounts}">Alle Konten</option>
                    <option th:if="${selectedAccount != null}" th:value="${selectedAccount.id()}" selected
                            th:text="${selectedAccount.accountNo()} + ' &#8212; ' + ${selectedAccount.name()}">KB-0001 &#8212; Staffel IRIDIUM</option>
                </select>
            </div>
            <div class="bank-grants-filter" th:if="${byEmployee}">
                <label for="bank-grants-user-filter" class="visually-hidden" th:text="#{bank.grants.filter.employee}">Mitarbeiter</label>
                <select id="bank-grants-user-filter" data-role="bank-grants-filter"
                        data-view="employee" data-param="userId" data-testid="bank-grants-filter">
                    <option value="" th:text="#{bank.grants.filter.allEmployees}">Alle Mitarbeiter</option>
                    <option th:each="g : ${grantees}" th:value="${g.key}"
                            th:selected="${selectedUserId != null and selectedUserId == g.key}"
                            th:text="${g.value}">greluc</option>
                </select>
            </div>
        </div>
    </form>

    <div id="bank-grants-results" class="card card--flush" data-testid="bank-grants-panel">
        <th:block th:fragment="grantsMatrix">
        <div class="table-responsive" th:if="${!#lists.isEmpty(grants)}">
            <table class="data-table data-table--stack">
                <thead>
                <tr>
                    <th th:text="#{bank.grants.col.employee}">Mitarbeiter</th>
                    <th th:text="#{bank.grants.col.account}">Konto</th>
                    <th class="bank-grants-flag-col" th:text="#{bank.grants.col.deposit}">Einzahlen</th>
                    <th class="bank-grants-flag-col" th:text="#{bank.grants.col.withdraw}">Auszahlen</th>
                    <th class="bank-grants-flag-col" th:text="#{bank.grants.col.transfer}">Transfer</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.actions}">Aktionen</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${grants}" data-testid="bank-grant-row"
                    th:with="grantHandle=${@handles.display(g.userHandle())}"
                    th:classappend="${!g.granteeHasBankRole()} ? ' is-inert' : ''"
                    th:attr="data-user-id=${g.userId()},data-account-id=${g.accountId()},data-version=${g.version()},data-can-deposit=${g.canDeposit()},data-can-withdraw=${g.canWithdraw()},data-can-transfer=${g.canTransfer()},data-user-handle=${grantHandle}">
                    <td>
                        <span class="cell-title" th:text="${grantHandle}">greluc</span>
                        <span class="chip chip--muted"
                              th:if="${!g.granteeHasBankRole()}"
                              th:title="#{bank.grants.missingRole.hint}"
                              th:text="#{bank.grants.missingRole}">Rolle fehlt</span>
                    </td>
                    <td th:attr="data-label=#{bank.grants.col.account}" th:text="${g.accountNo()} + ' &#8212; ' + ${g.accountName()}">KB-0001 &#8212; Staffel IRIDIUM</td>
                    <td class="bank-grants-flag-col" th:attr="data-label=#{bank.grants.col.deposit}">
                        <button type="button" class="matrix-flag" data-flag="canDeposit"
                                th:classappend="${g.canDeposit()} ? ' on' : ''"
                                th:aria-pressed="${g.canDeposit()}"
                                th:aria-label="#{bank.grants.col.deposit}"
                                data-testid="bank-grant-flag-deposit"></button>
                    </td>
                    <td class="bank-grants-flag-col" th:attr="data-label=#{bank.grants.col.withdraw}">
                        <button type="button" class="matrix-flag" data-flag="canWithdraw"
                                th:classappend="${g.canWithdraw()} ? ' on' : ''"
                                th:aria-pressed="${g.canWithdraw()}"
                                th:aria-label="#{bank.grants.col.withdraw}"
                                data-testid="bank-grant-flag-withdraw"></button>
                    </td>
                    <td class="bank-grants-flag-col" th:attr="data-label=#{bank.grants.col.transfer}">
                        <button type="button" class="matrix-flag" data-flag="canTransfer"
                                th:classappend="${g.canTransfer()} ? ' on' : ''"
                                th:aria-pressed="${g.canTransfer()}"
                                th:aria-label="#{bank.grants.col.transfer}"
                                data-testid="bank-grant-flag-transfer"></button>
                    </td>
                    <td class="cell-actions">
                        <button type="button" class="btn btn-quiet-danger btn-xs"
                                data-trigger="open-modal-display" data-modal-id="bank-grant-revoke-modal"
                                th:with="grantLabel=${grantHandle} + ' / ' + ${g.accountNo()}"
                                th:attr="data-field-_userId=${g.userId()},data-field-_accountId=${g.accountId()},data-field-_label=${grantLabel}"
                                data-testid="bank-grant-revoke-open"
                                th:text="#{bank.grants.revoke}">Entziehen</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${#lists.isEmpty(grants)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='bank.grants.empty.title', textKey='bank.grants.empty', emptyId='bank-grants-empty')}"></th:block>
        </th:block>
        </th:block>
    </div>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='bank-grant-create-modal', titleKey='bank.modal.grant.title', body=~{::bank-grant-create-modal-body})}">
        <th:block th:ref="bank-grant-create-modal-body">
            <form class="bank-ajax-form no-track" data-refresh="grantsMatrix"
                  data-livesync="bank/grants"
                  data-endpoint="/api/proxy/bank/grants" data-method="POST">
                <div class="krt-modal-body">
                    <p class="bank-field-hint" th:text="#{bank.modal.grant.hint}">Der Nutzer braucht die Keycloak-Rolle &quot;Bank Employee&quot;, damit die Berechtigung wirkt.</p>
                    <div class="bank-form-row">
                        <label for="bank-grant-user" th:text="#{bank.field.user}">Nutzer</label>
                        <select id="bank-grant-user" name="userId" required data-role="bank-holder-user"
                                data-krt-combobox="remote-bank-users" data-testid="bank-grant-user">
                            <option value="" th:text="#{bank.field.user.placeholder}">Nutzer w&auml;hlen &hellip;</option>
                        </select>
                        <span class="bank-field-error" data-error-for="userId"></span>
                    </div>
                    <div class="bank-form-row">
                        <label for="bank-grant-account" th:text="#{bank.grants.col.account}">Konto</label>
                        <select id="bank-grant-account" name="accountId" required
                                data-krt-combobox="remote-bank-accounts"
                                th:attr="data-combobox-placeholder=#{bank.account.search.placeholder},data-combobox-no-results=#{bank.account.search.noResults}"
                                data-testid="bank-grant-account">
                            <option value="" th:text="#{bank.field.targetAccount.placeholder}">Konto w&auml;hlen &hellip;</option>
                        </select>
                        <span class="bank-field-error" data-error-for="accountId"></span>
                    </div>
                    <div class="bank-form-row">
                        <span class="bank-field-hint" th:text="#{bank.modal.grant.flags}">Berechtigungen:</span>
                        <label class="bank-check-label">
                            <input type="checkbox" name="canDeposit" data-testid="bank-grant-can-deposit">
                            <span th:text="#{bank.grants.col.deposit}">Einzahlen</span>
                        </label>
                        <label class="bank-check-label">
                            <input type="checkbox" name="canWithdraw" data-testid="bank-grant-can-withdraw">
                            <span th:text="#{bank.grants.col.withdraw}">Auszahlen</span>
                        </label>
                        <label class="bank-check-label">
                            <input type="checkbox" name="canTransfer" data-testid="bank-grant-can-transfer">
                            <span th:text="#{bank.grants.col.transfer}">Transfer</span>
                        </label>
                    </div>
                    <span class="bank-field-error" data-error-for="_global"></span>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                            data-modal-id="bank-grant-create-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn--cta" data-testid="bank-grant-create-submit"
                            th:text="#{bank.modal.grant.submit}">Erteilen</button>
                </div>
            </form>
        </th:block>
    </th:block>

    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='bank-grant-revoke-modal', titleKey='bank.modal.revoke.title', variant='krt-modal--danger', body=~{::bank-grant-revoke-modal-body})}">
        <th:block th:ref="bank-grant-revoke-modal-body">
            <form class="bank-ajax-form no-track" data-refresh="grantsMatrix"
                  data-livesync="bank/grants"
                  data-endpoint="/api/proxy/bank/grants/{userId}/{accountId}" data-method="DELETE">
                <input type="hidden" name="_userId">
                <input type="hidden" name="_accountId">
                <div class="krt-modal-body">
                    <p>
                        <span th:text="#{bank.modal.revoke.text}">Entzieht diesem Mitarbeiter alle Buchungsrechte auf dem Konto:</span>
                        <strong data-bank-label="_label"></strong>
                    </p>
                    <span class="bank-field-error" data-error-for="_global"></span>
                </div>
                <div class="krt-modal-foot">
                    <button type="button" class="btn btn-ghost" data-trigger="close-modal-display"
                            data-modal-id="bank-grant-revoke-modal" th:text="#{general.cancel}">Abbrechen</button>
                    <button type="submit" class="btn btn-danger" data-testid="bank-grant-revoke-submit"
                            th:text="#{bank.grants.revoke}">Entziehen</button>
                </div>
            </form>
        </th:block>
    </th:block>
</main>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:src="@{/js/bank.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:src="@{/js/bank-grants.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
