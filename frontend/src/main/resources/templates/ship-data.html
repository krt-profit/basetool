<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{nav.hangar_data} + ' - ' + ${appTitle}">Schiffsdaten - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
<link rel="stylesheet" th:href="@{/css/pages/ship-data.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
        <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.masterdata', titleText=#{nav.hangar_data}, actions=~{::ship-data-actions})}">
            <th:block th:ref="ship-data-actions">
                <th:block th:replace="~{fragments/components :: overflowMenu(id='ship-data-menu', items=~{::ship-data-menu-items})}">
                    <th:block th:ref="ship-data-menu-items">
                        <button type="button" class="overflow-menu__item overflow-menu__item--danger" role="menuitem"
                                data-trigger="open-modal-display" data-modal-id="reset-fitted-confirm-modal"
                                data-testid="ship-data-reset-fitted" th:text="#{hangar.ship.reset_fitted}">Alle unfitted</button>
                    </th:block>
                </th:block>
            </th:block>
        </th:block>
    </th:block>
    <th:block sec:authorize="!hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
        <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.admin.group.masterdata', titleText=#{nav.hangar_data})}"></th:block>
    </th:block>

    <th:block th:replace="~{fragments/components :: alert('danger', ${error}, null)}"></th:block>

    <th:block th:if="${catalogTruncated}">
        <div th:replace="~{fragments/components :: alert('warning', 'admin.catalog.truncated', null)}"></div>
    </th:block>

    <section class="sd-section" aria-labelledby="sd-shiptypes-title">
        <div class="split sd-section__head">
            <h2 id="sd-shiptypes-title" class="sd-section__title">
                <span th:text="#{ship.shiptypes}">Schiffstypen</span>
                <span class="chip chip--muted" data-testid="sd-shiptypes-count" th:text="${shipTypes != null ? #lists.size(shipTypes) : 0}">0</span>
            </h2>
            <div class="toolbar sd-toolbar">
                <div class="toolbar__search">
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-search"/></svg>
                    <input type="search" id="filterShipTypes" autocomplete="off" data-testid="toolbar-search"
                           data-trigger="filter-table" data-table-id="shipTypesTable"
                           th:attr="placeholder=#{general.filter.name.placeholder},aria-label=#{general.filter.name.placeholder}">
                </div>
                <datalist id="shipTypeNames-data" hidden>
                    <option th:each="st : ${shipTypes}" th:value="${st.name}"></option>
                </datalist>
            </div>
        </div>

        <div class="card card--flush">
            <div class="table-responsive" th:unless="${#lists.isEmpty(shipTypes)}">
                <table id="shipTypesTable" class="data-table data-table--stack">
                    <thead>
                        <tr>
                            <th th:text="#{ship.shiptype.name}">Name</th>
                            <th th:text="#{ship.shiptype.description}">Beschreibung</th>
                            <th class="cell-actions" sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" th:text="#{general.action}">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="st : ${shipTypes}" data-testid="ship-type-row" th:classappend="${st.hidden} ? 'sd-row--hidden' : ''">
                            <td>
                                <span class="cell-title" th:text="${st.name}">Name</span>
                                <span class="cell-sub" th:if="${st.manufacturer != null}" th:text="${st.manufacturer.abbreviation}">Hersteller</span>
                            </td>
                            <td th:attr="data-label=#{ship.shiptype.description}" th:text="${st.description}">Desc</td>
                            <td class="cell-actions" sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
                                <form th:action="@{/ship-data/ship-types/{id}/visibility(id=${st.id})}" method="post"
                                      class="js-visibility-toggle m-0"
                                      th:data-label-show="#{info.show}" th:data-label-hide="#{info.hide}">
                                    <input type="hidden" name="hidden" th:value="${!st.hidden}">
                                    <button type="submit" class="btn btn-ghost btn-xs" th:text="${st.hidden} ? #{info.show} : #{info.hide}">Ausblenden</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <th:block th:if="${error == null and #lists.isEmpty(shipTypes)}">
                <th:block th:replace="~{fragments/components :: emptyState(titleKey='shipdata.shipTypes.empty', textKey='shipdata.empty.text')}"></th:block>
            </th:block>
        </div>
    </section>

    <section class="sd-section" aria-labelledby="sd-manufacturers-title">
        <div class="split sd-section__head">
            <h2 id="sd-manufacturers-title" class="sd-section__title">
                <span th:text="#{ship.manufacturers}">Hersteller</span>
                <span class="chip chip--muted" data-testid="sd-manufacturers-count" th:text="${manufacturers != null ? #lists.size(manufacturers) : 0}">0</span>
            </h2>
            <div class="toolbar sd-toolbar">
                <div class="toolbar__search">
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-search"/></svg>
                    <input type="search" id="filterManufacturers" autocomplete="off" data-testid="toolbar-search-manufacturers"
                           data-trigger="filter-table" data-table-id="manufacturersTable"
                           th:attr="placeholder=#{general.filter.name.placeholder},aria-label=#{general.filter.name.placeholder}">
                </div>
                <datalist id="mfgNames-data" hidden>
                    <option th:each="m : ${manufacturers}" th:value="${m.name}"></option>
                </datalist>
            </div>
        </div>

        <div class="card card--flush">
            <div class="table-responsive" th:unless="${#lists.isEmpty(manufacturers)}">
                <table id="manufacturersTable" class="data-table data-table--stack">
                    <thead>
                        <tr>
                            <th th:text="#{ship.manufacturer.name}">Name</th>
                            <th th:text="#{ship.manufacturer.description}">Beschreibung</th>
                            <th class="cell-actions" sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)" th:text="#{general.action}">Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${manufacturers}" data-testid="manufacturer-row" th:classappend="${m.hidden} ? 'sd-row--hidden' : ''">
                            <td>
                                <span class="cell-title" th:text="${m.name}">Name</span>
                                <span class="cell-sub" th:text="${m.abbreviation}">Kürzel</span>
                            </td>
                            <td th:attr="data-label=#{ship.manufacturer.description}" th:text="${m.description}">Desc</td>
                            <td class="cell-actions" sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
                                <form th:action="@{/ship-data/manufacturers/{id}/visibility(id=${m.id})}" method="post"
                                      class="js-visibility-toggle m-0"
                                      th:data-label-show="#{info.show}" th:data-label-hide="#{info.hide}">
                                    <input type="hidden" name="hidden" th:value="${!m.hidden}">
                                    <button type="submit" class="btn btn-ghost btn-xs" th:text="${m.hidden} ? #{info.show} : #{info.hide}">Ausblenden</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <th:block th:if="${error == null and #lists.isEmpty(manufacturers)}">
                <th:block th:replace="~{fragments/components :: emptyState(titleKey='shipdata.manufacturers.empty', textKey='shipdata.empty.text')}"></th:block>
            </th:block>
        </div>
    </section>
</main>

<div sec:authorize="hasRole(T(de.greluc.krt.profit.basetool.frontend.kernel.security.Roles).ADMIN)">
    <th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='reset-fitted-confirm-modal', titleKey='hangar.ship.reset_fitted.confirm.title', variant='krt-modal--danger', closeTrigger='ship-close-modal', body=~{::reset-fitted-confirm-modal-body})}">
        <th:block th:ref="reset-fitted-confirm-modal-body">
            <div class="krt-modal-body">
                <p class="m-0" th:text="#{hangar.ship.reset_fitted.confirm.message}">Möchtest du wirklich alle Schiffe aller Spieler auf "nicht einsatzbereit" (unfitted) setzen?</p>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-trigger="ship-close-modal" data-modal-id="reset-fitted-confirm-modal" th:text="#{info.cancel}">Abbrechen</button>
                <button type="button" class="btn btn-danger" data-trigger="shipdata-reset" th:text="#{hangar.ship.reset_fitted.button}">Zurücksetzen</button>
            </div>
        </th:block>
    </th:block>
</div>

<script th:src="@{/js/autocomplete.js}" defer th:attr="nonce=${cspNonce}"></script>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    var shipDataI18n = {
        saved:        /*[[#{notification.success.save}]]*/ 'Gespeichert.',
        toggleError:  /*[[#{shipdata.toggle.error}]]*/ 'Sichtbarkeit konnte nicht geaendert werden.',
        resetSuccess: /*[[#{notification.success.ship_unfitted}]]*/ 'Alle Schiffe zurueckgesetzt.',
        resetError:   /*[[#{error.shipdata.unfit.failed}]]*/ 'Zuruecksetzen fehlgeschlagen.'
    };
    var shipDataConflict = {
        title:                /*[[#{frontend.ajax.conflict.title}]]*/ 'Konflikt',
        reloadDetailFallback: /*[[#{frontend.ajax.conflict.detail}]]*/ 'Bitte neu laden.',
        reloadLabel:          /*[[#{frontend.ajax.conflict.reload}]]*/ 'Aktuelle Werte laden',
        dismissLabel:         /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        reloadQuestion:       /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
    var shipDataResetUrl = /*[[@{/ship-data/reset-fitted}]]*/ '/ship-data/reset-fitted';
</script>
<script th:src="@{/js/ship-data.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
