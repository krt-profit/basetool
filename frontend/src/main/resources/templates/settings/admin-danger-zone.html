<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{kernel/fragments/layout :: page(pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageToast=true, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{admin.dangerZone.title} + ' - ' + ${appTitle}">Gefahrenzone - Profit Basetool</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/bank/bank.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
<main>
    <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='admin.dangerzone', eyebrowKey='nav.admin.group.system', titleText=#{admin.dangerZone.title})}"></th:block>

    <div th:if="${wipeResult != null}" class="alert alert-success" role="status" data-testid="bank-wipe-success"
         th:text="#{admin.bank.wipe.success(${wipeResult.accountsReset()}, ${wipeResult.holderStashesZeroed()})}">
        5 Konten und 12 Halter-Best&auml;nde auf 0 gesetzt.</div>
    <div th:if="${wipeNoop != null}" class="alert alert-info" role="status" data-testid="bank-wipe-noop"
         th:text="#{admin.bank.wipe.noop}">Alle Salden waren bereits 0 — nichts zu tun.</div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" data-testid="bank-wipe-error"
         th:text="#{${error}}">Fehler.</div>

    <th:block th:replace="~{bank/admin/bank-wipe-card :: card}"></th:block>
    <th:block th:replace="~{blueprint/admin/blueprint-purge-card :: card}"></th:block>
</main>
</th:block>
<th:block th:fragment="pageTail">
<script type="module" th:src="@{/js/bank/bank.js}" th:attr="nonce=${cspNonce}"></script>
<script type="module" th:src="@{/js/personalinventory/admin-personal-blueprints-purge.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
