<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<!--/* The stat modifiers of a slot or of the whole recipe, each with its quality slider or its value. */-->
<th:block th:fragment="stats(modifiers)">
    <span class="bp-stat" th:each="m : ${modifiers}">
        <span class="bp-stat-label" th:text="${m.label() != null ? m.label() : m.propertyKey()}">Stat</span>
        <span class="bp-stat-bw" th:if="${m.betterWhen() == 'higher'}" th:text="'(' + #{admin.blueprint.betterWhen.higher} + ')'">(h&ouml;her ist besser)</span>
        <span class="bp-stat-bw" th:if="${m.betterWhen() == 'lower'}" th:text="'(' + #{admin.blueprint.betterWhen.lower} + ')'">(niedriger ist besser)</span>
        <span class="bp-stat-bw" th:if="${m.betterWhen() == 'neutral'}" th:text="'(' + #{admin.blueprint.betterWhen.neutral} + ')'">(neutral)</span>

        <span class="bp-slider"
              th:if="${m.effectiveQualityMin() != null and m.effectiveQualityMax() != null and m.effectiveQualityMax() > m.effectiveQualityMin()}"
              th:attr="data-qmin=${m.effectiveQualityMin()},data-qmax=${m.effectiveQualityMax()},data-vmin=${m.modifierAtMinQuality()},data-vmax=${m.modifierAtMaxQuality()},data-vrt=${m.valueRangeType()},data-vkind=${m.valueKind()}">
            <span class="bp-seg" th:each="seg : ${m.segments()}"
                  th:attr="data-qmin=${seg.qualityMin()},data-qmax=${seg.qualityMax()},data-vstart=${seg.modifierAtStart()},data-vend=${seg.modifierAtEnd()}"></span>
            <span class="bp-slider-row">
                <span class="bp-slider-end" th:text="${#numbers.formatDecimal(m.effectiveQualityMin(),1,0,'DEFAULT')}">0</span>
                <input type="range" class="bp-range" step="1"
                       th:attr="min=${m.effectiveQualityMin()},max=${m.effectiveQualityMax()},value=${m.effectiveQualityMax()}">
                <span class="bp-slider-end bp-slider-end-max" th:text="${#numbers.formatDecimal(m.effectiveQualityMax(),1,0,'DEFAULT')}">1000</span>
            </span>
            <span class="bp-slider-out">
                <output class="bp-q">&ndash;</output>
                <span class="bp-slider-arrow">&rarr;</span>
                <output class="bp-out">&times;?</output>
            </span>
        </span>
        <span class="bp-dep"
              th:unless="${m.effectiveQualityMin() != null and m.effectiveQualityMax() != null and m.effectiveQualityMax() > m.effectiveQualityMin()}">
            <span class="bp-dep-val" th:if="${m.modifierAtMaxQuality() != null}"
                  th:text="${(m.valueKind() == 'ADDITIVE' ? (m.modifierAtMaxQuality() >= 0 ? '+' : '') : '×') + #numbers.formatDecimal(m.modifierAtMaxQuality(),1,2,'DEFAULT')}">&times;1.05</span>
            <span class="bp-empty-hint" th:unless="${m.modifierAtMaxQuality() != null}">&ndash;</span>
        </span>
    </span>
    <span class="bp-empty-hint" th:if="${#lists.isEmpty(modifiers)}">&ndash;</span>
</th:block>
</body>
</html>
