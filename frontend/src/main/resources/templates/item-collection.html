<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="#{item.collection.title} + ' - ' + ${appTitle}">Itemsammelübersicht - Profit Basetool</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/basetool-logo.svg}" alt="" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between">
        <h1 th:text="#{item.collection.title}" class="krtm-letter-spacing-0-08em-0157">Itemsammelübersicht</h1>
        <a th:href="@{/orders/{id}(id=${jobOrderId})}" class="btn btn-ghost krtm-min-height-44px-display-inline-flex-align-it-37c8" th:text="#{item.collection.back}">Zurück zum Auftrag</a>
    </div>

    <div class="hud-box mt-2" id="item-collection-results">
        <th:block th:fragment="collectionResults">
        <div th:if="${itemStock == null or itemStock.isEmpty()}" class="krtm-color-var-color-gray-2-font-family-lato-sans-9437" th:text="#{item.collection.empty}">
            Kein Item-Bestand für diesen Auftrag vorhanden.
        </div>

        <div th:unless="${itemStock == null or itemStock.isEmpty()}" class="table-responsive">
            <table class="data-table" id="item-collection-table">
                <thead>
                <tr>
                    <th th:text="#{item.collection.col.owner}">Besitzer</th>
                    <th th:text="#{item.collection.col.location}">Standort</th>
                    <th th:text="#{item.collection.col.item}">Item</th>
                    <th th:text="#{item.collection.col.quantity}">Menge</th>
                    <th th:text="#{item.collection.col.delivered}">Geliefert</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="group : ${itemStock}">
                <tr th:each="entry : ${group.entries}"
                    th:data-inventory-id="${entry.inventoryEntryId}"
                    th:data-version="${entry.version}"
                    th:data-amount="${entry.quantity}">
                    <td>
                        <select class="owner-select krt-select krtm-min-height-44px-width-100-min-width-140px-ba-ded1"
                                data-role="owner-select" data-krt-combobox="remote-users"
                                th:data-inventory-id="${entry.inventoryEntryId}">
                            <option th:if="${entry.ownerId != null}"
                                    th:value="${entry.ownerId}"
                                    th:selected="true"
                                    th:text="${entry.ownerName}"></option>
                            <option th:if="${entry.ownerId == null}" selected disabled>—</option>
                        </select>
                    </td>
                    <td>
                        <select class="location-select krt-select krtm-min-height-44px-width-100-min-width-140px-ba-ded1"
                                th:data-inventory-id="${entry.inventoryEntryId}">
                            <option th:if="${entry.locationId == null}" selected disabled>—</option>
                            <option th:each="loc : ${locations}"
                                    th:value="${loc.id}"
                                    th:text="${loc.name}"
                                    th:selected="${loc.id == entry.locationId}"></option>
                        </select>
                    </td>
                    <td th:text="${group.gameItem != null ? group.gameItem.name() : '-'}" class="krtm-font-family-lato-sans-serif-437e"></td>
                    <td class="krtm-font-family-lato-sans-serif-437e">
                        <span th:text="|${#numbers.formatInteger(entry.allocatedQuantity, 1)} #{material.quantity.piece}|">3 Stück</span>
                        <small th:if="${entry.quantity > entry.allocatedQuantity}"
                               class="text-muted"
                               th:text="#{item.collection.quantity.ofStock(${#numbers.formatInteger(entry.quantity, 1)})}">von 10 im Bestand</small>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               class="delivered-checkbox krtm-width-22px-height-22px-cursor-pointer-accent-b072"
                               th:data-inventory-id="${entry.inventoryEntryId}"
                               th:data-job-order-id="${jobOrderId}"
                               th:checked="${entry.delivered}">
                    </td>
                </tr>
                </th:block>
                </tbody>
            </table>
        </div>
        </th:block>
    </div>
</main>

<link rel="stylesheet" th:href="@{/css/pages/item-collection.css}">

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const MSG_OWNER_UPDATED   = /*[[#{item.collection.toast.ownerUpdated}]]*/ 'Besitzer aktualisiert.';
    const MSG_LOCATION_UPDATED = /*[[#{item.collection.toast.locationUpdated}]]*/ 'Standort aktualisiert.';
    const MSG_DELIVERED_UPDATED = /*[[#{item.collection.toast.deliveredUpdated}]]*/ 'Lieferstatus aktualisiert.';
    const MSG_ERROR_GENERIC   = /*[[#{item.collection.toast.error}]]*/ 'Fehler beim Speichern.';
    window.orderId = /*[[${jobOrderId}]]*/ null;
</script>
<script th:src="@{/js/item-collection.js}" defer th:attr="nonce=${cspNonce}"></script>

<th:block th:replace="~{fragments/toast :: toast}" />
</body>
</html>
