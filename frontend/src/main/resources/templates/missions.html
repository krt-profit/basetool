<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="#{missions.title} + ' - ' + ${appTitle}">Missions - Profit Basetool</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />
<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.mission_planning', titleText=#{missions.title},
        count=${missionsPage != null ? missionsPage.totalElements() : null}, countId='missions-count', countFor='missions-results', actions=~{::missions-actions})}">
        <th:block th:ref="missions-actions">
            <a sec:authorize="isAuthenticated()" th:href="@{/missions/new}" class="btn btn--cta"
               data-testid="missions-create-link" th:text="#{mission.create}">Create New</a>
        </th:block>
    </th:block>

    <form id="missions-filter-form" method="get" th:action="@{/missions}" class="no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('mission-search', 'search', ${search}, 'mission.search.placeholder')}"></th:block>
            <th:block th:replace="~{fragments/components :: segmented(name='period', labelKey='mission.period.label', selected=${period},
                options=${ {{value: 'UPCOMING', labelKey: 'mission.period.upcoming'}, {value: 'PAST', labelKey: 'mission.period.past'}, {value: 'ALL', labelKey: 'filter.all'}} })}"></th:block>
            <th:block th:replace="~{fragments/components :: filterPopover(panelId='missions-filter-panel', panelName='missions',
                testid='missions-filter-toggle', body=~{::missions-filter-body})}">
                <th:block th:ref="missions-filter-body">
                    <div class="datetime-split-group">
                        <label for="mission-start" th:text="#{mission.filter.start}">From</label>
                        <input type="hidden" name="start" id="mission-start" th:value="${start}" data-chip-format="datetime" th:attr="data-chip-label=#{mission.filter.start}">
                        <div class="datetime-split-inputs">
                            <input type="date" class="date-part" th:aria-label="#{a11y.datetime.date}">
                            <input type="time" class="time-part" th:aria-label="#{a11y.datetime.time}">
                        </div>
                    </div>
                    <div class="datetime-split-group" th:attr="data-validate-after='mission-start', data-error-after=#{validation.datetime.after}">
                        <label for="mission-end" th:text="#{mission.filter.end}">To</label>
                        <input type="hidden" name="end" id="mission-end" th:value="${end}" data-chip-format="datetime" th:attr="data-chip-label=#{mission.filter.end}">
                        <div class="datetime-split-inputs">
                            <input type="date" class="date-part" th:aria-label="#{a11y.datetime.date}">
                            <input type="time" class="time-part" th:aria-label="#{a11y.datetime.time}">
                        </div>
                    </div>
                    <button type="button" id="missions-filter-reset" class="btn btn-ghost btn-sm" th:text="#{general.reset}">Zurücksetzen</button>
                </th:block>
            </th:block>
            <span id="missions-loading-indicator" hidden><span class="krt-loading-indicator"></span></span>
        </div>
        <th:block th:replace="~{fragments/components :: filterChips('missions-filter-form')}"></th:block>
    </form>

    <div id="missions-results" class="card card--flush">
        <th:block th:fragment="missionsResults">
        <table th:if="${missions != null and !missions.isEmpty()}" class="data-table data-table--stack">
            <thead>
                <tr>
                    <th th:text="#{mission.name}">Name</th>
                    <th class="cell-status" th:text="#{mission.status}">Status</th>
                    <th th:text="#{mission.planned_start}">Planned Start</th>
                    <th th:if="${isAllSquadronsMode}" th:text="#{mission.owning_squadron}">Staffel</th>
                    <th class="num" th:text="#{mission.list.registeredHeader}">Angemeldet</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{general.open}">Open</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${missions}" data-testid="mission-row"
                    th:with="days=${@relativeDays.days(m.plannedStartTime)}">
                    <td>
                        <a class="row-link" data-testid="row-link" th:href="@{/missions/{id}(id=${m.id})}">
                            <span class="cell-title" th:text="${m.name}">Name</span>
                            <span class="cell-sub" th:if="${m.meetingPoint != null and !#strings.isEmpty(m.meetingPoint)}"
                                  th:text="#{mission.meeting_point} + ': ' + ${m.meetingPoint}">Treffpunkt</span>
                        </a>
                    </td>
                    <td class="cell-status">
                        <span class="status-pill" th:classappend="${'status-' + #strings.toLowerCase(m.status)}"
                              th:text="#{${'mission.status.' + #strings.toLowerCase(m.status)}}">Status</span>
                    </td>
                    <td>
                        <span class="cell-title utc-time" data-format="short" th:text="${m.plannedStartTime}">Start</span>
                        <span class="cell-sub" th:if="${days != null}"
                              th:text="${m.status == 'ACTIVE'} ? #{list.relative.running}
                                       : (${days == 0} ? #{list.relative.today}
                                       : (${days > 0} ? #{list.relative.inDays(${days})} : #{list.relative.daysAgo(${-days})}))">in 5 Tagen</span>
                    </td>
                    <td th:if="${isAllSquadronsMode}" th:attr="data-label=#{mission.owning_squadron}">
                        <span th:if="${m.owningSquadron != null}" class="squadron-badge"
                              th:title="${m.owningSquadron.name()}"
                              th:text="${m.owningSquadron.shorthand()}">IRI</span>
                        <span th:if="${m.owningSquadron == null}" class="squadron-badge squadron-badge-muted">&mdash;</span>
                    </td>
                    <td class="num" th:text="#{mission.list.registered(${m.registeredCount})}">6 angemeldet</td>
                    <td class="cell-actions"><svg class="row-chevron" aria-hidden="true"><use href="#krt-icon-chevron-right"/></svg></td>
                </tr>
            </tbody>
        </table>

        <th:block th:if="${missions == null or missions.isEmpty()}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='mission.empty', textKey='mission.empty.text')}"></th:block>
        </th:block>

        <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${missionsPage}, baseUrl='/missions')}"></th:block>
        </th:block>
    </div>
</main>
<script th:src="@{/js/missions.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
