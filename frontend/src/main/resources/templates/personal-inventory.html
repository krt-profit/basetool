<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{::extraLinks})}">
    <title th:text="#{personalInventory.title}">Persoenliches Inventar</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/personal-inventory.css}">
    </th:block>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<th:block th:replace="~{fragments/header :: header}" />

<main>
    <th:block th:replace="~{fragments/page-head :: pageHead(eyebrowKey='nav.section.personal', titleText=#{nav.personal.items}, actions=~{::pi-actions})}">
        <th:block th:ref="pi-actions">
            <button type="button" class="btn btn--cta krt-pi-create" data-testid="page-head-primary"
                    data-trigger="pi-open-create"
                    th:attr="data-action=@{/personal-inventory/add}">
                <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-plus"/></svg>
                <span th:text="#{personalInventory.action.create}">Eintrag anlegen</span>
            </button>
        </th:block>
    </th:block>

    <nav class="tab-nav krt-pi-tabs-nav" th:aria-label="#{nav.personal.items}">
        <a th:href="@{/personal-inventory}" class="tab active" aria-current="page">
            <span th:text="#{personalInventory.tab.items}">Items</span>
            <span class="tab-count" th:text="${page != null ? page.totalElements() : items.size()}">42</span>
        </a>
        <a th:href="@{/personal-inventory/blueprints}" class="tab">
            <span th:text="#{personalInventory.tab.blueprints}">Blueprints</span>
            <span class="tab-count" th:if="${blueprintCount != null}" th:text="${blueprintCount}">42</span>
        </a>
    </nav>

    <form id="pi-filter-form" th:action="@{/personal-inventory}" method="get" class="krt-pi-filter no-track">
        <div class="toolbar">
            <th:block th:replace="~{fragments/components :: toolbarSearch('krt-pi-q', 'q', ${filterQuery}, 'personalInventory.filter.searchPlaceholder')}"></th:block>
        </div>
    </form>

    <div id="pi-results" class="card card--flush">
    <th:block th:fragment="results">
        <span id="pi-total-meta" hidden
              th:attr="data-total=${page != null ? page.totalElements() : items.size()}"></span>

        <th:block th:if="${#lists.isEmpty(items)}">
            <th:block th:replace="~{fragments/components :: emptyState(titleKey='personalInventory.collection.emptyTitle', textKey='personalInventory.empty', filterHintKey='personalInventory.collection.emptyFilterHint')}"></th:block>
        </th:block>

        <div class="table-responsive" th:unless="${#lists.isEmpty(items)}">
            <table class="data-table data-table--stack krt-pi-table">
                <thead>
                <tr>
                    <th th:text="#{personalInventory.field.name}">Name</th>
                    <th th:text="#{personalInventory.field.location}">Ort</th>
                    <th class="num" th:text="#{personalInventory.field.quantity}">Menge</th>
                    <th th:text="#{personalInventory.field.note}">Notiz</th>
                    <th class="cell-actions"><span class="visually-hidden" th:text="#{personalInventory.field.actions}">Aktionen</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}" th:attr="data-item-id=${item.id}">
                    <td><span class="cell-title" th:text="${item.name}">Name</span></td>
                    <td th:attr="data-label=#{personalInventory.field.location}">
                        <span class="krt-pi-location-marker"
                              th:classappend="${item.locationType?.name() == 'CITY'} ? ' krt-pi-loc-city' : ' krt-pi-loc-station'"></span>
                        <span th:text="${item.locationName}">Ort</span>
                    </td>
                    <td class="num" th:attr="data-label=#{personalInventory.field.quantity}" th:text="${item.quantity}">1</td>
                    <td class="krt-pi-note" th:attr="data-label=#{personalInventory.field.note}" th:text="${item.note}">Notiz</td>
                    <td class="cell-actions">
                        <button type="button" class="btn btn-ghost btn-icon"
                                data-trigger="pi-open-edit"
                                th:attr="data-action=@{'/personal-inventory/' + ${item.id} + '/update'},
                                         data-id=${item.id},
                                         data-version=${item.version},
                                         data-name=${item.name},
                                         data-note=${item.note},
                                         data-quantity=${item.quantity},
                                         data-location-uex-id=${item.locationUexId},
                                         data-location-type=${item.locationType?.name()},
                                         data-location-name=${item.locationName}"
                                th:title="#{personalInventory.action.edit}"
                                th:aria-label="#{personalInventory.action.edit}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-edit"/></svg></button>
                        <button type="button" class="btn btn-quiet-danger btn-icon"
                                data-trigger="pi-open-delete"
                                th:attr="data-action=@{'/personal-inventory/' + ${item.id} + '/delete'},
                                         data-name=${item.name}"
                                th:title="#{personalInventory.action.delete}"
                                th:aria-label="#{personalInventory.action.delete}"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block th:with="piBase=${#strings.isEmpty(filterQuery) ? '/personal-inventory' : '/personal-inventory?q=' + #uris.escapeQueryParam(filterQuery)}">
            <th:block th:replace="~{fragments/components :: listFoot(pageResponse=${page}, baseUrl=${piBase})}"></th:block>
        </th:block>
    </th:block>
    </div>
</main>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='krt-pi-modal', titleKey='personalInventory.modal.create.title', variant='krt-modal--wide', titleId='krt-pi-modal-title', open=${showItemModal != null}, closeTrigger='pi-close-modal', body=~{::krt-pi-modal-body})}">
    <th:block th:ref="krt-pi-modal-body">

        <form id="krt-pi-form"
              th:action="${modalAction != null ? modalAction : '/personal-inventory/add'}"
              method="post"
              th:object="${personalInventoryForm}">
            <div class="krt-modal-body">
                <div th:if="${#fields.hasErrors('*')}" class="krt-pi-error-box">
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Fehler</li>
                    </ul>
                </div>

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{version}">
                <input type="hidden" id="krt-pi-location-uex-id" th:field="*{locationUexId}">
                <input type="hidden" id="krt-pi-location-type" th:field="*{locationType}">

                <div class="form-group">
                    <label for="krt-pi-name" th:text="#{personalInventory.field.name}">Name</label>
                    <input id="krt-pi-name" type="text" maxlength="120" required th:field="*{name}">
                </div>

                <div class="form-group">
                    <label for="krt-pi-quantity" th:text="#{personalInventory.field.quantity}">Menge</label>
                    <input id="krt-pi-quantity" type="number" min="1" step="1" inputmode="numeric"
                           pattern="[0-9]*" required th:field="*{quantity}"
                           data-trigger="pi-sanitize-quantity">
                </div>

                <div class="form-group krt-pi-typeahead">
                    <label for="krt-pi-location-search" th:text="#{personalInventory.field.location}">Ort</label>
                    <input id="krt-pi-location-search" type="text" autocomplete="off"
                           th:value="${personalInventoryForm.locationName}"
                           th:placeholder="#{personalInventory.field.location.placeholder}">
                    <div id="krt-pi-location-results" class="krt-pi-typeahead-results" hidden></div>
                </div>

                <div class="form-group krt-pi-note-group">
                    <label for="krt-pi-note" th:text="#{personalInventory.field.note}">Notiz</label>
                    <textarea id="krt-pi-note" maxlength="2000" rows="4" th:field="*{note}"></textarea>
                </div>
            </div>
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-trigger="pi-close-modal" th:text="#{personalInventory.action.cancel}">Abbrechen</button>
                <button type="submit" class="btn btn--cta"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-save"/></svg> <span th:text="#{personalInventory.action.save}">Speichern</span></button>
            </div>
        </form>
    </th:block>
</th:block>

<th:block th:replace="~{fragments/modal-wrapper :: modal(modalId='krt-pi-delete-modal', titleKey='personalInventory.action.delete.confirm.title', variant='krt-modal--danger', closeTrigger='pi-close-delete', body=~{::krt-pi-delete-modal-body})}">
    <th:block th:ref="krt-pi-delete-modal-body">
        <div class="krt-modal-body">
            <p id="krt-pi-delete-message" class="m-0" th:text="#{personalInventory.action.delete.confirm.body}">Wirklich loeschen?</p>
        </div>
        <form id="krt-pi-delete-form" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="krt-modal-foot">
                <button type="button" class="btn btn-ghost" data-trigger="pi-close-delete" th:text="#{personalInventory.action.cancel}">Abbrechen</button>
                <button type="submit" class="btn btn-danger"><svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-trash"/></svg> <span th:text="#{personalInventory.action.delete.confirm.ok}">L&ouml;schen</span></button>
            </div>
        </form>
    </th:block>
</th:block>

<th:block th:replace="~{fragments/toast :: toast}" />
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    window.krtPersonalInventoryI18n = {
        createTitle: /*[[#{personalInventory.modal.create.title}]]*/ 'Eintrag anlegen',
        editTitle:   /*[[#{personalInventory.modal.edit.title}]]*/   'Eintrag bearbeiten',
        confirmBody: /*[[#{personalInventory.action.delete.confirm.body}]]*/ 'Wirklich loeschen?',
        searching:   /*[[#{personalInventory.field.location.searching}]]*/   'Suche...',
        noResults:   /*[[#{personalInventory.field.location.empty}]]*/       'Keine Treffer',
        moreResults: /*[[#{personalInventory.field.location.more}]]*/        'Weitere Treffer vorhanden - Suche verfeinern',
        created:     /*[[#{personalInventory.toast.created}]]*/   'Eintrag angelegt.',
        updated:     /*[[#{personalInventory.toast.updated}]]*/   'Eintrag aktualisiert.',
        deleted:     /*[[#{personalInventory.toast.deleted}]]*/   'Eintrag geloescht.',
        errorCreate: /*[[#{personalInventory.error.create}]]*/    'Anlegen fehlgeschlagen.',
        errorUpdate: /*[[#{personalInventory.error.update}]]*/    'Aktualisieren fehlgeschlagen.',
        errorDelete: /*[[#{personalInventory.error.delete}]]*/    'Loeschen fehlgeschlagen.',
        locationRequired: /*[[#{personalInventory.validation.location.required}]]*/ 'Bitte einen Ort waehlen.',
        conflictTitle:    /*[[#{frontend.ajax.conflict.title}]]*/  'Konflikt',
        conflictDetail:   /*[[#{frontend.ajax.conflict.detail}]]*/ 'Bitte neu laden.',
        conflictReload:   /*[[#{frontend.ajax.conflict.reload}]]*/ 'Aktuelle Werte laden',
        conflictDismiss:  /*[[#{frontend.ajax.conflict.dismiss}]]*/ 'Schliessen',
        conflictQuestion: /*[[#{frontend.ajax.conflict.question}]]*/ 'Aktuelle Werte laden?'
    };
    window.krtPersonalInventoryEndpoints = {
        uexSearch: /*[[@{/personal-inventory/uex-search}]]*/ '/personal-inventory/uex-search'
    };
</script>
<script th:src="@{/js/personal-inventory.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
