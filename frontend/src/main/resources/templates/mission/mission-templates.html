<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{kernel/fragments/layout :: page(
    pageTitle=~{::title}, pageLinks=~{::extraLinks}, pageContent=~{::pageContent}, pageTail=~{::pageTail})}">
<head>
    <title th:text="#{nav.page.missionTemplates} + ' - ' + ${appTitle}">Missionsvorlagen</title>
    <th:block th:fragment="extraLinks">
        <link rel="stylesheet" th:href="@{/css/pages/mission/mission-templates.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="pageContent">
    <main>
        <th:block th:replace="~{kernel/fragments/page-head :: pageHead(tabsKey='missions.templates',
            eyebrowKey='nav.group.operations', titleText=#{nav.page.missionTemplates}, actions=~{::template-actions})}">
            <th:block th:ref="template-actions">
                <button th:if="${ownerId != null}" type="button" class="btn btn--cta" data-testid="mission-template-create">
                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-plus"/></svg>
                    <span th:text="#{missionTemplate.create}">Neue Vorlage</span>
                </button>
            </th:block>
        </th:block>
        <section class="list-panel" th:if="${ownerId == null}">
            <p th:text="#{missionTemplate.noOwners}">Keine Org-Einheit</p>
        </section>
        <section class="list-panel" th:if="${ownerId != null}" id="mission-template-workspace"
                 th:attr="data-list-url=@{/mission-templates/list},data-templates-url=@{/mission-templates},
                     data-template-draft=${templateDraft},
                     data-load-error=#{missionTemplate.error.load},data-list-error=#{missionTemplate.error.list},
                     data-save-error=#{missionTemplate.error.save},data-delete-error=#{missionTemplate.error.delete},
                     data-duplicate-error=#{missionTemplate.error.duplicate},data-revision-error=#{missionTemplate.error.revision},
                     data-delete-confirm=#{missionTemplate.delete.confirm},data-delete-label=#{general.delete},
                     data-cancel-label=#{general.cancel},data-discard-confirm=#{missionTemplate.discard.confirm}">
            <div class="toolbar">
                <label for="mission-template-scope" th:text="#{missionTemplate.owner}">Zuständige Org-Einheit</label>
                <select id="mission-template-scope">
                    <option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.name}"
                            th:selected="${owner.id == ownerId}">Staffel</option>
                </select>
            </div>
            <div id="mission-template-list" tabindex="-1" aria-live="polite">
                <div th:fragment="list" th:attr="data-template-page=${templatePage != null ? templatePage.page() : 0}">
                <table class="data-table" th:unless="${#lists.isEmpty(templates)}">
                    <thead>
                        <tr>
                            <th scope="col" th:text="#{general.name}">Name</th>
                            <th scope="col" class="actions-col"><span class="sr-only" th:text="#{general.actions}">Aktionen</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${templates}">
                            <td th:text="${entry.name}">Vorlage</td>
                            <td class="actions-col">
                                <button type="button" class="btn btn-ghost btn-icon" data-template-edit
                                        th:attr="data-template-id=${entry.id}" th:aria-label="#{missionTemplate.edit}"
                                        th:title="#{missionTemplate.edit}">
                                    <svg class="krt-icon" aria-hidden="true"><use href="#krt-icon-edit"/></svg>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p th:if="${#lists.isEmpty(templates)}" th:text="#{missionTemplate.empty}">Keine Missionsvorlagen</p>
                <nav th:replace="~{kernel/fragments/pagination :: pagination(pageResponse=${templatePage},
                        baseUrl=@{/mission-templates/list(ownerId=${ownerId})})}"></nav>
                </div>
            </div>
            <p hidden role="alert" id="mission-template-list-error" class="mission-template-error"></p>
        </section>
        <th:block th:if="${ownerId != null}">
            <th:block th:replace="~{mission/fragments/mission-template-editor :: editor}"></th:block>
        </th:block>
    </main>
</th:block>
<th:block th:fragment="pageTail">
    <script type="module" th:src="@{/js/mission/mission-templates.js}" th:attr="nonce=${cspNonce}"></script>
</th:block>
</body>
</html>
