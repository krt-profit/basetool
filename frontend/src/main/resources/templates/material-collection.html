<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}" lang="de">
<head th:replace="~{fragments/head :: head(titleContent=~{::title}, additionalLinks=~{})}">
    <title th:text="#{material.collection.title} + ' - ' + ${appTitle}">Materialsammelübersicht - Profit Basetool</title>
</head>
<body>
<th:block th:replace="~{fragments/sidebar :: sidebar}" />

<header>
    <nav>
        <button id="hamburger" class="hamburger-btn" type="button" th:aria-label="#{a11y.nav.menu}">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a th:href="@{/}" class="brand">
            <img th:src="@{/logos/krt.webp}" alt="Logo" height="50">
            <span class="logo-text" th:text="${appTitle}">Profit Basetool</span>
        </a>
    </nav>
</header>

<main>
    <div class="greeting hud-box flex-between krtm-flex-wrap-wrap-gap-1rem-659b">
        <h1 th:text="#{material.collection.title}" class="krtm-letter-spacing-0-08em-0157">Materialsammelübersicht</h1>
        <a th:href="@{/orders/{id}(id=${jobOrderId})}" class="btn btn-ghost krtm-min-height-44px-display-inline-flex-align-it-37c8" th:text="#{material.collection.back}">Zurück zum Auftrag</a>
    </div>

    <div class="hud-box mt-2" id="material-collection-results">
        <th:block th:fragment="collectionResults">
        <div th:if="${entries == null or entries.isEmpty()}" class="krtm-color-var-color-gray-2-font-family-lato-sans-9437" th:text="#{material.collection.empty}">
            Keine Lagereinträge für diesen Auftrag vorhanden.
        </div>

        <div th:unless="${entries == null or entries.isEmpty()}" class="table-responsive">
            <table class="data-table" id="material-collection-table">
                <thead>
                <tr>
                    <th th:text="#{material.collection.col.owner}">Besitzer</th>
                    <th th:text="#{material.collection.col.location}">Standort</th>
                    <th th:text="#{material.collection.col.material}">Material</th>
                    <th th:text="#{material.collection.col.quality}">Qualität</th>
                    <th th:text="#{material.collection.col.quantity}">Menge</th>
                    <th th:text="#{material.collection.col.delivered}">Geliefert</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${entries}"
                    th:data-inventory-id="${entry.inventoryEntryId}"
                    th:data-version="${entry.version}"
                    th:data-amount="${entry.quantity}">
                    <td>
                        <!-- Server-side searchable combobox (remote-users, #1193): seed only this
                             entry's current owner; the roster is searched on demand. -->
                        <select class="owner-select krt-select krtm-min-height-44px-width-100-min-width-140px-ba-ded1"
                                data-role="owner-select" data-krt-combobox="remote-users"
                                th:data-inventory-id="${entry.inventoryEntryId}">
                            <option th:if="${entry.ownerId != null}"
                                    th:value="${entry.ownerId}"
                                    th:selected="true"
                                    th:text="${entry.ownerName}"></option>
                            <!-- Owner is blanked by the backend for a requesting-side viewer of an
                                 SK-public order (REQ-ORDERS-029); show a dash placeholder. -->
                            <option th:if="${entry.ownerId == null}" selected disabled>—</option>
                        </select>
                    </td>
                    <td>
                        <select class="location-select krt-select krtm-min-height-44px-width-100-min-width-140px-ba-ded1"
                                th:data-inventory-id="${entry.inventoryEntryId}">
                            <!-- Location is blanked by the backend for a requesting-side viewer of an
                                 SK-public order (REQ-ORDERS-029); a dash placeholder stays selected so
                                 the redacted row does not default-select an arbitrary location. -->
                            <option th:if="${entry.locationId == null}" selected disabled>—</option>
                            <option th:each="loc : ${locations}"
                                    th:value="${loc.id}"
                                    th:text="${loc.name}"
                                    th:selected="${loc.id == entry.locationId}"></option>
                        </select>
                    </td>
                    <td th:text="${entry.materialName}" class="krtm-font-family-lato-sans-serif-437e"></td>
                    <td th:text="${entry.quality}" class="krtm-font-family-lato-sans-serif-437e"></td>
                    <td class="krtm-font-family-lato-sans-serif-437e">
                        <span th:text="${entry.allocatedQuantity}">3</span>
                        <small th:if="${entry.quantity > entry.allocatedQuantity}"
                               class="text-muted"
                               th:text="#{material.collection.quantity.ofStock(${entry.quantity})}">von 10 im Bestand</small>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               class="delivered-checkbox krtm-width-22px-height-22px-cursor-pointer-accent-b072"
                               th:data-inventory-id="${entry.inventoryEntryId}"
                               th:data-job-order-id="${jobOrderId}"
                               th:checked="${entry.delivered}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </th:block>
    </div>
</main>

<style th:attr="nonce=${cspNonce}">
    .krt-select:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 1px;
    }
    @media (max-width: 768px) {
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
</style>

<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    // Thymeleaf-interpolated toast strings only; the imperative logic lives in the
    // material-collection.js page module loaded immediately after this bootstrap (ADR-0069).
    /*<![CDATA[*/
    const MSG_OWNER_UPDATED   = /*[[#{material.collection.toast.ownerUpdated}]]*/ 'Besitzer aktualisiert.';
    const MSG_LOCATION_UPDATED = /*[[#{material.collection.toast.locationUpdated}]]*/ 'Standort aktualisiert.';
    const MSG_DELIVERED_UPDATED = /*[[#{material.collection.toast.deliveredUpdated}]]*/ 'Lieferstatus aktualisiert.';
    const MSG_ERROR_GENERIC   = /*[[#{material.collection.toast.error}]]*/ 'Fehler beim Speichern.';
    // REQ-FE-010: keys the order:{id} live-sync room this page's module joins.
    window.orderId = /*[[${jobOrderId}]]*/ null;
    /*]]>*/
</script>
<script th:src="@{/js/material-collection.js}" th:attr="nonce=${cspNonce}"></script>

<th:block th:replace="~{fragments/toast :: toast}" />
</body>
</html>
