server:
  ssl:
    enabled: false
    key-store-password: test-keystore-password
spring:
  session:
    store-type: none
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: test-client
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: http://keycloak.example.com/realms/test

spring.thymeleaf.cache: false

app:
  backend-url: http://backend:11261

resilience4j:
  spring:
    boot:
      verifier:
        enabled: false

management:
  health:
    backend:
      enabled: false
    keycloak:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState, diskSpace
