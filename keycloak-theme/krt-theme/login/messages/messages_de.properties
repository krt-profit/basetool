# Login-theme message overrides for the krt-theme (epic #720, Discord login).
# Keycloak merges these with the parent (keycloak) theme's login messages.
discordMembershipDenied=Anmeldung abgelehnt. Du musst ein verifiziertes Mitglied von DAS KARTELL sein - im das-kartell Discord und mit der Rolle KRT-Mitglied -, um dich mit Discord anzumelden.
discordAccountAlreadyExists=Anmeldung abgelehnt. Es existiert bereits ein Konto mit diesem Benutzernamen oder Server-Nicknamen. Wenn es dein Konto ist, verbinde es in den Kontoeinstellungen mit Discord, anstatt dich neu zu registrieren. Andernfalls wende dich an einen Admin.
# Replaces Keycloak's cookie_not_found text (REQ-SEC-071). The login returned to a browser that holds
# none of Keycloak's login cookies - most often a Discord login that Discord finished in its own app
# or another browser. Keycloak's own text blames disabled cookies only. The quoted label is the
# parent theme's backToApplication link, which renders once basetool-frontend has a baseUrl.
cookieNotFoundMessage=Die Anmeldung konnte nicht abgeschlossen werden, weil dieser Browser den begonnenen Anmeldevorgang nicht kennt. Das passiert, wenn eine Anmelde-Seite in einer anderen App oder einem anderen Browser zu Ende gebracht wird, als in dem sie begonnen wurde - zum Beispiel wenn Discord die Anmeldung in der Discord-App oder einem anderen Browser \u00f6ffnet -, wenn eine alte Anmelde-Seite erneut aufgerufen wird oder wenn Cookies blockiert sind. Klicke auf "Zur\u00fcck zur Applikation" und melde dich erneut an, und zwar vollst\u00e4ndig im selben Browser.
