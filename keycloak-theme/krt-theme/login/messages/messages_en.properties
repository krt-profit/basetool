# Login-theme message overrides for the krt-theme (epic #720, Discord login).
# Keycloak merges these with the parent (keycloak) theme's login messages.
discordMembershipDenied=Login denied. You must be a verified DAS KARTELL member - in the das-kartell Discord and holding the KRT-Mitglied role - to sign in with Discord.
discordAccountAlreadyExists=Login denied. An account with this username or server nickname already exists. If it is yours, link it to Discord in your account settings instead of registering again. Otherwise, contact an admin.
# Replaces Keycloak's cookie_not_found text (REQ-SEC-071). The login returned to a browser that holds
# none of Keycloak's login cookies - most often a Discord login that Discord finished in its own app
# or another browser. Keycloak's own text blames disabled cookies only. The quoted label is the
# parent theme's backToApplication link, which renders once basetool-frontend has a baseUrl.
cookieNotFoundMessage=The sign-in could not be completed because this browser does not know the sign-in that was started. This happens when a sign-in page is finished in a different app or browser than the one it was started in - for example when Discord opens the sign-in in the Discord app or another browser -, when an old sign-in page is opened again, or when cookies are blocked. Click "Back to Application" and sign in again, completing every step in the same browser.
