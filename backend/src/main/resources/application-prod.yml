spring:
  datasource:
    url: jdbc:postgresql://db-backend:15432/krt_basetool
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://profit-base.online/auth/realms/iri}
  ssl:
    bundle:
      jks:
        keycloak-trust:
          truststore:
            location: ${INTERNAL_TLS_TRUSTSTORE:${SERVER_SSL_KEY_STORE:classpath:keystore.p12}}
            password: ${INTERNAL_TLS_TRUSTSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD}}
            type: PKCS12
server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false

management:
  server:
    port: 11271
    ssl:
      enabled: true
      key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
      key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
      key-store-type: PKCS12
      key-alias: basetool
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

app:
  notifications:
    redis-fanout:
      enabled: ${APP_NOTIFICATIONS_REDIS_FANOUT_ENABLED:true}
  live-sync:
    redis-fanout:
      enabled: ${APP_LIVE_SYNC_REDIS_FANOUT_ENABLED:true}
  logging:
    structured-enabled: true
  rate-limit:
    trusted-proxies:
      - 172.28.0.0/16
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
      expected-audiences: ${APP_SECURITY_JWT_EXPECTED_AUDIENCES:}

krt:
  scwiki:
    scheduler-enabled: true
    commodity-sync-enabled: true
    vehicle-sync-enabled: true
    item-sync-enabled: true
    blueprint-sync-enabled: true
    manufacturer-sync-enabled: true
    sync-all-items: true
    reconcile-uuidless-by-name: true
