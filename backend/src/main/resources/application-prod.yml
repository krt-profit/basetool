# ===================================================================
# Production Configuration for Backend
#
# JVM Tuning Recommendations (apply via JAVA_TOOL_OPTIONS in Docker):
#   -XX:+UseContainerSupport
#   -XX:MaxRAMPercentage=75.0
#   -XX:InitialRAMPercentage=50.0
#   -XX:+HeapDumpOnOutOfMemoryError
#   -XX:HeapDumpPath=/tmp/heapdump.hprof
# ===================================================================
spring:
  datasource:
    url: jdbc:postgresql://db-backend:15432/krt_basetool
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Production pool sizing — raised from the previous 10/30000 ms defaults after the
      # performance audit (H-5). Resilience4j's bulkhead caps fan-out at 100 concurrent
      # backend calls (see frontend application.yml) and Tomcat now runs virtual threads,
      # so 10 JDBC connections starved the pool under ~10 concurrent users. Raised 15 -> 100
      # to fully match the 100-slot frontend bulkhead, so even a worst-case multi-user
      # mission-page live-update refetch burst never queues on the DB funnel -> 500 ->
      # shared-breaker outage (mission-scale hardening, ADR-0078). This requires the
      # matching infra change: db-backend Postgres now runs max_connections=150 with a
      # 1536M RAM limit (docker-compose.yml), so 100 app connections + postgres_exporter +
      # Flyway + admin sessions all fit with headroom and cannot exhaust the server or OOM
      # the container. The complementary defences are cutting the per-fragment read fan-out
      # (the primary fix) and the finance-summary SQL aggregate that stops a 1000-row load-
      # all from pinning a connection per render. connection-timeout 5 s (was 10 s): aligned
      # with the frontend caller's real patience -- the backendApi Resilience4j TimeLimiter
      # cancels the exchange at 5 s, so a request that cannot get a JDBC connection inside that
      # window must fail fast (5xx) rather than acquire a slot 5 s later and run its query as an
      # orphan for a client that already gave up, deepening the pool pressure under saturation.
      maximum-pool-size: 100
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # The Redis connection for the notification SSE fan-out (ADR-0093) now lives in the base
  # application.yml (host from REDIS_HOST, which the compose anchor sets to the `redis` service). Prod
  # only flips the fan-out and the Redis health indicator ON (below); the connection config is shared.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.profit-base.online/realms/iri}
  # Truststore for the internal Keycloak Admin API call (KeycloakService / the scheduled user sync).
  # In prod the backend reaches Keycloak directly over https://keycloak:18443 (net-backend-keycloak),
  # and Keycloak presents the same bind-mounted self-signed keystore.p12 the other modules use. By
  # pinning that cert as the only trust anchor, the admin client validates the connection without the
  # InsecureTrustManagerFactory (mirrors the frontend's `backend-trust` bundle, audit finding M-13).
  # Hostname verification stays ON, so the cert's SAN must carry `dns:keycloak`. If this bundle is
  # absent (dev/test, or an operator fronting Keycloak with a publicly-trusted cert) KeycloakService
  # falls back to the default JVM trust store / plain HTTP.
  ssl:
    bundle:
      jks:
        keycloak-trust:
          truststore:
            location: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
            password: ${SERVER_SSL_KEY_STORE_PASSWORD}
            type: PKCS12
server:
  shutdown: graceful

# Swagger UI has been removed project-wide (springdoc -api starter). In production the raw OpenAPI
# document is additionally disabled so the API surface is never enumerable from outside a deployed
# environment — the committed backend/src/main/resources/api/openapi.json (regenerated by
# OpenApiGeneratorTest in the test profile) is the single source of API documentation.
springdoc:
  api-docs:
    enabled: false

management:
  # Prod turns the notification SSE Redis fan-out ON (ADR-0093), so a notification pushed on one
  # backend replica reaches a user connected to another. The Redis health indicator is re-enabled
  # for monitoring visibility of an outage; Redis stays OUT of the readiness group (base config), so
  # a Redis blip surfaces in the root health aggregate + metrics without flipping the container
  # unhealthy (ADR-0084).
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

app:
  notifications:
    redis-fanout:
      enabled: ${APP_NOTIFICATIONS_REDIS_FANOUT_ENABLED:true}
  logging:
    # Enables the JSON/LogstashEncoder appender defined in logback-spring.xml for the prod profile.
    structured-enabled: true
  rate-limit:
    # Audit finding H-8: behind nginx-proxy-manager the backend's immediate peer is the frontend
    # container, both on the compose bridge networks. Every internal bridge is PINNED under
    # 172.28.0.0/16 (docker-compose.yml, since #974) — NOT the default Docker bridge (172.17.0.0/16).
    # Trusting the wrong range silently collapses every per-IP bucket onto the single relaying
    # container IP, degrading the per-user limiter into one shared org-wide budget — exactly the
    # 2026-07-06 multi-user mission-page outage, where all traffic was attributed to 172.28.3.2 and
    # a handful of concurrent users exhausted the shared bucket for everyone. This MUST match the
    # real compose subnet; override via APP_RATE_LIMIT_TRUSTED_PROXIES only if you re-pin the networks.
    trusted-proxies:
      - 172.28.0.0/16
  security:
    jwt:
      # REQ-SEC-024: opt-in. Fetch the JWKS from the INTERNAL Keycloak (https://keycloak:18443) so
      # backend JWT validation no longer hairpins through the public edge (NPM), where an edge or
      # public-Keycloak blip turns every authenticated request into a 5xx. Empty (default) keeps the
      # current behaviour: keys are derived from issuer-uri (the public host). When set, the key
      # fetch reuses the keycloak-trust bundle above, so the cert's SAN must carry dns:keycloak.
      # Recommended value once verified on the host:
      #   https://keycloak:18443/realms/iri/protocol/openid-connect/certs
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

# SC Wiki catalogue sync. The per-sync feature flags default to false in code
# (ScWikiProperties -- "ships dark"); enabled here so each scheduler step runs on the
# live instance and the admin sync-report log (/admin/sync-reports) gets populated.
# This generates real traffic against api.star-citizen.wiki. sync-all-items is ON (Weg 2):
# the full ~12 700-row item backfill plus the name/slug reconciliation that merges uuid-less
# UEX rows into their Wiki twins (~10-15 min per cycle at 5 req/s, vs the lighter closure mode).
# Any flag is overridable per the deployment runbook via env var, e.g.
# KRT_SCWIKI_SYNC_ALL_ITEMS=false, without a redeploy.
krt:
  scwiki:
    scheduler-enabled: true
    commodity-sync-enabled: true
    vehicle-sync-enabled: true
    item-sync-enabled: true
    blueprint-sync-enabled: true
    manufacturer-sync-enabled: true
    sync-all-items: true
    reconcile-uuidless-by-name: true
