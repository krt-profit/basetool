spring:
  datasource:
    url: jdbc:postgresql://db-backend:15432/krt_basetool
    #url: jdbc:postgresql://db-backend:15432/krt_basetool
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
      #ddl-auto: create-drop
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.profit-base.online/realms/iri}
          # NOTE: do NOT add `jwk-set-uri` here. Spring's own key must be either absent or a real
          # URL -- an empty value is not "unset": Boot binds it as PRESENT-but-empty, takes the
          # jwk-set-uri branch of the resource-server auto-configuration and fails the context with
          # `jwkSetUri cannot be empty`, so the backend never boots. The split-horizon escape hatch
          # lives under `app.security.jwt.jwk-set-uri` below, which is blank-safe by design.

# SC Wiki catalogue sync. The per-sync feature flags default to false in code
# (ScWikiProperties -- "ships dark"); enabled here so each scheduler step actually
# runs and the admin sync-report log (/admin/sync-reports) gets populated.
# sync-all-items is ON in dev (Weg 2): the full ~12 700-row backfill plus the name/slug
# reconciliation that merges uuid-less UEX rows into their Wiki twins. Prod keeps the
# default (false / closure mode) until the heavier backfill is signed off for production.
krt:
  scwiki:
    scheduler-enabled: true
    commodity-sync-enabled: true
    vehicle-sync-enabled: true
    item-sync-enabled: true
    blueprint-sync-enabled: true
    manufacturer-sync-enabled: true
    sync-all-items: true
    reconcile-uuidless-by-name: true

# Split-horizon JWKS, the dev twin of the prod knob in application-prod.yml (REQ-SEC-024).
# Dev needs it for a reason prod does not have: the Android emulator can only reach Keycloak under
# a host name the BACKEND cannot resolve. With KC_HOSTNAME pinned so the app's tokens carry
# iss=http://127.0.0.1:18080/..., the backend would have to fetch keys from 127.0.0.1 -- which
# inside its container is itself (see docker-compose.android.yml).
#
# This is `app.security.jwt.*`, NOT `spring.security.oauth2.resourceserver.jwt.*`. The two look
# interchangeable and are not: this one is read by SecurityConfig#resourceServerJwtDecoder, whose
# @ConditionalOnExpression leaves the bean absent while the value is blank, so an unset variable
# keeps Boot's issuer-location decoder exactly as before. It also routes the split-horizon case
# through the hardened decoder (keycloak-trust bundle + the full JWS algorithm set) instead of
# Boot's RS256-only `withJwkSetUri` default.
app:
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
