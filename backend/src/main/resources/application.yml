server:
  tomcat:
    relaxed-query-chars: "{,},[,]"
    relaxed-path-chars: "{,},[,]"
    accept-count: 200
    max-connections: 10000
  forward-headers-strategy: none
  max-http-request-header-size: 65536
  http2:
    enabled: true
  port: 11261
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: basetool
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,application/cbor,text/html,text/plain,text/css,application/javascript,application/xml,image/svg+xml

spring:
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 72MB
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  application:
    name: backend
  messages:
    fallback-to-system-locale: false
  mail:
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: "true"
      mail.smtp.starttls.enable: "true"
      mail.smtp.starttls.required: "true"
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          must-revalidate: true
    error:
      whitelabel:
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
      jakarta.persistence.query.timeout: ${APP_DB_QUERY_TIMEOUT_MS:30000}
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    io.github.resilience4j: INFO
    io.opentelemetry.exporter: WARN
app:
  security:
    ingest-gateway:
      client-ids: ${APP_SECURITY_INGEST_GATEWAY_CLIENT_IDS:}
    partial-role-scope:
      client-ids: ${APP_SECURITY_PARTIAL_ROLE_SCOPE_CLIENT_IDS:basetool-android}
    authorities-cache:
      ttl: ${APP_SECURITY_AUTHORITIES_CACHE_TTL:PT5M}
  logging:
    correlation-id-header: X-Correlation-Id
    correlation-id-mdc-key: correlationId
    user-id-mdc-key: userId
    slow-request-threshold-ms: 2000
    structured-enabled: false
  monitoring:
    scrape:
      username: ${MONITORING_SCRAPE_USER:}
      password: ${MONITORING_SCRAPE_PASSWORD:}
    api-clients:
      known-client-ids: ${APP_MONITORING_API_CLIENTS_KNOWN_CLIENT_IDS:basetool-frontend,basetool-android}
    business-metrics:
      enabled: true
      interval-ms: 60000
  keycloak:
    sync:
      enabled: true
      cron: ${APP_KEYCLOAK_SYNC_CRON:0 0 5 * * *}
      zone: ${APP_KEYCLOAK_SYNC_ZONE:Europe/Berlin}
      admin-url: ${KEYCLOAK_ADMIN_URL:http://keycloak:18080/auth}
      realm: ${KEYCLOAK_REALM:iri}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:backend-service}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM_ADDRESS:no-reply@profit-base.online}
    from-name: ${APP_MAIL_FROM_NAME:Profit Basetool}
    default-locale: ${APP_MAIL_DEFAULT_LOCALE:de}
  discord:
    spi-precheck:
      shared-secret: ${KRT_DISCORD_SPI_SHARED_SECRET:}
  bank:
    integrity:
      enabled: ${APP_BANK_INTEGRITY_ENABLED:true}
      interval: ${APP_BANK_INTEGRITY_INTERVAL:PT1H}
  joborder:
    integrity:
      enabled: ${APP_JOBORDER_INTEGRITY_ENABLED:true}
      interval: ${APP_JOBORDER_INTEGRITY_INTERVAL:PT1H}
  audit:
    retention:
      enabled: ${APP_AUDIT_RETENTION_ENABLED:true}
      max-age: ${APP_AUDIT_RETENTION_MAX_AGE:P730D}
      interval: ${APP_AUDIT_RETENTION_INTERVAL:PT24H}
  registrations:
    rejected-retention:
      enabled: ${APP_REGISTRATIONS_REJECTED_RETENTION_ENABLED:true}
      max-age: ${APP_REGISTRATIONS_REJECTED_RETENTION_MAX_AGE:P90D}
      interval: ${APP_REGISTRATIONS_REJECTED_RETENTION_INTERVAL:PT24H}
  notifications:
    retention:
      enabled: ${APP_NOTIFICATIONS_RETENTION_ENABLED:true}
      max-age: ${APP_NOTIFICATIONS_RETENTION_MAX_AGE:P90D}
      unread-max-age: ${APP_NOTIFICATIONS_RETENTION_UNREAD_MAX_AGE:P180D}
      interval: ${APP_NOTIFICATIONS_RETENTION_INTERVAL:PT24H}
    redis-fanout:
      enabled: ${APP_NOTIFICATIONS_REDIS_FANOUT_ENABLED:false}
      channel: ${APP_NOTIFICATIONS_REDIS_FANOUT_CHANNEL:basetool:notify:published}
  live-sync:
    sse:
      heartbeat-interval: ${APP_LIVE_SYNC_SSE_HEARTBEAT_INTERVAL:PT20S}
    redis-fanout:
      enabled: ${APP_LIVE_SYNC_REDIS_FANOUT_ENABLED:false}
      channel: ${APP_LIVE_SYNC_REDIS_FANOUT_CHANNEL:basetool:livesync:changed}
  android:
    minimum-version-code: ${APP_ANDROID_MINIMUM_VERSION_CODE:0}
    latest-version-code: ${APP_ANDROID_LATEST_VERSION_CODE:0}
    releases-url: ${APP_ANDROID_RELEASES_URL:https://github.com/krt-profit/basetool-android/releases/latest}
  default-blueprints:
    provisioning:
      enabled: ${APP_DEFAULT_BLUEPRINTS_PROVISIONING_ENABLED:true}
      interval: ${APP_DEFAULT_BLUEPRINTS_PROVISIONING_INTERVAL:PT1H}
  rate-limit:
    enabled: true
    paths:
      - /api/**
    capacity: 5000
    refillTokens: 5000
    refillPeriod: 1m
    subject:
      enabled: true
      capacity: 120
      refillTokens: 120
      refillPeriod: 1m
      export:
        enabled: true
        capacity: ${APP_RATE_LIMIT_SUBJECT_EXPORT_CAPACITY:10}
        refillTokens: ${APP_RATE_LIMIT_SUBJECT_EXPORT_CAPACITY:10}
        refillPeriod: ${APP_RATE_LIMIT_SUBJECT_EXPORT_REFILL_PERIOD:1m}
    rules:
      - name: mission-create
        methods: [POST]
        paths:
          - /api/v1/missions
        capacity: 100
        refillTokens: 100
        refillPeriod: 1m
      - name: order-create
        methods: [POST]
        paths:
          - /api/v1/orders
          - /api/v1/orders/items
        capacity: 100
        refillTokens: 100
        refillPeriod: 1m
      - name: finance-entry-create
        methods: [POST]
        paths:
          - /api/v1/finance-entries
        capacity: 200
        refillTokens: 200
        refillPeriod: 1m
      - name: participant-mutations
        methods: [POST, PUT, DELETE]
        paths:
          - /api/v1/missions/*/participants
          - /api/v1/missions/*/participants/**
        capacity: 500
        refillTokens: 500
        refillPeriod: 1m

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, loggers
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, diskSpace, ssl
  metrics:
    tags:
      application: basetool-backend
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.server.requests.active]": false
        "[basetool.scheduled.job.duration]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
        "[basetool.scheduled.job.duration]": 10ms
      maximum-expected-value:
        "[http.server.requests]": 10s
        "[basetool.scheduled.job.duration]": 600s
  tracing:
    export:
      otlp:
        enabled: ${MONITORING_TRACING_ENABLED:false}
    sampling:
      probability: ${MONITORING_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    enabled: ${MONITORING_TRACING_ENABLED:false}
    resource-attributes:
      "service.name": basetool-backend
    tracing:
      export:
        otlp:
          endpoint: ${MONITORING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
