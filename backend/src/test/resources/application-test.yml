server:
  ssl:
    enabled: false
    key-store-password: test-keystore-password
spring:
  datasource:
    url: jdbc:tc:postgresql:18-alpine:///testdb?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.example.com/realms/test

krt:
  uex:
    scheduler-enabled: false
  scwiki:
    scheduler-enabled: false
    commodity-sync-enabled: false

app:
  cors:
    allowed-origin-patterns: http://localhost:8080
  keycloak:
    sync:
      enabled: false
      admin-url: http://keycloak.example.com
      realm: test
      client-id: test-client
      client-secret: test-secret
  bank:
    integrity:
      enabled: false
  joborder:
    integrity:
      enabled: false
  audit:
    retention:
      enabled: false
  registrations:
    rejected-retention:
      enabled: false
  notifications:
    retention:
      enabled: false
  default-blueprints:
    provisioning:
      enabled: false
  monitoring:
    business-metrics:
      enabled: false

management:
  health:
    keycloak:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState, db, diskSpace

springdoc:
  writer-with-order-by-keys: true
