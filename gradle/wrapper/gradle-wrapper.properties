distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
# 3, not 0. The wrapper's distribution download is the FIRST network call of every Docker image
# build and every CI job, and at 0 a single TCP reset during the TLS handshake fails the whole
# build - the log says "Attempt 1/1 failed. Reason: Connection reset by peer". That killed the
# backend/linux/amd64 release image on 2026-09-05 (run 33967209546) while the arm64 build of the
# same commit passed, which is the signature of a flake rather than a defect. The 0 was not a
# decision: it arrived with the bulk dependency update #735 on 2026-06-20 and left the retry the
# wrapper already implements switched off. `retryBackOffMs` below is what spaces the attempts.
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
