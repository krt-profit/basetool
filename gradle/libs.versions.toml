# Build-classpath overrides, NOT dependencies of any module: each forces a transitive of a Gradle
# plugin on the buildscript classpath that loads it (constraint blocks in the named build scripts).
# Nothing here ships or reaches an SBOM; they exist because the dependency-submission workflow puts
# every build classpath into GitHub's dependency graph, and there Dependabot matched all three.
#   * handlebars -- openapi-generator 7.25.0 (the frontend's `org.openapi.generator` plugin) pins
#     handlebars 4.3.1, which carries CVE-2026-55760 (FileTemplateLoader path traversal, CVSS 7.5,
#     Dependabot alert #15), fixed in 4.5.2; 4.5.5 is the newest patch on that line. `handlebars-
#     jackson2` stays at 4.3.1 -- its last release; `handlebars-jackson` succeeds it from 4.4.0 --
#     and carries no advisory. 7.25.0 is the newest openapi-generator and upstream
#     master still pins 4.3.1, so no plugin bump fixes it. The build generates with the default
#     Mustache engine and never loads a Handlebars template. Drop it once the catalog's
#     `openapiGenerator` brings handlebars >= 4.5.2 itself.
#   * plexusUtils -- licensee 1.14.1 (the newest) -> maven-model-builder 3.9.11 pins plexus-utils
#     3.6.0, which carries CVE-2025-67030 (Expand.extractFile directory traversal, Dependabot alert
#     #13), fixed in 3.6.1. 3.6.1 is what the CycloneDX plugin, loaded on the same root classpath,
#     already asks for, so the root classpath -- which the subprojects' classloaders delegate to
#     first -- resolves one plexus-utils. Drop it once `licensee` brings plexus-utils >= 3.6.1
#     itself. (Corrected 2026-09-25: this said the subprojects' classpaths resolved 3.6.1 through
#     CycloneDX and Spring Boot; since #2019 loaded CycloneDX at the root, they hold no plexus-utils.)
#   * commonsLang3 -- the Spring Boot plugin (`springBoot` 4.1.1, loaded by the backend and ingest
#     build scripts) -> spring-boot-buildpack-platform -> commons-compress 1.27.1 asks for
#     commons-lang3 3.16.0, which carries CVE-2025-48924 (GHSA-j288-q9x7-2f5v, uncontrolled recursion
#     in ClassUtils.getClass on long inputs, Dependabot alert #19), fixed in 3.18.0. Until #2019 put
#     the CycloneDX and SpotBugs plugins on the root classpath, they sat on those two classpaths too
#     and raised it; since then nothing does. At run time the jar was never loaded -- the root
#     classpath carries 3.20.0 (OWASP, CycloneDX) and the subprojects' classloaders delegate to it
#     first -- so this only makes the resolved graph agree with what runs. 3.20.0 is what every other
#     build classpath already resolves. Drop it once `springBoot` brings commons-lang3 >= 3.18.0
#     itself (commons-compress 1.28.0 asks for 3.18.0).
# refreshVersions will offer a major for two of these five, and neither is a drop-in: `protobuf3`
# 4.x leaves the 3.x line grpc-protobuf 1.65 was built against, and `plexusUtils` 4.x moved the
# `org.codehaus.plexus.util.xml` classes maven-model 3.9 needs into a separate `plexus-xml` artifact
# (the Android app took 4.1.0 without it on 2026-09-04 and every Gradle invocation died with
# NoClassDefFoundError). A floor only has to clear the advisory; stay on the lines above.
handlebars = "4.5.5"
plexusUtils = "3.6.1"
commonsLang3 = "3.20.0"

