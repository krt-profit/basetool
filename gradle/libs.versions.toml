## Generated by $ ./gradlew refreshVersionsCatalog

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
# Build-tooling plugins, consolidated here from the per-module build scripts so the single source of
# truth lives in this catalog and `./gradlew refreshVersions` surfaces updates for them too.
spotbugs-base = { id = "com.github.spotbugs-base", version.ref = "spotbugs" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencycheck" }

[versions]

springBoot = "4.1.1"
##      ⬆ = "4.2.0-M1"
springDependencyManagement = "1.1.7"
cyclonedx = "3.4.1"
testcontainers = "2.0.5"
# 13.0.0 (2026-07-28): the three upstream breaking changes are all no-ops here — min Java moved
# 17 -> 21 (toolchain is 25), the `createSchema.sql` -> `beforeCreateSchema.sql` callback rename
# hits nothing (db/ holds only migration/, no callbacks), and the `initSQL` -> `afterConnect.sql`
# replacement hits nothing (no profile sets it; all three set only enabled + locations). Note the
# Redgate release-notes page lists NO breaking changes for 13.0.0 — they are documented only in the
# "Looking forward to Flyway V13" blog post, so do not clear a future major from that page alone.
flyway = "13.4.0"
# Held at 1.6.3 on purpose: the only newer builds refreshVersions sees are 1.7.0 BETAS. The markers
# below are left in place so the next sweep does not have to re-derive that — clear them when 1.7.0
# goes final, not before.
mapstruct = "1.6.3"
##     ⬆ = "1.7.0.Beta1"
##     ⬆ = "1.7.0.Beta2"
# Stay on 1.6.x stable; only the 1.7.0 betas (Beta1, Beta2) are available upstream as
# of 2026-06 — no 1.7.0 final yet.
resilience4j = "2.4.0"
bucket4j = "8.19.0"
semver4j = "6.0.0"
logstashLogback = "9.0"
archunit = "1.5.0"
springdocOpenapi = "3.1.0"
okhttp3 = "5.5.0"
playwright = "1.62.0"
axeCorePlaywright = "4.13.0"
jetbrainsAnnotations = "26.1.0"
lombokMapstructBinding = "0.2.0"
openpdf = "3.0.5"
commonmark = "0.30.0"
# Build-tooling versions, consolidated from the module build scripts (see the [plugins] note above).
# google-java-format, checkstyle and the Pitest JUnit5 plugin are wired by version string rather than
# as plugins; the matching version-tracking [libraries] entries below let refreshVersions check them.
# `node` pins the Node.js runtime downloaded by the node-gradle plugin and is not a Maven artifact, so
# refreshVersions cannot track it — bump it by hand against the active Node LTS line.
spotbugs = "6.5.11"
pitest = "1.19.0"
pitestJunit5 = "1.2.3"
nodeGradle = "7.1.0"
spotless = "8.10.1"
# 13.0.0 (2026-07): the single breaking change is a no-op here — the plugin's default report
# directory moved to `build/reports/dependency-check` to stop clashing with other reports, and the
# root build script already sets exactly that path explicitly. The other `!`-flagged item (dropping
# Nexus V2 search) hits nothing: no module configures a Nexus analyzer. `failBuildOnCVSS`,
# `suppressionFile` and the whole `nvd.*` block are unchanged.
owaspDependencycheck = "13.0.0"
findsecbugs = "1.14.0"
checkstyle = "13.9.0"
googleJavaFormat = "1.36.1"
node = "24.19.0"
# Keycloak server SPI artifacts for the keycloak-spi provider module (Discord
# federation + first-login gate, epic #720). Pin to the highest 26.7.x patch — the
# floating `quay.io/keycloak/keycloak:26.7` runtime tag resolves to it; SPI APIs are
# stable across a minor, so an exact match avoids any load-time surprises.
keycloak = "26.7.3"
# JUnit pinned explicitly for the keycloak-spi module only — it has no Spring Boot
# dependency-management to supply a JUnit version, unlike backend/frontend. The old lockstep
# with Boot's managed JUnit is gone: 000b8be16 (2026-08-17) took 6.1.3 here while Boot still
# manages 6.0.3 for backend/frontend (unchanged in 4.1.1), so the repo runs two JUnit lines.
# That is harmless — the SPI module shares no classpath with the other two — but the comment
# claiming lockstep was stale, hence this note. Restore the lockstep, or drop this pin
# entirely, once the Boot BOM moves to 6.1.x.
junit = "6.1.3"

