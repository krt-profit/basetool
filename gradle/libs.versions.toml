# Keycloak server SPI artifacts for the keycloak-spi provider module (Discord
# federation + first-login gate, epic #720). Pin to the highest 26.7.x patch — the
# floating `quay.io/keycloak/keycloak:26.7` runtime tag resolves to it; SPI APIs are
# stable across a minor, so an exact match avoids any load-time surprises.
keycloak = "26.7.4"
# JUnit pinned explicitly for the keycloak-spi module only — it has no Spring Boot
# dependency-management to supply a JUnit version, unlike backend/frontend. The old lockstep
# with Boot's managed JUnit is gone: 000b8be16 (2026-08-17) took 6.1.3 here while Boot still
# manages 6.0.3 for backend/frontend (unchanged in 4.1.1), so the repo runs two JUnit lines.
# That is harmless — the SPI module shares no classpath with the other two — but the comment
# claiming lockstep was stale, hence this note. Restore the lockstep, or drop this pin
# entirely, once the Boot BOM moves to 6.1.x.
junit = "6.1.3"
# Lombok for the keycloak-spi module ONLY. Every other module gets Lombok from Spring Boot's
# dependency management, which manages 1.18.46 under Boot 4.1.1 -- keycloak-spi is deliberately not
# a Spring Boot module and has no BOM to supply one, exactly as with `junit` above. Keep this number
# EQUAL to the Boot-managed version: two Lombok versions in one repo means two readings of
# `lombok.config`, which is a single shared file at the repo root. Verify after a Boot bump with
# `./gradlew :backend:dependencyInsight --configuration compileClasspath --dependency org.projectlombok:lombok`.
# refreshVersions proposes **1.18.48** (published 2026-09-01) and it is REFUSED for that equality
# rule alone, not for anything in the release: Boot 4.1.1 still manages 1.18.46, re-verified with the
# command above on 2026-09-21. Taking it would put 1.18.48 on keycloak-spi and 1.18.46 on every other
# module, which is the two-readings-of-`lombok.config` split this pin exists to prevent. The marker
# below stays so the next sweep does not re-derive this -- clear it together with the Boot bump that
# moves the managed version, not before.
lombok = "1.18.46"
##  ⬆ = "1.18.48"
# Mockito for the keycloak-spi module ONLY, for the same reason as `junit` and `lombok` above: no
# Spring Boot dependency management to supply a version. It sat hardcoded in
# `keycloak-spi/build.gradle.kts` until 2026-09-21, where `./gradlew refreshVersions` could not see
# it and reported it as a dependency "that might have hardcoded versions" on every sweep. Moved here
# at the same version, so the next sweep annotates it like everything else.
mockito = "5.23.0"

