# 8.20.0 (2026-09-17): three of its commits touch `bucket4j_jdk17-core` and none of them is
# reachable from here, because both consumers build LOCAL buckets only -- `Bucket.builder()` with
# `Bandwidth`, drained through `tryConsume` / `tryConsumeAndReturnRemaining`, with no `ProxyManager`,
# no `asBlocking()` and no request timeout anywhere. The advertised stack-trace suppression is on
# exactly two exceptions: `BucketExceptions.maxRetriesExceeded`, thrown when a DISTRIBUTED CAS retry
# strategy gives up, and `TimeoutException`, thrown when a blocking or async consume's request
# timeout expires. The `IllegalArgumentException`s a bad `basetool.rate-limit.*` value raises while
# building a bandwidth at startup are untouched and keep their stack traces -- that was the one thing
# worth checking, because a startup failure without a trace is much harder to place. The other two
# core commits are an argument check in `AbstractProxyManagerBuilder` and a new, additive
# `RetryStrategies.exponentialBackoffWithJitter`, both distributed-only. Everything else in the
# release lives in modules this repo does not depend on -- Lettuce/Redis sentinel support, a MySQL
# gap-lock deadlock fix, Gemfire/Geode support -- and the Postgres, MariaDB and jackson-databind
# bumps are in the parent POM and its tests: `bucket4j_jdk17-core` declares no dependencies at all,
# so nothing can arrive here transitively.
bucket4j = "8.20.0"
semver4j = "6.0.0"
logstashLogback = "9.0"
archunit = "1.5.0"
