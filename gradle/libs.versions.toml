cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
# Build-tooling plugins, consolidated here from the per-module build scripts so the single source of
# truth lives in this catalog and `./gradlew refreshVersions` surfaces updates for them too.
spotbugs-base = { id = "com.github.spotbugs-base", version.ref = "spotbugs" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencycheck" }
# Third-party licence gate + report for every shipped JVM module (REQ-UI-021, ADR-0197). Held at the
# SAME version the Android app runs, deliberately: both halves of the Basetool answer the same
# licence question with the same tool, so a reading that differs between them is a version skew.
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
# Generates the frontend's wire models from the committed `openapi.json` (ADR-0161 §8.2). Held at
# the SAME version the Android app's `core/contract` runs, deliberately: the two generate from one
# document, and a version skew between them would produce two different readings of one contract --
# which is the class of drift this whole item exists to remove.
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }

[versions]

