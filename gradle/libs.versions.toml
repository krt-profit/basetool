testcontainers = "2.0.5"
# 13.0.0 (2026-07-28): the three upstream breaking changes are all no-ops here — min Java moved
# 17 -> 21 (toolchain is 25), the `createSchema.sql` -> `beforeCreateSchema.sql` callback rename
# hits nothing (db/ holds only migration/, no callbacks), and the `initSQL` -> `afterConnect.sql`
# replacement hits nothing (no profile sets it; all three set only enabled + locations). Note the
# Redgate release-notes page lists NO breaking changes for 13.0.0 — they are documented only in the
# "Looking forward to Flyway V13" blog post, so do not clear a future major from that page alone.
# 13.5.0 (2026-09-03): `jackson-databind` became an OPTIONAL dependency and JSON support moved
# into a new `flyway-core-utilities` module. Still a no-op here, but NOT for the reason this
# comment gave when the bump was taken -- corrected 2026-09-14 against the resolved classpath.
# It claimed Spring Boot's web starter supplies `jackson-databind` regardless; under Boot 4 that
# starter supplies Jackson **3** (`tools.jackson.core`), a different artifact in a different
# package, which cannot satisfy a Flyway built against Jackson 2. `flyway-core` now pulls only
# `jackson-annotations`, and every `com.fasterxml.jackson.core:jackson-databind` on the backend
# runtime classpath arrives under `springdoc-openapi-starter-webmvc-api` instead. What actually
# makes this safe is the other half of the original note: nothing here asks Flyway for JSON -- no
# `flyway.toml`, no JSON-configured callbacks, and all three profiles set only `enabled` +
# `locations`. Do not re-derive the safety from the classpath; derive it from that.
# The rest of the release is debug-log and dry-run polish plus Jackson and MariaDB-driver bumps,
# with no documented bug fixes.
# 13.6.0 (2026-09-10): nothing in it reaches this build, and it is taken to keep the drift small
# rather than for anything it fixes. The whole release is surface this repo does not use -- the
# dry-run report, `flyway check` rule profiles, `flyway deploy` publishing to Flyway Pipelines, the
# `flyway auth` credential cache and the Docker image's move to a JRE 25 base, plus DB2, SQL Server
# and Databricks fixes and Snowflake-Postgres recognition on databases it does not target.
# `flyway-core` and `flyway-database-postgresql` carry no behaviour change, no deprecation and no
# breaking change; verified by running the migration tests, not on the notes alone.
# 13.7.0 (2026-09-15): the same shape as 13.6.0 -- every item in it is surface this repo does not
# use, and it is taken to keep the drift small rather than for anything it fixes. Both new features
# are Flyway MCP: a Test Migrate tool running pending scripts against a shadow database, and a
# 3-sided diff that checkpoints the schema model before updating. The bug fixes are drift results
# not reaching Flyway Pipelines when `publishResult` was off, dry runs not publishing migrate events
# as deployments, long configuration values breaking the debug configuration table's layout, and
# `generate`d migration filenames switching from the local timezone to UTC -- this repo hand-numbers
# its own `V<n>__*.sql` files (see db/migration/README.md) and never runs `generate`. The Snowflake
# fix is for legacy driver classes on a database this project does not target, the couchbase and
# databricks-jdbc bumps are for drivers not on this classpath, RgCompare is the schema-comparison
# engine behind `flyway check`, and "remove unnecessary executable files from JRE package" is the
# CLI distribution's bundled JRE, not a Maven artifact at all.
flyway = "13.7.0"
# Held at 1.6.3 on purpose: the only newer builds refreshVersions sees are 1.7.0 BETAS. The markers
# below are left in place so the next sweep does not have to re-derive that — clear them when 1.7.0
# goes final, not before.
mapstruct = "1.6.3"
##     ⬆ = "1.7.0.Beta1"
##     ⬆ = "1.7.0.Beta2"
# Stay on 1.6.x stable; only the 1.7.0 betas (Beta1, Beta2) are available upstream as
# of 2026-06 — no 1.7.0 final yet.
resilience4j = "2.4.0"
# 8.20.0 (2026-09-17): three of its commits touch `bucket4j_jdk17-core` and none of them is
# reachable from here, because both consumers build LOCAL buckets only -- `Bucket.builder()` with
# `Bandwidth`, drained through `tryConsume` / `tryConsumeAndReturnRemaining`, with no `ProxyManager`,
# no `asBlocking()` and no request timeout anywhere. The advertised stack-trace suppression is on
# exactly two exceptions: `BucketExceptions.maxRetriesExceeded`, thrown when a DISTRIBUTED CAS retry
# strategy gives up, and `TimeoutException`, thrown when a blocking or async consume's request
# timeout expires. The `IllegalArgumentException`s a bad `basetool.rate-limit.*` value raises while
# building a bandwidth at startup are untouched and keep their stack traces -- that was the one thing
# worth checking, because a startup failure without a trace is much harder to place. The other two
# core commits are an argument check in `AbstractProxyManagerBuilder` and a new, additive
# `RetryStrategies.exponentialBackoffWithJitter`, both distributed-only. Everything else in the
# release lives in modules this repo does not depend on -- Lettuce/Redis sentinel support, a MySQL
# gap-lock deadlock fix, Gemfire/Geode support -- and the Postgres, MariaDB and jackson-databind
# bumps are in the parent POM and its tests: `bucket4j_jdk17-core` declares no dependencies at all,
# so nothing can arrive here transitively.
bucket4j = "8.20.0"
semver4j = "6.0.0"
logstashLogback = "9.0"
archunit = "1.5.0"
# 3.1.1 is a SECURITY release (eight advisories). Two of them can reach this deployment and are
# why it is taken rather than deferred: the per-locale OpenAPI cache was unbounded, so
# `Accept-Language` could grow it without limit (now capped by `springdoc.cache.max-entries`,
# default 100), and a ThreadLocal leaked headers between concurrent requests. The rest cannot
# reach it: the MCP advisories need the AI module and the bundled-DOMPurify XSS needs Swagger
# UI -- this project uses the `-api` starter, which ships neither, with `api-docs.enabled:
# false` in prod on top.
springdocOpenapi = "3.1.1"
okhttp3 = "5.5.0"
# 1.63.0 (2026-09-14): its two behaviour changes reach nothing here. `frameLocator()` called without
# a selector now searches the whole frame subtree instead of requiring the iframe to be located
# first, and `:visible` is deprecated in favour of a new `Locator.visible()` -- neither `frameLocator`
# nor `:visible` appears anywhere in the `e2e` source set, which was checked rather than assumed.
# The release documents no breaking changes and no other deprecation; the rest is additive (aria and
# screen snapshots in traces, `httpCredentials` as a list, an `opfs` storage-state option,
# `onDialogClosed`, the `--no-remove` and `--http-credentials` CLI flags) or packaging: the public
# API gains JSpecify `@NullMarked` and with it a compile dependency on `org.jspecify:jspecify`, which
# changes the resolved `e2e` classpath by nothing -- 1.0.1 was already on it through
# `micrometer-observation`, and nothing in this repo runs NullAway, so the annotations are inert
# here. It also gains an `Automatic-Module-Name` this non-modular build ignores. Dropping Ubuntu
# 20.04 is moot -- CI runs `ubuntu-latest`. The bundled browsers move to Chromium 153 / Firefox 155 /
# WebKit 26.6, which `playwrightInstall` re-downloads on the next run because e2e.yml keys its
# browser cache on the hash of THIS file. `axe-core:playwright` still asks for 1.60.0 and is still
# resolved up to whatever is pinned here, exactly as it was at 1.62.0.
playwright = "1.63.0"
axeCorePlaywright = "4.13.0"
jetbrainsAnnotations = "26.1.0"
lombokMapstructBinding = "0.2.0"
openpdf = "3.0.5"
commonmark = "0.30.0"
