# 13.0.0 (2026-07-28): the three upstream breaking changes are all no-ops here — min Java moved
# 17 -> 21 (toolchain is 25), the `createSchema.sql` -> `beforeCreateSchema.sql` callback rename
# hits nothing (db/ holds only migration/, no callbacks), and the `initSQL` -> `afterConnect.sql`
# replacement hits nothing (no profile sets it; all three set only enabled + locations). Note the
# Redgate release-notes page lists NO breaking changes for 13.0.0 — they are documented only in the
# "Looking forward to Flyway V13" blog post, so do not clear a future major from that page alone.
# 13.5.0 (2026-09-03): `jackson-databind` became an OPTIONAL dependency and JSON support moved
# into a new `flyway-core-utilities` module. Still a no-op here, but NOT for the reason this
# comment gave when the bump was taken -- corrected 2026-09-14 against the resolved classpath.
# It claimed Spring Boot's web starter supplies `jackson-databind` regardless; under Boot 4 that
# starter supplies Jackson **3** (`tools.jackson.core`), a different artifact in a different
# package, which cannot satisfy a Flyway built against Jackson 2. `flyway-core` now pulls only
# `jackson-annotations`, and every `com.fasterxml.jackson.core:jackson-databind` on the backend
# runtime classpath arrives under `springdoc-openapi-starter-webmvc-api` instead. What actually
# makes this safe is the other half of the original note: nothing here asks Flyway for JSON -- no
# `flyway.toml`, no JSON-configured callbacks, and all three profiles set only `enabled` +
# `locations`. Do not re-derive the safety from the classpath; derive it from that.
# The rest of the release is debug-log and dry-run polish plus Jackson and MariaDB-driver bumps,
# with no documented bug fixes.
# 13.6.0 (2026-09-10): nothing in it reaches this build, and it is taken to keep the drift small
# rather than for anything it fixes. The whole release is surface this repo does not use -- the
# dry-run report, `flyway check` rule profiles, `flyway deploy` publishing to Flyway Pipelines, the
# `flyway auth` credential cache and the Docker image's move to a JRE 25 base, plus DB2, SQL Server
# and Databricks fixes and Snowflake-Postgres recognition on databases it does not target.
# `flyway-core` and `flyway-database-postgresql` carry no behaviour change, no deprecation and no
# breaking change; verified by running the migration tests, not on the notes alone.
# 13.7.0 (2026-09-15): the same shape as 13.6.0 -- every item in it is surface this repo does not
# use, and it is taken to keep the drift small rather than for anything it fixes. Both new features
# are Flyway MCP: a Test Migrate tool running pending scripts against a shadow database, and a
# 3-sided diff that checkpoints the schema model before updating. The bug fixes are drift results
# not reaching Flyway Pipelines when `publishResult` was off, dry runs not publishing migrate events
# as deployments, long configuration values breaking the debug configuration table's layout, and
# `generate`d migration filenames switching from the local timezone to UTC -- this repo hand-numbers
# its own `V<n>__*.sql` files (see db/migration/README.md) and never runs `generate`. The Snowflake
# fix is for legacy driver classes on a database this project does not target, the couchbase and
# databricks-jdbc bumps are for drivers not on this classpath, RgCompare is the schema-comparison
# engine behind `flyway check`, and "remove unnecessary executable files from JRE package" is the
# CLI distribution's bundled JRE, not a Maven artifact at all.
flyway = "13.7.0"
