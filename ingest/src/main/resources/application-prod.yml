spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  ssl:
    bundle:
      jks:
        backend-trust:
          truststore:
            location: ${INTERNAL_TLS_TRUSTSTORE:${SERVER_SSL_KEY_STORE:classpath:keystore.p12}}
            password: ${INTERNAL_TLS_TRUSTSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD}}
            type: PKCS12
        keycloak-trust:
          truststore:
            location: ${INTERNAL_TLS_TRUSTSTORE:${SERVER_SSL_KEY_STORE:classpath:keystore.p12}}
            password: ${INTERNAL_TLS_TRUSTSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD}}
            type: PKCS12

springdoc:
  api-docs:
    enabled: false

management:
  server:
    port: 11272
    ssl:
      enabled: true
      key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
      key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
      key-store-type: PKCS12
      key-alias: basetool
  endpoint:
    loggers:
      access: read-only

app:
  ingest:
    backend-base-url: ${BACKEND_URL:https://backend:11261}
    frontend-base-url: ${FRONTEND_URL}
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
